<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t01f1 d01f1" role="img" viewBox="0 0 800 500"><title id="t01f1">玫瑰痤疮四种表现与对应处理思路</title><desc id="d01f1">潮红、持续红斑、丘疹脓疱、鼻赘与眼型，各有不同处理路径</desc><defs><linearGradient id="bg01f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh01f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg01f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh01f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 01</text><text x="56" y="90" class="title">玫瑰痤疮分型 红从哪里来</text><text x="56" y="116" class="kicker">不同表现对应不同处理思路，不是一束光解决所有</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">主要累及面中部</text><rect width="335" height="92" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><rect width="335" height="26" x="56" y="174" fill="#7A8B6F" rx="10"/><rect width="335" height="10" x="56" y="190" fill="#7A8B6F"/><text x="72" y="192" class="tag">阵发潮红型</text><text x="72" y="222" class="body">遇热 情绪 辛辣后短暂发红</text><text x="72" y="246" class="small">识别并减少触发 防晒减刺激</text><rect width="335" height="92" x="409" y="174" fill="#f0f5ef" stroke="#C9A876" stroke-width="1.4" rx="10"/><rect width="335" height="26" x="409" y="174" fill="#C9A876" rx="10"/><rect width="335" height="10" x="409" y="190" fill="#C9A876"/><text x="425" y="192" class="tag">持续红斑型</text><text x="425" y="222" class="body">面中固定红斑 血管扩张</text><text x="425" y="246" class="small">外用药控红 光电针对血管</text><rect width="335" height="92" x="56" y="282" fill="#fff8ee" stroke="#B5654A" stroke-width="1.4" rx="10"/><rect width="335" height="26" x="56" y="282" fill="#B5654A" rx="10"/><rect width="335" height="10" x="56" y="298" fill="#B5654A"/><text x="72" y="300" class="tag">丘疹脓疱型</text><text x="72" y="330" class="body">红丘疹 脓疱 与痤疮鉴别</text><text x="72" y="354" class="small">壬二酸 甲硝唑 必要时口服</text><rect width="335" height="92" x="409" y="282" fill="#fdf1ee" stroke="#8a3f2b" stroke-width="1.6" rx="10"/><rect width="335" height="26" x="409" y="282" fill="#8a3f2b" rx="10"/><rect width="335" height="10" x="409" y="298" fill="#8a3f2b"/><text x="425" y="300" class="tag">鼻赘与眼型</text><text x="425" y="330" class="body">鼻部增厚 眼干畏光睑缘炎</text><text x="425" y="354" class="small">眼型需眼科联合评估</text><rect width="688" height="36" x="56" y="390" fill="#eef4ee" rx="10"/><text x="400" y="413" class="quote" text-anchor="middle">不是角质层薄四个字能解释，需要可维持的管理</text><text x="56" y="446" class="footer">医学教育示意 · 眼痛畏光视物模糊需尽快看眼科 · 鼻部单侧破溃要就医</text><text x="56" y="462" class="footer">具体分型与方案需皮肤科面诊确定</text></svg>