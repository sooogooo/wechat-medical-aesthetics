<svg xmlns="http://www.w3.org/2000/svg" aria-label="庸俗型的形成机制" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">庸俗型是被这几股力量推出来的</text><rect width="140" height="190" x="30" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="100" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">商业推动</text><text x="100" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;全套套餐&quot;</text><text x="100" y="136" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">利润导向</text><text x="100" y="154" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;多做才赚&quot;</text><text x="100" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">咨询师主导</text><text x="100" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">而非医生</text><rect width="140" height="190" x="180" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="250" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">流行裹挟</text><text x="250" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">社交媒体</text><text x="250" y="136" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">种草文化</text><text x="250" y="154" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">明星示范</text><text x="250" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;大家都做&quot;</text><text x="250" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">的从众</text><rect width="140" height="190" x="330" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="400" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">信息不对称</text><text x="400" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">消费者不懂</text><text x="400" y="136" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">解剖与审美</text><text x="400" y="154" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">被营销引导</text><text x="400" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">难以分辨</text><text x="400" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">好坏方案</text><rect width="140" height="190" x="480" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="550" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">焦虑驱动</text><text x="550" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">容貌焦虑</text><text x="550" y="136" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">怕&quot;落后&quot;</text><text x="550" y="154" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">怕&quot;不够好&quot;</text><text x="550" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">急于&quot;改善&quot;</text><text x="550" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">失去审慎</text><text x="320" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">四股力量叠加，把人推向庸俗型——所以落入庸俗型，多数不是个人品味问题</text></svg>