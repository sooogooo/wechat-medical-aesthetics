<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="颞部注射层次示意">
  <rect width="640" height="280" fill="#faf84f" rx="12"/>
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">颞部注射：深部骨面相对安全</text>

  <!-- 简化侧颅示意 -->
  <ellipse cx="320" cy="150" rx="160" ry="90" fill="#f3efe8" stroke="#a8a39d"/>
  <!-- 颞部位置标注 -->
  <ellipse cx="220" cy="150" rx="40" ry="35" fill="#eef0ea" stroke="#7a8b6f" stroke-dasharray="3,2"/>
  <text x="220" y="155" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">颞部</text>

  <!-- 深部注射点（推荐） -->
  <circle cx="210" cy="160" r="7" fill="#7a8b6f"/>
  <line x1="217" y1="160" x2="280" y2="100" stroke="#7a8b6f" stroke-width="1.5"/>
  <text x="290" y="95" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">✓ 深部骨面注射</text>
  <text x="290" y="113" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">骨膜上层次，相对安全</text>

  <!-- 浅层注射点（高风险） -->
  <circle cx="230" cy="130" r="7" fill="#b5654a"/>
  <line x1="237" y1="130" x2="280" y2="195" stroke="#b5654a" stroke-width="1.5"/>
  <text x="290" y="190" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">⚠ 浅层注射风险高</text>
  <text x="290" y="208" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">颞浅静脉及其分支</text>

  <text x="320" y="262" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">颞部血管丰富，层次精准是安全的核心；图为示意</text>
</svg>