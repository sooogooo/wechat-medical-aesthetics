<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2202 desc2202" role="img" viewBox="0 0 900 620"><title id="title2202">颈部手术比面部更棘手的几点</title><desc id="desc2202">颈部成形术的疤痕位置、气道、神经、颈阔肌复发等风险要点</desc><defs><linearGradient id="bg2202" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2202" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.num{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2202)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2202)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 22</text><text x="62" y="117" class="title">颈部成形术的风险要点</text><text x="62" y="153" class="kicker">颈部解剖特殊，不能当成面部除皱的「附赠项目」</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="250" height="135" x="62" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5" rx="14"/><circle cx="100" cy="245" r="20" fill="#D55E00"/><text x="100" y="253" class="num" text-anchor="middle">1</text><text x="132" y="251" class="nodeTitle">血肿压迫气道</text><text x="82" y="288" class="body">颈部血供丰富</text><text x="82" y="312" class="body">严重血肿可压迫气道</text><text x="82" y="334" class="small">属急症，需密切监护</text><rect width="250" height="135" x="325" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="363" cy="245" r="20" fill="#D55E00"/><text x="363" y="253" class="num" text-anchor="middle">2</text><text x="395" y="251" class="nodeTitle">术后气道</text><text x="345" y="288" class="body">肿胀影响气道</text><text x="345" y="312" class="body">需术后监护</text><text x="345" y="334" class="small">类似颌面手术考虑</text><rect width="250" height="135" x="588" y="210" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="626" cy="245" r="20" fill="#E69F00"/><text x="626" y="253" class="num" text-anchor="middle">3</text><text x="658" y="251" class="nodeTitle">神经损伤</text><text x="608" y="288" class="body">面神经下颌缘支</text><text x="608" y="312" class="body">致下唇不对称</text><text x="608" y="334" class="small">感觉神经也可能受累</text><rect width="250" height="135" x="62" y="362" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="100" cy="397" r="20" fill="#E69F00"/><text x="100" y="405" class="num" text-anchor="middle">4</text><text x="132" y="403" class="nodeTitle">疤痕更显眼</text><text x="82" y="440" class="body">颏下切口位于正面</text><text x="82" y="464" class="body">颈部皮肤薄易留疤</text><text x="82" y="486" class="small">易色素沉着</text><rect width="250" height="135" x="325" y="362" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="363" cy="397" r="20" fill="#E69F00"/><text x="363" y="405" class="num" text-anchor="middle">5</text><text x="395" y="403" class="nodeTitle">条带复发</text><text x="345" y="440" class="body">单纯切皮不处理肌肉</text><text x="345" y="464" class="body">颈阔肌条带易复发</text><text x="345" y="486" class="small">需颈阔肌成形</text><rect width="250" height="135" x="588" y="362" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="626" cy="397" r="20" fill="#0072B2"/><text x="626" y="405" class="num" text-anchor="middle">6</text><text x="658" y="403" class="nodeTitle">老化更快显现</text><text x="608" y="440" class="body">颈部老化比面部快</text><text x="608" y="464" class="body">效果维持有限</text><text x="608" y="486" class="small">不能阻止继续老化</text><rect width="776" height="40" x="62" y="525" fill="#fbeae3" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">把颈部当成面部除皱「附赠项目」草率处理，可能忽略颈部特有风险</text><text x="62" y="582" class="footer">医学教育示意 · 具体风险与术式以面诊告知和属地核准为准</text></svg>