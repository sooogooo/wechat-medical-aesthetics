<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t46f2 d46f2" role="img" viewBox="0 0 800 500"><title id="t46f2">硬化性苔藓的治疗与警示信号</title><desc id="d46f2">规范外用药长期随访及需警惕癌变信号的处理框架</desc><defs><linearGradient id="bg46f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh46f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.step{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg46f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh46f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 46</text><text x="52" y="92" class="title">治疗框架与警示信号</text><text x="52" y="116" class="kicker">规范治疗 + 长期随访 + 警惕癌变信号</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">治疗三步</text><rect width="220" height="160" x="52" y="178" fill="#7A8B6F" rx="12"/><text x="162" y="204" class="step" text-anchor="middle">1 诱导缓解</text><text x="162" y="230" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">外用强效药物</text><text x="162" y="252" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">按疗程足量使用</text><text x="162" y="274" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">控制炎症与瘙痒</text><text x="162" y="316" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">由医师评估用量</text><rect width="220" height="160" x="290" y="178" fill="#5F6E54" rx="12"/><text x="400" y="204" class="step" text-anchor="middle">2 维持治疗</text><text x="400" y="230" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">逐步减频</text><text x="400" y="252" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">长期小剂量维持</text><text x="400" y="274" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">防止复发</text><text x="400" y="316" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">不可擅自停药</text><rect width="220" height="160" x="528" y="178" fill="#C9A876" rx="12"/><text x="638" y="204" class="step" text-anchor="middle">3 长期随访</text><text x="638" y="230" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">每年定期复查</text><text x="638" y="252" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">监测结构变化</text><text x="638" y="274" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">必要时活检</text><text x="638" y="316" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">警惕癌变信号</text><path stroke="#7d8e93" stroke-width="2" d="M 272 258 L 290 258"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 284 252 L 290 258 L 284 264"/><path stroke="#7d8e93" stroke-width="2" d="M 510 258 L 528 258"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 522 252 L 528 258 L 522 264"/><text x="52" y="362" class="nodeTitle">需立即复诊的警示信号</text><rect width="696" height="52" x="52" y="372" fill="#fbf0eb" stroke="#B5654A" rx="10"/><circle cx="70" cy="394" r="3" fill="#B5654A"/><text x="82" y="398" class="body">局部出现持续增厚的硬结或肿块</text><circle cx="70" cy="414" r="3" fill="#B5654A"/><text x="82" y="418" class="body">溃疡长期不愈合、新发疣状突起或反复出血</text><text x="540" y="404" fill="#B5654A" class="small">警惕鳞癌变</text><text x="540" y="420" fill="#B5654A" class="small">发生率低但需筛查</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">症状缓解不等于治愈，随访不能停</text><text x="52" y="466" class="footer">健康科普示意 · 用药与随访方案须由专科医师制定</text></svg>