<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t16f1 d16f1">
  <title id="t16f1">慢性湿疹不只是过敏</title>
  <desc id="d16f1">干燥脱屑增厚裂口反复瘙痒，治疗要修复屏障减少刺激排除接触过敏和感染</desc>
  <defs>
    <linearGradient id="bg16f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh16f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg16f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh16f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 16</text>
  <text x="56" y="90" class="title">慢性湿疹不只是过敏</text>
  <text x="56" y="116" class="kicker">四个维度共同参与，治疗需组合而非单一</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">参与的四个维度</text>

  <rect x="56" y="174" width="335" height="92" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="28" rx="12" fill="#7A8B6F"/><rect x="56" y="192" width="335" height="10" fill="#7A8B6F"/>
  <text x="72" y="193" class="tag">屏障受损</text>
  <text x="72" y="224" class="body">皮肤锁水能力下降</text>
  <text x="72" y="248" class="small">干燥脱屑 易受刺激 保湿是底盘</text>

  <rect x="409" y="174" width="335" height="92" rx="12" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="28" rx="12" fill="#C9A876"/><rect x="409" y="192" width="335" height="10" fill="#C9A876"/>
  <text x="425" y="193" class="tag">免疫炎症</text>
  <text x="425" y="224" class="body">慢性炎症反复</text>
  <text x="425" y="248" class="small">瘙痒红斑增厚 需抗炎药物</text>

  <rect x="56" y="278" width="335" height="92" rx="12" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6"/>
  <rect x="56" y="278" width="335" height="28" rx="12" fill="#8a6a3a"/><rect x="56" y="296" width="335" height="10" fill="#8a6a3a"/>
  <text x="72" y="297" class="tag">接触过敏</text>
  <text x="72" y="328" class="body">隐形刺激源持续作用</text>
  <text x="72" y="352" class="small">金属 清洁剂 化妆品 需排查</text>

  <rect x="409" y="278" width="335" height="92" rx="12" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="409" y="278" width="335" height="28" rx="12" fill="#B5654A"/><rect x="409" y="296" width="335" height="10" fill="#B5654A"/>
  <text x="425" y="297" class="tag">继发感染</text>
  <text x="425" y="328" class="body">反复抓破可合并感染</text>
  <text x="425" y="352" class="small">渗液结痂加重 需及时处理</text>

  <rect x="56" y="388" width="688" height="44" rx="10" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4"/>
  <text x="400" y="408" class="body" text-anchor="middle" font-weight="700">先确认是不是湿疹 以及是哪一类</text>
  <text x="400" y="424" class="small" text-anchor="middle">不同类型治疗思路不同 不能只靠一张照片自我诊断</text>

  <rect x="56" y="442" width="688" height="22" rx="8" fill="#eef4ee"/>
  <text x="400" y="457" class="quote" text-anchor="middle" font-size="14">复发不等于治疗失败，关键是降低发作频率和严重度</text>
  <text x="56" y="474" class="footer">医学教育示意 · 外用药要有灭火维持逻辑，乱用和不用都可能出问题</text>
</svg>
