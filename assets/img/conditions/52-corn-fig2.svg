<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t52f2 d52f2">
  <title id="t52f2">鸡眼的处理与禁忌</title>
  <desc id="d52f2">解除挤压是核心糖尿病患者禁自行贴酸需专业处理</desc>
  <defs>
    <linearGradient id="bg52f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh52f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .step { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg52f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh52f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 52</text>
  <text x="52" y="92" class="title">处理与禁忌</text>
  <text x="52" y="116" class="kicker">核心是解除挤压，而不是单纯削掉或贴酸</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <text x="52" y="162" class="nodeTitle">处理三步</text>

  <!-- 3步 -->
  <rect x="52" y="178" width="220" height="120" rx="12" fill="#7A8B6F"/>
  <text x="162" y="204" class="step" text-anchor="middle">1 解除挤压</text>
  <text x="162" y="228" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">换宽头鞋</text>
  <text x="162" y="250" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">使用趾垫、分隔圈</text>
  <text x="162" y="278" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">纠正足部畸形</text>

  <rect x="290" y="178" width="220" height="120" rx="12" fill="#5F6E54"/>
  <text x="400" y="204" class="step" text-anchor="middle">2 软化修薄</text>
  <text x="400" y="228" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">温水浸泡</text>
  <text x="400" y="250" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">由专业人员修薄</text>
  <text x="400" y="278" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">勿自削过深</text>

  <rect x="528" y="178" width="220" height="120" rx="12" fill="#C9A876"/>
  <text x="638" y="204" class="step" text-anchor="middle">3 医师评估</text>
  <text x="638" y="228" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">顽固者考虑冷冻</text>
  <text x="638" y="250" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">或手术处理</text>
  <text x="638" y="278" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">排查足部畸形</text>

  <path d="M 272 238 L 290 238" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 284 232 L 290 238 L 284 244" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 510 238 L 528 238" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 522 232 L 528 238 L 522 244" fill="none" stroke="#7d8e93" stroke-width="2"/>

  <!-- 禁忌与高危 -->
  <rect x="52" y="314" width="340" height="34" rx="8" fill="#B5654A"/>
  <text x="222" y="336" class="step" text-anchor="middle">禁忌</text>
  <rect x="52" y="352" width="340" height="64" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <circle cx="68" cy="372" r="3" fill="#B5654A"/>
  <text x="80" y="376" class="body">自行长期贴水杨酸胶布</text>
  <circle cx="68" cy="396" r="3" fill="#B5654A"/>
  <text x="80" y="400" class="body">用剪刀、刀片深削</text>

  <rect x="408" y="314" width="340" height="34" rx="8" fill="#B5654A"/>
  <text x="578" y="336" class="step" text-anchor="middle">高危人群（须就医）</text>
  <rect x="408" y="352" width="340" height="64" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <circle cx="424" cy="372" r="3" fill="#B5654A"/>
  <text x="436" y="376" class="body">糖尿病、周围血管病</text>
  <circle cx="424" cy="396" r="3" fill="#B5654A"/>
  <text x="436" y="400" class="body">感觉减退、免疫低下者</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">鸡眼是压力的产物，解除压力才不复长</text>
  <text x="52" y="466" class="footer">健康科普示意 · 糖尿病等高危足严禁自行贴酸或修削</text>
</svg>
