<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t01f2 d01f2">
  <title id="t01f2">玫瑰痤疮发作三级与护肤最小集</title>
  <desc id="t01f2">按发作轻重分级记录，配合最低可行护肤三件套</desc>
  <defs>
    <linearGradient id="bg01f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh01f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg01f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh01f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 01</text>
  <text x="56" y="90" class="title">发作分级与护肤最小集</text>
  <text x="56" y="116" class="kicker">给发作分级比笼统说烂脸更有用</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 三级发作 -->
  <text x="56" y="158" class="nodeTitle">日常发作分级</text>

  <rect x="56" y="172" width="220" height="100" rx="10" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="172" width="220" height="28" rx="10" fill="#7A8B6F"/><rect x="56" y="190" width="220" height="10" fill="#7A8B6F"/>
  <text x="166" y="191" class="tag" text-anchor="middle">轻度</text>
  <text x="166" y="226" class="body" text-anchor="middle">短暂发红</text>
  <text x="166" y="248" class="small" text-anchor="middle">很快恢复 不影响生活</text>

  <rect x="290" y="172" width="220" height="100" rx="10" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="290" y="172" width="220" height="28" rx="10" fill="#C9A876"/><rect x="290" y="190" width="220" height="10" fill="#C9A876"/>
  <text x="400" y="191" class="tag" text-anchor="middle">中度</text>
  <text x="400" y="226" class="body" text-anchor="middle">持续灼热 丘疹增多</text>
  <text x="400" y="248" class="small" text-anchor="middle">影响睡眠 主动面诊</text>

  <rect x="524" y="172" width="220" height="100" rx="10" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="524" y="172" width="220" height="28" rx="10" fill="#B5654A"/><rect x="524" y="190" width="220" height="10" fill="#B5654A"/>
  <text x="634" y="191" class="tag" text-anchor="middle">重度</text>
  <text x="634" y="226" class="body" text-anchor="middle">眼痛畏光 肿胀</text>
  <text x="634" y="248" class="small" text-anchor="middle">鼻部结构变化 立即就医</text>

  <!-- 最低可行护肤 -->
  <text x="56" y="304" class="nodeTitle">最低可行护肤三件套</text>
  <rect x="56" y="318" width="220" height="80" rx="10" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4"/>
  <text x="166" y="350" class="body" text-anchor="middle" font-weight="700">温和清洁</text>
  <text x="166" y="372" class="small" text-anchor="middle">温水 无香精氨基酸</text>

  <rect x="290" y="318" width="220" height="80" rx="10" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4"/>
  <text x="400" y="350" class="body" text-anchor="middle" font-weight="700">耐受保湿</text>
  <text x="400" y="372" class="small" text-anchor="middle">无香精 局部先试用</text>

  <rect x="524" y="318" width="220" height="80" rx="10" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4"/>
  <text x="634" y="350" class="body" text-anchor="middle" font-weight="700">广谱防晒</text>
  <text x="634" y="372" class="small" text-anchor="middle">白天必备 一次只加一个</text>

  <rect x="56" y="414" width="688" height="36" rx="10" fill="#eef4ee"/>
  <text x="400" y="437" class="quote" text-anchor="middle">护肤步骤少不是目的，能识别耐受边界才是</text>
  <text x="56" y="462" class="footer">医学教育示意 · 频繁刷酸 磨砂 酒精湿敷 自行叠加激素会让波动放大</text>
</svg>
