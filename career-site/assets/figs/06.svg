<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#c9a876" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#c9a876" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">五条入口的实况</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">按进行业的深度排布，每条都是真实路径</text><line x1="70" x2="730" y1="260" y2="260" stroke="#c9a876" stroke-width="2"/><text x="70" y="300" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">隔着玻璃</text><text x="730" y="300" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="end">全身进场</text><circle cx="130" cy="260" r="7" fill="#c9a876"/><text x="130" y="226" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="600" text-anchor="middle">平台方</text><text x="130" y="204" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">保留互联网身位</text><circle cx="275" cy="260" r="7" fill="#c9a876"/><text x="275" y="226" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="600" text-anchor="middle">上游厂商</text><text x="275" y="204" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">红利最厚正在消退</text><circle cx="415" cy="260" r="7" fill="#c9a876"/><text x="415" y="226" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="600" text-anchor="middle">医生 IP</text><text x="415" y="204" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">单点深绑·人身依附</text><circle cx="560" cy="260" r="7" fill="#c9a876"/><text x="560" y="330" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="600" text-anchor="middle">机构端</text><text x="560" y="352" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">获客手艺换入场券</text><circle cx="690" cy="260" r="7" fill="#c9a876"/><text x="690" y="330" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="600" text-anchor="middle">咨询师</text><text x="690" y="352" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">最近入口·争议最大</text><text x="400" y="408" fill="#c9a876" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">入口选择的本质，是市场采购你哪一角的选择</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">前三条保留身位，后两条全身进场</text></svg>