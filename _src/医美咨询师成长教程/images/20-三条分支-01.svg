<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t20a d20a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t20a">咨询师三条分支路线图</title><desc id="d20a">现场咨询师一至三年后三条分支：医务助理深化、医生IP与内容运营、客户经营与运营管理，年度复盘五段</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.br{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.item{font:500 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.fit{font:700 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8b6f}.main{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段5 · 20</text><text x="56" y="90" class="title">三条分支 三年后的三个方向</text><text x="56" y="116" class="kicker">不用现在拍板——三条路各&quot;试驾&quot;一个月，哪个让你忘记时间，哪个就是你的路</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="222" height="212" x="56" y="144" fill="#fff" stroke="#7A8B6F" stroke-width="1.7" rx="10"/><text x="72" y="172" class="br">分支 A · 医务助理深化</text><text x="72" y="196" class="fit">适合：对医学兴趣最浓的人</text><text x="72" y="222" class="item">· 补读医学相关学历/护理资质</text><text x="72" y="240" class="item">（报考条件按当年政策核验）</text><text x="72" y="264" class="item">· 跟诊深耕 1-2 个品类</text><text x="72" y="282" class="item">· 成为医生指定的助理</text><text x="72" y="312" class="item">代价：周期长投入大</text><text x="72" y="330" class="item">回报：职业护城河最深</text><rect width="222" height="212" x="290" y="144" fill="#fff" stroke="#C9A876" stroke-width="1.7" rx="10"/><text x="306" y="172" class="br">分支 B · 医生 IP 运营</text><text x="306" y="196" class="fit">适合：作品集写得有感觉的人</text><text x="306" y="222" class="item">· 个人科普号 → 医生内容搭档</text><text x="306" y="240" class="item">· 学剪辑、投放、评论区运营</text><text x="306" y="264" class="item">· 语料观点：可成为医生经纪人</text><text x="306" y="294" class="item">风险：内容合规是高压线</text><text x="306" y="312" class="item">平台规则常变需持续跟进</text><rect width="222" height="212" x="524" y="144" fill="#fff" stroke="#7d8ba3" stroke-width="1.7" rx="10"/><text x="540" y="172" class="br">分支 C · 运营管理</text><text x="540" y="196" class="fit">适合：爱看系统不看个案的人</text><text x="540" y="222" class="item">· 带教新人（跟诊笔记即教材）</text><text x="540" y="240" class="item">· 参与会员体系与流程设计</text><text x="540" y="264" class="item">· 学机构经营基础数据</text><text x="540" y="294" class="item">语料观点：不少经营院长</text><text x="540" y="312" class="item">正是咨询师出身</text><path fill="none" stroke="#A8A39D" stroke-width="1.6" d="M400 356 L400 372 M240 372 L560 372 M240 372 L240 384 M400 372 L400 384 M560 372 L560 384"/><path fill="none" stroke="#A8A39D" stroke-width="1.6" d="M236 378 L240 388 L244 378 M396 378 L400 388 L404 378 M556 378 L560 388 L564 378"/><rect width="400" height="34" x="200" y="390" fill="#7A8B6F" rx="10"/><text x="400" y="412" class="main" text-anchor="middle">主干道 · 现场咨询师（第 1-3 年）</text><text x="56" y="452" class="footer">年度复盘五段：数据 · 错题 TOP5 · 绝不清单年检 · 三年愿景对照 · 明年三件事</text><text x="56" y="470" class="footer">结语：在正确的车道上以可持续的速度穿过复杂路口——做时间的朋友，一路绿灯</text></svg>