<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t04a d04a">
  <title id="t04a">咨询师行为三色区</title>
  <desc id="d04a">绿灯区放心做，黄灯区医生确认后再说，红灯区绝对禁止，默认违章抓拍常开</desc>
  <defs>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .zone{font:700 14.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .zoneSub{font:500 10.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .item{font:500 11.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .no{font:700 11.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#B5654A;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect x="30" y="26" width="740" height="448" rx="10" fill="#ffffff" stroke="#e4ddd2"/>
  <text x="56" y="58" class="series">医美咨询师成长教程 · 阶段1 · 04</text>
  <text x="56" y="90" class="title">合规三色区 你每天的动作放哪格？</text>
  <text x="56" y="116" class="kicker">咨询师不是医务人员——五不边界 + 三色分区，像信号灯一样执行</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 绿灯区 -->
  <circle cx="70" cy="158" r="9" fill="#7A8B6F"/>
  <text x="88" y="152" class="zone">绿灯区 · 放心做</text>
  <text x="88" y="168" class="zoneSub">科普知识 · 流程引导 · 倾听记录</text>
  <rect x="56" y="178" width="688" height="64" rx="10" fill="#ffffff" stroke="#a9bba0" stroke-width="1.3"/>
  <text x="76" y="203" class="item">✓ 讲公开科普知识　✓ 介绍机构流程与医生出诊　✓ 倾听并记录诉求　✓ 说明价格构成与退费规则</text>
  <text x="76" y="226" class="item">✓ 提醒术前注意事项　✓ 转达医生要求　✓ 协调预约时间</text>

  <!-- 黄灯区 -->
  <circle cx="70" cy="264" r="9" fill="#C9A876"/>
  <text x="88" y="258" class="zone">黄灯区 · 医生确认后再说</text>
  <text x="88" y="274" class="zoneSub">涉及个体效果与方案的表述，一律以医生口径为准</text>
  <rect x="56" y="284" width="688" height="64" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.3"/>
  <text x="76" y="309" class="item">△ 具体项目组合建议　△ 效果预期描述（只用医生给过的区间）　△ 恢复期细节承诺</text>
  <text x="76" y="332" class="item">△ 跨项目禁忌判断（如果酸后能否做光电）　△ 维持时间回答（引用医生口径）</text>

  <!-- 红灯区 -->
  <circle cx="70" cy="370" r="9" fill="#B5654A"/>
  <text x="88" y="364" class="zone">红灯区 · 绝对禁止（五不 + 宣传红线）</text>
  <text x="88" y="380" class="zoneSub">一次就越界，可能结束职业生涯</text>
  <rect x="56" y="390" width="688" height="64" rx="10" fill="#ffffff" stroke="#d9b3a6" stroke-width="1.5"/>
  <text x="76" y="415" class="no">✕ 不诊断　✕ 不定方案　✕ 不解读检查　✕ 不承诺疗效　✕ 不替医生确认项目</text>
  <text x="76" y="438" class="no">✕ 不夸大宣传（"最好""最低价"）　✕ 不用未授权对比照　✕ 不泄露客人隐私　✕ 不诱导医美贷</text>

  <!-- 抓拍提示 -->
  <rect x="56" y="400" width="0" height="0" fill="none"/>
  <text x="56" y="466" class="footer">留痕纪律：微信记录、录音、截图在纠纷时都是证据——你发的每段话，想象客人、监管者、三年后的你同时在场</text>
</svg>
