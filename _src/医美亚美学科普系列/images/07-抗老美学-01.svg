<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="抗老美学驱动的医美项目">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">&quot;抗老&quot;驱动了多少医美项目</text>

  <circle cx="320" cy="155" r="55" fill="#c9a876"/>
  <text x="320" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">抗老</text>
  <text x="320" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">美学</text>

  <!-- 围绕的项目 -->
  <g font-family="PingFang SC,sans-serif" font-size="11">
    <ellipse cx="120" cy="90" rx="55" ry="22" fill="#eef0ea" stroke="#7a8b6f"/>
    <text x="120" y="94" text-anchor="middle" fill="#5f6e54">肉毒除皱</text>
    <line x1="170" y1="100" x2="270" y2="135" stroke="#a8a39d"/>

    <ellipse cx="500" cy="90" rx="55" ry="22" fill="#eef0ea" stroke="#7a8b6f"/>
    <text x="500" y="94" text-anchor="middle" fill="#5f6e54">填充抗衰</text>
    <line x1="450" y1="100" x2="370" y2="135" stroke="#a8a39d"/>

    <ellipse cx="100" cy="200" rx="55" ry="22" fill="#eef0ea" stroke="#7a8b6f"/>
    <text x="100" y="204" text-anchor="middle" fill="#5f6e54">光电紧肤</text>
    <line x1="150" y1="195" x2="270" y2="170" stroke="#a8a39d"/>

    <ellipse cx="520" cy="200" rx="55" ry="22" fill="#eef0ea" stroke="#7a8b6f"/>
    <text x="520" y="204" text-anchor="middle" fill="#5f6e54">线雕提升</text>
    <line x1="470" y1="195" x2="370" y2="170" stroke="#a8a39d"/>

    <ellipse cx="320" cy="245" rx="55" ry="22" fill="#eef0ea" stroke="#7a8b6f"/>
    <text x="320" y="249" text-anchor="middle" fill="#5f6e54">拉皮手术</text>
    <line x1="320" y1="223" x2="320" y2="210" stroke="#a8a39d"/>
  </g>

  <text x="320" y="272" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">绝大多数医美项目，都直接或间接服务于&quot;抗老&quot;</text>
</svg>