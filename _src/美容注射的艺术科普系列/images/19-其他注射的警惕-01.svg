<svg xmlns="http://www.w3.org/2000/svg" aria-label="几类高风险其他注射" role="img" viewBox="0 0 640 340"><rect width="640" height="340" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">这些注射，要格外警惕</text><rect width="185" height="250" x="30" y="55" fill="#f7ece6" stroke="#b5654a" rx="8"/><rect width="185" height="34" x="30" y="55" fill="#b5654a" rx="8"/><rect width="185" height="10" x="30" y="79" fill="#b5654a"/><text x="122" y="77" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">溶脂针</text><text x="45" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">宣称：药物溶解脂肪</text><text x="45" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">问题：</text><text x="45" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 国内多数无明确批准</text><text x="45" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 皮肤坏死、感染、</text><text x="45" y="196" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">不对称、神经损伤</text><text x="45" y="220" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 效果不可预测</text><text x="45" y="255" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">风险高，正规替代</text><text x="45" y="271" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">是吸脂或减重</text><text x="45" y="293" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9">（部分产品限特定</text><text x="45" y="307" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9">适应证，需核验）</text><rect width="185" height="250" x="227" y="55" fill="#f7ece6" stroke="#b5654a" rx="8"/><rect width="185" height="34" x="227" y="55" fill="#b5654a" rx="8"/><rect width="185" height="10" x="227" y="79" fill="#b5654a"/><text x="320" y="77" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">美白针</text><text x="242" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">宣称：静脉输液美白</text><text x="242" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">问题：</text><text x="242" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 国内无正规批准</text><text x="242" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 成分不明、剂量</text><text x="242" y="196" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">不规范</text><text x="242" y="220" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 过敏、肝肾负担</text><text x="242" y="255" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">缺乏证据支持</text><text x="242" y="271" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">正规美白靠防晒</text><text x="242" y="293" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9">和治疗色素疾病</text><rect width="185" height="250" x="424" y="55" fill="#f7ece6" stroke="#b5654a" rx="8"/><rect width="185" height="34" x="424" y="55" fill="#b5654a" rx="8"/><rect width="185" height="10" x="424" y="79" fill="#b5654a"/><text x="516" y="77" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">生长因子</text><text x="439" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">宣称：促进组织生长</text><text x="439" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">问题：</text><text x="439" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 注射用无正规批准</text><text x="439" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 不可控的组织增生</text><text x="439" y="196" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">甚至异常增生</text><text x="439" y="220" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 处理极其困难</text><text x="439" y="255" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">并发症重、难处理</text><text x="439" y="271" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">应严格避免</text><text x="439" y="293" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9">（外用与注射</text><text x="439" y="307" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9">是两回事）</text><text x="320" y="328" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">产品批准状态会变化；以国家药监局现行信息为准</text></svg>