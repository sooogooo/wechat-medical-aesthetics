<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2802 desc2802">
  <title id="title2802">越修越难：修复手术的残酷规律</title>
  <desc id="desc2802">每一次修复组织条件更差、改善余地更小、风险更高，反复修复会越来越难</desc>
  <defs>
    <linearGradient id="bg2802" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2802" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .tag { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:1px; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2802)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2802)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 28</text>
  <text x="62" y="117" class="title">越修越难：修复手术的残酷规律</text>
  <text x="62" y="153" class="kicker">每一刀都在缩小未来选择的空间</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle">反复修复的三条递减曲线</text>

  <!-- 三个递减阶梯：组织条件、改善余地、风险水平 -->
  <!-- 阶梯1：组织条件（越来越差） -->
  <text x="62" y="250" class="body" style="font-weight:700;fill:#17323d;">组织条件</text>
  <rect x="170" y="234" width="180" height="28" rx="6" fill="#0072B2"/>
  <text x="260" y="253" class="tag" text-anchor="middle">初次 · 较好</text>
  <rect x="360" y="240" width="180" height="22" rx="6" fill="#E69F00"/>
  <text x="450" y="256" class="tag" text-anchor="middle">一次修复 · 改变</text>
  <rect x="550" y="246" width="180" height="16" rx="6" fill="#D55E00"/>
  <text x="640" y="258" class="tag" text-anchor="middle">多次 · 脆弱</text>
  <text x="745" y="253" class="small">疤痕累积、血供改变</text>

  <!-- 阶梯2：改善余地（越来越小） -->
  <text x="62" y="300" class="body" style="font-weight:700;fill:#17323d;">改善余地</text>
  <rect x="170" y="284" width="180" height="28" rx="6" fill="#0072B2"/>
  <text x="260" y="303" class="tag" text-anchor="middle">初次 · 明显</text>
  <rect x="360" y="290" width="180" height="22" rx="6" fill="#E69F00"/>
  <text x="450" y="306" class="tag" text-anchor="middle">一次修复 · 有限</text>
  <rect x="550" y="296" width="180" height="16" rx="6" fill="#D55E00"/>
  <text x="640" y="308" class="tag" text-anchor="middle">多次 · 极有限</text>
  <text x="745" y="303" class="small">空间越来越小</text>

  <!-- 阶梯3：风险水平（越来越高） -->
  <text x="62" y="350" class="body" style="font-weight:700;fill:#17323d;">风险水平</text>
  <rect x="170" y="334" width="180" height="16" rx="6" fill="#0072B2"/>
  <text x="260" y="346" class="tag" text-anchor="middle">初次 · 基线</text>
  <rect x="360" y="328" width="180" height="22" rx="6" fill="#E69F00"/>
  <text x="450" y="344" class="tag" text-anchor="middle">一次修复 · 上升</text>
  <rect x="550" y="322" width="180" height="28" rx="6" fill="#D55E00"/>
  <text x="640" y="341" class="tag" text-anchor="middle">多次 · 显著升高</text>
  <text x="745" y="346" class="small">并发症概率上升</text>

  <line x1="62" y1="385" x2="838" y2="385" stroke="#dce5e5"/>

  <!-- 下方：举例与暂缓情形 -->
  <text x="62" y="412" class="nodeTitle">典型案例：鼻整形修复</text>
  <text x="62" y="440" class="body">第一次修复可能改善明显，第三、四次往往只能有限调整</text>
  <text x="62" y="464" class="small">乳房、面部等其他部位同理——反复手术使组织脆弱、疤痕累积</text>

  <rect x="478" y="400" width="360" height="100" rx="12" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8"/>
  <text x="498" y="425" class="nodeTitle" style="fill:#D55E00;">五种暂缓或不做的情形</text>
  <text x="498" y="450" class="small">· 组织未稳定</text>
  <text x="498" y="468" class="small">· 主要来自过高预期</text>
  <text x="498" y="486" class="small">· 已多次修复、条件极差</text>
  <text x="498" y="504" class="small">· 心理状态不稳 / 改善有限风险显著</text>

  <!-- 金句 -->
  <rect x="62" y="515" width="776" height="40" rx="12" fill="#fbeae3"/>
  <text x="450" y="541" class="quote" text-anchor="middle">承诺「包你满意」「一次修复到位」的，恰可能把你推向反复修复循环</text>

  <text x="62" y="572" class="small">负责任的修复医生会告诉你哪些能改善、哪些不能、什么时候不该再修</text>
  <text x="62" y="588" class="footer">医学教育示意 · 修复决策需结合心理评估，具体以面诊为准</text>
</svg>
