<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a8b6f"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#7a8b6f"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">去或不去，一页纸决策</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">三种决定都成立，间隔三天填两次</text>

  <rect x="230" y="100" width="340" height="58" rx="8" fill="#eef0ea" stroke="#e4ddd2" stroke-width="1.4"/><text x="400" y="126" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">事实区 · 我知道要进的是什么吗</text><text x="400" y="146" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#6b6864" text-anchor="middle">十项核对，任何一项打不了勾就回去重读</text>
  <line x1="400" y1="158" x2="400" y2="178" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/>
  <rect x="230" y="180" width="340" height="58" rx="8" fill="#eef0ea" stroke="#e4ddd2" stroke-width="1.4"/><text x="400" y="206" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">个人区 · 我拿什么进场</text><text x="400" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#6b6864" text-anchor="middle">资产负债 · 六个月储备 · 绝不清单</text>
  <line x1="400" y1="238" x2="400" y2="258" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/>
  <rect x="230" y="260" width="340" height="58" rx="8" fill="#eef0ea" stroke="#e4ddd2" stroke-width="1.4"/><text x="400" y="286" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">条件区 · 我要的和我将遇到的</text><text x="400" y="306" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#6b6864" text-anchor="middle">十条如果那么，右列读完还想进再进</text>
  <line x1="330" y1="318" x2="180" y2="368" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/>
  <line x1="400" y1="318" x2="400" y2="368" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/>
  <line x1="470" y1="318" x2="620" y2="368" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/>
  <rect x="80" y="372" width="200" height="56" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="180" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#7a8b6f" font-weight="600" text-anchor="middle">进</text><text x="180" y="416" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#6b6864" text-anchor="middle">带地图进场</text>
  <rect x="300" y="372" width="200" height="56" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="400" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28" font-weight="600" text-anchor="middle">不进</text><text x="400" y="416" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#6b6864" text-anchor="middle">红绿灯也是救命系统</text>
  <rect x="520" y="372" width="200" height="56" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="620" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28" font-weight="600" text-anchor="middle">再等等</text><text x="620" y="416" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#6b6864" text-anchor="middle">先完成七项核验</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">地图不替走路的人选路</text>
</svg>