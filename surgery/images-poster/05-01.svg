<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0501 desc0501">
  <title id="title0501">动四级手术前先问自己的五个问题</title>
  <desc id="desc0501">诉求、承受底线、他人压力、紧迫性、半效接受度五问，分清想做与该做</desc>
  <defs>
    <linearGradient id="bg0501" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0501" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0501)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0501)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 05</text>
  <text x="62" y="117" class="title">动四级手术前先问自己的五个问题</text>
  <text x="62" y="153" class="kicker">面诊前安静回答，比看一百张案例图更有用</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 5问：纵向排列 -->
  <!-- 问1 -->
  <rect x="62" y="205" width="776" height="56" rx="12" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.8"/>
  <circle cx="100" cy="233" r="20" fill="#0072B2"/>
  <text x="100" y="242" class="num" text-anchor="middle" font-size="22">1</text>
  <text x="134" y="228" class="nodeTitle">我的诉求是具体的结构问题，还是笼统的"不自信"？</text>
  <text x="134" y="250" class="small">手术解决结构问题，解决不了人生困境</text>

  <!-- 问2 -->
  <rect x="62" y="269" width="776" height="56" rx="12" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.8"/>
  <circle cx="100" cy="297" r="20" fill="#0072B2"/>
  <text x="100" y="306" class="num" text-anchor="middle" font-size="22">2</text>
  <text x="134" y="292" class="nodeTitle">如果效果只达到预期的一半，我还能接受吗？</text>
  <text x="134" y="314" class="small">不能接受，说明预期本身可能过高</text>

  <!-- 问3 -->
  <rect x="62" y="333" width="776" height="56" rx="12" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8"/>
  <circle cx="100" cy="361" r="20" fill="#E69F00"/>
  <text x="100" y="370" class="num" text-anchor="middle" font-size="22">3</text>
  <text x="134" y="356" class="nodeTitle">我能承受多长恢复期、多大疤痕、可能的并发症和二次手术？</text>
  <text x="134" y="378" class="small">这是承受力的真实底线</text>

  <!-- 问4 -->
  <rect x="62" y="397" width="776" height="56" rx="12" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8"/>
  <circle cx="100" cy="425" r="20" fill="#E69F00"/>
  <text x="100" y="434" class="num" text-anchor="middle" font-size="22">4</text>
  <text x="134" y="420" class="nodeTitle">这是我自己想做的决定，还是为某段关系、某个场合、某种压力？</text>
  <text x="134" y="442" class="small">为他人而做的不可逆手术，事后容易后悔</text>

  <!-- 问5 -->
  <rect x="62" y="461" width="776" height="56" rx="12" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8"/>
  <circle cx="100" cy="489" r="20" fill="#D55E00"/>
  <text x="100" y="498" class="num" text-anchor="middle" font-size="22">5</text>
  <text x="134" y="484" class="nodeTitle">如果今天不做，半年后我会怎样？</text>
  <text x="134" y="506" class="small">影响不大说明不紧迫，值得再缓一缓</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">这五问不是劝你不做，而是帮你分清"想做"和"该做"</text>

  <text x="62" y="582" class="footer">医学教育示意 · 本文用于健康教育，不能替代面诊和必要的心理评估</text>
</svg>
