<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0202 desc0202" role="img" viewBox="0 0 900 620"><title id="title0202">医生资质核验路径与该问的问题</title><desc id="desc0202">从官方系统核验到面诊该问的问题，分两步走</desc><defs><linearGradient id="bg0202" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0202" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 28px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0202)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0202)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 02</text><text x="62" y="117" class="title">医生资质核验路径</text><text x="62" y="153" class="kicker">先官方核验，再面诊问诊，最后才比价格</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">三步筛选顺序</text><rect width="250" height="100" x="62" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="100" cy="270" r="20" fill="#0072B2"/><text x="100" y="278" class="num" font-size="22" text-anchor="middle">1</text><text x="132" y="266" class="nodeTitle" font-size="17">官方系统筛资质</text><text x="132" y="290" class="small">执业注册查询</text><text x="132" y="310" class="small">机构核准级别</text><rect width="250" height="100" x="325" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="363" cy="270" r="20" fill="#E69F00"/><text x="363" y="278" class="num" font-size="22" text-anchor="middle">2</text><text x="395" y="266" class="nodeTitle" font-size="17">面诊沟通筛专业</text><text x="395" y="290" class="small">愿解释风险</text><text x="395" y="310" class="small">能正面答问题</text><rect width="250" height="100" x="588" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="626" cy="270" r="20" fill="#D55E00"/><text x="626" y="278" class="num" font-size="22" text-anchor="middle">3</text><text x="658" y="266" class="nodeTitle" font-size="17">最后才比方案价格</text><text x="658" y="290" class="small">植入物 · 术后管理</text><text x="658" y="310" class="small">总价 · 复诊路径</text><path stroke="#7d8e93" stroke-width="2" d="M 312 282 L 325 282"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 320 277 L 325 282 L 320 287"/><path stroke="#7d8e93" stroke-width="2" d="M 575 282 L 588 282"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 583 277 L 588 282 L 583 287"/><text x="62" y="368" class="nodeTitle">面诊该问的具体问题</text><rect width="377" height="125" x="62" y="382" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5" rx="12"/><text x="82" y="408" fill="#17323d" class="body" font-weight="700">关于资质与术式</text><text x="82" y="432" class="body">· 这个术式在您的执业范围内吗？</text><text x="82" y="455" class="body">· 您所在机构核准开展这一级别吗？</text><text x="82" y="478" class="body">· 我的解剖基础适合这个术式吗？</text><text x="82" y="501" class="body">· 有没有创伤更小的替代方案？</text><rect width="377" height="125" x="461" y="382" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5" rx="12"/><text x="481" y="408" fill="#17323d" class="body" font-weight="700">关于风险与术后</text><text x="481" y="432" class="body">· 常见并发症有哪些，怎么处理？</text><text x="481" y="455" class="body">· 麻醉由谁做，术后在哪观察？</text><text x="481" y="478" class="body">· 紧急情况如何转诊？</text><text x="481" y="501" class="body">· 效果不理想或出问题的修复路径？</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">能正面回答这些问题的医生，通常更值得托付</text><text x="62" y="582" class="footer">医学教育示意 · 医师资质请以官方核验结果为准，本文不构成具体医师推荐</text></svg>