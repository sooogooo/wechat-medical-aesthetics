<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleB301 descB301">
  <title id="titleB301">联合吸脂的利与弊</title>
  <desc id="descB301">腹壁成形联合吸脂的利益与风险对照</desc>
  <defs>
    <marker id="ahB301" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · B3</text>
  <text x="62" y="112" class="title">联合吸脂的利与弊</text>
  <text x="62" y="148" class="kicker">一次解决两个问题，代价是皮瓣血供风险</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>
  <rect x="62" y="205" width="370" height="250" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="84" y="243" class="nodeTitle">联合的利</text>
  <text x="84" y="277" class="body">一次解决脂肪＋皮肤两个问题</text>
  <text x="84" y="303" class="body">少一次麻醉与恢复期</text>
  <text x="84" y="329" class="body">整体轮廓改善更完整</text>
  <text x="247" y="443" class="small" style="fill:#0B8A6B" text-anchor="middle">前提是血供评估允许</text>
  <rect x="468" y="205" width="370" height="250" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="490" y="243" class="nodeTitle">联合的弊</text>
  <text x="490" y="277" class="body">皮瓣血供进一步受影响</text>
  <text x="490" y="303" class="body">坏死风险显著上升</text>
  <text x="490" y="329" class="body">抽脂量必须保守</text>
  <text x="653" y="443" class="small" style="fill:#C75B00" text-anchor="middle">吸烟、糖尿病者风险更高</text>
  <text x="450" y="340" class="midTitle" text-anchor="middle" style="fill:#93a3a8">VS</text>
  <text x="450" y="488" class="small" text-anchor="middle">在哪些区域抽、抽多少，由主刀评估皮瓣血供安全边界</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">联合不是顺便，是独立的风险决策</text>
  <text x="62" y="580" class="footer">医学教育示意 · 联合与抽脂量以主刀血供评估为准</text>
</svg>
