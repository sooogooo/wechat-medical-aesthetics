<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0102 desc0102" role="img" viewBox="0 0 900 620"><title id="title0102">查机构资质的三步法</title><desc id="desc0102">现场看执业许可证、官方系统核验诊疗科目、查主刀医生执业注册的三步路径</desc><defs><linearGradient id="bg0102" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0102" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 28px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0102)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0102)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 01</text><text x="62" y="117" class="title">查机构资质的三步法</text><text x="62" y="153" class="kicker">几分钟的事，比看装修和案例更能说明问题</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="250" height="290" x="62" y="215" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="16"/><circle cx="105" cy="258" r="22" fill="#0072B2"/><text x="105" y="267" class="num" text-anchor="middle">1</text><text x="140" y="265" class="nodeTitle">现场看证</text><text x="82" y="305" class="body">看公示的执业许可证</text><text x="82" y="332" class="body">记机构名称、类别</text><text x="82" y="359" class="body">记登记号与诊疗科目</text><text x="82" y="386" class="body">核对含&quot;医疗美容科&quot;</text><text x="82" y="413" class="body">或&quot;整形外科&quot;</text><rect width="210" height="58" x="82" y="430" fill="#eef6f8" rx="8"/><text x="187" y="453" class="small" text-anchor="middle">正规机构应醒目悬挂</text><text x="187" y="472" class="small" text-anchor="middle">回避公示＝警示信号</text><rect width="250" height="290" x="325" y="215" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="16"/><circle cx="368" cy="258" r="22" fill="#E69F00"/><text x="368" y="267" class="num" text-anchor="middle">2</text><text x="403" y="265" class="nodeTitle">官方核验</text><text x="345" y="305" class="body">卫健部门信息公开入口</text><text x="345" y="332" class="body">按名称或登记号查询</text><text x="345" y="359" class="body">比对诊疗科目一致</text><text x="345" y="386" class="body">确认核准手术级别</text><text x="345" y="413" class="body">门诊部一般不核准四级</text><rect width="210" height="58" x="345" y="430" fill="#fdf3e3" rx="8"/><text x="450" y="453" class="small" text-anchor="middle">宣传口径 ≠ 核准科目</text><text x="450" y="472" class="small" text-anchor="middle">以官方登记为准</text><rect width="250" height="290" x="588" y="215" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="16"/><circle cx="631" cy="258" r="22" fill="#D55E00"/><text x="631" y="267" class="num" text-anchor="middle">3</text><text x="666" y="265" class="nodeTitle">查主刀医生</text><text x="608" y="305" class="body">医师执业注册查询系统</text><text x="608" y="332" class="body">执业类别与范围相符</text><text x="608" y="359" class="body">执业地点与机构一致</text><text x="608" y="386" class="body">多点执业应备案可查</text><text x="608" y="413" class="body">了解手术权限</text><rect width="210" height="58" x="608" y="430" fill="#fbeae3" rx="8"/><text x="713" y="453" class="small" text-anchor="middle">&quot;客座&quot;&quot;特聘&quot;含糊头衔</text><text x="713" y="472" class="small" text-anchor="middle">查无备案要追问</text><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 312 360 L 325 360"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 320 355 L 325 360 L 320 365"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 575 360 L 588 360"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 583 355 L 588 360 L 583 365"/><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">三步核验，把不安全的选项筛在第一关</text><text x="62" y="582" class="footer">医学教育示意 · 机构与医师资质请以官方核验结果为准，各地规定可能有差异</text></svg>