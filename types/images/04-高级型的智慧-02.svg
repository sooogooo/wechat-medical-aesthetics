<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="耐看的来源">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">&quot;耐看&quot;来自这几个品质</text>

  <rect x="30" y="60" width="140" height="170" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="100" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">协调</text>
  <text x="100" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">五官之间</text>
  <text x="100" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">和谐的比例</text>
  <text x="100" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">没有突兀的</text>
  <text x="100" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">局部突出</text>

  <rect x="180" y="60" width="140" height="170" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="250" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">自然</text>
  <text x="250" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">动起来自然</text>
  <text x="250" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">静下来舒适</text>
  <text x="250" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">看不出&quot;做&quot;</text>
  <text x="250" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">的痕迹</text>

  <rect x="330" y="60" width="140" height="170" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="400" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">辨识度</text>
  <text x="400" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">保留你的</text>
  <text x="400" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">个人特征</text>
  <text x="400" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不是&quot;另一张</text>
  <text x="400" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">流水线脸&quot;</text>

  <rect x="480" y="60" width="140" height="170" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="550" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">合适</text>
  <text x="550" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">符合你的</text>
  <text x="550" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">年龄/气质</text>
  <text x="550" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不&quot;装嫩&quot;</text>
  <text x="550" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不&quot;过度&quot;</text>

  <text x="320" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">协调、自然、辨识度、合适——这四个品质叠加，才是&quot;耐看&quot;的来源</text>
</svg>