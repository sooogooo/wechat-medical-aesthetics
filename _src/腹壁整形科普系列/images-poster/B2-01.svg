<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleB201 descB201">
  <title id="titleB201">手术台上的六个步骤</title>
  <desc id="descB201">腹壁成形术六个主要步骤，切口设计、掀起皮瓣、收紧腹直肌、切除皮肤、重造脐部、引流缝合</desc>
  <defs>
    <marker id="ahB201" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · B2</text>
  <text x="62" y="112" class="title">手术台上的六个步骤</text>
  <text x="62" y="148" class="kicker">从切口设计到留置引流，一台四级手术的完整流程</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>

  <rect x="62" y="205" width="236" height="130" rx="10" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="102" cy="241" r="17" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="102" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0072B2" text-anchor="middle">1</text>
  <text x="132" y="247" class="nodeTitle">切口设计</text>
  <text x="84" y="283" class="body">站立位标记</text>
  <text x="84" y="309" class="body">切口尽量藏进比基尼线</text>
  <line x1="302" y1="270" x2="326" y2="270" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahB201)"/>
  <rect x="332" y="205" width="236" height="130" rx="10" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="372" cy="241" r="17" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="372" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0072B2" text-anchor="middle">2</text>
  <text x="402" y="247" class="nodeTitle">掀起皮瓣</text>
  <text x="354" y="283" class="body">皮瓣分离至肋缘</text>
  <text x="354" y="309" class="body">剥离面大、出血来源</text>
  <line x1="572" y1="270" x2="596" y2="270" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahB201)"/>
  <rect x="602" y="205" width="236" height="130" rx="10" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="642" cy="241" r="17" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="642" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0072B2" text-anchor="middle">3</text>
  <text x="672" y="247" class="nodeTitle">收紧腹直肌</text>
  <text x="624" y="283" class="body">前鞘折叠缝合</text>
  <text x="624" y="309" class="body">重建肌层张力</text>
  <rect x="62" y="355" width="236" height="130" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <circle cx="102" cy="391" r="17" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="102" y="397" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0B8A6B" text-anchor="middle">4</text>
  <text x="132" y="397" class="nodeTitle">切除皮肤</text>
  <text x="84" y="433" class="body">拉紧后切除多余部分</text>
  <text x="84" y="459" class="body">决定疤痕位置长度</text>
  <line x1="302" y1="420" x2="326" y2="420" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahB201)"/>
  <rect x="332" y="355" width="236" height="130" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <circle cx="372" cy="391" r="17" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="372" y="397" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0B8A6B" text-anchor="middle">5</text>
  <text x="402" y="397" class="nodeTitle">重造脐部</text>
  <text x="354" y="433" class="body">新位置开孔引出</text>
  <text x="354" y="459" class="body">脐周也会留疤</text>
  <line x1="572" y1="420" x2="596" y2="420" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahB201)"/>
  <rect x="602" y="355" width="236" height="130" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <circle cx="642" cy="391" r="17" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="642" y="397" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0B8A6B" text-anchor="middle">6</text>
  <text x="672" y="397" class="nodeTitle">引流缝合</text>
  <text x="624" y="433" class="body">留置引流管 1～2 周</text>
  <text x="624" y="459" class="body">加压包扎</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">这不是切掉一块皮，是腹壁结构的重建</text>
  <text x="62" y="580" class="footer">医学教育示意，非教学图 · 具体操作因术式与个体而异</text>
</svg>
