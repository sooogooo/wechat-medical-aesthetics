<svg xmlns="http://www.w3.org/2000/svg" aria-label="身体美学制造焦虑的机制" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">身体美学如何让&quot;自然身体&quot;变得不可接受</text><rect width="580" height="55" x="30" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="50" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">第一步：把身材拆解成&quot;零件&quot;</text><text x="50" y="103" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">肩、颈、腰、臀、腿……每个零件都有&quot;标准&quot;</text><rect width="580" height="55" x="30" y="125" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="50" y="150" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">第二步：让你对照检查&quot;不达标&quot;</text><text x="50" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">几乎每个人都能找到&quot;不合格&quot;的部分——焦虑由此产生</text><rect width="580" height="55" x="30" y="190" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="50" y="215" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">第三步：提供&quot;修复方案&quot;</text><text x="50" y="233" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">吸脂、填充、手术……把&quot;不达标&quot;变成可消费的项目</text></svg>