<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t42f1 d42f1" role="img" viewBox="0 0 800 500"><title id="t42f1">萎缩性痘坑的三种分型</title><desc id="d42f1">冰锥型箱车型滚轮型三种凹陷瘢痕的形态与处理差异</desc><defs><linearGradient id="bg42f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh42f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.card{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg42f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh42f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 42</text><text x="52" y="92" class="title">痘坑分三型，处理各不同</text><text x="52" y="116" class="kicker">真皮修复不足形成的凹陷瘢痕，先分型再谈设备</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="220" height="270" x="52" y="150" fill="#fbf0eb" stroke="#B5654A" rx="12"/><rect width="220" height="34" x="52" y="150" fill="#B5654A" rx="12"/><rect width="220" height="16" x="52" y="168" fill="#B5654A"/><text x="162" y="172" class="card" text-anchor="middle">冰锥型</text><line x1="162" x2="162" y1="200" y2="200" stroke="none"/><path fill="none" stroke="#2B2A28" stroke-width="2" d="M 110 200 L 150 200 L 162 280 L 174 200 L 214 200"/><path stroke="#2B2A28" stroke-width="2" d="M 110 200 L 214 200"/><text x="162" y="220" fill="#B5654A" class="small" text-anchor="middle">深窄如冰锥</text><text x="162" y="246" class="body" text-anchor="middle">形态</text><text x="162" y="266" class="small" text-anchor="middle">开口小、底部尖</text><text x="162" y="284" class="small" text-anchor="middle">深达真皮深层</text><text x="162" y="312" class="body" text-anchor="middle">常见部位</text><text x="162" y="332" class="small" text-anchor="middle">面颊、太阳穴</text><text x="162" y="360" class="body" text-anchor="middle">处理方向</text><text x="162" y="380" fill="#B5654A" class="small" text-anchor="middle">难，常需专项治疗</text><text x="162" y="398" fill="#B5654A" class="small" text-anchor="middle">先控制活动痘</text><rect width="220" height="270" x="290" y="150" fill="#fbf5ea" stroke="#C9A876" rx="12"/><rect width="220" height="34" x="290" y="150" fill="#C9A876" rx="12"/><rect width="220" height="16" x="290" y="168" fill="#C9A876"/><text x="400" y="172" class="card" text-anchor="middle">箱车型</text><path fill="none" stroke="#2B2A28" stroke-width="2" d="M 348 200 L 452 200 L 444 250 L 356 250 Z"/><path stroke="#2B2A28" stroke-width="2" d="M 340 200 L 460 200"/><text x="400" y="220" fill="#C9A876" class="small" text-anchor="middle">平底的方坑</text><text x="400" y="246" class="body" text-anchor="middle">形态</text><text x="400" y="266" class="small" text-anchor="middle">边缘陡、底部平</text><text x="400" y="284" class="small" text-anchor="middle">宽而较浅</text><text x="400" y="312" class="body" text-anchor="middle">常见部位</text><text x="400" y="332" class="small" text-anchor="middle">面颊、下颌、颞部</text><text x="400" y="360" class="body" text-anchor="middle">处理方向</text><text x="400" y="380" fill="#5F6E54" class="small" text-anchor="middle">皮下分离、激光</text><text x="400" y="398" fill="#5F6E54" class="small" text-anchor="middle">磨削可改善</text><rect width="220" height="270" x="528" y="150" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="220" height="34" x="528" y="150" fill="#7A8B6F" rx="12"/><rect width="220" height="16" x="528" y="168" fill="#7A8B6F"/><text x="638" y="172" class="card" text-anchor="middle">滚轮型</text><path fill="none" stroke="#2B2A28" stroke-width="2" d="M 586 200 Q 638 240 690 200"/><path stroke="#2B2A28" stroke-width="2" d="M 570 200 L 706 200"/><text x="638" y="220" fill="#5F6E54" class="small" text-anchor="middle">宽阔波浪状</text><text x="638" y="246" class="body" text-anchor="middle">形态</text><text x="638" y="266" class="small" text-anchor="middle">边缘缓、底部牵拉</text><text x="638" y="284" class="small" text-anchor="middle">常与皮下粘连</text><text x="638" y="312" class="body" text-anchor="middle">常见部位</text><text x="638" y="332" class="small" text-anchor="middle">下颌、面颊下部</text><text x="638" y="360" class="body" text-anchor="middle">处理方向</text><text x="638" y="380" fill="#5F6E54" class="small" text-anchor="middle">皮下分离松解</text><text x="638" y="398" fill="#5F6E54" class="small" text-anchor="middle">配合填充或射频</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">先控痘、再分型，最后才谈设备</text><text x="52" y="466" class="footer">健康科普示意 · 具体方案需由医师评估瘢痕类型后制定</text></svg>