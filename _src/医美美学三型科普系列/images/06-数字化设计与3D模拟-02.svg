<svg xmlns="http://www.w3.org/2000/svg" aria-label="模拟与现实的差距" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">为什么&quot;模拟&quot;不等于&quot;结果&quot;</text><rect width="580" height="55" x="30" y="60" fill="#f7ece6" stroke="#b5654a" rx="6"/><text x="320" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">软件预测的局限</text><text x="320" y="103" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">组织愈合、肿胀消退、材料特性、个体反应，软件无法完全模拟</text><rect width="580" height="55" x="30" y="125" fill="#f7ece6" stroke="#b5654a" rx="6"/><text x="320" y="150" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">模拟的&quot;美化倾向&quot;</text><text x="320" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">部分机构的模拟图倾向&quot;理想化&quot;，诱导决策，实际效果可能不如模拟</text><rect width="580" height="50" x="30" y="190" fill="#f4ede0" stroke="#c9a876" rx="6"/><text x="320" y="215" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">核心认知</text><text x="320" y="232" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">模拟是&quot;参考预览&quot;，不是&quot;效果保证&quot;——任何机构用模拟承诺&quot;做完就这样&quot;都不可信</text></svg>