<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2101 desc2101">
  <title id="title2101">拉皮解决的是松，不是皱</title>
  <desc id="desc2101">组织松垂、细纹动态纹、皮肤质地问题三类不同问题，对应不同处理方式</desc>
  <defs>
    <linearGradient id="bg2101" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2101" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .tag { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:1px; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2101)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2101)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 21</text>
  <text x="62" y="117" class="title">拉皮解决的是「松」，不是「皱」</text>
  <text x="62" y="153" class="kicker">分清三类问题，才能选对手段，避免过度治疗</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle">面部老化三种来源，对应不同处理</text>

  <!-- 卡1：组织松垂（拉皮强项） -->
  <rect x="62" y="240" width="250" height="265" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="240" width="250" height="44" rx="16" fill="#0072B2"/>
  <rect x="62" y="270" width="250" height="14" fill="#0072B2"/>
  <text x="187" y="269" class="tag" text-anchor="middle">组织松垂 · 拉皮强项</text>
  <text x="82" y="312" class="body">法令纹加深</text>
  <text x="82" y="339" class="body">苹果肌下移</text>
  <text x="82" y="366" class="body">下颌缘模糊</text>
  <text x="82" y="393" class="body">面颊、颈部下垂</text>
  <rect x="82" y="430" width="210" height="55" rx="8" fill="#eef6f8"/>
  <text x="187" y="453" class="small" text-anchor="middle">SMAS、皮肤瓣上提切除</text>
  <text x="187" y="472" class="small" text-anchor="middle">属手术范畴，二至四级</text>

  <!-- 卡2：细纹动态纹 -->
  <rect x="325" y="240" width="250" height="265" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="325" y="240" width="250" height="44" rx="16" fill="#E69F00"/>
  <rect x="325" y="270" width="250" height="14" fill="#E69F00"/>
  <text x="450" y="269" class="tag" text-anchor="middle">细纹动态纹 · 非拉皮</text>
  <text x="345" y="312" class="body">眼周细纹</text>
  <text x="345" y="339" class="body">抬头纹</text>
  <text x="345" y="366" class="body">鱼尾纹</text>
  <text x="345" y="393" class="body">表情纹</text>
  <rect x="345" y="430" width="210" height="55" rx="8" fill="#fdf3e3"/>
  <text x="450" y="453" class="small" text-anchor="middle">肉毒素、光电为主</text>
  <text x="450" y="472" class="small" text-anchor="middle">拉皮改善有限，属过度治疗</text>

  <!-- 卡3：皮肤质地 -->
  <rect x="588" y="240" width="250" height="265" rx="16" fill="#f8fbfb" stroke="#009E73" stroke-width="2"/>
  <rect x="588" y="240" width="250" height="44" rx="16" fill="#009E73"/>
  <rect x="588" y="270" width="250" height="14" fill="#009E73"/>
  <text x="713" y="269" class="tag" text-anchor="middle">皮肤质地 · 非拉皮</text>
  <text x="608" y="312" class="body">色斑</text>
  <text x="608" y="339" class="body">毛孔粗大</text>
  <text x="608" y="366" class="body">光老化</text>
  <text x="608" y="393" class="body">肤色不均</text>
  <rect x="608" y="430" width="210" height="55" rx="8" fill="#e7f5ef"/>
  <text x="713" y="453" class="small" text-anchor="middle">光电、护肤为主</text>
  <text x="713" y="472" class="small" text-anchor="middle">手术不解决皮肤质地</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">主诉是细纹去做拉皮是过度，明显松垂只做光电又不够</text>

  <text x="62" y="582" class="footer">医学教育示意 · 具体分级与术式以面诊评估和属地核准为准</text>
</svg>
