  <text x="56" y="90" class="title">新旧咨询师 两条车道</text>
  <text x="56" y="116" class="kicker">行业已从销售驱动转向医疗导向，选错车道比开得慢更危险</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

