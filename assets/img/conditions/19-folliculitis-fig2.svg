<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t19 d19">
  <title id="t19">毛囊炎护理三件事</title>
  <desc id="d19">把闷、磨、刮三个刺激因素降下来</desc>
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh19" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
    .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
    .title  { font: 700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5F6E54; }
    .nodeT  { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .nodeT2 { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .body   { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
    .small  { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
    .tiny   { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    .quote  { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    .num    { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
    .badge  { font: 700 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:0.6px; }
</style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg19)"/>
  <rect x="26" y="24" width="748" height="452" rx="18" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh19)"/>
  <!-- header -->
  <text x="48" y="58" class="series">皮肤病症科普 · 19</text>
  <text x="48" y="92" class="title">毛囊炎护理三件事</text>
  <text x="48" y="116" class="kicker">把闷、磨、刮三个刺激因素降下来</text>
  <line x1="48" y1="134" x2="752" y2="134" stroke="#dce8e8"/>
  <!-- body -->
  
  <text x="48" y="168" class="nodeT">减少毛囊被反复激惹的入口</text>
  
  <circle cx="74" cy="208" r="13" fill="#7A8B6F"/>
  <text x="74" y="213" class="num" text-anchor="middle">1</text>
  <text x="98" y="213" class="body">保持透气：运动后及时换下汗湿衣物，避免紧身化纤</text>
  
  <circle cx="74" cy="250" r="13" fill="#7A8B6F"/>
  <text x="74" y="255" class="num" text-anchor="middle">2</text>
  <text x="98" y="255" class="body">减少摩擦：剃毛顺毛向、单层剃须泡沫，钝刀片及时换</text>
  
  <circle cx="74" cy="292" r="13" fill="#C9A876"/>
  <text x="74" y="297" class="num" text-anchor="middle">3</text>
  <text x="98" y="297" class="body">避免闷堵：油性外用产品、厚重遮盖先暂停一段时间</text>
  
  <circle cx="74" cy="334" r="13" fill="#B5654A"/>
  <text x="74" y="339" class="num" text-anchor="middle">4</text>
  <text x="98" y="339" class="body">用药对类型：细菌与真菌方向不同，勿自行长期涂激素</text>
  
  <rect x="48" y="372" width="704" height="40" rx="10" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity="0.35"/>
  <text x="400" y="397" class="quote" text-anchor="middle">反复不等于身体“湿气重”，先查毛囊为什么被激惹</text>
  
  <!-- footer -->
  <text x="48" y="462" class="footer">家庭护理示意 · 脓疱增大、发热或扩散应就医，不自行挤压</text>
</svg>
