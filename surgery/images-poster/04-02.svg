<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0402 desc0402">
  <title id="title0402">比价之前先比的维度</title>
  <desc id="desc0402">资质、方案细节、植入物、术后管理、修复成本等比价维度，价格应是最后一筛</desc>
  <defs>
    <linearGradient id="bg0402" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0402" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0402)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0402)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 04</text>
  <text x="62" y="117" class="title">比价之前先比的维度</text>
  <text x="62" y="153" class="kicker">价格应是最后一筛，不是第一筛</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 漏斗式筛选：5层从上到下 -->
  <!-- 层1：资质 -->
  <rect x="62" y="210" width="776" height="48" rx="10" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="100" cy="234" r="18" fill="#0072B2"/>
  <text x="100" y="242" class="num" text-anchor="middle" font-size="20">1</text>
  <text x="130" y="230" class="nodeTitle">机构与医生资质</text>
  <text x="130" y="250" class="small">先把资质不符、不愿解释风险的筛掉——这是第一关</text>
  <text x="820" y="240" class="body" text-anchor="end" font-weight="700" fill="#0072B2">先筛</text>

  <!-- 层2：方案 -->
  <rect x="92" y="266" width="716" height="48" rx="10" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="130" cy="290" r="18" fill="#0072B2"/>
  <text x="130" y="298" class="num" text-anchor="middle" font-size="20">2</text>
  <text x="160" y="286" class="nodeTitle">方案细节</text>
  <text x="160" y="306" class="small">术式选择、截骨范围、切口设计是否合理</text>

  <!-- 层3：植入物 -->
  <rect x="122" y="322" width="656" height="48" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="160" cy="346" r="18" fill="#E69F00"/>
  <text x="160" y="354" class="num" text-anchor="middle" font-size="20">3</text>
  <text x="190" y="342" class="nodeTitle">植入物与耗材</text>
  <text x="190" y="362" class="small">品牌、批号、注册证号可追溯，写入手术记录</text>

  <!-- 层4：术后管理 -->
  <rect x="152" y="378" width="596" height="48" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="190" cy="402" r="18" fill="#E69F00"/>
  <text x="190" y="410" class="num" text-anchor="middle" font-size="20">4</text>
  <text x="220" y="398" class="nodeTitle">术后管理与修复成本</text>
  <text x="220" y="418" class="small">复诊、并发症处理是否另收费；修复比初次更贵更难</text>

  <!-- 层5：总价 -->
  <rect x="182" y="434" width="536" height="48" rx="10" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="220" cy="458" r="18" fill="#D55E00"/>
  <text x="220" y="466" class="num" text-anchor="middle" font-size="20">5</text>
  <text x="250" y="454" class="nodeTitle">最后才比总价</text>
  <text x="250" y="474" class="small">把价格当唯一标准，等于把安全放在最后</text>
  <text x="700" y="464" class="body" text-anchor="end" font-weight="700" fill="#D55E00">最后</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">四级手术不满意修复更贵更难——把潜在成本算进决策</text>

  <text x="62" y="582" class="footer">医学教育示意 · 植入物信息可在国家药品监督管理局查询，市场价格以实地咨询为准</text>
</svg>
