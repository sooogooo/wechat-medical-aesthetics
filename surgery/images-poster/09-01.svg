<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0901 desc0901" role="img" viewBox="0 0 900 620"><title id="title0901">下巴短的三种方案对比</title><desc id="desc0901">颏成形术四级、假体隆颏二三级、注射填充门诊，创伤与可逆性差别大</desc><defs><linearGradient id="bg0901" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0901" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.body{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.lvl{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0901)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0901)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 09</text><text x="62" y="117" class="title">下巴短的三种方案对比</text><text x="62" y="153" class="kicker">截骨、假体、注射，创伤与可逆性差别很大</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="776" height="32" x="62" y="210" fill="#eef3f4" rx="6"/><text x="188" y="232" fill="#17323d" class="small" font-weight="700" text-anchor="middle">方式</text><text x="350" y="232" fill="#17323d" class="small" font-weight="700" text-anchor="middle">创伤/恢复</text><text x="510" y="232" fill="#17323d" class="small" font-weight="700" text-anchor="middle">可逆性</text><text x="688" y="232" fill="#17323d" class="small" font-weight="700" text-anchor="middle">适合人群</text><rect width="776" height="86" x="62" y="246" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5" rx="8"/><rect width="130" height="86" x="62" y="246" fill="#D55E00" rx="8"/><rect width="12" height="86" x="180" y="246" fill="#D55E00"/><text x="127" y="282" class="lvl" text-anchor="middle">颏成形术</text><text x="127" y="304" class="lvl" text-anchor="middle">（截骨前移）</text><text x="127" y="322" class="lvl" text-anchor="middle">四级</text><text x="350" y="278" class="body" text-anchor="middle">创伤大、恢复慢</text><text x="350" y="300" class="small" text-anchor="middle">全麻、经口内切口</text><text x="350" y="320" class="small" text-anchor="middle">需住院</text><text x="510" y="278" class="body" text-anchor="middle">效果永久</text><text x="510" y="300" class="small" text-anchor="middle">骨性前移</text><text x="510" y="320" class="small" text-anchor="middle">不可逆</text><text x="688" y="278" class="body" text-anchor="middle">骨性后缩明显</text><text x="688" y="300" class="small" text-anchor="middle">愿承担四级风险</text><text x="688" y="320" class="small" text-anchor="middle">追求永久效果</text><rect width="776" height="86" x="62" y="340" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5" rx="8"/><rect width="130" height="86" x="62" y="340" fill="#E69F00" rx="8"/><rect width="12" height="86" x="180" y="340" fill="#E69F00"/><text x="127" y="376" class="lvl" text-anchor="middle">假体隆颏</text><text x="127" y="398" class="lvl" text-anchor="middle">硅胶/膨体</text><text x="127" y="416" class="lvl" text-anchor="middle">通常二/三级</text><text x="350" y="372" class="body" text-anchor="middle">中等创伤</text><text x="350" y="394" class="small" text-anchor="middle">口内或颏下切口</text><text x="350" y="414" class="small" text-anchor="middle">恢复数周</text><text x="510" y="372" class="body" text-anchor="middle">可取出</text><text x="510" y="394" class="small" text-anchor="middle">效果明确</text><text x="510" y="414" class="small" text-anchor="middle">有移位/显形风险</text><text x="688" y="372" class="body" text-anchor="middle">明显改善</text><text x="688" y="394" class="small" text-anchor="middle">不愿截骨</text><text x="688" y="414" class="small" text-anchor="middle">接受异物植入</text><rect width="776" height="86" x="62" y="434" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.5" rx="8"/><rect width="130" height="86" x="62" y="434" fill="#0072B2" rx="8"/><rect width="12" height="86" x="180" y="434" fill="#0072B2"/><text x="127" y="470" class="lvl" text-anchor="middle">注射填充</text><text x="127" y="492" class="lvl" text-anchor="middle">透明质酸等</text><text x="127" y="510" class="lvl" text-anchor="middle">通常门诊</text><text x="350" y="466" class="body" text-anchor="middle">创伤小</text><text x="350" y="488" class="small" text-anchor="middle">恢复快</text><text x="350" y="508" class="small" text-anchor="middle">改善幅度有限</text><text x="510" y="466" class="body" text-anchor="middle">可吸收</text><text x="510" y="488" class="small" text-anchor="middle">效果临时</text><text x="510" y="508" class="small" text-anchor="middle">需定期补打</text><text x="688" y="466" class="body" text-anchor="middle">轻度后缩</text><text x="688" y="488" class="small" text-anchor="middle">试水效果</text><text x="688" y="508" class="small" text-anchor="middle">注意血管栓塞</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">&quot;打一针垫下巴&quot;被包装成无风险，仍有血管栓塞可能</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 颏成形术为四级手术，假体隆颏级别以机构核准为准</text></svg>