<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t52f1 d52f1">
  <title id="t52f1">鸡眼的芯来自压力</title>
  <desc id="d52f1">鸡眼是局部长期压力形成的圆锥形角质栓垂直受压时疼</desc>
  <defs>
    <linearGradient id="bg52f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh52f1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .col { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg52f1)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh52f1)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 52</text>
  <text x="52" y="92" class="title">鸡眼和胼胝不是一回事</text>
  <text x="52" y="116" class="kicker">鸡眼有"芯"，垂直受压时疼；胼胝是广而浅的硬茧</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 两列对照 -->
  <rect x="52" y="150" width="340" height="34" rx="8" fill="#B5654A"/>
  <text x="222" y="172" class="col" text-anchor="middle">鸡眼</text>
  <rect x="52" y="188" width="340" height="218" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <!-- 圆锥形角质栓示意 -->
  <g transform="translate(110,260)">
    <path d="M -30 -20 L 30 -20 L 6 50 L -6 50 Z" fill="#C9A876" stroke="#7a3a25" stroke-width="1.5"/>
    <ellipse cx="0" cy="-20" rx="30" ry="6" fill="#B5654A"/>
    <line x1="0" y1="-20" x2="0" y2="50" stroke="#7a3a25" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="40" y="0" class="small">圆锥形角质栓</text>
    <text x="40" y="20" class="small" fill="#B5654A">尖端向内</text>
    <text x="40" y="40" class="small">像扎进一颗钉子</text>
  </g>
  <text x="222" y="380" class="small" text-anchor="middle">垂直受压时刺痛</text>

  <rect x="408" y="150" width="340" height="34" rx="8" fill="#7A8B6F"/>
  <text x="578" y="172" class="col" text-anchor="middle">胼胝</text>
  <rect x="408" y="188" width="340" height="218" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <!-- 广而浅硬茧示意 -->
  <g transform="translate(530,260)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="#C9A876" opacity="0.7"/>
    <ellipse cx="0" cy="-2" rx="40" ry="14" fill="#C9A876"/>
    <text x="70" y="-10" class="small">广而浅的硬茧</text>
    <text x="70" y="10" class="small" fill="#5F6E54">边界不清</text>
    <text x="70" y="30" class="small">无明显"芯"</text>
  </g>
  <text x="578" y="380" class="small" text-anchor="middle">挤压或侧压时不适，垂直压痛较轻</text>

  <!-- 常见部位条 -->
  <text x="52" y="412" class="nodeTitle">鸡眼常见部位</text>
  <rect x="52" y="422" width="160" height="18" rx="6" fill="#7A8B6F"/>
  <text x="132" y="435" class="small" text-anchor="middle" fill="#ffffff">脚趾背</text>
  <rect x="222" y="422" width="160" height="18" rx="6" fill="#7A8B6F"/>
  <text x="302" y="435" class="small" text-anchor="middle" fill="#ffffff">趾缝（软鸡眼）</text>
  <rect x="392" y="422" width="160" height="18" rx="6" fill="#7A8B6F"/>
  <text x="472" y="435" class="small" text-anchor="middle" fill="#ffffff">前掌</text>
  <rect x="562" y="422" width="186" height="18" rx="6" fill="#C9A876"/>
  <text x="655" y="435" class="small" text-anchor="middle" fill="#ffffff">小趾外侧</text>

  <text x="52" y="466" class="footer">健康科普示意 · 诊断与处理须由专业人员评估</text>
</svg>
