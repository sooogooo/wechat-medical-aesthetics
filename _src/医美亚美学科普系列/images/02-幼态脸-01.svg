<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="幼态脸的视觉特征">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">幼态脸的典型特征</text>

  <!-- 简化幼态脸 -->
  <ellipse cx="200" cy="170" rx="70" ry="85" fill="#f3efe8" stroke="#a8a39d"/>
  <!-- 大圆眼 -->
  <ellipse cx="175" cy="150" rx="11" ry="9" fill="#2b2a28"/>
  <ellipse cx="225" cy="150" rx="11" ry="9" fill="#2b2a28"/>
  <ellipse cx="178" cy="147" rx="3" ry="3" fill="#ffffff"/>
  <ellipse cx="228" cy="147" rx="3" ry="3" fill="#ffffff"/>
  <!-- 卧蚕 -->
  <path d="M 163 158 Q 175 163 187 158" stroke="#8a7340" stroke-width="2" fill="none"/>
  <path d="M 213 158 Q 225 163 237 158" stroke="#8a7340" stroke-width="2" fill="none"/>
  <!-- 饱满苹果肌 -->
  <ellipse cx="170" cy="185" rx="16" ry="12" fill="#e3c9bd" opacity="0.5"/>
  <ellipse cx="230" cy="185" rx="16" ry="12" fill="#e3c9bd" opacity="0.5"/>
  <!-- 小嘴 -->
  <path d="M 188 205 Q 200 212 212 205" stroke="#b5654a" stroke-width="1.5" fill="none"/>
  <!-- 圆下巴 -->
  <path d="M 175 240 Q 200 255 225 240" stroke="#a8a39d" stroke-width="1" fill="none"/>

  <!-- 特征标注 -->
  <line x1="175" y1="150" x2="350" y2="100" stroke="#a8a39d" stroke-width="1"/>
  <text x="360" y="95" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">大而圆的眼睛</text>
  <text x="360" y="112" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">+ 卧蚕，显幼</text>

  <line x1="175" y1="160" x2="350" y2="135" stroke="#a8a39d" stroke-width="1"/>
  <text x="360" y="132" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">短中庭</text>
  <text x="360" y="149" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">眉到鼻底距离短</text>

  <line x1="180" y1="185" x2="350" y2="180" stroke="#a8a39d" stroke-width="1"/>
  <text x="360" y="177" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">饱满苹果肌</text>
  <text x="360" y="194" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">面颊圆润有肉感</text>

  <line x1="200" y1="245" x2="350" y2="235" stroke="#a8a39d" stroke-width="1"/>
  <text x="360" y="232" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">圆润短下巴</text>
  <text x="360" y="249" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不尖翘、不锐利</text>

  <line x1="140" y1="140" x2="350" y2="280" stroke="#a8a39d" stroke-width="1"/>
  <text x="360" y="277" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">白皙细腻皮肤</text>
  <text x="360" y="294" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">无瑕、通透感</text>
</svg>