<svg xmlns="http://www.w3.org/2000/svg" aria-label="需要联系医生的异常信号" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">⚠ 出现这些，联系医生</text><rect width="280" height="90" x="30" y="55" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="170" y="80" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">数天内</text><text x="50" y="105" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 红肿热痛持续加重、流脓、发热</text><text x="50" y="125" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 广泛皮疹、瘙痒、呼吸困难</text><rect width="280" height="90" x="330" y="55" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="470" y="80" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">即刻</text><text x="350" y="105" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 皮肤发白、花斑、剧痛、视力变化</text><text x="350" y="125" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">（栓塞征象，见第 26 篇）</text><rect width="580" height="80" x="30" y="155" fill="#f4ede0" stroke="#c9a876" rx="8"/><text x="320" y="180" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">数周到数年</text><text x="50" y="205" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 迟发性结节、硬块、不明增生</text><text x="50" y="225" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 反复肿胀、材料移位、轮廓异常</text><text x="320" y="250" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">判断原则：拿不准是不是异常、且症状明显或持续加重时，宁可联系医生确认</text></svg>