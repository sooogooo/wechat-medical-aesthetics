<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="面诊前自我梳理三件事">
  <rect width="640" height="220" fill="#faf8f4" rx="12"/>
  <text x="320" y="32" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">面诊前，先自己想清楚</text>

  <!-- 三个卡片 -->
  <rect x="30" y="55" width="185" height="135" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <circle cx="60" cy="88" r="16" fill="#7a8b6f"/>
  <text x="60" y="93" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">1</text>
  <text x="122" y="88" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#2b2a28">具体诉求</text>
  <text x="45" y="118" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">不是“想变好看”，而是</text>
  <text x="45" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">“泪沟显老”“咬肌方脸”</text>
  <text x="45" y="158" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">越具体，越能判断</text>
  <text x="45" y="178" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">有没有必要注射。</text>

  <rect x="227" y="55" width="185" height="135" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <circle cx="257" cy="88" r="16" fill="#c9a876"/>
  <text x="257" y="93" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">2</text>
  <text x="319" y="88" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#2b2a28">承受边界</text>
  <text x="242" y="118" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">能接受的恢复期、肿胀</text>
  <text x="242" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">淤青、可能的并发症、</text>
  <text x="242" y="158" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">效果不理想和补救成本。</text>
  <text x="242" y="178" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">诚实面对承受力。</text>

  <rect x="424" y="55" width="185" height="135" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <circle cx="454" cy="88" r="16" fill="#8a9a7f"/>
  <text x="454" y="93" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">3</text>
  <text x="516" y="88" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#2b2a28">健康底数</text>
  <text x="439" y="118" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">过敏史、用药（抗凝、</text>
  <text x="439" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">避孕药等）、既往注射、</text>
  <text x="439" y="158" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">妊娠/哺乳、慢性病。</text>
  <text x="439" y="178" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">直接影响方案安全。</text>

  <text x="320" y="208" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">把这三件事想清楚，面诊效率会高很多</text>
</svg>