<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t09a d09a">
  <title id="t09a">面部评估框架与词汇翻译器</title>
  <desc id="d09a">三庭五眼是参考不是尺子，右侧把求美者愿望词汇翻译成医学现实</desc>
  <defs>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .panel{font:700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .lbl{font:500 10.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .word{font:700 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .trans{font:500 10.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect x="30" y="26" width="740" height="448" rx="10" fill="#ffffff" stroke="#e4ddd2"/>
  <text x="56" y="58" class="series">医美咨询师成长教程 · 阶段2 · 09</text>
  <text x="56" y="90" class="title">美学语言 评估框架 + 词汇翻译器</text>
  <text x="56" y="116" class="kicker">客人说的是愿望，不是解剖——咨询师是愿望与医学之间的翻译官</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 左：三庭五眼 -->
  <rect x="56" y="144" width="330" height="304" rx="10" fill="#ffffff" stroke="#a9bba0" stroke-width="1.4"/>
  <text x="72" y="170" class="panel">三庭五眼 · 参考不是尺子</text>

  <ellipse cx="221" cy="300" rx="10" ry="118" fill="#ffffff" stroke="#2B2A28" stroke-width="2"/>
  <!-- 三庭线 -->
  <line x1="145" y1="212" x2="297" y2="212" stroke="#7A8B6F" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="133" y1="288" x2="309" y2="288" stroke="#7A8B6F" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="145" y1="364" x2="297" y2="364" stroke="#7A8B6F" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="126" y="216" class="lbl" text-anchor="end">发际线</text>
  <text x="126" y="292" class="lbl" text-anchor="end">眉线</text>
  <text x="126" y="368" class="lbl" text-anchor="end">鼻底</text>
  <text x="312" y="256" class="lbl">上庭</text>
  <text x="312" y="332" class="lbl">中庭</text>
  <text x="312" y="404" class="lbl">下庭</text>
  <!-- 五眼 -->
  <ellipse cx="186" cy="276" rx="10" ry="7" fill="#ffffff" stroke="#2B2A28" stroke-width="1.2"/>
  <ellipse cx="256" cy="276" rx="10" ry="7" fill="#ffffff" stroke="#2B2A28" stroke-width="1.2"/>
  <text x="221" y="436" class="lbl" text-anchor="middle">五眼：脸宽 ≈ 五只眼睛的宽度 · 动态表情比静态照更真实</text>

  <!-- 右：词汇翻译器 -->
  <rect x="402" y="144" width="344" height="304" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.4"/>
  <text x="418" y="170" class="panel">词汇翻译器：听到愿望，翻译现实</text>
  <rect x="418" y="182" width="76" height="24" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.2"/>
  <text x="456" y="198" class="word" text-anchor="middle">幼态脸</text>
  <text x="506" y="192" class="trans">短中庭 · 圆润减龄 → 多手段组合</text>
  <text x="506" y="206" class="trans">且有"过度幼态不自然"的边界</text>
  <rect x="418" y="216" width="76" height="24" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.2"/>
  <text x="456" y="232" class="word" text-anchor="middle">高级脸</text>
  <text x="506" y="226" class="trans">骨相清晰 · 有留白耐看 → 往往</text>
  <text x="506" y="240" class="trans">要做减法，与堆项目直觉相反</text>
  <rect x="418" y="250" width="76" height="24" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.2"/>
  <text x="456" y="266" class="word" text-anchor="middle">妈生款</text>
  <text x="506" y="260" class="trans">看不出做过 → 宁可不足、分次</text>
  <text x="506" y="274" class="trans">调整，克制比饱和更重要</text>
  <rect x="418" y="284" width="76" height="24" rx="10" fill="#ffffff" stroke="#B5654A" stroke-width="1.2"/>
  <text x="456" y="300" class="word" text-anchor="middle">do脸感</text>
  <text x="506" y="294" class="trans">她不想要的样子 → 过度填充的</text>
  <text x="506" y="308" class="trans">警示词，反向校准方案</text>
  <rect x="418" y="318" width="76" height="24" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.2"/>
  <text x="456" y="334" class="word" text-anchor="middle">抗老</text>
  <text x="506" y="328" class="trans">维持现状而非变年轻 → 慢变量：</text>
  <text x="506" y="342" class="trans">皮肤质地+容量+支撑的综合管理</text>
  <rect x="418" y="358" width="312" height="72" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.2"/>
  <text x="434" y="382" class="trans" font-weight="700" fill="#2B2A28">翻译纪律：先复述愿望 → 再讲现实区间 → 最后交给医生评估</text>
  <text x="434" y="402" class="trans">顺序不能反：上来就泼冷水，客人只会去找敢承诺的人</text>

  <text x="56" y="466" class="footer">审美底线：三型中的庸俗型=把不同的人做成同一张脸 · 放大焦虑能成交，但那是红灯区</text>
</svg>
