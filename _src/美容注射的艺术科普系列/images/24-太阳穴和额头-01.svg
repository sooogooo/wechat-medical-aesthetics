<svg xmlns="http://www.w3.org/2000/svg" aria-label="颞部注射层次示意" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf84f" rx="12"/><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">颞部注射：深部骨面相对安全</text><ellipse cx="320" cy="150" fill="#f3efe8" stroke="#a8a39d" rx="160" ry="90"/><ellipse cx="220" cy="150" fill="#eef0ea" stroke="#7a8b6f" stroke-dasharray="3 2" rx="40" ry="35"/><text x="220" y="155" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">颞部</text><circle cx="210" cy="160" r="7" fill="#7a8b6f"/><line x1="217" x2="280" y1="160" y2="100" stroke="#7a8b6f" stroke-width="1.5"/><text x="290" y="95" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">✓ 深部骨面注射</text><text x="290" y="113" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">骨膜上层次，相对安全</text><circle cx="230" cy="130" r="7" fill="#b5654a"/><line x1="237" x2="280" y1="130" y2="195" stroke="#b5654a" stroke-width="1.5"/><text x="290" y="190" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">⚠ 浅层注射风险高</text><text x="290" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">颞浅静脉及其分支</text><text x="320" y="262" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">颞部血管丰富，层次精准是安全的核心；图为示意</text></svg>