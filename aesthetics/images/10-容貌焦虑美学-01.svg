<svg xmlns="http://www.w3.org/2000/svg" aria-label="容貌焦虑的循环" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">容貌焦虑的循环</text><ellipse cx="160" cy="150" fill="#f7ece6" stroke="#b5654a" rx="70" ry="40"/><text x="160" y="145" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">&quot;我不够美&quot;</text><text x="160" y="163" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">焦虑感</text><path fill="none" stroke="#b5654a" stroke-width="2" marker-end="url(#anx)" d="M 230 150 Q 280 100 330 130"/><ellipse cx="400" cy="150" fill="#f4ede0" stroke="#c9a876" rx="70" ry="40"/><text x="400" y="145" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">寻找&quot;解决方案&quot;</text><text x="400" y="163" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">医美项目</text><path fill="none" stroke="#c9a876" stroke-width="2" marker-end="url(#anx)" d="M 470 150 Q 520 200 480 220"/><ellipse cx="400" cy="240" fill="#eef0ea" stroke="#7a8b6f" rx="70" ry="30"/><text x="400" y="245" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">短暂满足</text><path fill="none" stroke="#7a8b6f" stroke-width="2" marker-end="url(#anx)" d="M 330 240 Q 250 240 200 200"/><text x="240" y="225" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">发现新的&quot;不够&quot;</text><defs><marker id="anx" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><polygon fill="#a8a39d" points="0 0 8 4 0 8"/></marker></defs><text x="320" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">焦虑 → 消费 → 短暂满足 → 新的焦虑——这是一个永不停歇的循环</text></svg>