<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t05a d05a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t05a">四层结构拆解宣传语</title><desc id="d05a">一条宣传语经过四层过滤器：已知内容、不确定内容、销售主张、可自行核验</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.layerName,.slogan{fill:#2b2a28}.slogan{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.layerName{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.item{font:500 11.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段1 · 05</text><text x="56" y="90" class="title">四层结构 这句话该信多少？</text><text x="56" y="116" class="kicker">任何医美信息都能诚实分层——它既是消费者的盾牌，也是你的话术体检表</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="560" height="34" x="120" y="144" fill="#fff" stroke="#c9c9c4" stroke-width="1.2" rx="10"/><text x="400" y="166" class="slogan" text-anchor="middle">示例宣传语：&quot;进口玻尿酸，自然维持两年，绝对安全&quot;</text><path fill="none" stroke="#A8A39D" stroke-width="1.8" d="M400 182 L400 200 M394 194 L400 202 L406 194"/><rect width="330" height="52" x="56" y="204" fill="#fff" stroke="#7A8B6F" stroke-width="1.5" rx="10"/><text x="72" y="226" class="layerName">① 已知内容</text><text x="72" y="245" class="item">有公认证据：玻尿酸是常见填充材料</text><rect width="330" height="52" x="414" y="204" fill="#fff" stroke="#C9A876" stroke-width="1.5" rx="10"/><text x="430" y="226" class="layerName">② 不确定内容</text><text x="430" y="245" class="item">&quot;维持两年&quot;因产品部位代谢而异</text><rect width="330" height="52" x="56" y="266" fill="#fff" stroke="#A8A39D" stroke-width="1.5" rx="10"/><text x="72" y="288" class="layerName">③ 销售主张</text><text x="72" y="307" class="item">&quot;进口&quot;&quot;本院专家&quot;——注意利益立场</text><rect width="330" height="52" x="414" y="266" fill="#fff" stroke="#7d8ba3" stroke-width="1.5" rx="10"/><text x="430" y="288" class="layerName">④ 可自行核验</text><text x="430" y="307" class="item">药监批准文号 · 机构与医生资质可查</text><path fill="none" stroke="#A8A39D" stroke-width="1.5" d="M386 230 L406 230 M400 225 L408 230 L400 235"/><path fill="none" stroke="#A8A39D" stroke-width="1.5" d="M400 260 L400 264"/><rect width="688" height="94" x="56" y="332" fill="#fff" stroke="#d9b3a6" stroke-width="1.5" rx="10"/><text x="76" y="358" fill="#B5654A" class="layerName">拆解结论</text><text x="76" y="382" class="item">最响亮的&quot;绝对安全&quot;，恰好是最不该出现的表述——&quot;绝对&quot;类承诺违反广告红线</text><text x="76" y="404" class="item">能信的：材料属性（有证据） 该追问的：维持时间（因人而异） 该去查的：批准文号与执业资质</text><text x="56" y="456" class="footer">用法：把你听到（或说出）的每一句话过一遍这四层——自己说出口的话，同样适用</text></svg>