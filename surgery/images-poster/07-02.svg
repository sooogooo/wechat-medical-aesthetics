<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0702 desc0702">
  <title id="title0702">颧骨颧弓手术必须正视的风险</title>
  <desc id="desc0702">面神经损伤、眶周损伤、骨块问题、面部下垂、不对称、出血感染六类风险</desc>
  <defs>
    <linearGradient id="bg0702" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0702" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0702)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0702)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 07</text>
  <text x="62" y="117" class="title">颧骨手术必须正视的风险</text>
  <text x="62" y="153" class="kicker">术式：颧骨体/颧弓截骨、内推、钛板钛钉固定</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle">六类风险 · 术后面部下垂最易被低估</text>

  <!-- 2x3 风险卡 -->
  <!-- 卡1：面神经 -->
  <rect x="62" y="232" width="252" height="135" rx="12" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8"/>
  <text x="82" y="258" class="nodeTitle">面神经损伤</text>
  <text x="82" y="284" class="body">颧支、颞支走行术区</text>
  <text x="82" y="306" class="body">眼睑闭合不全</text>
  <text x="82" y="328" class="body">面部表情不对称</text>
  <text x="82" y="352" class="small">部分可恢复，部分长期存在</text>

  <!-- 卡2：眶周 -->
  <rect x="324" y="232" width="252" height="135" rx="12" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8"/>
  <text x="344" y="258" class="nodeTitle">眶周损伤</text>
  <text x="344" y="284" class="body">颧骨临近眼眶</text>
  <text x="344" y="306" class="body">截骨可能波及眶壁</text>
  <text x="344" y="328" class="body">需精确术前规划</text>
  <text x="344" y="352" class="small">影像评估是基础</text>

  <!-- 卡3：骨块 -->
  <rect x="586" y="232" width="252" height="135" rx="12" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8"/>
  <text x="606" y="258" class="nodeTitle">骨块吸收/不愈合</text>
  <text x="606" y="284" class="body">截骨块位置不稳</text>
  <text x="606" y="306" class="body">固定失效</text>
  <text x="606" y="328" class="body">形态改变或需二次</text>
  <text x="606" y="352" class="small">固定物一般长期留存</text>

  <!-- 卡4：面部下垂（重点突出） -->
  <rect x="62" y="378" width="252" height="135" rx="12" fill="#D55E00" stroke="#D55E00" stroke-width="2"/>
  <text x="82" y="404" class="nodeTitle" fill="#ffffff">术后面部下垂</text>
  <text x="82" y="430" class="body" fill="#ffffff">颧骨手术特有问题</text>
  <text x="82" y="452" class="body" fill="#ffffff">软组织失去骨性支撑</text>
  <text x="82" y="474" class="body" fill="#ffffff">面颊下垂、法令纹加深</text>
  <text x="82" y="498" class="small" fill="#ffe3d4">最易被低估、最影响满意度</text>

  <!-- 卡5：不对称 -->
  <rect x="324" y="378" width="252" height="135" rx="12" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8"/>
  <text x="344" y="404" class="nodeTitle">不对称</text>
  <text x="344" y="430" class="body">左右截骨量差异</text>
  <text x="344" y="452" class="body">固定位置差异</text>
  <text x="344" y="474" class="body">可致面部不对称</text>
  <text x="344" y="498" class="small">绝对对称不可能</text>

  <!-- 卡6：出血感染 -->
  <rect x="586" y="378" width="252" height="135" rx="12" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8"/>
  <text x="606" y="404" class="nodeTitle">出血与感染</text>
  <text x="606" y="430" class="body">术区血供丰富</text>
  <text x="606" y="452" class="body">需具备输血条件</text>
  <text x="606" y="474" class="body">需抢救通道</text>
  <text x="606" y="498" class="small">硬门槛，非可选项</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">皮肤弹性差或年龄偏大者，下垂风险需特别讨论</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 颧骨颧弓成形术须在有相应资质、具备急救能力的机构开展</text>
</svg>
