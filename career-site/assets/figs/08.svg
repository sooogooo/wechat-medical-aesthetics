<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#c9a876" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#c9a876" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">跨界者的四种死法与三个活法</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">被验证过的跨界规律</text><text x="46" y="118" fill="#b5654a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600">四种死法</text><rect width="168" height="88" x="46" y="130" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="130" y="158" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">用自己的套路</text><text x="130" y="182" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">干别人的事</text><rect width="168" height="88" x="228" y="130" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="312" y="158" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">换个圈子</text><text x="312" y="182" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">以为照样吃香</text><rect width="168" height="88" x="410" y="130" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="494" y="158" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">以为看懂了</text><text x="494" y="182" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">其实一窍不通</text><rect width="168" height="88" x="592" y="130" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="676" y="158" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">改变别人的</text><text x="676" y="182" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">圈子规矩</text><text x="46" y="268" fill="#c9a876" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600">三个活法</text><rect width="226" height="96" x="46" y="280" fill="#f4ede0" stroke="#c9a876" stroke-width="1.6" rx="8"/><text x="159" y="310" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">绝对实力碾压</text><text x="159" y="334" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">跨界者多半不成立</text><rect width="226" height="96" x="290" y="280" fill="#f4ede0" stroke="#c9a876" stroke-width="1.6" rx="8"/><text x="403" y="310" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">局部新套路</text><text x="403" y="334" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">窗口收窄但仍在</text><rect width="226" height="96" x="534" y="280" fill="#f4ede0" stroke="#c9a876" stroke-width="1.6" rx="8"/><text x="647" y="310" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">用圈里人做事</text><text x="647" y="334" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">性价比最高的一条</text><text x="400" y="424" fill="#c9a876" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">多数大厂人手里，只有半个活法二</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">输的从来不是实力，是自我评估</text></svg>