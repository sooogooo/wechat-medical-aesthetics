  <text x="363" y="415" class="nodeTitle" text-anchor="middle">医生做医疗决策</text>
  <text x="363" y="433" class="nodeSub" text-anchor="middle">咨询师只做翻译</text>
  <rect x="450" y="394" width="130" height="50" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.5"/>
  <text x="515" y="415" class="nodeTitle" text-anchor="middle">情绪价值</text>
