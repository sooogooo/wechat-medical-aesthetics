<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="800" height="430" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="382" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="46" y="40" width="96" height="30" rx="15" fill="#5f6e54"/><text x="94" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="2">翻 译 器</text><rect x="170" y="40" width="200" height="30" rx="15" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="270" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">新人培养体系</text><text x="392" y="61" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#5f6e54" font-weight="700" text-anchor="middle">⟶</text><rect x="412" y="40" width="200" height="30" rx="15" fill="#edf0ea" stroke="#5f6e54" stroke-width="1.4"/><text x="512" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#5f6e54" font-weight="600" text-anchor="middle">没有体系</text><rect x="46" y="104" width="708" height="84" rx="8" fill="#f5f7f0" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="104" width="6" height="84" rx="3" fill="#7a8b6f"/><text x="74" y="138" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#7a8b6f" font-weight="600">直译 · 成立处</text><text x="74" y="166" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">两边都有新人期的说法，导师制有外形</text><rect x="46" y="204" width="708" height="84" rx="8" fill="#faf3f0" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="204" width="6" height="84" rx="3" fill="#b5654a"/><text x="74" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#b5654a" font-weight="600">失真处</text><text x="74" y="266" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">没有系统只有碎片，成长不被任何流程兜底</text><rect x="46" y="304" width="708" height="84" rx="8" fill="#ffffff" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="304" width="6" height="84" rx="3" fill="#2b2a28"/><text x="74" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" font-weight="600">大厂人的典型错误</text><text x="74" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">等入职培训与转正答辩来证明自己</text>
  <text x="46" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">类比在哪里成立、在哪里失效，看见边界再动手</text>
</svg>