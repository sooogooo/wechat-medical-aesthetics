<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t06f1 d06f1">
  <title id="t06f1">日光性黑子诊断优先级</title>
  <desc id="d06f1">新发变化的斑先诊断排除恶性，再谈美容处理</desc>
  <defs>
    <linearGradient id="bg06f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh06f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg06f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh06f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 06</text>
  <text x="56" y="90" class="title">日光性黑子 先诊断还是先美容</text>
  <text x="56" y="116" class="kicker">新发或变化的斑先让医生看一眼，再谈淡化</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 决策流程 -->
  <rect x="300" y="158" width="200" height="48" rx="10" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.6"/>
  <text x="400" y="188" class="body" text-anchor="middle" font-weight="700">发现褐色小斑</text>

  <path d="M 400 210 L 400 230" stroke="#7d8e93" stroke-width="1.6" fill="none"/>
  <path d="M 395 224 L 400 230 L 405 224" fill="none" stroke="#7d8e93" stroke-width="1.6"/>

  <rect x="240" y="234" width="320" height="44" rx="10" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4"/>
  <text x="400" y="261" class="body" text-anchor="middle">是否新发 颜色不均 快速变化</text>

  <path d="M 320 280 L 180 320" stroke="#B5654A" stroke-width="1.6" fill="none"/>
  <path d="M 480 280 L 620 320" stroke="#7A8B6F" stroke-width="1.6" fill="none"/>

  <!-- 需就医 -->
  <rect x="56" y="324" width="290" height="116" rx="10" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="56" y="324" width="290" height="28" rx="10" fill="#B5654A"/><rect x="56" y="342" width="290" height="10" fill="#B5654A"/>
  <text x="201" y="343" class="tag" text-anchor="middle">先诊断 排除恶性</text>
  <text x="72" y="372" class="body">边界不规则</text>
  <text x="72" y="394" class="body">颜色深浅不均</text>
  <text x="72" y="416" class="body">短期内明显变化</text>
  <text x="72" y="432" class="small" fill="#8a3f2b">不要自行点药水或抠</text>

  <!-- 可美容处理 -->
  <rect x="454" y="324" width="290" height="116" rx="10" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="454" y="324" width="290" height="28" rx="10" fill="#7A8B6F"/><rect x="454" y="342" width="290" height="10" fill="#7A8B6F"/>
  <text x="599" y="343" class="tag" text-anchor="middle">稳定良性 可淡化</text>
  <text x="470" y="372" class="body">边界清楚 颜色均匀</text>
  <text x="470" y="394" class="body">长期稳定无变化</text>
  <text x="470" y="416" class="body">激光或冷冻可选</text>
  <text x="470" y="432" class="small">防晒防累积复发</text>

  <rect x="56" y="448" width="688" height="20" rx="8" fill="#eef4ee"/>
  <text x="400" y="462" class="quote" text-anchor="middle" font-size="14">它本身多为良性，但新发变化的斑先诊断再美容处理</text>
  <text x="400" y="486" class="footer" text-anchor="middle">医学教育示意 · 新发或变化的斑需皮肤科面诊排除恶性后再处理</text>
</svg>
