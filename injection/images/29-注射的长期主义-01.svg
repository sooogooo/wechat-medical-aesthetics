<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="两种注射路径对比">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">两种长期路径，两种走向</text>

  <rect x="30" y="55" width="280" height="180" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="170" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">× 短期消费视角</text>
  <text x="50" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 不同机构、不同医生</text>
  <text x="50" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 无记录、不知道打了什么</text>
  <text x="50" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 每次“再加一点”</text>
  <text x="50" y="184" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 追求单次最大化</text>
  <text x="50" y="207" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 没有停止标准</text>
  <text x="50" y="228" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#b5654a">→ 走向过度、假面</text>

  <rect x="330" y="55" width="280" height="180" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="470" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">✓ 长期管理视角</text>
  <text x="350" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 相对固定的医生</text>
  <text x="350" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 完整的注射档案</text>
  <text x="350" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 遵循材料节奏</text>
  <text x="350" y="184" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 设立停止标准</text>
  <text x="350" y="207" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 定期冷静评估</text>
  <text x="350" y="228" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#5f6e54">→ 长期自然、可控</text>

  <text x="320" y="252" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">“长期主义”不是打得更多，而是打得更可控</text>
</svg>