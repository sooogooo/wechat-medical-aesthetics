<svg xmlns="http://www.w3.org/2000/svg" aria-label="下半脸 codes 风险要点" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">下半脸 codes 的主要风险</text><rect width="280" height="155" x="30" y="55" fill="#fff" stroke="#ece7df" rx="8"/><text x="170" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">血管风险</text><text x="50" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 面动脉及面静脉</text><text x="50" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">（下颌缘区域走行）</text><text x="50" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 颏动静脉（颏部）</text><text x="50" y="184" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">深部骨面注射相对安全</text><rect width="280" height="155" x="330" y="55" fill="#fff" stroke="#ece7df" rx="8"/><text x="470" y="85" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">美学风险</text><text x="350" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 下颌过方、过宽</text><text x="350" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 下巴过长、过翘</text><text x="350" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 男女美学标准不同</text><text x="350" y="184" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">比例与性别考量很重要</text><text x="320" y="230" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">下半脸轮廓直接关系到“方圆”“刚柔”感，美学判断要求高</text></svg>