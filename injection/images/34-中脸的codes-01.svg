<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="中脸 Ck codes 协作示意">
  <rect width="640" height="340" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">苹果肌（Ck）的协作 codes</text>

  <!-- 简化中面部 -->
  <ellipse cx="320" cy="180" rx="130" ry="110" fill="#f3efe8" stroke="#a8a39d"/>

  <!-- Ck1 颧骨前（深层支撑） -->
  <circle cx="285" cy="165" r="18" fill="#5f6e54" opacity="0.5"/>
  <text x="285" y="169" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Ck1</text>
  <line x1="285" y1="165" x2="180" y2="100" stroke="#a8a39d" stroke-width="1"/>
  <text x="100" y="95" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Ck1 颧骨前</text>
  <text x="100" y="112" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">深层支撑核心</text>

  <!-- Ck2 颧弓侧 -->
  <circle cx="355" cy="165" r="18" fill="#7a8b6f" opacity="0.5"/>
  <text x="355" y="169" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Ck2</text>
  <line x1="355" y1="165" x2="460" y2="100" stroke="#a8a39d" stroke-width="1"/>
  <text x="470" y="95" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Ck2 颧弓侧</text>
  <text x="470" y="112" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">外侧衔接</text>

  <!-- Ck3 颊侧 -->
  <circle cx="380" cy="210" r="16" fill="#8a9a7f" opacity="0.5"/>
  <text x="380" y="214" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#ffffff">Ck3</text>
  <line x1="380" y1="210" x2="490" y2="240" stroke="#a8a39d" stroke-width="1"/>
  <text x="500" y="235" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Ck3 颊侧</text>
  <text x="500" y="252" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">面颊凹陷</text>

  <!-- Nl 鼻唇沟 -->
  <ellipse cx="270" cy="230" rx="10" ry="18" fill="#c9a876" opacity="0.4"/>
  <text x="270" y="234" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" font-weight="600" fill="#8a7340">Nl</text>
  <line x1="270" y1="230" x2="160" y2="270" stroke="#a8a39d" stroke-width="1"/>
  <text x="80" y="265" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">Nl 鼻唇沟</text>
  <text x="80" y="282" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">法令纹修饰</text>

  <text x="320" y="315" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">几个 Ck 协作 + Nl 修饰，才能实现中面部整体的年轻化</text>
  <text x="320" y="332" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">图为示意；具体 code 数量与定位以 MD Codes 体系为准</text>
</svg>