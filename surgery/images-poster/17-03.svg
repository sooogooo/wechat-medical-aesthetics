<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1703 desc1703">
  <title id="title1703">鼻整形好看的三个维度</title>
  <desc id="desc1703">好看的鼻子需静态不显形、动态自然、呼吸顺畅，鼻整形修整率本身就高</desc>
  <defs>
    <linearGradient id="bg1703" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1703" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1703)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1703)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 17</text>
  <text x="62" y="117" class="title">完全看不出做过，是有条件的</text>
  <text x="62" y="153" class="kicker">好看的鼻子要过三关：静态、动态、呼吸</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 三个维度卡 -->
  <!-- 卡1：静态 -->
  <rect x="62" y="210" width="250" height="270" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="105" cy="253" r="22" fill="#0072B2"/>
  <text x="105" y="262" class="num" text-anchor="middle">1</text>
  <text x="140" y="260" class="nodeTitle">静态不显形</text>
  <text x="82" y="300" class="body">假体不透光</text>
  <text x="82" y="328" class="body">轮廓自然</text>
  <text x="82" y="356" class="body">左右基本对称</text>
  <rect x="82" y="390" width="210" height="74" rx="8" fill="#eef6f8"/>
  <text x="187" y="413" class="small" text-anchor="middle">瘦、组织薄的人</text>
  <text x="187" y="435" class="small" text-anchor="middle">更易显形</text>
  <text x="187" y="455" class="small" text-anchor="middle">完全看不出不能保证</text>

  <!-- 卡2：动态 -->
  <rect x="325" y="210" width="250" height="270" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="368" cy="253" r="22" fill="#E69F00"/>
  <text x="368" y="262" class="num" text-anchor="middle">2</text>
  <text x="403" y="260" class="nodeTitle">动态自然</text>
  <text x="345" y="300" class="body">表情时鼻部协调</text>
  <text x="345" y="328" class="body">鼻尖随表情微动</text>
  <text x="345" y="356" class="body">无僵硬感</text>
  <rect x="345" y="390" width="210" height="74" rx="8" fill="#fdf3e3"/>
  <text x="450" y="413" class="small" text-anchor="middle">动态不自然</text>
  <text x="450" y="435" class="small" text-anchor="middle">是修整的常见原因</text>
  <text x="450" y="455" class="small" text-anchor="middle">尤其鼻尖过挺</text>

  <!-- 卡3：呼吸 -->
  <rect x="588" y="210" width="250" height="270" rx="16" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="631" cy="253" r="22" fill="#D55E00"/>
  <text x="631" y="262" class="num" text-anchor="middle">3</text>
  <text x="666" y="260" class="nodeTitle">呼吸顺畅</text>
  <text x="608" y="300" class="body">鼻阀不狭窄</text>
  <text x="608" y="328" class="body">鼻中隔不阻塞</text>
  <text x="608" y="356" class="body">下鼻甲正常</text>
  <rect x="608" y="390" width="210" height="74" rx="8" fill="#fbeae3"/>
  <text x="713" y="413" class="small" text-anchor="middle">好看但呼吸不畅</text>
  <text x="713" y="435" class="small" text-anchor="middle">是失败的结果</text>
  <text x="713" y="455" class="small" text-anchor="middle">面诊主动说明鼻塞史</text>

  <!-- 金句 -->
  <rect x="62" y="498" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="524" class="quote" text-anchor="middle">鼻整形修整率本身就高——合理预期比追求完美更重要</text>

  <text x="62" y="558" class="footer">医学教育示意 · 承诺一次成型永久完美的机构，不值得信任</text>
  <text x="62" y="576" class="small">面诊时应主动说明有无鼻塞、打鼾、嗅觉等功能问题</text>
</svg>
