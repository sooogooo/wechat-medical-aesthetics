<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0601 desc0601" role="img" viewBox="0 0 900 620"><title id="title0601">下面部宽大的三种来源</title><desc id="desc0601">骨性宽大、咬肌肥厚、皮下脂肪三种来源对应不同处理方式，截骨只针对骨性</desc><defs><linearGradient id="bg0601" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0601" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0601)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0601)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 06</text><text x="62" y="117" class="title">&quot;脸方想削骨&quot;前先分清来源</text><text x="62" y="153" class="kicker">下面部宽大有三种来源，处理方式完全不同</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">三种来源 · 三种处理</text><rect width="252" height="270" x="62" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><rect width="252" height="44" x="62" y="232" fill="#D55E00" rx="14"/><rect width="252" height="16" x="62" y="260" fill="#D55E00"/><text x="188" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">骨性宽大</text><text x="82" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="82" y="326" class="body">下颌角骨质外翻</text><text x="82" y="348" class="body">触诊摸到硬骨性轮廓</text><text x="82" y="378" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="82" y="400" class="body">下颌角截骨成形</text><text x="82" y="422" class="body">（四级手术）</text><rect width="212" height="48" x="82" y="438" fill="#fbeae3" rx="8"/><text x="188" y="458" class="small" text-anchor="middle">截骨针对的对象</text><text x="188" y="476" class="small" text-anchor="middle">影像可确认</text><rect width="252" height="270" x="324" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="252" height="44" x="324" y="232" fill="#E69F00" rx="14"/><rect width="252" height="16" x="324" y="260" fill="#E69F00"/><text x="450" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">咬肌肥厚</text><text x="344" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="344" y="326" class="body">咬紧牙关耳前下方</text><text x="344" y="348" class="body">鼓起的肌肉块</text><text x="344" y="378" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="344" y="400" class="body">注射或部分切除</text><text x="344" y="422" class="body">（不涉及截骨）</text><rect width="212" height="48" x="344" y="438" fill="#fdf3e3" rx="8"/><text x="450" y="458" class="small" text-anchor="middle">削骨解决不了</text><text x="450" y="476" class="small" text-anchor="middle">反而白担四级风险</text><rect width="252" height="270" x="586" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="252" height="44" x="586" y="232" fill="#0072B2" rx="14"/><rect width="252" height="16" x="586" y="260" fill="#0072B2"/><text x="712" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">皮下脂肪堆积</text><text x="606" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="606" y="326" class="body">捏得起的软组织</text><text x="606" y="348" class="body">整体面颊丰满</text><text x="606" y="378" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="606" y="400" class="body">减脂或局部抽吸</text><text x="606" y="422" class="body">（非骨性手术）</text><rect width="212" height="48" x="606" y="438" fill="#eef6f8" rx="8"/><text x="712" y="458" class="small" text-anchor="middle">削骨同样不适用</text><text x="712" y="476" class="small" text-anchor="middle">很多人是混合型</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">骨性宽大是主因时截骨才有意义，判断需面诊和影像</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 下颌角成形术为四级手术，须在有相应资质机构开展</text></svg>