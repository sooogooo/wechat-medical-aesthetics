<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="把握技术型边界的原则">
  <rect width="640" height="220" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">用好技术型的几个原则</text>

  <rect x="30" y="55" width="280" height="70" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="50" y="80" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">✓ 数据是参考，不是标准</text>
  <text x="50" y="100" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">参数辅助判断，不取代审美</text>
  <text x="50" y="116" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">正常范围内即可，不必&quot;最佳值&quot;</text>

  <rect x="330" y="55" width="280" height="70" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="350" y="80" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">✓ 整体协调 > 局部达标</text>
  <text x="350" y="100" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">一个参数不达标但协调的脸</text>
  <text x="350" y="116" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">比全部达标但失协的脸更美</text>

  <rect x="30" y="140" width="280" height="60" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="50" y="165" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">✓ 保留&quot;测不出&quot;的维度</text>
  <text x="50" y="185" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">气质、辨识度、神态比参数重要</text>

  <rect x="330" y="140" width="280" height="60" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="350" y="165" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">✓ 接受正常的不对称</text>
  <text x="350" y="185" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">轻微不对称是真实与生动的来源</text>
</svg>