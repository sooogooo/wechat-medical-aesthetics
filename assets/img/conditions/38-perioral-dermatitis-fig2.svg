<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t38f2 d38f2">
  <title id="t38f2">口周皮炎的护理与就医清单</title>
  <desc id="d38f2">停用可疑激素霜、精简护肤、就医规范用药的护理清单</desc>
  <defs>
    <linearGradient id="bg38f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh38f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg38f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh38f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 38</text>
  <text x="52" y="92" class="title">护理与就医清单</text>
  <text x="52" y="116" class="kicker">先停可疑产品，再精简护肤，顽固或反复须就医</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 列1：先停 -->
  <rect x="52" y="150" width="220" height="36" rx="8" fill="#B5654A"/>
  <text x="162" y="173" class="nodeTitle" text-anchor="middle">先停这些</text>
  <rect x="52" y="190" width="220" height="220" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <circle cx="68" cy="220" r="3" fill="#B5654A"/>
  <text x="80" y="224" class="body">非处方"特效"霜</text>
  <circle cx="68" cy="252" r="3" fill="#B5654A"/>
  <text x="80" y="256" class="body">含激素的复方制剂</text>
  <circle cx="68" cy="284" r="3" fill="#B5654A"/>
  <text x="80" y="288" class="body">来源不明的"中药膏"</text>
  <circle cx="68" cy="316" r="3" fill="#B5654A"/>
  <text x="80" y="320" class="body">厚重遮瑕、粉底</text>
  <circle cx="68" cy="348" r="3" fill="#B5654A"/>
  <text x="80" y="352" class="body">含氟牙膏（部分人）</text>
  <circle cx="68" cy="380" r="3" fill="#B5654A"/>
  <text x="80" y="384" class="body">面部强效清洁</text>

  <!-- 列2：精简护肤 -->
  <rect x="290" y="150" width="220" height="36" rx="8" fill="#7A8B6F"/>
  <text x="400" y="173" class="nodeTitle" text-anchor="middle">精简护肤</text>
  <rect x="290" y="190" width="220" height="220" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <circle cx="306" cy="220" r="3" fill="#5F6E54"/>
  <text x="318" y="224" class="body">温水洁面，少摩擦</text>
  <circle cx="306" cy="252" r="3" fill="#5F6E54"/>
  <text x="318" y="256" class="body">无香精保湿乳</text>
  <circle cx="306" cy="284" r="3" fill="#5F6E54"/>
  <text x="318" y="288" class="body">暂停所有功效型产品</text>
  <circle cx="306" cy="316" r="3" fill="#5F6E54"/>
  <text x="318" y="320" class="body">物理防晒，避免刺激</text>
  <circle cx="306" cy="348" r="3" fill="#5F6E54"/>
  <text x="318" y="352" class="body">不舔唇不揉搓</text>
  <circle cx="306" cy="380" r="3" fill="#5F6E54"/>
  <text x="318" y="384" class="body">记录可疑诱因</text>

  <!-- 列3：及时就医 -->
  <rect x="528" y="150" width="220" height="36" rx="8" fill="#C9A876"/>
  <text x="638" y="173" class="nodeTitle" text-anchor="middle">及时就医</text>
  <rect x="528" y="190" width="220" height="220" rx="10" fill="#fbf5ea" stroke="#C9A876"/>
  <circle cx="544" cy="220" r="3" fill="#C9A876"/>
  <text x="556" y="224" class="body">反复超过两周</text>
  <circle cx="544" cy="252" r="3" fill="#C9A876"/>
  <text x="556" y="256" class="body">范围持续扩大</text>
  <circle cx="544" cy="284" r="3" fill="#C9A876"/>
  <text x="556" y="288" class="body">明显灼痛刺痒</text>
  <circle cx="544" cy="316" r="3" fill="#C9A876"/>
  <text x="556" y="320" class="body">眼周出现红疹</text>
  <circle cx="544" cy="348" r="3" fill="#C9A876"/>
  <text x="556" y="352" class="body">停激素后加重</text>
  <circle cx="544" cy="380" r="3" fill="#C9A876"/>
  <text x="556" y="384" class="body">儿童与孕妇需面诊</text>

  <rect x="52" y="432" width="696" height="32" rx="10" fill="#eef6f8"/>
  <text x="400" y="453" class="quote" text-anchor="middle">停掉可疑产品，是治疗的第一步</text>
  <text x="52" y="466" class="footer">健康科普示意 · 用药方案需由皮肤科医师面诊后制定</text>
</svg>
