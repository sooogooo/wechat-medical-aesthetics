<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t43f2 d43f2" role="img" viewBox="0 0 800 500"><title id="t43f2">皮肤凹陷的处理选择决策</title><desc id="d43f2">依据层次活动度与病因选择松解填充或重建的决策示意</desc><defs><linearGradient id="bg43f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh43f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.step{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg43f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh43f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 43</text><text x="52" y="92" class="title">处理选择决策图</text><text x="52" y="116" class="kicker">先评估层次与活动度，再决定松解、填充或重建</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="160" height="44" x="320" y="150" fill="#2B2A28" rx="12"/><text x="400" y="178" class="step" text-anchor="middle">皮肤凹陷待评估</text><rect width="200" height="50" x="52" y="222" fill="#7A8B6F" rx="12"/><text x="152" y="252" class="step" text-anchor="middle">浅层（真皮为主）</text><rect width="200" height="50" x="300" y="222" fill="#C9A876" rx="12"/><text x="400" y="252" class="step" text-anchor="middle">脂肪层萎缩</text><rect width="200" height="50" x="548" y="222" fill="#B5654A" rx="12"/><text x="648" y="252" class="step" text-anchor="middle">深层粘连牵拉</text><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 360 194 Q 200 210 152 222"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 400 194 L 400 222"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 440 194 Q 600 210 648 222"/><rect width="200" height="120" x="52" y="288" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><text x="64" y="312" class="body">方案</text><text x="64" y="334" class="small">激光磨削</text><text x="64" y="354" class="small">表浅剥脱</text><text x="64" y="374" class="small">瘢痕软化</text><text x="64" y="394" fill="#5F6E54" class="small">改善有限但恢复快</text><rect width="200" height="120" x="300" y="288" fill="#fbf5ea" stroke="#C9A876" rx="10"/><text x="312" y="312" class="body">方案</text><text x="312" y="334" class="small">自体脂肪移植</text><text x="312" y="354" class="small">填充剂注射</text><text x="312" y="374" class="small">需评估血供层次</text><text x="312" y="394" fill="#C9A876" class="small">可能需多次补充</text><rect width="200" height="120" x="548" y="288" fill="#fbf0eb" stroke="#B5654A" rx="10"/><text x="560" y="312" class="body">方案</text><text x="560" y="334" class="small">皮下分离松解</text><text x="560" y="354" class="small">配合填充支撑</text><text x="560" y="374" class="small">严重者手术重建</text><text x="560" y="394" fill="#B5654A" class="small">磨皮无效，勿盲做</text><rect width="696" height="8" x="52" y="420" fill="#C9A876" opacity=".3"/><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">磨皮解决不了深层组织的缺损</text><text x="52" y="470" class="footer">健康科普示意 · 方案选择须医师面诊并评估层次后制定</text></svg>