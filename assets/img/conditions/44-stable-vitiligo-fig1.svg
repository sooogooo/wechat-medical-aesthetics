<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t44f1 d44f1" role="img" viewBox="0 0 800 500"><title id="t44f1">稳定期白癜风要先验稳定</title><desc id="d44f1">表皮或细胞移植前须确认诊断活动度部位等多重稳定条件</desc><defs><linearGradient id="bg44f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh44f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.step{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg44f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh44f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 44</text><text x="52" y="92" class="title">&quot;半年没变&quot;不等于能移植</text><text x="52" y="116" class="kicker">移植前要层层确认，稳定是综合判断而非单一时间</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">四道确认关卡</text><rect width="696" height="50" x="52" y="178" fill="#7A8B6F" rx="12"/><text x="68" y="200" class="step">1 诊断关</text><text x="68" y="220" fill="#f1f7f1" class="step" font-size="12">确认是白癜风，排除其他色素减退病</text><text x="730" y="208" fill="#f1f7f1" class="step" font-size="13" text-anchor="end">伍德灯 + 病史</text><rect width="696" height="50" x="52" y="238" fill="#7A8B6F" rx="12"/><text x="68" y="260" class="step">2 活动度关</text><text x="68" y="280" fill="#f1f7f1" class="step" font-size="12">无新发、无扩大、同形反应阴性</text><text x="730" y="268" fill="#f1f7f1" class="step" font-size="13" text-anchor="end">观察通常6个月以上</text><rect width="696" height="50" x="52" y="298" fill="#C9A876" rx="12"/><text x="68" y="320" class="step">3 部位关</text><text x="68" y="340" fill="#fbf5ea" class="step" font-size="12">面颈躯干效果好，肢端黏膜效果差</text><text x="730" y="328" fill="#fbf5ea" class="step" font-size="13" text-anchor="end">手指嘴唇需充分告知</text><rect width="696" height="50" x="52" y="358" fill="#5F6E54" rx="12"/><text x="68" y="380" class="step">4 身体与期望关</text><text x="68" y="400" fill="#f1f7f1" class="step" font-size="12">无活动感染、瘢痕体质，期望合理</text><text x="730" y="388" fill="#f1f7f1" class="step" font-size="13" text-anchor="end">复色是渐进的</text><path fill="none" stroke="#5F6E54" stroke-width="2" d="M 400 228 L 400 238"/><path fill="none" stroke="#5F6E54" stroke-width="2" d="M 394 232 L 400 238 L 406 232"/><path fill="none" stroke="#5F6E54" stroke-width="2" d="M 400 288 L 400 298"/><path fill="none" stroke="#5F6E54" stroke-width="2" d="M 394 292 L 400 298 L 406 292"/><path fill="none" stroke="#5F6E54" stroke-width="2" d="M 400 348 L 400 358"/><path fill="none" stroke="#5F6E54" stroke-width="2" d="M 394 352 L 400 358 L 406 352"/><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">稳定不是&quot;看着没变&quot;，而是综合判断</text><text x="52" y="466" class="footer">健康科普示意 · 是否适合移植须由皮肤科医师评估</text></svg>