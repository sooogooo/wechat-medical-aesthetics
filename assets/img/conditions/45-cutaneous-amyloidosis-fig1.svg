<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t45f1 d45f1">
  <title id="t45f1">皮肤淀粉样变的两种表现</title>
  <desc id="d45f1">小腿褐色粗糙丘疹和背部波纹样色斑两种局限表现及越抓越痒循环</desc>
  <defs>
    <linearGradient id="bg45f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh45f1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .card { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .step { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg45f1)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh45f1)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 45</text>
  <text x="52" y="92" class="title">两种常见表现，核心都是痒</text>
  <text x="52" y="116" class="kicker">多数局限在皮肤，关键是打断"越抓越痒"</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <text x="52" y="162" class="nodeTitle">两种局限表现</text>

  <!-- 表现1：苔藓样 -->
  <rect x="52" y="176" width="330" height="180" rx="12" fill="#fbf0eb" stroke="#B5654A"/>
  <rect x="52" y="176" width="330" height="32" rx="12" fill="#B5654A"/>
  <rect x="52" y="194" width="330" height="14" fill="#B5654A"/>
  <text x="217" y="197" class="card" text-anchor="middle">苔藓样型（小腿多见）</text>
  <!-- 丘疹示意：点阵 -->
  <g fill="#B5654A" opacity="0.7">
    <circle cx="80" cy="240" r="3"/><circle cx="96" cy="236" r="3"/><circle cx="112" cy="244" r="3"/>
    <circle cx="128" cy="238" r="3"/><circle cx="144" cy="246" r="3"/><circle cx="160" cy="240" r="3"/>
    <circle cx="88" cy="262" r="3"/><circle cx="104" cy="258" r="3"/><circle cx="120" cy="266" r="3"/>
    <circle cx="136" cy="260" r="3"/><circle cx="152" cy="268" r="3"/>
    <circle cx="84" cy="284" r="3"/><circle cx="100" cy="280" r="3"/><circle cx="116" cy="288" r="3"/>
    <circle cx="132" cy="282" r="3"/>
  </g>
  <text x="200" y="248" class="body">褐色粗糙丘疹</text>
  <text x="200" y="270" class="body">密集成片</text>
  <text x="200" y="292" class="body">表面粗糙增厚</text>
  <text x="200" y="314" class="small">常见小腿前侧、对称</text>
  <text x="200" y="334" class="small" fill="#B5654A">剧痒，越抓越厚</text>

  <!-- 表现2：斑状 -->
  <rect x="418" y="176" width="330" height="180" rx="12" fill="#f4f7f1" stroke="#7A8B6F"/>
  <rect x="418" y="176" width="330" height="32" rx="12" fill="#7A8B6F"/>
  <rect x="418" y="194" width="330" height="14" fill="#7A8B6F"/>
  <text x="583" y="197" class="card" text-anchor="middle">斑状型（背部多见）</text>
  <!-- 波纹示意 -->
  <g stroke="#5F6E54" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 440 250 Q 470 240 500 250 T 560 250"/>
    <path d="M 440 268 Q 470 258 500 268 T 560 268"/>
    <path d="M 440 286 Q 470 276 500 286 T 560 286"/>
  </g>
  <text x="580" y="248" class="body">褐色色素斑</text>
  <text x="580" y="270" class="body">网状或波纹样</text>
  <text x="580" y="292" class="body">轻度瘙痒</text>
  <text x="580" y="314" class="small">常见肩胛间区</text>
  <text x="580" y="334" class="small" fill="#5F6E54">易被误为"搓澡没洗净"</text>

  <!-- 越抓越痒循环 -->
  <text x="52" y="380" class="nodeTitle">越抓越痒的恶性循环</text>
  <rect x="52" y="392" width="160" height="32" rx="10" fill="#C9A876"/>
  <text x="132" y="413" class="step" text-anchor="middle">淀粉样物质沉积</text>
  <rect x="232" y="392" width="160" height="32" rx="10" fill="#C9A876"/>
  <text x="312" y="413" class="step" text-anchor="middle">剧烈瘙痒</text>
  <rect x="412" y="392" width="160" height="32" rx="10" fill="#B5654A"/>
  <text x="492" y="413" class="step" text-anchor="middle">反复搔抓摩擦</text>
  <rect x="592" y="392" width="156" height="32" rx="10" fill="#B5654A"/>
  <text x="670" y="413" class="step" text-anchor="middle">皮损加重</text>
  <path d="M 212 408 L 232 408" stroke="#7d8e93" stroke-width="1.5"/>
  <path d="M 392 408 L 412 408" stroke="#7d8e93" stroke-width="1.5"/>
  <path d="M 572 408 L 592 408" stroke="#7d8e93" stroke-width="1.5"/>
  <path d="M 670 424 Q 670 440 132 440 L 132 424" stroke="#7d8e93" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <text x="52" y="466" class="footer">健康科普示意 · 确诊与系统排查需皮肤科医师评估</text>
</svg>
