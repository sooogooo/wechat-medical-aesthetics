<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t38f1 d38f1">
  <title id="t38f1">口周皮炎的恶性循环</title>
  <desc id="d38f1">口周皮炎表现为嘴周红疹脱屑，长期外用激素会掩盖并加重反复</desc>
  <defs>
    <linearGradient id="bg38f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh38f1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .step { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg38f1)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh38f1)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 38</text>
  <text x="52" y="92" class="title">越涂激素越反复的恶性循环</text>
  <text x="52" y="116" class="kicker">口周皮炎常在嘴鼻眼周出现红疹，唇红缘附近可留一圈空白</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 左：典型表现示意（概念圈） -->
  <text x="52" y="162" class="nodeTitle">典型分布</text>
  <ellipse cx="160" cy="270" rx="90" ry="80" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.5"/>
  <text x="160" y="232" class="body" text-anchor="middle">嘴周 / 鼻翼</text>
  <text x="160" y="252" class="body" text-anchor="middle">眼周偶发</text>
  <ellipse cx="160" cy="296" rx="34" ry="22" fill="#ffffff" stroke="#B5654A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="160" y="300" class="small" text-anchor="middle">唇红缘</text>
  <text x="160" y="316" class="small" text-anchor="middle">留一圈空白</text>
  <text x="160" y="362" class="small" text-anchor="middle">红色小丘疹</text>
  <text x="160" y="380" class="small" text-anchor="middle">脱屑、灼痒</text>

  <!-- 右：循环流程 -->
  <text x="290" y="162" class="nodeTitle">激素掩盖下的反复循环</text>
  <rect x="300" y="178" width="200" height="56" rx="12" fill="#5F6E54"/>
  <text x="400" y="202" class="step" text-anchor="middle">初发红疹灼痒</text>
  <text x="400" y="222" class="step" text-anchor="middle" font-size="12">误当过敏、湿疹</text>

  <rect x="540" y="178" width="200" height="56" rx="12" fill="#C9A876"/>
  <text x="640" y="202" class="step" text-anchor="middle">外用激素/强效霜</text>
  <text x="640" y="222" class="step" text-anchor="middle" font-size="12">短期快速消退</text>

  <rect x="540" y="270" width="200" height="56" rx="12" fill="#B5654A"/>
  <text x="640" y="294" class="step" text-anchor="middle">停药即反弹</text>
  <text x="640" y="314" class="step" text-anchor="middle" font-size="12">范围扩大、更红</text>

  <rect x="300" y="270" width="200" height="56" rx="12" fill="#B5654A"/>
  <text x="400" y="294" class="step" text-anchor="middle">再涂激素压制</text>
  <text x="400" y="314" class="step" text-anchor="middle" font-size="12">依赖加深</text>

  <rect x="420" y="362" width="200" height="46" rx="12" fill="#5F6E54"/>
  <text x="520" y="390" class="step" text-anchor="middle">规范停激素 + 医师方案</text>

  <!-- 循环箭头 -->
  <path d="M 500 206 L 540 206" stroke="#7d8e93" stroke-width="2" fill="none"/>
  <path d="M 534 200 L 540 206 L 534 212" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 640 234 L 640 270" stroke="#7d8e93" stroke-width="2" fill="none"/>
  <path d="M 634 264 L 640 270 L 646 264" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 540 298 L 500 298" stroke="#7d8e93" stroke-width="2" fill="none"/>
  <path d="M 506 292 L 500 298 L 506 304" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 400 270 L 400 234" stroke="#7d8e93" stroke-width="2" fill="none"/>
  <path d="M 394 240 L 400 234 L 406 240" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 520 362 L 520 326" stroke="#5F6E54" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <path d="M 514 332 L 520 326 L 526 332" fill="none" stroke="#5F6E54" stroke-width="2"/>

  <!-- 金句 -->
  <rect x="52" y="432" width="696" height="32" rx="10" fill="#eef6f8"/>
  <text x="400" y="453" class="quote" text-anchor="middle">越快退红的方法，可能正是加重的原因</text>
  <text x="52" y="466" class="footer">健康科普示意 · 具体诊疗与用药需由皮肤科医师评估</text>
</svg>
