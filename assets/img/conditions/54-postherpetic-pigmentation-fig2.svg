<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t54f2 d54f2">
  <title id="t54f2">带状疱疹后色沉的护理</title>
  <desc id="d54f2">防晒保湿温和淡化和神经痛管理及警示信号的护理清单</desc>
  <defs>
    <linearGradient id="bg54f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh54f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg54f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh54f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 54</text>
  <text x="52" y="92" class="title">护理与淡化清单</text>
  <text x="52" y="116" class="kicker">防晒是主线，神经痛不能忽视，淡化要温和</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 四象限 -->
  <rect x="52" y="150" width="340" height="34" rx="8" fill="#5F6E54"/>
  <text x="222" y="172" class="nodeTitle" text-anchor="middle">色沉护理（温和优先）</text>
  <rect x="52" y="188" width="340" height="116" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <circle cx="68" cy="214" r="3" fill="#5F6E54"/>
  <text x="80" y="218" class="body">严格防晒，物理遮挡为主</text>
  <circle cx="68" cy="242" r="3" fill="#5F6E54"/>
  <text x="80" y="246" class="body">温和清洁、足量保湿</text>
  <circle cx="68" cy="270" r="3" fill="#5F6E54"/>
  <text x="80" y="274" class="body">外用温和淡斑成分</text>
  <circle cx="68" cy="298" r="3" fill="#5F6E54"/>
  <text x="80" y="302" class="small" fill="#B5654A">炎症期勿用强刺激产品</text>

  <rect x="408" y="150" width="340" height="34" rx="8" fill="#7A8B6F"/>
  <text x="578" y="172" class="nodeTitle" text-anchor="middle">瘢痕管理</text>
  <rect x="408" y="188" width="340" height="116" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <circle cx="424" cy="214" r="3" fill="#5F6E54"/>
  <text x="436" y="218" class="body">痂皮自然脱落，勿撕</text>
  <circle cx="424" cy="242" r="3" fill="#5F6E54"/>
  <text x="436" y="246" class="body">瘢痕稳定后再评估</text>
  <circle cx="424" cy="270" r="3" fill="#5F6E54"/>
  <text x="436" y="274" class="body">可能需激光或注射</text>
  <circle cx="424" cy="298" r="3" fill="#5F6E54"/>
  <text x="436" y="302" class="small" fill="#B5654A">增生性瘢痕需面诊</text>

  <rect x="52" y="318" width="340" height="34" rx="8" fill="#C9A876"/>
  <text x="222" y="340" class="nodeTitle" text-anchor="middle">神经痛管理（不可忽视）</text>
  <rect x="52" y="356" width="340" height="70" rx="10" fill="#fbf5ea" stroke="#C9A876"/>
  <circle cx="68" cy="382" r="3" fill="#C9A876"/>
  <text x="80" y="386" class="body">及时止痛、规律用药</text>
  <circle cx="68" cy="408" r="3" fill="#C9A876"/>
  <text x="80" y="412" class="small">疼痛持续超3个月需疼痛科评估</text>

  <rect x="408" y="318" width="340" height="34" rx="8" fill="#B5654A"/>
  <text x="578" y="340" class="nodeTitle" text-anchor="middle">警示信号</text>
  <rect x="408" y="356" width="340" height="70" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <circle cx="424" cy="382" r="3" fill="#B5654A"/>
  <text x="436" y="386" class="body">同区新水疱、红肿、流脓</text>
  <circle cx="424" cy="408" r="3" fill="#B5654A"/>
  <text x="436" y="412" class="small">眼周受累、剧痛难眠须立即就医</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">色沉会淡，但神经痛要先管好</text>
  <text x="52" y="466" class="footer">健康科普示意 · 治疗方案须由皮肤科或疼痛科医师评估</text>
</svg>
