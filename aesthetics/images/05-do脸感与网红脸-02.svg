<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="do 脸感的形成机制">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">&quot;do 脸感&quot;是怎么产生的</text>

  <rect x="30" y="60" width="180" height="150" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="120" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">过度治疗</text>
  <text x="120" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">每个局部做到极致</text>
  <text x="120" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">缺乏整体协调</text>

  <rect x="230" y="60" width="180" height="150" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">套模板</text>
  <text x="320" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不考虑个人基础</text>
  <text x="320" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">所有人做成一整套</text>

  <rect x="430" y="60" width="180" height="150" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="520" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">滤镜审美</text>
  <text x="520" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">把滤镜效果</text>
  <text x="520" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">搬到现实脸上</text>

  <text x="320" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">本质：把&quot;精致&quot;局部叠加，忽视整体协调与个体基础</text>
</svg>