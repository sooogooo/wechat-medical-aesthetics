<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1701 desc1701" role="img" viewBox="0 0 900 620"><title id="title1701">鼻综合针对的鼻部亚单位</title><desc id="desc1701">鼻综合针对鼻梁、鼻尖、鼻基底、鼻翼、鼻长度等多个亚单位综合调整</desc><defs><linearGradient id="bg1701" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1701" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg1701)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1701)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 17</text><text x="62" y="117" class="title">鼻综合改变的是鼻整体结构</text><text x="62" y="153" class="kicker">不是单纯加一个假体——先具体到要改哪个亚单位</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">鼻的亚单位</text><rect width="330" height="270" x="62" y="230" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><path fill="none" stroke="#0072B2" stroke-width="2" d="M 180 270 Q 175 320 185 370 L 215 370 Q 225 320 220 270 Z"/><circle cx="200" cy="290" r="6" fill="#0072B2"/><line x1="206" x2="240" y1="290" y2="285" stroke="#0072B2" stroke-width="1"/><text x="244" y="289" class="small">鼻梁</text><circle cx="200" cy="360" r="6" fill="#E69F00"/><line x1="206" x2="245" y1="360" y2="365" stroke="#E69F00" stroke-width="1"/><text x="249" y="369" class="small">鼻尖</text><circle cx="180" cy="350" r="5" fill="#009E73"/><line x1="175" x2="140" y1="350" y2="355" stroke="#009E73" stroke-width="1"/><text x="100" y="359" class="small">鼻翼</text><circle cx="200" cy="375" r="5" fill="#CC79A7"/><line x1="200" x2="200" y1="380" y2="405" stroke="#CC79A7" stroke-width="1"/><text x="170" y="420" class="small">鼻基底</text><rect width="290" height="36" x="82" y="450" fill="#eef6f8" rx="6"/><text x="227" y="473" class="small" text-anchor="middle">示意，非教学图 · 多为多项组合</text><text x="420" y="216" class="nodeTitle">每个亚单位的处理</text><rect width="418" height="270" x="420" y="230" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="446" cy="265" r="5" fill="#0072B2"/><text x="464" y="270" class="body">鼻梁低：假体或软骨垫高</text><circle cx="446" cy="298" r="5" fill="#E69F00"/><text x="464" y="303" class="body">鼻尖：圆钝、低平、上旋下旋需重塑</text><circle cx="446" cy="331" r="5" fill="#CC79A7"/><text x="464" y="336" class="body">鼻基底凹陷：填充改善面中凹陷</text><circle cx="446" cy="364" r="5" fill="#009E73"/><text x="464" y="369" class="body">鼻翼宽：鼻翼缩小（会留疤）</text><circle cx="446" cy="397" r="5" fill="#5c6c72"/><text x="464" y="402" class="body">鼻长度、鼻小柱：调整整体比例</text><circle cx="446" cy="430" r="5" fill="#D55E00"/><text x="464" y="435" class="body">功能问题：鼻中隔偏曲、鼻阀狭窄</text><rect width="378" height="32" x="440" y="455" fill="#fbeae3" rx="6"/><text x="629" y="476" class="small" text-anchor="middle">只追求外观忽视功能，可能换来呼吸不畅</text><rect width="776" height="40" x="62" y="515" fill="#eef6f8" rx="12"/><text x="450" y="541" class="quote" text-anchor="middle">想把鼻子变好看——这个诉求太笼统，要先具体到亚单位</text><text x="62" y="582" class="footer">医学教育示意 · 单纯隆鼻通常一级，鼻综合常为二级 · 涉及肋软骨可达三级／四级</text></svg>