  <text x="90" y="198" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28" font-weight="600">三方平台</text><rect x="220" y="180" width="320" height="34" rx="6" fill="#2f4858" opacity="0.75"/><text x="555" y="203" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#6b6864">第二层</text>
  <text x="90" y="268" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28" font-weight="600">医　　生</text><rect x="220" y="250" width="180" height="34" rx="6" fill="#2f4858" opacity="0.45"/><text x="415" y="273" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">被商品化思潮低估</text>
  <text x="90" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28" font-weight="600">医美机构</text><rect x="220" y="322" width="70" height="26" rx="6" fill="#b5654a"/><text x="305" y="341" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#b5654a">最苦 · 2 亿营收利润 600 万已是赢家</text>
  <text x="90" y="396" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#a8a39d">你的岗位大概率在这一层</text>
