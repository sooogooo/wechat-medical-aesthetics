<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t52f2 d52f2" role="img" viewBox="0 0 800 500"><title id="t52f2">鸡眼的处理与禁忌</title><desc id="d52f2">解除挤压是核心糖尿病患者禁自行贴酸需专业处理</desc><defs><linearGradient id="bg52f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh52f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.step{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg52f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh52f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 52</text><text x="52" y="92" class="title">处理与禁忌</text><text x="52" y="116" class="kicker">核心是解除挤压，而不是单纯削掉或贴酸</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">处理三步</text><rect width="220" height="120" x="52" y="178" fill="#7A8B6F" rx="12"/><text x="162" y="204" class="step" text-anchor="middle">1 解除挤压</text><text x="162" y="228" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">换宽头鞋</text><text x="162" y="250" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">使用趾垫、分隔圈</text><text x="162" y="278" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">纠正足部畸形</text><rect width="220" height="120" x="290" y="178" fill="#5F6E54" rx="12"/><text x="400" y="204" class="step" text-anchor="middle">2 软化修薄</text><text x="400" y="228" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">温水浸泡</text><text x="400" y="250" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">由专业人员修薄</text><text x="400" y="278" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">勿自削过深</text><rect width="220" height="120" x="528" y="178" fill="#C9A876" rx="12"/><text x="638" y="204" class="step" text-anchor="middle">3 医师评估</text><text x="638" y="228" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">顽固者考虑冷冻</text><text x="638" y="250" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">或手术处理</text><text x="638" y="278" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">排查足部畸形</text><path stroke="#7d8e93" stroke-width="2" d="M 272 238 L 290 238"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 284 232 L 290 238 L 284 244"/><path stroke="#7d8e93" stroke-width="2" d="M 510 238 L 528 238"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 522 232 L 528 238 L 522 244"/><rect width="340" height="34" x="52" y="314" fill="#B5654A" rx="8"/><text x="222" y="336" class="step" text-anchor="middle">禁忌</text><rect width="340" height="64" x="52" y="352" fill="#fbf0eb" stroke="#B5654A" rx="10"/><circle cx="68" cy="372" r="3" fill="#B5654A"/><text x="80" y="376" class="body">自行长期贴水杨酸胶布</text><circle cx="68" cy="396" r="3" fill="#B5654A"/><text x="80" y="400" class="body">用剪刀、刀片深削</text><rect width="340" height="34" x="408" y="314" fill="#B5654A" rx="8"/><text x="578" y="336" class="step" text-anchor="middle">高危人群（须就医）</text><rect width="340" height="64" x="408" y="352" fill="#fbf0eb" stroke="#B5654A" rx="10"/><circle cx="424" cy="372" r="3" fill="#B5654A"/><text x="436" y="376" class="body">糖尿病、周围血管病</text><circle cx="424" cy="396" r="3" fill="#B5654A"/><text x="436" y="400" class="body">感觉减退、免疫低下者</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">鸡眼是压力的产物，解除压力才不复长</text><text x="52" y="466" class="footer">健康科普示意 · 糖尿病等高危足严禁自行贴酸或修削</text></svg>