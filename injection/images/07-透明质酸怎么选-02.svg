<svg xmlns="http://www.w3.org/2000/svg" aria-label="自然效果的三个维度" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="32" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">“自然”是三个维度的综合</text><rect width="185" height="155" x="30" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="122" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">静态自然</text><text x="50" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">不动时协调</text><text x="50" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">不突兀、不肿胀</text><text x="50" y="161" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">轮廓过渡柔和</text><text x="50" y="184" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">无透光、无结节</text><rect width="185" height="155" x="227" y="55" fill="#f4ede0" stroke="#c9a876" rx="8"/><text x="319" y="85" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">动态自然</text><text x="247" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">笑、说话时协调</text><text x="247" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">表情不受限</text><text x="247" y="161" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">材料随肌肉移动</text><text x="247" y="184" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">不僵硬、不鼓包</text><rect width="185" height="155" x="424" y="55" fill="#eef0ea" stroke="#8a9a7f" rx="8"/><text x="516" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">触感自然</text><text x="444" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">摸起来柔软</text><text x="444" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">无硬结、无颗粒感</text><text x="444" y="161" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">与周围皮肤融合</text><text x="444" y="184" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">无异物感</text><text x="320" y="228" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">三个维度都自然，才是真正的好结果——这依赖材料、层次、剂量的综合判断</text></svg>