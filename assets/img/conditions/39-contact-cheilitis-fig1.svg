<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t39f1 d39f1" role="img" viewBox="0 0 800 500"><title id="t39f1">接触性唇炎的常见诱因</title><desc id="d39f1">唇膏口红牙膏香料及职业接触均可引发唇部干裂脱屑瘙痒灼痛</desc><defs><linearGradient id="bg39f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh39f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.card,.quote{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg39f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh39f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 39</text><text x="52" y="92" class="title">润唇膏越涂越痒，先找过敏原</text><text x="52" y="116" class="kicker">接触性唇炎由反复接触致敏物累积引发，避开诱因是关键</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">常见诱因清单（按接触来源）</text><rect width="210" height="92" x="52" y="176" fill="#fbf0eb" stroke="#B5654A" rx="12"/><rect width="210" height="26" x="52" y="176" fill="#B5654A" rx="12"/><rect width="210" height="8" x="52" y="194" fill="#B5654A"/><text x="157" y="194" fill="#fff" class="card" text-anchor="middle">唇膏 · 口红</text><text x="64" y="222" class="body">羊毛脂、防腐剂</text><text x="64" y="242" class="body">蓖麻油、染色剂</text><text x="64" y="260" class="small">带色带香型更常见</text><rect width="210" height="92" x="278" y="176" fill="#fbf5ea" stroke="#C9A876" rx="12"/><rect width="210" height="26" x="278" y="176" fill="#C9A876" rx="12"/><rect width="210" height="8" x="278" y="194" fill="#C9A876"/><text x="383" y="194" fill="#fff" class="card" text-anchor="middle">牙膏 · 漱口水</text><text x="290" y="222" class="body">肉桂醛、薄荷</text><text x="290" y="242" class="body">氟化物、发泡剂</text><text x="290" y="260" class="small">口角处首发要留意</text><rect width="210" height="92" x="504" y="176" fill="#fbf5ea" stroke="#C9A876" rx="12"/><rect width="210" height="26" x="504" y="176" fill="#C9A876" rx="12"/><rect width="210" height="8" x="504" y="194" fill="#C9A876"/><text x="609" y="194" fill="#fff" class="card" text-anchor="middle">香料 · 精油</text><text x="516" y="222" class="body">香水、空气清新剂</text><text x="516" y="242" class="body">茶树、薰衣草类</text><text x="516" y="260" class="small">天然不等于不过敏</text><rect width="210" height="92" x="52" y="284" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="210" height="26" x="52" y="284" fill="#7A8B6F" rx="12"/><rect width="210" height="8" x="52" y="302" fill="#7A8B6F"/><text x="157" y="302" fill="#fff" class="card" text-anchor="middle">金属 · 义齿</text><text x="64" y="330" class="body">镍、钴、铬</text><text x="64" y="350" class="body">金属牙套、唇钉</text><text x="64" y="368" class="small">接触部位最明显</text><rect width="210" height="92" x="278" y="284" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="210" height="26" x="278" y="284" fill="#7A8B6F" rx="12"/><rect width="210" height="8" x="278" y="302" fill="#7A8B6F"/><text x="383" y="302" fill="#fff" class="card" text-anchor="middle">职业接触</text><text x="290" y="330" class="body">理发、印刷、建筑</text><text x="290" y="350" class="body">染料、溶剂、水泥</text><text x="290" y="368" class="small">长期反复暴露累积</text><rect width="210" height="92" x="504" y="284" fill="#fbf0eb" stroke="#B5654A" rx="12"/><rect width="210" height="26" x="504" y="284" fill="#B5654A" rx="12"/><rect width="210" height="8" x="504" y="302" fill="#B5654A"/><text x="609" y="302" fill="#fff" class="card" text-anchor="middle">食物 · 药物</text><text x="516" y="330" class="body">柑橘、芒果、辛辣</text><text x="516" y="350" class="body">外用或口服药</text><text x="516" y="368" class="small">反复在同一部位</text><text x="52" y="404" class="nodeTitle">典型表现</text><rect width="170" height="14" x="52" y="412" fill="#5F6E54" rx="7"/><text x="137" y="423" fill="#fff" class="small" text-anchor="middle">干裂</text><rect width="170" height="14" x="232" y="412" fill="#5F6E54" rx="7"/><text x="317" y="423" fill="#fff" class="small" text-anchor="middle">脱屑</text><rect width="170" height="14" x="412" y="412" fill="#C9A876" rx="7"/><text x="497" y="423" fill="#fff" class="small" text-anchor="middle">瘙痒灼痛</text><rect width="122" height="14" x="592" y="412" fill="#B5654A" rx="7"/><text x="653" y="423" fill="#fff" class="small" text-anchor="middle">反复增厚</text><rect width="696" height="30" x="52" y="436" fill="#eef6f8" rx="10"/><text x="400" y="456" class="quote" text-anchor="middle">找到并避开过敏原，胜过反复涂药</text><text x="52" y="470" class="footer">健康科普示意 · 明确过敏原可借助斑贴试验，由医师判断</text></svg>