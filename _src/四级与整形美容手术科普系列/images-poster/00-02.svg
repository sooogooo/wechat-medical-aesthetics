<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title00b desc00b">
  <title id="title00b">四级手术的三个硬门槛</title>
  <desc id="desc00b">四级手术对机构、医生、急救能力的三重硬门槛，缺一不可</desc>
  <defs>
    <linearGradient id="bg00b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh00b" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 28px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg00b)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh00b)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 00</text>
  <text x="62" y="117" class="title">四级手术的三个硬门槛</text>
  <text x="62" y="153" class="kicker">机构 · 医生 · 急救——任何一项缺失都不应进行</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 三张门槛卡 -->
  <!-- 卡1：机构 -->
  <rect x="62" y="215" width="250" height="290" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="105" cy="258" r="22" fill="#0072B2"/>
  <text x="105" y="267" class="num" text-anchor="middle">1</text>
  <text x="140" y="265" class="nodeTitle">机构资质</text>
  <text x="82" y="305" class="body">执业许可证核准</text>
  <text x="82" y="332" class="body">床位 · 血库</text>
  <text x="82" y="359" class="body">ICU 或绿色通道</text>
  <text x="82" y="386" class="body">麻醉科配置</text>
  <rect x="82" y="430" width="210" height="50" rx="8" fill="#eef6f8"/>
  <text x="187" y="453" class="small" text-anchor="middle">门诊部一般不核准四级</text>
  <text x="187" y="471" class="small" text-anchor="middle">现场可查执业许可证</text>

  <!-- 卡2：医生 -->
  <rect x="325" y="215" width="250" height="290" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="368" cy="258" r="22" fill="#E69F00"/>
  <text x="368" y="267" class="num" text-anchor="middle">2</text>
  <text x="403" y="265" class="nodeTitle">医生权限</text>
  <text x="345" y="305" class="body">执业范围相符</text>
  <text x="345" y="332" class="body">具备四级手术权限</text>
  <text x="345" y="359" class="body">相当经验与培训</text>
  <text x="345" y="386" class="body">并发症处理能力</text>
  <rect x="345" y="430" width="210" height="50" rx="8" fill="#fdf3e3"/>
  <text x="450" y="453" class="small" text-anchor="middle">执业注册可官方核验</text>
  <text x="450" y="471" class="small" text-anchor="middle">"做过很多例"≠四级权限</text>

  <!-- 卡3：急救 -->
  <rect x="588" y="215" width="250" height="290" rx="16" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="631" cy="258" r="22" fill="#D55E00"/>
  <text x="631" y="267" class="num" text-anchor="middle">3</text>
  <text x="666" y="265" class="nodeTitle">急救能力</text>
  <text x="608" y="305" class="body">出血/气道应急</text>
  <text x="608" y="332" class="body">血备或输血渠道</text>
  <text x="608" y="359" class="body">转诊通道</text>
  <text x="608" y="386" class="body">术后住院监护</text>
  <rect x="608" y="430" width="210" height="50" rx="8" fill="#fbeae3"/>
  <text x="713" y="453" class="small" text-anchor="middle">"全麻当天走"是危险信号</text>
  <text x="713" y="471" class="small" text-anchor="middle">术后需住院监护</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">三项硬门槛，缺任何一项都不应进行</text>

  <text x="62" y="582" class="footer">医学教育示意 · 机构与医师资质以官方核验结果为准</text>
</svg>
