<svg xmlns="http://www.w3.org/2000/svg" aria-label="面部高危注射区域示意图" role="img" viewBox="0 0 400 460"><rect width="400" height="460" fill="#faf8f4" rx="12"/><text x="200" y="28" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">面部高危注射区域（示意）</text><ellipse cx="200" cy="220" fill="#fff" stroke="#ddd6ca" stroke-width="1.5" rx="95" ry="130"/><ellipse cx="168" cy="190" fill="none" stroke="#a8a39d" stroke-width="1" rx="11" ry="6"/><ellipse cx="232" cy="190" fill="none" stroke="#a8a39d" stroke-width="1" rx="11" ry="6"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 200 200 L 194 250 Q 200 256 206 250 Z"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 178 285 Q 200 292 222 285"/><ellipse cx="200" cy="230" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="18" ry="40"/><text x="200" y="160" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">鼻部</text><ellipse cx="200" cy="172" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="16" ry="10"/><ellipse cx="200" cy="130" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="55" ry="22"/><ellipse cx="160" cy="210" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="14" ry="10"/><ellipse cx="240" cy="210" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="14" ry="10"/><ellipse cx="158" cy="262" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="12" ry="18"/><ellipse cx="242" cy="262" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="12" ry="18"/><rect width="320" height="60" x="40" y="380" fill="#fff" stroke="#ece7df" rx="6"/><ellipse cx="65" cy="402" fill="#f7ece6" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="1.5" rx="10" ry="6"/><text x="85" y="406" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">高危区域：血管密集或与眼动脉交通</text><text x="85" y="426" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">这些区域注射需格外谨慎，操作者解剖功底至关重要</text><text x="200" y="450" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">图为示意，实际血管走行个体差异大；不标注 = 非安全区，所有注射都有风险</text></svg>