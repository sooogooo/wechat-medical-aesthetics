<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t07f2 d07f2" role="img" viewBox="0 0 800 500"><title id="t07f2">褐青色痣激光疗程合理预期</title><desc id="d07f2">用颜色层次表避免混合色斑互相拖累，疗程分次进行</desc><defs><linearGradient id="bg07f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh07f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg07f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh07f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 07</text><text x="56" y="90" class="title">激光疗程的合理预期</text><text x="56" y="116" class="kicker">治疗能变淡，不等于所有色素都消失</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">颜色层次表 按深度分区处理</text><rect width="688" height="34" x="56" y="174" fill="#f3efe6" rx="8"/><text x="72" y="196" class="body">浅褐 表皮层 外用药与浅层光电</text><rect width="688" height="34" x="56" y="214" fill="#c9a876" opacity=".5" rx="8"/><text x="72" y="236" class="body">深褐 表皮真皮交界 换肤与中等光电</text><rect width="688" height="34" x="56" y="254" fill="#8a6a3a" opacity=".6" rx="8"/><text x="72" y="276" fill="#fff" class="body">灰蓝 真皮深层 调Q或皮秒多次</text><text x="56" y="318" class="small">混合存在时需分次分区，避免一锅端式高能量导致反黑</text><text x="56" y="348" class="nodeTitle">疗程节奏与退出节点</text><line x1="100" x2="700" y1="390" y2="390" stroke="#cdd8d8" stroke-width="2"/><circle cx="180" cy="390" r="11" fill="#7A8B6F"/><text x="180" y="372" class="body" font-weight="700" text-anchor="middle">首次</text><text x="180" y="416" class="small" text-anchor="middle">先做测试区</text><circle cx="340" cy="390" r="11" fill="#5F6E54"/><text x="340" y="372" class="body" font-weight="700" text-anchor="middle">间隔数月</text><text x="340" y="416" class="small" text-anchor="middle">观察反黑反应</text><circle cx="500" cy="390" r="11" fill="#C9A876"/><text x="500" y="372" class="body" font-weight="700" text-anchor="middle">多次累积</text><text x="500" y="416" class="small" text-anchor="middle">逐步变淡</text><circle cx="660" cy="390" r="11" fill="#B5654A"/><text x="660" y="372" class="body" font-weight="700" text-anchor="middle">可接受</text><text x="660" y="416" class="small" text-anchor="middle">改善而非零斑</text><rect width="688" height="34" x="56" y="436" fill="#eef4ee" rx="10"/><text x="400" y="458" class="quote" text-anchor="middle">把预期写成可实现的句子</text><text x="56" y="474" class="footer">医学教育示意 · 每一程都要有可退出的节点，不追着颜色加码</text></svg>