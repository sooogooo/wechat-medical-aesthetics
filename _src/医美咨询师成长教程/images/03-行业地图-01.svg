<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t03n d03n">
  <title id="t03n">医美的四道门，资质嵌套图</title>
  <desc id="d03n">资质墙把生活美容挡在外面；墙内从医疗美容到手术项目再到四级手术逐层收窄，门槛逐层升高，最内层的四级手术需要机构与医生双重零容忍核验。</desc>
  <defs>
    <marker id="ar03n" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6864"/>
    </marker>
  </defs>

  <!-- 纸面 -->
  <rect width="800" height="500" fill="#faf8f4"/>

  <!-- 页眉 -->
  <text x="180" y="52" fill="#a8a39d" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.18em">NESTED · 资质嵌套</text>
  <text x="180" y="84" fill="#2b2a28" font-size="28" font-family="'Songti SC',Georgia,serif">医美的四道门</text>
  <text x="180" y="106" fill="#6b6864" font-size="12" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从消费美容到四级手术，每进一层都要持证</text>

  <!-- 信任边界：资质墙 -->
  <line x1="148" y1="132" x2="148" y2="416" stroke="#7a8b6f" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <rect x="118" y="120" width="60" height="14" fill="#faf8f4"/>
  <text x="148" y="130" fill="#7a8b6f" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em" text-anchor="middle">资质墙</text>

  <!-- 墙外：生活美容（External） -->
  <rect x="36" y="200" width="88" height="96" rx="6" fill="rgba(43,42,40,0.03)" stroke="rgba(43,42,40,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="220" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em" text-anchor="middle">OUTSIDE</text>
  <text x="80" y="240" fill="#2b2a28" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">生活美容</text>
  <text x="80" y="258" fill="#a8a39d" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">护理 · 美甲 · 按摩</text>
  <text x="80" y="274" fill="#a8a39d" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">不破皮 · 不用药</text>
  <text x="80" y="316" fill="#6b6864" font-size="12" font-family="'Songti SC',Georgia,serif" font-style="italic" text-anchor="middle">墙外行医，即属违法</text>
  <path d="M 128 248 L 140 248" stroke="#6b6864" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#ar03n)"/>

  <!-- L1 消费美容 -->
  <rect x="180" y="136" width="524" height="296" rx="8" fill="rgba(43,42,40,0.015)" stroke="rgba(43,42,40,0.30)" stroke-width="1"/>
  <rect x="196" y="128" width="112" height="16" fill="#faf8f4"/>
  <text x="196" y="140" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em">消费美容 · 市场</text>

  <!-- L2 医疗美容 -->
  <rect x="212" y="172" width="460" height="232" rx="8" fill="rgba(43,42,40,0.025)" stroke="#6b6864" stroke-width="1"/>
  <rect x="228" y="164" width="196" height="16" fill="#faf8f4"/>
  <text x="228" y="176" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em">医疗美容 · 执业许可</text>
  <text x="640" y="196" fill="#a8a39d" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">公立整形科 · 直客机构 · 轻医美连锁 · 渠道机构</text>

  <!-- L3 手术项目 -->
  <rect x="244" y="208" width="396" height="160" rx="8" fill="rgba(43,42,40,0.04)" stroke="#2b2a28" stroke-width="1"/>
  <rect x="260" y="200" width="168" height="16" fill="#faf8f4"/>
  <text x="260" y="212" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em">手术项目 · 外科资质</text>

  <!-- L4 四级手术（焦点） -->
  <rect x="276" y="244" width="332" height="88" rx="8" fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2"/>
  <rect x="292" y="236" width="216" height="16" fill="#faf8f4"/>
  <text x="292" y="248" fill="#7a8b6f" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em">四级手术 · 最高门槛</text>
  <text x="442" y="284" fill="#2b2a28" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">颌面轮廓类手术</text>
  <text x="442" y="306" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">机构资质 + 医生权限 双重核验</text>

  <!-- 层级注释（右缘） -->
  <text x="716" y="148" fill="#a8a39d" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.06em">范围 ↓</text>
  <text x="716" y="424" fill="#a8a39d" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.06em">门槛 ↑</text>

  <!-- 图例（底部横条） -->
  <line x1="180" y1="452" x2="704" y2="452" stroke="rgba(43,42,40,0.12)" stroke-width="0.8"/>
  <text x="180" y="468" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="244" y="460" width="12" height="12" rx="3" fill="rgba(43,42,40,0.015)" stroke="rgba(43,42,40,0.30)" stroke-width="1"/>
  <text x="262" y="470" fill="#6b6864" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">外层 = 更大范围</text>
  <rect x="364" y="460" width="12" height="12" rx="3" fill="rgba(43,42,40,0.04)" stroke="#2b2a28" stroke-width="1"/>
  <text x="382" y="470" fill="#6b6864" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内层 = 更高门槛</text>
  <rect x="496" y="460" width="12" height="12" rx="3" fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2"/>
  <text x="514" y="470" fill="#6b6864" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">焦点 = 零容忍核验</text>
</svg>
