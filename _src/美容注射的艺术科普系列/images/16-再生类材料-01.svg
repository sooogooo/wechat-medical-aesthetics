<svg xmlns="http://www.w3.org/2000/svg" aria-label="再生类与透明质酸对比" role="img" viewBox="0 0 640 300"><rect width="640" height="300" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">两种&quot;填充&quot;，完全不同的逻辑</text><rect width="280" height="220" x="30" y="55" fill="#fff" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><rect width="280" height="36" x="30" y="55" fill="#7a8b6f" rx="8"/><rect width="280" height="10" x="30" y="81" fill="#7a8b6f"/><text x="170" y="79" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">透明质酸</text><text x="50" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">作用：物理填充容积</text><text x="50" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">效果：即刻（注射完可见）</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">成分：交联透明质酸凝胶</text><text x="50" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">维持：6–18 个月</text><rect width="240" height="50" x="50" y="210" fill="#eef0ea" rx="6"/><text x="170" y="230" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">出问题：可酶溶解</text><text x="170" y="248" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">后悔成本相对低</text><rect width="280" height="220" x="330" y="55" fill="#fff" stroke="#8a9a7f" stroke-width="1.5" rx="8"/><rect width="280" height="36" x="330" y="55" fill="#8a9a7f" rx="8"/><rect width="280" height="10" x="330" y="81" fill="#8a9a7f"/><text x="470" y="79" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">再生刺激类</text><text x="350" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">作用：诱导自身胶原增生</text><text x="350" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">效果：渐进（数周到数月）</text><text x="350" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">成分：载体 + 微球（如 PLLA/CaHA）</text><text x="350" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">维持：1–2 年（个体差异大）</text><rect width="240" height="50" x="350" y="210" fill="#f7ece6" rx="6"/><text x="470" y="230" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">出问题：难溶解、难取</text><text x="470" y="248" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">后悔成本高</text><text x="320" y="290" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">同为“填充类”，但可逆性差异巨大——这是决策的核心维度</text></svg>