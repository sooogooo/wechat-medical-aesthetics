<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p5" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#7a8b6f" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#7a8b6f" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">去或不去，一页纸决策</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">三种决定都成立，间隔三天填两次</text><rect width="340" height="58" x="230" y="100" fill="#eef0ea" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="400" y="126" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">事实区 · 我知道要进的是什么吗</text><text x="400" y="146" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" text-anchor="middle">十项核对，任何一项打不了勾就回去重读</text><line x1="400" x2="400" y1="158" y2="178" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/><rect width="340" height="58" x="230" y="180" fill="#eef0ea" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="400" y="206" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">个人区 · 我拿什么进场</text><text x="400" y="226" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" text-anchor="middle">资产负债 · 六个月储备 · 绝不清单</text><line x1="400" x2="400" y1="238" y2="258" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/><rect width="340" height="58" x="230" y="260" fill="#eef0ea" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="400" y="286" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">条件区 · 我要的和我将遇到的</text><text x="400" y="306" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" text-anchor="middle">十条如果那么，右列读完还想进再进</text><line x1="330" x2="180" y1="318" y2="368" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/><line x1="400" x2="400" y1="318" y2="368" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/><line x1="470" x2="620" y1="318" y2="368" stroke="#7a8b6f" stroke-width="1.6" marker-end="url(#ah-p5)"/><rect width="200" height="56" x="80" y="372" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="180" y="396" fill="#7a8b6f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle">进</text><text x="180" y="416" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" text-anchor="middle">带地图进场</text><rect width="200" height="56" x="300" y="372" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="400" y="396" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle">不进</text><text x="400" y="416" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" text-anchor="middle">红绿灯也是救命系统</text><rect width="200" height="56" x="520" y="372" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="620" y="396" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle">再等等</text><text x="620" y="416" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" text-anchor="middle">先完成七项核验</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">地图不替走路的人选路</text></svg>