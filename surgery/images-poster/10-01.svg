<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1001 desc1001">
  <title id="title1001">颌面四级手术的三大风险</title>
  <desc id="desc1001">出血、神经损伤、气道管理三类最严重风险，发生快、后果重</desc>
  <defs>
    <linearGradient id="bg1001" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1001" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 28px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1001)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1001)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 10</text>
  <text x="62" y="117" class="title">颌面四级手术的三大风险</text>
  <text x="62" y="153" class="kicker">发生率不高，但一旦发生就快、就重</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 三大风险卡 -->
  <!-- 卡1：出血 -->
  <rect x="62" y="210" width="252" height="295" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5"/>
  <circle cx="105" cy="253" r="22" fill="#D55E00"/>
  <text x="105" y="262" class="num" text-anchor="middle">!</text>
  <text x="140" y="260" class="nodeTitle">出血</text>

  <text x="82" y="300" class="body" font-weight="700" fill="#17323d">表现</text>
  <text x="82" y="322" class="body">术中术区出血</text>
  <text x="82" y="344" class="body">术后血肿</text>
  <text x="82" y="366" class="body">肿胀迅速加重</text>

  <text x="82" y="396" class="body" font-weight="700" fill="#17323d">机构需具备</text>
  <text x="82" y="418" class="body">麻醉科 · 止血设备</text>
  <text x="82" y="440" class="body">血库或备血渠道</text>
  <text x="82" y="462" class="body">血管造影介入</text>

  <rect x="82" y="472" width="212" height="22" rx="6" fill="#fbeae3"/>
  <text x="188" y="488" class="small" text-anchor="middle">无血备＝裸奔</text>

  <!-- 卡2：神经损伤 -->
  <rect x="324" y="210" width="252" height="295" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5"/>
  <circle cx="367" cy="253" r="22" fill="#D55E00"/>
  <text x="367" y="262" class="num" text-anchor="middle">!</text>
  <text x="402" y="260" class="nodeTitle">神经损伤</text>

  <text x="344" y="300" class="body" font-weight="700" fill="#17323d">表现</text>
  <text x="344" y="322" class="body">下唇、颏部麻木</text>
  <text x="344" y="344" class="body">眼睑闭合不全</text>
  <text x="344" y="366" class="body">面部表情不对称</text>

  <text x="344" y="396" class="body" font-weight="700" fill="#17323d">特点</text>
  <text x="344" y="418" class="body">无法完全避免</text>
  <text x="344" y="440" class="body">多数可恢复</text>
  <text x="344" y="462" class="body">少数长期存在</text>

  <rect x="344" y="472" width="212" height="22" rx="6" fill="#fbeae3"/>
  <text x="450" y="488" class="small" text-anchor="middle">恢复期数月到一年</text>

  <!-- 卡3：气道 -->
  <rect x="586" y="210" width="252" height="295" rx="14" fill="#D55E00" stroke="#D55E00" stroke-width="2.5"/>
  <circle cx="629" cy="253" r="22" fill="#ffffff"/>
  <text x="629" y="262" class="num" text-anchor="middle" fill="#D55E00">!</text>
  <text x="664" y="260" class="nodeTitle" fill="#ffffff">气道问题</text>

  <text x="606" y="300" class="body" font-weight="700" fill="#ffffff">表现</text>
  <text x="606" y="322" class="body" fill="#ffffff">舌根后坠</text>
  <text x="606" y="344" class="body" fill="#ffffff">口底血肿</text>
  <text x="606" y="366" class="body" fill="#ffffff">咽喉肿胀致呼吸困难</text>

  <text x="606" y="396" class="body" font-weight="700" fill="#ffffff">机构需具备</text>
  <text x="606" y="418" class="body" fill="#ffffff">术后监护</text>
  <text x="606" y="440" class="body" fill="#ffffff">气道管理设备</text>
  <text x="606" y="462" class="body" fill="#ffffff">立即建立人工气道</text>

  <rect x="606" y="472" width="212" height="22" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="712" y="488" class="small" text-anchor="middle" fill="#D55E00">最易迅速危及生命</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">这些风险决定机构"出事能不能救"是底线，不是加分项</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 颌面四级手术须在有相应资质、具备急救能力的机构开展</text>
</svg>
