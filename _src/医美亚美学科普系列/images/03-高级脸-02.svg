<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="高级脸命名的阶层暗示">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">&quot;高级&quot;两个字藏着的等级</text>

  <rect x="30" y="60" width="280" height="170" rx="8" fill="#f4ede0" stroke="#c9a876"/>
  <text x="170" y="90" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">&quot;高级脸&quot;暗示</text>
  <text x="50" y="120" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 这种美&quot;更高级&quot;</text>
  <text x="50" y="143" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 与时尚、奢侈品关联</text>
  <text x="50" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 暗示阶层与品味</text>
  <text x="50" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">= 审美的阶层化</text>

  <rect x="330" y="60" width="280" height="170" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="470" y="90" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">被暗示的&quot;低级&quot;</text>
  <text x="350" y="120" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 幼态、甜美 = &quot;低级&quot;</text>
  <text x="350" y="143" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 大众审美 = &quot;没品味&quot;</text>
  <text x="350" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;网红脸&quot; = 被嘲讽</text>
  <text x="350" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">= 新的审美歧视</text>

  <text x="320" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">反抗一种标准，不等于建立另一种标准——否则只是换了规训的对象</text>
</svg>