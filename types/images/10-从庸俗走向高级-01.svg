<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="走向高级型的四个维度">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">走向高级型：四个维度的转变</text>

  <rect x="30" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#7a8b6f" stroke-width="1.5"/>
  <circle cx="100" cy="95" r="16" fill="#7a8b6f"/>
  <text x="100" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">1</text>
  <text x="100" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">观念</text>
  <text x="100" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">从&quot;追逐流行&quot;</text>
  <text x="100" y="188" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">到&quot;认识自己&quot;</text>
  <text x="100" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">先想清</text>
  <text x="100" y="247" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">&quot;我是谁&quot;</text>

  <rect x="180" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#7a8b6f" stroke-width="1.5"/>
  <circle cx="250" cy="95" r="16" fill="#7a8b6f"/>
  <text x="250" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">2</text>
  <text x="250" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">选择</text>
  <text x="250" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">从&quot;选机构&quot;</text>
  <text x="250" y="188" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">到&quot;选医生&quot;</text>
  <text x="250" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">看审美</text>
  <text x="250" y="247" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">而非装修</text>

  <rect x="330" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#7a8b6f" stroke-width="1.5"/>
  <circle cx="400" cy="95" r="16" fill="#7a8b6f"/>
  <text x="400" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text x="400" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">沟通</text>
  <text x="400" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">从&quot;被动接受&quot;</text>
  <text x="400" y="188" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">到&quot;协作决策&quot;</text>
  <text x="400" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">做审美</text>
  <text x="400" y="247" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">合伙人</text>

  <rect x="480" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#7a8b6f" stroke-width="1.5"/>
  <circle cx="550" cy="95" r="16" fill="#7a8b6f"/>
  <text x="550" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">4</text>
  <text x="550" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">长期</text>
  <text x="550" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">从&quot;一次性&quot;</text>
  <text x="550" y="188" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">到&quot;长期主义&quot;</text>
  <text x="550" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">追求耐看</text>
  <text x="550" y="247" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">而非惊艳</text>

  <text x="320" y="310" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">四个维度同时转变，才能稳定地走向高级型</text>
</svg>