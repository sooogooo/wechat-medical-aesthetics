<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="下半脸 codes 协作示意">
  <rect width="640" height="340" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">下颌线（Jw）与颏部（C）的协作</text>

  <!-- 简化下半脸 -->
  <path d="M 200 120 Q 200 250 250 290 L 390 290 Q 440 250 440 120" fill="#f3efe8" stroke="#a8a39d"/>
  <ellipse cx="320" cy="200" rx="120" ry="90" fill="#ffffff" stroke="#a8a39d" stroke-width="0.5" opacity="0.3"/>

  <!-- Jw1 前下颌 -->
  <circle cx="260" cy="265" r="14" fill="#5f6e54" opacity="0.5"/>
  <text x="260" y="269" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#ffffff">Jw1</text>
  <line x1="260" y1="265" x2="140" y2="220" stroke="#a8a39d" stroke-width="1"/>
  <text x="60" y="215" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Jw1 前下颌</text>
  <text x="60" y="232" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">前段轮廓支撑</text>

  <!-- Jw2 中下颌 -->
  <circle cx="240" cy="245" r="14" fill="#7a8b6f" opacity="0.5"/>
  <text x="240" y="249" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#ffffff">Jw2</text>
  <line x1="240" y1="245" x2="120" y2="285" stroke="#a8a39d" stroke-width="1"/>
  <text x="40" y="280" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Jw2 中下颌</text>
  <text x="40" y="297" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">主体轮廓</text>

  <!-- Jw3 后下颌 -->
  <circle cx="215" cy="215" r="14" fill="#8a9a7f" opacity="0.5"/>
  <text x="215" y="219" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#ffffff">Jw3</text>
  <line x1="215" y1="215" x2="120" y2="140" stroke="#a8a39d" stroke-width="1"/>
  <text x="50" y="135" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Jw3 后下颌</text>
  <text x="50" y="152" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">后段衔接</text>

  <!-- C 颏部 -->
  <ellipse cx="320" cy="275" rx="22" ry="16" fill="#c9a876" opacity="0.4"/>
  <text x="320" y="279" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">C</text>
  <line x1="320" y1="275" x2="470" y2="305" stroke="#a8a39d" stroke-width="1"/>
  <text x="490" y="300" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">C 颏部</text>
  <text x="490" y="317" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">下巴支撑与比例</text>

  <text x="320" y="325" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">图为示意；具体 code 数量与定位以 MD Codes 体系为准</text>
</svg>