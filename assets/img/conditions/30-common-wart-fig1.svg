<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t30 d30" role="img" viewBox="0 0 800 500"><title id="t30">手上的“小瘊子”</title><desc id="d30">寻常疣会传染，但不必全家恐慌</desc><defs><linearGradient id="bg30" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh30" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT,.nodeT2{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.nodeT2{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg30)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh30)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 30</text><text x="48" y="92" class="title">手上的“小瘊子”</text><text x="48" y="116" class="kicker">寻常疣会传染，但不必全家恐慌</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">手部硬丘疹的鉴别</text><rect width="220" height="170" x="48" y="188" fill="#fbfdfc" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="48" y="188" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="48" y="206" fill="#7A8B6F"/><text x="158" y="208" fill="#fff" class="nodeT2" text-anchor="middle">寻常疣</text><text x="158" y="238" class="body" text-anchor="middle">表面粗糙的小黑点</text><text x="158" y="256" class="small" text-anchor="middle">HPV皮肤型，可传播</text><rect width="220" height="170" x="290" y="188" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="188" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="206" fill="#C9A876"/><text x="400" y="208" fill="#fff" class="nodeT2" text-anchor="middle">鸡眼</text><text x="400" y="238" class="body" text-anchor="middle">受压部位圆锥形</text><text x="400" y="256" class="small" text-anchor="middle">中央角质栓，边界清</text><rect width="220" height="170" x="532" y="188" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="532" y="188" fill="#B5654A" rx="12"/><rect width="220" height="10" x="532" y="206" fill="#B5654A"/><text x="642" y="208" fill="#fff" class="nodeT2" text-anchor="middle">需活检病变</text><text x="642" y="238" class="body" text-anchor="middle">形态不典型</text><text x="642" y="256" class="small" text-anchor="middle">变化快、出血或溃疡</text><text x="400" y="395" class="small" text-anchor="middle">寻常疣表面粗糙常有小黑点，是血栓毛细血管</text><rect width="704" height="28" x="48" y="410" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="429" class="quote" text-anchor="middle">很多疣会自己退，等待并非放任</text><text x="48" y="462" class="footer">医学教育示意 · 怎么和鸡眼老茧分，决定后续处理</text></svg>