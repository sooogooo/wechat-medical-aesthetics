<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="身体美学的指标清单">
  <rect width="640" height="380" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">&quot;好身材&quot;被拆成的指标</text>

  <!-- 简化人体轮廓 -->
  <ellipse cx="320" cy="80" rx="28" ry="32" fill="#f3efe8" stroke="#a8a39d"/>
  <rect x="290" y="115" width="60" height="20" rx="4" fill="#f3efe8" stroke="#a8a39d"/>
  <path d="M 270 140 L 290 135 L 290 250 L 270 260 Z" fill="#f3efe8" stroke="#a8a39d"/>
  <path d="M 370 140 L 350 135 L 350 250 L 370 260 Z" fill="#f3efe8" stroke="#a8a39d"/>
  <rect x="290" y="135" width="60" height="120" rx="8" fill="#f3efe8" stroke="#a8a39d"/>
  <path d="M 295 255 L 285 350 L 310 355 L 315 255 Z" fill="#f3efe8" stroke="#a8a39d"/>
  <path d="M 325 255 L 330 355 L 355 350 L 345 255 Z" fill="#f3efe8" stroke="#a8a39d"/>

  <!-- 指标标注 -->
  <circle cx="275" cy="135" r="6" fill="#c9a876"/>
  <line x1="275" y1="135" x2="160" y2="110" stroke="#a8a39d"/>
  <text x="155" y="105" text-anchor="end" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">直角肩</text>
  <text x="155" y="120" text-anchor="end" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">肩部平直如角</text>

  <circle cx="305" cy="120" r="6" fill="#c9a876"/>
  <line x1="305" y1="120" x2="155" y2="155" stroke="#a8a39d"/>
  <text x="150" y="150" text-anchor="end" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">天鹅颈</text>
  <text x="150" y="165" text-anchor="end" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">颈细长优雅</text>

  <circle cx="320" cy="180" r="6" fill="#b5654a"/>
  <line x1="320" y1="180" x2="490" y2="155" stroke="#a8a39d"/>
  <text x="495" y="150" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">蚂蚁腰</text>
  <text x="495" y="165" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">腰极细</text>

  <circle cx="320" cy="225" r="6" fill="#b5654a"/>
  <line x1="320" y1="225" x2="495" y2="215" stroke="#a8a39d"/>
  <text x="500" y="210" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">蜜桃臀</text>
  <text x="500" y="225" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">臀饱满上翘</text>

  <circle cx="297" cy="290" r="6" fill="#c9a876"/>
  <line x1="297" y1="290" x2="155" y2="265" stroke="#a8a39d"/>
  <text x="150" y="260" text-anchor="end" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">大腿缝</text>
  <text x="150" y="275" text-anchor="end" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">双腿并拢有缝</text>

  <circle cx="320" cy="350" r="6" fill="#c9a876"/>
  <line x1="320" y1="350" x2="495" y2="320" stroke="#a8a39d"/>
  <text x="500" y="315" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">漫画腿</text>
  <text x="500" y="330" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">腿细长直</text>
</svg>