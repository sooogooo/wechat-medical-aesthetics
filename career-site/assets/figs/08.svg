<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c9a876"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#c9a876"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">跨界者的四种死法与三个活法</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">被验证过的跨界规律</text>

  <text x="46" y="118" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#b5654a" font-weight="600">四种死法</text>
  <rect x="46" y="130" width="168" height="88" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="130" y="158" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">用自己的套路</text><text x="130" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">干别人的事</text>
  <rect x="228" y="130" width="168" height="88" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="312" y="158" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">换个圈子</text><text x="312" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">以为照样吃香</text>
  <rect x="410" y="130" width="168" height="88" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="494" y="158" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">以为看懂了</text><text x="494" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">其实一窍不通</text>
  <rect x="592" y="130" width="168" height="88" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="676" y="158" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">改变别人的</text><text x="676" y="182" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">圈子规矩</text>
  <text x="46" y="268" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#c9a876" font-weight="600">三个活法</text>
  <rect x="46" y="280" width="226" height="96" rx="8" fill="#f4ede0" stroke="#c9a876" stroke-width="1.6"/><text x="159" y="310" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">绝对实力碾压</text><text x="159" y="334" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">跨界者多半不成立</text>
  <rect x="290" y="280" width="226" height="96" rx="8" fill="#f4ede0" stroke="#c9a876" stroke-width="1.6"/><text x="403" y="310" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">局部新套路</text><text x="403" y="334" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">窗口收窄但仍在</text>
  <rect x="534" y="280" width="226" height="96" rx="8" fill="#f4ede0" stroke="#c9a876" stroke-width="1.6"/><text x="647" y="310" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">用圈里人做事</text><text x="647" y="334" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">性价比最高的一条</text>
  <text x="400" y="424" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#c9a876" font-weight="600" text-anchor="middle">多数大厂人手里，只有半个活法二</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">输的从来不是实力，是自我评估</text>
</svg>