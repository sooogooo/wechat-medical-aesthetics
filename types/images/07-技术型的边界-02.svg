<svg xmlns="http://www.w3.org/2000/svg" aria-label="技术型不能衡量的维度" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">技术型衡量不了的&quot;美&quot;</text><rect width="140" height="230" x="30" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="100" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">气质</text><text x="100" y="125" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">清冷、温暖、</text><text x="100" y="143" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">疏离、亲和</text><text x="100" y="175" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">无参数</text><rect width="140" height="230" x="180" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="250" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">辨识度</text><text x="250" y="125" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;像那个人&quot;</text><text x="250" y="143" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">的个人特征</text><text x="250" y="175" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">无参数</text><rect width="140" height="230" x="330" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="400" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">神态</text><text x="400" y="125" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">笑起来的</text><text x="400" y="143" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">感染力</text><text x="400" y="175" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">无参数</text><rect width="140" height="230" x="480" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="550" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">协调感</text><text x="550" y="125" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">五官之间的</text><text x="550" y="143" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">整体节奏</text><text x="550" y="175" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">难以量化</text><text x="320" y="310" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">这些恰恰是&quot;耐看&quot;的核心——而它们都无法用数字衡量</text></svg>