<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0801 desc0801">
  <title id="title0801">牙性还是骨性：要不要正颌</title>
  <desc id="desc0801">牙性由正畸解决，骨性需正颌手术，需正畸与正颌外科联合评估</desc>
  <defs>
    <linearGradient id="bg0801" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0801" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0801)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0801)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 08</text>
  <text x="62" y="117" class="title">牙性还是骨性：要不要正颌</text>
  <text x="62" y="153" class="kicker">"地包天""嘴突"可能是牙性，也可能是骨性</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle">两种来源 · 两种处理</text>

  <!-- 左：牙性 -->
  <rect x="62" y="232" width="388" height="270" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="232" width="388" height="44" rx="14" fill="#0072B2"/>
  <rect x="62" y="260" width="388" height="16" fill="#0072B2"/>
  <text x="256" y="261" class="nodeTitle" fill="#ffffff" text-anchor="middle">牙性</text>

  <text x="82" y="304" class="body" font-weight="700" fill="#17323d">特征</text>
  <text x="82" y="328" class="body">骨骼关系正常</text>
  <text x="82" y="350" class="body">问题在牙齿排列</text>

  <text x="82" y="382" class="body" font-weight="700" fill="#17323d">处理方式</text>
  <text x="82" y="406" class="body">正畸（戴牙套）即可解决</text>
  <text x="82" y="428" class="body">无需手术</text>

  <rect x="82" y="448" width="348" height="40" rx="8" fill="#eef6f8"/>
  <text x="256" y="473" class="small" text-anchor="middle">不是所有嘴突、反颌都需要手术</text>

  <!-- 右：骨性 -->
  <rect x="462" y="232" width="376" height="270" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="462" y="232" width="376" height="44" rx="14" fill="#D55E00"/>
  <rect x="462" y="260" width="376" height="16" fill="#D55E00"/>
  <text x="650" y="261" class="nodeTitle" fill="#ffffff" text-anchor="middle">骨性</text>

  <text x="482" y="304" class="body" font-weight="700" fill="#17323d">特征</text>
  <text x="482" y="328" class="body">上下颌骨位置或大小异常</text>
  <text x="482" y="350" class="body">骨性反颌、前突、偏颌、开颌</text>

  <text x="482" y="382" class="body" font-weight="700" fill="#17323d">处理方式</text>
  <text x="482" y="406" class="body">单纯正畸无法矫正骨骼关系</text>
  <text x="482" y="428" class="body">需正颌手术（四级）</text>

  <rect x="482" y="448" width="336" height="40" rx="8" fill="#fbeae3"/>
  <text x="650" y="473" class="small" text-anchor="middle">正畸 + 正颌外科联合评估</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">判断需头影测量和牙模，不是看自拍</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 正颌手术须在有相应资质机构由具备权限医师开展</text>
</svg>
