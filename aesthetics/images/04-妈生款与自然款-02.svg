<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="妈生款的积极意义">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">为什么&quot;自然款&quot;值得推崇</text>

  <rect x="30" y="60" width="185" height="150" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="122" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">反抗过度整形</text>
  <text x="122" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">对&quot;假面感&quot;</text>
  <text x="122" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;流水线脸&quot;</text>
  <text x="122" y="158" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">的纠偏</text>

  <rect x="227" y="60" width="185" height="150" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">强调克制</text>
  <text x="320" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">减少过度治疗</text>
  <text x="320" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">降低并发症</text>
  <text x="320" y="158" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">和不可逆风险</text>

  <rect x="424" y="60" width="185" height="150" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="516" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">尊重个体差异</text>
  <text x="516" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不套模板</text>
  <text x="516" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">保留辨识度</text>
  <text x="516" y="158" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">反对趋同化</text>

  <text x="320" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">这些是&quot;妈生款&quot;作为审美方向的真正价值</text>
</svg>