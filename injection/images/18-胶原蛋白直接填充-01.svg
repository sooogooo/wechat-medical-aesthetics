<svg xmlns="http://www.w3.org/2000/svg" aria-label="两种胶原思路对比" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">都叫“胶原”，但完全不同</text><rect width="280" height="200" x="30" y="55" fill="#fff" stroke="#7a8b6f" rx="8"/><rect width="280" height="36" x="30" y="55" fill="#7a8b6f" rx="8"/><rect width="280" height="10" x="30" y="81" fill="#7a8b6f"/><text x="170" y="79" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">直接注射胶原蛋白</text><text x="50" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">机制：外源胶原作为填充物</text><text x="50" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">来源：动物源（牛/猪）或重组</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">效果：即刻填充</text><text x="50" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">维持：较短（数月）</text><text x="50" y="214" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">风险：过敏（动物源需皮试）</text><text x="50" y="240" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">类似透明质酸的“填充”逻辑</text><rect width="280" height="200" x="330" y="55" fill="#fff" stroke="#8a9a7f" rx="8"/><rect width="280" height="36" x="330" y="55" fill="#8a9a7f" rx="8"/><rect width="280" height="10" x="330" y="81" fill="#8a9a7f"/><text x="470" y="79" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">刺激自身胶原增生</text><text x="350" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">机制：微球诱导胶原生成</text><text x="350" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">成分：PLLA/CaHA/PCL 等</text><text x="350" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">效果：渐进（数周到数月）</text><text x="350" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">维持：较长（1–2 年）</text><text x="350" y="214" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">风险：迟发结节、难溶解</text><text x="350" y="240" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">再生类材料（见第 16、17 篇）</text><text x="320" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">名称都含“胶原”，但机制、维持、风险差别巨大</text></svg>