<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c9a876"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#c9a876"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">五条入口的实况</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">按进行业的深度排布，每条都是真实路径</text>

  <line x1="70" y1="260" x2="730" y2="260" stroke="#c9a876" stroke-width="2"/>
  <text x="70" y="300" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">隔着玻璃</text>
  <text x="730" y="300" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864" text-anchor="end">全身进场</text>
  <circle cx="130" cy="260" r="7" fill="#c9a876"/><text x="130" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#2b2a28" font-weight="600" text-anchor="middle">平台方</text><text x="130" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">保留互联网身位</text>
  <circle cx="275" cy="260" r="7" fill="#c9a876"/><text x="275" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#2b2a28" font-weight="600" text-anchor="middle">上游厂商</text><text x="275" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">红利最厚正在消退</text>
  <circle cx="415" cy="260" r="7" fill="#c9a876"/><text x="415" y="226" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#2b2a28" font-weight="600" text-anchor="middle">医生 IP</text><text x="415" y="204" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">单点深绑·人身依附</text>
  <circle cx="560" cy="260" r="7" fill="#c9a876"/><text x="560" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#2b2a28" font-weight="600" text-anchor="middle">机构端</text><text x="560" y="352" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">获客手艺换入场券</text>
  <circle cx="690" cy="260" r="7" fill="#c9a876"/><text x="690" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#2b2a28" font-weight="600" text-anchor="middle">咨询师</text><text x="690" y="352" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">最近入口·争议最大</text>
  <text x="400" y="408" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#c9a876" text-anchor="middle">入口选择的本质，是市场采购你哪一角的选择</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">前三条保留身位，后两条全身进场</text>
</svg>