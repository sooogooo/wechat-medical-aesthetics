<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="titleA201 descA201" role="img" viewBox="0 0 900 620"><title id="titleA201">腹直肌分离是怎么形成的</title><desc id="descA201">腹直肌分离形成机制，孕期腹白线撑开、腹直肌分开、产后部分不能恢复</desc><defs><marker id="ahA201" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#b7c6cb" d="M0,0 L10,5 L0,10 z"/></marker><style>.series{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.8px;fill:#7d97a4}.title{font:300 32px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.kicker{font:400 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.nodeTitle{font:500 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.body{font:400 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#4a5a60}.small{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.quote{font:400 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.footer{font:400 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#93a3a8}</style></defs><rect width="899" height="619" x=".5" y=".5" fill="#fff" stroke="#dde5e7" stroke-width="1"/><text x="62" y="64" class="series">腹壁整形 12 讲 · A2</text><text x="62" y="112" class="title">腹直肌分离是怎么形成的</text><text x="62" y="148" class="kicker">妊娠撑开腹白线，产后有人收得回，有人收不回</text><line x1="62" x2="838" y1="172" y2="172" stroke="#e3e9ea" stroke-width="1"/><rect width="225" height="150" x="62" y="205" fill="none" stroke="#0072B2" stroke-width="1.2" rx="10"/><circle cx="102" cy="241" r="17" fill="none" stroke="#0072B2" stroke-width="1.2"/><text x="102" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" text-anchor="middle" style="fill:#0072b2">1</text><text x="132" y="247" class="nodeTitle">孕期</text><text x="84" y="283" class="body">子宫膨大＋激素变化</text><text x="84" y="309" class="body">腹白线被撑开、变薄</text><rect width="225" height="150" x="317" y="205" fill="none" stroke="#D9930D" stroke-width="1.2" rx="10"/><circle cx="357" cy="241" r="17" fill="none" stroke="#D9930D" stroke-width="1.2"/><text x="357" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" text-anchor="middle" style="fill:#d9930d">2</text><text x="387" y="247" class="nodeTitle">分离</text><text x="339" y="283" class="body">两侧腹直肌向两边分开</text><text x="339" y="309" class="body">腹壁兜不住内脏</text><rect width="225" height="150" x="572" y="205" fill="none" stroke="#C75B00" stroke-width="1.2" rx="10"/><circle cx="612" cy="241" r="17" fill="none" stroke="#C75B00" stroke-width="1.2"/><text x="612" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" text-anchor="middle" style="fill:#c75b00">3</text><text x="642" y="247" class="nodeTitle">产后</text><text x="594" y="283" class="body">部分人能自行恢复</text><text x="594" y="309" class="body">部分人收不回、有症状</text><line x1="291" x2="311" y1="280" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahA201)"/><line x1="546" x2="566" y1="280" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahA201)"/><text x="62" y="400" class="small">常见表现（不只影响外观）</text><rect width="178" height="44" x="62" y="414" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="151" y="441" class="small" text-anchor="middle">肚子前突</text><rect width="178" height="44" x="254" y="414" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="343" y="441" class="small" text-anchor="middle">腹壁无力</text><rect width="178" height="44" x="446" y="414" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="535" y="441" class="small" text-anchor="middle">腰背酸痛</text><rect width="178" height="44" x="638" y="414" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="727" y="441" class="small" text-anchor="middle">起身费力</text><line x1="62" x2="838" y1="520" y2="520" stroke="#e3e9ea" stroke-width="1"/><text x="450" y="548" class="quote" text-anchor="middle">分开的不是肌肉力量，是筋膜结构</text><text x="62" y="580" class="footer">医学教育示意 · 分离程度与处理以面诊评估为准</text></svg>