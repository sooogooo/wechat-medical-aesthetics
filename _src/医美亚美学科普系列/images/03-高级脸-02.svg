<svg xmlns="http://www.w3.org/2000/svg" aria-label="高级脸命名的阶层暗示" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">&quot;高级&quot;两个字藏着的等级</text><rect width="280" height="170" x="30" y="60" fill="#f4ede0" stroke="#c9a876" rx="8"/><text x="170" y="90" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">&quot;高级脸&quot;暗示</text><text x="50" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 这种美&quot;更高级&quot;</text><text x="50" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 与时尚、奢侈品关联</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 暗示阶层与品味</text><text x="50" y="195" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">= 审美的阶层化</text><rect width="280" height="170" x="330" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="470" y="90" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">被暗示的&quot;低级&quot;</text><text x="350" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 幼态、甜美 = &quot;低级&quot;</text><text x="350" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 大众审美 = &quot;没品味&quot;</text><text x="350" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;网红脸&quot; = 被嘲讽</text><text x="350" y="195" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">= 新的审美歧视</text><text x="320" y="245" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">反抗一种标准，不等于建立另一种标准——否则只是换了规训的对象</text></svg>