  <text x="52" y="372" class="nodeTitle">处理顺序</text>
  <rect x="52" y="382" width="166" height="40" rx="10" fill="#7A8B6F"/>
  <text x="135" y="398" class="step" text-anchor="middle">1 先诊断</text>
  <text x="135" y="414" class="step" text-anchor="middle" font-size="11" fill="#f1f7f1">明确原因</text>

  <rect x="230" y="382" width="166" height="40" rx="10" fill="#7A8B6F"/>
  <text x="313" y="398" class="step" text-anchor="middle">2 控炎症</text>
  <text x="313" y="414" class="step" text-anchor="middle" font-size="11" fill="#f1f7f1">先稳定活动期</text>

  <rect x="408" y="382" width="166" height="40" rx="10" fill="#C9A876"/>
  <text x="491" y="398" class="step" text-anchor="middle">3 后封闭</text>
