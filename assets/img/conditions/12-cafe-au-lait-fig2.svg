<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t12f2 d12f2">
  <title id="t12f2">咖啡斑治疗复色与现实预期</title>
  <desc id="t12f2">激光能淡化但复色并不少见，治疗前先写下接受复发吗</desc>
  <defs>
    <linearGradient id="bg12f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh12f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg12f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh12f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 12</text>
  <text x="56" y="90" class="title">激光淡化与复色预期</text>
  <text x="56" y="116" class="kicker">治疗前写下接受复发吗，再做决定</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">治疗可能的三种走向</text>

  <rect x="56" y="174" width="220" height="120" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="220" height="28" rx="12" fill="#7A8B6F"/><rect x="56" y="192" width="220" height="10" fill="#7A8B6F"/>
  <text x="166" y="193" class="tag" text-anchor="middle">明显淡化</text>
  <text x="166" y="226" class="body" text-anchor="middle">部分人反应良好</text>
  <text x="166" y="252" class="small" text-anchor="middle">需多次累积</text>
  <text x="166" y="276" class="small" text-anchor="middle">仍需防晒维护</text>

  <rect x="290" y="174" width="220" height="120" rx="12" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="290" y="174" width="220" height="28" rx="12" fill="#C9A876"/><rect x="290" y="192" width="220" height="10" fill="#C9A876"/>
  <text x="400" y="193" class="tag" text-anchor="middle">部分改善</text>
  <text x="400" y="226" class="body" text-anchor="middle">变淡但未消失</text>
  <text x="400" y="252" class="small" text-anchor="middle">边界仍可见</text>
  <text x="400" y="276" class="small" text-anchor="middle">需评估是否继续</text>

  <rect x="524" y="174" width="220" height="120" rx="12" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="524" y="174" width="220" height="28" rx="12" fill="#B5654A"/><rect x="524" y="192" width="220" height="10" fill="#B5654A"/>
  <text x="634" y="193" class="tag" text-anchor="middle">复色</text>
  <text x="634" y="226" class="body" text-anchor="middle">数月后颜色回来</text>
  <text x="634" y="252" class="small" text-anchor="middle">并不少见</text>
  <text x="634" y="276" class="small" text-anchor="middle">需重新评估方案</text>

  <!-- 记录建议 -->
  <text x="56" y="326" class="nodeTitle">家长可做的规范记录</text>
  <rect x="56" y="340" width="688" height="62" rx="10" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4"/>
  <text x="76" y="364" class="body" font-weight="700">数量 位置 大小 颜色变化</text>
  <text x="76" y="386" class="small">每隔数月在相同光线条件下拍照，比天天拿尺量更可靠</text>

  <rect x="56" y="414" width="688" height="36" rx="10" fill="#eef4ee"/>
  <text x="400" y="437" class="quote" text-anchor="middle">不要让一次激光替代完整评估</text>
  <text x="56" y="468" class="footer">医学教育示意 · 多发咖啡斑需排除神经纤维瘤病等系统性疾病</text>
  <text x="56" y="474" class="footer" fill="#68787e"></text>
</svg>
