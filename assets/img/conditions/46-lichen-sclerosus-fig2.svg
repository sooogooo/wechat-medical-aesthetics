<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t46f2 d46f2">
  <title id="t46f2">硬化性苔藓的治疗与警示信号</title>
  <desc id="d46f2">规范外用药长期随访及需警惕癌变信号的处理框架</desc>
  <defs>
    <linearGradient id="bg46f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh46f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .step { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg46f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh46f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 46</text>
  <text x="52" y="92" class="title">治疗框架与警示信号</text>
  <text x="52" y="116" class="kicker">规范治疗 + 长期随访 + 警惕癌变信号</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <text x="52" y="162" class="nodeTitle">治疗三步</text>

  <rect x="52" y="178" width="220" height="160" rx="12" fill="#7A8B6F"/>
  <text x="162" y="204" class="step" text-anchor="middle">1 诱导缓解</text>
  <text x="162" y="230" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">外用强效药物</text>
  <text x="162" y="252" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">按疗程足量使用</text>
  <text x="162" y="274" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">控制炎症与瘙痒</text>
  <text x="162" y="316" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">由医师评估用量</text>

  <rect x="290" y="178" width="220" height="160" rx="12" fill="#5F6E54"/>
  <text x="400" y="204" class="step" text-anchor="middle">2 维持治疗</text>
  <text x="400" y="230" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">逐步减频</text>
  <text x="400" y="252" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">长期小剂量维持</text>
  <text x="400" y="274" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">防止复发</text>
  <text x="400" y="316" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">不可擅自停药</text>

  <rect x="528" y="178" width="220" height="160" rx="12" fill="#C9A876"/>
  <text x="638" y="204" class="step" text-anchor="middle">3 长期随访</text>
  <text x="638" y="230" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">每年定期复查</text>
  <text x="638" y="252" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">监测结构变化</text>
  <text x="638" y="274" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">必要时活检</text>
  <text x="638" y="316" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">警惕癌变信号</text>

  <path d="M 272 258 L 290 258" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 284 252 L 290 258 L 284 264" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 510 258 L 528 258" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 522 252 L 528 258 L 522 264" fill="none" stroke="#7d8e93" stroke-width="2"/>

  <!-- 警示信号 -->
  <text x="52" y="362" class="nodeTitle">需立即复诊的警示信号</text>
  <rect x="52" y="372" width="696" height="52" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <circle cx="70" cy="394" r="3" fill="#B5654A"/>
  <text x="82" y="398" class="body">局部出现持续增厚的硬结或肿块</text>
  <circle cx="70" cy="414" r="3" fill="#B5654A"/>
  <text x="82" y="418" class="body">溃疡长期不愈合、新发疣状突起或反复出血</text>
  <text x="540" y="404" class="small" fill="#B5654A">警惕鳞癌变</text>
  <text x="540" y="420" class="small" fill="#B5654A">发生率低但需筛查</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">症状缓解不等于治愈，随访不能停</text>
  <text x="52" y="466" class="footer">健康科普示意 · 用药与随访方案须由专科医师制定</text>
</svg>
