x="439" y="158" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 推荐项目</text><text x="439" y="195" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">⚠ 最需警惕</text><text x="320" y="290" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">这些工具有用，但都不是&quot;客观真理&quot;——它们的价值取决于使用者</text></svg>