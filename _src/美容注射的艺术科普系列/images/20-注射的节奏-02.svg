<svg xmlns="http://www.w3.org/2000/svg" aria-label="不同材料的补打节奏" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">不同材料，不同的补打节奏</text><rect width="185" height="155" x="30" y="55" fill="#fff" stroke="#7a8b6f" rx="8"/><text x="122" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">透明质酸</text><text x="122" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">6–18 个月</text><text x="122" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">效果消退后补打</text><text x="122" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不要在仍有明显</text><text x="122" y="176" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">效果时就加量</text><text x="122" y="200" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">可溶，相对可控</text><rect width="185" height="155" x="227" y="55" fill="#fff" stroke="#c9a876" rx="8"/><text x="320" y="85" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">肉毒杆菌素</text><text x="320" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">3–6 个月</text><text x="320" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">效果消退后补打</text><text x="320" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">避免过度频繁</text><text x="320" y="176" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">（耐药风险）</text><text x="320" y="200" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">自行代谢，需持续</text><rect width="185" height="155" x="424" y="55" fill="#fff" stroke="#8a9a7f" rx="8"/><text x="516" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">再生刺激类</text><text x="516" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">1–2 年</text><text x="516" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">分次治疗达到效果</text><text x="516" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">每次间隔数周到</text><text x="516" y="176" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">数月，看胶原反应</text><text x="516" y="200" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">难溶，更需克制</text><text x="320" y="230" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">补打节奏遵循材料特性，而不是“想补就补”</text></svg>