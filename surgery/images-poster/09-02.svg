<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0902 desc0902" role="img" viewBox="0 0 900 620"><title id="title0902">下巴方案的选择决策</title><desc id="desc0902">骨性程度、可逆诉求、风险承受力、整体比例四个判断点</desc><defs><linearGradient id="bg0902" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0902" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0902)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0902)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 09</text><text x="62" y="117" class="title">下巴方案的选择决策</text><text x="62" y="153" class="kicker">由医生根据解剖决定，不是&quot;咨询师看一眼就推套餐&quot;</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">四个判断点</text><rect width="377" height="135" x="62" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="105" cy="270" r="22" fill="#D55E00"/><text x="105" y="279" class="num" text-anchor="middle">1</text><text x="140" y="266" class="nodeTitle">骨性后缩程度</text><text x="140" y="296" class="body">明显者：倾向颏成形或正颌</text><text x="140" y="320" class="body">轻度者：假体或注射即可</text><rect width="280" height="22" x="140" y="336" fill="#fbeae3" rx="6"/><text x="280" y="352" class="small" text-anchor="middle">侧位片看骨性颏点位置</text><rect width="377" height="135" x="461" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="504" cy="270" r="22" fill="#E69F00"/><text x="504" y="279" class="num" text-anchor="middle">2</text><text x="539" y="266" class="nodeTitle">是否可逆的诉求</text><text x="539" y="296" class="body">完全不想&quot;动骨&quot;：</text><text x="539" y="320" class="body">假体（可取出）或注射（可吸收）</text><rect width="280" height="22" x="539" y="336" fill="#fdf3e3" rx="6"/><text x="679" y="352" class="small" text-anchor="middle">截骨前移不可逆</text><rect width="377" height="135" x="62" y="380" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="105" cy="418" r="22" fill="#D55E00"/><text x="105" y="427" class="num" text-anchor="middle">3</text><text x="140" y="414" class="nodeTitle">风险承受力</text><text x="140" y="444" class="body">四级手术并发症一旦发生可能较重</text><text x="140" y="468" class="body">不能接受者选低级别方式</text><rect width="280" height="22" x="140" y="484" fill="#fbeae3" rx="6"/><text x="280" y="500" class="small" text-anchor="middle">神经损伤、骨块问题需正视</text><rect width="377" height="135" x="461" y="380" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="504" cy="418" r="22" fill="#0072B2"/><text x="504" y="427" class="num" text-anchor="middle">4</text><text x="539" y="414" class="nodeTitle">整体面部比例</text><text x="539" y="444" class="body">下巴问题常与下颌整体、咬合相关</text><text x="539" y="468" class="body">单纯处理颏部未必最佳</text><rect width="280" height="22" x="539" y="484" fill="#eef6f8" rx="6"/><text x="679" y="500" class="small" text-anchor="middle">下颌整体后缩需正颌（见第 08 篇）</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">判断方式该由医生根据解剖决定，不是看一眼就推套餐</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 颏成形术为四级手术，须在有相应资质机构由具备权限医师开展</text></svg>