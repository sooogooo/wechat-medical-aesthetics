<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1101 desc1101">
  <title id="title1101">肚子松垮的三种来源</title>
  <desc id="desc1101">腹部问题可源于脂肪堆积、皮肤松弛或腹直肌分离，处理方式不同</desc>
  <defs>
    <linearGradient id="bg1101" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1101" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 28px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1101)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1101)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 11</text>
  <text x="62" y="117" class="title">肚子松垮，先分清是哪种松</text>
  <text x="62" y="153" class="kicker">脂肪、皮肤、肌肉——来源不同，处理方式完全不同</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 卡1：脂肪堆积（蓝绿，吸脂为主） -->
  <rect x="62" y="215" width="250" height="290" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="105" cy="258" r="22" fill="#0072B2"/>
  <text x="105" y="267" class="num" text-anchor="middle">1</text>
  <text x="140" y="265" class="nodeTitle">脂肪堆积</text>
  <text x="82" y="305" class="body">以脂肪为主</text>
  <text x="82" y="332" class="body">皮肤弹性尚可</text>
  <text x="82" y="359" class="body">整体肥胖或局部堆积</text>
  <text x="82" y="386" class="body">仰卧时腹部变平</text>
  <rect x="82" y="430" width="210" height="50" rx="8" fill="#eef6f8"/>
  <text x="187" y="453" class="small" text-anchor="middle">处理：以脂肪抽吸为主</text>
  <text x="187" y="471" class="small" text-anchor="middle">不需要四级手术</text>

  <!-- 卡2：皮肤松弛（琥珀，需切除） -->
  <rect x="325" y="215" width="250" height="290" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="368" cy="258" r="22" fill="#E69F00"/>
  <text x="368" y="267" class="num" text-anchor="middle">2</text>
  <text x="403" y="265" class="nodeTitle">皮肤松弛</text>
  <text x="345" y="305" class="body">皮肤明显松垂</text>
  <text x="345" y="332" class="body">常伴妊娠纹</text>
  <text x="345" y="359" class="body">产后或大幅减重后</text>
  <text x="345" y="386" class="body">皮褶堆积</text>
  <rect x="345" y="430" width="210" height="50" rx="8" fill="#fdf3e3"/>
  <text x="450" y="453" class="small" text-anchor="middle">处理：切除多余皮肤</text>
  <text x="450" y="471" class="small" text-anchor="middle">腹壁成形术（四级）</text>

  <!-- 卡3：腹直肌分离（砖红，需收紧肌层） -->
  <rect x="588" y="215" width="250" height="290" rx="16" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="631" cy="258" r="22" fill="#D55E00"/>
  <text x="631" y="267" class="num" text-anchor="middle">3</text>
  <text x="666" y="265" class="nodeTitle">腹直肌分离</text>
  <text x="608" y="305" class="body">产后腹白线松弛</text>
  <text x="608" y="332" class="body">肚子鼓、无力</text>
  <text x="608" y="359" class="body">运动也收不回</text>
  <text x="608" y="386" class="body">仰卧仍鼓起</text>
  <rect x="608" y="430" width="210" height="50" rx="8" fill="#fbeae3"/>
  <text x="713" y="453" class="small" text-anchor="middle">处理：手术收紧肌层</text>
  <text x="713" y="471" class="small" text-anchor="middle">腹壁成形术（四级）</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">只有皮肤松弛或肌肉分离是主因，腹壁成形才有意义</text>

  <text x="62" y="582" class="footer">医学教育示意 · 判断需面诊与体格检查 · 腹壁疝需外科另行评估</text>
</svg>
