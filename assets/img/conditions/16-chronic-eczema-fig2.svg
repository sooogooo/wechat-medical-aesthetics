<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t16f2 d16f2" role="img" viewBox="0 0 800 500"><title id="t16f2">湿疹外用药灭火维持逻辑</title><desc id="d16f2">复发地图与升级就医界线，保湿是每天的底盘</desc><defs><linearGradient id="bg16f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh16f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg16f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh16f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 16</text><text x="56" y="90" class="title">外用药灭火与维持两阶段</text><text x="56" y="116" class="kicker">保湿不是辅助，而是每天的底盘</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">用药逻辑两阶段</text><rect width="335" height="120" x="56" y="174" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="174" fill="#B5654A" rx="12"/><rect width="335" height="10" x="56" y="192" fill="#B5654A"/><text x="72" y="193" class="tag">灭火期 急性发作</text><text x="72" y="224" class="body">按医嘱足量使用抗炎药</text><text x="72" y="250" class="body">快速控制炎症和瘙痒</text><text x="72" y="276" class="small">不要见好就停也不要长期单独用</text><rect width="335" height="120" x="409" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="174" fill="#7A8B6F" rx="12"/><rect width="335" height="10" x="409" y="192" fill="#7A8B6F"/><text x="425" y="193" class="tag">维持期 平稳期</text><text x="425" y="224" class="body">逐步减频或换方案</text><text x="425" y="250" class="body">坚持保湿修复屏障</text><text x="425" y="276" class="small">主动维持比复发再治更重要</text><text x="56" y="324" class="nodeTitle">设一条升级就医的界线</text><rect width="688" height="74" x="56" y="338" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><text x="76" y="362" class="body">出现以下情况及时复诊</text><text x="76" y="384" class="small">大面积渗液结痂 明显感染 持续不愈 影响睡眠</text><text x="76" y="402" class="small">常规方案两周无效或反复加重，需调整诊断或治疗</text><rect width="688" height="36" x="56" y="422" fill="#eef4ee" rx="10"/><text x="400" y="445" class="quote" text-anchor="middle">画一张自己的复发地图，找出真正的诱因</text><text x="56" y="472" class="footer">医学教育示意 · 接触过敏需排查 顽固者可考虑斑贴试验</text></svg>