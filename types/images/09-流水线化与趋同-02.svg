<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="流水线导致趋同">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">流水线的必然结果：趋同</text>

  <!-- 多样脸 → 流水线 → 标准脸 -->
  <ellipse cx="80" cy="120" rx="30" ry="40" fill="#eef0ea" stroke="#7a8b6f"/>
  <ellipse cx="80" cy="115" rx="8" ry="5" fill="#5f6e54" opacity="0.5"/>
  <ellipse cx="80" cy="130" rx="10" ry="6" fill="#5f6e54" opacity="0.5"/>

  <ellipse cx="160" cy="120" rx="28" ry="42" fill="#f4ede0" stroke="#c9a876"/>
  <ellipse cx="160" cy="118" rx="7" ry="6" fill="#8a7340" opacity="0.5"/>

  <ellipse cx="240" cy="120" rx="32" ry="38" fill="#eef0ea" stroke="#8a9a7f"/>
  <ellipse cx="240" cy="125" rx="9" ry="5" fill="#5f6e54" opacity="0.5"/>

  <text x="160" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">不同的脸（有个体差异）</text>

  <!-- 流水线 -->
  <rect x="300" y="100" width="120" height="50" rx="8" fill="#b5654a"/>
  <text x="360" y="122" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">庸俗型流水线</text>
  <text x="360" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#ffffff">套餐 + 模板</text>

  <polygon points="425,125 440,115 440,135" fill="#b5654a"/>

  <!-- 标准脸 -->
  <ellipse cx="510" cy="120" rx="30" ry="40" fill="#f7ece6" stroke="#b5654a"/>
  <ellipse cx="510" cy="115" rx="9" ry="6" fill="#b5654a" opacity="0.6"/>
  <ellipse cx="510" cy="132" rx="11" ry="6" fill="#b5654a" opacity="0.6"/>

  <ellipse cx="580" cy="120" rx="30" ry="40" fill="#f7ece6" stroke="#b5654a"/>
  <ellipse cx="580" cy="115" rx="9" ry="6" fill="#b5654a" opacity="0.6"/>
  <ellipse cx="580" cy="132" rx="11" ry="6" fill="#b5654a" opacity="0.6"/>

  <text x="545" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">趋同的&quot;标准品&quot;</text>

  <text x="320" y="220" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">流水线的本质，是消除输入的差异，产出统一的输出——这与&quot;个体化医美&quot;根本对立</text>
</svg>