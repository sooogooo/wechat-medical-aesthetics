<svg xmlns="http://www.w3.org/2000/svg" aria-label="个性化 vs 套模板" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">个性化 vs 套模板</text><rect width="280" height="150" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="170" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✓ 个性化</text><text x="50" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 评估你的骨骼、肤质、气质</text><text x="50" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 保留你的辨识度</text><text x="50" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 方案为你定制</text><text x="50" y="190" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">&quot;做完还是你，只是更好的你&quot;</text><rect width="280" height="150" x="330" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="470" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✗ 套模板</text><text x="350" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 套用&quot;网红模板&quot;</text><text x="350" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 抹平个人特征</text><text x="350" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 所有人做成一整套</text><text x="350" y="190" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">&quot;做完变成另一个模板脸&quot;</text><text x="320" y="228" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">高级型尊重&quot;你是谁&quot;，庸俗型把人变成&quot;流水线产品&quot;</text></svg>