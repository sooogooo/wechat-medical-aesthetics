<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="走向高级型自检清单">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">走向高级型：自检清单</text>

  <rect x="30" y="60" width="580" height="200" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="50" y="88" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">✓ 这些信号说明你在走向高级型</text>
  <text x="50" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">□ 我能说出&quot;想解决的具体问题&quot;，而非&quot;想变好看&quot;</text>
  <text x="50" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">□ 我与医生直接沟通，而非只与咨询师</text>
  <text x="50" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">□ 我拒绝了不适合的&quot;套餐&quot;或&quot;模板&quot;</text>
  <text x="50" y="184" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">□ 我接受&quot;看不出做过&quot;的结果</text>
  <text x="50" y="207" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">□ 我有停止标准和治疗档案</text>
  <text x="50" y="230" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">□ 我追求&quot;耐看&quot;，不追逐&quot;流行&quot;</text>
  <text x="50" y="253" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">□ 我对庸俗型的话术保持警惕</text>

  <text x="320" y="272" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">每打一个勾，都意味着你向高级型靠近一步</text>
</svg>