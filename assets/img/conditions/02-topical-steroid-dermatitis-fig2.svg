<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t02f2 d02f2">
  <title id="t02f2">屏障修复分阶段与暴露账本</title>
  <desc id="d02f2">减少损伤恢复耐受需分阶段，记录暴露比检测仪更可靠</desc>
  <defs>
    <linearGradient id="bg02f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh02f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg02f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh02f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 02</text>
  <text x="56" y="90" class="title">屏障修复分阶段时间轴</text>
  <text x="56" y="116" class="kicker">减少损伤并恢复耐受，需要的是可执行的节奏</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 时间轴四阶段 -->
  <text x="56" y="158" class="nodeTitle">恢复耐受分四个阶段</text>
  <line x1="100" y1="220" x2="700" y2="220" stroke="#cdd8d8" stroke-width="2"/>

  <circle cx="150" cy="220" r="12" fill="#7A8B6F"/>
  <text x="150" y="195" class="body" text-anchor="middle" font-weight="700">停损</text>
  <text x="150" y="250" class="small" text-anchor="middle">停不明霜剂</text>
  <text x="150" y="266" class="small" text-anchor="middle">减刺激护肤</text>

  <circle cx="330" cy="220" r="12" fill="#5F6E54"/>
  <text x="330" y="195" class="body" text-anchor="middle" font-weight="700">降阶梯</text>
  <text x="330" y="250" class="small" text-anchor="middle">按医嘱减强度</text>
  <text x="330" y="266" class="small" text-anchor="middle">不突然断药</text>

  <circle cx="510" cy="220" r="12" fill="#C9A876"/>
  <text x="510" y="195" class="body" text-anchor="middle" font-weight="700">修复</text>
  <text x="510" y="250" class="small" text-anchor="middle">温和保湿防晒</text>
  <text x="510" y="266" class="small" text-anchor="middle">屏障逐步耐受</text>

  <circle cx="690" cy="220" r="12" fill="#B5654A"/>
  <text x="690" y="195" class="body" text-anchor="middle" font-weight="700">再引入</text>
  <text x="690" y="250" class="small" text-anchor="middle">一次加一个</text>
  <text x="690" y="266" class="small" text-anchor="middle">局部先试用</text>

  <!-- 暴露账本 -->
  <text x="56" y="320" class="nodeTitle">建一份暴露账本</text>
  <rect x="56" y="334" width="688" height="86" rx="10" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4"/>
  <text x="76" y="362" class="body">记录日期 产品名称 用药强度 使用部位 当日反应</text>
  <text x="76" y="388" class="small">含网购霜 代购 滴眼液 滴鼻液 含激素喷雾 不明中成药膏</text>
  <text x="76" y="408" class="small">比买检测仪更可靠，能帮医生判断是反跳还是原发病未控</text>

  <rect x="56" y="432" width="688" height="32" rx="10" fill="#eef4ee"/>
  <text x="400" y="453" class="quote" text-anchor="middle">修复核心是减少损伤并恢复耐受，不是堆产品</text>
  <text x="56" y="470" class="footer">医学教育示意 · 恢复功效护肤或光电需医生评估时机</text>
</svg>
