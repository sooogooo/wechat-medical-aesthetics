<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t13f2 d13f2" role="img" viewBox="0 0 800 500"><title id="t13f2">贝克痣两条治疗线分别估算</title><desc id="d13f2">色素与毛发分开评估目标和费用，少数伴随表现需面诊说明</desc><defs><linearGradient id="bg13f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh13f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg13f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh13f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 13</text><text x="56" y="90" class="title">两条治疗线分别估算</text><text x="56" y="116" class="kicker">色素和毛发目标不同，方案费用需分开算</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">面诊决策表</text><rect width="688" height="32" x="56" y="172" fill="#5F6E54" rx="8"/><text x="120" y="193" class="tag" text-anchor="middle">关注点</text><text x="360" y="193" class="tag" text-anchor="middle">可能方案</text><text x="600" y="193" class="tag" text-anchor="middle">现实预期</text><rect width="688" height="44" x="56" y="204" fill="#f8fbfb" stroke="#dce8e8" rx="8"/><text x="120" y="231" class="body" text-anchor="middle">颜色偏深</text><text x="360" y="231" class="body" text-anchor="middle">调Q皮秒激光</text><text x="600" y="231" class="body" text-anchor="middle">部分改善为主</text><rect width="688" height="44" x="56" y="248" fill="#f8fbfb" stroke="#dce8e8" rx="8"/><text x="120" y="275" class="body" text-anchor="middle">毛发增多</text><text x="360" y="275" class="body" text-anchor="middle">激光脱毛多次</text><text x="600" y="275" class="body" text-anchor="middle">需长期维护</text><rect width="688" height="44" x="56" y="292" fill="#f8fbfb" stroke="#dce8e8" rx="8"/><text x="120" y="319" class="body" text-anchor="middle">范围扩大</text><text x="360" y="319" class="body" text-anchor="middle">观察为主</text><text x="600" y="319" class="body" text-anchor="middle">青春期后趋稳</text><text x="56" y="368" class="nodeTitle">少数伴随表现值得面诊说明</text><rect width="688" height="50" x="56" y="382" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><text x="76" y="406" class="body">部分贝克痣伴发软组织或骨骼发育异常</text><text x="76" y="424" class="small">如有不对称或其他表现，主动告知医生做完整评估</text><rect width="688" height="22" x="56" y="442" fill="#eef4ee" rx="8"/><text x="400" y="457" class="quote" font-size="14" text-anchor="middle">日常不需要特殊排色素，温和护肤即可</text><text x="56" y="474" class="footer">医学教育示意 · 费用要按完整疗程估算，效果因人而异</text></svg>