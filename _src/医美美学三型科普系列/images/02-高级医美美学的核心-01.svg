<svg xmlns="http://www.w3.org/2000/svg" aria-label="克制与过度的对比" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">克制 vs 过度：剂量思维</text><rect width="280" height="190" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="170" y="90" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✓ 高级型：克制</text><text x="50" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 先评估是否需要做</text><text x="50" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 宁可少做、分次评估</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 留有余地，可补可逆</text><text x="50" y="189" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 不追求一次到位</text><text x="50" y="220" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">&quot;够好就停&quot;是智慧</text><rect width="280" height="190" x="330" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="470" y="90" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✗ 庸俗型：过度</text><text x="350" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 默认&quot;多做才划算&quot;</text><text x="350" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 一次打满、追求极致</text><text x="350" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 无停止标准、反复叠加</text><text x="350" y="189" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 追求&quot;看出明显变化&quot;</text><text x="350" y="220" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">&quot;再加一点&quot;是陷阱</text><text x="320" y="265" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">克制不是&quot;做得差&quot;，而是&quot;知道在哪里停&quot;——这恰恰需要更高的审美自信</text></svg>