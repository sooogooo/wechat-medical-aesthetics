<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2302 desc2302" role="img" viewBox="0 0 900 620"><title id="title2302">球后出血：眼睑手术最危险的急症</title><desc id="desc2302">球后出血罕见但可致失明，按分钟计算，必须立即处理；术后需密切观察</desc><defs><linearGradient id="bg2302" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2302" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.alert{font:700 22px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#d55e00}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2302)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2302)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 23</text><text x="62" y="117" class="title">球后出血：眼周手术最危险的急症</text><text x="62" y="153" class="kicker">罕见但可致失明，按分钟计算——术后必须密切观察</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="390" height="280" x="62" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="16"/><text x="82" y="244" class="nodeTitle">什么是球后出血</text><text x="82" y="280" class="body">术后出血积聚于球后</text><text x="82" y="307" class="body">压力升高压迫视神经</text><text x="82" y="334" class="body">若不及时处理可能致盲</text><text x="82" y="361" class="body">是眼睑手术最危险急症</text><rect width="350" height="78" x="82" y="390" fill="#fbeae3" rx="10"/><text x="257" y="416" class="alert" text-anchor="middle">低概率 · 高后果</text><text x="257" y="442" class="small" text-anchor="middle">罕见不等于可忽视</text><text x="257" y="460" class="small" text-anchor="middle">这是术后需密切观察的根本原因</text><rect width="368" height="280" x="470" y="210" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="16"/><text x="490" y="244" class="nodeTitle">出现这些信号立即急诊</text><circle cx="500" cy="276" r="5" fill="#D55E00"/><text x="514" y="281" class="body">眼球疼痛、明显突出</text><circle cx="500" cy="306" r="5" fill="#D55E00"/><text x="514" y="311" class="body">视力下降、视物模糊</text><circle cx="500" cy="336" r="5" fill="#D55E00"/><text x="514" y="341" class="body">明显不对称肿胀</text><circle cx="500" cy="366" r="5" fill="#D55E00"/><text x="514" y="371" class="body">眼痛伴头痛</text><circle cx="500" cy="396" r="5" fill="#D55E00"/><text x="514" y="401" class="body">眼球运动异常</text><rect width="330" height="46" x="490" y="425" fill="#fdf3e3" rx="8"/><text x="655" y="445" class="small" text-anchor="middle">不要等到第二天复诊</text><text x="655" y="463" class="small" text-anchor="middle">机构应具备应急处理能力</text><rect width="776" height="40" x="62" y="525" fill="#fbeae3" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">承诺「做完马上走、不观察」的，对这一风险缺乏敬畏</text><text x="62" y="582" class="footer">示意，非教学图 · 出现上述信号应立即联系手术医生或就近急诊</text></svg>