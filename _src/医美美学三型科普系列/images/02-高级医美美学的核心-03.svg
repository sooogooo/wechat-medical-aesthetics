<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="个性化 vs 套模板">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">个性化 vs 套模板</text>

  <rect x="30" y="60" width="280" height="150" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="170" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">✓ 个性化</text>
  <text x="50" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 评估你的骨骼、肤质、气质</text>
  <text x="50" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 保留你的辨识度</text>
  <text x="50" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 方案为你定制</text>
  <text x="50" y="190" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">&quot;做完还是你，只是更好的你&quot;</text>

  <rect x="330" y="60" width="280" height="150" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="470" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">✗ 套模板</text>
  <text x="350" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 套用&quot;网红模板&quot;</text>
  <text x="350" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 抹平个人特征</text>
  <text x="350" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 所有人做成一整套</text>
  <text x="350" y="190" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">&quot;做完变成另一个模板脸&quot;</text>

  <text x="320" y="228" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">高级型尊重&quot;你是谁&quot;，庸俗型把人变成&quot;流水线产品&quot;</text>
</svg>