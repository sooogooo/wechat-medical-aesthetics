<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="正常术后反应时间线">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">这些是正常的，会自行消退</text>

  <line x1="50" y1="140" x2="590" y2="140" stroke="#a8a39d" stroke-width="2"/>
  <polygon points="590,140 582,135 582,145" fill="#a8a39d"/>

  <circle cx="100" cy="140" r="8" fill="#7a8b6f"/>
  <text x="100" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#5f6e54">注射</text>
  <text x="100" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">即刻肿胀</text>

  <circle cx="220" cy="140" r="7" fill="#8a9a7f"/>
  <text x="220" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">24–72 小时</text>
  <text x="220" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">肿胀淤青高峰</text>

  <circle cx="360" cy="140" r="7" fill="#8a9a7f"/>
  <text x="360" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">1–2 周</text>
  <text x="360" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">逐渐消退</text>

  <circle cx="500" cy="140" r="7" fill="#7a8b6f"/>
  <text x="500" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">2–4 周</text>
  <text x="500" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">稳定</text>

  <rect x="50" y="195" width="540" height="30" rx="6" fill="#eef0ea"/>
  <text x="320" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">✓ 肿胀、淤青、轻度胀痛、局部发红（轻微）——随时间改善，不持续加重</text>
  <text x="320" y="232" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">“随时间改善”是判断正常与异常的核心线索</text>
</svg>