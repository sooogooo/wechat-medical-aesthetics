<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2702 desc2702">
  <title id="title2702">术后必须立即就医的危险信号</title>
  <desc id="desc2702">剧烈疼痛、皮肤变色、视力变化、高热、出血、呼吸困难等危险信号清单，不要等到第二天复诊</desc>
  <defs>
    <linearGradient id="bg2702" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2702" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .alert { font: 700 22px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#D55E00; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2702)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2702)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 27</text>
  <text x="62" y="117" class="title">这些信号必须立即就医</text>
  <text x="62" y="153" class="kicker">不要等到第二天复诊——按分钟/小时计算的急症</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左栏：急症类信号（红色，最危险） -->
  <rect x="62" y="208" width="390" height="305" rx="16" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5"/>
  <rect x="62" y="208" width="390" height="42" rx="16" fill="#D55E00"/>
  <rect x="62" y="236" width="390" height="14" fill="#D55E00"/>
  <text x="257" y="236" class="alert" text-anchor="middle" style="fill:#ffffff;font-size:16px;">急症类 · 立即急诊</text>

  <circle cx="84" cy="278" r="5" fill="#D55E00"/>
  <text x="98" y="283" class="body">视力变化（注射后失明先兆）</text>
  <circle cx="84" cy="308" r="5" fill="#D55E00"/>
  <text x="98" y="313" class="body">皮肤发白发紫、花斑（栓塞）</text>
  <circle cx="84" cy="338" r="5" fill="#D55E00"/>
  <text x="98" y="343" class="body">呼吸困难、胸闷（肺栓塞）</text>
  <circle cx="84" cy="368" r="5" fill="#D55E00"/>
  <text x="98" y="373" class="body">剧烈疼痛、止痛药无效</text>
  <circle cx="84" cy="398" r="5" fill="#D55E00"/>
  <text x="98" y="403" class="body">迅速增大的肿胀或硬块</text>
  <circle cx="84" cy="428" r="5" fill="#D55E00"/>
  <text x="98" y="433" class="body">大量出血、压迫不止</text>
  <circle cx="84" cy="458" r="5" fill="#D55E00"/>
  <text x="98" y="463" class="body">单侧小腿肿痛（深静脉血栓）</text>
  <circle cx="84" cy="488" r="5" fill="#D55E00"/>
  <text x="98" y="493" class="body">意识改变、严重头晕</text>

  <!-- 右栏：感染类（橙色） -->
  <rect x="470" y="208" width="368" height="305" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="470" y="208" width="368" height="42" rx="16" fill="#E69F00"/>
  <rect x="470" y="236" width="368" height="14" fill="#E69F00"/>
  <text x="654" y="236" class="alert" text-anchor="middle" style="fill:#ffffff;font-size:16px;">感染与伤口类 · 尽快联系</text>

  <circle cx="492" cy="278" r="5" fill="#E69F00"/>
  <text x="506" y="283" class="body">高热（38.5℃ 以上）</text>
  <circle cx="492" cy="308" r="5" fill="#E69F00"/>
  <text x="506" y="313" class="body">红肿热痛加重</text>
  <circle cx="492" cy="338" r="5" fill="#E69F00"/>
  <text x="506" y="343" class="body">伤口流脓、明显渗液</text>
  <circle cx="492" cy="368" r="5" fill="#E69F00"/>
  <text x="506" y="373" class="body">伤口裂开</text>
  <circle cx="492" cy="398" r="5" fill="#E69F00"/>
  <text x="506" y="403" class="body">淋巴结肿大</text>
  <circle cx="492" cy="428" r="5" fill="#E69F00"/>
  <text x="506" y="433" class="body">恶心呕吐持续无法进食</text>
  <circle cx="492" cy="458" r="5" fill="#E69F00"/>
  <text x="506" y="463" class="body">不对称迅速加重</text>
  <rect x="492" y="478" width="324" height="28" rx="6" fill="#fdf3e3"/>
  <text x="654" y="496" class="small" text-anchor="middle">眼周手术警惕球后出血</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#fbeae3"/>
  <text x="450" y="551" class="quote" text-anchor="middle">「等等看」是术后并发症最危险的应对方式</text>

  <text x="62" y="582" class="footer">医学教育示意 · 出现上述信号应立即联系手术医生或就近急诊</text>
</svg>
