<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="高级脸的视觉特征">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">高级脸的典型特征</text>

  <!-- 简化高级脸（偏长方、骨骼感） -->
  <path d="M 170 130 L 170 240 Q 170 260 200 265 L 240 265 Q 270 260 270 240 L 270 130 Q 270 120 260 115 L 180 115 Q 170 120 170 130 Z" fill="#f3efe8" stroke="#a8a39d"/>
  <!-- 单眼皮/细长眼 -->
  <path d="M 190 165 L 215 162" stroke="#2b2a28" stroke-width="2.5"/>
  <path d="M 225 162 L 250 165" stroke="#2b2a28" stroke-width="2.5"/>
  <!-- 眼距偏宽（两眼距离大于眼宽） -->
  <!-- 高颧骨 -->
  <path d="M 180 195 Q 190 205 200 200" stroke="#a8a39d" stroke-width="1" fill="none"/>
  <path d="M 240 200 Q 250 205 260 195" stroke="#a8a39d" stroke-width="1" fill="none"/>
  <!-- 薄唇 -->
  <line x1="210" y1="235" x2="232" y2="235" stroke="#b5654a" stroke-width="1.5"/>

  <!-- 标注 -->
  <line x1="190" y1="162" x2="380" y2="100" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="95" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">细长眼/单眼皮</text>
  <text x="390" y="112" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不追求大圆眼</text>

  <line x1="218" y1="162" x2="380" y2="135" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="132" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">眼距偏宽</text>
  <text x="390" y="149" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">疏离、不集中</text>

  <line x1="190" y1="200" x2="380" y2="180" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="177" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">骨骼感明显</text>
  <text x="390" y="194" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">颧骨、下颌线条</text>

  <line x1="210" y1="235" x2="380" y2="240" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="237" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">薄唇、面部留白多</text>
  <text x="390" y="254" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">冷淡、克制</text>

  <line x1="170" y1="200" x2="380" y2="285" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="282" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">整体疏离冷感</text>
  <text x="390" y="299" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不讨好、有距离</text>
</svg>