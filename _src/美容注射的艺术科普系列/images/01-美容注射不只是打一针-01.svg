<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="三类美容注射的逻辑对比图">
  <rect width="720" height="360" fill="#faf8f4" rx="12"/>
  <!-- 标题 -->
  <text x="360" y="34" text-anchor="middle" font-family="-apple-system,PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">三类注射，三种逻辑</text>

  <!-- 三列卡片 -->
  <!-- 卡片1 填充 -->
  <rect x="30" y="60" width="210" height="270" rx="10" fill="#ffffff" stroke="#ece7df" stroke-width="1.5"/>
  <rect x="30" y="60" width="210" height="44" rx="10" fill="#7a8b6f"/>
  <rect x="30" y="94" width="210" height="10" fill="#7a8b6f"/>
  <text x="135" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">填充类</text>
  <text x="135" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#6b6864">代表：透明质酸</text>
  <text x="50" y="158" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">作用：补充容积</text>
  <text x="50" y="182" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">层次：真皮深层／皮下</text>
  <text x="50" y="206" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">起效：即刻（有肿胀）</text>
  <text x="50" y="230" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">维持：6–18 个月</text>
  <text x="50" y="254" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">可逆：透明质酸可溶</text>
  <rect x="50" y="272" width="170" height="40" rx="6" fill="#eef0ea"/>
  <text x="135" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">解决：凹陷、轮廓、容积</text>
  <text x="135" y="306" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">流失</text>

  <!-- 卡片2 肉毒 -->
  <rect x="255" y="60" width="210" height="270" rx="10" fill="#ffffff" stroke="#ece7df" stroke-width="1.5"/>
  <rect x="255" y="60" width="210" height="44" rx="10" fill="#c9a876"/>
  <rect x="255" y="94" width="210" height="10" fill="#c9a876"/>
  <text x="360" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">肌肉松弛类</text>
  <text x="360" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#6b6864">代表：肉毒杆菌素</text>
  <text x="275" y="158" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">作用：放松表情肌</text>
  <text x="275" y="182" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">层次：肌肉层</text>
  <text x="275" y="206" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">起效：3–14 天渐进</text>
  <text x="275" y="230" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">维持：3–6 个月</text>
  <text x="275" y="254" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">可逆：自行代谢消退</text>
  <rect x="275" y="272" width="170" height="40" rx="6" fill="#f4ede0"/>
  <text x="360" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#8a7340">解决：动态纹、咬肌、</text>
  <text x="360" y="306" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#8a7340">肌肉型轮廓</text>

  <!-- 卡片3 再生 -->
  <rect x="480" y="60" width="210" height="270" rx="10" fill="#ffffff" stroke="#ece7df" stroke-width="1.5"/>
  <rect x="480" y="60" width="210" height="44" rx="10" fill="#8a9a7f"/>
  <rect x="480" y="94" width="210" height="10" fill="#8a9a7f"/>
  <text x="585" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">再生刺激类</text>
  <text x="585" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#6b6864">代表：胶原蛋白刺激剂</text>
  <text x="500" y="158" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">作用：刺激自身胶原</text>
  <text x="500" y="182" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">层次：真皮深层／皮下</text>
  <text x="500" y="206" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">起效：数周到数月</text>
  <text x="500" y="230" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">维持：1–2 年（个体差异）</text>
  <text x="500" y="254" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">可逆：难以溶解取出</text>
  <rect x="500" y="272" width="170" height="40" rx="6" fill="#eef0ea"/>
  <text x="585" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">解决：肤质、容积、</text>
  <text x="585" y="306" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">渐进式改善</text>

  <text x="360" y="348" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">本图为机制示意，具体材料与维持时间因产品、部位和个体差异而不同</text>
</svg>