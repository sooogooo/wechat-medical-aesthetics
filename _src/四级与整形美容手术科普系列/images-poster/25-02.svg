<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2502 desc2502">
  <title id="title2502">改善不等于消除：瘢痕治疗的真实边界</title>
  <desc id="desc2502">瘢痕无法消除只能改善，治疗是组合拳需数月到数年，常见误区与功能性优先级</desc>
  <defs>
    <linearGradient id="bg2502" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2502" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .tag { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:1px; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2502)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2502)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 25</text>
  <text x="62" y="117" class="title">改善不等于消除</text>
  <text x="62" y="153" class="kicker">瘢痕治疗是「组合拳」，需要数月到数年的耐心</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：治疗手段组合拳 -->
  <text x="62" y="216" class="nodeTitle">主要治疗手段（多需组合）</text>

  <rect x="62" y="232" width="390" height="280" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="84" cy="262" r="5" fill="#0072B2"/>
  <text x="98" y="267" class="body">手术切除 · 适合成熟/增生/凹陷/挛缩</text>
  <circle cx="84" cy="294" r="5" fill="#0072B2"/>
  <text x="98" y="299" class="body">药物注射 · 激素针对增生和疙瘩</text>
  <circle cx="84" cy="326" r="5" fill="#0072B2"/>
  <text x="98" y="331" class="body">光电 · 脉冲染料去红、点阵改质地</text>
  <circle cx="84" cy="358" r="5" fill="#0072B2"/>
  <text x="98" y="363" class="body">加压治疗 · 弹力套持续数月</text>
  <circle cx="84" cy="390" r="5" fill="#0072B2"/>
  <text x="98" y="395" class="body">硅酮制剂 · 凝胶或贴片辅助</text>
  <circle cx="84" cy="422" r="5" fill="#D55E00"/>
  <text x="98" y="427" class="body">放射治疗 · 瘢痕疙瘩术后辅助</text>
  <circle cx="84" cy="454" r="5" fill="#0072B2"/>
  <text x="98" y="459" class="body">填充 · 凹陷性瘢痕改善</text>
  <rect x="82" y="475" width="350" height="28" rx="6" fill="#eef6f8"/>
  <text x="257" y="494" class="small" text-anchor="middle">瘢痕成熟本身需 1–2 年，治疗需耐心</text>

  <!-- 右：常见误区 -->
  <text x="478" y="216" class="nodeTitle">四个常见误区</text>

  <rect x="478" y="232" width="360" height="280" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="498" y="252" width="320" height="48" rx="8" fill="#fdf3e3"/>
  <text x="510" y="272" class="body">✗ 刚受伤就用祛疤产品</text>
  <text x="510" y="292" class="small">未愈合时不需要，硅酮在愈合后用</text>

  <rect x="498" y="312" width="320" height="48" rx="8" fill="#fdf3e3"/>
  <text x="510" y="332" class="body">✗ 瘢痕越早切越好</text>
  <text x="510" y="352" class="small">增生期手术可能加重增生</text>

  <rect x="498" y="372" width="320" height="48" rx="8" fill="#fdf3e3"/>
  <text x="510" y="392" class="body">✗ 一次激光就能平</text>
  <text x="510" y="412" class="small">激光常需多次，效果渐进</text>

  <rect x="498" y="432" width="320" height="48" rx="8" fill="#fbeae3"/>
  <text x="510" y="452" class="body">✗ 秘方彻底去疤</text>
  <text x="510" y="472" class="small">不科学，可能延误规范治疗</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#fbeae3"/>
  <text x="450" y="551" class="quote" text-anchor="middle">承诺「彻底去疤」「无痕修复」的，都不诚实</text>

  <text x="62" y="582" class="footer">医学教育示意 · 跨关节挛缩性瘢痕影响功能，需优先处理；具体方案以面诊为准</text>
</svg>
