<svg xmlns="http://www.w3.org/2000/svg" aria-label="幼态脸流行的原因" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">幼态脸流行的几股推力</text><rect width="185" height="190" x="30" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="122" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">文化预设</text><text x="45" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• &quot;年轻=有价值&quot;</text><text x="45" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 女性价值与青春</text><text x="45" y="153" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">强绑定</text><text x="45" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• &quot;显小&quot;被夸赞</text><text x="45" y="200" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• &quot;显老&quot;成为贬义</text><rect width="185" height="190" x="227" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="320" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">商业推动</text><text x="242" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 社交媒体种草</text><text x="242" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 明星/网红示范</text><text x="242" y="155" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 机构打包&quot;幼态套餐&quot;</text><text x="242" y="175" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 滤镜强化幼态审美</text><text x="242" y="200" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 制造&quot;不够幼&quot;焦虑</text><rect width="185" height="190" x="424" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="516" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">心理需求</text><text x="439" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 对衰老的恐惧</text><text x="439" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 对被保护的需要</text><text x="439" y="155" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 职场/婚恋压力</text><text x="439" y="175" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 同辈比较</text><text x="439" y="200" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">• 自我价值的外求</text><text x="320" y="265" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">流行从不是&quot;自然&quot;的，它是多股力量共同塑造的结果</text></svg>