<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleC201 descC201">
  <title id="titleC201">并发症分级，从常见到需急症</title>
  <desc id="descC201">腹壁成形术并发症按严重程度分三级，常见、较重、需急症处理</desc>
  <defs>
    <marker id="ahC201" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · C2</text>
  <text x="62" y="112" class="title">并发症分级，从常见到需急症</text>
  <text x="62" y="148" class="kicker">不制造恐慌，也不轻描淡写</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>


  <line x1="62" y1="211" x2="62" y2="287" stroke="#D9930D" stroke-width="2"/>
  <text x="82" y="241" class="midTitle" text-anchor="start" style="fill:#D9930D">常见</text>
  <text x="82" y="267" class="small">不致命但影响恢复</text>
  <line x1="206" y1="211" x2="206" y2="287" stroke="#e3e9ea" stroke-width="1"/>
  <text x="230" y="241" class="body">血肿与血清肿（引流的意义）</text>
  <text x="230" y="271" class="body">伤口愈合不良或裂开</text>
  <text x="530" y="241" class="body">腹部感觉改变（多可恢复）</text>
  <text x="530" y="271" class="body">轮廓不对称、不平整</text>

  <line x1="62" y1="311" x2="62" y2="387" stroke="#C75B00" stroke-width="2"/>
  <text x="82" y="341" class="midTitle" text-anchor="start" style="fill:#C75B00">较重</text>
  <text x="82" y="367" class="small">可能需二次干预</text>
  <line x1="206" y1="311" x2="206" y2="387" stroke="#e3e9ea" stroke-width="1"/>
  <text x="230" y="341" class="body">皮瓣坏死（吸烟、糖尿病高危）</text>
  <text x="230" y="371" class="body">感染（合并积液时更高）</text>
  <text x="530" y="341" class="body">明显瘢痕增生或变宽</text>
  <text x="530" y="371" class="body">坏死区可能需清创、植皮</text>

  <line x1="62" y1="411" x2="62" y2="487" stroke="#A64200" stroke-width="2"/>
  <text x="82" y="441" class="midTitle" text-anchor="start" style="fill:#A64200">需急症</text>
  <text x="82" y="467" class="small">可危及生命</text>
  <line x1="206" y1="411" x2="206" y2="487" stroke="#e3e9ea" stroke-width="1"/>
  <text x="230" y="441" class="body">深静脉血栓／肺栓塞（主要死因之一）</text>
  <text x="530" y="441" class="body">术后大出血（需备血与再手术）</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">发生率不算高，不等于不会发生在你身上</text>
  <text x="62" y="580" class="footer">医学教育示意 · 个体风险以术前评估为准</text>
</svg>
