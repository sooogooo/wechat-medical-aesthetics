<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t34 d34" role="img" viewBox="0 0 800 500"><title id="t34">头皮红痛、毛囊口消失</title><desc id="d34">瘢痕性脱发是脱发里更强调抢时间的一类</desc><defs><linearGradient id="bg34" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh34" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT,.nodeT2{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.nodeT2{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg34)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh34)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 34</text><text x="48" y="92" class="title">头皮红痛、毛囊口消失</text><text x="48" y="116" class="kicker">瘢痕性脱发是脱发里更强调抢时间的一类</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">两类炎症破坏毛囊的机制</text><rect width="220" height="170" x="48" y="188" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="48" y="188" fill="#B5654A" rx="12"/><rect width="220" height="10" x="48" y="206" fill="#B5654A"/><text x="158" y="208" fill="#fff" class="nodeT2" text-anchor="middle">中性粒细胞型</text><text x="158" y="238" class="body" text-anchor="middle">脓疱脓肿破溃</text><text x="158" y="256" class="small" text-anchor="middle">疼痛明显，进展快</text><rect width="220" height="170" x="290" y="188" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="188" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="206" fill="#C9A876"/><text x="400" y="208" fill="#fff" class="nodeT2" text-anchor="middle">淋巴细胞性</text><text x="400" y="238" class="body" text-anchor="middle">红斑脱屑色素改变</text><text x="400" y="256" class="small" text-anchor="middle">毛囊口消失，较缓</text><rect width="220" height="170" x="532" y="188" fill="#fbfdfc" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="532" y="188" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="532" y="206" fill="#7A8B6F"/><text x="642" y="208" fill="#fff" class="nodeT2" text-anchor="middle">共同结果</text><text x="642" y="238" class="body" text-anchor="middle">毛囊被破坏</text><text x="642" y="256" class="small" text-anchor="middle">脱发永久不可逆</text><text x="400" y="395" class="small" text-anchor="middle">治疗首要目标是“灭火”，不是立刻生发</text><rect width="704" height="28" x="48" y="410" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="429" class="quote" text-anchor="middle">活检的价值在于选对位置和分型</text><text x="48" y="462" class="footer">医学教育示意 · 为什么不能先当雄脱治半年看看</text></svg>