<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t16f1 d16f1" role="img" viewBox="0 0 800 500"><title id="t16f1">慢性湿疹不只是过敏</title><desc id="d16f1">干燥脱屑增厚裂口反复瘙痒，治疗要修复屏障减少刺激排除接触过敏和感染</desc><defs><linearGradient id="bg16f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh16f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg16f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh16f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 16</text><text x="56" y="90" class="title">慢性湿疹不只是过敏</text><text x="56" y="116" class="kicker">四个维度共同参与，治疗需组合而非单一</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">参与的四个维度</text><rect width="335" height="92" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="174" fill="#7A8B6F" rx="12"/><rect width="335" height="10" x="56" y="192" fill="#7A8B6F"/><text x="72" y="193" class="tag">屏障受损</text><text x="72" y="224" class="body">皮肤锁水能力下降</text><text x="72" y="248" class="small">干燥脱屑 易受刺激 保湿是底盘</text><rect width="335" height="92" x="409" y="174" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="174" fill="#C9A876" rx="12"/><rect width="335" height="10" x="409" y="192" fill="#C9A876"/><text x="425" y="193" class="tag">免疫炎症</text><text x="425" y="224" class="body">慢性炎症反复</text><text x="425" y="248" class="small">瘙痒红斑增厚 需抗炎药物</text><rect width="335" height="92" x="56" y="278" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="278" fill="#8a6a3a" rx="12"/><rect width="335" height="10" x="56" y="296" fill="#8a6a3a"/><text x="72" y="297" class="tag">接触过敏</text><text x="72" y="328" class="body">隐形刺激源持续作用</text><text x="72" y="352" class="small">金属 清洁剂 化妆品 需排查</text><rect width="335" height="92" x="409" y="278" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="278" fill="#B5654A" rx="12"/><rect width="335" height="10" x="409" y="296" fill="#B5654A"/><text x="425" y="297" class="tag">继发感染</text><text x="425" y="328" class="body">反复抓破可合并感染</text><text x="425" y="352" class="small">渗液结痂加重 需及时处理</text><rect width="688" height="44" x="56" y="388" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="400" y="408" class="body" font-weight="700" text-anchor="middle">先确认是不是湿疹 以及是哪一类</text><text x="400" y="424" class="small" text-anchor="middle">不同类型治疗思路不同 不能只靠一张照片自我诊断</text><rect width="688" height="22" x="56" y="442" fill="#eef4ee" rx="8"/><text x="400" y="457" class="quote" font-size="14" text-anchor="middle">复发不等于治疗失败，关键是降低发作频率和严重度</text><text x="56" y="474" class="footer">医学教育示意 · 外用药要有灭火维持逻辑，乱用和不用都可能出问题</text></svg>