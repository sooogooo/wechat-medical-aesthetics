<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t54f2 d54f2" role="img" viewBox="0 0 800 500"><title id="t54f2">带状疱疹后色沉的护理</title><desc id="d54f2">防晒保湿温和淡化和神经痛管理及警示信号的护理清单</desc><defs><linearGradient id="bg54f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh54f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg54f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh54f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 54</text><text x="52" y="92" class="title">护理与淡化清单</text><text x="52" y="116" class="kicker">防晒是主线，神经痛不能忽视，淡化要温和</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="340" height="34" x="52" y="150" fill="#5F6E54" rx="8"/><text x="222" y="172" class="nodeTitle" text-anchor="middle">色沉护理（温和优先）</text><rect width="340" height="116" x="52" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="68" cy="214" r="3" fill="#5F6E54"/><text x="80" y="218" class="body">严格防晒，物理遮挡为主</text><circle cx="68" cy="242" r="3" fill="#5F6E54"/><text x="80" y="246" class="body">温和清洁、足量保湿</text><circle cx="68" cy="270" r="3" fill="#5F6E54"/><text x="80" y="274" class="body">外用温和淡斑成分</text><circle cx="68" cy="298" r="3" fill="#5F6E54"/><text x="80" y="302" fill="#B5654A" class="small">炎症期勿用强刺激产品</text><rect width="340" height="34" x="408" y="150" fill="#7A8B6F" rx="8"/><text x="578" y="172" class="nodeTitle" text-anchor="middle">瘢痕管理</text><rect width="340" height="116" x="408" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="424" cy="214" r="3" fill="#5F6E54"/><text x="436" y="218" class="body">痂皮自然脱落，勿撕</text><circle cx="424" cy="242" r="3" fill="#5F6E54"/><text x="436" y="246" class="body">瘢痕稳定后再评估</text><circle cx="424" cy="270" r="3" fill="#5F6E54"/><text x="436" y="274" class="body">可能需激光或注射</text><circle cx="424" cy="298" r="3" fill="#5F6E54"/><text x="436" y="302" fill="#B5654A" class="small">增生性瘢痕需面诊</text><rect width="340" height="34" x="52" y="318" fill="#C9A876" rx="8"/><text x="222" y="340" class="nodeTitle" text-anchor="middle">神经痛管理（不可忽视）</text><rect width="340" height="70" x="52" y="356" fill="#fbf5ea" stroke="#C9A876" rx="10"/><circle cx="68" cy="382" r="3" fill="#C9A876"/><text x="80" y="386" class="body">及时止痛、规律用药</text><circle cx="68" cy="408" r="3" fill="#C9A876"/><text x="80" y="412" class="small">疼痛持续超3个月需疼痛科评估</text><rect width="340" height="34" x="408" y="318" fill="#B5654A" rx="8"/><text x="578" y="340" class="nodeTitle" text-anchor="middle">警示信号</text><rect width="340" height="70" x="408" y="356" fill="#fbf0eb" stroke="#B5654A" rx="10"/><circle cx="424" cy="382" r="3" fill="#B5654A"/><text x="436" y="386" class="body">同区新水疱、红肿、流脓</text><circle cx="424" cy="408" r="3" fill="#B5654A"/><text x="436" y="412" class="small">眼周受累、剧痛难眠须立即就医</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">色沉会淡，但神经痛要先管好</text><text x="52" y="466" class="footer">健康科普示意 · 治疗方案须由皮肤科或疼痛科医师评估</text></svg>