<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b5654a"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#b5654a"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">入职 180 天的五次冲击</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">能力、语言、信用、结构、底线，一层比一层深</text>

  <line x1="80" y1="400" x2="720" y2="400" stroke="#e4ddd2" stroke-width="1.4"/>
  <line x1="80" y1="400" x2="80" y2="120" stroke="#e4ddd2" stroke-width="1.4"/>
  <text x="64" y="260" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">冲击深度</text>
  <path d="M80 380 C170 380 185 190 265 190 C330 190 340 230 400 230 C470 230 480 150 545 150 C610 150 630 100 715 100" fill="none" stroke="#b5654a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="265" cy="190" r="5" fill="#b5654a"/><text x="265" y="168" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">① 数据冲击</text><text x="265" y="148" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">第 2 周</text>
  <circle cx="400" cy="230" r="5" fill="#b5654a"/><text x="400" y="285" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">② 会议冲击</text><text x="400" y="305" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">第 1 个月</text>
  <circle cx="475" cy="178" r="5" fill="#b5654a"/><text x="490" y="156" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">③ 身份冲击</text><text x="490" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864">第 2 个月</text>
  <circle cx="545" cy="150" r="5" fill="#b5654a"/><text x="560" y="128" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">④ 指标冲击</text><text x="560" y="108" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864">第 3 个月</text>
  <circle cx="715" cy="100" r="5" fill="#b5654a"/><text x="715" y="78" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" text-anchor="middle">⑤ 价值观冲击</text><text x="715" y="58" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">第 6 个月</text>
  <text x="80" y="428" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864">入职日</text><text x="720" y="428" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="end">第 180 天</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">预知冲击的存在，本身就是免疫力</text>
