<svg xmlns="http://www.w3.org/2000/svg" aria-label="流水线导致趋同" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">流水线的必然结果：趋同</text><ellipse cx="80" cy="120" fill="#eef0ea" stroke="#7a8b6f" rx="30" ry="40"/><ellipse cx="80" cy="115" fill="#5f6e54" opacity=".5" rx="8" ry="5"/><ellipse cx="80" cy="130" fill="#5f6e54" opacity=".5" rx="10" ry="6"/><ellipse cx="160" cy="120" fill="#f4ede0" stroke="#c9a876" rx="28" ry="42"/><ellipse cx="160" cy="118" fill="#8a7340" opacity=".5" rx="7" ry="6"/><ellipse cx="240" cy="120" fill="#eef0ea" stroke="#8a9a7f" rx="32" ry="38"/><ellipse cx="240" cy="125" fill="#5f6e54" opacity=".5" rx="9" ry="5"/><text x="160" y="190" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不同的脸（有个体差异）</text><rect width="120" height="50" x="300" y="100" fill="#b5654a" rx="8"/><text x="360" y="122" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">庸俗型流水线</text><text x="360" y="140" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">套餐 + 模板</text><polygon fill="#b5654a" points="425 125 440 115 440 135"/><ellipse cx="510" cy="120" fill="#f7ece6" stroke="#b5654a" rx="30" ry="40"/><ellipse cx="510" cy="115" fill="#b5654a" opacity=".6" rx="9" ry="6"/><ellipse cx="510" cy="132" fill="#b5654a" opacity=".6" rx="11" ry="6"/><ellipse cx="580" cy="120" fill="#f7ece6" stroke="#b5654a" rx="30" ry="40"/><ellipse cx="580" cy="115" fill="#b5654a" opacity=".6" rx="9" ry="6"/><ellipse cx="580" cy="132" fill="#b5654a" opacity=".6" rx="11" ry="6"/><text x="545" y="190" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">趋同的&quot;标准品&quot;</text><text x="320" y="220" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">流水线的本质，是消除输入的差异，产出统一的输出——这与&quot;个体化医美&quot;根本对立</text></svg>