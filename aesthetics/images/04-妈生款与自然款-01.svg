<svg xmlns="http://www.w3.org/2000/svg" aria-label="妈生款的核心理念" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">妈生款 / 自然款的核心理念</text><rect width="400" height="180" x="120" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="12"/><text x="320" y="100" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">&quot;看不出做过&quot;</text><text x="320" y="130" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">= 最高赞美</text><line x1="180" x2="460" y1="145" y2="145" stroke="#a8a39d" stroke-dasharray="3 2" stroke-width="1"/><text x="320" y="172" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">• 克制的剂量与设计</text><text x="320" y="194" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">• 保留个人特征</text><text x="320" y="216" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">• 不追求夸张变化</text><text x="320" y="265" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;妈生&quot;——形容像妈妈天生给的，而不是医生做的</text></svg>