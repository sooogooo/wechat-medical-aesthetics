<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t05f1 d05f1" role="img" viewBox="0 0 800 500"><title id="t05f1">炎症后色沉两种颜色来源</title><desc id="d05f1">红印与黑褐色印机制不同，治疗顺序是先灭火再处理余温</desc><defs><linearGradient id="bg05f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh05f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg05f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh05f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 05</text><text x="56" y="90" class="title">同一个印 为什么有时深有时浅</text><text x="56" y="116" class="kicker">炎症后色沉不是色素毒素，机制不同处理也不同</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">两种颜色两种来源</text><rect width="335" height="150" x="56" y="174" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="335" height="30" x="56" y="174" fill="#B5654A" rx="12"/><rect width="335" height="10" x="56" y="194" fill="#B5654A"/><text x="72" y="195" class="tag">红印 炎症后血管变化</text><text x="72" y="226" class="body">局部血管扩张 通透性增高</text><text x="72" y="252" class="body">随炎症消退逐渐变淡</text><text x="72" y="278" class="small">时间因肤色 日晒 炎症程度而异</text><text x="72" y="304" class="small">控制新炎症比美白更关键</text><rect width="335" height="150" x="409" y="174" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6" rx="12"/><rect width="335" height="30" x="409" y="174" fill="#8a6a3a" rx="12"/><rect width="335" height="10" x="409" y="194" fill="#8a6a3a"/><text x="425" y="195" class="tag">黑褐色印 黑色素沉积</text><text x="425" y="226" class="body">炎症刺激黑色素细胞产色素</text><text x="425" y="252" class="body">美白防晒可帮助淡化</text><text x="425" y="278" class="small">激光可快但也可能放大问题</text><text x="425" y="304" class="small">深肤色人群需更谨慎</text><text x="56" y="356" class="nodeTitle">治疗顺序 先灭火 再处理余温</text><rect width="688" height="56" x="56" y="370" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><text x="76" y="394" class="body" font-weight="700">第一步 控制原发炎症</text><text x="76" y="414" class="small">痘痘 湿疹 抓挠 治疗刺激都是源头 不控炎症淡印无意义</text><rect width="688" height="32" x="56" y="432" fill="#eef4ee" rx="8"/><text x="400" y="453" class="quote" text-anchor="middle">能逐渐变淡，但前提是控制炎症防晒并减少二次伤害</text><text x="56" y="472" class="footer">医学教育示意 · 激光可快但也可能把问题放大，深肤色需谨慎</text></svg>