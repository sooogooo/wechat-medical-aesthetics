<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0302 desc0302" role="img" viewBox="0 0 900 620"><title id="title0302">面诊的三个红旗信号</title><desc id="desc0302">回避风险、强推套餐限时优惠、不问病史直接报价三类警示信号</desc><defs><linearGradient id="bg0302" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0302" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 28px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0302)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0302)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 03</text><text x="62" y="117" class="title">面诊的三个红旗信号</text><text x="62" y="153" class="kicker">出现这些，建议带走方案、冷静比较，别当场交钱</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="776" height="92" x="62" y="215" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="105" cy="261" r="22" fill="#D55E00"/><text x="105" y="270" class="num" text-anchor="middle">!</text><text x="140" y="250" class="nodeTitle">回避风险讨论，只强调效果</text><text x="140" y="278" class="body">只说&quot;放心&quot;&quot;保证满意&quot;，对并发症、不对称、恢复期轻描淡写或避而不谈</text><text x="140" y="298" class="small">不愿意讨论风险的医生，可能并没有真正在意你这台手术的风险</text><rect width="776" height="92" x="62" y="320" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="105" cy="366" r="22" fill="#D55E00"/><text x="105" y="375" class="num" text-anchor="middle">!</text><text x="140" y="355" class="nodeTitle">没提诉求就主动推&quot;全套方案&quot;</text><text x="140" y="383" class="body">在你陈述具体诉求前推荐套餐，并用&quot;限时优惠&quot;&quot;名额&quot;制造紧迫感催促当场决定</text><text x="140" y="403" class="small">四级手术是不可逆决定，&quot;今天定有优惠&quot;几乎都违背应有的审慎</text><rect width="776" height="92" x="62" y="425" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="105" cy="471" r="22" fill="#D55E00"/><text x="105" y="480" class="num" text-anchor="middle">!</text><text x="140" y="460" class="nodeTitle">不问病史、用药、备孕就进报价</text><text x="140" y="488" class="body">对既往病史、用药史、过敏、月经周期、备孕计划不询问不记录，直接进入价格讨论</text><text x="140" y="508" class="small">连基本术前评估都不做的机构，安全意识值得怀疑</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">合理做法：面诊后带走书面方案，回家冷静，必要时再面诊第二位医生</text><text x="62" y="582" class="footer">医学教育示意 · 本文用于健康教育，不能替代面诊和个体化评估</text></svg>