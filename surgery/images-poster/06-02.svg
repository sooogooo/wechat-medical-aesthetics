<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0602 desc0602">
  <title id="title0602">下颌角成形术怎么做与风险</title>
  <desc id="desc0602">经口内切口截骨的术式概要与六类必须正视的风险</desc>
  <defs>
    <linearGradient id="bg0602" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0602" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0602)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0602)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 06</text>
  <text x="62" y="117" class="title">下颌角成形术怎么做，风险有哪些</text>
  <text x="62" y="153" class="kicker">经口内切口截骨，全身麻醉，须住院观察</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：术式概要 -->
  <rect x="62" y="210" width="350" height="295" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="210" width="350" height="40" rx="14" fill="#0072B2"/>
  <rect x="62" y="236" width="350" height="14" fill="#0072B2"/>
  <text x="82" y="237" class="nodeTitle" fill="#ffffff">术式概要（示意）</text>

  <circle cx="92" cy="278" r="5" fill="#0072B2"/>
  <text x="108" y="283" class="body">全身麻醉下进行</text>
  <circle cx="92" cy="306" r="5" fill="#0072B2"/>
  <text x="108" y="311" class="body">经口内切口（面部不留疤）</text>
  <circle cx="92" cy="334" r="5" fill="#0072B2"/>
  <text x="108" y="339" class="body">专用骨锯/骨凿截除下颌角骨质</text>
  <circle cx="92" cy="362" r="5" fill="#0072B2"/>
  <text x="108" y="367" class="body">必要时处理下颌骨体外侧</text>
  <circle cx="92" cy="390" r="5" fill="#0072B2"/>
  <text x="108" y="395" class="body">术后口内有切口，需住院观察</text>
  <circle cx="92" cy="418" r="5" fill="#0072B2"/>
  <text x="108" y="423" class="body">是否联合颏部/颧骨视方案</text>

  <rect x="82" y="440" width="310" height="50" rx="8" fill="#eef6f8"/>
  <text x="237" y="461" class="small" text-anchor="middle">截骨范围依个体解剖与诉求</text>
  <text x="237" y="479" class="small" text-anchor="middle">需术前 CT/三维重建评估</text>

  <!-- 右：风险清单 -->
  <rect x="426" y="210" width="412" height="295" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="426" y="210" width="412" height="40" rx="14" fill="#D55E00"/>
  <rect x="426" y="236" width="412" height="14" fill="#D55E00"/>
  <text x="446" y="237" class="nodeTitle" fill="#ffffff">必须正视的六类风险</text>

  <circle cx="456" cy="276" r="5" fill="#D55E00"/>
  <text x="472" y="281" class="body" font-weight="700">下牙槽神经损伤</text>
  <text x="472" y="299" class="small">下唇、颏部麻木，多数恢复少数长期</text>

  <circle cx="456" cy="322" r="5" fill="#D55E00"/>
  <text x="472" y="327" class="body" font-weight="700">出血</text>
  <text x="472" y="345" class="small">面动脉等大血管，严重需输血</text>

  <circle cx="456" cy="368" r="5" fill="#D55E00"/>
  <text x="472" y="373" class="body" font-weight="700">感染与伤口愈合</text>
  <text x="472" y="391" class="small">口内切口受口腔细菌影响</text>

  <circle cx="456" cy="414" r="5" fill="#D55E00"/>
  <text x="472" y="419" class="body" font-weight="700">不对称/截骨过量或不足</text>
  <text x="472" y="437" class="small">可能需二次修整，难度更高</text>

  <circle cx="456" cy="460" r="5" fill="#D55E00"/>
  <text x="472" y="465" class="body" font-weight="700">骨折、麻醉风险</text>
  <text x="472" y="483" class="small">截骨线设计或操作不当</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">发生率不高，但每个都可能影响长期生活质量</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 下颌角成形术须在有相应资质机构由具备权限医师开展</text>
</svg>
