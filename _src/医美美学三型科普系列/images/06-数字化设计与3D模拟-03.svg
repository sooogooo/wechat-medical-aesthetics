<svg xmlns="http://www.w3.org/2000/svg" aria-label="数字化工具的两面性" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">同一工具，两种用法</text><rect width="280" height="170" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="170" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✓ 高级型用法</text><text x="50" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 辅助沟通和理解</text><text x="50" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 评估不对称和基础</text><text x="50" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 模拟多种方案对比</text><text x="50" y="184" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 强调&quot;参考非保证&quot;</text><text x="50" y="213" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">工具服务于审美判断</text><rect width="280" height="170" x="330" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="470" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✗ 庸俗型用法</text><text x="350" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 用&quot;AI 评分&quot;制造焦虑</text><text x="350" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 用模拟图诱导消费</text><text x="350" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 把数据当唯一标准</text><text x="350" y="184" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 用&quot;科学&quot;包装模板</text><text x="350" y="213" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">工具服务于销售套路</text><text x="320" y="245" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">技术本身无善恶——是高级还是庸俗，取决于使用它的人</text></svg>