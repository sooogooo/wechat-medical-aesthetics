<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="容貌焦虑的制造机制">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">焦虑不是天生的，是被制造的</text>

  <rect x="30" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="100" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">单一标准</text>
  <text x="100" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">某种审美</text>
  <text x="100" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">被塑造成</text>
  <text x="100" y="152" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;唯一正确&quot;</text>

  <rect x="180" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="250" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">无限比较</text>
  <text x="250" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">社交媒体</text>
  <text x="250" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">滤镜美化</text>
  <text x="250" y="152" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">永远有</text>
  <text x="250" y="169" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;更美的人&quot;</text>

  <rect x="330" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="400" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">缺陷放大</text>
  <text x="400" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;你的 X 不够 Y&quot;</text>
  <text x="400" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">机构营销</text>
  <text x="400" y="152" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">把正常</text>
  <text x="400" y="169" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">说成缺陷</text>

  <rect x="480" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="550" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">即时解决</text>
  <text x="550" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;做了就好&quot;</text>
  <text x="550" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">的消费承诺</text>
  <text x="550" y="152" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">把焦虑转化</text>
  <text x="550" y="169" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">为购买行为</text>

  <text x="320" y="310" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">四个环节环环相扣——焦虑不是你&quot;矫情&quot;，是一套成熟的商业机制</text>
</svg>