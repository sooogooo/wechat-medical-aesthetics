<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1201 desc1201">
  <title id="title1201">吸脂能解决什么、不能解决什么</title>
  <desc id="desc1201">吸脂是体形雕塑手段不是减肥，能改善局部轮廓，不能减重或改善皮肤松弛</desc>
  <defs>
    <linearGradient id="bg1201" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1201" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
      .yes { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#0072B2; }
      .no { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#D55E00; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1201)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1201)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 12</text>
  <text x="62" y="117" class="title">吸脂是体形雕塑，不是减肥</text>
  <text x="62" y="153" class="kicker">把边界想清楚，能筛掉大量事后失望</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：能解决（蓝绿） -->
  <rect x="62" y="210" width="380" height="295" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="210" width="380" height="46" rx="16" fill="#0072B2"/>
  <rect x="62" y="240" width="380" height="16" fill="#0072B2"/>
  <text x="252" y="240" class="nodeTitle" text-anchor="middle" style="fill:#ffffff">能解决</text>
  <circle cx="92" cy="290" r="5" fill="#0072B2"/>
  <text x="110" y="295" class="body">减少局部脂肪细胞数量</text>
  <circle cx="92" cy="325" r="5" fill="#0072B2"/>
  <text x="110" y="330" class="body">改善局部轮廓（腰、腹、双下巴等）</text>
  <circle cx="92" cy="360" r="5" fill="#0072B2"/>
  <text x="110" y="365" class="body">体重稳定者的局部塑形</text>
  <circle cx="92" cy="395" r="5" fill="#0072B2"/>
  <text x="110" y="400" class="body">皮肤弹性良好的局部堆积</text>
  <rect x="82" y="430" width="340" height="58" rx="8" fill="#eef6f8"/>
  <text x="252" y="453" class="small" text-anchor="middle">前提：体重保持稳定</text>
  <text x="252" y="473" class="small" text-anchor="middle">剩余脂肪细胞仍会在增重时增大</text>

  <!-- 右：不能解决（砖红） -->
  <rect x="458" y="210" width="380" height="295" rx="16" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="458" y="210" width="380" height="46" rx="16" fill="#D55E00"/>
  <rect x="458" y="240" width="380" height="16" fill="#D55E00"/>
  <text x="648" y="240" class="nodeTitle" text-anchor="middle" style="fill:#ffffff">不能解决</text>
  <circle cx="488" cy="290" r="5" fill="#D55E00"/>
  <text x="506" y="295" class="body">大幅减重（吸出脂肪体积有限）</text>
  <circle cx="488" cy="325" r="5" fill="#D55E00"/>
  <text x="506" y="330" class="body">改善皮肤松弛（甚至可能加重）</text>
  <circle cx="488" cy="360" r="5" fill="#D55E00"/>
  <text x="506" y="365" class="body">改变基础代谢和易胖体质</text>
  <circle cx="488" cy="395" r="5" fill="#D55E00"/>
  <text x="506" y="400" class="body">替代健康饮食与运动</text>
  <rect x="478" y="430" width="340" height="58" rx="8" fill="#fbeae3"/>
  <text x="648" y="453" class="small" text-anchor="middle">重度肥胖应先医学减重</text>
  <text x="648" y="473" class="small" text-anchor="middle">皮肤明显松弛需切除类手术</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">把吸脂当轻医美、午休项目，是危险认知</text>

  <text x="62" y="582" class="footer">医学教育示意 · 效果与适应证需面诊个体化评估</text>
</svg>
