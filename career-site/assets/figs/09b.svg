<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 430"><rect width="800" height="430" x="0" y="0" fill="#fffdf9"/><rect width="752" height="382" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="96" height="30" x="46" y="40" fill="#c9a876" rx="15"/><text x="94" y="60" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle">翻 译 器</text><rect width="200" height="30" x="170" y="40" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="15"/><text x="270" y="60" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">总包 / 期权</text><text x="392" y="61" fill="#c9a876" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">⟶</text><rect width="200" height="30" x="412" y="40" fill="#f4ede0" stroke="#c9a876" stroke-width="1.4" rx="15"/><text x="512" y="60" fill="#c9a876" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">底薪 / 提成</text><rect width="708" height="84" x="46" y="104" fill="#f5f7f0" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><rect width="6" height="84" x="46" y="104" fill="#7a8b6f" rx="3"/><text x="74" y="138" fill="#7a8b6f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600">直译 · 成立处</text><text x="74" y="166" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5">都是固定加浮动的薪酬结构，方向可对译</text><rect width="708" height="84" x="46" y="204" fill="#faf3f0" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><rect width="6" height="84" x="46" y="204" fill="#b5654a" rx="3"/><text x="74" y="238" fill="#b5654a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600">失真处</text><text x="74" y="266" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5">期权赌未来有兑现场景，提成赌当期且基数怎么算是利益问题</text><rect width="708" height="84" x="46" y="304" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><rect width="6" height="84" x="46" y="304" fill="#2b2a28" rx="3"/><text x="74" y="338" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600">大厂人的典型错误</text><text x="74" y="366" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5">只谈底薪，不好意思细问提成与考核口径</text><text x="46" y="394" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">类比在哪里成立、在哪里失效，看见边界再动手</text></svg>