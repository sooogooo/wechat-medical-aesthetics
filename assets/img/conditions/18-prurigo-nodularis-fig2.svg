<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t18f2 d18f2" role="img" viewBox="0 0 800 500"><title id="t18f2">结节性痒疹在家减少二次伤害</title><desc id="t18f2">护理与复诊三项结果准备，抓痕减少不代表患者终于自律</desc><defs><linearGradient id="bg18f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh18f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg18f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh18f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 18</text><text x="56" y="90" class="title">在家怎样减少二次伤害</text><text x="56" y="116" class="kicker">治疗是组合拳，居家护理是其中一环</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">居家护理四件事</text><rect width="335" height="58" x="56" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="84" cy="201" r="16" fill="#7A8B6F"/><text x="84" y="206" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="112" y="197" class="body" font-weight="700">物理隔断抓挠</text><text x="112" y="217" class="small">手套 短指甲 夜间敷料</text><rect width="335" height="58" x="409" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="437" cy="201" r="16" fill="#7A8B6F"/><text x="437" y="206" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="465" y="197" class="body" font-weight="700">保湿润肤</text><text x="465" y="217" class="small">修复屏障减轻干燥痒</text><rect width="335" height="58" x="56" y="242" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><circle cx="84" cy="271" r="16" fill="#C9A876"/><text x="84" y="276" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="112" y="267" class="body" font-weight="700">冷敷替代抓挠</text><text x="112" y="287" class="small">痒时冷敷或拍打而非抓</text><rect width="335" height="58" x="409" y="242" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><circle cx="437" cy="271" r="16" fill="#C9A876"/><text x="437" y="276" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="465" y="267" class="body" font-weight="700">保护睡眠</text><text x="465" y="287" class="small">睡前用药 减少夜间痒醒</text><text x="56" y="338" class="nodeTitle">为复诊准备三项结果</text><rect width="220" height="80" x="56" y="352" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="166" y="380" class="body" font-weight="700" text-anchor="middle">抓挠次数</text><text x="166" y="404" class="small" text-anchor="middle">每周记录趋势</text><rect width="220" height="80" x="290" y="352" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="400" y="380" class="body" font-weight="700" text-anchor="middle">睡眠质量</text><text x="400" y="404" class="small" text-anchor="middle">是否夜间痒醒</text><rect width="220" height="80" x="524" y="352" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="634" y="380" class="body" font-weight="700" text-anchor="middle">新结节数量</text><text x="634" y="404" class="small" text-anchor="middle">是否还在增多</text><rect width="688" height="22" x="56" y="442" fill="#eef4ee" rx="8"/><text x="400" y="457" class="quote" font-size="14" text-anchor="middle">抓痕减少，不代表患者终于自律</text><text x="56" y="474" class="footer">医学教育示意 · 治疗常需数周见效，配合医生组合方案比单靠意志力更有效</text></svg>