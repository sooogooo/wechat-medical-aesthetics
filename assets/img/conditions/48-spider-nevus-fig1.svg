<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t48f1 d48f1" role="img" viewBox="0 0 800 500"><title id="t48f1">蜘蛛痣的结构与褪色征</title><desc id="d48f1">中央小动脉向外放射毛细血管形成红色皮损，按压中央可暂时褪色</desc><defs><linearGradient id="bg48f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh48f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg48f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh48f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 48</text><text x="52" y="92" class="title">蜘蛛痣的结构与褪色征</text><text x="52" y="116" class="kicker">中央小动脉向外放射毛细血管，按压中央可暂时褪色</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">结构示意</text><g transform="translate(190,280)"><g fill="none" stroke="#B5654A" stroke-width="1.6" opacity=".8"><line x1="0" x2="0" y1="0" y2="-70"/><line x1="0" x2="50" y1="0" y2="-50"/><line x1="0" x2="70" y1="0" y2="0"/><line x1="0" x2="50" y1="0" y2="50"/><line x1="0" x2="0" y1="0" y2="70"/><line x1="0" x2="-50" y1="0" y2="50"/><line x1="0" x2="-70" y1="0" y2="0"/><line x1="0" x2="-50" y1="0" y2="-50"/><line x1="0" x2="30" y1="0" y2="-65"/><line x1="0" x2="65" y1="0" y2="-30"/><line x1="0" x2="65" y1="0" y2="30"/><line x1="0" x2="30" y1="0" y2="65"/><line x1="0" x2="-30" y1="0" y2="65"/><line x1="0" x2="-65" y1="0" y2="30"/><line x1="0" x2="-65" y1="0" y2="-30"/><line x1="0" x2="-30" y1="0" y2="-65"/></g><circle cx="0" cy="0" r="10" fill="#B5654A"/><circle cx="0" cy="0" r="5" fill="#7a3a25"/></g><text x="190" y="380" class="small" text-anchor="middle">中央小红点</text><text x="190" y="398" class="small" text-anchor="middle">向四周放射的细丝</text><text x="190" y="416" fill="#B5654A" class="small" text-anchor="middle">整体像一只小蜘蛛</text><text x="350" y="162" class="nodeTitle">玻璃片按压褪色征</text><rect width="190" height="80" x="350" y="178" fill="#fbf0eb" stroke="#B5654A" rx="12"/><circle cx="380" cy="218" r="14" fill="#B5654A"/><g stroke="#B5654A" stroke-width="1.4" opacity=".7"><line x1="380" x2="380" y1="218" y2="200"/><line x1="380" x2="394" y1="218" y2="206"/><line x1="380" x2="396" y1="218" y2="220"/><line x1="380" x2="392" y1="218" y2="232"/><line x1="380" x2="380" y1="218" y2="236"/><line x1="380" x2="368" y1="218" y2="232"/><line x1="380" x2="364" y1="218" y2="220"/><line x1="380" x2="368" y1="218" y2="206"/></g><text x="450" y="200" class="body">1 静止</text><text x="450" y="224" class="small">红色皮损可见</text><text x="450" y="244" class="small">中央有搏动感</text><rect width="192" height="80" x="556" y="178" fill="#f8fbfb" stroke="#7A8B6F" rx="12"/><circle cx="586" cy="218" r="14" fill="none" stroke="#7d8e93" stroke-dasharray="2 2"/><text x="640" y="200" class="body">2 按压中央</text><text x="640" y="224" class="small">整只&quot;蜘蛛&quot;褪色</text><text x="640" y="244" class="small">放射支也变白</text><rect width="398" height="80" x="350" y="278" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><circle cx="380" cy="318" r="14" fill="#B5654A" opacity=".5"/><text x="450" y="300" class="body">3 松开后回流</text><text x="450" y="324" class="small">从中央向四周瞬间充盈</text><text x="450" y="344" class="small">恢复红色</text><text x="52" y="408" class="nodeTitle">常见部位</text><rect width="150" height="18" x="52" y="418" fill="#7A8B6F" rx="6"/><text x="127" y="431" fill="#fff" class="small" text-anchor="middle">面颈部</text><rect width="150" height="18" x="214" y="418" fill="#7A8B6F" rx="6"/><text x="289" y="431" fill="#fff" class="small" text-anchor="middle">上胸</text><rect width="150" height="18" x="376" y="418" fill="#7A8B6F" rx="6"/><text x="451" y="431" fill="#fff" class="small" text-anchor="middle">手背</text><rect width="150" height="18" x="538" y="418" fill="#7A8B6F" rx="6"/><text x="613" y="431" fill="#fff" class="small" text-anchor="middle">儿童孕妇常见</text><rect width="696" height="6" x="52" y="448" fill="#C9A876" opacity=".3"/><text x="52" y="466" class="footer">健康科普示意 · 是否需进一步检查须由医师评估</text></svg>