<svg xmlns="http://www.w3.org/2000/svg" aria-label="法令纹成因示意" role="img" viewBox="0 0 640 300"><rect width="640" height="300" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">法令纹不只是“沟”，是中面部变化的综合结果</text><ellipse cx="320" cy="160" fill="#f3efe8" stroke="#a8a39d" rx="110" ry="130"/><ellipse cx="270" cy="170" fill="#eef0ea" stroke="#8a9a7f" stroke-dasharray="3 2" rx="30" ry="25"/><ellipse cx="370" cy="170" fill="#eef0ea" stroke="#8a9a7f" stroke-dasharray="3 2" rx="30" ry="25"/><text x="270" y="174" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">苹果肌</text><text x="370" y="174" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">苹果肌</text><path fill="none" stroke="#b5654a" stroke-width="2.5" d="M 285 195 Q 295 220 305 245"/><path fill="none" stroke="#b5654a" stroke-width="2.5" d="M 355 195 Q 345 220 335 245"/><text x="260" y="230" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">法令纹</text><path stroke="#8a9a7f" stroke-width="1.5" marker-end="url(#a1)" d="M 270 150 L 270 168"/><path stroke="#8a9a7f" stroke-width="1.5" marker-end="url(#a1)" d="M 370 150 L 370 168"/><defs><marker id="a1" markerHeight="8" markerWidth="8" orient="auto" refX="4" refY="4"><polygon fill="#8a9a7f" points="0 0 8 4 0 8"/></marker></defs><line x1="270" x2="150" y1="170" y2="120" stroke="#a8a39d" stroke-width="1"/><text x="80" y="115" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">苹果肌萎缩、下移</text><text x="80" y="132" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">→ 支撑减弱</text><line x1="305" x2="450" y1="245" y2="270" stroke="#a8a39d" stroke-width="1"/><text x="460" y="265" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">法令纹加深</text><text x="460" y="282" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">是结果，不是原因</text><text x="320" y="293" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">图为示意；实际解剖更复杂，需医生面诊评估</text></svg>