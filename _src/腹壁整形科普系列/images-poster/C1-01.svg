<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="titleC101 descC101" role="img" viewBox="0 0 900 620"><title id="titleC101">疤痕的位置与长度现实</title><desc id="descC101">各术式疤痕相对长度示意，迷你型到环形，倒 T 型另有纵疤</desc><defs><marker id="ahC101" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#b7c6cb" d="M0,0 L10,5 L0,10 z"/></marker><style>.series{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.8px;fill:#7d97a4}.title{font:300 32px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.kicker{font:400 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.midTitle{font:500 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.small{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.quote{font:400 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.footer{font:400 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#93a3a8}</style></defs><rect width="899" height="619" x=".5" y=".5" fill="#fff" stroke="#dde5e7" stroke-width="1"/><text x="62" y="64" class="series">腹壁整形 12 讲 · C1</text><text x="62" y="112" class="title">疤痕的位置与长度现实</text><text x="62" y="148" class="kicker">术式决定疤的长度，可能增生变宽，可能外露</text><line x1="62" x2="838" y1="172" y2="172" stroke="#e3e9ea" stroke-width="1"/><text x="62" y="206" class="small">术式</text><text x="210" y="206" class="small">相对切口长度（示意）</text><text x="62" y="236" class="midTitle">迷你型</text><rect width="120" height="10" x="210" y="222" fill="#0072B2" rx="5"/><text x="344" y="236" class="small">下腹短横切口</text><text x="62" y="290" class="midTitle">标准型</text><rect width="240" height="10" x="210" y="276" fill="#0B8A6B" rx="5"/><text x="464" y="290" class="small">髋到髋横切口</text><text x="62" y="344" class="midTitle">延伸型</text><rect width="380" height="10" x="210" y="330" fill="#D9930D" rx="5"/><text x="604" y="344" class="small">延伸绕到侧腰</text><text x="62" y="398" class="midTitle">环形</text><rect width="540" height="10" x="210" y="384" fill="#C75B00" rx="5"/><text x="764" y="398" class="small">绕躯干一周</text><text x="62" y="452" class="midTitle">倒 T 型</text><rect width="280" height="10" x="210" y="438" fill="#B36A98" rx="5"/><rect width="6" height="30" x="347" y="410" fill="#B36A98" rx="3"/><text x="504" y="452" class="small">横＋正中纵切口</text><text x="62" y="492" class="small">标准型及以上，脐周另有一圈疤，可能增生、变宽，穿低腰裤、泳装时可能显露</text><line x1="62" x2="838" y1="520" y2="520" stroke="#e3e9ea" stroke-width="1"/><text x="450" y="548" class="quote" text-anchor="middle">对疤痕的接受度，是决策的核心之一</text><text x="62" y="580" class="footer">医学教育示意，非教学图 · 疤痕最终表现因人而异</text></svg>