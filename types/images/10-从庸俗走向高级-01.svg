<svg xmlns="http://www.w3.org/2000/svg" aria-label="走向高级型的四个维度" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">走向高级型：四个维度的转变</text><rect width="140" height="230" x="30" y="60" fill="#fff" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><circle cx="100" cy="95" r="16" fill="#7a8b6f"/><text x="100" y="100" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">1</text><text x="100" y="140" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">观念</text><text x="100" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">从&quot;追逐流行&quot;</text><text x="100" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">到&quot;认识自己&quot;</text><text x="100" y="230" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">先想清</text><text x="100" y="247" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">&quot;我是谁&quot;</text><rect width="140" height="230" x="180" y="60" fill="#fff" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><circle cx="250" cy="95" r="16" fill="#7a8b6f"/><text x="250" y="100" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">2</text><text x="250" y="140" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">选择</text><text x="250" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">从&quot;选机构&quot;</text><text x="250" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">到&quot;选医生&quot;</text><text x="250" y="230" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">看审美</text><text x="250" y="247" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">而非装修</text><rect width="140" height="230" x="330" y="60" fill="#fff" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><circle cx="400" cy="95" r="16" fill="#7a8b6f"/><text x="400" y="100" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">3</text><text x="400" y="140" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">沟通</text><text x="400" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">从&quot;被动接受&quot;</text><text x="400" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">到&quot;协作决策&quot;</text><text x="400" y="230" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">做审美</text><text x="400" y="247" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">合伙人</text><rect width="140" height="230" x="480" y="60" fill="#fff" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><circle cx="550" cy="95" r="16" fill="#7a8b6f"/><text x="550" y="100" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">4</text><text x="550" y="140" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">长期</text><text x="550" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">从&quot;一次性&quot;</text><text x="550" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">到&quot;长期主义&quot;</text><text x="550" y="230" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">追求耐看</text><text x="550" y="247" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">而非惊艳</text><text x="320" y="310" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">四个维度同时转变，才能稳定地走向高级型</text></svg>