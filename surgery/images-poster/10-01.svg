troke-width="2.5" rx="14"/><circle cx="105" cy="253" r="22" fill="#D55E00"/><text x="105" y="262" class="num" text-anchor="middle">!</text><text x="140" y="260" class="nodeTitle">出血</text><text x="82" y="300" fill="#17323d" class="body" font-weight="700">表现</text><text x="82" y="322" class="body">术中术区出血</text><text x="82" y="344" class="body">术后血肿</text><text x="82" y="366" class="body">肿胀迅速加重</text><text x="82" y="396" fill="#17323d" class="body" font-weight="700">机构需具备</text><text x="82" y="418" class="body">麻醉科 · 止血设备</text><text x="82" y="440" class="body">血库或备血渠道</text><text x="82" y="462" class="body">血管造影介入</text><rect width="212" height="22" x="82" y="472" fill="#fbeae3" rx="6"/><text x="188" y="488" class="small" text-anchor="middle">无血备＝裸奔</text><rect width="252" height="295" x="324" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5" rx="14"/><circle cx="367" cy="253" r="22" fill="#D55E00"/><text x="367" y="262" class="num" text-anchor="middle">!</text><text x="402" y="260" class="nodeTitle">神经损伤</text><text x="344" y="300" fill="#17323d" class="body" font-weight="700">表现</text><text x="344" y="322" class="body">下唇、颏部麻木</text><text x="344" y="344" class="body">眼睑闭合不全</text><text x="344" y="366" class="body">面部表情不对称</text><text x="344" y="396" fill="#17323d" class="body" font-weight="700">特点</text><text x="344" y="418" class="body">无法完全避免</text><text x="344" y="440" class="body">多数可恢复</text><text x="344" y="462" class="body">少数长期存在</text><rect width="212" height="22" x="344" y="472" fill="#fbeae3" rx="6"/><text x="450" y="488" class="small" text-anchor="middle">恢复期数月到一年</text><rect width="252" height="295" x="586" y="210" fill="#D55E00" stroke="#D55E00" stroke-width="2.5" rx="14"/><circle cx="629" cy="253" r="22" fill="#fff"/><text x="629" y="262" fill="#D55E00" class="num" text-anchor="middle">!</text><text x="664" y="260" fill="#fff" class="nodeTitle">气道问题</text><text x="606" y="300" fill="#fff" class="body" font-weight="700">表现</text><text x="606" y="322" fill="#fff" class="body">舌根后坠</text><text x="606" y="344" fill="#fff" class="body">口底血肿</text><text x="606" y="366" fill="#fff" class="body">咽喉肿胀致呼吸困难</text><text x="606" y="396" fill="#fff" class="body" font-weight="700">机构需具备</text><text x="606" y="418" fill="#fff" class="body">术后监护</text><text x="606" y="440" fill="#fff" class="body">气道管理设备</text><text x="606" y="462" fill="#fff" class="body">立即建立人工气道</text><rect width="212" height="22" x="606" y="472" fill="#fff" opacity=".9" rx="6"/><text x="712" y="488" fill="#D55E00" class="small" text-anchor="middle">最易迅速危及生命</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">这些风险决定机构&quot;出事能不能救&quot;是底线，不是加分项</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 颌面四级手术须在有相应资质、具备急救能力的机构开展</text></svg>