<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="法令纹成因示意">
  <rect width="640" height="300" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">法令纹不只是“沟”，是中面部变化的综合结果</text>

  <!-- 简化中面部 -->
  <ellipse cx="320" cy="160" rx="110" ry="130" fill="#f3efe8" stroke="#a8a39d"/>

  <!-- 苹果肌区域（萎缩下移示意） -->
  <ellipse cx="270" cy="170" rx="30" ry="25" fill="#eef0ea" stroke="#8a9a7f" stroke-dasharray="3,2"/>
  <ellipse cx="370" cy="170" rx="30" ry="25" fill="#eef0ea" stroke="#8a9a7f" stroke-dasharray="3,2"/>
  <text x="270" y="174" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">苹果肌</text>
  <text x="370" y="174" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">苹果肌</text>

  <!-- 法令纹 -->
  <path d="M 285 195 Q 295 220 305 245" stroke="#b5654a" stroke-width="2.5" fill="none"/>
  <path d="M 355 195 Q 345 220 335 245" stroke="#b5654a" stroke-width="2.5" fill="none"/>
  <text x="260" y="230" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">法令纹</text>

  <!-- 下移箭头 -->
  <path d="M 270 150 L 270 168" stroke="#8a9a7f" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M 370 150 L 370 168" stroke="#8a9a7f" stroke-width="1.5" marker-end="url(#a1)"/>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#8a9a7f"/>
    </marker>
  </defs>

  <!-- 标注 -->
  <line x1="270" y1="170" x2="150" y2="120" stroke="#a8a39d" stroke-width="1"/>
  <text x="80" y="115" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">苹果肌萎缩、下移</text>
  <text x="80" y="132" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">→ 支撑减弱</text>

  <line x1="305" y1="245" x2="450" y2="270" stroke="#a8a39d" stroke-width="1"/>
  <text x="460" y="265" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">法令纹加深</text>
  <text x="460" y="282" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">是结果，不是原因</text>

  <text x="320" y="293" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">图为示意；实际解剖更复杂，需医生面诊评估</text>
</svg>