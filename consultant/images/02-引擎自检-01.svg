<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t02a d02a">
  <title id="t02a">引擎自检三组红绿灯仪表盘</title>
  <desc id="d02a">21条自检分为性格底盘现实条件价值观三组，判读规则在底部色带</desc>
  <defs>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .groupName{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .badge{font:700 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
      .item{font:500 11.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .needle{stroke:#2B2A28;stroke-width:3;stroke-linecap:round;}
      .rule{font:700 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .ruleSub{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect x="30" y="26" width="740" height="448" rx="10" fill="#ffffff" stroke="#e4ddd2"/>
  <text x="56" y="58" class="series">医美咨询师成长教程 · 阶段0 · 02</text>
  <text x="56" y="90" class="title">引擎自检 21 条红绿灯</text>
  <text x="56" y="116" class="kicker">转行之前先过仪表盘，冲动是这条路线最大的事故源</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- A组 -->
  <rect x="52" y="148" width="222" height="258" rx="10" fill="#ffffff" stroke="#c5d3c0" stroke-width="1.3"/>
  <path d="M 163 246 A 58 58 0 0 1 221 188" stroke="#B5654A" stroke-width="13" fill="none"/>
  <path d="M 221 188 A 58 58 0 0 1 279 246" stroke="#C9A876" stroke-width="13" fill="none"/>
  <path d="M 113 246 A 50 50 0 0 1 163 196" stroke="#7A8B6F" stroke-width="13" fill="none"/>
  <line x1="163" y1="246" x2="198" y2="211" class="needle"/>
  <circle cx="163" cy="246" r="5" fill="#2B2A28"/>
  <text x="163" y="278" class="groupName" text-anchor="middle">A · 性格与能力底盘</text>
  <rect x="133" y="288" width="60" height="20" rx="10" fill="#7A8B6F"/>
  <text x="163" y="302" class="badge" text-anchor="middle">8 条</text>
  <text x="163" y="332" class="item" text-anchor="middle">外行也能听懂的讲解力</text>
  <text x="163" y="352" class="item" text-anchor="middle">接得住情绪的共情力</text>
  <text x="163" y="372" class="item" text-anchor="middle">被拒绝后的恢复速度</text>
  <text x="163" y="392" class="item" text-anchor="middle">对医学知识的好奇心</text>

  <!-- B组 -->
  <rect x="290" y="148" width="222" height="258" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.3"/>
  <path d="M 401 246 A 58 58 0 0 1 459 188" stroke="#B5654A" stroke-width="13" fill="none"/>
  <path d="M 459 188 A 58 58 0 0 1 517 246" stroke="#C9A876" stroke-width="13" fill="none"/>
  <path d="M 351 246 A 50 50 0 0 1 401 196" stroke="#7A8B6F" stroke-width="13" fill="none"/>
  <line x1="401" y1="246" x2="366" y2="211" class="needle"/>
  <circle cx="401" cy="246" r="5" fill="#2B2A28"/>
  <text x="401" y="278" class="groupName" text-anchor="middle">B · 现实条件</text>
  <rect x="371" y="288" width="60" height="20" rx="10" fill="#C9A876"/>
  <text x="401" y="302" class="badge" text-anchor="middle">7 条</text>
  <text x="401" y="332" class="item" text-anchor="middle">6 个月生活储备</text>
  <text x="401" y="352" class="item" text-anchor="middle">家人支持度</text>
  <text x="401" y="372" class="item" text-anchor="middle">所在城市市场容量</text>
  <text x="401" y="392" class="item" text-anchor="middle">对提成制收入的接受度</text>

  <!-- C组 -->
  <rect x="528" y="148" width="222" height="258" rx="10" fill="#ffffff" stroke="#d9b3a6" stroke-width="1.3"/>
  <path d="M 639 246 A 58 58 0 0 1 697 188" stroke="#B5654A" stroke-width="13" fill="none"/>
  <path d="M 697 188 A 58 58 0 0 1 755 246" stroke="#C9A876" stroke-width="13" fill="none"/>
  <path d="M 589 246 A 50 50 0 0 1 639 196" stroke="#7A8B6F" stroke-width="13" fill="none"/>
  <line x1="639" y1="246" x2="674" y2="281" class="needle"/>
  <circle cx="639" cy="246" r="5" fill="#2B2A28"/>
  <text x="639" y="278" class="groupName" text-anchor="middle">C · 价值观（一票否决）</text>
  <rect x="609" y="288" width="60" height="20" rx="10" fill="#B5654A"/>
  <text x="639" y="302" class="badge" text-anchor="middle">6 条</text>
  <text x="639" y="332" class="item" text-anchor="middle">接受不承诺疗效慢成交</text>
  <text x="639" y="352" class="item" text-anchor="middle">不放大容貌焦虑促单</text>
  <text x="639" y="372" class="item" text-anchor="middle">能拒绝不合适的客户</text>
  <text x="639" y="392" class="item" text-anchor="middle">接受医生拥有决策权</text>

  <!-- 判读规则 -->
  <rect x="52" y="418" width="698" height="44" rx="10" fill="#ffffff" stroke="#dcdcd8" stroke-width="1.2"/>
  <circle cx="76" cy="440" r="7" fill="#7A8B6F"/>
  <text x="90" y="437" class="rule">绿灯 ≥ 15 → 出发</text>
  <text x="90" y="453" class="ruleSub">且 C 组无红灯</text>
  <circle cx="256" cy="440" r="7" fill="#C9A876"/>
  <text x="270" y="437" class="rule">黄灯集中 B 组 → 缓行</text>
  <text x="270" y="453" class="ruleSub">补齐储备与支持再出发</text>
  <circle cx="470" cy="440" r="7" fill="#B5654A"/>
  <text x="484" y="437" class="rule">C 组任一红灯 → 建议放弃</text>
  <text x="484" y="453" class="ruleSub">这不是失败，是红绿灯在救命</text>

  <text x="56" y="470" class="footer">指针位置仅为示意 · 21 条全文见课程 02 课</text>
</svg>
