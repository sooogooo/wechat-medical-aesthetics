<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="MD Codes 层级结构示意">
  <rect width="720" height="340" fill="#faf8f4" rx="12"/>
  <text x="360" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">从大区到具体 code（以颊部为例）</text>

  <!-- 第一级：大区 -->
  <rect x="40" y="70" width="160" height="200" rx="8" fill="#7a8b6f"/>
  <text x="120" y="110" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">大区</text>
  <text x="120" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" fill="#ffffff">Cheeks（颊部）</text>
  <text x="120" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#eef0ea">苹果肌所在的</text>
  <text x="120" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#eef0ea">大功能区域</text>

  <!-- 箭头 -->
  <line x1="200" y1="170" x2="260" y2="170" stroke="#a8a39d" stroke-width="2" marker-end="url(#m1)"/>
  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#a8a39d"/>
    </marker>
  </defs>

  <!-- 第二级：子区 -->
  <rect x="260" y="70" width="180" height="200" rx="8" fill="#8a9a7f"/>
  <text x="350" y="110" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">子区域</text>
  <text x="350" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#ffffff">颧骨前区</text>
  <text x="350" y="160" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#ffffff">颧弓区</text>
  <text x="350" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#ffffff">颊侧区</text>
  <text x="350" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#eef0ea">按解剖位置细分</text>

  <line x1="440" y1="170" x2="500" y2="170" stroke="#a8a39d" stroke-width="2" marker-end="url(#m1)"/>

  <!-- 第三级：code -->
  <rect x="500" y="70" width="180" height="200" rx="8" fill="#c9a876"/>
  <text x="590" y="110" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">具体 code</text>
  <rect x="520" y="130" width="60" height="28" rx="4" fill="#ffffff"/>
  <text x="550" y="149" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">Ck1</text>
  <rect x="600" y="130" width="60" height="28" rx="4" fill="#ffffff"/>
  <text x="630" y="149" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">Ck2</text>
  <rect x="520" y="170" width="60" height="28" rx="4" fill="#ffffff"/>
  <text x="550" y="189" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">Ck3</text>
  <rect x="600" y="170" width="60" height="28" rx="4" fill="#ffffff"/>
  <text x="630" y="189" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">Ck4</text>
  <text x="590" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#ffffff">每个 code 对应</text>
  <text x="590" y="248" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#ffffff">明确层次与技术</text>

  <text x="360" y="305" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">读到“Ck1”，你就知道它指的是“颊部大区 → 颧骨前子区 → 第 1 号点位”</text>
  <text x="360" y="325" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">图为层级示意；具体 code 数量和命名以 MD Codes 体系为准</text>
</svg>