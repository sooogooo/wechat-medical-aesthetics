<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title00a desc00a" role="img" viewBox="0 0 900 620"><title id="title00a">美容手术分级：四级意味着什么</title><desc id="desc00a">美容手术按风险分一至四级，级别反映风险与资质门槛，不等于&quot;更好看&quot;</desc><defs><linearGradient id="bg00a" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh00a" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.lvl{font:700 22px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg00a)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh00a)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 00</text><text x="62" y="117" class="title">美容手术分级：四级意味着什么</text><text x="62" y="153" class="kicker">级别反映风险与资质门槛，不等于&quot;更好看&quot;</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">风险与资质逐级升高</text><rect width="200" height="90" x="62" y="430" fill="#f8fbfb" stroke="#56B4E9" stroke-width="2" rx="14"/><rect width="200" height="32" x="62" y="430" fill="#56B4E9" rx="14"/><rect width="200" height="10" x="62" y="452" fill="#56B4E9"/><text x="162" y="452" class="lvl" text-anchor="middle">一级</text><text x="162" y="488" class="body" text-anchor="middle">创伤小、恢复快</text><text x="162" y="508" class="small" text-anchor="middle">重睑、简单隆鼻</text><rect width="200" height="90" x="274" y="395" fill="#f8fbfb" stroke="#009E73" stroke-width="2" rx="14"/><rect width="200" height="32" x="274" y="395" fill="#009E73" rx="14"/><rect width="200" height="10" x="274" y="417" fill="#009E73"/><text x="374" y="417" class="lvl" text-anchor="middle">二级</text><text x="374" y="453" class="body" text-anchor="middle">复杂度上升</text><text x="374" y="473" class="small" text-anchor="middle">需住院观察</text><rect width="200" height="90" x="486" y="360" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="200" height="32" x="486" y="360" fill="#E69F00" rx="14"/><rect width="200" height="10" x="486" y="382" fill="#E69F00"/><text x="586" y="382" class="lvl" text-anchor="middle">三级</text><text x="586" y="418" class="body" text-anchor="middle">风险更高</text><text x="586" y="438" class="small" text-anchor="middle">麻醉与监护要求严</text><rect width="140" height="90" x="698" y="325" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5" rx="14"/><rect width="140" height="32" x="698" y="325" fill="#D55E00" rx="14"/><rect width="140" height="10" x="698" y="347" fill="#D55E00"/><text x="768" y="347" class="lvl" text-anchor="middle">四级</text><text x="768" y="383" class="body" text-anchor="middle">最高风险</text><text x="768" y="403" class="small" text-anchor="middle">骨、深部、全麻</text><path fill="none" stroke="#7d8e93" stroke-dasharray="5 4" stroke-width="1.8" d="M 200 510 Q 450 300 768 405"/><path fill="none" stroke="#7d8e93" stroke-width="1.8" d="M 760 398 L 768 405 L 758 408"/><text x="450" y="290" class="small" text-anchor="middle">风险 · 资质门槛 · 不可逆性</text><rect width="776" height="40" x="62" y="540" fill="#eef6f8" rx="12"/><text x="450" y="566" class="quote" text-anchor="middle">级别反映的是风险，不是消费档次</text><text x="62" y="582" class="footer">医学教育示意 · 具体项目分级以属地卫健部门现行规定为准</text></svg>