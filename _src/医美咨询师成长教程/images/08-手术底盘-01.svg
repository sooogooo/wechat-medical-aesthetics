<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t08p d08p">
  <title id="t08p">手术分级金字塔，四级手术在塔尖</title>
  <desc id="d08p">四级金字塔自底向上为一级皮肤小手术、二级中等复杂手术、三级眼鼻胸腹类手术、四级颌面轮廓类手术；层级越高机构与医生资质要求越严，塔尖的四级手术需要零容忍核验。</desc>
  <defs>
    <marker id="ax08p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b6864"/>
    </marker>
  </defs>

  <!-- 纸面 -->
  <rect width="800" height="500" fill="#faf8f4"/>

  <!-- 页眉 -->
  <text x="56" y="52" fill="#a8a39d" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.18em">PYRAMID · 手术分级</text>
  <text x="56" y="84" fill="#2b2a28" font-size="28" font-family="'Songti SC',Georgia,serif">四级手术在塔尖</text>
  <text x="56" y="106" fill="#6b6864" font-size="12" font-family="'PingFang SC','Microsoft YaHei',sans-serif">级别越高，机构与医生资质要求越严</text>

  <!-- 左缘坐标轴 -->
  <path d="M 64 420 L 64 152" stroke="#6b6864" stroke-width="1" fill="none" marker-end="url(#ax08p)"/>
  <text x="64" y="136" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em" text-anchor="middle">资质要求</text>

  <!-- 金字塔：cx=320，基线 y=420，层高 70，半宽步进 48 -->
  <!-- L4 四级（塔尖 · 焦点） -->
  <polygon points="296,140 344,140 392,210 248,210" fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2"/>
  <text x="320" y="172" fill="#2b2a28" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">四级 · 颌面轮廓</text>
  <text x="320" y="192" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">下颌角 · 颧骨</text>

  <!-- L3 三级 -->
  <polygon points="248,210 392,210 440,280 200,280" fill="#ffffff" stroke="#2b2a28" stroke-width="1"/>
  <text x="344" y="242" fill="#2b2a28" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">三级 · 眼鼻胸腹</text>
  <text x="344" y="262" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">综合鼻 · 隆胸 · 腹壁</text>

  <!-- L2 二级 -->
  <polygon points="200,280 440,280 488,350 152,350" fill="#ffffff" stroke="#2b2a28" stroke-width="1"/>
  <text x="368" y="312" fill="#2b2a28" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">二级 · 中等复杂</text>
  <text x="368" y="332" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">常规住院 · 系统管理</text>

  <!-- L1 一级（基座） -->
  <polygon points="152,350 488,350 536,420 104,420" fill="#ffffff" stroke="#2b2a28" stroke-width="1"/>
  <text x="392" y="382" fill="#2b2a28" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">一级 · 皮肤小手术</text>
  <text x="392" y="402" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">痣 · 赘生物切除 · 持证门诊</text>

  <!-- 右侧注释（带发丝引线） -->
  <line x1="396" y1="175" x2="588" y2="175" stroke="rgba(43,42,40,0.12)" stroke-width="0.8"/>
  <text x="596" y="172" fill="#7a8b6f" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">机构 + 医生 双重零容忍</text>
  <text x="596" y="186" fill="#a8a39d" font-size="8" font-family="'SF Mono',Consolas,monospace">查不到 = 不往前走</text>

  <line x1="418" y1="245" x2="588" y2="245" stroke="rgba(43,42,40,0.12)" stroke-width="0.8"/>
  <text x="596" y="242" fill="#6b6864" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">审美沟通 · 修复率敏感</text>

  <line x1="468" y1="315" x2="620" y2="315" stroke="rgba(43,42,40,0.12)" stroke-width="0.8"/>
  <text x="596" y="312" fill="#6b6864" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">住院与随访体系</text>

  <!-- 基座注 -->
  <text x="392" y="440" fill="#a8a39d" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">塔基最宽 = 项目最多 · 塔尖最窄 = 门槛最高</text>

  <!-- 图例（底部横条） -->
  <line x1="56" y1="456" x2="744" y2="456" stroke="rgba(43,42,40,0.12)" stroke-width="0.8"/>
  <text x="56" y="472" fill="#6b6864" font-size="8" font-family="'SF Mono',Consolas,monospace" letter-spacing="0.14em">LEGEND</text>
  <polygon points="128,464 140,464 146,476 122,476" fill="#ffffff" stroke="#2b2a28" stroke-width="1"/>
  <text x="152" y="474" fill="#6b6864" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">层级 = 资质门槛</text>
  <polygon points="256,463 264,463 270,476 250,476" fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2"/>
  <text x="278" y="474" fill="#6b6864" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">焦点 = 核验零容忍</text>
  <text x="420" y="474" fill="#a8a39d" font-size="8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">宽度示意项目数量相对关系，非统计比例</text>
</svg>
