<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t10f2 d10f2">
  <title id="t10f2">太田痣激光淡化疗程节奏</title>
  <desc id="t10f2">治疗能变淡不等于所有色素消失，需多次累积配合长期维护</desc>
  <defs>
    <linearGradient id="bg10f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh10f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg10f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh10f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 10</text>
  <text x="56" y="90" class="title">激光淡化的合理节奏</text>
  <text x="56" y="116" class="kicker">能变淡，不等于所有色素都消失</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">疗程进展示意</text>

  <!-- 程度条概念 -->
  <rect x="56" y="180" width="688" height="56" rx="10" fill="#f3efe6"/>
  <text x="72" y="214" class="body">治疗前 青灰色明显 分布较广</text>

  <rect x="56" y="244" width="688" height="56" rx="10" fill="#c9a876" opacity="0.45"/>
  <text x="72" y="278" class="body">数次后 明显变淡 仍有残余</text>

  <rect x="56" y="308" width="688" height="56" rx="10" fill="#7A8B6F" opacity="0.35"/>
  <text x="72" y="342" class="body">多次累积 可接受范围内改善</text>

  <!-- 关键提示卡 -->
  <text x="56" y="392" class="nodeTitle">三个现实预期</text>
  <rect x="56" y="406" width="220" height="44" rx="8" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.2"/>
  <text x="166" y="425" class="body" text-anchor="middle">需多次治疗</text>
  <text x="166" y="443" class="small" text-anchor="middle">间隔数月</text>

  <rect x="290" y="406" width="220" height="44" rx="8" fill="#fff8ee" stroke="#C9A876" stroke-width="1.2"/>
  <text x="400" y="425" class="body" text-anchor="middle">难以完全消失</text>
  <text x="400" y="443" class="small" text-anchor="middle">追求改善而非清零</text>

  <rect x="524" y="406" width="220" height="44" rx="8" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.2"/>
  <text x="634" y="425" class="body" text-anchor="middle">需长期维护</text>
  <text x="634" y="443" class="small" text-anchor="middle">防晒防加深</text>

  <rect x="56" y="456" width="688" height="20" rx="8" fill="#eef4ee"/>
  <text x="400" y="470" class="quote" text-anchor="middle" font-size="13">儿童治疗时机需个体化评估，把就诊信息整理成诊疗底图</text>
  <text x="400" y="490" class="footer" text-anchor="middle">医学教育示意 · 治疗能变淡不等于所有色素消失，需多次累积配合长期维护</text>
</svg>
