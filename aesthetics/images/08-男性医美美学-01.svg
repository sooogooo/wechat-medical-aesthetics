<svg xmlns="http://www.w3.org/2000/svg" aria-label="男性审美的两极与位移" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">男性审美的两极与位移</text><rect width="270" height="220" x="30" y="70" fill="#fff" stroke="#5f6e54" stroke-width="1.5" rx="8"/><rect width="270" height="40" x="30" y="70" fill="#5f6e54" rx="8"/><rect width="270" height="10" x="30" y="100" fill="#5f6e54"/><text x="165" y="96" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">传统：硬朗粗犷</text><text x="50" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 方形下颌、明显下颌角</text><text x="50" y="163" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 浓眉、深邃五官</text><text x="50" y="186" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 胡须、体毛保留</text><text x="50" y="209" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 皮肤质感&quot;糙&quot;也可</text><text x="50" y="232" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• &quot;不修边幅&quot;= 阳刚</text><text x="50" y="265" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">= 男性气质的传统模板</text><rect width="270" height="220" x="340" y="70" fill="#fff" stroke="#c9a876" stroke-width="1.5" rx="8"/><rect width="270" height="40" x="340" y="70" fill="#c9a876" rx="8"/><rect width="270" height="10" x="340" y="100" fill="#c9a876"/><text x="475" y="96" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">新兴：精致打理</text><text x="360" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 干净皮肤、无瑕疵</text><text x="360" y="163" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 修整眉形、清爽发际</text><text x="360" y="186" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 脱毛（胡须外的体毛）</text><text x="360" y="209" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 鼻部、下颌适度精修</text><text x="360" y="232" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• &quot;有打理感&quot;= 魅力</text><text x="360" y="265" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">= 年轻一代的新模板</text><text x="320" y="310" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">位移并非取代，而是多元共存——但&quot;精致男&quot;的兴起确实改变了男性审美格局</text></svg>