<svg xmlns="http://www.w3.org/2000/svg" aria-label="应暂缓或停止注射的情况" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">这些情况，建议暂缓或停止</text><rect width="185" height="115" x="30" y="55" fill="#fff" stroke="#c9a876" rx="8"/><text x="122" y="82" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">情绪不稳</text><text x="45" y="108" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">重大生活变故、</text><text x="45" y="124" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">情绪低落期间</text><text x="45" y="148" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">不要在情绪中</text><text x="45" y="162" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">做不可逆决定</text><rect width="185" height="115" x="227" y="55" fill="#fff" stroke="#b5654a" rx="8"/><text x="320" y="82" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">体象困扰</text><text x="242" y="108" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">对微小缺陷过度</text><text x="242" y="124" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">关注、反复注射</text><text x="242" y="148" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">仍不满意</text><text x="242" y="162" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">→ 需心理评估</text><rect width="185" height="115" x="424" y="55" fill="#fff" stroke="#b5654a" rx="8"/><text x="516" y="82" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">过度累积</text><text x="439" y="108" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">已经多次注射、</text><text x="439" y="124" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">开始显假、显宽</text><text x="439" y="148" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">→ 应停止叠加</text><text x="439" y="162" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">必要时溶解</text><rect width="185" height="115" x="30" y="185" fill="#fff" stroke="#7a8b6f" rx="8"/><text x="122" y="212" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">问题不适合</text><text x="45" y="238" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">严重松弛需手术、</text><text x="45" y="254" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">骨性问题、脂肪</text><text x="45" y="278" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">→ 用对手段</text><text x="45" y="292" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">而非硬打</text><rect width="185" height="115" x="227" y="185" fill="#fff" stroke="#7a8b6f" rx="8"/><text x="320" y="212" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">预期不合理</text><text x="242" y="238" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">期待&quot;换脸&quot;&quot;完美&quot;</text><text x="242" y="254" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">&quot;解决人生问题&quot;</text><text x="242" y="278" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">→ 调整预期</text><text x="242" y="292" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">再考虑</text><rect width="185" height="115" x="424" y="185" fill="#fff" stroke="#7a8b6f" rx="8"/><text x="516" y="212" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">健康状况</text><text x="439" y="238" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">妊娠/哺乳、活动</text><text x="439" y="254" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">感染、自身免疫病</text><text x="439" y="278" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">→ 等待或禁忌</text><text x="320" y="315" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">识别这些情况，比知道“该打什么”更重要</text></svg>