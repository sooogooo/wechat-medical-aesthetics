<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t04f1 d04f1">
  <title id="t04f1">黄褐斑三型分布与治疗底盘</title>
  <desc id="d04f1">表皮型真皮型混合型处理不同，防晒是治疗底盘而非配角</desc>
  <defs>
    <linearGradient id="bg04f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh04f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg04f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh04f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 04</text>
  <text x="56" y="90" class="title">黄褐斑分型与治疗底盘</text>
  <text x="56" y="116" class="kicker">对称褐斑不一定都是黄褐斑，先诊断再谈方案</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">按色素深度分三型</text>

  <!-- 三型 -->
  <rect x="56" y="174" width="220" height="110" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="220" height="28" rx="12" fill="#7A8B6F"/><rect x="56" y="192" width="220" height="10" fill="#7A8B6F"/>
  <text x="166" y="193" class="tag" text-anchor="middle">表皮型</text>
  <text x="166" y="226" class="body" text-anchor="middle">颜色较浅 褐色为主</text>
  <text x="166" y="248" class="small" text-anchor="middle">外用药起效相对好</text>
  <text x="166" y="270" class="small" text-anchor="middle">按月计算效果</text>

  <rect x="290" y="174" width="220" height="110" rx="12" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="290" y="174" width="220" height="28" rx="12" fill="#C9A876"/><rect x="290" y="192" width="220" height="10" fill="#C9A876"/>
  <text x="400" y="193" class="tag" text-anchor="middle">真皮型</text>
  <text x="400" y="226" class="body" text-anchor="middle">灰褐色 偏深</text>
  <text x="400" y="248" class="small" text-anchor="middle">药物较难够到</text>
  <text x="400" y="270" class="small" text-anchor="middle">常需多次光电</text>

  <rect x="524" y="174" width="220" height="110" rx="12" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="524" y="174" width="220" height="28" rx="12" fill="#B5654A"/><rect x="524" y="192" width="220" height="10" fill="#B5654A"/>
  <text x="634" y="193" class="tag" text-anchor="middle">混合型</text>
  <text x="634" y="226" class="body" text-anchor="middle">深浅并存</text>
  <text x="634" y="248" class="small" text-anchor="middle">最常见 分区处理</text>
  <text x="634" y="270" class="small" text-anchor="middle">易反黑需克制</text>

  <!-- 治疗底盘 -->
  <text x="56" y="316" class="nodeTitle">治疗组合底盘</text>
  <rect x="56" y="330" width="688" height="86" rx="10" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4"/>
  <rect x="56" y="330" width="688" height="28" rx="10" fill="#7A8B6F"/><rect x="56" y="348" width="688" height="10" fill="#7A8B6F"/>
  <text x="400" y="350" class="tag" text-anchor="middle">防晒不是配角，而是治疗底盘</text>
  <text x="76" y="378" class="body">广谱防晒 全年 防可见光</text>
  <text x="76" y="400" class="small">外用药先行 光电换肤克制 追求长期稳住而非一次清零</text>

  <rect x="56" y="430" width="688" height="32" rx="8" fill="#eef4ee"/>
  <text x="400" y="451" class="quote" text-anchor="middle">把期待从祛干净改成长期稳住</text>
  <text x="56" y="470" class="footer">医学教育示意 · 妊娠期方案不同，需面诊确定分型与药物</text>
</svg>
