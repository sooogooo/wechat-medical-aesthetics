<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t11f1 d11f1">
  <title id="t11f1">伊藤痣与太田痣位置区别</title>
  <desc id="t11f1">两者组织相似但分布不同，伊藤痣多在肩锁骨肩胛上臂</desc>
  <defs>
    <linearGradient id="bg11f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh11f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg11f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh11f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 11</text>
  <text x="56" y="90" class="title">伊藤痣和太田痣 区别主要在位置</text>
  <text x="56" y="116" class="kicker">组织相似但分布不同，治疗主要出于外观需求</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">两者分布对照</text>

  <rect x="56" y="174" width="335" height="170" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="30" rx="12" fill="#7A8B6F"/><rect x="56" y="194" width="335" height="10" fill="#7A8B6F"/>
  <text x="72" y="195" class="tag">伊藤痣</text>
  <text x="72" y="226" class="body">肩部 锁骨上区</text>
  <text x="72" y="250" class="body">肩胛区 上臂</text>
  <text x="72" y="274" class="body">青灰色斑片</text>
  <text x="72" y="298" class="body">通常稳定良性</text>
  <text x="72" y="326" class="small">不累及眼部</text>

  <rect x="409" y="174" width="335" height="170" rx="12" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="30" rx="12" fill="#C9A876"/><rect x="409" y="194" width="335" height="10" fill="#C9A876"/>
  <text x="425" y="195" class="tag">太田痣</text>
  <text x="425" y="226" class="body">单侧眼周 额颞</text>
  <text x="425" y="250" class="body">颧部 面部</text>
  <text x="425" y="274" class="body">青灰色斑片</text>
  <text x="425" y="298" class="body">可累及眼白</text>
  <text x="425" y="326" class="small">需眼科联合评估</text>

  <text x="56" y="372" class="nodeTitle">还需鉴别的青色斑</text>
  <rect x="56" y="386" width="688" height="56" rx="10" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4"/>
  <text x="76" y="410" class="body">先天性真皮黑素细胞增多症 蓝痣 炎症后色沉等</text>
  <text x="76" y="430" class="small">位置深浅和发病年龄不同，需医生鉴别而非自行比对照片</text>

  <rect x="56" y="452" width="688" height="20" rx="8" fill="#eef4ee"/>
  <text x="400" y="466" class="quote" text-anchor="middle" font-size="14">不治疗也是医学上合理的选择</text>
  <text x="56" y="474" class="footer">医学教育示意 · 先确认是否稳定，再谈是否治疗</text>
</svg>
