<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0801 desc0801" role="img" viewBox="0 0 900 620"><title id="title0801">牙性还是骨性：要不要正颌</title><desc id="desc0801">牙性由正畸解决，骨性需正颌手术，需正畸与正颌外科联合评估</desc><defs><linearGradient id="bg0801" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0801" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0801)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0801)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 08</text><text x="62" y="117" class="title">牙性还是骨性：要不要正颌</text><text x="62" y="153" class="kicker">&quot;地包天&quot;&quot;嘴突&quot;可能是牙性，也可能是骨性</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">两种来源 · 两种处理</text><rect width="388" height="270" x="62" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="388" height="44" x="62" y="232" fill="#0072B2" rx="14"/><rect width="388" height="16" x="62" y="260" fill="#0072B2"/><text x="256" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">牙性</text><text x="82" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="82" y="328" class="body">骨骼关系正常</text><text x="82" y="350" class="body">问题在牙齿排列</text><text x="82" y="382" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="82" y="406" class="body">正畸（戴牙套）即可解决</text><text x="82" y="428" class="body">无需手术</text><rect width="348" height="40" x="82" y="448" fill="#eef6f8" rx="8"/><text x="256" y="473" class="small" text-anchor="middle">不是所有嘴突、反颌都需要手术</text><rect width="376" height="270" x="462" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><rect width="376" height="44" x="462" y="232" fill="#D55E00" rx="14"/><rect width="376" height="16" x="462" y="260" fill="#D55E00"/><text x="650" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">骨性</text><text x="482" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="482" y="328" class="body">上下颌骨位置或大小异常</text><text x="482" y="350" class="body">骨性反颌、前突、偏颌、开颌</text><text x="482" y="382" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="482" y="406" class="body">单纯正畸无法矫正骨骼关系</text><text x="482" y="428" class="body">需正颌手术（四级）</text><rect width="336" height="40" x="482" y="448" fill="#fbeae3" rx="8"/><text x="650" y="473" class="small" text-anchor="middle">正畸 + 正颌外科联合评估</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">判断需头影测量和牙模，不是看自拍</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 正颌手术须在有相应资质机构由具备权限医师开展</text></svg>