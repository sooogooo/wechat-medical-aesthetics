<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2901 desc2901" role="img" viewBox="0 0 900 620"><title id="title2901">四种麻醉方式对比</title><desc id="desc2901">局部麻醉、局麻加镇静、椎管内麻醉、全身麻醉四种方式，由手术范围时长患者状况决定</desc><defs><linearGradient id="bg2901" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2901" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff;letter-spacing:1px}.body{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.footer,.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.small{fill:#5c6c72}.footer{fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2901)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2901)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 29</text><text x="62" y="117" class="title">四种麻醉方式：风险与监护递增</text><text x="62" y="153" class="kicker">由手术范围、时长、患者状况共同决定——不是「想选哪种选哪种」</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">由简到繁 · 对麻醉科要求递增</text><rect width="186" height="290" x="62" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="186" height="36" x="62" y="232" fill="#0072B2" rx="14"/><rect width="186" height="14" x="62" y="254" fill="#0072B2"/><text x="155" y="256" class="tag" text-anchor="middle">局部麻醉</text><text x="82" y="294" class="body">仅麻醉手术区域</text><text x="82" y="321" class="body">患者清醒</text><text x="82" y="348" class="body">小范围短时间</text><text x="82" y="375" class="body">如小痣、部分双眼皮</text><rect width="146" height="70" x="82" y="430" fill="#eef6f8" rx="8"/><text x="155" y="455" class="small" text-anchor="middle">风险相对低</text><text x="155" y="475" class="small" text-anchor="middle">仍需规范操作</text><rect width="186" height="290" x="262" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="186" height="36" x="262" y="232" fill="#E69F00" rx="14"/><rect width="186" height="14" x="262" y="254" fill="#E69F00"/><text x="355" y="256" class="tag" text-anchor="middle">局麻 + 镇静</text><text x="282" y="294" class="body">监测下麻醉（MAC）</text><text x="282" y="321" class="body">加镇静镇痛药</text><text x="282" y="348" class="body">半清醒或浅睡</text><text x="282" y="375" class="body">适合中等手术</text><rect width="146" height="70" x="282" y="430" fill="#fdf3e3" rx="8"/><text x="355" y="455" class="small" text-anchor="middle">需规范监护</text><text x="355" y="475" class="small" text-anchor="middle">血氧、心电图</text><rect width="186" height="290" x="462" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="186" height="36" x="462" y="232" fill="#E69F00" rx="14"/><rect width="186" height="14" x="462" y="254" fill="#E69F00"/><text x="555" y="256" class="tag" text-anchor="middle">椎管内麻醉</text><text x="482" y="294" class="body">硬膜外、腰麻</text><text x="482" y="321" class="body">麻醉下半身区域</text><text x="482" y="348" class="body">适合下肢、腹部</text><text x="482" y="375" class="body">部分手术</text><rect width="146" height="70" x="482" y="430" fill="#fdf3e3" rx="8"/><text x="555" y="455" class="small" text-anchor="middle">需麻醉科医师</text><text x="555" y="475" class="small" text-anchor="middle">规范监护</text><rect width="176" height="290" x="662" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5" rx="14"/><rect width="176" height="36" x="662" y="232" fill="#D55E00" rx="14"/><rect width="176" height="14" x="662" y="254" fill="#D55E00"/><text x="750" y="256" class="tag" text-anchor="middle">全身麻醉</text><text x="682" y="294" class="body">完全失去意识</text><text x="682" y="321" class="body">需气道管理</text><text x="682" y="348" class="body">全面监护</text><text x="682" y="375" class="body">四级手术、时间长</text><rect width="136" height="70" x="682" y="430" fill="#fbeae3" rx="8"/><text x="750" y="455" class="small" text-anchor="middle">对麻醉科要求最高</text><text x="750" y="475" class="small" text-anchor="middle">常驻麻醉能力</text><path fill="none" stroke="#7d8e93" stroke-dasharray="4 4" stroke-width="1.5" d="M 155 540 L 750 540"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 742 534 L 750 540 L 742 546"/><text x="455" y="535" class="small" text-anchor="middle">监护与急救要求递增</text><text x="62" y="582" class="footer">医学教育示意 · 麻醉方式由专业评估决定，须由具备资质的麻醉科医师实施</text></svg>