<svg xmlns="http://www.w3.org/2000/svg" aria-label="技术型的边界" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">数据 ≠ 标准：技术型的边界</text><rect width="580" height="55" x="30" y="60" fill="#f7ece6" stroke="#b5654a" rx="6"/><text x="320" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">边界一：参数有正常范围，不是唯一正确值</text><text x="320" y="103" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">鼻额角 115°–130° 都正常，不是必须 120°；强行套单一数值反而不自然</text><rect width="580" height="55" x="30" y="125" fill="#f7ece6" stroke="#b5654a" rx="6"/><text x="320" y="150" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">边界二：美不能完全还原为参数</text><text x="320" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">气质、神态、辨识度、协调感，这些无法用数字衡量，却是美的关键</text><rect width="580" height="55" x="30" y="190" fill="#f4ede0" stroke="#c9a876" rx="6"/><text x="320" y="215" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">核心认知</text><text x="320" y="233" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">技术参数辅助决策，但不取代审美判断——否则容易陷入&quot;为达标而失协&quot;</text><text x="320" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">把数据当参考的医生是技术型；把数据当唯一标准的医生，可能滑向庸俗型</text></svg>