  <rect x="46" y="40" width="96" height="30" rx="15" fill="#2f4858"/><text x="94" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="2">翻 译 器</text><rect x="170" y="40" width="200" height="30" rx="15" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="270" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">组织管理制度</text><text x="392" y="61" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#2f4858" font-weight="700" text-anchor="middle">⟶</text><rect x="412" y="40" width="200" height="30" rx="15" fill="#edf1f4" stroke="#2f4858" stroke-width="1.4"/><text x="512" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2f4858" font-weight="600" text-anchor="middle">稀缺手艺场</text><rect x="46" y="104" width="708" height="84" rx="8" fill="#f5f7f0" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="104" width="6" height="84" rx="3" fill="#7a8b6f"/><text x="74" y="138" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#7a8b6f" font-weight="600">直译 · 成立处</text><text x="74" y="166" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">核心资产、关键角色这些权力概念都存在</text><rect x="46" y="204" width="708" height="84" rx="8" fill="#faf3f0" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="204" width="6" height="84" rx="3" fill="#b5654a"/><text x="74" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#b5654a" font-weight="600">失真处</text><text x="74" y="266" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">权力由稀缺性分配而不由制度分配，医生不可管理</text><rect x="46" y="304" width="708" height="84" rx="8" fill="#ffffff" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="304" width="6" height="84" rx="3" fill="#2b2a28"/><text x="74" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" font-weight="600">大厂人的典型错误</text><text x="74" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">试图用现代管理制度理顺组织，三个月后自己成了被理顺的对象</text>
  <text x="46" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">类比在哪里成立、在哪里失效，看见边界再动手</text>
