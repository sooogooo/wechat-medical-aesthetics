<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t12a d12a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t12a">面诊警讯红黄绿灯分级</title><desc id="d12a">红灯禁行四类含疑似BDD识别要点，黄灯缓行五类，绿灯通行条件，转介话术结构</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.lvl{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.item,.say{font:500 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.say{fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段3 · 12</text><text x="56" y="90" class="title">警讯分级 不是所有车都该被放行</text><text x="56" y="116" class="kicker">信号系统最重要的功能不是放行，是拦停——宁可丢单，不可放行</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="688" height="128" x="56" y="144" fill="#fff" stroke="#B5654A" stroke-width="1.8" rx="10"/><circle cx="76" cy="166" r="9" fill="#B5654A"/><text x="94" y="171" fill="#B5654A" class="lvl">红灯 · 禁行（统一动作：终止推销 + 转介，不是拒绝，是负责任的下一步）</text><text x="76" y="196" class="item">① 疑似 BDD：纠结肉眼几乎不可见的&quot;缺陷&quot; · 多次手术仍不满意 · 反复寻求保证 · 社交回避</text><text x="76" y="214" class="item">② 严重容貌焦虑伴抑郁倾向：&quot;做完不行就不想活了&quot;类表达 · 失眠 · 自伤暗示</text><text x="76" y="232" class="item">③ 未成年人无监护人知情到面（微信说&quot;妈妈同意了&quot;不算） ④ 术后急性心理危机（先安抚上报，不推销修复）</text><text x="76" y="254" class="say">话术结构：共情（我理解您的在意）→ 转介（值得先请医生/专业人士完整评估）→ 撤压（项目不急这一两天）→ 陪伴（我陪您约时间）</text><rect width="688" height="84" x="56" y="284" fill="#fff" stroke="#C9A876" stroke-width="1.8" rx="10"/><circle cx="76" cy="306" r="9" fill="#C9A876"/><text x="94" y="311" fill="#8a6d3b" class="lvl">黄灯 · 缓行（放慢，不是放弃——标准动作：二次面诊 + 冷静期）</text><text x="76" y="336" class="item">期望明显超出医学可达（&quot;45 岁做成 25 岁&quot;）· 比价型反复纠结 · 陪同一票否决</text><text x="76" y="356" class="item">恢复期安排不了 · 瞒着家人做大项目——&quot;回去商量，方案留着，两周内随时找我&quot;不是失去客户，是筛选客户</text><rect width="688" height="56" x="56" y="380" fill="#fff" stroke="#7A8B6F" stroke-width="1.8" rx="10"/><circle cx="76" cy="402" r="9" fill="#7A8B6F"/><text x="94" y="407" fill="#7A8B6F" class="lvl">绿灯 · 通行</text><text x="94" y="427" class="item">诉求具体 · 期望在医学区间 · 决策自主 · 病史如实 · 支持系统在位 · 恢复期可安排（绿灯≠今天必须成交）</text><text x="56" y="466" class="footer">三条铁律：任何成交指标压不过红灯 · 转介不是甩手（约时间/跟进一次/记录在案）· 判断只用于&quot;做不做&quot;，不用于评判人</text></svg>