<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t01f2 d01f2" role="img" viewBox="0 0 800 500"><title id="t01f2">玫瑰痤疮发作三级与护肤最小集</title><desc id="t01f2">按发作轻重分级记录，配合最低可行护肤三件套</desc><defs><linearGradient id="bg01f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh01f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg01f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh01f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 01</text><text x="56" y="90" class="title">发作分级与护肤最小集</text><text x="56" y="116" class="kicker">给发作分级比笼统说烂脸更有用</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">日常发作分级</text><rect width="220" height="100" x="56" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="10"/><rect width="220" height="28" x="56" y="172" fill="#7A8B6F" rx="10"/><rect width="220" height="10" x="56" y="190" fill="#7A8B6F"/><text x="166" y="191" class="tag" text-anchor="middle">轻度</text><text x="166" y="226" class="body" text-anchor="middle">短暂发红</text><text x="166" y="248" class="small" text-anchor="middle">很快恢复 不影响生活</text><rect width="220" height="100" x="290" y="172" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="10"/><rect width="220" height="28" x="290" y="172" fill="#C9A876" rx="10"/><rect width="220" height="10" x="290" y="190" fill="#C9A876"/><text x="400" y="191" class="tag" text-anchor="middle">中度</text><text x="400" y="226" class="body" text-anchor="middle">持续灼热 丘疹增多</text><text x="400" y="248" class="small" text-anchor="middle">影响睡眠 主动面诊</text><rect width="220" height="100" x="524" y="172" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="10"/><rect width="220" height="28" x="524" y="172" fill="#B5654A" rx="10"/><rect width="220" height="10" x="524" y="190" fill="#B5654A"/><text x="634" y="191" class="tag" text-anchor="middle">重度</text><text x="634" y="226" class="body" text-anchor="middle">眼痛畏光 肿胀</text><text x="634" y="248" class="small" text-anchor="middle">鼻部结构变化 立即就医</text><text x="56" y="304" class="nodeTitle">最低可行护肤三件套</text><rect width="220" height="80" x="56" y="318" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><text x="166" y="350" class="body" font-weight="700" text-anchor="middle">温和清洁</text><text x="166" y="372" class="small" text-anchor="middle">温水 无香精氨基酸</text><rect width="220" height="80" x="290" y="318" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><text x="400" y="350" class="body" font-weight="700" text-anchor="middle">耐受保湿</text><text x="400" y="372" class="small" text-anchor="middle">无香精 局部先试用</text><rect width="220" height="80" x="524" y="318" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><text x="634" y="350" class="body" font-weight="700" text-anchor="middle">广谱防晒</text><text x="634" y="372" class="small" text-anchor="middle">白天必备 一次只加一个</text><rect width="688" height="36" x="56" y="414" fill="#eef4ee" rx="10"/><text x="400" y="437" class="quote" text-anchor="middle">护肤步骤少不是目的，能识别耐受边界才是</text><text x="56" y="462" class="footer">医学教育示意 · 频繁刷酸 磨砂 酒精湿敷 自行叠加激素会让波动放大</text></svg>