<svg xmlns="http://www.w3.org/2000/svg" aria-label="面部传递的四种常见气质印象" role="img" viewBox="0 0 720 360"><rect width="720" height="360" fill="#faf8f4" rx="12"/><text x="360" y="34" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">面部可能传递的四种&quot;气质印象&quot;</text><rect width="160" height="260" x="30" y="65" fill="#fff" stroke="#c9a876" rx="8"/><ellipse cx="110" cy="170" fill="#f3efe8" stroke="#a8a39d" rx="48" ry="60"/><path fill="none" stroke="#8a7340" stroke-width="1.5" d="M 80 150 Q 85 158 90 150"/><path fill="none" stroke="#8a7340" stroke-width="1.5" d="M 130 150 Q 135 158 140 150"/><ellipse cx="82" cy="180" fill="#c9a876" opacity=".3" rx="10" ry="6"/><ellipse cx="138" cy="180" fill="#c9a876" opacity=".3" rx="10" ry="6"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 90 200 Q 110 205 130 200"/><text x="110" y="270" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">疲惫</text><text x="110" y="295" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">泪沟、眼周凹陷</text><text x="110" y="312" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">→ E、Ck codes</text><rect width="160" height="260" x="200" y="65" fill="#fff" stroke="#c9a876" rx="8"/><ellipse cx="280" cy="170" fill="#f3efe8" stroke="#a8a39d" rx="48" ry="60"/><path stroke="#8a7340" stroke-width="1.5" d="M 250 150 L 260 148 M 300 150 L 310 148"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 260 200 Q 280 195 300 200"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 255 220 Q 245 230 255 235"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 305 220 Q 315 230 305 235"/><text x="280" y="270" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">悲伤</text><text x="280" y="295" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">口角下垂、木偶纹</text><text x="280" y="312" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">→ 口角、下颌 codes</text><rect width="160" height="260" x="370" y="65" fill="#fff" stroke="#c9a876" rx="8"/><ellipse cx="450" cy="170" fill="#f3efe8" stroke="#a8a39d" rx="48" ry="60"/><path stroke="#8a7340" stroke-width="1.5" d="M 425 148 L 440 153 M 460 153 L 475 148"/><path fill="none" stroke="#8a7340" stroke-width="1" d="M 420 152 Q 450 145 480 152"/><ellipse cx="420" cy="190" fill="#8a7340" opacity=".2" rx="14" ry="10"/><ellipse cx="480" cy="190" fill="#8a7340" opacity=".2" rx="14" ry="10"/><text x="450" y="270" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">严厉</text><text x="450" y="295" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">眉间纹、颞部凹陷</text><text x="450" y="312" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">→ T、眉间 codes</text><rect width="150" height="260" x="540" y="65" fill="#fff" stroke="#c9a876" rx="8"/><ellipse cx="615" cy="170" fill="#f3efe8" stroke="#a8a39d" rx="48" ry="60"/><path fill="none" stroke="#a8a39d" stroke-width="1.5" d="M 580 200 Q 615 215 650 200"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 580 195 Q 615 188 650 195"/><path stroke="#a8a39d" stroke-width=".8" d="M 590 220 L 600 230 M 630 230 L 640 220"/><text x="615" y="270" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">老态</text><text x="615" y="295" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">容积流失、下垂</text><text x="615" y="312" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">→ Ck、Jw codes</text><text x="360" y="345" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">图为示意；情感属性是 MD Codes 的特色维度，关注&quot;看起来怎样&quot;而非&quot;填哪里&quot;</text></svg>