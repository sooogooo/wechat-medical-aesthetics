<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="注射脸的形成路径">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">“注射脸”通常是这样累积出来的</text>

  <!-- 四个阶段 -->
  <rect x="30" y="60" width="135" height="170" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <ellipse cx="97" cy="130" rx="42" ry="55" fill="#f3efe8" stroke="#a8a39d"/>
  <text x="97" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">阶段一</text>
  <text x="97" y="205" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">初次注射</text>
  <text x="97" y="222" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">改善明显</text>
  <text x="97" y="239" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">自然</text>

  <rect x="180" y="60" width="135" height="170" rx="8" fill="#f4ede0" stroke="#c9a876"/>
  <ellipse cx="247" cy="130" rx="46" ry="58" fill="#f3efe8" stroke="#a8a39d"/>
  <ellipse cx="247" cy="155" rx="20" ry="15" fill="#eef0ea" opacity="0.6"/>
  <text x="247" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">阶段二</text>
  <text x="247" y="205" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">反复补打</text>
  <text x="247" y="222" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">材料叠加</text>
  <text x="247" y="239" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#8a7340">开始显宽</text>

  <rect x="330" y="60" width="135" height="170" rx="8" fill="#f4ede0" stroke="#c9a876"/>
  <ellipse cx="397" cy="130" rx="50" ry="60" fill="#f3efe8" stroke="#a8a39d"/>
  <ellipse cx="397" cy="140" rx="28" ry="20" fill="#eef0ea" opacity="0.7"/>
  <ellipse cx="370" cy="118" rx="8" ry="5" fill="#eef0ea" opacity="0.7"/>
  <ellipse cx="424" cy="118" rx="8" ry="5" fill="#eef0ea" opacity="0.7"/>
  <text x="397" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">阶段三</text>
  <text x="397" y="205" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">多处叠加</text>
  <text x="397" y="222" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">比例失调</text>
  <text x="397" y="239" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#8a7340">显肿</text>

  <rect x="480" y="60" width="130" height="170" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <ellipse cx="545" cy="130" rx="54" ry="62" fill="#f3efe8" stroke="#a8a39d"/>
  <ellipse cx="545" cy="135" rx="34" ry="24" fill="#eef0ea" opacity="0.8"/>
  <ellipse cx="515" cy="115" rx="10" ry="7" fill="#eef0ea" opacity="0.8"/>
  <ellipse cx="575" cy="115" rx="10" ry="7" fill="#eef0ea" opacity="0.8"/>
  <text x="545" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">阶段四</text>
  <text x="545" y="205" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">过度治疗</text>
  <text x="545" y="222" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">假面感</text>
  <text x="545" y="239" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#b5654a">不自然</text>

  <text x="320" y="262" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">图为示意；“注射脸”往往不是一次形成的，而是多次累积的结果</text>
</svg>