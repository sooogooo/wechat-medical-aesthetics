<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t12f2 d12f2" role="img" viewBox="0 0 800 500"><title id="t12f2">咖啡斑治疗复色与现实预期</title><desc id="t12f2">激光能淡化但复色并不少见，治疗前先写下接受复发吗</desc><defs><linearGradient id="bg12f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh12f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg12f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh12f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 12</text><text x="56" y="90" class="title">激光淡化与复色预期</text><text x="56" y="116" class="kicker">治疗前写下接受复发吗，再做决定</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">治疗可能的三种走向</text><rect width="220" height="120" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="56" y="174" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="56" y="192" fill="#7A8B6F"/><text x="166" y="193" class="tag" text-anchor="middle">明显淡化</text><text x="166" y="226" class="body" text-anchor="middle">部分人反应良好</text><text x="166" y="252" class="small" text-anchor="middle">需多次累积</text><text x="166" y="276" class="small" text-anchor="middle">仍需防晒维护</text><rect width="220" height="120" x="290" y="174" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="174" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="192" fill="#C9A876"/><text x="400" y="193" class="tag" text-anchor="middle">部分改善</text><text x="400" y="226" class="body" text-anchor="middle">变淡但未消失</text><text x="400" y="252" class="small" text-anchor="middle">边界仍可见</text><text x="400" y="276" class="small" text-anchor="middle">需评估是否继续</text><rect width="220" height="120" x="524" y="174" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="524" y="174" fill="#B5654A" rx="12"/><rect width="220" height="10" x="524" y="192" fill="#B5654A"/><text x="634" y="193" class="tag" text-anchor="middle">复色</text><text x="634" y="226" class="body" text-anchor="middle">数月后颜色回来</text><text x="634" y="252" class="small" text-anchor="middle">并不少见</text><text x="634" y="276" class="small" text-anchor="middle">需重新评估方案</text><text x="56" y="326" class="nodeTitle">家长可做的规范记录</text><rect width="688" height="62" x="56" y="340" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="76" y="364" class="body" font-weight="700">数量 位置 大小 颜色变化</text><text x="76" y="386" class="small">每隔数月在相同光线条件下拍照，比天天拿尺量更可靠</text><rect width="688" height="36" x="56" y="414" fill="#eef4ee" rx="10"/><text x="400" y="437" class="quote" text-anchor="middle">不要让一次激光替代完整评估</text><text x="56" y="468" class="footer">医学教育示意 · 多发咖啡斑需排除神经纤维瘤病等系统性疾病</text></svg>