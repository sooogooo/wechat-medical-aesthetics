<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="下半脸 codes 风险要点">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">下半脸 codes 的主要风险</text>

  <rect x="30" y="55" width="280" height="155" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="170" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">血管风险</text>
  <text x="50" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 面动脉及面静脉</text>
  <text x="50" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">  （下颌缘区域走行）</text>
  <text x="50" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 颏动静脉（颏部）</text>
  <text x="50" y="184" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">深部骨面注射相对安全</text>

  <rect x="330" y="55" width="280" height="155" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="470" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">美学风险</text>
  <text x="350" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 下颌过方、过宽</text>
  <text x="350" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 下巴过长、过翘</text>
  <text x="350" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 男女美学标准不同</text>
  <text x="350" y="184" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">比例与性别考量很重要</text>

  <text x="320" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">下半脸轮廓直接关系到“方圆”“刚柔”感，美学判断要求高</text>
</svg>