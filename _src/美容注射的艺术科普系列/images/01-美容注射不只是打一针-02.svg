<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="面部皮肤层次与注射深度示意">
  <rect width="600" height="380" fill="#faf8f4" rx="12"/>
  <text x="300" y="32" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">注射作用在哪个深度</text>

  <!-- 皮肤层次条带（左侧） -->
  <rect x="60" y="70" width="240" height="38" rx="4" fill="#f4ede0" stroke="#ddd6ca"/>
  <text x="80" y="94" font-family="PingFang SC,sans-serif" font-size="13" fill="#2b2a28">表皮（约 0.1 毫米）</text>

  <rect x="60" y="112" width="240" height="58" rx="4" fill="#eef0ea" stroke="#ddd6ca"/>
  <text x="80" y="136" font-family="PingFang SC,sans-serif" font-size="13" fill="#2b2a28">真皮浅层</text>
  <text x="80" y="156" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">胶原、血管、神经末梢</text>

  <rect x="60" y="174" width="240" height="58" rx="4" fill="#dde4d6" stroke="#ddd6ca"/>
  <text x="80" y="198" font-family="PingFang SC,sans-serif" font-size="13" fill="#2b2a28">真皮深层</text>
  <text x="80" y="218" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">透明质酸、再生材料常用层次</text>

  <rect x="60" y="236" width="240" height="58" rx="4" fill="#c9d4be" stroke="#ddd6ca"/>
  <text x="80" y="260" font-family="PingFang SC,sans-serif" font-size="13" fill="#2b2a28">皮下脂肪层</text>
  <text x="80" y="280" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">容积填充、骨膜上支撑</text>

  <rect x="60" y="298" width="240" height="40" rx="4" fill="#a8b6a0" stroke="#ddd6ca"/>
  <text x="80" y="323" font-family="PingFang SC,sans-serif" font-size="13" fill="#ffffff">肌肉层 / 骨膜</text>

  <!-- 注射针示意与标注（右侧） -->
  <line x1="400" y1="60" x2="400" y2="340" stroke="#a8a39d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 填充标注 -->
  <circle cx="400" cy="200" r="7" fill="#7a8b6f"/>
  <line x1="407" y1="200" x2="450" y2="180" stroke="#7a8b6f" stroke-width="1.5"/>
  <text x="455" y="176" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#7a8b6f">填充类</text>
  <text x="455" y="192" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">真皮深层 / 皮下</text>

  <!-- 肉毒标注 -->
  <circle cx="400" cy="315" r="7" fill="#c9a876"/>
  <line x1="407" y1="315" x2="450" y2="300" stroke="#c9a876" stroke-width="1.5"/>
  <text x="455" y="296" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">肉毒类</text>
  <text x="455" y="312" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">肌肉层</text>

  <!-- 再生标注 -->
  <circle cx="400" cy="245" r="7" fill="#8a9a7f"/>
  <line x1="407" y1="245" x2="450" y2="265" stroke="#8a9a7f" stroke-width="1.5"/>
  <text x="455" y="262" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">再生类</text>
  <text x="455" y="278" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">真皮深层 / 皮下</text>

  <!-- 血管警示 -->
  <path d="M 350 150 Q 365 160 350 172" stroke="#b5654a" stroke-width="2.5" fill="none"/>
  <text x="335" y="145" text-anchor="end" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">血管走行</text>

  <text x="300" y="368" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">层次与深度因部位、材料而异；血管走行个体差异大，是栓塞风险的核心</text>
</svg>