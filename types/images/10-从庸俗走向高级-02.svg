<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="观念转变对比">
  <rect width="640" height="220" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">观念转变：从庸俗到高级</text>

  <rect x="30" y="60" width="280" height="130" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="170" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">庸俗型观念</text>
  <text x="50" y="113" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;流行什么做什么&quot;</text>
  <text x="50" y="135" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;越多越值&quot;</text>
  <text x="50" y="157" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;必须看出变化&quot;</text>
  <text x="50" y="179" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;别人都做我也做&quot;</text>

  <rect x="330" y="60" width="280" height="130" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="470" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">高级型观念</text>
  <text x="350" y="113" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;什么适合我做什么&quot;</text>
  <text x="350" y="135" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;够好就停&quot;</text>
  <text x="350" y="157" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;看不出但变好&quot;</text>
  <text x="350" y="179" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• &quot;我有我的判断&quot;</text>

  <text x="320" y="208" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">观念转变是第一步——没有观念转变，其他改变都难持久</text>
</svg>