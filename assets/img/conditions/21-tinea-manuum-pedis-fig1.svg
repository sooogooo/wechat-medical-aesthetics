<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t21 d21" role="img" viewBox="0 0 800 500"><title id="t21">手足癣的四种表现</title><desc id="d21">单手双脚是经典线索，真菌检查能少走弯路</desc><defs><linearGradient id="bg21" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh21" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT,.nodeT2{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.nodeT2{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg21)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh21)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 21</text><text x="48" y="92" class="title">手足癣的四种表现</text><text x="48" y="116" class="kicker">单手双脚是经典线索，真菌检查能少走弯路</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">同一感染，不同形态</text><rect width="165" height="150" x="48" y="188" fill="#fbfdfc" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="48" y="188" fill="#7A8B6F" rx="12"/><rect width="165" height="10" x="48" y="206" fill="#7A8B6F"/><text x="130.5" y="208" fill="#fff" class="nodeT2" text-anchor="middle">趾缝糜烂</text><text x="130.5" y="238" class="body" text-anchor="middle">浸渍发白</text><text x="130.5" y="256" class="small" text-anchor="middle">第3 4趾缝多见</text><rect width="165" height="150" x="225" y="188" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="225" y="188" fill="#C9A876" rx="12"/><rect width="165" height="10" x="225" y="206" fill="#C9A876"/><text x="307.5" y="208" fill="#fff" class="nodeT2" text-anchor="middle">足底脱屑</text><text x="307.5" y="238" class="body" text-anchor="middle">环形或片状</text><text x="307.5" y="256" class="small" text-anchor="middle">边界较清</text><rect width="165" height="150" x="402" y="188" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="402" y="188" fill="#B5654A" rx="12"/><rect width="165" height="10" x="402" y="206" fill="#B5654A"/><text x="484.5" y="208" fill="#fff" class="nodeT2" text-anchor="middle">水疱型</text><text x="484.5" y="238" class="body" text-anchor="middle">成群小水疱</text><text x="484.5" y="256" class="small" text-anchor="middle">明显瘙痒</text><rect width="165" height="150" x="579" y="188" fill="#fbfdfc" stroke="#5F6E54" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="579" y="188" fill="#5F6E54" rx="12"/><rect width="165" height="10" x="579" y="206" fill="#5F6E54"/><text x="661.5" y="208" fill="#fff" class="nodeT2" text-anchor="middle">单手干燥</text><text x="661.5" y="238" class="body" text-anchor="middle">一手掌脱屑</text><text x="661.5" y="256" class="small" text-anchor="middle">另一手正常</text><rect width="9" height="9" x="60" y="363" fill="#7A8B6F" rx="2"/><text x="78" y="372" class="body">先做真菌镜检，再决定是否抗真菌治疗</text><rect width="9" height="9" x="60" y="387" fill="#7A8B6F" rx="2"/><text x="78" y="396" class="body">涂药范围要超过肉眼可见的边界</text><rect width="704" height="28" x="48" y="400" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="419" class="quote" text-anchor="middle">别只靠泡脚和止痒膏，要对准真菌</text><text x="48" y="462" class="footer">医学教育示意 · 涂药范围要超过肉眼边界，足量足疗程</text></svg>