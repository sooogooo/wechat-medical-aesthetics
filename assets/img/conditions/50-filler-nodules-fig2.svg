<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t50f2 d50f2" role="img" viewBox="0 0 800 500"><title id="t50f2">注射后硬结的处理决策</title><desc id="d50f2">从评估产品层次血流到分类处理的决策流程及警示</desc><defs><linearGradient id="bg50f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh50f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.step{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg50f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh50f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 50</text><text x="52" y="92" class="title">处理决策流程</text><text x="52" y="116" class="kicker">先评估三要素，再决定溶解、抗炎还是抗感染</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">第一步 评估三要素</text><rect width="220" height="50" x="52" y="176" fill="#7A8B6F" rx="10"/><text x="162" y="198" class="step" text-anchor="middle">什么产品</text><text x="162" y="216" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">玻尿酸、胶原、其他</text><rect width="220" height="50" x="290" y="176" fill="#7A8B6F" rx="10"/><text x="400" y="198" class="step" text-anchor="middle">什么层次</text><text x="400" y="216" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">真皮、脂肪、深层</text><rect width="220" height="50" x="528" y="176" fill="#7A8B6F" rx="10"/><text x="638" y="198" class="step" text-anchor="middle">血流是否受累</text><text x="638" y="216" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">皮肤颜色、温度</text><text x="52" y="252" class="nodeTitle">第二步 分类处理</text><rect width="210" height="100" x="52" y="266" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><rect width="210" height="24" x="52" y="266" fill="#7A8B6F" rx="10"/><rect width="210" height="10" x="52" y="280" fill="#7A8B6F"/><text x="157" y="282" class="step" font-size="13" text-anchor="middle">材料相关</text><text x="64" y="310" class="small">玻尿酸→溶解酶</text><text x="64" y="330" class="small">不可溶→评估取出</text><text x="64" y="350" fill="#B5654A" class="small">勿在感染时盲目溶</text><rect width="210" height="100" x="278" y="266" fill="#fbf5ea" stroke="#C9A876" rx="10"/><rect width="210" height="24" x="278" y="266" fill="#C9A876" rx="10"/><rect width="210" height="10" x="278" y="280" fill="#C9A876"/><text x="383" y="282" class="step" font-size="13" text-anchor="middle">炎症结节</text><text x="290" y="310" class="small">抗炎、观察</text><text x="290" y="330" class="small">必要时局部处理</text><text x="290" y="350" fill="#5F6E54" class="small">多数可逐渐消退</text><rect width="244" height="100" x="504" y="266" fill="#fbf0eb" stroke="#B5654A" rx="10"/><rect width="244" height="24" x="504" y="266" fill="#B5654A" rx="10"/><rect width="244" height="10" x="504" y="280" fill="#B5654A"/><text x="626" y="282" class="step" font-size="13" text-anchor="middle">感染或肉芽肿</text><text x="516" y="310" class="small">抗感染、取材培养</text><text x="516" y="330" class="small">肉芽肿需联合方案</text><text x="516" y="350" fill="#B5654A" class="small">可能需多次、长期</text><rect width="696" height="44" x="52" y="382" fill="#fbf0eb" stroke="#B5654A" rx="10"/><text x="64" y="402" fill="#B5654A" class="body">立即就医的紧急信号</text><text x="64" y="420" class="small">皮肤发白发紫、剧痛、温度改变、视力变化、破溃流脓</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">保存注射记录，关键时刻能救命</text><text x="52" y="466" class="footer">健康科普示意 · 注射后异常须及时就医，处理须由医师评估</text></svg>