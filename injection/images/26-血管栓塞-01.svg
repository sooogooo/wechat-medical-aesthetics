<svg xmlns="http://www.w3.org/2000/svg" aria-label="血管栓塞机制示意" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">栓塞如何发生，为什么严重</text><g transform="translate(40,80)"><text x="0" y="0" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">材料误入血管</text><rect width="180" height="30" x="0" y="20" fill="#eef0ea" stroke="#b5654a" rx="15"/><text x="90" y="40" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">血管腔</text><line x1="90" x2="90" y1="-5" y2="40" stroke="#2b2a28" stroke-width="2"/><circle cx="90" cy="40" r="5" fill="#7a8b6f"/><line x1="200" x2="240" y1="40" y2="40" stroke="#a8a39d" stroke-width="1.5" marker-end="url(#e1)"/></g><g transform="translate(290,80)"><text x="0" y="0" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">顺血流移动</text><rect width="180" height="30" x="0" y="20" fill="#f7ece6" stroke="#b5654a" rx="15"/><circle cx="50" cy="35" r="6" fill="#7a8b6f"/><circle cx="110" cy="35" r="6" fill="#7a8b6f"/><line x1="60" x2="100" y1="35" y2="35" stroke="#b5654a" stroke-width="1" marker-end="url(#e1)"/></g><g transform="translate(290,160)"><text x="0" y="0" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">堵塞远端供血</text><rect width="180" height="30" x="0" y="20" fill="#fff" stroke="#b5654a" rx="15"/><circle cx="60" cy="35" r="10" fill="#b5654a"/><line x1="75" x2="160" y1="35" y2="35" stroke="#e3c9bd" stroke-dasharray="4 3" stroke-width="2"/><text x="125" y="30" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="9">缺血</text></g><defs><marker id="e1" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><polygon fill="#a8a39d" points="0 0 8 4 0 8"/></marker></defs><rect width="120" height="120" x="500" y="80" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="560" y="110" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">后果</text><text x="560" y="135" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">皮肤坏死</text><text x="560" y="155" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">失明</text><text x="560" y="175" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">脑栓塞（罕见）</text><text x="320" y="262" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">高压推注、误入血管是主因；面部血管与眼动脉交通使失明成为可能</text></svg>