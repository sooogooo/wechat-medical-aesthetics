<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="技术型美学的价值">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">技术型美学的真正价值</text>

  <rect x="30" y="60" width="180" height="150" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="120" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">客观参考</text>
  <text x="120" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">减少&quot;凭感觉&quot;</text>
  <text x="120" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">提供讨论基础</text>
  <text x="120" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">医患有共同语言</text>

  <rect x="230" y="60" width="180" height="150" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">精准可复现</text>
  <text x="320" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不同次治疗</text>
  <text x="320" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">效果更稳定</text>
  <text x="320" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">降低随机性</text>

  <rect x="430" y="60" width="180" height="150" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="520" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">风险识别</text>
  <text x="520" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">识别不对称</text>
  <text x="520" y="138" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">评估骨性基础</text>
  <text x="520" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">术前模拟</text>

  <text x="320" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">技术是工具——它的价值在于&quot;让决策更有依据&quot;，而非&quot;取代审美&quot;</text>
</svg>