<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="迟发性结节时间线">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">再生类材料并发症可能出现的时间</text>

  <!-- 时间轴 -->
  <line x1="50" y1="140" x2="590" y2="140" stroke="#a8a39d" stroke-width="2"/>
  <polygon points="590,140 582,135 582,145" fill="#a8a39d"/>

  <!-- 注射点 -->
  <circle cx="80" cy="140" r="8" fill="#7a8b6f"/>
  <text x="80" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">注射</text>
  <text x="80" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">即刻</text>

  <!-- 早期反应 -->
  <circle cx="200" cy="140" r="6" fill="#c9a876"/>
  <text x="200" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">肿胀/过敏</text>
  <text x="200" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">数天–数周</text>

  <!-- 渐进起效 -->
  <circle cx="320" cy="140" r="6" fill="#8a9a7f"/>
  <text x="320" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">胶原增生</text>
  <text x="320" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">1–3 个月</text>

  <!-- 迟发结节 -->
  <circle cx="460" cy="140" r="8" fill="#b5654a"/>
  <text x="460" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#b5654a">迟发结节</text>
  <text x="460" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">数月–数年</text>

  <!-- 过度增生 -->
  <circle cx="560" cy="140" r="8" fill="#b5654a"/>
  <text x="560" y="120" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#b5654a">过度增生</text>
  <text x="560" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">远期</text>

  <rect x="50" y="195" width="540" height="40" rx="6" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="320" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#b5654a">⚠ 迟发结节可能在注射很久之后才出现，且不能酶解——这是再生类材料最大的远期风险</text>
  <text x="320" y="248" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">图为示意；实际发生时间、概率因产品、部位、剂量和个体差异而不同</text>
</svg>