<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t20 d20" role="img" viewBox="0 0 800 500"><title id="t20">甲真菌病治疗选择看范围</title><desc id="d20">外用还是口服，取决于甲根是否受累</desc><defs><linearGradient id="bg20" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh20" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT,.nodeT2{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.nodeT2{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg20)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh20)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 20</text><text x="48" y="92" class="title">甲真菌病治疗选择看范围</text><text x="48" y="116" class="kicker">外用还是口服，取决于甲根是否受累</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">按受累范围分级选择</text><rect width="220" height="150" x="48" y="188" fill="#fbfdfc" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="48" y="188" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="48" y="206" fill="#7A8B6F"/><text x="158" y="208" fill="#fff" class="nodeT2" text-anchor="middle">远端小范围</text><text x="158" y="238" class="body" text-anchor="middle">外用抗甲真菌药</text><text x="158" y="256" class="small" text-anchor="middle">配合定期锉薄病甲</text><rect width="220" height="150" x="290" y="188" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="188" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="206" fill="#C9A876"/><text x="400" y="208" fill="#fff" class="nodeT2" text-anchor="middle">多甲或近甲根</text><text x="400" y="238" class="body" text-anchor="middle">常需口服抗真菌药</text><text x="400" y="256" class="small" text-anchor="middle">足疗程，定期复查</text><rect width="220" height="150" x="532" y="188" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="532" y="188" fill="#B5654A" rx="12"/><rect width="220" height="10" x="532" y="206" fill="#B5654A"/><text x="642" y="208" fill="#fff" class="nodeT2" text-anchor="middle">合并足癣</text><text x="642" y="238" class="body" text-anchor="middle">同步治疗足癣</text><text x="642" y="256" class="small" text-anchor="middle">处理鞋袜，减少来回播种</text><rect width="9" height="9" x="60" y="363" fill="#7A8B6F" rx="2"/><text x="78" y="372" class="body">新甲从甲根向前缓慢生长，疗效按月观察</text><rect width="9" height="9" x="60" y="387" fill="#7A8B6F" rx="2"/><text x="78" y="396" class="body">拍一组同角度对比照，比凭印象判断更可靠</text><rect width="704" height="28" x="48" y="400" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="419" class="quote" text-anchor="middle">疗效要等健康新甲逐渐长出</text><text x="48" y="462" class="footer">医学教育示意 · 口服抗真菌药需评估肝功能与药物相互作用</text></svg>