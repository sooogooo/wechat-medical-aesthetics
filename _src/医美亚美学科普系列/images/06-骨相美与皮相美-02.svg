<svg xmlns="http://www.w3.org/2000/svg" aria-label="骨相至上论的问题" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">&quot;骨相更高级&quot;的说法有什么问题</text><rect width="580" height="50" x="30" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="320" y="82" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">问题一：审美无客观等级</text><text x="320" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">骨相和皮相是不同维度，不是高低级别</text><rect width="580" height="50" x="30" y="120" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="320" y="142" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">问题二：暗含人种与阶层偏见</text><text x="320" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">骨相立体常与西方化关联，可能隐含对东方扁平脸的贬低</text><rect width="580" height="40" x="30" y="180" fill="#f4ede0" stroke="#c9a876" rx="6"/><text x="320" y="205" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">真正多元的审美：骨相、皮相、骨皮兼修，各有其美</text></svg>