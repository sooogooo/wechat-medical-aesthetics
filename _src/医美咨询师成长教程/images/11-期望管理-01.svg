<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t11a d11a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t11a">承诺话术与区间话术对比</title><desc id="d11a">红灯点承诺与绿灯区间加条件说法对照，期望管理的语言纪律</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.colHead{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.bad{font:500 11.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#b5654a}.good{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.rule{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer,.ruleSub{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.ruleSub{fill:#5c6c72}.footer{fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段3 · 11</text><text x="56" y="90" class="title">期望管理 把&quot;点&quot;换成&quot;区间&quot;</text><text x="56" y="116" class="kicker">术后纠纷的种子大多在面诊桌上种下——落差就是投诉</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="330" height="200" x="56" y="144" fill="#fff" stroke="#B5654A" stroke-width="1.6" rx="10"/><text x="76" y="170" fill="#B5654A" class="colHead">✕ 红灯 · 点承诺</text><text x="76" y="196" class="bad">&quot;肯定能维持两年。&quot;</text><text x="76" y="220" class="bad">&quot;做完就跟这张照片一样。&quot;</text><text x="76" y="244" class="bad">&quot;三天就能化滤镜妆。&quot;</text><text x="76" y="268" class="bad">&quot;绝对安全，零风险。&quot;</text><text x="76" y="300" class="bad">共同点：把概率说成确定</text><text x="76" y="318" class="bad">客人拿着&quot;你说的&quot;对照&quot;我得到的&quot;</text><text x="76" y="336" class="bad">——落差就是投诉</text><rect width="330" height="200" x="414" y="144" fill="#fff" stroke="#7A8B6F" stroke-width="1.6" rx="10"/><text x="434" y="170" fill="#7A8B6F" class="colHead">✓ 绿灯 · 区间 + 条件</text><text x="434" y="194" class="good">&quot;多数人在 X 到 Y 个月之间，具体到您，</text><text x="434" y="210" class="good">医生面诊后会按部位和代谢给参考。&quot;</text><text x="434" y="232" class="good">&quot;照片说明方向，医生会先评估您能达到</text><text x="434" y="248" class="good">的改善区间。&quot;</text><text x="434" y="270" class="good">&quot;任何医疗操作都有风险——我们把风险</text><text x="434" y="286" class="good">讲清楚，由医生评估适不适合。&quot;</text><text x="434" y="312" class="good">共同结构：区间 + 个体差异 + 落到医生评估</text><text x="434" y="330" class="good">区间不是含糊，是诚实——医学是概率的语言</text><rect width="688" height="92" x="56" y="356" fill="#fff" stroke="#d9cbab" stroke-width="1.3" rx="10"/><text x="76" y="382" class="rule">翻译医生方案三步法</text><text x="76" y="404" class="ruleSub">① 复述（解决什么→用什么手段→达到什么区间→有什么代价） ② 具象（术语翻成生活语言，必要时画图） ③ 确认（留追问空间，别带着疑惑签字）</text><text x="76" y="430" class="ruleSub">语言红线日检：每天下班搜四个词——肯定 · 绝对 · 保证 · 最好——搜到一个记入错题本，重写成区间表述</text><text x="56" y="468" class="footer">价格纪律：拆价值不贬同行 · 不临时砍价换成交 · 价格分歧往价值走不往情绪走</text></svg>