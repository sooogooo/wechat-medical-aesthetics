<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t00f1 d00f1" role="img" viewBox="0 0 800 500"><title id="t00f1">痤疮四个等级，从堵塞到留疤</title><desc id="d00f1">粉刺、丘疹脓疱、结节囊肿代表炎症由浅入深，留疤风险逐级升高</desc><defs><linearGradient id="bg00f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh00f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.lvl{font:700 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg00f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh00f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 00</text><text x="56" y="90" class="title">痤疮四个等级 从堵塞到留疤</text><text x="56" y="116" class="kicker">先看类型和深度，而不是只数多少颗</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">炎症由浅入深，留疤风险逐级升高</text><rect width="160" height="120" x="56" y="180" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="2" rx="12"/><rect width="160" height="30" x="56" y="180" fill="#7A8B6F" rx="12"/><rect width="160" height="10" x="56" y="200" fill="#7A8B6F"/><text x="136" y="201" class="lvl" text-anchor="middle">一级 粉刺</text><text x="136" y="234" class="body" text-anchor="middle">白头 黑头 闭口</text><text x="136" y="254" class="small" text-anchor="middle">毛囊口堵塞为主</text><text x="136" y="274" class="small" text-anchor="middle">炎症轻微</text><rect width="160" height="120" x="232" y="200" fill="#f8fbfb" stroke="#C9A876" stroke-width="2" rx="12"/><rect width="160" height="30" x="232" y="200" fill="#C9A876" rx="12"/><rect width="160" height="10" x="232" y="220" fill="#C9A876"/><text x="312" y="221" class="lvl" text-anchor="middle">二级 丘疹脓疱</text><text x="312" y="254" class="body" text-anchor="middle">红肿 灼热 起脓头</text><text x="312" y="274" class="small" text-anchor="middle">炎症已较明显</text><text x="312" y="294" class="small" text-anchor="middle">留红痘印风险升高</text><rect width="160" height="120" x="408" y="220" fill="#fff8ee" stroke="#B5654A" stroke-width="2" rx="12"/><rect width="160" height="30" x="408" y="220" fill="#B5654A" rx="12"/><rect width="160" height="10" x="408" y="240" fill="#B5654A"/><text x="488" y="241" class="lvl" text-anchor="middle">三级 结节囊肿</text><text x="488" y="274" class="body" text-anchor="middle">深在 疼痛 迟迟不退</text><text x="488" y="294" class="small" text-anchor="middle">真皮深层炎症</text><text x="488" y="314" class="small" text-anchor="middle">凹陷痘坑风险高</text><rect width="160" height="120" x="584" y="240" fill="#fdf1ee" stroke="#8a3f2b" stroke-width="2.5" rx="12"/><rect width="160" height="30" x="584" y="240" fill="#8a3f2b" rx="12"/><rect width="160" height="10" x="584" y="260" fill="#8a3f2b"/><text x="664" y="261" class="lvl" text-anchor="middle">四级 瘢痕</text><text x="664" y="294" class="body" text-anchor="middle">滚轮 箱车 冰锥</text><text x="664" y="314" class="small" text-anchor="middle">真皮结构已改变</text><text x="664" y="334" class="small" text-anchor="middle">需先控痘再处理</text><path fill="none" stroke="#7d8e93" stroke-dasharray="5 4" stroke-width="1.6" d="M 196 285 Q 400 235 584 295"/><path fill="none" stroke="#7d8e93" stroke-width="1.6" d="M 578 288 L 584 295 L 574 298"/><text x="400" y="385" class="small" text-anchor="middle">越早控制炎症 · 越能减少痘印和永久性痘坑</text><rect width="688" height="36" x="56" y="402" fill="#eef4ee" rx="10"/><text x="400" y="425" class="quote" text-anchor="middle">痤疮是慢性炎症，不是脸没洗干净</text><text x="56" y="458" class="footer">医学教育示意 · 严重度分级与方案需皮肤科面诊确定</text></svg>