<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t06a d06a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t06a">皮肤知识地图六大分区</title><desc id="d06a">皮肤知识分为炎症屏障、色素光老化、血管增生、感染、注射相关事件、毛发多汗六组，每组对应求美者场景</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.grpName{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.grpItem{font:500 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.scene{font:700 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8b6f}.cnt{font:700 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段2 · 06</text><text x="56" y="90" class="title">皮肤知识地图 六大分区</text><text x="56" y="116" class="kicker">21 篇精读 · 其余当字典查——皮肤是新人咨询师的第一战场</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="222" height="140" x="56" y="146" fill="#fff" stroke="#d9b3a6" stroke-width="1.6" rx="10"/><rect width="52" height="20" x="72" y="160" fill="#B5654A" rx="10"/><text x="98" y="174" class="cnt" text-anchor="middle">A · 5篇</text><text x="134" y="175" class="grpName">炎症与屏障</text><text x="72" y="204" class="grpItem">痤疮 · 玫瑰痤疮 · 激素依赖性皮炎</text><text x="72" y="222" class="grpItem">慢性湿疹 · 神经性皮炎</text><text x="72" y="252" class="scene">场景：&quot;老是泛红刺痛怎么办&quot;</text><text x="72" y="270" class="scene">到店率最高的诉求区</text><rect width="222" height="140" x="290" y="146" fill="#fff" stroke="#d9cbab" stroke-width="1.6" rx="10"/><rect width="52" height="20" x="306" y="160" fill="#C9A876" rx="10"/><text x="332" y="174" class="cnt" text-anchor="middle">B · 6篇</text><text x="368" y="175" class="grpName">色素与光老化</text><text x="306" y="204" class="grpItem">黄褐斑 · 炎症后色沉 · 日光性黑子</text><text x="306" y="222" class="grpItem">雀斑 · 光老化 · 痘坑瘢痕</text><text x="306" y="252" class="scene">场景：&quot;我要祛斑&quot;——一个筐里</text><text x="306" y="270" class="scene">装着完全不同的病，先分型</text><rect width="222" height="140" x="524" y="146" fill="#fff" stroke="#b8c0cf" stroke-width="1.6" rx="10"/><rect width="52" height="20" x="540" y="160" fill="#7d8ba3" rx="10"/><text x="566" y="174" class="cnt" text-anchor="middle">C · 3篇</text><text x="602" y="175" class="grpName">血管与增生</text><text x="540" y="204" class="grpItem">蜘蛛痣 · 面部毛细血管扩张</text><text x="540" y="222" class="grpItem">汗管瘤</text><text x="540" y="252" class="scene">场景：&quot;红血丝能去掉吗&quot;</text><text x="540" y="270" class="scene">区分天生、屏障受损与肝病相关</text><rect width="222" height="140" x="56" y="298" fill="#fff" stroke="#a9bba0" stroke-width="1.6" rx="10"/><rect width="52" height="20" x="72" y="312" fill="#7A8B6F" rx="10"/><text x="98" y="326" class="cnt" text-anchor="middle">D · 4篇</text><text x="134" y="327" class="grpName">感染与传染</text><text x="72" y="356" class="grpItem">丝状疣 · 扁平疣 · 寻常疣</text><text x="72" y="374" class="grpItem">复发性单纯疱疹</text><text x="72" y="404" class="scene">场景：注射前必问疱疹史</text><text x="72" y="422" class="scene">风险告知的重点区 · 有传染性</text><rect width="222" height="140" x="290" y="298" fill="#fff" stroke="#c9c9c4" stroke-width="1.6" rx="10"/><rect width="52" height="20" x="306" y="312" fill="#A8A39D" rx="10"/><text x="332" y="326" class="cnt" text-anchor="middle">E · 1篇</text><text x="368" y="327" class="grpName">注射相关事件</text><text x="306" y="356" class="grpItem">异物肉芽肿与注射后硬结</text><text x="306" y="374" class="grpItem">（与注射系列风险篇交叉）</text><text x="306" y="404" class="scene">场景：&quot;打完有硬块正常吗&quot;</text><text x="306" y="422" class="scene">术后随访必答题 · 转医生处理</text><rect width="222" height="140" x="524" y="298" fill="#fff" stroke="#A8A39D" stroke-dasharray="6 4" stroke-width="1.6" rx="10"/><rect width="52" height="20" x="540" y="312" fill="#8a8578" rx="10"/><text x="566" y="326" class="cnt" text-anchor="middle">F · 2篇</text><text x="602" y="327" class="grpName">毛发与多汗</text><text x="540" y="356" class="grpItem">雄激素性脱发 · 局部多汗症</text><text x="540" y="374" class="grpItem">（其余 30 余篇当字典查）</text><text x="540" y="404" class="scene">场景：&quot;发际线越来越高了&quot;</text><text x="540" y="422" class="scene">长期管理型诉求 · 复购场景多</text><text x="56" y="464" class="footer">学习法：每篇一张 3-2-1 卡片（3 知识点 / 2 常问答法 / 1 个不能踩的坑）· 每周一段费曼录音</text></svg>