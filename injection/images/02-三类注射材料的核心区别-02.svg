<svg xmlns="http://www.w3.org/2000/svg" aria-label="三类材料可逆性对比" role="img" viewBox="0 0 640 220"><rect width="640" height="220" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">出问题之后，能不能&quot;撤回&quot;</text><line x1="50" x2="590" y1="140" y2="140" stroke="#a8a39d" stroke-width="2"/><polygon fill="#a8a39d" points="590 140 582 135 582 145"/><text x="50" y="170" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">难以撤回</text><text x="590" y="170" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">可撤回</text><circle cx="130" cy="140" r="12" fill="#8a9a7f"/><text x="130" y="120" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">再生刺激类</text><text x="130" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">结节难溶、难取</text><circle cx="90" cy="140" r="12" fill="#b5654a"/><text x="90" y="120" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">不明注射物</text><text x="90" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">永久、并发症重</text><circle cx="370" cy="140" r="12" fill="#c9a876"/><text x="370" y="120" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">肉毒杆菌素</text><text x="370" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">数月自行代谢</text><circle cx="540" cy="140" r="12" fill="#7a8b6f"/><text x="540" y="120" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">透明质酸</text><text x="540" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">透明质酸酶可溶</text><text x="320" y="208" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">可逆性影响&quot;后悔成本&quot;——出问题时能否处理，比效果更重要</text></svg>