<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1802 desc1802" role="img" viewBox="0 0 900 620"><title id="title1802">鼻修复的递减规律</title><desc id="desc1802">每次修复能改善的余地通常缩小，风险升高，避免轻率进入反复修复循环</desc><defs><linearGradient id="bg1802" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1802" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg1802)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1802)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 18</text><text x="62" y="117" class="title">修复次数越多，余地越小，风险越高</text><text x="62" y="153" class="kicker">这是一个残酷但真实的规律</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">递减规律示意</text><rect width="480" height="270" x="62" y="230" fill="#f8fbfb" stroke="#dce8e8" rx="14"/><line x1="120" x2="520" y1="470" y2="470" stroke="#5c6c72" stroke-width="1.5"/><line x1="120" x2="120" y1="270" y2="470" stroke="#5c6c72" stroke-width="1.5"/><text x="320" y="490" class="small" text-anchor="middle">修复次数 →</text><text x="100" y="370" class="small" text-anchor="middle" transform="rotate(-90 100 370)">程度</text><path fill="none" stroke="#0072B2" stroke-width="3" d="M 150 290 Q 250 320 350 380 Q 420 420 500 450"/><circle cx="150" cy="290" r="5" fill="#0072B2"/><circle cx="250" cy="330" r="5" fill="#0072B2"/><circle cx="350" cy="385" r="5" fill="#0072B2"/><circle cx="500" cy="450" r="5" fill="#0072B2"/><text x="150" y="280" class="small" text-anchor="middle" style="fill:#0072b2">初鼻</text><text x="250" y="320" class="small" text-anchor="middle" style="fill:#0072b2">第1次</text><text x="350" y="375" class="small" text-anchor="middle" style="fill:#0072b2">第2次</text><text x="500" y="465" class="small" text-anchor="end" style="fill:#0072b2">第3-4次</text><path fill="none" stroke="#D55E00" stroke-dasharray="6 4" stroke-width="3" d="M 150 455 Q 250 440 350 400 Q 420 360 500 295"/><circle cx="150" cy="455" r="5" fill="#D55E00"/><circle cx="500" cy="295" r="5" fill="#D55E00"/><text x="510" y="290" class="small" style="fill:#d55e00">风险↑</text><line x1="150" x2="175" y1="500" y2="500" stroke="#0072B2" stroke-width="3"/><text x="183" y="504" class="small">改善余地（递减）</text><line x1="320" x2="345" y1="500" y2="500" stroke="#D55E00" stroke-dasharray="6 4" stroke-width="3"/><text x="353" y="504" class="small">并发症风险（递增）</text><text x="560" y="216" class="nodeTitle">规律的含义</text><rect width="278" height="270" x="560" y="230" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><text x="580" y="262" class="body">第一次修复：</text><text x="580" y="284" class="small">改善可能明显</text><text x="580" y="316" class="body">第三次、第四次：</text><text x="580" y="338" class="small">往往只能做有限调整</text><text x="580" y="358" class="small">并发症概率显著上升</text><rect width="238" height="62" x="580" y="380" fill="#fdf3e3" rx="8"/><text x="599" y="404" class="small" text-anchor="middle">皮肤坏死 · 感染 · 假体暴露</text><text x="599" y="424" class="small" text-anchor="middle">疤痕增生 · 挛缩鼻</text><rect width="238" height="34" x="580" y="455" fill="#fbeae3" rx="8"/><text x="599" y="476" class="small" text-anchor="middle">决定第一次修复就要慎重</text><rect width="776" height="40" x="62" y="515" fill="#fdf1ee" rx="12"/><text x="450" y="541" class="quote" text-anchor="middle">把修复到完美作为目标是危险的——它会推动反复手术</text><text x="62" y="582" class="footer">医学教育示意 · 图示为趋势示意，非教学图 · 修复须由有经验的医师开展</text></svg>