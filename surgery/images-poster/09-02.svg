<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0902 desc0902">
  <title id="title0902">下巴方案的选择决策</title>
  <desc id="desc0902">骨性程度、可逆诉求、风险承受力、整体比例四个判断点</desc>
  <defs>
    <linearGradient id="bg0902" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0902" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0902)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0902)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 09</text>
  <text x="62" y="117" class="title">下巴方案的选择决策</text>
  <text x="62" y="153" class="kicker">由医生根据解剖决定，不是"咨询师看一眼就推套餐"</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle">四个判断点</text>

  <!-- 四张卡 2x2 -->
  <!-- 卡1：骨性程度 -->
  <rect x="62" y="232" width="377" height="135" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="105" cy="270" r="22" fill="#D55E00"/>
  <text x="105" y="279" class="num" text-anchor="middle">1</text>
  <text x="140" y="266" class="nodeTitle">骨性后缩程度</text>
  <text x="140" y="296" class="body">明显者：倾向颏成形或正颌</text>
  <text x="140" y="320" class="body">轻度者：假体或注射即可</text>
  <rect x="140" y="336" width="280" height="22" rx="6" fill="#fbeae3"/>
  <text x="280" y="352" class="small" text-anchor="middle">侧位片看骨性颏点位置</text>

  <!-- 卡2：可逆诉求 -->
  <rect x="461" y="232" width="377" height="135" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="504" cy="270" r="22" fill="#E69F00"/>
  <text x="504" y="279" class="num" text-anchor="middle">2</text>
  <text x="539" y="266" class="nodeTitle">是否可逆的诉求</text>
  <text x="539" y="296" class="body">完全不想"动骨"：</text>
  <text x="539" y="320" class="body">假体（可取出）或注射（可吸收）</text>
  <rect x="539" y="336" width="280" height="22" rx="6" fill="#fdf3e3"/>
  <text x="679" y="352" class="small" text-anchor="middle">截骨前移不可逆</text>

  <!-- 卡3：风险承受力 -->
  <rect x="62" y="380" width="377" height="135" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="105" cy="418" r="22" fill="#D55E00"/>
  <text x="105" y="427" class="num" text-anchor="middle">3</text>
  <text x="140" y="414" class="nodeTitle">风险承受力</text>
  <text x="140" y="444" class="body">四级手术并发症一旦发生可能较重</text>
  <text x="140" y="468" class="body">不能接受者选低级别方式</text>
  <rect x="140" y="484" width="280" height="22" rx="6" fill="#fbeae3"/>
  <text x="280" y="500" class="small" text-anchor="middle">神经损伤、骨块问题需正视</text>

  <!-- 卡4：整体比例 -->
  <rect x="461" y="380" width="377" height="135" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="504" cy="418" r="22" fill="#0072B2"/>
  <text x="504" y="427" class="num" text-anchor="middle">4</text>
  <text x="539" y="414" class="nodeTitle">整体面部比例</text>
  <text x="539" y="444" class="body">下巴问题常与下颌整体、咬合相关</text>
  <text x="539" y="468" class="body">单纯处理颏部未必最佳</text>
  <rect x="539" y="484" width="280" height="22" rx="6" fill="#eef6f8"/>
  <text x="679" y="500" class="small" text-anchor="middle">下颌整体后缩需正颌（见第 08 篇）</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">判断方式该由医生根据解剖决定，不是看一眼就推套餐</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 颏成形术为四级手术，须在有相应资质机构由具备权限医师开展</text>
</svg>
