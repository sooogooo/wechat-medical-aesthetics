<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t38f1 d38f1" role="img" viewBox="0 0 800 500"><title id="t38f1">口周皮炎的恶性循环</title><desc id="d38f1">口周皮炎表现为嘴周红疹脱屑，长期外用激素会掩盖并加重反复</desc><defs><linearGradient id="bg38f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh38f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote,.step{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.step{fill:#fff}.quote{fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg38f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh38f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 38</text><text x="52" y="92" class="title">越涂激素越反复的恶性循环</text><text x="52" y="116" class="kicker">口周皮炎常在嘴鼻眼周出现红疹，唇红缘附近可留一圈空白</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">典型分布</text><ellipse cx="160" cy="270" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.5" rx="90" ry="80"/><text x="160" y="232" class="body" text-anchor="middle">嘴周 / 鼻翼</text><text x="160" y="252" class="body" text-anchor="middle">眼周偶发</text><ellipse cx="160" cy="296" fill="#fff" stroke="#B5654A" stroke-dasharray="4 3" stroke-width="1.5" rx="34" ry="22"/><text x="160" y="300" class="small" text-anchor="middle">唇红缘</text><text x="160" y="316" class="small" text-anchor="middle">留一圈空白</text><text x="160" y="362" class="small" text-anchor="middle">红色小丘疹</text><text x="160" y="380" class="small" text-anchor="middle">脱屑、灼痒</text><text x="290" y="162" class="nodeTitle">激素掩盖下的反复循环</text><rect width="200" height="56" x="300" y="178" fill="#5F6E54" rx="12"/><text x="400" y="202" class="step" text-anchor="middle">初发红疹灼痒</text><text x="400" y="222" class="step" font-size="12" text-anchor="middle">误当过敏、湿疹</text><rect width="200" height="56" x="540" y="178" fill="#C9A876" rx="12"/><text x="640" y="202" class="step" text-anchor="middle">外用激素/强效霜</text><text x="640" y="222" class="step" font-size="12" text-anchor="middle">短期快速消退</text><rect width="200" height="56" x="540" y="270" fill="#B5654A" rx="12"/><text x="640" y="294" class="step" text-anchor="middle">停药即反弹</text><text x="640" y="314" class="step" font-size="12" text-anchor="middle">范围扩大、更红</text><rect width="200" height="56" x="300" y="270" fill="#B5654A" rx="12"/><text x="400" y="294" class="step" text-anchor="middle">再涂激素压制</text><text x="400" y="314" class="step" font-size="12" text-anchor="middle">依赖加深</text><rect width="200" height="46" x="420" y="362" fill="#5F6E54" rx="12"/><text x="520" y="390" class="step" text-anchor="middle">规范停激素 + 医师方案</text><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 500 206 L 540 206"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 534 200 L 540 206 L 534 212"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 640 234 L 640 270"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 634 264 L 640 270 L 646 264"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 540 298 L 500 298"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 506 292 L 500 298 L 506 304"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 400 270 L 400 234"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 394 240 L 400 234 L 406 240"/><path fill="none" stroke="#5F6E54" stroke-dasharray="5 3" stroke-width="2" d="M 520 362 L 520 326"/><path fill="none" stroke="#5F6E54" stroke-width="2" d="M 514 332 L 520 326 L 526 332"/><rect width="696" height="32" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="453" class="quote" text-anchor="middle">越快退红的方法，可能正是加重的原因</text><text x="52" y="466" class="footer">健康科普示意 · 具体诊疗与用药需由皮肤科医师评估</text></svg>