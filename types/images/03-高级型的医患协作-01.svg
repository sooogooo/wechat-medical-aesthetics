<svg xmlns="http://www.w3.org/2000/svg" aria-label="三种医患关系模式" role="img" viewBox="0 0 640 340"><rect width="640" height="340" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">医患关系的三种模式</text><rect width="185" height="250" x="30" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="122" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">医生主导</text><text x="122" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;听医生的&quot;</text><text x="122" y="150" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">医生决定方案</text><text x="122" y="170" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">你点头执行</text><text x="122" y="210" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">风险：可能不符合</text><text x="122" y="227" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">你的真实诉求</text><text x="122" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">常见于流水线机构</text><rect width="185" height="250" x="227" y="60" fill="#fff" stroke="#b5654a" rx="8"/><text x="320" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">患者主导</text><text x="320" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;我要做这个&quot;</text><text x="320" y="150" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">你指定项目</text><text x="320" y="170" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">医生执行</text><text x="320" y="210" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">风险：可能不适合</text><text x="320" y="227" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">你的解剖基础</text><text x="320" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">常见于&quot;指名做某项&quot;</text><rect width="185" height="250" x="424" y="60" fill="#fff" stroke="#7a8b6f" stroke-width="2" rx="8"/><text x="516" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">协作（高级型）</text><text x="516" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;我们一起定&quot;</text><text x="516" y="150" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">双方各带专长</text><text x="516" y="170" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">共同制定方案</text><text x="516" y="210" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">优势：符合诉求</text><text x="516" y="227" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">又适合基础</text><text x="516" y="270" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">本系列倡导</text><text x="320" y="330" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">高级型不是&quot;谁说了算&quot;，而是&quot;谁的专长在什么环节起作用&quot;</text></svg>