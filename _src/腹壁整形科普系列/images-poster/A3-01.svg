      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · A3</text>
  <text x="62" y="112" class="title">围裙肚是皮肤过剩，不是脂肪</text>
  <text x="62" y="148" class="kicker">脂肪没了，被撑大的皮肤缩不回去</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>
  <rect x="62" y="205" width="172" height="150" rx="10" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="102" cy="241" r="17" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="102" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0072B2" text-anchor="middle">1</text>
  <text x="132" y="247" class="nodeTitle">长期肥胖</text>
  <text x="84" y="283" class="body">皮肤被持续撑大</text>
  <rect x="260" y="205" width="172" height="150" rx="10" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <circle cx="300" cy="241" r="17" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="300" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#D9930D" text-anchor="middle">2</text>
  <text x="330" y="247" class="nodeTitle">弹性受损</text>
  <text x="282" y="283" class="body">弹力纤维断裂退化</text>
  <text x="282" y="309" class="body">妊娠纹即痕迹</text>
  <rect x="458" y="205" width="172" height="150" rx="10" fill="none" stroke="#56B4E9" stroke-width="1.2"/>
  <circle cx="498" cy="241" r="17" fill="none" stroke="#56B4E9" stroke-width="1.2"/>
  <text x="498" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#56B4E9" text-anchor="middle">3</text>
  <text x="528" y="247" class="nodeTitle">大幅减重</text>
  <text x="480" y="283" class="body">脂肪消退</text>
  <text x="480" y="309" class="body">体积明显缩小</text>
  <rect x="656" y="205" width="172" height="150" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="696" cy="241" r="17" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="696" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#C75B00" text-anchor="middle">4</text>
  <text x="726" y="247" class="nodeTitle">皮肤过剩</text>
  <text x="678" y="283" class="body">缩不回、垂坠</text>
  <text x="678" y="309" class="body">形成围裙状</text>
  <line x1="238" y1="280" x2="256" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahA301)"/>
  <line x1="436" y1="280" x2="454" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahA301)"/>
  <line x1="634" y1="280" x2="652" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahA301)"/>
  <text x="62" y="386" class="small">带来的常不只是外观问题</text>

  <rect x="62" y="400" width="178" height="44" rx="9" fill="none" stroke="#56B4E9" stroke-width="1.2"/>
  <text x="151" y="427" class="small" text-anchor="middle">皱褶反复湿疹感染</text>

  <rect x="254" y="400" width="178" height="44" rx="9" fill="none" stroke="#56B4E9" stroke-width="1.2"/>
  <text x="343" y="427" class="small" text-anchor="middle">活动与穿衣受限</text>

  <rect x="446" y="400" width="178" height="44" rx="9" fill="none" stroke="#56B4E9" stroke-width="1.2"/>
  <text x="535" y="427" class="small" text-anchor="middle">清洁困难</text>

  <rect x="638" y="400" width="178" height="44" rx="9" fill="none" stroke="#56B4E9" stroke-width="1.2"/>
  <text x="727" y="427" class="small" text-anchor="middle">接近功能重建</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">这是皮肤过剩，抽脂帮不上</text>
  <text x="62" y="580" class="footer">医学教育示意 · 症状与程度因人而异 · 需面诊评估</text>
