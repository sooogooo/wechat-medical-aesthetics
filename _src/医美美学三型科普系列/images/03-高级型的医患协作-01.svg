<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="三种医患关系模式">
  <rect width="640" height="340" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">医患关系的三种模式</text>

  <!-- 模式一：医生主导 -->
  <rect x="30" y="60" width="185" height="250" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="122" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">医生主导</text>
  <text x="122" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;听医生的&quot;</text>
  <text x="122" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">医生决定方案</text>
  <text x="122" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">你点头执行</text>
  <text x="122" y="210" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">风险：可能不符合</text>
  <text x="122" y="227" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">你的真实诉求</text>
  <text x="122" y="270" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">常见于流水线机构</text>

  <!-- 模式二：患者主导 -->
  <rect x="227" y="60" width="185" height="250" rx="8" fill="#ffffff" stroke="#b5654a"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">患者主导</text>
  <text x="320" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;我要做这个&quot;</text>
  <text x="320" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">你指定项目</text>
  <text x="320" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">医生执行</text>
  <text x="320" y="210" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">风险：可能不适合</text>
  <text x="320" y="227" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">你的解剖基础</text>
  <text x="320" y="270" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">常见于&quot;指名做某项&quot;</text>

  <!-- 模式三：协作 -->
  <rect x="424" y="60" width="185" height="250" rx="8" fill="#ffffff" stroke="#7a8b6f" stroke-width="2"/>
  <text x="516" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">协作（高级型）</text>
  <text x="516" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;我们一起定&quot;</text>
  <text x="516" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">双方各带专长</text>
  <text x="516" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">共同制定方案</text>
  <text x="516" y="210" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">优势：符合诉求</text>
  <text x="516" y="227" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">又适合基础</text>
  <text x="516" y="270" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">本系列倡导</text>

  <text x="320" y="330" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">高级型不是&quot;谁说了算&quot;，而是&quot;谁的专长在什么环节起作用&quot;</text>
</svg>