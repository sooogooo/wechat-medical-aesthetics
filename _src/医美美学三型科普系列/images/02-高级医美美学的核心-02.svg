<svg xmlns="http://www.w3.org/2000/svg" aria-label="整体协调 vs 局部极致" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">整体协调 vs 局部极致</text><rect width="280" height="170" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="170" y="90" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✓ 整体协调</text><text x="50" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 看五官之间的比例关系</text><text x="50" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 考虑面部留白与节奏</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 动态表情下协调</text><text x="50" y="189" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 与气质、年龄相符</text><text x="50" y="213" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">每个局部&quot;不那么极致&quot;，但整体耐看</text><rect width="280" height="170" x="330" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="470" y="90" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✗ 局部极致</text><text x="350" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 鼻子单独追求最高</text><text x="350" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 下巴单独追求最尖</text><text x="350" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 苹果肌单独追求最饱</text><text x="350" y="189" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 拼盘式叠加</text><text x="350" y="213" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">每个局部&quot;到位&quot;，整体却失协、显假</text><text x="320" y="248" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">高级感来自&quot;整体大于局部之和&quot;——五官之间有和谐的节奏感</text></svg>