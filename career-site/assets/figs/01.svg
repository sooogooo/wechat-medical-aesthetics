<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#8a8578"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">三块拼图，拼不出一个行业</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">对医美的印象通常来自三个互不说话的来源</text>

  <rect x="70" y="120" width="230" height="54" rx="8" fill="#f2f2ef" stroke="#e4ddd2" stroke-width="1.4"/><text x="90" y="153" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28">社会新闻里的乱象</text>
  <rect x="70" y="196" width="230" height="54" rx="8" fill="#f2f2ef" stroke="#e4ddd2" stroke-width="1.4"/><text x="90" y="229" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28">饭局上的暴利传闻</text>
  <rect x="70" y="272" width="230" height="54" rx="8" fill="#f2f2ef" stroke="#e4ddd2" stroke-width="1.4"/><text x="90" y="305" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#2b2a28">招聘软件的高薪急聘</text>
  <line x1="310" y1="223" x2="420" y2="223" stroke="#8a8578" stroke-width="1.6" marker-end="url(#ah-p0)"/>
  <rect x="430" y="112" width="300" height="222" rx="8" fill="none" stroke="#8a8578" stroke-width="2"/>
  <text x="580" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#8a8578" font-weight="600" text-anchor="middle">行业实况地图</text>
  <text x="580" y="195" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">钱怎么分 · 谁说了算</text>
  <text x="580" y="222" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">怎么进 · 会经历什么</text>
  <text x="580" y="249" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">名校生的机会与代价</text>
  <text x="580" y="276" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">一页纸决策清单</text>
  <text x="580" y="312" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d" text-anchor="middle">16 篇 · 引用均带日期</text>
  <text x="185" y="372" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#a8a39d" text-anchor="middle">三块碎片，各说各话</text>
  <text x="580" y="372" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#a8a39d" text-anchor="middle">拼成一张完整地图</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">这个站只做一件事，把拼图补齐，不替你决定拼不拼</text>
</svg>