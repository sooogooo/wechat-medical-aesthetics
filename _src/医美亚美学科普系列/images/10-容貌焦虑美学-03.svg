<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="容貌焦虑的代价">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">容貌焦虑带走的，不只是钱</text>

  <rect x="30" y="60" width="185" height="150" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="122" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">心理代价</text>
  <text x="122" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">长期不满足</text>
  <text x="122" y="133" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">自卑、抑郁倾向</text>
  <text x="122" y="151" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">社交回避</text>
  <text x="122" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">自我价值感低</text>

  <rect x="227" y="60" width="185" height="150" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">经济代价</text>
  <text x="320" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">反复消费</text>
  <text x="320" y="133" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">累计花费巨大</text>
  <text x="320" y="151" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">超出承受能力</text>
  <text x="320" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">负债风险</text>

  <rect x="424" y="60" width="185" height="150" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="516" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">身体代价</text>
  <text x="516" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">过度治疗</text>
  <text x="516" y="133" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">并发症风险</text>
  <text x="516" y="151" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不可逆后悔</text>
  <text x="516" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">体象障碍风险</text>

  <text x="320" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">焦虑驱动的医美，几乎注定无法带来真正的满足</text>
</svg>