<svg xmlns="http://www.w3.org/2000/svg" aria-label="中脸 codes 风险要点" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">中脸 codes 的主要风险</text><rect width="280" height="170" x="30" y="55" fill="#fff" stroke="#ece7df" rx="8"/><text x="170" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">血管风险</text><text x="50" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 面动脉及其分支</text><text x="50" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">（鼻唇沟、面颊区域）</text><text x="50" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 角动脉（内眦附近）</text><text x="50" y="184" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 深层骨面相对安全</text><text x="50" y="207" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">熟悉解剖是核心</text><rect width="280" height="170" x="330" y="55" fill="#fff" stroke="#ece7df" rx="8"/><text x="470" y="85" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">美学风险</text><text x="350" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 过度填充 → 显宽、显肿</text><text x="350" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 只填沟不支撑 → 假面</text><text x="350" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 两侧不对称</text><text x="350" y="184" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 材料移位</text><text x="350" y="207" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">剂量与组合是关键</text><text x="320" y="245" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">中脸是年轻化核心，也是最容易“打假”的区域——技术含量高</text></svg>