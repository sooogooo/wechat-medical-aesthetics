0" r="13" fill="#C9A876"/><text x="74" y="255" class="num" text-anchor="middle">2</text><text x="98" y="255" class="body">外用或口服药物起效以月计，需长期维持</text><circle cx="74" cy="292" r="13" fill="#C9A876"/><text x="74" y="297" class="num" text-anchor="middle">3</text><text x="98" y="297" class="body">判断进步至少等一个合理周期，别频繁换药</text><circle cx="74" cy="334" r="13" fill="#B5654A"/><text x="74" y="339" class="num" text-anchor="middle">4</text><text x="98" y="339" class="body">植发后仍需药物维持原有非移植区毛发</text><rect width="704" height="40" x="48" y="372" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="397" class="quote" text-anchor="middle">营养和头皮护理别喧宾夺主</text><text x="48" y="462" class="footer">医学教育示意 · 植发是毛囊再分配，不是无限增发</text></svg>