<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#c9a876" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#c9a876" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">谈 offer 前的尽调五查</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">签约之前按顺序做完，清单可直接带走</text><rect width="128" height="120" x="46" y="150" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="110" y="192" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">一查机构</text><text x="110" y="218" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">执业许可</text><text x="110" y="238" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">行政处罚</text><line x1="178" x2="198" y1="210" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/><rect width="128" height="120" x="200" y="150" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="264" y="192" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">二查医生</text><text x="264" y="218" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">执业信息</text><text x="264" y="238" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">团队稳定性</text><line x1="332" x2="352" y1="210" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/><rect width="128" height="120" x="354" y="150" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="418" y="192" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">三问口径</text><text x="418" y="218" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">营业额还是利润</text><text x="418" y="238" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">收银还是划扣</text><line x1="486" x2="506" y1="210" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/><rect width="128" height="120" x="508" y="150" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="572" y="192" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">四看客源</text><text x="572" y="218" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">直客 · 渠道</text><text x="572" y="238" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">电商占比</text><line x1="640" x2="660" y1="210" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/><rect width="128" height="120" x="662" y="150" fill="#fff" stroke="#b5654a" stroke-width="1.6" rx="8"/><text x="726" y="192" fill="#b5654a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">五识红旗</text><text x="726" y="218" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">病态 KPI</text><text x="726" y="238" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">五个信号</text><text x="400" y="330" fill="#c9a876" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">前四查是信息动作，第五查是判断动作</text><text x="400" y="360" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">杀手问题，考核口径是营业额还是利润，提成按收银还是按划扣</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">口头承诺的提成点位，在多本账的组织里等于不存在</text></svg>