<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t47f2 d47f2" role="img" viewBox="0 0 800 500"><title id="t47f2">色素性痒疹的管理与代谢排查</title><desc id="d47f2">治疗用药与代谢诱因排查及色沉管理的清单</desc><defs><linearGradient id="bg47f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh47f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg47f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh47f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 47</text><text x="52" y="92" class="title">治疗、排查与色沉管理</text><text x="52" y="116" class="kicker">三类手段并行，单一手段往往反复</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="220" height="34" x="52" y="150" fill="#5F6E54" rx="8"/><text x="162" y="172" class="nodeTitle" text-anchor="middle">规范用药</text><rect width="220" height="220" x="52" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="68" cy="216" r="3" fill="#5F6E54"/><text x="80" y="220" class="body">米诺环素等口服</text><circle cx="68" cy="244" r="3" fill="#5F6E54"/><text x="80" y="248" class="body">氨苯砜（医师评估）</text><circle cx="68" cy="272" r="3" fill="#5F6E54"/><text x="80" y="276" class="body">外用抗炎药</text><circle cx="68" cy="300" r="3" fill="#5F6E54"/><text x="80" y="304" class="body">按疗程，不擅自停</text><circle cx="68" cy="328" r="3" fill="#5F6E54"/><text x="80" y="332" class="small">部分药物需监测副作用</text><circle cx="68" cy="372" r="3" fill="#5F6E54"/><text x="80" y="376" fill="#B5654A" class="small">孕妇用药须告知医师</text><rect width="220" height="34" x="290" y="150" fill="#C9A876" rx="8"/><text x="400" y="172" class="nodeTitle" text-anchor="middle">代谢排查</text><rect width="220" height="220" x="290" y="188" fill="#fbf5ea" stroke="#C9A876" rx="10"/><circle cx="306" cy="216" r="3" fill="#C9A876"/><text x="318" y="220" class="body">血糖、尿酮检测</text><circle cx="306" cy="244" r="3" fill="#C9A876"/><text x="318" y="248" class="body">饮食结构评估</text><circle cx="306" cy="272" r="3" fill="#C9A876"/><text x="318" y="276" class="body">近期减重方式</text><circle cx="306" cy="300" r="3" fill="#C9A876"/><text x="318" y="304" class="body">是否长期禁食</text><circle cx="306" cy="328" r="3" fill="#C9A876"/><text x="318" y="332" class="small">糖尿病家族史</text><circle cx="306" cy="372" r="3" fill="#C9A876"/><text x="318" y="376" fill="#5F6E54" class="small">调整饮食可减少复发</text><rect width="220" height="34" x="528" y="150" fill="#7A8B6F" rx="8"/><text x="638" y="172" class="nodeTitle" text-anchor="middle">色沉管理</text><rect width="220" height="220" x="528" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="544" cy="216" r="3" fill="#5F6E54"/><text x="556" y="220" class="body">严格防晒</text><circle cx="544" cy="244" r="3" fill="#5F6E54"/><text x="556" y="248" class="body">勿抓勿摩擦</text><circle cx="544" cy="272" r="3" fill="#5F6E54"/><text x="556" y="276" class="body">温和保湿修复</text><circle cx="544" cy="300" r="3" fill="#5F6E54"/><text x="556" y="304" class="body">色沉多自行缓慢消退</text><circle cx="544" cy="328" r="3" fill="#5F6E54"/><text x="556" y="332" class="small">顽固色沉可后续评估</text><circle cx="544" cy="372" r="3" fill="#5F6E54"/><text x="556" y="376" fill="#B5654A" class="small">急性期勿急于淡化</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">查酮、查糖、查饮食，比单纯吃药更重要</text><text x="52" y="466" class="footer">健康科普示意 · 用药与检查须由皮肤科医师评估</text></svg>