<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1003 desc1003">
  <title id="title1003">颌面四级手术机构的硬门槛</title>
  <desc id="desc1003">资质、麻醉、血备、术后监护、转诊通道五项硬门槛，缺一不应开展</desc>
  <defs>
    <linearGradient id="bg1003" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1003" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 24px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1003)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1003)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 10</text>
  <text x="62" y="117" class="title">颌面四级手术机构的硬门槛</text>
  <text x="62" y="153" class="kicker">急救能力应放在和主刀技术同等甚至更高的位置</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle">五项硬门槛 · 缺一不应开展</text>

  <!-- 五项门槛水平排列 -->
  <!-- 门槛1：资质 -->
  <rect x="62" y="232" width="148" height="240" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="136" cy="268" r="20" fill="#0072B2"/>
  <text x="136" y="276" class="num" text-anchor="middle" font-size="20">1</text>
  <text x="136" y="308" class="nodeTitle" text-anchor="middle" font-size="16">机构资质</text>
  <text x="136" y="338" class="body" text-anchor="middle">执业许可证</text>
  <text x="136" y="360" class="body" text-anchor="middle">核准四级手术</text>
  <text x="136" y="382" class="body" text-anchor="middle">主刀医师</text>
  <text x="136" y="404" class="body" text-anchor="middle">具备权限</text>
  <rect x="76" y="424" width="120" height="34" rx="6" fill="#eef6f8"/>
  <text x="136" y="445" class="small" text-anchor="middle">门诊部一般</text>
  <text x="136" y="475" class="small" text-anchor="middle">不核准四级</text>

  <!-- 门槛2：麻醉科 -->
  <rect x="220" y="232" width="148" height="240" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="294" cy="268" r="20" fill="#E69F00"/>
  <text x="294" y="276" class="num" text-anchor="middle" font-size="20">2</text>
  <text x="294" y="308" class="nodeTitle" text-anchor="middle" font-size="16">麻醉科</text>
  <text x="294" y="338" class="body" text-anchor="middle">常驻麻醉</text>
  <text x="294" y="360" class="body" text-anchor="middle">医生（非外请）</text>
  <text x="294" y="382" class="body" text-anchor="middle">全程监护</text>
  <text x="294" y="404" class="body" text-anchor="middle">全麻保障</text>
  <rect x="234" y="424" width="120" height="34" rx="6" fill="#fdf3e3"/>
  <text x="294" y="445" class="small" text-anchor="middle">全麻本身</text>
  <text x="294" y="475" class="small" text-anchor="middle">即有风险</text>

  <!-- 门槛3：血备 -->
  <rect x="378" y="232" width="148" height="240" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="452" cy="268" r="20" fill="#D55E00"/>
  <text x="452" y="276" class="num" text-anchor="middle" font-size="20">3</text>
  <text x="452" y="308" class="nodeTitle" text-anchor="middle" font-size="16">血备/输血</text>
  <text x="452" y="338" class="body" text-anchor="middle">血库或</text>
  <text x="452" y="360" class="body" text-anchor="middle">可靠备血渠道</text>
  <text x="452" y="382" class="body" text-anchor="middle">大出血可输血</text>
  <text x="452" y="404" class="body" text-anchor="middle">止血设备</text>
  <rect x="392" y="424" width="120" height="34" rx="6" fill="#fbeae3"/>
  <text x="452" y="445" class="small" text-anchor="middle">颌面血供</text>
  <text x="452" y="475" class="small" text-anchor="middle">丰富</text>

  <!-- 门槛4：术后监护 -->
  <rect x="536" y="232" width="148" height="240" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="610" cy="268" r="20" fill="#E69F00"/>
  <text x="610" y="276" class="num" text-anchor="middle" font-size="20">4</text>
  <text x="610" y="308" class="nodeTitle" text-anchor="middle" font-size="16">术后监护</text>
  <text x="610" y="338" class="body" text-anchor="middle">住院观察</text>
  <text x="610" y="360" class="body" text-anchor="middle">气道管理</text>
  <text x="610" y="382" class="body" text-anchor="middle">非观察几小时</text>
  <text x="610" y="404" class="body" text-anchor="middle">就走</text>
  <rect x="550" y="424" width="120" height="34" rx="6" fill="#fdf3e3"/>
  <text x="610" y="445" class="small" text-anchor="middle">"当天回家"</text>
  <text x="610" y="475" class="small" text-anchor="middle">＝危险信号</text>

  <!-- 门槛5：转诊 -->
  <rect x="694" y="232" width="144" height="240" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="766" cy="268" r="20" fill="#0072B2"/>
  <text x="766" y="276" class="num" text-anchor="middle" font-size="20">5</text>
  <text x="766" y="308" class="nodeTitle" text-anchor="middle" font-size="16">转诊通道</text>
  <text x="766" y="338" class="body" text-anchor="middle">绿色通道</text>
  <text x="766" y="360" class="body" text-anchor="middle">最近有抢救</text>
  <text x="766" y="382" class="body" text-anchor="middle">能力的医院</text>
  <text x="766" y="404" class="body" text-anchor="middle">转诊协议</text>
  <rect x="708" y="424" width="116" height="34" rx="6" fill="#eef6f8"/>
  <text x="766" y="445" class="small" text-anchor="middle">出事能快速</text>
  <text x="766" y="475" class="small" text-anchor="middle">转送抢救</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="551" class="quote" text-anchor="middle" fill="#17323d">把"急救能力"放在和"主刀技术"同等甚至更高的位置考量</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 颌面四级手术须在有相应资质、具备急救能力的机构开展</text>
</svg>
