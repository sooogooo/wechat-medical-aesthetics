<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t47f1 d47f1">
  <title id="t47f1">色素性痒疹的分布与诱因</title>
  <desc id="d47f1">颈胸背对称痒疹消退后留网状色沉，部分与酮症或快速减重相关</desc>
  <defs>
    <linearGradient id="bg47f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh47f1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .card { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg47f1)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh47f1)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 47</text>
  <text x="52" y="92" class="title">痒疹退了，留下网状黑印</text>
  <text x="52" y="116" class="kicker">少见炎症性皮肤病，部分病例与酮症或快速减重相关</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 左：典型分布（人体轮廓示意） -->
  <text x="52" y="162" class="nodeTitle">典型分布</text>
  <g transform="translate(120,180)">
    <!-- 头 -->
    <circle cx="100" cy="20" r="18" fill="#f8fbfb" stroke="#7A8B6F"/>
    <!-- 躯干 -->
    <path d="M 70 40 L 130 40 L 138 180 L 62 180 Z" fill="#f8fbfb" stroke="#7A8B6F"/>
    <!-- 手臂 -->
    <path d="M 70 44 L 40 160 L 50 164 L 78 60 Z" fill="#f8fbfb" stroke="#7A8B6F"/>
    <path d="M 130 44 L 160 160 L 150 164 L 122 60 Z" fill="#f8fbfb" stroke="#7A8B6F"/>
    <!-- 分布点（颈胸背） -->
    <ellipse cx="100" cy="50" rx="28" ry="10" fill="#B5654A" opacity="0.7"/>
    <ellipse cx="100" cy="90" rx="36" ry="22" fill="#B5654A" opacity="0.7"/>
    <ellipse cx="100" cy="140" rx="34" ry="20" fill="#B5654A" opacity="0.5"/>
  </g>
  <text x="220" y="240" class="small">颈部</text>
  <text x="220" y="260" class="small">上背 / 肩部</text>
  <text x="220" y="280" class="small">锁骨下区</text>
  <text x="220" y="300" class="small" fill="#5F6E54">对称发作</text>

  <!-- 右：两阶段表现 + 诱因 -->
  <text x="396" y="162" class="nodeTitle">两阶段表现</text>
  <rect x="396" y="178" width="352" height="78" rx="12" fill="#fbf0eb" stroke="#B5654A"/>
  <text x="410" y="202" class="card" fill="#B5654A">急性期</text>
  <text x="410" y="226" class="body">红色丘疹、风团样痒疹</text>
  <text x="410" y="246" class="small">成群出现，瘙痒明显</text>

  <rect x="396" y="266" width="352" height="78" rx="12" fill="#f4f7f1" stroke="#7A8B6F"/>
  <text x="410" y="290" class="card" fill="#5F6E54">消退期</text>
  <text x="410" y="314" class="body">留下网状或斑点状色沉</text>
  <text x="410" y="334" class="small">色沉消退较慢</text>

  <!-- 诱因条 -->
  <text x="396" y="368" class="nodeTitle">可能相关诱因</text>
  <rect x="396" y="378" width="110" height="40" rx="8" fill="#C9A876"/>
  <text x="451" y="394" class="small" text-anchor="middle" fill="#ffffff">生酮饮食</text>
  <text x="451" y="410" class="small" text-anchor="middle" fill="#ffffff">酮症</text>
  <rect x="516" y="378" width="110" height="40" rx="8" fill="#C9A876"/>
  <text x="571" y="394" class="small" text-anchor="middle" fill="#ffffff">快速减重</text>
  <text x="571" y="410" class="small" text-anchor="middle" fill="#ffffff">禁食</text>
  <rect x="636" y="378" width="112" height="40" rx="8" fill="#C9A876"/>
  <text x="692" y="394" class="small" text-anchor="middle" fill="#ffffff">糖尿病</text>
  <text x="692" y="410" class="small" text-anchor="middle" fill="#ffffff">出汗摩擦</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">红疹会退，色沉会淡，关键是别再抓</text>
  <text x="52" y="466" class="footer">健康科普示意 · 诊断与代谢排查须由皮肤科医师评估</text>
</svg>
