<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t03n d03n" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t03n">医美的四道门，资质嵌套图</title><desc id="d03n">资质墙把生活美容挡在外面；墙内从医疗美容到手术项目再到四级手术逐层收窄，门槛逐层升高，最内层的四级手术需要机构与医生双重零容忍核验。</desc><defs><marker id="ar03n" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#6b6864" points="0 0 8 3 0 6"/></marker></defs><rect width="800" height="500" fill="#faf8f4"/><text x="180" y="52" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".18em">NESTED · 资质嵌套</text><text x="180" y="84" fill="#2b2a28" font-family="'Songti SC',Georgia,serif" font-size="28">医美的四道门</text><text x="180" y="106" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">从消费美容到四级手术，每进一层都要持证</text><line x1="148" x2="148" y1="132" y2="416" stroke="#7a8b6f" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/><rect width="60" height="14" x="118" y="120" fill="#faf8f4"/><text x="148" y="130" fill="#7a8b6f" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em" text-anchor="middle">资质墙</text><rect width="88" height="96" x="36" y="200" fill="rgba(43,42,40,0.03)" stroke="rgba(43,42,40,0.30)" stroke-dasharray="4 3" stroke-width="1" rx="6"/><text x="80" y="220" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em" text-anchor="middle">OUTSIDE</text><text x="80" y="240" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">生活美容</text><text x="80" y="258" fill="#a8a39d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" text-anchor="middle">护理 · 美甲 · 按摩</text><text x="80" y="274" fill="#a8a39d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" text-anchor="middle">不破皮 · 不用药</text><text x="80" y="316" fill="#6b6864" font-family="'Songti SC',Georgia,serif" font-size="12" font-style="italic" text-anchor="middle">墙外行医，即属违法</text><path fill="none" stroke="#6b6864" stroke-dasharray="4 3" stroke-width="1" marker-end="url(#ar03n)" d="M 128 248 L 140 248"/><rect width="524" height="296" x="180" y="136" fill="rgba(43,42,40,0.015)" stroke="rgba(43,42,40,0.30)" stroke-width="1" rx="8"/><rect width="112" height="16" x="196" y="128" fill="#faf8f4"/><text x="196" y="140" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">消费美容 · 市场</text><rect width="460" height="232" x="212" y="172" fill="rgba(43,42,40,0.025)" stroke="#6b6864" stroke-width="1" rx="8"/><rect width="196" height="16" x="228" y="164" fill="#faf8f4"/><text x="228" y="176" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">医疗美容 · 执业许可</text><text x="640" y="196" fill="#a8a39d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" text-anchor="end">公立整形科 · 直客机构 · 轻医美连锁 · 渠道机构</text><rect width="396" height="160" x="244" y="208" fill="rgba(43,42,40,0.04)" stroke="#2b2a28" stroke-width="1" rx="8"/><rect width="168" height="16" x="260" y="200" fill="#faf8f4"/><text x="260" y="212" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">手术项目 · 外科资质</text><rect width="332" height="88" x="276" y="244" fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2" rx="8"/><rect width="216" height="16" x="292" y="236" fill="#faf8f4"/><text x="292" y="248" fill="#7a8b6f" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">四级手术 · 最高门槛</text><text x="442" y="284" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">颌面轮廓类手术</text><text x="442" y="306" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">机构资质 + 医生权限 双重核验</text><text x="716" y="148" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".06em">范围 ↓</text><text x="716" y="424" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".06em">门槛 ↑</text><line x1="180" x2="704" y1="452" y2="452" stroke="rgba(43,42,40,0.12)" stroke-width=".8"/><text x="180" y="468" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">LEGEND</text><rect width="12" height="12" x="244" y="460" fill="rgba(43,42,40,0.015)" stroke="rgba(43,42,40,0.30)" stroke-width="1" rx="3"/><text x="262" y="470" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">外层 = 更大范围</text><rect width="12" height="12" x="364" y="460" fill="rgba(43,42,40,0.04)" stroke="#2b2a28" stroke-width="1" rx="3"/><text x="382" y="470" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">内层 = 更高门槛</text><rect width="12" height="12" x="496" y="460" fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2" rx="3"/><text x="514" y="470" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">焦点 = 零容忍核验</text></svg>