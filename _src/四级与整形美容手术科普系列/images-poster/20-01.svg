<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2001 desc2001" role="img" viewBox="0 0 900 620"><title id="title2001">注射隆鼻与手术的边界</title><desc id="desc2001">注射填充适合微小调整，不适合结构性改变，效果临时且有血管栓塞风险</desc><defs><linearGradient id="bg2001" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2001" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 20px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2001)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2001)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 20</text><text x="62" y="117" class="title">注射和手术：适用范围完全不同</text><text x="62" y="153" class="kicker">把它当无风险替代手术，是危险认知</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="380" height="295" x="62" y="210" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="16"/><rect width="380" height="46" x="62" y="210" fill="#0072B2" rx="16"/><rect width="380" height="16" x="62" y="240" fill="#0072B2"/><text x="252" y="240" class="nodeTitle" text-anchor="middle" style="fill:#fff">注射填充：适合</text><circle cx="92" cy="290" r="5" fill="#0072B2"/><text x="110" y="295" class="body">鼻梁轻度低平，希望小幅改善</text><circle cx="92" cy="325" r="5" fill="#0072B2"/><text x="110" y="330" class="body">轻微不对称或凹陷的临时修饰</text><circle cx="92" cy="360" r="5" fill="#0072B2"/><text x="110" y="365" class="body">想先看效果再决定是否手术</text><rect width="340" height="92" x="82" y="395" fill="#eef6f8" rx="8"/><text x="252" y="420" class="small" text-anchor="middle">特点：</text><text x="252" y="442" class="body" text-anchor="middle">创伤小 · 可逆 · 效果临时</text><text x="252" y="465" class="small" text-anchor="middle">透明质酸通常维持数月到一年</text><text x="252" y="482" class="small" text-anchor="middle">需反复注射</text><rect width="380" height="295" x="458" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="16"/><rect width="380" height="46" x="458" y="210" fill="#D55E00" rx="16"/><rect width="380" height="16" x="458" y="240" fill="#D55E00"/><text x="648" y="240" class="nodeTitle" text-anchor="middle" style="fill:#fff">手术：结构性改变</text><circle cx="488" cy="290" r="5" fill="#D55E00"/><text x="506" y="295" class="body">明显的鼻梁低、鼻尖形态差</text><circle cx="488" cy="325" r="5" fill="#D55E00"/><text x="506" y="330" class="body">鼻修复、复杂基础</text><circle cx="488" cy="360" r="5" fill="#D55E00"/><text x="506" y="365" class="body">对永久效果有期待</text><rect width="340" height="92" x="478" y="395" fill="#fbeae3" rx="8"/><text x="648" y="420" class="small" text-anchor="middle">注射解决不了的问题：</text><text x="648" y="442" class="body" text-anchor="middle">鼻尖重塑 · 鼻翼缩小 · 鼻延长</text><text x="648" y="465" class="small" text-anchor="middle">结构性改变必须手术</text><text x="648" y="482" class="small" text-anchor="middle">反复注射可致鼻宽（阿凡达鼻）</text><rect width="776" height="40" x="62" y="525" fill="#fdf1ee" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">注射的并发症虽少见，但一旦发生在面部血管，后果可能很重</text><text x="62" y="582" class="footer">医学教育示意 · 注射填充属医疗美容操作 · 须在正规医疗机构由具备资质的医师开展</text></svg>