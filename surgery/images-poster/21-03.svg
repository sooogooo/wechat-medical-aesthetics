<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2103 desc2103">
  <title id="title2103">线雕、热玛吉能替代拉皮吗</title>
  <desc id="desc2103">按松弛程度选择：轻度考虑非手术，中重度手术更有效，三者各有适应证</desc>
  <defs>
    <linearGradient id="bg2103" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2103" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .tag { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:1px; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2103)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2103)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 21</text>
  <text x="62" y="117" class="title">线雕、热玛吉能替代拉皮吗</text>
  <text x="62" y="153" class="kicker">松弛程度决定选择——三者各有适应证，不是「平替」</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle">按松弛程度对号入座</text>

  <!-- 三栏对比：线雕 / 光电 / 拉皮 -->
  <!-- 线雕 -->
  <rect x="62" y="240" width="250" height="265" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="62" y="240" width="250" height="44" rx="16" fill="#E69F00"/>
  <rect x="62" y="270" width="250" height="14" fill="#E69F00"/>
  <text x="187" y="269" class="tag" text-anchor="middle">线雕 · 轻度松弛</text>
  <text x="82" y="312" class="body">埋入可吸收线提拉</text>
  <text x="82" y="339" class="body">创伤小、恢复快</text>
  <text x="82" y="366" class="body">提升力度有限</text>
  <text x="82" y="393" class="body">线吸收后效果减退</text>
  <rect x="82" y="430" width="210" height="55" rx="8" fill="#fdf3e3"/>
  <text x="187" y="453" class="small" text-anchor="middle">适合轻度松弛</text>
  <text x="187" y="472" class="small" text-anchor="middle">不能替代中重度拉皮</text>

  <!-- 光电 -->
  <rect x="325" y="240" width="250" height="265" rx="16" fill="#f8fbfb" stroke="#009E73" stroke-width="2"/>
  <rect x="325" y="240" width="250" height="44" rx="16" fill="#009E73"/>
  <rect x="325" y="270" width="250" height="14" fill="#009E73"/>
  <text x="450" y="269" class="tag" text-anchor="middle">光电 · 轻中度预防</text>
  <text x="345" y="312" class="body">热玛吉、超声等</text>
  <text x="345" y="339" class="body">以紧肤为主</text>
  <text x="345" y="366" class="body">改善有限</text>
  <text x="345" y="393" class="body">预防性、辅助性</text>
  <rect x="345" y="430" width="210" height="55" rx="8" fill="#e7f5ef"/>
  <text x="450" y="453" class="small" text-anchor="middle">无法处理组织下垂</text>
  <text x="450" y="472" class="small" text-anchor="middle">无法去除多余皮肤</text>

  <!-- 拉皮 -->
  <rect x="588" y="240" width="250" height="265" rx="16" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5"/>
  <rect x="588" y="240" width="250" height="44" rx="16" fill="#D55E00"/>
  <rect x="588" y="270" width="250" height="14" fill="#D55E00"/>
  <text x="713" y="269" class="tag" text-anchor="middle">拉皮 · 中重度松垂</text>
  <text x="608" y="312" class="body">切除多余皮肤</text>
  <text x="608" y="339" class="body">上提 SMAS 深层</text>
  <text x="608" y="366" class="body">提升彻底、效果明确</text>
  <text x="608" y="393" class="body">创伤大、留疤、恢复长</text>
  <rect x="608" y="430" width="210" height="55" rx="8" fill="#fbeae3"/>
  <text x="713" y="453" class="small" text-anchor="middle">真正外科手术</text>
  <text x="713" y="472" class="small" text-anchor="middle">通常二级，深层可达三四级</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">把它们当作拉皮的「平替」，是常见误解</text>

  <text x="62" y="582" class="footer">医学教育示意 · 具体方案以面诊评估松垂来源和程度后确定</text>
</svg>
