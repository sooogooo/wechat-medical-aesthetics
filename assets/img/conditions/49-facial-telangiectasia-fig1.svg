  <rect x="586" y="382" width="166" height="40" rx="10" fill="#5F6E54"/>
  <text x="669" y="398" class="step" text-anchor="middle">4 维护防晒</text>
  <text x="669" y="414" class="step" text-anchor="middle" font-size="11" fill="#f1f7f1">减少复发</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">光电能改善，但先诊断和稳定炎症</text>
  <text x="52" y="466" class="footer">健康科普示意 · 治疗方案须由医师面诊后制定</text>
