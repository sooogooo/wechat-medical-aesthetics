<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="部位与材料硬度匹配图">
  <rect width="660" height="340" fill="#faf8f4" rx="12"/>
  <text x="330" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">不同部位，需要不同硬度</text>

  <!-- 横轴 -->
  <rect x="50" y="200" width="560" height="6" fill="#e3e8dc" rx="3"/>
  <text x="50" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">柔软易铺展</text>
  <text x="610" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">坚硬高支撑</text>

  <!-- 部位点 -->
  <circle cx="90" cy="203" r="9" fill="#a8b6a0"/>
  <text x="90" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">唇部</text>
  <text x="90" y="260" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">极柔软、活动频繁</text>
  <text x="90" y="276" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">需低粘弹性</text>

  <circle cx="180" cy="203" r="9" fill="#9aab93"/>
  <text x="180" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">泪沟</text>
  <text x="180" y="260" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">皮肤薄、易透光</text>
  <text x="180" y="276" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">需小粒径</text>

  <circle cx="280" cy="203" r="9" fill="#8a9a7f"/>
  <text x="280" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">法令纹</text>
  <text x="280" y="260" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">动态皱褶</text>
  <text x="280" y="276" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">需中等支撑</text>

  <circle cx="380" cy="203" r="9" fill="#7a8b6f"/>
  <text x="380" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">苹果肌</text>
  <text x="380" y="260" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">需容积与支撑</text>
  <text x="380" y="276" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">深层提升</text>

  <circle cx="490" cy="203" r="9" fill="#5f6e54"/>
  <text x="490" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">鼻梁</text>
  <text x="490" y="260" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">需塑形支撑</text>
  <text x="490" y="276" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">高粘弹性、高危血管</text>

  <circle cx="580" cy="203" r="9" fill="#4a5840"/>
  <text x="580" y="180" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">下巴</text>
  <text x="580" y="260" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">需坚硬支撑</text>
  <text x="580" y="276" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">抗变形</text>

  <!-- 警示区 -->
  <rect x="50" y="295" width="560" height="30" rx="6" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="330" y="315" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#b5654a">⚠ 鼻部、眉间、额头是高危血管区，型号选择和层次精准都至关重要</text>
</svg>