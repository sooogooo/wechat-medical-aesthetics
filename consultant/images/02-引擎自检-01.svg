<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t02a d02a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t02a">引擎自检三组红绿灯仪表盘</title><desc id="d02a">21条自检分为性格底盘现实条件价值观三组，判读规则在底部色带</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.groupName{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.badge{font:700 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.item{font:500 11.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.needle{stroke:#2b2a28;stroke-width:3;stroke-linecap:round}.rule{font:700 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer,.ruleSub{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.ruleSub{fill:#5c6c72}.footer{fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段0 · 02</text><text x="56" y="90" class="title">引擎自检 21 条红绿灯</text><text x="56" y="116" class="kicker">转行之前先过仪表盘，冲动是这条路线最大的事故源</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="222" height="258" x="52" y="148" fill="#fff" stroke="#c5d3c0" stroke-width="1.3" rx="10"/><path fill="none" stroke="#B5654A" stroke-width="13" d="M 163 246 A 58 58 0 0 1 221 188"/><path fill="none" stroke="#C9A876" stroke-width="13" d="M 221 188 A 58 58 0 0 1 279 246"/><path fill="none" stroke="#7A8B6F" stroke-width="13" d="M 113 246 A 50 50 0 0 1 163 196"/><line x1="163" x2="198" y1="246" y2="211" class="needle"/><circle cx="163" cy="246" r="5" fill="#2B2A28"/><text x="163" y="278" class="groupName" text-anchor="middle">A · 性格与能力底盘</text><rect width="60" height="20" x="133" y="288" fill="#7A8B6F" rx="10"/><text x="163" y="302" class="badge" text-anchor="middle">8 条</text><text x="163" y="332" class="item" text-anchor="middle">外行也能听懂的讲解力</text><text x="163" y="352" class="item" text-anchor="middle">接得住情绪的共情力</text><text x="163" y="372" class="item" text-anchor="middle">被拒绝后的恢复速度</text><text x="163" y="392" class="item" text-anchor="middle">对医学知识的好奇心</text><rect width="222" height="258" x="290" y="148" fill="#fff" stroke="#d9cbab" stroke-width="1.3" rx="10"/><path fill="none" stroke="#B5654A" stroke-width="13" d="M 401 246 A 58 58 0 0 1 459 188"/><path fill="none" stroke="#C9A876" stroke-width="13" d="M 459 188 A 58 58 0 0 1 517 246"/><path fill="none" stroke="#7A8B6F" stroke-width="13" d="M 351 246 A 50 50 0 0 1 401 196"/><line x1="401" x2="366" y1="246" y2="211" class="needle"/><circle cx="401" cy="246" r="5" fill="#2B2A28"/><text x="401" y="278" class="groupName" text-anchor="middle">B · 现实条件</text><rect width="60" height="20" x="371" y="288" fill="#C9A876" rx="10"/><text x="401" y="302" class="badge" text-anchor="middle">7 条</text><text x="401" y="332" class="item" text-anchor="middle">6 个月生活储备</text><text x="401" y="352" class="item" text-anchor="middle">家人支持度</text><text x="401" y="372" class="item" text-anchor="middle">所在城市市场容量</text><text x="401" y="392" class="item" text-anchor="middle">对提成制收入的接受度</text><rect width="222" height="258" x="528" y="148" fill="#fff" stroke="#d9b3a6" stroke-width="1.3" rx="10"/><path fill="none" stroke="#B5654A" stroke-width="13" d="M 639 246 A 58 58 0 0 1 697 188"/><path fill="none" stroke="#C9A876" stroke-width="13" d="M 697 188 A 58 58 0 0 1 755 246"/><path fill="none" stroke="#7A8B6F" stroke-width="13" d="M 589 246 A 50 50 0 0 1 639 196"/><line x1="639" x2="674" y1="246" y2="281" class="needle"/><circle cx="639" cy="246" r="5" fill="#2B2A28"/><text x="639" y="278" class="groupName" text-anchor="middle">C · 价值观（一票否决）</text><rect width="60" height="20" x="609" y="288" fill="#B5654A" rx="10"/><text x="639" y="302" class="badge" text-anchor="middle">6 条</text><text x="639" y="332" class="item" text-anchor="middle">接受不承诺疗效慢成交</text><text x="639" y="352" class="item" text-anchor="middle">不放大容貌焦虑促单</text><text x="639" y="372" class="item" text-anchor="middle">能拒绝不合适的客户</text><text x="639" y="392" class="item" text-anchor="middle">接受医生拥有决策权</text><rect width="698" height="44" x="52" y="418" fill="#fff" stroke="#dcdcd8" stroke-width="1.2" rx="10"/><circle cx="76" cy="440" r="7" fill="#7A8B6F"/><text x="90" y="437" class="rule">绿灯 ≥ 15 → 出发</text><text x="90" y="453" class="ruleSub">且 C 组无红灯</text><circle cx="256" cy="440" r="7" fill="#C9A876"/><text x="270" y="437" class="rule">黄灯集中 B 组 → 缓行</text><text x="270" y="453" class="ruleSub">补齐储备与支持再出发</text><circle cx="470" cy="440" r="7" fill="#B5654A"/><text x="484" y="437" class="rule">C 组任一红灯 → 建议放弃</text><text x="484" y="453" class="ruleSub">这不是失败，是红绿灯在救命</text><text x="56" y="470" class="footer">指针位置仅为示意 · 21 条全文见课程 02 课</text></svg>