<svg xmlns="http://www.w3.org/2000/svg" aria-label="正常术后反应时间线" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">这些是正常的，会自行消退</text><line x1="50" x2="590" y1="140" y2="140" stroke="#a8a39d" stroke-width="2"/><polygon fill="#a8a39d" points="590 140 582 135 582 145"/><circle cx="100" cy="140" r="8" fill="#7a8b6f"/><text x="100" y="120" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">注射</text><text x="100" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">即刻肿胀</text><circle cx="220" cy="140" r="7" fill="#8a9a7f"/><text x="220" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">24–72 小时</text><text x="220" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">肿胀淤青高峰</text><circle cx="360" cy="140" r="7" fill="#8a9a7f"/><text x="360" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">1–2 周</text><text x="360" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">逐渐消退</text><circle cx="500" cy="140" r="7" fill="#7a8b6f"/><text x="500" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">2–4 周</text><text x="500" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">稳定</text><rect width="540" height="30" x="50" y="195" fill="#eef0ea" rx="6"/><text x="320" y="215" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">✓ 肿胀、淤青、轻度胀痛、局部发红（轻微）——随时间改善，不持续加重</text><text x="320" y="232" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">“随时间改善”是判断正常与异常的核心线索</text></svg>