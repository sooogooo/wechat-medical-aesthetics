<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0502 desc0502" role="img" viewBox="0 0 900 620"><title id="title0502">手术效果的边界与术后心理适应</title><desc id="desc0502">合理预期四边界与术后后悔期的情绪阶段，理解过程性表现不等于失败</desc><defs><linearGradient id="bg0502" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0502" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0502)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0502)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 05</text><text x="62" y="117" class="title">效果的边界与术后心理适应</text><text x="62" y="153" class="kicker">合理预期 + 给时间，是心理适应的两步</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="388" height="295" x="62" y="210" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="388" height="40" x="62" y="210" fill="#0072B2" rx="14"/><rect width="388" height="14" x="62" y="236" fill="#0072B2"/><text x="82" y="237" fill="#fff" class="nodeTitle">合理预期的四个边界</text><circle cx="92" cy="280" r="5" fill="#0072B2"/><text x="108" y="285" class="body" font-weight="700">解剖基础决定上限</text><text x="108" y="304" class="small">骨骼、皮肤厚度、软组织不同，效果不同</text><circle cx="92" cy="332" r="5" fill="#0072B2"/><text x="108" y="337" class="body" font-weight="700">改变结构，不改变人生</text><text x="108" y="356" class="small">轮廓变了不会自动带来工作关系自信</text><circle cx="92" cy="384" r="5" fill="#0072B2"/><text x="108" y="389" class="body" font-weight="700">效果渐进，非&quot;醒来即完美&quot;</text><text x="108" y="408" class="small">肿胀、不对称、疤痕消退需数月到一年</text><circle cx="92" cy="436" r="5" fill="#0072B2"/><text x="108" y="441" class="body" font-weight="700">对称是相对的，非绝对</text><text x="108" y="460" class="small">人体本就左右不对称，术后也不会镜像</text><rect width="348" height="22" x="82" y="472" fill="#eef6f8" rx="6"/><text x="256" y="488" class="small" text-anchor="middle">承诺&quot;完美对称&quot;&quot;终身效果&quot;的多半不诚实</text><rect width="376" height="295" x="462" y="210" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="376" height="40" x="462" y="210" fill="#E69F00" rx="14"/><rect width="376" height="14" x="462" y="236" fill="#E69F00"/><text x="482" y="237" fill="#fff" class="nodeTitle">术后情绪四阶段（很常见）</text><line x1="510" x2="510" y1="280" y2="475" stroke="#E69F00" stroke-width="2.5"/><circle cx="510" cy="295" r="8" fill="#E69F00"/><text x="535" y="292" class="body" font-weight="700">术后早期失落</text><text x="535" y="311" class="small">&quot;我做了什么&quot;——第一周常见</text><circle cx="510" cy="345" r="8" fill="#E69F00"/><text x="535" y="342" class="body" font-weight="700">漫长等待焦虑</text><text x="535" y="361" class="small">每天照镜怀疑&quot;是不是失败&quot;</text><circle cx="510" cy="395" r="8" fill="#E69F00"/><text x="535" y="392" class="body" font-weight="700">对效果反复评估</text><text x="535" y="411" class="small">有时觉得不错，有时觉得不对</text><circle cx="510" cy="445" r="8" fill="#0072B2"/><text x="535" y="442" class="body" font-weight="700">适应后稳定</text><text x="535" y="461" class="small">随时间推移情绪趋于平稳</text><rect width="336" height="22" x="482" y="472" fill="#fdf3e3" rx="6"/><text x="650" y="488" class="small" text-anchor="middle">术后早期强烈情绪 ≠ 决策错误</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">整形是工具不是解药——当工具用有用，当解药指望注定失望</text><text x="62" y="582" class="footer">医学教育示意 · 本文用于健康教育，不能替代面诊和必要的心理评估</text></svg>