<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1901 desc1901">
  <title id="title1901">肋软骨的优缺点</title>
  <desc id="desc1901">肋软骨量充足支撑强无排异，但有额外切口、吸收变形、气胸等风险</desc>
  <defs>
    <linearGradient id="bg1901" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1901" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1901)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1901)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 19</text>
  <text x="62" y="117" class="title">肋软骨：量足支撑强，但有代价</text>
  <text x="62" y="153" class="kicker">它不是为了高级，而是因为前次或复杂基础需要更多支撑</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：优点 -->
  <rect x="62" y="210" width="380" height="295" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="210" width="380" height="46" rx="16" fill="#0072B2"/>
  <rect x="62" y="240" width="380" height="16" fill="#0072B2"/>
  <text x="252" y="240" class="nodeTitle" text-anchor="middle" style="fill:#ffffff">优点</text>
  <circle cx="92" cy="290" r="5" fill="#0072B2"/>
  <text x="110" y="295" class="body">量充足，可切取量大</text>
  <circle cx="92" cy="325" r="5" fill="#0072B2"/>
  <text x="110" y="330" class="body">支撑力强</text>
  <circle cx="92" cy="360" r="5" fill="#0072B2"/>
  <text x="110" y="365" class="body">自体组织，无排异</text>
  <circle cx="92" cy="395" r="5" fill="#0072B2"/>
  <text x="110" y="400" class="body">可雕刻成所需形态</text>
  <rect x="82" y="430" width="340" height="58" rx="8" fill="#eef6f8"/>
  <text x="252" y="453" class="small" text-anchor="middle">适用：鼻修复 · 鼻基础差</text>
  <text x="252" y="473" class="small" text-anchor="middle">延长或大幅重塑鼻尖 · 复杂重建</text>

  <!-- 右：缺点 -->
  <rect x="458" y="210" width="380" height="295" rx="16" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="458" y="210" width="380" height="46" rx="16" fill="#D55E00"/>
  <rect x="458" y="240" width="380" height="16" fill="#D55E00"/>
  <text x="648" y="240" class="nodeTitle" text-anchor="middle" style="fill:#ffffff">缺点</text>
  <circle cx="488" cy="285" r="5" fill="#D55E00"/>
  <text x="506" y="290" class="body">额外胸部切口和创伤</text>
  <circle cx="488" cy="315" r="5" fill="#D55E00"/>
  <text x="506" y="320" class="body">移植后部分吸收，影响远期形态</text>
  <circle cx="488" cy="345" r="5" fill="#D55E00"/>
  <text x="506" y="350" class="body">变形（弯曲）：内在应力所致</text>
  <circle cx="488" cy="375" r="5" fill="#D55E00"/>
  <text x="506" y="380" class="body">切取并发症（含气胸，罕见但严重）</text>
  <circle cx="488" cy="405" r="5" fill="#E69F00"/>
  <text x="506" y="410" class="body">手术时间长、级别高</text>
  <rect x="478" y="430" width="340" height="58" rx="8" fill="#fbeae3"/>
  <text x="648" y="453" class="small" text-anchor="middle">术后胸部疼痛，数天到数周活动受限</text>
  <text x="648" y="473" class="small" text-anchor="middle">会留下胸部切口疤痕</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">简单鼻基础用肋软骨是过度治疗，复杂基础硬塞假体又可能增加风险</text>

  <text x="62" y="582" class="footer">医学教育示意 · 肋软骨切取联合鼻综合常达三级／四级 · 该不该用由解剖决定</text>
</svg>
