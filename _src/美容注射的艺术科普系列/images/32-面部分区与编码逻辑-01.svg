<svg xmlns="http://www.w3.org/2000/svg" aria-label="MD Codes 层级结构示意" role="img" viewBox="0 0 720 340"><rect width="720" height="340" fill="#faf8f4" rx="12"/><text x="360" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">从大区到具体 code（以颊部为例）</text><rect width="160" height="200" x="40" y="70" fill="#7a8b6f" rx="8"/><text x="120" y="110" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">大区</text><text x="120" y="140" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" text-anchor="middle">Cheeks（颊部）</text><text x="120" y="165" fill="#eef0ea" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">苹果肌所在的</text><text x="120" y="183" fill="#eef0ea" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">大功能区域</text><line x1="200" x2="260" y1="170" y2="170" stroke="#a8a39d" stroke-width="2" marker-end="url(#m1)"/><defs><marker id="m1" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><polygon fill="#a8a39d" points="0 0 8 4 0 8"/></marker></defs><rect width="180" height="200" x="260" y="70" fill="#8a9a7f" rx="8"/><text x="350" y="110" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">子区域</text><text x="350" y="140" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">颧骨前区</text><text x="350" y="160" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">颧弓区</text><text x="350" y="180" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">颊侧区</text><text x="350" y="215" fill="#eef0ea" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">按解剖位置细分</text><line x1="440" x2="500" y1="170" y2="170" stroke="#a8a39d" stroke-width="2" marker-end="url(#m1)"/><rect width="180" height="200" x="500" y="70" fill="#c9a876" rx="8"/><text x="590" y="110" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">具体 code</text><rect width="60" height="28" x="520" y="130" fill="#fff" rx="4"/><text x="550" y="149" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Ck1</text><rect width="60" height="28" x="600" y="130" fill="#fff" rx="4"/><text x="630" y="149" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Ck2</text><rect width="60" height="28" x="520" y="170" fill="#fff" rx="4"/><text x="550" y="189" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Ck3</text><rect width="60" height="28" x="600" y="170" fill="#fff" rx="4"/><text x="630" y="189" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Ck4</text><text x="590" y="230" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">每个 code 对应</text><text x="590" y="248" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">明确层次与技术</text><text x="360" y="305" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">读到“Ck1”，你就知道它指的是“颊部大区 → 颧骨前子区 → 第 1 号点位”</text><text x="360" y="325" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">图为层级示意；具体 code 数量和命名以 MD Codes 体系为准</text></svg>