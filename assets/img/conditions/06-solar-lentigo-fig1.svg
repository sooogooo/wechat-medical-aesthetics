<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t06f1 d06f1" role="img" viewBox="0 0 800 500"><title id="t06f1">日光性黑子诊断优先级</title><desc id="d06f1">新发变化的斑先诊断排除恶性，再谈美容处理</desc><defs><linearGradient id="bg06f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh06f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg06f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh06f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 06</text><text x="56" y="90" class="title">日光性黑子 先诊断还是先美容</text><text x="56" y="116" class="kicker">新发或变化的斑先让医生看一眼，再谈淡化</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="200" height="48" x="300" y="158" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.6" rx="10"/><text x="400" y="188" class="body" font-weight="700" text-anchor="middle">发现褐色小斑</text><path fill="none" stroke="#7d8e93" stroke-width="1.6" d="M 400 210 L 400 230"/><path fill="none" stroke="#7d8e93" stroke-width="1.6" d="M 395 224 L 400 230 L 405 224"/><rect width="320" height="44" x="240" y="234" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><text x="400" y="261" class="body" text-anchor="middle">是否新发 颜色不均 快速变化</text><path fill="none" stroke="#B5654A" stroke-width="1.6" d="M 320 280 L 180 320"/><path fill="none" stroke="#7A8B6F" stroke-width="1.6" d="M 480 280 L 620 320"/><rect width="290" height="116" x="56" y="324" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="10"/><rect width="290" height="28" x="56" y="324" fill="#B5654A" rx="10"/><rect width="290" height="10" x="56" y="342" fill="#B5654A"/><text x="201" y="343" class="tag" text-anchor="middle">先诊断 排除恶性</text><text x="72" y="372" class="body">边界不规则</text><text x="72" y="394" class="body">颜色深浅不均</text><text x="72" y="416" class="body">短期内明显变化</text><text x="72" y="432" fill="#8a3f2b" class="small">不要自行点药水或抠</text><rect width="290" height="116" x="454" y="324" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="10"/><rect width="290" height="28" x="454" y="324" fill="#7A8B6F" rx="10"/><rect width="290" height="10" x="454" y="342" fill="#7A8B6F"/><text x="599" y="343" class="tag" text-anchor="middle">稳定良性 可淡化</text><text x="470" y="372" class="body">边界清楚 颜色均匀</text><text x="470" y="394" class="body">长期稳定无变化</text><text x="470" y="416" class="body">激光或冷冻可选</text><text x="470" y="432" class="small">防晒防累积复发</text><rect width="688" height="20" x="56" y="448" fill="#eef4ee" rx="8"/><text x="400" y="462" class="quote" font-size="14" text-anchor="middle">它本身多为良性，但新发变化的斑先诊断再美容处理</text><text x="400" y="486" class="footer" text-anchor="middle">医学教育示意 · 新发或变化的斑需皮肤科面诊排除恶性后再处理</text></svg>