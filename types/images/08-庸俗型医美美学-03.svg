<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="庸俗型的形成机制">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">庸俗型是被这几股力量推出来的</text>

  <rect x="30" y="60" width="140" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="100" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">商业推动</text>
  <text x="100" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;全套套餐&quot;</text>
  <text x="100" y="136" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">利润导向</text>
  <text x="100" y="154" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;多做才赚&quot;</text>
  <text x="100" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">咨询师主导</text>
  <text x="100" y="208" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">而非医生</text>

  <rect x="180" y="60" width="140" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="250" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">流行裹挟</text>
  <text x="250" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">社交媒体</text>
  <text x="250" y="136" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">种草文化</text>
  <text x="250" y="154" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">明星示范</text>
  <text x="250" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;大家都做&quot;</text>
  <text x="250" y="208" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">的从众</text>

  <rect x="330" y="60" width="140" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="400" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">信息不对称</text>
  <text x="400" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">消费者不懂</text>
  <text x="400" y="136" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">解剖与审美</text>
  <text x="400" y="154" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">被营销引导</text>
  <text x="400" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">难以分辨</text>
  <text x="400" y="208" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">好坏方案</text>

  <rect x="480" y="60" width="140" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="550" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">焦虑驱动</text>
  <text x="550" y="118" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">容貌焦虑</text>
  <text x="550" y="136" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">怕&quot;落后&quot;</text>
  <text x="550" y="154" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">怕&quot;不够好&quot;</text>
  <text x="550" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">急于&quot;改善&quot;</text>
  <text x="550" y="208" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">失去审慎</text>

  <text x="320" y="270" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">四股力量叠加，把人推向庸俗型——所以落入庸俗型，多数不是个人品味问题</text>
</svg>