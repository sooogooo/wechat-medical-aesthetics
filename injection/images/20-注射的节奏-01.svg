<svg xmlns="http://www.w3.org/2000/svg" aria-label="注射脸的形成路径" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">“注射脸”通常是这样累积出来的</text><rect width="135" height="170" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><ellipse cx="97" cy="130" fill="#f3efe8" stroke="#a8a39d" rx="42" ry="55"/><text x="97" y="80" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">阶段一</text><text x="97" y="205" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">初次注射</text><text x="97" y="222" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">改善明显</text><text x="97" y="239" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">自然</text><rect width="135" height="170" x="180" y="60" fill="#f4ede0" stroke="#c9a876" rx="8"/><ellipse cx="247" cy="130" fill="#f3efe8" stroke="#a8a39d" rx="46" ry="58"/><ellipse cx="247" cy="155" fill="#eef0ea" opacity=".6" rx="20" ry="15"/><text x="247" y="80" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">阶段二</text><text x="247" y="205" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">反复补打</text><text x="247" y="222" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">材料叠加</text><text x="247" y="239" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">开始显宽</text><rect width="135" height="170" x="330" y="60" fill="#f4ede0" stroke="#c9a876" rx="8"/><ellipse cx="397" cy="130" fill="#f3efe8" stroke="#a8a39d" rx="50" ry="60"/><ellipse cx="397" cy="140" fill="#eef0ea" opacity=".7" rx="28" ry="20"/><ellipse cx="370" cy="118" fill="#eef0ea" opacity=".7" rx="8" ry="5"/><ellipse cx="424" cy="118" fill="#eef0ea" opacity=".7" rx="8" ry="5"/><text x="397" y="80" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">阶段三</text><text x="397" y="205" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">多处叠加</text><text x="397" y="222" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">比例失调</text><text x="397" y="239" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">显肿</text><rect width="130" height="170" x="480" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><ellipse cx="545" cy="130" fill="#f3efe8" stroke="#a8a39d" rx="54" ry="62"/><ellipse cx="545" cy="135" fill="#eef0ea" opacity=".8" rx="34" ry="24"/><ellipse cx="515" cy="115" fill="#eef0ea" opacity=".8" rx="10" ry="7"/><ellipse cx="575" cy="115" fill="#eef0ea" opacity=".8" rx="10" ry="7"/><text x="545" y="80" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">阶段四</text><text x="545" y="205" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">过度治疗</text><text x="545" y="222" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">假面感</text><text x="545" y="239" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">不自然</text><text x="320" y="262" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">图为示意；“注射脸”往往不是一次形成的，而是多次累积的结果</text></svg>