<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1902 desc1902">
  <title id="title1902">肋软骨鼻综合的风险要点</title>
  <desc id="desc1902">气胸、出血感染、疤痕、软骨吸收变形、胸部疼痛等风险，决定前要问清的问题</desc>
  <defs>
    <linearGradient id="bg1902" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1902" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
      .warn { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#D55E00; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1902)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1902)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 19</text>
  <text x="62" y="117" class="title">肋软骨鼻综合的风险要点</text>
  <text x="62" y="153" class="kicker">鼻部和胸部操作叠加，风险也叠加</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：风险清单 -->
  <text x="62" y="216" class="nodeTitle">必须正视的风险</text>
  <!-- 气胸（最严重，高亮） -->
  <rect x="62" y="228" width="430" height="48" rx="10" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="62" y="228" width="8" height="48" rx="4" fill="#D55E00"/>
  <text x="86" y="250" class="warn">气胸</text>
  <text x="86" y="269" class="small">切取时可能损伤胸膜，罕见但需评估处理</text>

  <!-- 出血血肿 -->
  <rect x="62" y="284" width="430" height="40" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5"/>
  <rect x="62" y="284" width="8" height="40" rx="4" fill="#E69F00"/>
  <text x="86" y="309" class="nodeTitle">出血、血肿</text>

  <!-- 双重感染 -->
  <rect x="62" y="332" width="430" height="40" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5"/>
  <rect x="62" y="332" width="8" height="40" rx="4" fill="#E69F00"/>
  <text x="86" y="357" class="nodeTitle">胸部＋鼻部双重感染风险</text>

  <!-- 胸部疤痕 -->
  <rect x="62" y="380" width="430" height="40" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5"/>
  <rect x="62" y="380" width="8" height="40" rx="4" fill="#E69F00"/>
  <text x="86" y="405" class="nodeTitle">胸部切口疤痕，可能增生</text>

  <!-- 吸收变形 -->
  <rect x="62" y="428" width="430" height="40" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5"/>
  <rect x="62" y="428" width="8" height="40" rx="4" fill="#E69F00"/>
  <text x="86" y="453" class="nodeTitle">软骨吸收、变形（影响远期形态）</text>

  <!-- 其他 -->
  <rect x="62" y="476" width="430" height="40" rx="10" fill="#f8fbfb" stroke="#dce8e8" stroke-width="1.5"/>
  <rect x="62" y="476" width="8" height="40" rx="4" fill="#5c6c72"/>
  <text x="86" y="501" class="small">术后疼痛活动受限 · 鼻部风险（同鼻综合）· 麻醉风险</text>

  <!-- 右：决定前该问的问题 -->
  <text x="520" y="216" class="nodeTitle">决定前该问的问题</text>
  <rect x="520" y="228" width="318" height="288" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>

  <text x="540" y="258" class="body">我的鼻基础真的需要肋软骨吗？</text>
  <text x="540" y="278" class="small">耳软骨或鼻中隔够不够？</text>

  <text x="540" y="310" class="body">取哪根肋骨？切口在哪？</text>
  <text x="540" y="330" class="small">疤痕大概多长？</text>

  <text x="540" y="362" class="body">气胸风险怎么评估和处理？</text>

  <text x="540" y="400" class="body">软骨吸收和变形的概率和应对？</text>

  <text x="540" y="438" class="body">术后胸部恢复多久？</text>
  <text x="540" y="458" class="small">影响日常活动多久？</text>

  <rect x="540" y="475" width="278" height="32" rx="6" fill="#eef6f8"/>
  <text x="679" y="496" class="small" text-anchor="middle">医生没解释这些就建议肋软骨，值得追问</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="551" class="quote" text-anchor="middle">肋软骨不是标配升级——该不该用，由解剖和术式决定</text>

  <text x="62" y="582" class="footer">医学教育示意 · 须在有资质、有肋软骨经验的机构开展 · 含胸膜并发症应对能力</text>
</svg>
