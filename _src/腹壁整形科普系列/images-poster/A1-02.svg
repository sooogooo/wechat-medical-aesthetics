<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="titleA102 descA102" role="img" viewBox="0 0 900 620"><title id="titleA102">面诊前的两个自测</title><desc id="descA102">捏皮测试与抬肩测试的步骤和判断要点，自测不能替代医生检查</desc><defs><marker id="ahA102" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#b7c6cb" d="M0,0 L10,5 L0,10 z"/></marker><style>.series{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.8px;fill:#7d97a4}.title{font:300 32px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.kicker{font:400 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.nodeTitle{font:500 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.body{font:400 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#4a5a60}.small{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.quote{font:400 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.footer{font:400 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#93a3a8}</style></defs><rect width="899" height="619" x=".5" y=".5" fill="#fff" stroke="#dde5e7" stroke-width="1"/><text x="62" y="64" class="series">腹壁整形 12 讲 · A1</text><text x="62" y="112" class="title">面诊前的两个自测</text><text x="62" y="148" class="kicker">捏皮测试看皮肤，抬肩测试看肌分离，自测只是初步参照</text><line x1="62" x2="838" y1="172" y2="172" stroke="#e3e9ea" stroke-width="1"/><rect width="380" height="230" x="62" y="205" fill="none" stroke="#D9930D" stroke-width="1.2" rx="10"/><text x="84" y="243" class="nodeTitle">捏皮测试（看皮肤）</text><text x="84" y="277" class="body">站立位，捏起下腹皮肤</text><text x="84" y="303" class="body">厚而有弹性，偏脂肪型</text><text x="84" y="329" class="body">松而皮多、下垂，偏皮肤型</text><text x="252" y="423" class="small" text-anchor="middle" style="fill:#d9930d">分不清，多半是混合型</text><rect width="380" height="230" x="478" y="205" fill="none" stroke="#0072B2" stroke-width="1.2" rx="10"/><text x="500" y="243" class="nodeTitle">抬肩测试（看肌分离）</text><text x="500" y="277" class="body">仰卧屈膝，抬头像半个卷腹</text><text x="500" y="303" class="body">手指横按肚脐上下的腹白线</text><text x="500" y="329" class="body">感受中间那条沟的宽度</text><text x="668" y="423" class="small" text-anchor="middle" style="fill:#0072b2">明显宽于两指提示可能分离</text><text x="450" y="482" class="small" text-anchor="middle" style="fill:#c75b00">自测仅供初步判断，不能替代医生体格检查，最终以面诊为准</text><line x1="62" x2="838" y1="520" y2="520" stroke="#e3e9ea" stroke-width="1"/><text x="450" y="548" class="quote" text-anchor="middle">带着初步判断去面诊，而不是自己定方案</text><text x="62" y="580" class="footer">医学教育示意 · 自测不能替代医生体格检查与影像评估</text></svg>