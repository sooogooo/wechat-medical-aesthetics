<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="面部层次结构示意图">
  <rect width="640" height="400" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">面部分层与注射风险区</text>

  <!-- 层次堆叠图（左侧立体块） -->
  <g transform="translate(60,70)">
    <!-- 表皮 -->
    <polygon points="0,0 200,0 230,20 30,20" fill="#f4ede0" stroke="#ddd6ca"/>
    <polygon points="30,20 230,20 230,32 30,32" fill="#ede4d3" stroke="#ddd6ca"/>
    <text x="115" y="16" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">表皮</text>

    <!-- 真皮浅层 -->
    <polygon points="30,32 230,32 260,52 60,52" fill="#eef0ea" stroke="#ddd6ca"/>
    <polygon points="60,52 260,52 260,70 60,70" fill="#e3e8dc" stroke="#ddd6ca"/>
    <text x="145" y="48" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">真皮浅层</text>

    <!-- 真皮深层 -->
    <polygon points="60,70 260,70 290,90 90,90" fill="#dde4d6" stroke="#ddd6ca"/>
    <polygon points="90,90 290,90 290,112 90,112" fill="#cdd8c0" stroke="#ddd6ca"/>
    <text x="175" y="86" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">真皮深层（填充常用）</text>

    <!-- 皮下脂肪 -->
    <polygon points="90,112 290,112 320,132 120,132" fill="#c9d4be" stroke="#ddd6ca"/>
    <polygon points="120,132 320,132 320,162 120,162" fill="#b5c5a8" stroke="#ddd6ca"/>
    <text x="205" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">皮下脂肪层</text>

    <!-- SMAS/肌肉 -->
    <polygon points="120,162 320,162 350,182 150,182" fill="#a8b6a0" stroke="#ddd6ca"/>
    <polygon points="150,182 350,182 350,206 150,206" fill="#94a48a" stroke="#ddd6ca"/>
    <text x="235" y="178" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#ffffff">SMAS / 肌肉层</text>

    <!-- 骨膜 -->
    <polygon points="150,206 350,206 380,226 180,226" fill="#7a8b6f" stroke="#5f6e54"/>
    <rect x="180" y="226" width="200" height="20" fill="#5f6e54"/>
    <text x="265" y="222" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#ffffff">骨膜 / 骨</text>
  </g>

  <!-- 右侧：风险标注 -->
  <line x1="380" y1="90" x2="430" y2="90" stroke="#a8a39d" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="430" cy="90" r="5" fill="#7a8b6f"/>
  <text x="445" y="86" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">真皮深层</text>
  <text x="445" y="100" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">浅纹、细纹常用</text>

  <line x1="380" y1="150" x2="430" y2="150" stroke="#a8a39d" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="430" cy="150" r="5" fill="#7a8b6f"/>
  <text x="445" y="146" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">皮下脂肪层</text>
  <text x="445" y="160" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">容积填充常用，血管丰富</text>

  <line x1="380" y1="200" x2="430" y2="200" stroke="#a8a39d" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="430" cy="200" r="5" fill="#c9a876"/>
  <text x="445" y="196" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">肌肉层</text>
  <text x="445" y="210" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">肉毒注射目标</text>

  <line x1="380" y1="240" x2="430" y2="240" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="430" cy="240" r="6" fill="#b5654a"/>
  <text x="445" y="236" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">骨膜上</text>
  <text x="445" y="250" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">支撑性填充，需精准</text>

  <text x="320" y="380" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">层次因部位而异；血管在多个层次均有走行，是个体差异最大的风险因素</text>
</svg>