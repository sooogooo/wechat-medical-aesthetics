<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="整体协调 vs 局部极致">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">整体协调 vs 局部极致</text>

  <rect x="30" y="60" width="280" height="170" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="170" y="90" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">✓ 整体协调</text>
  <text x="50" y="120" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 看五官之间的比例关系</text>
  <text x="50" y="143" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 考虑面部留白与节奏</text>
  <text x="50" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 动态表情下协调</text>
  <text x="50" y="189" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 与气质、年龄相符</text>
  <text x="50" y="213" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">每个局部&quot;不那么极致&quot;，但整体耐看</text>

  <rect x="330" y="60" width="280" height="170" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="470" y="90" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">✗ 局部极致</text>
  <text x="350" y="120" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 鼻子单独追求最高</text>
  <text x="350" y="143" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 下巴单独追求最尖</text>
  <text x="350" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 苹果肌单独追求最饱</text>
  <text x="350" y="189" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 拼盘式叠加</text>
  <text x="350" y="213" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">每个局部&quot;到位&quot;，整体却失协、显假</text>

  <text x="320" y="248" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">高级感来自&quot;整体大于局部之和&quot;——五官之间有和谐的节奏感</text>
</svg>