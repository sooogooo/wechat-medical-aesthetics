<svg xmlns="http://www.w3.org/2000/svg" aria-label="骨相美与皮相美的对比" role="img" viewBox="0 0 640 340"><rect width="640" height="340" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">骨相美 vs 皮相美</text><rect width="280" height="250" x="30" y="60" fill="#fff" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><rect width="280" height="40" x="30" y="60" fill="#7a8b6f" rx="8"/><rect width="280" height="10" x="30" y="90" fill="#7a8b6f"/><text x="170" y="86" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">骨相美</text><text x="50" y="125" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">核心：骨骼结构</text><text x="50" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 颧骨、下颌、眉骨立体</text><text x="50" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 面部支撑力强</text><text x="50" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 轮廓线条清晰</text><text x="50" y="225" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">气质印象：</text><text x="50" y="245" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">大气、耐老、有气场</text><text x="50" y="275" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">&quot;美人在骨不在皮&quot;</text><rect width="280" height="250" x="330" y="60" fill="#fff" stroke="#c9a876" stroke-width="1.5" rx="8"/><rect width="280" height="40" x="330" y="60" fill="#c9a876" rx="8"/><rect width="280" height="10" x="330" y="90" fill="#c9a876"/><text x="470" y="86" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">皮相美</text><text x="350" y="125" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">核心：皮肤与五官</text><text x="350" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 皮肤白皙细腻</text><text x="350" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 五官柔和精致</text><text x="350" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 色泽红润通透</text><text x="350" y="225" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">气质印象：</text><text x="350" y="245" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11">惊艳、动人、柔和</text><text x="350" y="275" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">&quot;一白遮百丑&quot;</text><text x="320" y="330" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">两套审美逻辑，对应不同的美——本没有高下</text></svg>