<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="情感诉求到codes方案的翻译">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">从&quot;想要什么感觉&quot;到&quot;打哪些 code&quot;</text>

  <!-- 三栏 -->
  <text x="107" y="62" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#6b6864">情感诉求</text>
  <text x="320" y="62" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#6b6864">对应特征</text>
  <text x="533" y="62" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#6b6864">可能涉及的 codes</text>

  <rect x="30" y="75" width="155" height="40" rx="4" fill="#ffffff" stroke="#ddd6ca"/>
  <text x="107" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">&quot;想不显累&quot;</text>
  <rect x="245" y="75" width="150" height="40" rx="4" fill="#ffffff" stroke="#ddd6ca"/>
  <text x="320" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">泪沟、眼周凹陷</text>
  <rect x="455" y="75" width="155" height="40" rx="4" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="533" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">E1、Ck1（举例）</text>

  <rect x="30" y="120" width="155" height="40" rx="4" fill="#ffffff" stroke="#ddd6ca"/>
  <text x="107" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">&quot;想不显凶&quot;</text>
  <rect x="245" y="120" width="150" height="40" rx="4" fill="#ffffff" stroke="#ddd6ca"/>
  <text x="320" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">眉间纹、颞部凹</text>
  <rect x="455" y="120" width="155" height="40" rx="4" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="533" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">T、眉间 + 肉毒</text>

  <rect x="30" y="165" width="155" height="40" rx="4" fill="#ffffff" stroke="#ddd6ca"/>
  <text x="107" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">&quot;想不显老&quot;</text>
  <rect x="245" y="165" width="150" height="40" rx="4" fill="#ffffff" stroke="#ddd6ca"/>
  <text x="320" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">容积流失、下垂</text>
  <rect x="455" y="165" width="155" height="40" rx="4" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="533" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">Ck、Jw 综合</text>

  <text x="320" y="240" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">情感属性让注射目标更贴近你的真实诉求，而非&quot;医生看着办&quot;</text>
  <text x="320" y="260" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">图为示意；实际方案需医生面诊评估，常涉及多个 codes 组合</text>
</svg>