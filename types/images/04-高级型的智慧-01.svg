<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="惊艳与耐看的对比">
  <rect width="640" height="300" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">惊艳 vs 耐看：两种美的时效</text>

  <!-- 惊艳曲线 -->
  <text x="120" y="70" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">庸俗型追求：惊艳</text>
  <line x1="50" y1="220" x2="290" y2="220" stroke="#a8a39d" stroke-width="1.5"/>
  <line x1="50" y1="90" x2="50" y2="220" stroke="#a8a39d" stroke-width="1.5"/>
  <text x="35" y="155" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864" transform="rotate(-90 35 155)">美感强度</text>
  <path d="M 50 215 Q 80 100 140 105 Q 200 115 260 180 Q 285 210 290 215" stroke="#b5654a" stroke-width="2.5" fill="none"/>
  <circle cx="140" cy="105" r="4" fill="#b5654a"/>
  <text x="140" y="92" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#b5654a">立刻惊艳</text>
  <text x="270" y="240" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">时间 → 衰减快</text>

  <!-- 耐看曲线 -->
  <text x="490" y="70" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">高级型追求：耐看</text>
  <line x1="370" y1="220" x2="610" y2="220" stroke="#a8a39d" stroke-width="1.5"/>
  <line x1="370" y1="90" x2="370" y2="220" stroke="#a8a39d" stroke-width="1.5"/>
  <text x="355" y="155" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864" transform="rotate(-90 355 155)">美感强度</text>
  <path d="M 370 215 Q 410 150 470 130 Q 530 128 590 138" stroke="#7a8b6f" stroke-width="2.5" fill="none"/>
  <circle cx="470" cy="130" r="4" fill="#7a8b6f"/>
  <text x="470" y="117" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">渐入佳境</text>
  <text x="590" y="240" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">时间 → 稳定持久</text>

  <text x="320" y="280" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">惊艳曲线：高开低走，随时间衰减；耐看曲线：渐升稳定，经得起打量</text>
</svg>