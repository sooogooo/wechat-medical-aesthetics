<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t35 d35" role="img" viewBox="0 0 800 500"><title id="t35">产后几个月一把把掉发</title><desc id="d35">用时间轴代替每天数头发</desc><defs><linearGradient id="bg35" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh35" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT,.nodeT2{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.nodeT2{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg35)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh35)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 35</text><text x="48" y="92" class="title">产后几个月一把把掉发</text><text x="48" y="116" class="kicker">用时间轴代替每天数头发</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">产后脱发时间轴</text><rect width="165" height="120" x="48" y="200" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="48" y="200" fill="#C9A876" rx="12"/><rect width="165" height="10" x="48" y="218" fill="#C9A876"/><text x="130.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">孕期</text><text x="130.5" y="250" class="body" text-anchor="middle">雌激素高</text><text x="130.5" y="268" class="small" text-anchor="middle">毛发停留生长期</text><path fill="none" stroke="#2B2A28" stroke-width="1.8" d="M 213 260 L 235 260"/><path fill="#2B2A28" d="M 235 260 l -8 -3 l 2 6 z"/><rect width="165" height="120" x="237" y="200" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="237" y="200" fill="#B5654A" rx="12"/><rect width="165" height="10" x="237" y="218" fill="#B5654A"/><text x="319.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">产后 2 4 月</text><text x="319.5" y="250" class="body" text-anchor="middle">雌激素回落</text><text x="319.5" y="268" class="small" text-anchor="middle">大量进入休止期</text><path fill="none" stroke="#2B2A28" stroke-width="1.8" d="M 402 260 L 424 260"/><path fill="#2B2A28" d="M 424 260 l -8 -3 l 2 6 z"/><rect width="165" height="120" x="426" y="200" fill="#fbfdfc" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="426" y="200" fill="#7A8B6F" rx="12"/><rect width="165" height="10" x="426" y="218" fill="#7A8B6F"/><text x="508.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">产后 6 12 月</text><text x="508.5" y="250" class="body" text-anchor="middle">逐渐恢复</text><text x="508.5" y="268" class="small" text-anchor="middle">新发慢慢长出</text><rect width="135" height="120" x="609" y="200" fill="#fbfdfc" stroke="#5F6E54" stroke-width="1.6" rx="12"/><rect width="135" height="28" x="609" y="200" fill="#5F6E54" rx="12"/><rect width="135" height="10" x="609" y="218" fill="#5F6E54"/><text x="676.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">超 12 月</text><text x="676.5" y="250" class="body" text-anchor="middle">仍加重</text><text x="676.5" y="268" class="small" text-anchor="middle">需排查其他</text><rect width="9" height="9" x="60" y="348" fill="#7A8B6F" rx="2"/><text x="78" y="357" class="body">洗头不会让本来能留下的头发掉光</text><rect width="704" height="40" x="48" y="370" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="395" class="quote" text-anchor="middle">多数产后脱发会逐渐回来，先别急着植发</text><text x="48" y="462" class="footer">医学教育示意 · 典型表现是弥漫掉，不是局部秃</text></svg>