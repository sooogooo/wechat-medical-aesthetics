  <rect x="70" y="168" width="40" height="252" rx="10" fill="#2B2A28"/>
  <circle cx="90" cy="204" r="12" fill="#B5654A"/>
  <circle cx="90" cy="294" r="12" fill="#C9A876"/>
  <circle cx="90" cy="384" r="12" fill="#7A8B6F"/>

