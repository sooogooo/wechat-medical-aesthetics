<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="技术型越界的表现">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">技术型越界：当精准变成冷漠</text>

  <rect x="30" y="60" width="580" height="50" rx="6" fill="#f7ece6" stroke="#b5654a"/>
  <text x="320" y="82" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">表现一：标准但失协</text>
  <text x="320" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">每个参数都&quot;达标&quot;，整体却不协调——拼盘式标准脸</text>

  <rect x="30" y="120" width="580" height="50" rx="6" fill="#f7ece6" stroke="#b5654a"/>
  <text x="320" y="142" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">表现二：精准但显假</text>
  <text x="320" y="160" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">对称度极高、比例精确，却失去自然感和辨识度——塑料感</text>

  <rect x="30" y="180" width="580" height="40" rx="6" fill="#f4ede0" stroke="#c9a876"/>
  <text x="320" y="205" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">本质：用数据取代审美，用标准取代个体——精准的外衣下是庸俗</text>
</svg>