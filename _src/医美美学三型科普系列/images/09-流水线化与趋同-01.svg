<svg xmlns="http://www.w3.org/2000/svg" aria-label="庸俗型医美的流水线" role="img" viewBox="0 0 720 300"><rect width="720" height="300" fill="#faf8f4" rx="12"/><text x="360" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">庸俗型医美的&quot;流水线&quot;</text><rect width="120" height="100" x="30" y="100" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="90" y="128" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">进店</text><text x="90" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">咨询师接待</text><text x="90" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;评估&quot;诉求</text><polygon fill="#b5654a" points="160 150 175 140 175 160"/><rect width="120" height="100" x="180" y="100" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="240" y="128" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">推销套餐</text><text x="240" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;全套解决方案&quot;</text><text x="240" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不顾个体差异</text><polygon fill="#b5654a" points="310 150 325 140 325 160"/><rect width="120" height="100" x="330" y="100" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="390" y="128" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">套模板</text><text x="390" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;网红同款&quot;</text><text x="390" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;明星款&quot;</text><polygon fill="#b5654a" points="460 150 475 140 475 160"/><rect width="120" height="100" x="480" y="100" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="540" y="128" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">医生执行</text><text x="540" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">快速操作</text><text x="540" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">批量节奏</text><polygon fill="#b5654a" points="610 150 625 140 625 160"/><rect width="60" height="100" x="630" y="100" fill="#b5654a" rx="8"/><text x="660" y="145" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">标准</text><text x="660" y="163" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">品脸</text><text x="360" y="240" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">每个节点都在消除个体差异——最终产出趋同的&quot;标准品&quot;</text><text x="360" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">流水线的特征：高效、可复制、利润高——但代价是个体性的丧失</text></svg>