<svg xmlns="http://www.w3.org/2000/svg" aria-label="抗老美学的代价" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">&quot;必须显年轻&quot;带来的几重代价</text><rect width="185" height="190" x="30" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="122" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">焦虑永续</text><text x="45" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">衰老不可逆</text><text x="45" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">抗老成了无终点</text><text x="45" y="158" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">的追逐</text><text x="45" y="195" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">永远&quot;还不够年轻&quot;</text><rect width="185" height="190" x="227" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="320" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">年龄歧视</text><text x="242" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">&quot;显老&quot;成贬义</text><text x="242" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">中老年被污名</text><text x="242" y="158" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">成熟之美被否定</text><text x="242" y="195" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">每个人都会老</text><rect width="185" height="190" x="424" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="516" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">过度消费</text><text x="439" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">为&quot;抗老&quot;反复</text><text x="439" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">投入大量金钱</text><text x="439" y="158" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">和时间</text><text x="439" y="195" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">可能过度治疗</text><text x="320" y="265" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">反对&quot;年轻至上&quot;，不是反对延缓衰老，而是反对它成为唯一的审美方向</text></svg>