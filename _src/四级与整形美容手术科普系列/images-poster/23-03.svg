<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2303 desc2303" role="img" viewBox="0 0 900 620"><title id="title2303">眼睑成形术：功能性与美容性</title><desc id="desc2303">上睑松垂严重遮挡视线具有功能意义，眼周是面部最精细区域，「便宜」「快」不应是首要标准</desc><defs><linearGradient id="bg2303" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2303" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff;letter-spacing:1px}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2303)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2303)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 23</text><text x="62" y="117" class="title">眼睑成形术：不只是「美容」</text><text x="62" y="153" class="kicker">上睑松垂遮挡视线时，手术具有功能意义</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">两种意义并存</text><rect width="386" height="265" x="62" y="240" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="16"/><rect width="386" height="44" x="62" y="240" fill="#0072B2" rx="16"/><rect width="386" height="14" x="62" y="270" fill="#0072B2"/><text x="255" y="269" class="tag" text-anchor="middle">功能性手术</text><text x="82" y="312" class="body">上睑松垂严重遮挡视线</text><text x="82" y="339" class="body">影响驾驶、阅读等日常</text><text x="82" y="366" class="body">提肌无力（睁眼费力）</text><text x="82" y="393" class="body">改善视力与生活质量</text><rect width="346" height="55" x="82" y="430" fill="#eef6f8" rx="8"/><text x="255" y="453" class="small" text-anchor="middle">部分情况可能纳入医保或商业保险</text><text x="255" y="472" class="small" text-anchor="middle">具体以属地政策和保险条款为准，需另行核验</text><rect width="370" height="265" x="468" y="240" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="16"/><rect width="370" height="44" x="468" y="240" fill="#E69F00" rx="16"/><rect width="370" height="14" x="468" y="270" fill="#E69F00"/><text x="653" y="269" class="tag" text-anchor="middle">美容性手术</text><text x="488" y="312" class="body">重睑成形（双眼皮）</text><text x="488" y="339" class="body">眼袋去除改善外观</text><text x="488" y="366" class="body">调整重睑形态</text><text x="488" y="393" class="body">改善疲态、年轻化</text><rect width="330" height="55" x="488" y="430" fill="#fdf3e3" rx="8"/><text x="653" y="453" class="small" text-anchor="middle">仍需面对下睑外翻、干眼、不对称</text><text x="653" y="472" class="small" text-anchor="middle">球后出血等风险</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">眼周是面部最精细的区域——「便宜」「快」不应是首要标准</text><text x="62" y="582" class="footer">医学教育示意 · 医保覆盖以属地政策为准，须另行核验</text></svg>