  <rect x="46" y="40" width="96" height="30" rx="15" fill="#c9a876"/><text x="94" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="2">翻 译 器</text><rect x="170" y="40" width="200" height="30" rx="15" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="270" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">总包 / 期权</text><text x="392" y="61" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#c9a876" font-weight="700" text-anchor="middle">⟶</text><rect x="412" y="40" width="200" height="30" rx="15" fill="#f4ede0" stroke="#c9a876" stroke-width="1.4"/><text x="512" y="60" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#c9a876" font-weight="600" text-anchor="middle">底薪 / 提成</text><rect x="46" y="104" width="708" height="84" rx="8" fill="#f5f7f0" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="104" width="6" height="84" rx="3" fill="#7a8b6f"/><text x="74" y="138" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#7a8b6f" font-weight="600">直译 · 成立处</text><text x="74" y="166" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">都是固定加浮动的薪酬结构，方向可对译</text><rect x="46" y="204" width="708" height="84" rx="8" fill="#faf3f0" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="204" width="6" height="84" rx="3" fill="#b5654a"/><text x="74" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#b5654a" font-weight="600">失真处</text><text x="74" y="266" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">期权赌未来有兑现场景，提成赌当期且基数怎么算是利益问题</text><rect x="46" y="304" width="708" height="84" rx="8" fill="#ffffff" stroke="#e4ddd2" stroke-width="1.4"/><rect x="46" y="304" width="6" height="84" rx="3" fill="#2b2a28"/><text x="74" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28" font-weight="600">大厂人的典型错误</text><text x="74" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#2b2a28">只谈底薪，不好意思细问提成与考核口径</text>
  <text x="46" y="394" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">类比在哪里成立、在哪里失效，看见边界再动手</text>
