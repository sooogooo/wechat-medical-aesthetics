<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="肉毒不能解决的问题">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">肉毒解决不了这些问题</text>

  <rect x="30" y="55" width="180" height="140" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="120" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">静态纹</text>
  <text x="120" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">不动时就在的纹</text>
  <text x="120" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">需要填充或光电</text>

  <rect x="230" y="55" width="180" height="140" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="320" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">容积流失</text>
  <text x="320" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">凹陷、干瘪</text>
  <text x="320" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">需要填充</text>

  <rect x="430" y="55" width="180" height="140" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="520" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">皮肤松弛</text>
  <text x="520" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">组织下垂</text>
  <text x="520" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">需要提升类项目</text>

  <text x="320" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">理解肉毒的作用边界，才能避免“打完没效果”的失望</text>
</svg>