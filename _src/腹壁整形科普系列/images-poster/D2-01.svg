<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="titleD201 descD201" role="img" viewBox="0 0 900 620"><title id="titleD201">面诊必问的 12 个问题</title><desc id="descD201">面诊腹壁成形术的 12 个必问问题，按主题分组着色</desc><defs><marker id="ahD201" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#b7c6cb" d="M0,0 L10,5 L0,10 z"/></marker><style>.series{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.8px;fill:#7d97a4}.title{font:300 32px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.kicker{font:400 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.body{font:400 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#4a5a60}.small{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.quote{font:400 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.footer{font:400 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#93a3a8}</style></defs><rect width="899" height="619" x=".5" y=".5" fill="#fff" stroke="#dde5e7" stroke-width="1"/><text x="62" y="64" class="series">腹壁整形 12 讲 · D2</text><text x="62" y="112" class="title">面诊必问的 12 个问题</text><text x="62" y="148" class="kicker">按颜色分组，术式、联合与预期、风险与资质、费用</text><line x1="62" x2="838" y1="172" y2="172" stroke="#e3e9ea" stroke-width="1"/><circle cx="67" cy="204" r="5" fill="none" stroke="#0072B2" stroke-width="1.2"/><text x="80" y="209" class="small">问题与术式</text><circle cx="267" cy="204" r="5" fill="none" stroke="#D9930D" stroke-width="1.2"/><text x="280" y="209" class="small">联合与预期</text><circle cx="467" cy="204" r="5" fill="none" stroke="#C75B00" stroke-width="1.2"/><text x="480" y="209" class="small">风险与资质</text><circle cx="667" cy="204" r="5" fill="none" stroke="#0B8A6B" stroke-width="1.2"/><text x="680" y="209" class="small">费用</text><rect width="250" height="52" x="62" y="238" fill="none" stroke="#0072B2" stroke-width="1.2" rx="9"/><circle cx="92" cy="264" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/><text x="92" y="269" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#0072b2">1</text><text x="118" y="269" class="body">我的问题属于哪类</text><rect width="250" height="52" x="324" y="238" fill="none" stroke="#0072B2" stroke-width="1.2" rx="9"/><circle cx="354" cy="264" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/><text x="354" y="269" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#0072b2">2</text><text x="380" y="269" class="body">建议哪种术式、为何</text><rect width="250" height="52" x="586" y="238" fill="none" stroke="#0072B2" stroke-width="1.2" rx="9"/><circle cx="616" cy="264" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/><text x="616" y="269" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#0072b2">3</text><text x="642" y="269" class="body">切口从哪到哪</text><rect width="250" height="52" x="62" y="300" fill="none" stroke="#0072B2" stroke-width="1.2" rx="9"/><circle cx="92" cy="326" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/><text x="92" y="331" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#0072b2">4</text><text x="118" y="331" class="body">肌分离是否收紧</text><rect width="250" height="52" x="324" y="300" fill="none" stroke="#D9930D" stroke-width="1.2" rx="9"/><circle cx="354" cy="326" r="13" fill="none" stroke="#D9930D" stroke-width="1.2"/><text x="354" y="331" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#d9930d">5</text><text x="380" y="331" class="body">要不要联合吸脂</text><rect width="250" height="52" x="586" y="300" fill="none" stroke="#D9930D" stroke-width="1.2" rx="9"/><circle cx="616" cy="326" r="13" fill="none" stroke="#D9930D" stroke-width="1.2"/><text x="616" y="331" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#d9930d">6</text><text x="642" y="331" class="body">手术时长与住院</text><rect width="250" height="52" x="62" y="362" fill="none" stroke="#D9930D" stroke-width="1.2" rx="9"/><circle cx="92" cy="388" r="13" fill="none" stroke="#D9930D" stroke-width="1.2"/><text x="92" y="393" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#d9930d">7</text><text x="118" y="393" class="body">效果边界与定型</text><rect width="250" height="52" x="324" y="362" fill="none" stroke="#C75B00" stroke-width="1.2" rx="9"/><circle cx="354" cy="388" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/><text x="354" y="393" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#c75b00">8</text><text x="380" y="393" class="body">麻醉、血库、通道</text><rect width="250" height="52" x="586" y="362" fill="none" stroke="#C75B00" stroke-width="1.2" rx="9"/><circle cx="616" cy="388" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/><text x="616" y="393" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#c75b00">9</text><text x="642" y="393" class="body">血栓预防方案</text><rect width="250" height="52" x="62" y="424" fill="none" stroke="#C75B00" stroke-width="1.2" rx="9"/><circle cx="92" cy="450" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/><text x="92" y="455" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#c75b00">10</text><text x="118" y="455" class="body">我的个人风险</text><rect width="250" height="52" x="324" y="424" fill="none" stroke="#C75B00" stroke-width="1.2" rx="9"/><circle cx="354" cy="450" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/><text x="354" y="455" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#c75b00">11</text><text x="380" y="455" class="body">主刀资质与经验</text><rect width="250" height="52" x="586" y="424" fill="none" stroke="#0B8A6B" stroke-width="1.2" rx="9"/><circle cx="616" cy="450" r="13" fill="none" stroke="#0B8A6B" stroke-width="1.2"/><text x="616" y="455" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle" style="fill:#0b8a6b">12</text><text x="642" y="455" class="body">总费用包含什么</text><line x1="62" x2="838" y1="520" y2="520" stroke="#e3e9ea" stroke-width="1"/><text x="450" y="548" class="quote" text-anchor="middle">被回避的问题，往往就是风险所在</text><text x="62" y="580" class="footer">医学教育示意 · 资质请通过卫健委官方渠道核验</text></svg>