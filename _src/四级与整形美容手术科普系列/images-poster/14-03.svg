<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1403 desc1403" role="img" viewBox="0 0 900 620"><title id="title1403">乳房缩小术的疤痕现实</title><desc id="desc1403">缩乳术必然留疤，且疤痕长、部位明显，与隆乳不同，接受度是决策核心</desc><defs><linearGradient id="bg1403" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1403" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg1403)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1403)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 14</text><text x="62" y="117" class="title">缩乳必然留疤，且比隆乳更明显</text><text x="62" y="153" class="kicker">对疤痕的接受度，是决策能否进行的核心前提</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">疤痕的现实对比</text><rect width="380" height="130" x="62" y="230" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="380" height="38" x="62" y="230" fill="#E69F00" rx="14"/><rect width="380" height="13" x="62" y="255" fill="#E69F00"/><text x="252" y="255" class="nodeTitle" text-anchor="middle" style="fill:#fff">乳房缩小术</text><text x="82" y="293" class="body">倒 T 型（锚状）或垂直（棒棒糖型）</text><text x="82" y="318" class="body">疤痕长 · 位于明显部位</text><text x="82" y="343" class="small">可能增生、变宽 · 切除量越大切口越长</text><rect width="380" height="130" x="458" y="230" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="380" height="38" x="458" y="230" fill="#0072B2" rx="14"/><rect width="380" height="13" x="458" y="255" fill="#0072B2"/><text x="648" y="255" class="nodeTitle" text-anchor="middle" style="fill:#fff">隆乳术（对比）</text><text x="478" y="293" class="body">乳晕 · 下皱襞 · 腋窝切口</text><text x="478" y="318" class="body">疤痕相对隐蔽</text><text x="478" y="343" class="small">这是两者最大的不同之一</text><rect width="776" height="130" x="62" y="380" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><text x="82" y="408" class="nodeTitle" style="fill:#d55e00">不诚实的宣传</text><text x="82" y="436" class="body">· 宣传缩乳不留疤、无痕缩乳</text><text x="82" y="461" class="body">· 承诺疤痕完全看不见</text><text x="82" y="486" class="body">· 回避疤痕增生和变宽的可能</text><text x="82" y="503" class="small">这些都属于不诚实宣传，应当警惕</text><rect width="776" height="40" x="62" y="525" fill="#fdf1ee" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">把疤痕接受度想清楚，能筛掉大量事后失望</text><text x="62" y="582" class="footer">医学教育示意 · 疤痕形态因人体质与术后护理而异</text></svg>