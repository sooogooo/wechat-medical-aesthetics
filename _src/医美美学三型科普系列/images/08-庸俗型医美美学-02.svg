<svg xmlns="http://www.w3.org/2000/svg" aria-label="显俗的本质" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">&quot;俗&quot;的本质：刻意感 + 失协感</text><rect width="580" height="55" x="30" y="60" fill="#f7ece6" stroke="#b5654a" rx="6"/><text x="320" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">刻意感</text><text x="320" y="103" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">观者一眼感到&quot;这是做出来的&quot;——失去自然生长的感觉</text><rect width="580" height="55" x="30" y="125" fill="#f7ece6" stroke="#b5654a" rx="6"/><text x="320" y="150" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">失协感</text><text x="320" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">五官之间没有和谐节奏，像零件拼凑，缺乏整体感</text><rect width="580" height="35" x="30" y="190" fill="#f4ede0" stroke="#c9a876" rx="6"/><text x="320" y="213" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">本质：审美判断缺席，只剩&quot;达标&quot;和&quot;流行&quot;——这是思路问题，不是钱的问题</text></svg>