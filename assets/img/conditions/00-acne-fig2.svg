<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t00f2 d00f2" role="img" viewBox="0 0 800 500"><title id="t00f2">痤疮居家护理四件事与就医红线</title><desc id="d00f2">温和清洁、控炎防晒、薄涂药物、减少摩擦，配合需就医的危险信号</desc><defs><linearGradient id="bg00f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh00f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg00f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh00f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 00</text><text x="56" y="90" class="title">居家护理四件事与就医红线</text><text x="56" y="116" class="kicker">把力气用在真正能改善炎症的方向</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">日常坚持</text><rect width="340" height="56" x="56" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="84" cy="200" r="16" fill="#7A8B6F"/><text x="84" y="205" fill="#fff" class="lvl" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="112" y="196" class="body" font-weight="700">温和清洁</text><text x="112" y="216" class="small">早晚一次 出汗后及时冲洗 不洗到发涩</text><rect width="340" height="56" x="56" y="238" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="84" cy="266" r="16" fill="#7A8B6F"/><text x="84" y="271" fill="#fff" class="lvl" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="112" y="262" class="body" font-weight="700">保湿与防晒</text><text x="112" y="282" class="small">选标注不易致粉刺的产品 全年广谱防晒</text><rect width="340" height="56" x="56" y="304" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="84" cy="332" r="16" fill="#7A8B6F"/><text x="84" y="337" fill="#fff" class="lvl" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="112" y="328" class="body" font-weight="700">药物薄涂易发区</text><text x="112" y="348" class="small">整片涂抹预防新痘 而不是只点成熟大痘</text><rect width="340" height="56" x="56" y="370" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="84" cy="398" r="16" fill="#7A8B6F"/><text x="84" y="403" fill="#fff" class="lvl" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="112" y="394" class="body" font-weight="700">减少挤压摩擦</text><text x="112" y="414" class="small">不抠不磨砂 枕套手机定期清洁即可</text><text x="416" y="158" class="nodeTitle">出现以下情况尽早就医</text><rect width="328" height="254" x="416" y="172" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="10"/><text x="432" y="200" class="body">疼痛性结节或囊肿</text><text x="432" y="226" class="body">迅速留坑 胸背大面积发炎</text><text x="432" y="252" class="body">突然爆发且伴发热</text><text x="432" y="278" class="body">明显影响社交与情绪</text><text x="432" y="304" class="body">用药后头痛 视力变化</text><text x="432" y="330" class="body">情绪异常 呼吸困难</text><text x="432" y="356" class="body">眼唇肿胀 渗液</text><text x="432" y="400" fill="#8a3f2b" class="small">上述任一信号出现 请停下自行加药</text><rect width="688" height="34" x="56" y="438" fill="#f0f5ef" rx="10"/><text x="400" y="460" class="quote" text-anchor="middle">用三个月评价方案，而不是三天</text><text x="56" y="478" class="footer">医学教育示意 · 具体用药与监测需遵医嘱</text></svg>