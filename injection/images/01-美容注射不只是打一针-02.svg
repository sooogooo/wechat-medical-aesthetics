<svg xmlns="http://www.w3.org/2000/svg" aria-label="面部皮肤层次与注射深度示意" role="img" viewBox="0 0 600 380"><rect width="600" height="380" fill="#faf8f4" rx="12"/><text x="300" y="32" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">注射作用在哪个深度</text><rect width="240" height="38" x="60" y="70" fill="#f4ede0" stroke="#ddd6ca" rx="4"/><text x="80" y="94" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="13">表皮（约 0.1 毫米）</text><rect width="240" height="58" x="60" y="112" fill="#eef0ea" stroke="#ddd6ca" rx="4"/><text x="80" y="136" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="13">真皮浅层</text><text x="80" y="156" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">胶原、血管、神经末梢</text><rect width="240" height="58" x="60" y="174" fill="#dde4d6" stroke="#ddd6ca" rx="4"/><text x="80" y="198" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="13">真皮深层</text><text x="80" y="218" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">透明质酸、再生材料常用层次</text><rect width="240" height="58" x="60" y="236" fill="#c9d4be" stroke="#ddd6ca" rx="4"/><text x="80" y="260" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="13">皮下脂肪层</text><text x="80" y="280" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">容积填充、骨膜上支撑</text><rect width="240" height="40" x="60" y="298" fill="#a8b6a0" stroke="#ddd6ca" rx="4"/><text x="80" y="323" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13">肌肉层 / 骨膜</text><line x1="400" x2="400" y1="60" y2="340" stroke="#a8a39d" stroke-dasharray="3 3" stroke-width="1"/><circle cx="400" cy="200" r="7" fill="#7a8b6f"/><line x1="407" x2="450" y1="200" y2="180" stroke="#7a8b6f" stroke-width="1.5"/><text x="455" y="176" fill="#7a8b6f" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">填充类</text><text x="455" y="192" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">真皮深层 / 皮下</text><circle cx="400" cy="315" r="7" fill="#c9a876"/><line x1="407" x2="450" y1="315" y2="300" stroke="#c9a876" stroke-width="1.5"/><text x="455" y="296" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">肉毒类</text><text x="455" y="312" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">肌肉层</text><circle cx="400" cy="245" r="7" fill="#8a9a7f"/><line x1="407" x2="450" y1="245" y2="265" stroke="#8a9a7f" stroke-width="1.5"/><text x="455" y="262" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">再生类</text><text x="455" y="278" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">真皮深层 / 皮下</text><path fill="none" stroke="#b5654a" stroke-width="2.5" d="M 350 150 Q 365 160 350 172"/><text x="335" y="145" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="end">血管走行</text><text x="300" y="368" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">层次与深度因部位、材料而异；血管走行个体差异大，是栓塞风险的核心</text></svg>