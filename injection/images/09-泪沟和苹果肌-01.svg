<svg xmlns="http://www.w3.org/2000/svg" aria-label="眼下方凹陷的不同原因" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">眼下方凹陷，可能是这几种</text><rect width="140" height="180" x="30" y="55" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="100" cy="110" fill="#f3efe8" rx="32" ry="40"/><path fill="none" stroke="#7a8b6f" stroke-width="2" d="M 75 110 Q 100 130 125 110"/><text x="100" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">真性泪沟</text><text x="100" y="200" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">韧带牵拉形成的凹陷</text><text x="100" y="216" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">填充有效</text><rect width="140" height="180" x="180" y="55" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="250" cy="110" fill="#f3efe8" rx="32" ry="40"/><path fill="none" stroke="#c9a876" stroke-width="2" d="M 225 100 Q 250 95 275 100"/><ellipse cx="250" cy="125" fill="#eef0ea" rx="20" ry="10"/><text x="250" y="180" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">眼袋 + 泪沟</text><text x="250" y="200" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">眶隔脂肪突出</text><text x="250" y="216" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">单纯填充可能更糟</text><rect width="140" height="180" x="330" y="55" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="400" cy="110" fill="#f3efe8" rx="32" ry="40"/><path fill="none" stroke="#8a9a7f" stroke-width="2" d="M 375 130 L 395 120 L 425 130"/><text x="400" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">印第安纹</text><text x="400" y="200" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">颧颊沟韧带</text><text x="400" y="216" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">处理难度高</text><rect width="130" height="180" x="480" y="55" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="545" cy="115" fill="#f3efe8" rx="30" ry="38"/><ellipse cx="545" cy="135" fill="#eef0ea" rx="22" ry="15"/><text x="545" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">苹果肌下垂</text><text x="545" y="200" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">容积流失 + 下移</text><text x="545" y="216" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需中面部提升</text><text x="320" y="260" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">图为示意；准确判断需医生面诊触诊，有时需动态评估</text></svg>