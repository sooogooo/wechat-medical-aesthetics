<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t38f2 d38f2" role="img" viewBox="0 0 800 500"><title id="t38f2">口周皮炎的护理与就医清单</title><desc id="d38f2">停用可疑激素霜、精简护肤、就医规范用药的护理清单</desc><defs><linearGradient id="bg38f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh38f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg38f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh38f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 38</text><text x="52" y="92" class="title">护理与就医清单</text><text x="52" y="116" class="kicker">先停可疑产品，再精简护肤，顽固或反复须就医</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="220" height="36" x="52" y="150" fill="#B5654A" rx="8"/><text x="162" y="173" class="nodeTitle" text-anchor="middle">先停这些</text><rect width="220" height="220" x="52" y="190" fill="#fbf0eb" stroke="#B5654A" rx="10"/><circle cx="68" cy="220" r="3" fill="#B5654A"/><text x="80" y="224" class="body">非处方&quot;特效&quot;霜</text><circle cx="68" cy="252" r="3" fill="#B5654A"/><text x="80" y="256" class="body">含激素的复方制剂</text><circle cx="68" cy="284" r="3" fill="#B5654A"/><text x="80" y="288" class="body">来源不明的&quot;中药膏&quot;</text><circle cx="68" cy="316" r="3" fill="#B5654A"/><text x="80" y="320" class="body">厚重遮瑕、粉底</text><circle cx="68" cy="348" r="3" fill="#B5654A"/><text x="80" y="352" class="body">含氟牙膏（部分人）</text><circle cx="68" cy="380" r="3" fill="#B5654A"/><text x="80" y="384" class="body">面部强效清洁</text><rect width="220" height="36" x="290" y="150" fill="#7A8B6F" rx="8"/><text x="400" y="173" class="nodeTitle" text-anchor="middle">精简护肤</text><rect width="220" height="220" x="290" y="190" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="306" cy="220" r="3" fill="#5F6E54"/><text x="318" y="224" class="body">温水洁面，少摩擦</text><circle cx="306" cy="252" r="3" fill="#5F6E54"/><text x="318" y="256" class="body">无香精保湿乳</text><circle cx="306" cy="284" r="3" fill="#5F6E54"/><text x="318" y="288" class="body">暂停所有功效型产品</text><circle cx="306" cy="316" r="3" fill="#5F6E54"/><text x="318" y="320" class="body">物理防晒，避免刺激</text><circle cx="306" cy="348" r="3" fill="#5F6E54"/><text x="318" y="352" class="body">不舔唇不揉搓</text><circle cx="306" cy="380" r="3" fill="#5F6E54"/><text x="318" y="384" class="body">记录可疑诱因</text><rect width="220" height="36" x="528" y="150" fill="#C9A876" rx="8"/><text x="638" y="173" class="nodeTitle" text-anchor="middle">及时就医</text><rect width="220" height="220" x="528" y="190" fill="#fbf5ea" stroke="#C9A876" rx="10"/><circle cx="544" cy="220" r="3" fill="#C9A876"/><text x="556" y="224" class="body">反复超过两周</text><circle cx="544" cy="252" r="3" fill="#C9A876"/><text x="556" y="256" class="body">范围持续扩大</text><circle cx="544" cy="284" r="3" fill="#C9A876"/><text x="556" y="288" class="body">明显灼痛刺痒</text><circle cx="544" cy="316" r="3" fill="#C9A876"/><text x="556" y="320" class="body">眼周出现红疹</text><circle cx="544" cy="348" r="3" fill="#C9A876"/><text x="556" y="352" class="body">停激素后加重</text><circle cx="544" cy="380" r="3" fill="#C9A876"/><text x="556" y="384" class="body">儿童与孕妇需面诊</text><rect width="696" height="32" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="453" class="quote" text-anchor="middle">停掉可疑产品，是治疗的第一步</text><text x="52" y="466" class="footer">健康科普示意 · 用药方案需由皮肤科医师面诊后制定</text></svg>