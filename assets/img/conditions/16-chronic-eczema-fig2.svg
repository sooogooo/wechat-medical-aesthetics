<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t16f2 d16f2">
  <title id="t16f2">湿疹外用药灭火维持逻辑</title>
  <desc id="d16f2">复发地图与升级就医界线，保湿是每天的底盘</desc>
  <defs>
    <linearGradient id="bg16f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh16f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg16f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh16f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 16</text>
  <text x="56" y="90" class="title">外用药灭火与维持两阶段</text>
  <text x="56" y="116" class="kicker">保湿不是辅助，而是每天的底盘</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">用药逻辑两阶段</text>

  <rect x="56" y="174" width="335" height="120" rx="12" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="28" rx="12" fill="#B5654A"/><rect x="56" y="192" width="335" height="10" fill="#B5654A"/>
  <text x="72" y="193" class="tag">灭火期 急性发作</text>
  <text x="72" y="224" class="body">按医嘱足量使用抗炎药</text>
  <text x="72" y="250" class="body">快速控制炎症和瘙痒</text>
  <text x="72" y="276" class="small">不要见好就停也不要长期单独用</text>

  <rect x="409" y="174" width="335" height="120" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="28" rx="12" fill="#7A8B6F"/><rect x="409" y="192" width="335" height="10" fill="#7A8B6F"/>
  <text x="425" y="193" class="tag">维持期 平稳期</text>
  <text x="425" y="224" class="body">逐步减频或换方案</text>
  <text x="425" y="250" class="body">坚持保湿修复屏障</text>
  <text x="425" y="276" class="small">主动维持比复发再治更重要</text>

  <!-- 升级就医界线 -->
  <text x="56" y="324" class="nodeTitle">设一条升级就医的界线</text>
  <rect x="56" y="338" width="688" height="74" rx="10" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4"/>
  <text x="76" y="362" class="body">出现以下情况及时复诊</text>
  <text x="76" y="384" class="small">大面积渗液结痂 明显感染 持续不愈 影响睡眠</text>
  <text x="76" y="402" class="small">常规方案两周无效或反复加重，需调整诊断或治疗</text>

  <rect x="56" y="422" width="688" height="36" rx="10" fill="#eef4ee"/>
  <text x="400" y="445" class="quote" text-anchor="middle">画一张自己的复发地图，找出真正的诱因</text>
  <text x="56" y="472" class="footer">医学教育示意 · 接触过敏需排查 顽固者可考虑斑贴试验</text>
</svg>
