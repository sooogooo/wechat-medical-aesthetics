<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="titleA202 descA202" role="img" viewBox="0 0 900 620"><title id="titleA202">分离到什么程度，才考虑手术</title><desc id="descA202">腹直肌分离按宽度分度，两指以内观察、2～3 指康复训练、3 指以上面诊评估</desc><defs><marker id="ahA202" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#b7c6cb" d="M0,0 L10,5 L0,10 z"/></marker><style>.series{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.8px;fill:#7d97a4}.title{font:300 32px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.kicker{font:400 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.nodeTitle{font:500 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.body{font:400 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#4a5a60}.small{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.quote{font:400 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.footer{font:400 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#93a3a8}</style></defs><rect width="899" height="619" x=".5" y=".5" fill="#fff" stroke="#dde5e7" stroke-width="1"/><text x="62" y="64" class="series">腹壁整形 12 讲 · A2</text><text x="62" y="112" class="title">分离到什么程度，才考虑手术</text><text x="62" y="148" class="kicker">轻度首选康复训练，重度伴功能障碍才谈手术</text><line x1="62" x2="838" y1="172" y2="172" stroke="#e3e9ea" stroke-width="1"/><rect width="250" height="270" x="62" y="205" fill="none" stroke="#0B8A6B" stroke-width="1.2" rx="10"/><text x="84" y="243" class="nodeTitle">两指以内</text><text x="84" y="277" class="body">基本正常</text><text x="84" y="303" class="body">观察即可，无需特殊处理</text><text x="187" y="463" class="small" text-anchor="middle" style="fill:#0b8a6b">别盲目做卷腹</text><rect width="250" height="270" x="324" y="205" fill="none" stroke="#D9930D" stroke-width="1.2" rx="10"/><text x="346" y="243" class="nodeTitle">2～3 指</text><text x="346" y="277" class="body">轻到中度分离</text><text x="346" y="303" class="body">首选产后康复训练</text><text x="346" y="329" class="body">核心训练＋呼吸控制</text><text x="346" y="355" class="body">需要专业指导</text><text x="449" y="463" class="small" text-anchor="middle" style="fill:#d9930d">训练数月无改善再评估</text><rect width="250" height="270" x="586" y="205" fill="none" stroke="#C75B00" stroke-width="1.2" rx="10"/><text x="608" y="243" class="nodeTitle">3 指以上</text><text x="608" y="277" class="body">中重度分离</text><text x="608" y="303" class="body">面诊评估，超声测量</text><text x="608" y="329" class="body">训练无效伴功能障碍</text><text x="608" y="355" class="body">才考虑手术收紧</text><text x="711" y="463" class="small" text-anchor="middle" style="fill:#c75b00">收紧肌层属四级手术</text><line x1="62" x2="838" y1="520" y2="520" stroke="#e3e9ea" stroke-width="1"/><text x="450" y="548" class="quote" text-anchor="middle">把手术留给康复搞不定的情况</text><text x="62" y="580" class="footer">医学教育示意 · 是否手术由资质医师评估 · 康复训练需专业指导</text></svg>