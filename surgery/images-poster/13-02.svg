<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1302 desc1302" role="img" viewBox="0 0 900 620"><title id="title1302">隆乳假体的远期风险</title><desc id="desc1302">假体非终身植入物，远期可能面临包膜挛缩、破裂、BIA-ALCL和二次手术</desc><defs><linearGradient id="bg1302" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1302" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.warn{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#d55e00}</style></defs><rect width="900" height="620" fill="url(#bg1302)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1302)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 13</text><text x="62" y="117" class="title">假体不是终身植入物</text><text x="62" y="153" class="kicker">一次手术终身无忧是误解——远期问题必须正视</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><line x1="100" x2="800" y1="260" y2="260" stroke="#7d8e93" stroke-width="2"/><circle cx="120" cy="260" r="8" fill="#0072B2"/><circle cx="320" cy="260" r="8" fill="#E69F00"/><circle cx="520" cy="260" r="8" fill="#E69F00"/><circle cx="720" cy="260" r="8" fill="#D55E00"/><text x="120" y="240" class="small" text-anchor="middle">术后近期</text><text x="320" y="240" class="small" text-anchor="middle">数月到数年</text><text x="520" y="240" class="small" text-anchor="middle">远期</text><text x="720" y="240" class="small" text-anchor="middle">一生中</text><rect width="180" height="100" x="62" y="285" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.5" rx="12"/><text x="152" y="312" class="nodeTitle" text-anchor="middle">感染 · 血肿</text><text x="152" y="338" class="body" text-anchor="middle">可能需取出假体</text><text x="152" y="362" class="small" text-anchor="middle">感觉改变</text><rect width="180" height="100" x="262" y="285" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5" rx="12"/><text x="352" y="312" class="nodeTitle" text-anchor="middle">包膜挛缩</text><text x="352" y="338" class="body" text-anchor="middle">变硬、变形、疼痛</text><text x="352" y="362" class="small" text-anchor="middle">最常见远期并发症</text><rect width="180" height="100" x="462" y="285" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5" rx="12"/><text x="552" y="312" class="nodeTitle" text-anchor="middle">假体破裂渗漏</text><text x="552" y="338" class="body" text-anchor="middle">硅胶静默破裂</text><text x="552" y="362" class="small" text-anchor="middle">需影像发现</text><rect width="180" height="100" x="662" y="285" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="12"/><text x="752" y="312" class="nodeTitle" text-anchor="middle">二次手术</text><text x="752" y="338" class="body" text-anchor="middle">更换 · 取出 · 调整</text><text x="752" y="362" class="small" text-anchor="middle">多数人都会面对</text><rect width="776" height="105" x="62" y="405" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5" rx="12"/><text x="82" y="432" class="warn">需要长期关注：</text><text x="82" y="458" class="body">· BIA-ALCL（假体相关间变性大细胞淋巴瘤）：主要与毛面假体相关，罕见但严重，表现为迟发性血清肿</text><text x="82" y="482" class="body">· 假体可能影响乳腺影像检查，需告知影像医生并采用特殊体位</text><text x="82" y="502" class="small">· 哺乳可能受影响（取决于层次和切口）</text><rect width="776" height="40" x="62" y="525" fill="#fdf1ee" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">承诺终身无忧的机构，不值得信任</text><text x="62" y="582" class="footer">医学教育示意 · 风险发生率因个体与假体类型而异</text></svg>