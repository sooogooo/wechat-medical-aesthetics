<svg xmlns="http://www.w3.org/2000/svg" aria-label="鼻部注射机构硬门槛" role="img" viewBox="0 0 640 220"><rect width="640" height="220" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">鼻部注射，机构必须满足</text><rect width="290" height="70" x="30" y="50" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="55" cy="85" r="10" fill="#b5654a"/><text x="55" y="89" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">!</text><text x="75" y="80" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">备有透明质酸酶</text><text x="75" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">栓塞发生时唯一的溶解手段</text><rect width="260" height="70" x="350" y="50" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="375" cy="85" r="10" fill="#b5654a"/><text x="375" y="89" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">!</text><text x="395" y="80" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">有栓塞急救流程</text><text x="395" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">不是“做完了再想办法”</text><rect width="290" height="70" x="30" y="135" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="55" cy="170" r="10" fill="#b5654a"/><text x="55" y="174" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">!</text><text x="75" y="165" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">医生熟悉鼻部血管解剖</text><text x="75" y="185" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">能讲清危险区如何规避</text><rect width="260" height="70" x="350" y="135" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="375" cy="170" r="10" fill="#b5654a"/><text x="375" y="174" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">!</text><text x="395" y="165" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">正规医疗机构资质</text><text x="395" y="185" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">执业许可证可查</text></svg>