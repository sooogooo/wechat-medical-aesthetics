<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="三型在四个维度的对比">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">三型在四个维度的差别</text>

  <!-- 表头 -->
  <rect x="30" y="55" width="580" height="32" rx="4" fill="#5f6e54"/>
  <text x="100" y="76" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">维度</text>
  <text x="260" y="76" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">高级型</text>
  <text x="400" y="76" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">技术型</text>
  <text x="540" y="76" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#ffffff">庸俗型</text>

  <rect x="30" y="87" width="580" height="38" fill="#ffffff" stroke="#ece7df"/>
  <text x="100" y="111" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">剂量</text>
  <text x="260" y="111" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">克制</text>
  <text x="400" y="111" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">按数据</text>
  <text x="540" y="111" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">过度</text>

  <rect x="30" y="125" width="580" height="38" fill="#eef0ea" stroke="#ece7df"/>
  <text x="100" y="149" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">设计</text>
  <text x="260" y="149" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">整体协调</text>
  <text x="400" y="149" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">参数达标</text>
  <text x="540" y="149" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">套模板</text>

  <rect x="30" y="163" width="580" height="38" fill="#ffffff" stroke="#ece7df"/>
  <text x="100" y="187" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">个体化</text>
  <text x="260" y="187" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">尊重基础</text>
  <text x="400" y="187" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">部分考虑</text>
  <text x="540" y="187" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">忽视基础</text>

  <rect x="30" y="201" width="580" height="38" fill="#eef0ea" stroke="#ece7df"/>
  <text x="100" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#2b2a28">结果</text>
  <text x="260" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">耐看自然</text>
  <text x="400" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">精确规整</text>
  <text x="540" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">显俗趋同</text>

  <text x="320" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">高级型与技术型不冲突——好的医美往往是“高级思路 + 技术精准”的结合</text>
</svg>