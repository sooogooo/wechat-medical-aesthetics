<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t10f2 d10f2" role="img" viewBox="0 0 800 500"><title id="t10f2">太田痣激光淡化疗程节奏</title><desc id="t10f2">治疗能变淡不等于所有色素消失，需多次累积配合长期维护</desc><defs><linearGradient id="bg10f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh10f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg10f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh10f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 10</text><text x="56" y="90" class="title">激光淡化的合理节奏</text><text x="56" y="116" class="kicker">能变淡，不等于所有色素都消失</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">疗程进展示意</text><rect width="688" height="56" x="56" y="180" fill="#f3efe6" rx="10"/><text x="72" y="214" class="body">治疗前 青灰色明显 分布较广</text><rect width="688" height="56" x="56" y="244" fill="#c9a876" opacity=".45" rx="10"/><text x="72" y="278" class="body">数次后 明显变淡 仍有残余</text><rect width="688" height="56" x="56" y="308" fill="#7A8B6F" opacity=".35" rx="10"/><text x="72" y="342" class="body">多次累积 可接受范围内改善</text><text x="56" y="392" class="nodeTitle">三个现实预期</text><rect width="220" height="44" x="56" y="406" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.2" rx="8"/><text x="166" y="425" class="body" text-anchor="middle">需多次治疗</text><text x="166" y="443" class="small" text-anchor="middle">间隔数月</text><rect width="220" height="44" x="290" y="406" fill="#fff8ee" stroke="#C9A876" stroke-width="1.2" rx="8"/><text x="400" y="425" class="body" text-anchor="middle">难以完全消失</text><text x="400" y="443" class="small" text-anchor="middle">追求改善而非清零</text><rect width="220" height="44" x="524" y="406" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.2" rx="8"/><text x="634" y="425" class="body" text-anchor="middle">需长期维护</text><text x="634" y="443" class="small" text-anchor="middle">防晒防加深</text><rect width="688" height="20" x="56" y="456" fill="#eef4ee" rx="8"/><text x="400" y="470" class="quote" font-size="13" text-anchor="middle">儿童治疗时机需个体化评估，把就诊信息整理成诊疗底图</text><text x="400" y="490" class="footer" text-anchor="middle">医学教育示意 · 治疗能变淡不等于所有色素消失，需多次累积配合长期维护</text></svg>