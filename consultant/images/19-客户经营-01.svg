<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t19a d19a">
  <title id="t19a">客户生命周期与潮汐经营</title>
  <desc id="d19a">新客、首单、恢复期、复购、转介绍五阶段，淡季养客旺季疏解，复购来自信任效果节奏</desc>
  <defs>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .st{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .act{font:500 10px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .tide{font:700 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;}
      .tideSub{font:500 10.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .formula{font:700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect x="30" y="26" width="740" height="448" rx="10" fill="#ffffff" stroke="#e4ddd2"/>
  <text x="56" y="58" class="series">医美咨询师成长教程 · 阶段5 · 19</text>
  <text x="56" y="90" class="title">客户经营 一条道，两个方向</text>
  <text x="56" y="116" class="kicker">旺季疏解成交，淡季养客户关系——只有旺季动作的业绩像心电图</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 潮汐带 -->
  <rect x="56" y="144" width="336" height="60" rx="10" fill="#ffffff" stroke="#b8c0cf" stroke-width="1.4"/>
  <text x="76" y="168" class="tide" fill="#7d8ba3">淡季 · 养</text>
  <text x="76" y="188" class="tideSub">内容触达 · 术后随访 · 换季提醒 · 重要日期问候</text>
  <rect x="410" y="144" width="336" height="60" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.4"/>
  <text x="430" y="168" class="tide" fill="#8a6d3b">旺季 · 疏</text>
  <text x="430" y="188" class="tideSub">按需安排 · 提前约期 · 不硬凑大单 · 冷静期照给</text>

  <!-- 五阶段 -->
  <rect x="56" y="216" width="128" height="120" rx="10" fill="#ffffff" stroke="#a9bba0" stroke-width="1.4"/>
  <text x="120" y="242" class="st" text-anchor="middle">① 新客</text>
  <text x="120" y="268" class="act" text-anchor="middle">被信任地记住</text>
  <text x="120" y="286" class="act" text-anchor="middle">不是当场成交</text>
  <text x="120" y="312" class="act" text-anchor="middle">OD 四问 + 警讯</text>
  <path d="M190 276 L202 276 M197 271 L205 276 L197 281" stroke="#A8A39D" stroke-width="1.5" fill="none"/>
  <rect x="208" y="216" width="128" height="120" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.6"/>
  <text x="272" y="242" class="st" text-anchor="middle">② 首单</text>
  <text x="272" y="268" class="act" text-anchor="middle">转诊摘要 + 知情确认</text>
  <text x="272" y="286" class="act" text-anchor="middle">术后事项讲清</text>
  <text x="272" y="312" class="act" text-anchor="middle">体验质量定全程</text>
  <path d="M342 276 L354 276 M349 271 L357 276 L349 281" stroke="#A8A39D" stroke-width="1.5" fill="none"/>
  <rect x="360" y="216" width="128" height="120" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.4"/>
  <text x="424" y="242" class="st" text-anchor="middle">③ 恢复期</text>
  <text x="424" y="268" class="act" text-anchor="middle">按天随访</text>
  <text x="424" y="286" class="act" text-anchor="middle">情绪价值主场</text>
  <text x="424" y="312" class="act" text-anchor="middle">异常即识别上报</text>
  <path d="M494 276 L506 276 M501 271 L509 276 L501 281" stroke="#A8A39D" stroke-width="1.5" fill="none"/>
  <rect x="512" y="216" width="128" height="120" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.6"/>
  <text x="576" y="242" class="st" text-anchor="middle">④ 复购</text>
  <text x="576" y="268" class="act" text-anchor="middle">按医学节奏提醒</text>
  <text x="576" y="286" class="act" text-anchor="middle">该说不做就不做</text>
  <text x="576" y="312" class="act" text-anchor="middle">不硬凑</text>
  <path d="M646 276 L658 276 M653 271 L661 276 L653 281" stroke="#A8A39D" stroke-width="1.5" fill="none"/>
  <rect x="664" y="216" width="82" height="120" rx="10" fill="#ffffff" stroke="#a9bba0" stroke-width="1.4"/>
  <text x="705" y="242" class="st" text-anchor="middle">⑤ 转介绍</text>
  <text x="705" y="268" class="act" text-anchor="middle">不靠返利</text>
  <text x="705" y="286" class="act" text-anchor="middle">靠体验</text>
  <text x="705" y="312" class="act" text-anchor="middle">真诚致谢</text>

  <!-- 公式带 -->
  <rect x="56" y="348" width="690" height="76" rx="10" fill="#ffffff" stroke="#c9c9c4" stroke-width="1.3"/>
  <text x="400" y="378" class="formula" text-anchor="middle">复购 = 信任 × 效果 × 节奏</text>
  <text x="400" y="402" class="tideSub" text-anchor="middle">信任：从不说"绝对" ｜ 效果：如实随访，不达预期如实复盘 ｜ 节奏：把医学规律讲在前面，消费有预期无惊吓</text>

  <text x="56" y="452" class="footer">长期主义：三年后的底气不是大单数，是只认你、愿跟你换机构、主动把闺蜜交给你的人</text>
  <text x="56" y="470" class="footer">台账纪律：如实记录，包括"她说不会再来了"——负信息比正信息更值钱</text>
</svg>
