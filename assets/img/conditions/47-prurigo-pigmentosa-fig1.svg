<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t47f1 d47f1" role="img" viewBox="0 0 800 500"><title id="t47f1">色素性痒疹的分布与诱因</title><desc id="d47f1">颈胸背对称痒疹消退后留网状色沉，部分与酮症或快速减重相关</desc><defs><linearGradient id="bg47f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh47f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.card,.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.nodeTitle{fill:#2b2a28}.card{fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg47f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh47f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 47</text><text x="52" y="92" class="title">痒疹退了，留下网状黑印</text><text x="52" y="116" class="kicker">少见炎症性皮肤病，部分病例与酮症或快速减重相关</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">典型分布</text><g transform="translate(120,180)"><circle cx="100" cy="20" r="18" fill="#f8fbfb" stroke="#7A8B6F"/><path fill="#f8fbfb" stroke="#7A8B6F" d="M 70 40 L 130 40 L 138 180 L 62 180 Z"/><path fill="#f8fbfb" stroke="#7A8B6F" d="M 70 44 L 40 160 L 50 164 L 78 60 Z"/><path fill="#f8fbfb" stroke="#7A8B6F" d="M 130 44 L 160 160 L 150 164 L 122 60 Z"/><ellipse cx="100" cy="50" fill="#B5654A" opacity=".7" rx="28" ry="10"/><ellipse cx="100" cy="90" fill="#B5654A" opacity=".7" rx="36" ry="22"/><ellipse cx="100" cy="140" fill="#B5654A" opacity=".5" rx="34" ry="20"/></g><text x="220" y="240" class="small">颈部</text><text x="220" y="260" class="small">上背 / 肩部</text><text x="220" y="280" class="small">锁骨下区</text><text x="220" y="300" fill="#5F6E54" class="small">对称发作</text><text x="396" y="162" class="nodeTitle">两阶段表现</text><rect width="352" height="78" x="396" y="178" fill="#fbf0eb" stroke="#B5654A" rx="12"/><text x="410" y="202" fill="#B5654A" class="card">急性期</text><text x="410" y="226" class="body">红色丘疹、风团样痒疹</text><text x="410" y="246" class="small">成群出现，瘙痒明显</text><rect width="352" height="78" x="396" y="266" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><text x="410" y="290" fill="#5F6E54" class="card">消退期</text><text x="410" y="314" class="body">留下网状或斑点状色沉</text><text x="410" y="334" class="small">色沉消退较慢</text><text x="396" y="368" class="nodeTitle">可能相关诱因</text><rect width="110" height="40" x="396" y="378" fill="#C9A876" rx="8"/><text x="451" y="394" fill="#fff" class="small" text-anchor="middle">生酮饮食</text><text x="451" y="410" fill="#fff" class="small" text-anchor="middle">酮症</text><rect width="110" height="40" x="516" y="378" fill="#C9A876" rx="8"/><text x="571" y="394" fill="#fff" class="small" text-anchor="middle">快速减重</text><text x="571" y="410" fill="#fff" class="small" text-anchor="middle">禁食</text><rect width="112" height="40" x="636" y="378" fill="#C9A876" rx="8"/><text x="692" y="394" fill="#fff" class="small" text-anchor="middle">糖尿病</text><text x="692" y="410" fill="#fff" class="small" text-anchor="middle">出汗摩擦</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">红疹会退，色沉会淡，关键是别再抓</text><text x="52" y="466" class="footer">健康科普示意 · 诊断与代谢排查须由皮肤科医师评估</text></svg>