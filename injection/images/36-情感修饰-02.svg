<svg xmlns="http://www.w3.org/2000/svg" aria-label="情感诉求到codes方案的翻译" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">从&quot;想要什么感觉&quot;到&quot;打哪些 code&quot;</text><text x="107" y="62" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">情感诉求</text><text x="320" y="62" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">对应特征</text><text x="533" y="62" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">可能涉及的 codes</text><rect width="155" height="40" x="30" y="75" fill="#fff" stroke="#ddd6ca" rx="4"/><text x="107" y="100" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">&quot;想不显累&quot;</text><rect width="150" height="40" x="245" y="75" fill="#fff" stroke="#ddd6ca" rx="4"/><text x="320" y="100" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">泪沟、眼周凹陷</text><rect width="155" height="40" x="455" y="75" fill="#eef0ea" stroke="#7a8b6f" rx="4"/><text x="533" y="100" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">E1、Ck1（举例）</text><rect width="155" height="40" x="30" y="120" fill="#fff" stroke="#ddd6ca" rx="4"/><text x="107" y="145" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">&quot;想不显凶&quot;</text><rect width="150" height="40" x="245" y="120" fill="#fff" stroke="#ddd6ca" rx="4"/><text x="320" y="145" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">眉间纹、颞部凹</text><rect width="155" height="40" x="455" y="120" fill="#eef0ea" stroke="#7a8b6f" rx="4"/><text x="533" y="145" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">T、眉间 + 肉毒</text><rect width="155" height="40" x="30" y="165" fill="#fff" stroke="#ddd6ca" rx="4"/><text x="107" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">&quot;想不显老&quot;</text><rect width="150" height="40" x="245" y="165" fill="#fff" stroke="#ddd6ca" rx="4"/><text x="320" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">容积流失、下垂</text><rect width="155" height="40" x="455" y="165" fill="#eef0ea" stroke="#7a8b6f" rx="4"/><text x="533" y="190" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">Ck、Jw 综合</text><text x="320" y="240" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">情感属性让注射目标更贴近你的真实诉求，而非&quot;医生看着办&quot;</text><text x="320" y="260" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">图为示意；实际方案需医生面诊评估，常涉及多个 codes 组合</text></svg>