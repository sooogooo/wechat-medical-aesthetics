<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0703 desc0703">
  <title id="title0703">颧骨术后下垂警示与固定物</title>
  <desc id="desc0703">术后面部下垂是颧骨手术特有问题，固定物需可追溯、写入手术记录</desc>
  <defs>
    <linearGradient id="bg0703" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0703" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0703)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0703)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 07</text>
  <text x="62" y="117" class="title">术后下垂警示与固定物问题</text>
  <text x="62" y="153" class="kicker">颧骨手术特有的下垂风险，是最影响满意度的</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：下垂警示 -->
  <rect x="62" y="210" width="388" height="295" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="62" y="210" width="388" height="40" rx="14" fill="#D55E00"/>
  <rect x="62" y="236" width="388" height="14" fill="#D55E00"/>
  <text x="82" y="237" class="nodeTitle" fill="#ffffff">为什么术后会下垂</text>

  <text x="82" y="280" class="body" font-weight="700">机制</text>
  <text x="82" y="304" class="body">骨性支架缩窄后</text>
  <text x="82" y="326" class="body">附着其上的软组织失去支撑</text>

  <text x="82" y="358" class="body" font-weight="700">表现</text>
  <text x="82" y="382" class="body">· 面颊下垂</text>
  <text x="82" y="404" class="body">· 法令纹加深</text>
  <text x="82" y="426" class="body">· 整体面部松垂感</text>

  <rect x="82" y="442" width="348" height="50" rx="8" fill="#fbeae3"/>
  <text x="256" y="463" class="small" text-anchor="middle">年龄偏大、皮肤弹性差者更明显</text>
  <text x="256" y="481" class="small" text-anchor="middle">必要时需联合提升手术</text>

  <!-- 右：固定物 -->
  <rect x="462" y="210" width="376" height="295" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="462" y="210" width="376" height="40" rx="14" fill="#E69F00"/>
  <rect x="462" y="236" width="376" height="14" fill="#E69F00"/>
  <text x="482" y="237" class="nodeTitle" fill="#ffffff">钛板钛钉固定物</text>

  <circle cx="492" cy="280" r="5" fill="#E69F00"/>
  <text x="508" y="285" class="body">通常永久留存</text>

  <circle cx="492" cy="310" r="5" fill="#E69F00"/>
  <text x="508" y="315" class="body">少数因不适/感染/影像干扰需取出</text>

  <circle cx="492" cy="340" r="5" fill="#E69F00"/>
  <text x="508" y="345" class="body">应有可追溯批号和注册证</text>

  <circle cx="492" cy="370" r="5" fill="#E69F00"/>
  <text x="508" y="375" class="body">品牌来源应写入手术记录</text>

  <rect x="482" y="394" width="336" height="50" rx="8" fill="#fdf3e3"/>
  <text x="650" y="415" class="small" text-anchor="middle">机构对固定物品牌来源含糊其辞</text>
  <text x="650" y="433" class="small" text-anchor="middle">你无法事后证明体内放的是什么</text>

  <text x="482" y="475" class="body" font-weight="700" fill="#D55E00">要追问</text>
  <text x="482" y="495" class="small">含糊＝风险信号</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">颧骨内推不可逆，决策审慎程度应与风险匹配</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 颧骨颧弓成形术须在有相应资质、具备急救能力的机构开展</text>
</svg>
