<svg xmlns="http://www.w3.org/2000/svg" aria-label="动态纹与静态纹的表情测试" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">一个简单的判断方法</text><rect width="260" height="190" x="40" y="60" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="170" cy="150" fill="#f3efe8" stroke="#a8a39d" rx="55" ry="70"/><ellipse cx="148" cy="135" fill="#a8a39d" rx="5" ry="3"/><ellipse cx="192" cy="135" fill="#a8a39d" rx="5" ry="3"/><line x1="155" x2="185" y1="172" y2="172" stroke="#a8a39d" stroke-width="1.5"/><text x="170" y="80" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">面部放松</text><text x="170" y="245" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">不动时</text><rect width="260" height="190" x="340" y="60" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="470" cy="150" fill="#f3efe8" stroke="#a8a39d" rx="55" ry="70"/><ellipse cx="448" cy="128" fill="#a8a39d" rx="5" ry="3"/><ellipse cx="492" cy="128" fill="#a8a39d" rx="5" ry="3"/><path stroke="#7a8b6f" stroke-width="1.5" d="M 440 105 L 460 103 M 440 112 L 460 110 M 440 119 L 460 117"/><path stroke="#7a8b6f" stroke-width="1.5" d="M 425 135 L 415 132 M 425 140 L 413 140 M 425 145 L 415 148"/><path stroke="#7a8b6f" stroke-width="1.5" d="M 515 135 L 525 132 M 515 140 L 527 140 M 515 145 L 525 148"/><path fill="none" stroke="#a8a39d" stroke-width="1.5" d="M 450 172 Q 470 185 490 172"/><text x="470" y="80" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">做表情</text><text x="470" y="245" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">抬眉、笑、皱眉时</text><text x="320" y="266" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">放松时没有、表情时出现的纹 = 动态纹；放松时就在的纹 = 静态纹</text></svg>