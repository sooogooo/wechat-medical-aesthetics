<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2402 desc2402">
  <title id="title2402">体表肿物切除后的修复层次</title>
  <desc id="desc2402">直接缝合、皮瓣转移、植皮、分期切除/扩张器四个修复层次，由简到繁，疤痕与功能权衡</desc>
  <defs>
    <linearGradient id="bg2402" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2402" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .num { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2402)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2402)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 24</text>
  <text x="62" y="117" class="title">切除后的修复：四个层次</text>
  <text x="62" y="153" class="kicker">由简到繁，疤痕与功能的权衡——整形科的优势所在</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 4 张修复层次卡 -->
  <!-- 1 直接缝合 -->
  <rect x="62" y="215" width="186" height="300" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="100" cy="253" r="22" fill="#0072B2"/>
  <text x="100" y="262" class="num" text-anchor="middle">1</text>
  <text x="132" y="260" class="nodeTitle">直接缝合</text>
  <line x1="82" y1="288" x2="228" y2="288" stroke="#dce5e5"/>
  <text x="82" y="316" class="body">肿物小</text>
  <text x="82" y="343" class="body">张力不大</text>
  <text x="82" y="370" class="body">精细缝合</text>
  <rect x="82" y="430" width="146" height="65" rx="8" fill="#eef6f8"/>
  <text x="155" y="455" class="small" text-anchor="middle">疤痕最小</text>
  <text x="155" y="475" class="small" text-anchor="middle">最理想的层次</text>

  <!-- 2 皮瓣转移 -->
  <rect x="262" y="215" width="186" height="300" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="300" cy="253" r="22" fill="#E69F00"/>
  <text x="300" y="262" class="num" text-anchor="middle">2</text>
  <text x="332" y="260" class="nodeTitle">皮瓣转移</text>
  <line x1="282" y1="288" x2="428" y2="288" stroke="#dce5e5"/>
  <text x="282" y="316" class="body">范围较大</text>
  <text x="282" y="343" class="body">张力大或影响功能</text>
  <text x="282" y="370" class="body">关节、面部</text>
  <rect x="282" y="430" width="146" height="65" rx="8" fill="#fdf3e3"/>
  <text x="355" y="455" class="small" text-anchor="middle">设计复杂</text>
  <text x="355" y="475" class="small" text-anchor="middle">保留功能与外观</text>

  <!-- 3 植皮 -->
  <rect x="462" y="215" width="186" height="300" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="500" cy="253" r="22" fill="#E69F00"/>
  <text x="500" y="262" class="num" text-anchor="middle">3</text>
  <text x="532" y="260" class="nodeTitle">植皮</text>
  <line x1="482" y1="288" x2="628" y2="288" stroke="#dce5e5"/>
  <text x="482" y="316" class="body">创面大</text>
  <text x="482" y="343" class="body">局部组织不足</text>
  <text x="482" y="370" class="body">他处取皮移植</text>
  <rect x="482" y="430" width="146" height="65" rx="8" fill="#fdf3e3"/>
  <text x="555" y="455" class="small" text-anchor="middle">供皮区 + 受皮区</text>
  <text x="555" y="475" class="small" text-anchor="middle">颜色质地可能不同</text>

  <!-- 4 分期切除/扩张器 -->
  <rect x="662" y="215" width="176" height="300" rx="16" fill="#f8fbfb" stroke="#009E73" stroke-width="2"/>
  <circle cx="700" cy="253" r="22" fill="#009E73"/>
  <text x="700" y="262" class="num" text-anchor="middle">4</text>
  <text x="732" y="260" class="nodeTitle">分期 · 扩张</text>
  <line x1="682" y1="288" x2="818" y2="288" stroke="#dce5e5"/>
  <text x="682" y="316" class="body">巨大色素痣</text>
  <text x="682" y="343" class="body">分次切除</text>
  <text x="682" y="370" class="body">或扩张器扩张</text>
  <rect x="682" y="430" width="136" height="65" rx="8" fill="#e7f5ef"/>
  <text x="750" y="455" class="small" text-anchor="middle">周期长</text>
  <text x="750" y="475" class="small" text-anchor="middle">为大面积病变设计</text>

  <!-- 阶梯递进箭头 -->
  <path d="M 155 535 L 750 535" stroke="#7d8e93" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  <path d="M 742 529 L 750 535 L 742 541" fill="none" stroke="#7d8e93" stroke-width="1.5"/>

  <!-- 金句 -->
  <rect x="62" y="525" width="600" height="40" rx="12" fill="#eef6f8"/>
  <text x="362" y="551" class="quote" text-anchor="middle">所有切除都会留疤——整形科努力的是「尽可能小而隐蔽」</text>

  <text x="62" y="582" class="footer">示意，非教学图 · 具体修复方式以面诊评估肿物性质、大小、部位后确定</text>
</svg>
