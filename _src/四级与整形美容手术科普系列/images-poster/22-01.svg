<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2201 desc2201">
  <title id="title2201">颈部老化的六个来源</title>
  <desc id="desc2201">皮肤松弛、颈阔肌条带、脂肪堆积、下颌缘模糊、下颌下腺下垂、骨性基础，处理方式各不同</desc>
  <defs>
    <linearGradient id="bg2201" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2201" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .num { font: 700 22px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2201)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2201)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 22</text>
  <text x="62" y="117" class="title">颈部老化的六个来源</text>
  <text x="62" y="153" class="kicker">来源不同处理不同——误判会直接导致效果不佳</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 6 张来源卡 3x2 -->
  <!-- 1 皮肤松弛 -->
  <rect x="62" y="210" width="250" height="125" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="98" cy="244" r="19" fill="#0072B2"/>
  <text x="98" y="251" class="num" text-anchor="middle">1</text>
  <text x="128" y="250" class="nodeTitle">皮肤松弛</text>
  <text x="82" y="288" class="body">横向皱纹、纵向条带</text>
  <text x="82" y="312" class="body">皮肤下垂</text>

  <!-- 2 颈阔肌条带 -->
  <rect x="325" y="210" width="250" height="125" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="361" cy="244" r="19" fill="#0072B2"/>
  <text x="361" y="251" class="num" text-anchor="middle">2</text>
  <text x="391" y="250" class="nodeTitle">颈阔肌条带</text>
  <text x="345" y="288" class="body">俗称「火鸡脖」</text>
  <text x="345" y="312" class="body">前胸至下颌的纵条</text>

  <!-- 3 脂肪堆积 -->
  <rect x="588" y="210" width="250" height="125" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="624" cy="244" r="19" fill="#E69F00"/>
  <text x="624" y="251" class="num" text-anchor="middle">3</text>
  <text x="654" y="250" class="nodeTitle">脂肪堆积</text>
  <text x="608" y="288" class="body">颏下「双下巴」</text>
  <text x="608" y="312" class="body">颌下脂肪</text>

  <!-- 4 下颌缘模糊 -->
  <rect x="62" y="350" width="250" height="125" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="98" cy="384" r="19" fill="#E69F00"/>
  <text x="98" y="391" class="num" text-anchor="middle">4</text>
  <text x="128" y="390" class="nodeTitle">下颌缘模糊</text>
  <text x="82" y="428" class="body">下颌与颈部界限不清</text>
  <text x="82" y="452" class="body">轮廓松散</text>

  <!-- 5 下颌下腺下垂（重点-红框警示） -->
  <rect x="325" y="350" width="250" height="125" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5"/>
  <circle cx="361" cy="384" r="19" fill="#D55E00"/>
  <text x="361" y="391" class="num" text-anchor="middle">5</text>
  <text x="391" y="390" class="nodeTitle">下颌下腺下垂</text>
  <text x="345" y="428" class="body">常被误认为脂肪</text>
  <text x="345" y="452" class="body">吸脂无效甚至更糟</text>

  <!-- 6 骨性基础 -->
  <rect x="588" y="350" width="250" height="125" rx="14" fill="#f8fbfb" stroke="#009E73" stroke-width="2"/>
  <circle cx="624" cy="384" r="19" fill="#009E73"/>
  <text x="624" y="391" class="num" text-anchor="middle">6</text>
  <text x="654" y="390" class="nodeTitle">骨性基础</text>
  <text x="608" y="428" class="body">下颌后缩、颏后缩</text>
  <text x="608" y="452" class="body">加重视觉松垂</text>

  <!-- 金句 -->
  <rect x="62" y="498" width="776" height="40" rx="12" fill="#fbeae3"/>
  <text x="450" y="524" class="quote" text-anchor="middle">下颌下腺下垂不是脂肪，吸脂无效——需专业面诊判断</text>

  <text x="62" y="556" class="small">示意，非教学图 · 不同来源处理方式不同：脂肪吸脂、条带需颈阔肌成形、皮肤多余需切除</text>
  <text x="62" y="578" class="footer">医学教育示意 · 具体来源判断与术式以面诊评估为准</text>
</svg>
