<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t15a d15a">
  <title id="t15a">科普转写漏斗</title>
  <desc id="d15a">从3-2-1卡片到30篇作品集：选题、四段式初稿、合规自检、发布、复盘</desc>
  <defs>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .stage{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .stageSub{font:500 10.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .num{font:700 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
      .tri{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect x="30" y="26" width="740" height="448" rx="10" fill="#ffffff" stroke="#e4ddd2"/>
  <text x="56" y="58" class="series">医美咨询师成长教程 · 阶段4 · 15</text>
  <text x="56" y="90" class="title">作品集 从卡片到 30 篇的转写漏斗</text>
  <text x="56" y="116" class="kicker">零经验求职者最缺的是证据——作品集就是你带进面试的证据</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 漏斗五层 -->
  <polygon points="190,144 610,144 570,200 230,200" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.5"/>
  <text x="400" y="170" class="stage" text-anchor="middle">① 选题 · 60+ 张卡片 × 错题本</text>
  <text x="400" y="190" class="stageSub" text-anchor="middle">配比：皮肤 12 · 注射 8 · 美学与心理 6 · 行业认知 4</text>
  <polygon points="240,212 560,212 520,268 280,268" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.5"/>
  <text x="400" y="238" class="stage" text-anchor="middle">② 四段式初稿（300-600 字）</text>
  <text x="400" y="258" class="stageSub" text-anchor="middle">钩子痛点 → 一个概念 → 风险提醒 → 可核验的下一步</text>
  <polygon points="290,280 510,280 470,336 330,336" fill="#ffffff" stroke="#C9A876" stroke-width="1.5"/>
  <text x="400" y="306" class="stage" text-anchor="middle">③ 合规自检（发布前必过）</text>
  <text x="400" y="326" class="stageSub" text-anchor="middle">搜四个词：肯定·绝对·保证·最好 + 图片版权 + 平台规则</text>
  <polygon points="340,348 460,348 440,404 360,404" fill="#ffffff" stroke="#A8A39D" stroke-width="1.5"/>
  <text x="400" y="372" class="stage" text-anchor="middle">④ 发布</text>
  <text x="400" y="392" class="stageSub" text-anchor="middle">小红书为主 · 朋友圈人设</text>
  <rect x="300" y="416" width="200" height="34" rx="10" fill="#7A8B6F"/>
  <text x="400" y="438" class="num" text-anchor="middle">⑤ 30 篇作品集 + 运营小结</text>

  <!-- 一举三得 -->
  <rect x="56" y="144" width="110" height="306" rx="10" fill="#ffffff" stroke="#a9bba0" stroke-width="1.3"/>
  <text x="111" y="170" class="stage" text-anchor="middle">一举三得</text>
  <text x="111" y="200" class="tri" text-anchor="middle">写 = 费曼检验</text>
  <text x="111" y="216" class="tri" text-anchor="middle">写不出=没学透</text>
  <text x="111" y="252" class="tri" text-anchor="middle">发 = 入场券</text>
  <text x="111" y="268" class="tri" text-anchor="middle">账号比简历</text>
  <text x="111" y="284" class="tri" text-anchor="middle">更有说服力</text>
  <text x="111" y="320" class="tri" text-anchor="middle">存 = 内容能力</text>
  <text x="111" y="336" class="tri" text-anchor="middle">通向阶段5</text>
  <text x="111" y="352" class="tri" text-anchor="middle">分支 B</text>

  <!-- 人设 -->
  <rect x="634" y="144" width="110" height="306" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.3"/>
  <text x="689" y="170" class="stage" text-anchor="middle">人设定位</text>
  <text x="689" y="200" class="tri" text-anchor="middle">"陪你搞懂</text>
  <text x="689" y="216" class="tri" text-anchor="middle">医美的转行者"</text>
  <text x="689" y="252" class="tri" text-anchor="middle">转行视角</text>
  <text x="689" y="268" class="tri" text-anchor="middle">就是差异化</text>
  <text x="689" y="304" class="tri" text-anchor="middle">每篇必有</text>
  <text x="689" y="320" class="tri" text-anchor="middle">"具体请面诊"</text>
  <text x="689" y="336" class="tri" text-anchor="middle">类出口</text>

  <text x="56" y="466" class="footer">节奏：每周 5 篇 × 6 周 · 每周日复盘数据写进"运营小结"——面试官看到的不仅是会写，还会复盘</text>
</svg>
