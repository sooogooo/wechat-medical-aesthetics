<svg xmlns="http://www.w3.org/2000/svg" aria-label="三类材料出问题的处理路径" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">出问题之后，处理难度对比</text><rect width="185" height="150" x="30" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="122" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">透明质酸</text><text x="122" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">可酶溶解</text><text x="122" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">多数情况相对可逆</text><text x="122" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">处理路径明确</text><text x="122" y="195" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">后悔成本：较低</text><rect width="185" height="150" x="227" y="55" fill="#f4ede0" stroke="#c9a876" rx="8"/><text x="320" y="85" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">肉毒杆菌素</text><text x="320" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">自行代谢消退</text><text x="320" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">等待数月即可</text><text x="320" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">多数可逆</text><text x="320" y="195" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">后悔成本：中（需等待）</text><rect width="185" height="150" x="424" y="55" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="516" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">再生刺激类</text><text x="516" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">难溶解、难取</text><text x="516" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">可能需手术</text><text x="516" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">处理漫长、可能反复</text><text x="516" y="195" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">后悔成本：高</text><text x="320" y="225" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">“维持久”和“出问题难处理”是同一枚硬币的两面</text></svg>