<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0301 desc0301">
  <title id="title0301">面诊该问的八类问题</title>
  <desc id="desc0301">必要性、安全、术式、效果预期、术后修复、资质六类面诊问题清单</desc>
  <defs>
    <linearGradient id="bg0301" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0301" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0301)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0301)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 03</text>
  <text x="62" y="117" class="title">面诊该问的八类问题</text>
  <text x="62" y="153" class="kicker">把面诊当术前体检，而不是购物询价</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 6张小卡，3列2行 -->
  <!-- 卡1：必要性 -->
  <rect x="62" y="210" width="252" height="143" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.8"/>
  <rect x="62" y="210" width="252" height="34" rx="14" fill="#0072B2"/>
  <rect x="62" y="232" width="252" height="12" fill="#0072B2"/>
  <text x="80" y="234" class="nodeTitle" fill="#ffffff">① 必要性</text>
  <text x="80" y="268" class="body">· 有没有不需手术的替代方案？</text>
  <text x="80" y="292" class="body">· 解决的是结构问题还是外观？</text>
  <text x="80" y="316" class="body">· 不做会怎样？</text>
  <text x="80" y="340" class="small" fill="#5c6c72">创伤更小的方案先考虑</text>

  <!-- 卡2：安全 -->
  <rect x="324" y="210" width="252" height="143" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8"/>
  <rect x="324" y="210" width="252" height="34" rx="14" fill="#E69F00"/>
  <rect x="324" y="232" width="252" height="12" fill="#E69F00"/>
  <text x="342" y="234" class="nodeTitle" fill="#ffffff">② 安全</text>
  <text x="342" y="268" class="body">· 我身上的主要风险是什么？</text>
  <text x="342" y="292" class="body">· 麻醉方式是什么，由谁实施？</text>
  <text x="342" y="316" class="body">· 紧急情况怎么处理和转诊？</text>
  <text x="342" y="340" class="small" fill="#5c6c72">术后在哪观察监护</text>

  <!-- 卡3：术式 -->
  <rect x="586" y="210" width="252" height="143" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.8"/>
  <rect x="586" y="210" width="252" height="34" rx="14" fill="#0072B2"/>
  <rect x="586" y="232" width="252" height="12" fill="#0072B2"/>
  <text x="604" y="234" class="nodeTitle" fill="#ffffff">③ 术式</text>
  <text x="604" y="268" class="body">· 具体术式是什么，为什么选它？</text>
  <text x="604" y="292" class="body">· 疤痕多长、多长时间淡化？</text>
  <text x="604" y="316" class="body">· 是否取骨、动骨质或植入物？</text>
  <text x="604" y="340" class="small" fill="#5c6c72">切口与材料都要问清</text>

  <!-- 卡4：效果预期 -->
  <rect x="62" y="363" width="252" height="143" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8"/>
  <rect x="62" y="363" width="252" height="34" rx="14" fill="#E69F00"/>
  <rect x="62" y="385" width="252" height="12" fill="#E69F00"/>
  <text x="80" y="387" class="nodeTitle" fill="#ffffff">④ 效果与预期</text>
  <text x="80" y="421" class="body">· 以我的解剖能达到什么程度？</text>
  <text x="80" y="445" class="body">· 哪些是不可保证的？</text>
  <text x="80" y="469" class="body">· 多久稳定，需配合哪些康复？</text>
  <text x="80" y="493" class="small" fill="#5c6c72">对称是相对的，不是绝对的</text>

  <!-- 卡5：术后修复 -->
  <rect x="324" y="363" width="252" height="143" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8"/>
  <rect x="324" y="363" width="252" height="34" rx="14" fill="#D55E00"/>
  <rect x="324" y="385" width="252" height="12" fill="#D55E00"/>
  <text x="342" y="387" class="nodeTitle" fill="#ffffff">⑤ 术后与修复</text>
  <text x="342" y="421" class="body">· 恢复期分几阶段，注意什么？</text>
  <text x="342" y="445" class="body">· 复诊几次，并发症处理另收费？</text>
  <text x="342" y="469" class="body">· 效果不理想或出问题怎么办？</text>
  <text x="342" y="493" class="small" fill="#5c6c72">修复路径问在术前</text>

  <!-- 卡6：资质 -->
  <rect x="586" y="363" width="252" height="143" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.8"/>
  <rect x="586" y="363" width="252" height="34" rx="14" fill="#0072B2"/>
  <rect x="586" y="385" width="252" height="12" fill="#0072B2"/>
  <text x="604" y="387" class="nodeTitle" fill="#ffffff">⑥ 资质核验</text>
  <text x="604" y="421" class="body">· 这个术式在您执业范围内吗？</text>
  <text x="604" y="445" class="body">· 您机构核准开展这一级别吗？</text>
  <text x="604" y="469" class="body">· 这是合理问题，专业医生不回避</text>
  <text x="604" y="493" class="small" fill="#5c6c72">合理问题不该被回避</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">好的面诊是双向选择，医生也在评估你是否合适</text>

  <text x="62" y="582" class="footer">医学教育示意 · 本文用于健康教育，不能替代面诊和个体化评估</text>
</svg>
