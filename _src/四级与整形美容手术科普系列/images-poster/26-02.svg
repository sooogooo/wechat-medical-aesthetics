<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2602 desc2602">
  <title id="title2602">先天性病变的六个决策考量维度</title>
  <desc id="desc2602">病变性质、功能风险、发育影响、心理影响、恶变风险、麻醉风险六个维度，需多学科协作</desc>
  <defs>
    <linearGradient id="bg2602" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2602" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .num { font: 700 24px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2602)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2602)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 26</text>
  <text x="62" y="117" class="title">先天性病变：六个决策维度</text>
  <text x="62" y="153" class="kicker">不是「等大了再切」或「立刻切掉」——需多维度权衡</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 6 张维度卡 3x2 -->
  <!-- 1 病变性质 -->
  <rect x="62" y="208" width="250" height="135" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="98" cy="243" r="20" fill="#0072B2"/>
  <text x="98" y="251" class="num" text-anchor="middle">1</text>
  <text x="128" y="249" class="nodeTitle">病变性质</text>
  <text x="82" y="288" class="body">会自行消退？还是不会？</text>
  <text x="82" y="312" class="body">有无并发症风险？</text>
  <text x="82" y="334" class="small">自然病程决定策略</text>

  <!-- 2 功能风险（红-优先） -->
  <rect x="325" y="208" width="250" height="135" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5"/>
  <circle cx="361" cy="243" r="20" fill="#D55E00"/>
  <text x="361" y="251" class="num" text-anchor="middle">2</text>
  <text x="391" y="249" class="nodeTitle">功能风险</text>
  <text x="345" y="288" class="body">眼周影响视力</text>
  <text x="345" y="312" class="body">气道影响呼吸</text>
  <text x="345" y="334" class="small">需早期干预，不能等</text>

  <!-- 3 发育影响 -->
  <rect x="588" y="208" width="250" height="135" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="624" cy="243" r="20" fill="#E69F00"/>
  <text x="624" y="251" class="num" text-anchor="middle">3</text>
  <text x="654" y="249" class="nodeTitle">发育影响</text>
  <text x="608" y="288" class="body">儿童期切除随生长变化</text>
  <text x="608" y="312" class="body">疤痕挛缩、不对称</text>
  <text x="608" y="334" class="small">时机需权衡</text>

  <!-- 4 心理影响 -->
  <rect x="62" y="358" width="250" height="135" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="98" cy="393" r="20" fill="#E69F00"/>
  <text x="98" y="401" class="num" text-anchor="middle">4</text>
  <text x="128" y="399" class="nodeTitle">心理影响</text>
  <text x="82" y="438" class="body">面部或暴露部位</text>
  <text x="82" y="462" class="body">影响社交</text>
  <text x="82" y="484" class="small">可择期学龄前处理</text>

  <!-- 5 恶变风险 -->
  <rect x="325" y="358" width="250" height="135" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="361" cy="393" r="20" fill="#D55E00"/>
  <text x="361" y="401" class="num" text-anchor="middle">5</text>
  <text x="391" y="399" class="nodeTitle">恶变风险</text>
  <text x="345" y="438" class="body">巨痣等需长期随访</text>
  <text x="345" y="462" class="body">必要时活检或预防切除</text>
  <text x="345" y="484" class="small">不能一律等待</text>

  <!-- 6 麻醉风险 -->
  <rect x="588" y="358" width="250" height="135" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="624" cy="393" r="20" fill="#E69F00"/>
  <text x="624" y="401" class="num" text-anchor="middle">6</text>
  <text x="654" y="399" class="nodeTitle">麻醉风险</text>
  <text x="608" y="438" class="body">儿童不是缩小成人</text>
  <text x="608" y="462" class="body">需小儿麻醉能力</text>
  <text x="608" y="484" class="small">机构资质很关键</text>

  <!-- 金句 -->
  <rect x="62" y="510" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="536" class="quote" text-anchor="middle">需多学科协作——皮肤科、整形、小儿外科、麻醉、影像、病理</text>

  <text x="62" y="568" class="small">不是所有病变都要立刻手术，也不是所有都能「等大了再说」</text>
  <text x="62" y="584" class="footer">医学教育示意 · 决策需具备多学科和小儿麻醉能力的机构评估</text>
</svg>
