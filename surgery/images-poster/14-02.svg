<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1402 desc1402">
  <title id="title1402">乳房缩小术的乳头坏死风险</title>
  <desc id="desc1402">乳头乳晕复合体上移距离越大、切除量越大，血供风险越高，是缩乳术最严重并发症之一</desc>
  <defs>
    <linearGradient id="bg1402" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1402" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
      .warn { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#D55E00; }
      .axis { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1402)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1402)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 14</text>
  <text x="62" y="117" class="title">缩乳术最严重的并发症：乳头坏死</text>
  <text x="62" y="153" class="kicker">上移距离与切除量越大，血供风险越高</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左侧：风险递增图示 -->
  <text x="62" y="216" class="nodeTitle">风险随切除量递增</text>
  <rect x="62" y="230" width="400" height="270" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>

  <!-- 阶梯式风险递增 -->
  <rect x="92" y="430" width="100" height="50" rx="8" fill="#56B4E9" stroke="#0072B2"/>
  <text x="142" y="452" class="body" text-anchor="middle">轻度</text>
  <text x="142" y="470" class="small" text-anchor="middle">切除量小</text>

  <rect x="202" y="395" width="100" height="85" rx="8" fill="#E69F00" stroke="#E69F00"/>
  <text x="252" y="430" class="body" text-anchor="middle" style="fill:#ffffff">中度</text>
  <text x="252" y="450" class="small" text-anchor="middle" style="fill:#ffffff">中等切除</text>

  <rect x="312" y="350" width="130" height="130" rx="8" fill="#D55E00" stroke="#D55E00"/>
  <text x="377" y="395" class="body" text-anchor="middle" style="fill:#ffffff">重度</text>
  <text x="377" y="418" class="small" text-anchor="middle" style="fill:#ffffff">大量切除</text>
  <text x="377" y="438" class="small" text-anchor="middle" style="fill:#ffffff">上移距离大</text>

  <!-- 上升箭头 -->
  <path d="M 142 425 Q 250 360 377 340" stroke="#D55E00" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
  <path d="M 370 333 L 377 340 L 367 343" fill="none" stroke="#D55E00" stroke-width="2"/>
  <text x="250" y="320" class="warn" text-anchor="middle">血供风险升高</text>

  <!-- 底部说明 -->
  <rect x="82" y="490" width="360" height="0" rx="0"/>

  <!-- 右侧：风险条目与对策 -->
  <text x="490" y="216" class="nodeTitle">必须正视的并发症</text>
  <rect x="490" y="230" width="348" height="270" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>

  <circle cx="516" cy="265" r="5" fill="#D55E00"/>
  <text x="534" y="270" class="body">乳头乳晕坏死（部分或全部）</text>

  <circle cx="516" cy="295" r="5" fill="#E69F00"/>
  <text x="534" y="300" class="body">感觉减退或丧失（部分可恢复）</text>

  <circle cx="516" cy="325" r="5" fill="#E69F00"/>
  <text x="534" y="330" class="body">哺乳障碍（损伤导管与神经）</text>

  <circle cx="516" cy="355" r="5" fill="#E69F00"/>
  <text x="534" y="360" class="body">不对称 · 形态不满意</text>

  <circle cx="516" cy="385" r="5" fill="#5c6c72"/>
  <text x="534" y="390" class="body">出血 · 血肿 · 感染 · 脂肪坏死</text>

  <circle cx="516" cy="415" r="5" fill="#5c6c72"/>
  <text x="534" y="420" class="body">深静脉血栓 · 切口延迟愈合</text>

  <rect x="510" y="445" width="308" height="42" rx="8" fill="#fdf3e3"/>
  <text x="664" y="464" class="small" text-anchor="middle">乳头坏死风险与术者经验密切相关</text>
  <text x="664" y="481" class="small" text-anchor="middle">有经验的医生比便宜的机构更重要</text>

  <!-- 金句 -->
  <rect x="62" y="515" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="541" class="quote" text-anchor="middle">缩乳是四级手术，资质门槛高——选择比价格更重要</text>

  <text x="62" y="582" class="footer">医学教育示意 · 风险发生率因术式与个体而异 · 须有四级资质机构开展</text>
</svg>
