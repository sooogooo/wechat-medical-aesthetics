<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="面部高危注射区域示意图">
  <rect width="400" height="460" fill="#faf8f4" rx="12"/>
  <text x="200" y="28" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">面部高危注射区域（示意）</text>

  <!-- 简化面部轮廓 -->
  <ellipse cx="200" cy="220" rx="95" ry="130" fill="#ffffff" stroke="#ddd6ca" stroke-width="1.5"/>
  <!-- 眼睛 -->
  <ellipse cx="168" cy="190" rx="11" ry="6" fill="none" stroke="#a8a39d" stroke-width="1"/>
  <ellipse cx="232" cy="190" rx="11" ry="6" fill="none" stroke="#a8a39d" stroke-width="1"/>
  <!-- 鼻子 -->
  <path d="M 200 200 L 194 250 Q 200 256 206 250 Z" fill="none" stroke="#a8a39d" stroke-width="1"/>
  <!-- 嘴 -->
  <path d="M 178 285 Q 200 292 222 285" fill="none" stroke="#a8a39d" stroke-width="1"/>

  <!-- 高危区域标注（陶土红虚线圈） -->
  <!-- 鼻部 -->
  <ellipse cx="200" cy="230" rx="18" ry="40" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="200" y="160" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">鼻部</text>

  <!-- 眉间 -->
  <ellipse cx="200" cy="172" rx="16" ry="10" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- 额头 -->
  <ellipse cx="200" cy="130" rx="55" ry="22" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- 泪沟/眶下 -->
  <ellipse cx="160" cy="210" rx="14" ry="10" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <ellipse cx="240" cy="210" rx="14" ry="10" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- 鼻唇沟 -->
  <ellipse cx="158" cy="262" rx="12" ry="18" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <ellipse cx="242" cy="262" rx="12" ry="18" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- 图例 -->
  <rect x="40" y="380" width="320" height="60" rx="6" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="65" cy="402" rx="10" ry="6" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="85" y="406" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">高危区域：血管密集或与眼动脉交通</text>
  <text x="85" y="426" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">这些区域注射需格外谨慎，操作者解剖功底至关重要</text>

  <text x="200" y="450" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">图为示意，实际血管走行个体差异大；不标注 = 非安全区，所有注射都有风险</text>
</svg>