<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t41f2 d41f2" role="img" viewBox="0 0 800 500"><title id="t41f2">光老化的分层干预思路</title><desc id="d41f2">从防晒基底到色素血管到质地到轮廓的分层治疗思路</desc><defs><linearGradient id="bg41f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh41f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.layer{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg41f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh41f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 41</text><text x="52" y="92" class="title">分层干预思路</text><text x="52" y="116" class="kicker">不同问题对应不同手段，组合而非堆砌</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">从地基到表层，逐层处理</text><rect width="696" height="56" x="52" y="340" fill="#5F6E54" rx="10"/><text x="68" y="362" class="layer">基底</text><text x="68" y="384" class="layer" font-size="12">防晒 · 保湿 · 生活方式</text><text x="540" y="376" class="layer" text-anchor="start">SPF30+ 广谱防晒、戒烟、规律作息</text><rect width="628" height="56" x="120" y="280" fill="#7A8B6F" rx="10"/><text x="136" y="302" class="layer">质地</text><text x="136" y="324" class="layer" font-size="12">粗糙 · 细纹</text><text x="500" y="316" class="layer" text-anchor="start">外用维A酸、果酸焕肤、光电嫩肤</text><rect width="560" height="56" x="188" y="220" fill="#C9A876" rx="10"/><text x="204" y="242" class="layer">色素 · 血管</text><text x="204" y="264" class="layer" font-size="12">斑点 · 红血丝</text><text x="500" y="256" class="layer" text-anchor="start">淡斑激光、光电封血管、对症外用药</text><rect width="492" height="56" x="256" y="160" fill="#B5654A" rx="10"/><text x="272" y="182" class="layer">轮廓 · 松弛</text><text x="272" y="204" class="layer" font-size="12">下垂 · 深纹</text><text x="500" y="196" class="layer" text-anchor="start">射频超声、注射、手术评估</text><text x="52" y="180" class="small">越往上</text><text x="52" y="200" class="small">风险与成本</text><text x="52" y="220" class="small">递增</text><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 70 230 L 70 380"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 64 374 L 70 380 L 76 374"/><rect width="696" height="24" x="52" y="404" fill="#fbf0eb" stroke="#B5654A" rx="8"/><text x="400" y="421" class="small" text-anchor="middle">出现新发、增大、易出血的斑点须先排查癌前病变与皮肤肿瘤</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">没有万能项目，按问题组合才合理</text><text x="52" y="466" class="footer">健康科普示意 · 治疗方案须由医师面诊后制定</text></svg>