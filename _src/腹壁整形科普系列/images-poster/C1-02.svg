<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="titleC102 descC102" role="img" viewBox="0 0 900 620"><title id="titleC102">疤痕的成熟过程与管理</title><desc id="descC102">疤痕成熟四阶段与可用的管理措施</desc><defs><marker id="ahC102" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#b7c6cb" d="M0,0 L10,5 L0,10 z"/></marker><style>.series{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.8px;fill:#7d97a4}.title{font:300 32px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.kicker{font:400 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.nodeTitle{font:500 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.body{font:400 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#4a5a60}.small{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.quote{font:400 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.footer{font:400 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#93a3a8}</style></defs><rect width="899" height="619" x=".5" y=".5" fill="#fff" stroke="#dde5e7" stroke-width="1"/><text x="62" y="64" class="series">腹壁整形 12 讲 · C1</text><text x="62" y="112" class="title">疤痕的成熟过程与管理</text><text x="62" y="148" class="kicker">从发红发硬到变淡变软，需要一年以上</text><line x1="62" x2="838" y1="172" y2="172" stroke="#e3e9ea" stroke-width="1"/><rect width="172" height="150" x="62" y="205" fill="none" stroke="#C75B00" stroke-width="1.2" rx="10"/><circle cx="102" cy="241" r="17" fill="none" stroke="#C75B00" stroke-width="1.2"/><text x="102" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" text-anchor="middle" style="fill:#c75b00">1</text><text x="132" y="247" class="nodeTitle">数周</text><text x="84" y="283" class="body">发红、发硬、略隆起</text><text x="84" y="309" class="body">可能痒、痛</text><line x1="238" x2="256" y1="280" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahC102)"/><rect width="172" height="150" x="260" y="205" fill="none" stroke="#D9930D" stroke-width="1.2" rx="10"/><circle cx="300" cy="241" r="17" fill="none" stroke="#D9930D" stroke-width="1.2"/><text x="300" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" text-anchor="middle" style="fill:#d9930d">2</text><text x="330" y="247" class="nodeTitle">数月</text><text x="282" y="283" class="body">可能进入增生期</text><text x="282" y="309" class="body">更红、更厚、更硬</text><line x1="436" x2="454" y1="280" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahC102)"/><rect width="172" height="150" x="458" y="205" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="10"/><circle cx="498" cy="241" r="17" fill="none" stroke="#56B4E9" stroke-width="1.2"/><text x="498" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" text-anchor="middle" style="fill:#56b4e9">3</text><text x="528" y="247" class="nodeTitle">半年～1 年</text><text x="480" y="283" class="body">颜色逐渐变淡</text><text x="480" y="309" class="body">变软、变平</text><line x1="634" x2="652" y1="280" y2="280" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahC102)"/><rect width="172" height="150" x="656" y="205" fill="none" stroke="#0072B2" stroke-width="1.2" rx="10"/><circle cx="696" cy="241" r="17" fill="none" stroke="#0072B2" stroke-width="1.2"/><text x="696" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" text-anchor="middle" style="fill:#0072b2">4</text><text x="726" y="247" class="nodeTitle">最终</text><text x="678" y="283" class="body">一条淡色的线</text><text x="678" y="309" class="body">但不会消失</text><text x="62" y="396" class="small">能做的事，让疤不那么糟</text><rect width="178" height="44" x="62" y="410" fill="none" stroke="#0B8A6B" stroke-width="1.2" rx="9"/><text x="151" y="437" class="small" text-anchor="middle">精细缝合与减张</text><rect width="178" height="44" x="254" y="410" fill="none" stroke="#0B8A6B" stroke-width="1.2" rx="9"/><text x="343" y="437" class="small" text-anchor="middle">硅酮凝胶或贴片数月</text><rect width="178" height="44" x="446" y="410" fill="none" stroke="#0B8A6B" stroke-width="1.2" rx="9"/><text x="535" y="437" class="small" text-anchor="middle">防晒至少一年</text><rect width="178" height="44" x="638" y="410" fill="none" stroke="#0B8A6B" stroke-width="1.2" rx="9"/><text x="727" y="437" class="small" text-anchor="middle">必要时注射或激光</text><line x1="62" x2="838" y1="520" y2="520" stroke="#e3e9ea" stroke-width="1"/><text x="450" y="548" class="quote" text-anchor="middle">疤痕管理是改善，不是消除</text><text x="62" y="580" class="footer">医学教育示意 · 瘢痕管理方案遵主刀与专科医嘱</text></svg>