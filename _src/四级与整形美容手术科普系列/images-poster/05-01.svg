<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0501 desc0501" role="img" viewBox="0 0 900 620"><title id="title0501">动四级手术前先问自己的五个问题</title><desc id="desc0501">诉求、承受底线、他人压力、紧迫性、半效接受度五问，分清想做与该做</desc><defs><linearGradient id="bg0501" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0501" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0501)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0501)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 05</text><text x="62" y="117" class="title">动四级手术前先问自己的五个问题</text><text x="62" y="153" class="kicker">面诊前安静回答，比看一百张案例图更有用</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="776" height="56" x="62" y="205" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.8" rx="12"/><circle cx="100" cy="233" r="20" fill="#0072B2"/><text x="100" y="242" class="num" font-size="22" text-anchor="middle">1</text><text x="134" y="228" class="nodeTitle">我的诉求是具体的结构问题，还是笼统的&quot;不自信&quot;？</text><text x="134" y="250" class="small">手术解决结构问题，解决不了人生困境</text><rect width="776" height="56" x="62" y="269" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.8" rx="12"/><circle cx="100" cy="297" r="20" fill="#0072B2"/><text x="100" y="306" class="num" font-size="22" text-anchor="middle">2</text><text x="134" y="292" class="nodeTitle">如果效果只达到预期的一半，我还能接受吗？</text><text x="134" y="314" class="small">不能接受，说明预期本身可能过高</text><rect width="776" height="56" x="62" y="333" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8" rx="12"/><circle cx="100" cy="361" r="20" fill="#E69F00"/><text x="100" y="370" class="num" font-size="22" text-anchor="middle">3</text><text x="134" y="356" class="nodeTitle">我能承受多长恢复期、多大疤痕、可能的并发症和二次手术？</text><text x="134" y="378" class="small">这是承受力的真实底线</text><rect width="776" height="56" x="62" y="397" fill="#fff8ee" stroke="#E69F00" stroke-width="1.8" rx="12"/><circle cx="100" cy="425" r="20" fill="#E69F00"/><text x="100" y="434" class="num" font-size="22" text-anchor="middle">4</text><text x="134" y="420" class="nodeTitle">这是我自己想做的决定，还是为某段关系、某个场合、某种压力？</text><text x="134" y="442" class="small">为他人而做的不可逆手术，事后容易后悔</text><rect width="776" height="56" x="62" y="461" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8" rx="12"/><circle cx="100" cy="489" r="20" fill="#D55E00"/><text x="100" y="498" class="num" font-size="22" text-anchor="middle">5</text><text x="134" y="484" class="nodeTitle">如果今天不做，半年后我会怎样？</text><text x="134" y="506" class="small">影响不大说明不紧迫，值得再缓一缓</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">这五问不是劝你不做，而是帮你分清&quot;想做&quot;和&quot;该做&quot;</text><text x="62" y="582" class="footer">医学教育示意 · 本文用于健康教育，不能替代面诊和必要的心理评估</text></svg>