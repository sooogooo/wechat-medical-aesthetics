<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t14f2 d14f2" role="img" viewBox="0 0 800 500"><title id="t14f2">先天性青斑家庭护理与记录</title><desc id="d14f2">家庭护理非常简单，新生儿阶段先写进健康记录</desc><defs><linearGradient id="bg14f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh14f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg14f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh14f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 14</text><text x="56" y="90" class="title">既然会退 为什么还有人做激光</text><text x="56" y="116" class="kicker">家庭护理非常简单，记录比治疗更重要</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">两种处理路径</text><rect width="335" height="140" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="174" fill="#7A8B6F" rx="12"/><rect width="335" height="10" x="56" y="192" fill="#7A8B6F"/><text x="72" y="193" class="tag">观察等待 多数选择</text><text x="72" y="226" class="body">记录位置和范围</text><text x="72" y="250" class="body">定期拍照对比</text><text x="72" y="274" class="body">正常洗澡护肤</text><text x="72" y="298" class="small">无需特殊产品</text><rect width="335" height="140" x="409" y="174" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="174" fill="#C9A876" rx="12"/><rect width="335" height="10" x="409" y="192" fill="#C9A876"/><text x="425" y="193" class="tag">激光 少数情况</text><text x="425" y="226" class="body">持续不退影响外观</text><text x="425" y="250" class="body">大龄儿童仍未淡化</text><text x="425" y="274" class="body">需评估反黑风险</text><text x="425" y="298" class="small">非典型位置时更谨慎</text><text x="56" y="346" class="nodeTitle">新生儿阶段先写进健康记录</text><rect width="688" height="62" x="56" y="360" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="76" y="384" class="body" font-weight="700">出生日期 位置 范围 颜色深浅</text><text x="76" y="406" class="small">每隔半年到一年在相同光线条件下拍照，便于医生判断是否在自然消退</text><rect width="688" height="36" x="56" y="432" fill="#eef4ee" rx="10"/><text x="400" y="455" class="quote" text-anchor="middle">就诊时用中性语言描述，不把它当成淤青或伤痕</text><text x="56" y="474" class="footer">医学教育示意 · 不典型不等于危险，但值得确认</text></svg>