<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2102 desc2102" role="img" viewBox="0 0 900 620"><title id="title2102">除皱术的几类必须正视的风险</title><desc id="desc2102">面神经损伤、皮瓣坏死、血肿、瘢痕、效果不持久等除皱术风险要点</desc><defs><linearGradient id="bg2102" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2102" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.num{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2102)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2102)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 21</text><text x="62" y="117" class="title">除皱术必须正视的几类风险</text><text x="62" y="153" class="kicker">它是真正的外科手术，不是「无创微调」</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="250" height="135" x="62" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="100" cy="245" r="20" fill="#D55E00"/><text x="100" y="253" class="num" text-anchor="middle">1</text><text x="132" y="251" class="nodeTitle">面神经损伤</text><text x="82" y="288" class="body">分支走行于术区</text><text x="82" y="312" class="body">可致表情不对称</text><text x="82" y="334" class="small">与术者解剖功底直接相关</text><rect width="250" height="135" x="325" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="363" cy="245" r="20" fill="#D55E00"/><text x="363" y="253" class="num" text-anchor="middle">2</text><text x="395" y="251" class="nodeTitle">皮瓣坏死</text><text x="345" y="288" class="body">耳后皮瓣血供脆弱</text><text x="345" y="312" class="body">吸烟者风险显著升高</text><text x="345" y="334" class="small">愈合不良多见于此</text><rect width="250" height="135" x="588" y="210" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="626" cy="245" r="20" fill="#E69F00"/><text x="626" y="253" class="num" text-anchor="middle">3</text><text x="658" y="251" class="nodeTitle">血肿</text><text x="608" y="288" class="body">术后出血积聚</text><text x="608" y="312" class="body">较大者需手术清除</text><text x="608" y="334" class="small">较常见并发症之一</text><rect width="250" height="135" x="62" y="362" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="100" cy="397" r="20" fill="#E69F00"/><text x="100" y="405" class="num" text-anchor="middle">4</text><text x="132" y="403" class="nodeTitle">瘢痕 · 脱发</text><text x="82" y="440" class="body">耳前耳后颞部留疤</text><text x="82" y="464" class="body">可能增生变宽</text><text x="82" y="486" class="small">颞部切口或致局部脱发</text><rect width="250" height="135" x="325" y="362" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="363" cy="397" r="20" fill="#E69F00"/><text x="363" y="405" class="num" text-anchor="middle">5</text><text x="395" y="403" class="nodeTitle">不对称 · 形态</text><text x="345" y="440" class="body">左右差异</text><text x="345" y="464" class="body">耳垂耳位改变</text><text x="345" y="486" class="small">耳周感觉可能长期改变</text><rect width="250" height="135" x="588" y="362" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="626" cy="397" r="20" fill="#0072B2"/><text x="626" y="405" class="num" text-anchor="middle">6</text><text x="658" y="403" class="nodeTitle">效果不持久</text><text x="608" y="440" class="body">维持约数年到十年</text><text x="608" y="464" class="body">不能阻止继续老化</text><text x="608" y="486" class="small">拨回时钟，时钟仍会走</text><rect width="776" height="40" x="62" y="525" fill="#fbeae3" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">承诺「无痕拉皮」「永久年轻」「零风险」的，不值得信任</text><text x="62" y="582" class="footer">医学教育示意 · 具体风险与发生概率以面诊告知为准</text></svg>