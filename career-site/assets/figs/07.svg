<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c9a876"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#c9a876"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">你的大厂能力清单</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">资产与负资产常是同一种能力的一体两面</text>

  <path d="M400 118 L400 300 M310 300 L490 300" fill="none" stroke="#2b2a28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 150 L250 220" fill="none" stroke="#2b2a28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M470 150 L550 220" fill="none" stroke="#2b2a28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="180" y1="224" x2="320" y2="224" stroke="#2b2a28" stroke-width="1.8"/><line x1="480" y1="224" x2="620" y2="224" stroke="#2b2a28" stroke-width="1.8"/>
  <rect x="560" y="300" width="160" height="14" rx="4" fill="#2b2a28"/>
  <rect x="160" y="110" width="190" height="108" rx="8" fill="#f4ede0" stroke="#e4ddd2" stroke-width="1.4"/>
  <text x="255" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" fill="#c9a876" font-weight="600" text-anchor="middle">可迁移资产</text>
  <text x="255" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">数据治理 · 内容 IP</text>
  <text x="255" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">流量实操 · 流程 SOP</text>
  <text x="255" y="205" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#c9a876" text-anchor="middle">有人买单</text>
  <rect x="450" y="110" width="190" height="108" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="545" y="136" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" fill="#6b6864" font-weight="600" text-anchor="middle">负资产</text>
  <text x="545" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">流量万能 · 方法论优越感</text>
  <text x="545" y="181" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6b6864" text-anchor="middle">制度信任 · 快迭代</text>
  <text x="545" y="205" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d" text-anchor="middle">以正确感面目出现</text>
  <text x="400" y="345" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#c9a876" text-anchor="middle">支点是嘴与手的结构</text>
  <text x="400" y="372" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864" text-anchor="middle">同一种能力，站对是资产，站错是负资产</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">分界不在于你有什么，在于是否接受嘴与手的结构</text>
