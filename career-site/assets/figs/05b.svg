<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 430"><rect width="800" height="430" x="0" y="0" fill="#fffdf9"/><rect width="752" height="382" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="96" height="30" x="46" y="40" fill="#2f4858" rx="15"/><text x="94" y="60" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle">翻 译 器</text><rect width="200" height="30" x="170" y="40" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="15"/><text x="270" y="60" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">行业早期＝红利窗口</text><text x="392" y="61" fill="#2f4858" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">⟶</text><rect width="200" height="30" x="412" y="40" fill="#edf1f4" stroke="#2f4858" stroke-width="1.4" rx="15"/><text x="512" y="60" fill="#2f4858" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">医美的四十年</text><rect width="708" height="84" x="46" y="104" fill="#f5f7f0" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><rect width="6" height="84" x="46" y="104" fill="#7a8b6f" rx="3"/><text x="74" y="138" fill="#7a8b6f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600">直译 · 成立处</text><text x="74" y="166" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5">不成熟确实意味着空白与位置，机会真实存在</text><rect width="708" height="84" x="46" y="204" fill="#faf3f0" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><rect width="6" height="84" x="46" y="204" fill="#b5654a" rx="3"/><text x="74" y="238" fill="#b5654a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600">失真处</text><text x="74" y="266" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5">不成熟已持续四十年，监管整治是周期性天气</text><rect width="708" height="84" x="46" y="304" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><rect width="6" height="84" x="46" y="304" fill="#2b2a28" rx="3"/><text x="74" y="338" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600">大厂人的典型错误</text><text x="74" y="366" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5">把行业落后当成自己的降维打击机会</text><text x="46" y="394" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">类比在哪里成立、在哪里失效，看见边界再动手</text></svg>