<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t26 d26">
  <title id="t26">额头鼻子的“中间凹小黄包”</title>
  <desc id="d26">皮脂腺增生别当痘挤，先排除基底细胞癌</desc>
  <defs>
    <linearGradient id="bg26" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh26" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
    .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
    .title  { font: 700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5F6E54; }
    .nodeT  { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .nodeT2 { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .body   { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
    .small  { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
    .tiny   { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    .quote  { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
    .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    .num    { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
    .badge  { font: 700 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:0.6px; }
</style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg26)"/>
  <rect x="26" y="24" width="748" height="452" rx="18" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh26)"/>
  <!-- header -->
  <text x="48" y="58" class="series">皮肤病症科普 · 26</text>
  <text x="48" y="92" class="title">额头鼻子的“中间凹小黄包”</text>
  <text x="48" y="116" class="kicker">皮脂腺增生别当痘挤，先排除基底细胞癌</text>
  <line x1="48" y1="134" x2="752" y2="134" stroke="#dce8e8"/>
  <!-- body -->
  
  <text x="48" y="168" class="nodeT">重要的鉴别，是别漏掉皮肤肿瘤</text>
  
  <rect x="48" y="188" width="220" height="170" rx="12" fill="#fbfdfc" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="48" y="188" width="220" height="28" rx="12" fill="#7A8B6F"/>
  <rect x="48" y="206" width="220" height="10" fill="#7A8B6F"/>
  <text x="158" y="208" class="nodeT2" text-anchor="middle" fill="#ffffff">皮脂腺增生</text>
  <text x="158" y="238" class="body" text-anchor="middle">淡黄肤色小丘疹</text>
  <text x="158" y="256" class="small" text-anchor="middle">中央小凹，多发面中</text>
  
  <rect x="290" y="188" width="220" height="170" rx="12" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="290" y="188" width="220" height="28" rx="12" fill="#B5654A"/>
  <rect x="290" y="206" width="220" height="10" fill="#B5654A"/>
  <text x="400" y="208" class="nodeT2" text-anchor="middle" fill="#ffffff">基底细胞癌</text>
  <text x="400" y="238" class="body" text-anchor="middle">珍珠样隆起</text>
  <text x="400" y="256" class="small" text-anchor="middle">毛细血管扩张，可溃疡</text>
  
  <rect x="532" y="188" width="220" height="170" rx="12" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="532" y="188" width="220" height="28" rx="12" fill="#C9A876"/>
  <rect x="532" y="206" width="220" height="10" fill="#C9A876"/>
  <text x="642" y="208" class="nodeT2" text-anchor="middle" fill="#ffffff">寻常痤疮</text>
  <text x="642" y="238" class="body" text-anchor="middle">粉刺脓疱</text>
  <text x="642" y="256" class="small" text-anchor="middle">有阶段变化，可挤出脂栓</text>
  <text x="400" y="395" class="small" text-anchor="middle">外观相似但风险完全不同，诊断不清应活检</text>
  
  <rect x="48" y="410" width="704" height="28" rx="10" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity="0.35"/>
  <text x="400" y="429" class="quote" text-anchor="middle">多数是良性，但相似时必须专业鉴别</text>
  
  <!-- footer -->
  <text x="48" y="462" class="footer">医学教育示意 · 中央小凹陷有提示，但不是免检通行证</text>
</svg>
