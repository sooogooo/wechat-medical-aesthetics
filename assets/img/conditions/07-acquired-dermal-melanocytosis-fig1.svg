<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t07f1 d07f1" role="img" viewBox="0 0 800 500"><title id="t07f1">颧部褐青色痣与黄褐斑鉴别</title><desc id="d07f1">同为面颊褐斑机制不同，褐青色痣色素在真皮深层</desc><defs><linearGradient id="bg07f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh07f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg07f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh07f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 07</text><text x="56" y="90" class="title">颧部褐青色痣 还是黄褐斑</text><text x="56" y="116" class="kicker">同为面颊褐斑机制不同，治疗前先把病名分清</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">两者对照</text><rect width="335" height="180" x="56" y="174" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6" rx="12"/><rect width="335" height="30" x="56" y="174" fill="#8a6a3a" rx="12"/><rect width="335" height="10" x="56" y="194" fill="#8a6a3a"/><text x="72" y="195" class="tag">颧部褐青色痣</text><text x="72" y="226" class="body">成年后出现 双侧颧部</text><text x="72" y="250" class="body">散在灰褐或蓝灰小斑</text><text x="72" y="274" class="body">色素位于真皮深层</text><text x="72" y="298" class="body">护肤品常够不着</text><text x="72" y="332" class="small">多需调Q或皮秒激光多次</text><rect width="335" height="180" x="409" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="335" height="30" x="409" y="174" fill="#7A8B6F" rx="12"/><rect width="335" height="10" x="409" y="194" fill="#7A8B6F"/><text x="425" y="195" class="tag">黄褐斑</text><text x="425" y="226" class="body">对称片状褐色斑</text><text x="425" y="250" class="body">边界较模糊 范围较大</text><text x="425" y="274" class="body">色素以表皮为主</text><text x="425" y="298" class="body">日晒和可见光加重</text><text x="425" y="332" class="small">外用药与防晒先行</text><text x="56" y="378" class="nodeTitle">两者可并存，需医生鉴别</text><rect width="688" height="44" x="56" y="390" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.4" rx="10"/><text x="400" y="410" class="body" font-weight="700" text-anchor="middle">反黑不是一句亚洲人都会就能带过</text><text x="400" y="426" class="small" text-anchor="middle">混合色斑需分区处理，追着颜色加码是疗程中最易犯的错</text><rect width="688" height="20" x="56" y="442" fill="#eef4ee" rx="8"/><text x="400" y="456" class="quote" font-size="14" text-anchor="middle">设定现实终点，比追求零斑更重要</text><text x="56" y="472" class="footer">医学教育示意 · 诊断不只看一张自拍，需皮肤科面诊</text></svg>