<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="协作的四个环节">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">协作的四个环节</text>

  <rect x="30" y="60" width="140" height="190" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <circle cx="100" cy="95" r="14" fill="#7a8b6f"/>
  <text x="100" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#ffffff">1</text>
  <text x="100" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">你说诉求</text>
  <text x="100" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">具体问题</text>
  <text x="100" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不是&quot;变好看&quot;</text>
  <text x="100" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">你主导</text>

  <rect x="180" y="60" width="140" height="190" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <circle cx="250" cy="95" r="14" fill="#7a8b6f"/>
  <text x="250" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#ffffff">2</text>
  <text x="250" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">医生评估</text>
  <text x="250" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">解剖基础</text>
  <text x="250" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">可行方案</text>
  <text x="250" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">医生主导</text>

  <rect x="330" y="60" width="140" height="190" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <circle cx="400" cy="95" r="14" fill="#7a8b6f"/>
  <text x="400" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#ffffff">3</text>
  <text x="400" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">共同讨论</text>
  <text x="400" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">权衡利弊</text>
  <text x="400" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">设预期与边界</text>
  <text x="400" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">双方共同</text>

  <rect x="480" y="60" width="140" height="190" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <circle cx="550" cy="95" r="14" fill="#7a8b6f"/>
  <text x="550" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#ffffff">4</text>
  <text x="550" y="135" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">你做决定</text>
  <text x="550" y="165" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">知情同意</text>
  <text x="550" y="183" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">或拒绝</text>
  <text x="550" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">你主导</text>

  <text x="320" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">主导师与患者在不同环节切换主导——这才是真正的&quot;协作&quot;</text>
</svg>