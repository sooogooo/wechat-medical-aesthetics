<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t45f2 d45f2" role="img" viewBox="0 0 800 500"><title id="t45f2">皮肤淀粉样变的管理要点</title><desc id="d45f2">止痒减少摩擦保湿防晒与长期随访的管理清单</desc><defs><linearGradient id="bg45f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh45f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg45f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh45f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 45</text><text x="52" y="92" class="title">管理重点是长期控制</text><text x="52" y="116" class="kicker">没有一劳永逸，止痒、减摩、随访是核心</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="340" height="34" x="52" y="150" fill="#5F6E54" rx="8"/><text x="222" y="172" class="nodeTitle" text-anchor="middle">第一要务 止痒</text><rect width="340" height="116" x="52" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="68" cy="214" r="3" fill="#5F6E54"/><text x="80" y="218" class="body">外用止痒药（医师处方）</text><circle cx="68" cy="242" r="3" fill="#5F6E54"/><text x="80" y="246" class="body">必要时口服抗组胺</text><circle cx="68" cy="270" r="3" fill="#5F6E54"/><text x="80" y="274" class="body">局部封包促渗、湿敷</text><circle cx="68" cy="296" r="3" fill="#5F6E54"/><text x="80" y="300" class="small">剧痒难忍者可考虑光电</text><rect width="340" height="34" x="408" y="150" fill="#C9A876" rx="8"/><text x="578" y="172" class="nodeTitle" text-anchor="middle">减少摩擦</text><rect width="340" height="116" x="408" y="188" fill="#fbf5ea" stroke="#C9A876" rx="10"/><circle cx="424" cy="214" r="3" fill="#C9A876"/><text x="436" y="218" class="body">剪短指甲，避免抓破</text><circle cx="424" cy="242" r="3" fill="#C9A876"/><text x="436" y="246" class="body">穿宽松柔软衣物</text><circle cx="424" cy="270" r="3" fill="#C9A876"/><text x="436" y="274" class="body">避免搓澡、丝瓜络摩擦</text><circle cx="424" cy="296" r="3" fill="#C9A876"/><text x="436" y="300" class="small">夜间可戴棉手套入睡</text><rect width="340" height="34" x="52" y="314" fill="#7A8B6F" rx="8"/><text x="222" y="336" class="nodeTitle" text-anchor="middle">修复屏障</text><rect width="340" height="74" x="52" y="352" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="68" cy="378" r="3" fill="#5F6E54"/><text x="80" y="382" class="body">温和清洁、足量保湿</text><circle cx="68" cy="404" r="3" fill="#5F6E54"/><text x="80" y="408" class="small">洗澡水温不过高、时间不过长</text><rect width="340" height="34" x="408" y="314" fill="#B5654A" rx="8"/><text x="578" y="336" class="nodeTitle" text-anchor="middle">长期随访</text><rect width="340" height="74" x="408" y="352" fill="#fbf0eb" stroke="#B5654A" rx="10"/><circle cx="424" cy="378" r="3" fill="#B5654A"/><text x="436" y="382" class="body">定期复诊评估变化</text><circle cx="424" cy="404" r="3" fill="#B5654A"/><text x="436" y="408" class="small">出现新发、增大、破溃须及时面诊</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">抓得越狠，长得越厚</text><text x="52" y="466" class="footer">健康科普示意 · 用药与系统评估须由皮肤科医师进行</text></svg>