<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2601 desc2601" role="img" viewBox="0 0 900 620"><title id="title2601">婴幼儿血管瘤 vs 血管畸形：两类不同疾病</title><desc id="desc2601">血管瘤是肿瘤性多数可消退，血管畸形是畸形性不会消退，处理原则完全不同</desc><defs><linearGradient id="bg2601" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2601" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff;letter-spacing:1px}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2601)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2601)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 26</text><text x="62" y="117" class="title">血管瘤 vs 血管畸形：关键区分</text><text x="62" y="153" class="kicker">两类不同疾病，处理原则完全不同——混淆会导致错误决策</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">先看本质区别</text><rect width="386" height="280" x="62" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="16"/><rect width="386" height="44" x="62" y="232" fill="#0072B2" rx="16"/><rect width="386" height="14" x="62" y="262" fill="#0072B2"/><text x="255" y="261" class="tag" text-anchor="middle">婴幼儿血管瘤 · 肿瘤性</text><text x="82" y="306" class="body">出生后数周出现</text><text x="82" y="333" class="body">增生期：数月内快速增大</text><text x="82" y="360" class="body">消退期：数年内逐渐消退</text><text x="82" y="387" class="body">多数可自行消退</text><rect width="346" height="86" x="82" y="410" fill="#eef6f8" rx="8"/><text x="255" y="434" class="small" text-anchor="middle">功能部位（眼周、气道、肝脏）</text><text x="255" y="454" class="small" text-anchor="middle">或大面积者需早期药物（如普萘洛尔）</text><text x="255" y="474" class="small" text-anchor="middle">或激光干预</text><rect width="370" height="280" x="468" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5" rx="16"/><rect width="370" height="44" x="468" y="232" fill="#D55E00" rx="16"/><rect width="370" height="14" x="468" y="262" fill="#D55E00"/><text x="653" y="261" class="tag" text-anchor="middle">血管畸形 · 畸形性</text><text x="488" y="306" class="body">静脉、淋巴管、动静脉畸形</text><text x="488" y="333" class="body">不会自行消退</text><text x="488" y="360" class="body">与血管瘤本质不同</text><text x="488" y="387" class="body">多为出生即有</text><rect width="330" height="86" x="488" y="410" fill="#fbeae3" rx="8"/><text x="653" y="434" class="small" text-anchor="middle">处理因病种和部位而异</text><text x="653" y="454" class="small" text-anchor="middle">硬化剂、栓塞、手术等</text><text x="653" y="474" class="small" text-anchor="middle">复杂者需多学科协作</text><circle cx="450" cy="372" r="26" fill="#fff" stroke="#7d8e93" stroke-width="2"/><text x="450" y="378" class="nodeTitle" text-anchor="middle" style="font-size:22px">VS</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">血管瘤多数会消退，血管畸形不会——混淆两类必致错误决策</text><text x="62" y="582" class="footer">示意，非教学图 · 病变性质判断需皮肤科/影像科/多学科面诊</text></svg>