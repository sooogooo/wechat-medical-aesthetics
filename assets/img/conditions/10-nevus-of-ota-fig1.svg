<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t10f1 d10f1">
  <title id="t10f1">太田痣分布与眼部受累评估</title>
  <desc id="t10f1">单侧眼周额颞青灰色斑可累及眼白，需关注眼压和眼内变化</desc>
  <defs>
    <linearGradient id="bg10f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh10f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg10f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh10f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 10</text>
  <text x="56" y="90" class="title">太田痣不只是胎记美容</text>
  <text x="56" y="116" class="kicker">单侧分布可累及眼部，先确认范围和眼是否受累</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">常见受累部位</text>

  <!-- 分布清单 -->
  <rect x="56" y="174" width="335" height="160" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="28" rx="12" fill="#7A8B6F"/><rect x="56" y="192" width="335" height="10" fill="#7A8B6F"/>
  <text x="72" y="193" class="tag">皮肤分布</text>
  <text x="72" y="226" class="body">单侧眼周 额颞 颧部</text>
  <text x="72" y="252" class="body">青灰色或灰褐色斑片</text>
  <text x="72" y="278" class="body">多在儿童或青春期显现</text>
  <text x="72" y="304" class="body">多数稳定良性</text>
  <text x="72" y="326" class="small">可逐渐加深趋于稳定</text>

  <rect x="409" y="174" width="335" height="160" rx="12" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="28" rx="12" fill="#B5654A"/><rect x="409" y="192" width="335" height="10" fill="#B5654A"/>
  <text x="425" y="193" class="tag">眼部受累</text>
  <text x="425" y="226" class="body">眼白 巩膜发蓝</text>
  <text x="425" y="252" class="body">需关注眼压变化</text>
  <text x="425" y="278" class="body">定期眼科检查</text>
  <text x="425" y="304" class="body">警惕眼内病变</text>
  <text x="425" y="326" class="small" fill="#8a3f2b">不只是美容问题</text>

  <!-- 评估优先级 -->
  <text x="56" y="362" class="nodeTitle">评估优先级 先眼部 后美容</text>
  <rect x="56" y="376" width="688" height="62" rx="10" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4"/>
  <text x="76" y="400" class="body" font-weight="700">先确认眼部是否受累并做眼科基线检查</text>
  <text x="76" y="422" class="small">再讨论激光淡化的时机与方案，儿童治疗时机需个体化评估</text>

  <rect x="56" y="448" width="688" height="20" rx="8" fill="#eef4ee"/>
  <text x="400" y="462" class="quote" text-anchor="middle" font-size="14">看疗效也看代价，每一程都要有可退出的节点</text>
  <text x="56" y="474" class="footer" fill="#68787e">医学教育示意 · 诊断不只看一张自拍，需皮肤科联合眼科评估</text>
</svg>
