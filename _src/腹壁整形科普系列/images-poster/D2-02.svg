  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · D2</text>
  <text x="62" y="112" class="title">回答含糊时，要警惕的信号</text>
  <text x="62" y="148" class="kicker">被回避的话题，往往就是风险所在</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>


  <rect x="62" y="209" width="776" height="42" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="92" cy="230" r="11" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="92" y="235" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" style="fill:#C75B00" text-anchor="middle">×</text>
  <text x="116" y="236" class="midTitle">回避谈疤痕</text>
  <text x="340" y="236" class="small">“疤很小，看不出来的”</text>

  <rect x="62" y="259" width="776" height="42" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="92" cy="280" r="11" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="92" y="285" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" style="fill:#C75B00" text-anchor="middle">×</text>
  <text x="116" y="286" class="midTitle">回避谈风险</text>
  <text x="340" y="286" class="small">“很安全，没什么风险”</text>

  <rect x="62" y="309" width="776" height="42" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="92" cy="330" r="11" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="92" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" style="fill:#C75B00" text-anchor="middle">×</text>
  <text x="116" y="336" class="midTitle">效果承诺</text>
  <text x="340" y="336" class="small">“无痕”“终身”“保证满意”</text>

  <rect x="62" y="359" width="776" height="42" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="92" cy="380" r="11" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="92" y="385" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" style="fill:#C75B00" text-anchor="middle">×</text>
  <text x="116" y="386" class="midTitle">资质含糊</text>
  <text x="340" y="386" class="small">“医生很有经验，你放心”</text>

  <rect x="62" y="409" width="776" height="42" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="92" cy="430" r="11" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="92" y="435" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" style="fill:#C75B00" text-anchor="middle">×</text>
  <text x="116" y="436" class="midTitle">催促决策</text>
  <text x="340" y="436" class="small">“今天定有优惠、名额有限”</text>

  <rect x="62" y="459" width="776" height="42" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="92" cy="480" r="11" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="92" y="485" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" style="fill:#C75B00" text-anchor="middle">×</text>
  <text x="116" y="486" class="midTitle">急救能力答不上</text>
  <text x="340" y="486" class="small">血库、麻醉、监护说不清</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">回避风险话题的机构，出事时最没准备</text>
  <text x="62" y="580" class="footer">医学教育示意 · 机构与医师资质请通过官方渠道核验</text>
