<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="医美美学三型分类框架">
  <rect width="720" height="420" fill="#faf8f4" rx="12"/>
  <text x="360" y="34" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">医美美学三型：从结果与思路分类</text>

  <!-- 顶部：分类维度 -->
  <rect x="180" y="60" width="360" height="50" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="360" y="82" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">分类维度</text>
  <text x="360" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">思路 × 结果：是&quot;怎么想 + 怎么做 + 做出来什么样&quot;</text>

  <!-- 三列 -->
  <!-- 高级型 -->
  <rect x="40" y="130" width="210" height="250" rx="10" fill="#ffffff" stroke="#7a8b6f" stroke-width="2"/>
  <rect x="40" y="130" width="210" height="44" rx="10" fill="#7a8b6f"/>
  <rect x="40" y="164" width="210" height="10" fill="#7a8b6f"/>
  <text x="145" y="158" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">高级型</text>
  <text x="60" y="200" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">思路：克制、整体、</text>
  <text x="60" y="218" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">个性化</text>
  <text x="60" y="248" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">结果：</text>
  <text x="60" y="268" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">• 耐看、协调</text>
  <text x="60" y="288" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">• 保留辨识度</text>
  <text x="60" y="308" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">• 看不出但变好</text>
  <text x="60" y="340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">本系列倡导</text>

  <!-- 技术型 -->
  <rect x="255" y="130" width="210" height="250" rx="10" fill="#ffffff" stroke="#c9a876" stroke-width="2"/>
  <rect x="255" y="130" width="210" height="44" rx="10" fill="#c9a876"/>
  <rect x="255" y="164" width="210" height="10" fill="#c9a876"/>
  <text x="360" y="158" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">技术型</text>
  <text x="275" y="200" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">思路：精准、数据、</text>
  <text x="275" y="218" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">参数驱动</text>
  <text x="275" y="248" font-family="PingFang SC,sans-serif" font-size="11" fill="#8a7340">结果：</text>
  <text x="275" y="268" font-family="PingFang SC,sans-serif" font-size="11" fill="#8a7340">• 精准可复现</text>
  <text x="275" y="288" font-family="PingFang SC,sans-serif" font-size="11" fill="#8a7340">• 有数据支撑</text>
  <text x="275" y="308" font-family="PingFang SC,sans-serif" font-size="11" fill="#8a7340">• 但有审美边界</text>
  <text x="275" y="340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">客观介绍</text>

  <!-- 庸俗型 -->
  <rect x="470" y="130" width="210" height="250" rx="10" fill="#ffffff" stroke="#b5654a" stroke-width="2"/>
  <rect x="470" y="130" width="210" height="44" rx="10" fill="#b5654a"/>
  <rect x="470" y="164" width="210" height="10" fill="#b5654a"/>
  <text x="575" y="158" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">庸俗型</text>
  <text x="490" y="200" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">思路：过度、趋同、</text>
  <text x="490" y="218" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">套模板、追流行</text>
  <text x="490" y="248" font-family="PingFang SC,sans-serif" font-size="11" fill="#b5654a">结果：</text>
  <text x="490" y="268" font-family="PingFang SC,sans-serif" font-size="11" fill="#b5654a">• 显假、显俗</text>
  <text x="490" y="288" font-family="PingFang SC,sans-serif" font-size="11" fill="#b5654a">• 千篇一律</text>
  <text x="490" y="308" font-family="PingFang SC,sans-serif" font-size="11" fill="#b5654a">• 一眼看穿</text>
  <text x="490" y="340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">本系列警示</text>

  <text x="360" y="405" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">三型不是对人的分类，而是对医美思路与结果的分类——同一个人可能落在不同型</text>
</svg>