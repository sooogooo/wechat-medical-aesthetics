<svg xmlns="http://www.w3.org/2000/svg" aria-label="肉毒不能解决的问题" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">肉毒解决不了这些问题</text><rect width="180" height="140" x="30" y="55" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="120" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">静态纹</text><text x="120" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">不动时就在的纹</text><text x="120" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">需要填充或光电</text><rect width="180" height="140" x="230" y="55" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="320" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">容积流失</text><text x="320" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">凹陷、干瘪</text><text x="320" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">需要填充</text><rect width="180" height="140" x="430" y="55" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="520" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">皮肤松弛</text><text x="520" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">组织下垂</text><text x="520" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">需要提升类项目</text><text x="320" y="225" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">理解肉毒的作用边界，才能避免“打完没效果”的失望</text></svg>