<svg xmlns="http://www.w3.org/2000/svg" aria-label="肉毒不自然的原因" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">“僵”通常来自这三个原因</text><rect width="185" height="180" x="30" y="60" fill="#fff" stroke="#ece7df" rx="8"/><circle cx="60" cy="95" r="14" fill="#b5654a"/><text x="60" y="99" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">1</text><text x="125" y="99" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">过量</text><text x="45" y="130" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">剂量超过肌肉需要</text><text x="45" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">肌肉过度放松</text><text x="45" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">表情&quot;卡住&quot;</text><text x="45" y="200" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">眉头下垂、眼睑下垂</text><rect width="185" height="180" x="227" y="60" fill="#fff" stroke="#ece7df" rx="8"/><circle cx="257" cy="95" r="14" fill="#b5654a"/><text x="257" y="99" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">2</text><text x="322" y="99" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">部位不准</text><text x="242" y="130" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">没打到目标肌肉</text><text x="242" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">或打了不该打的</text><text x="242" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">不对称</text><text x="242" y="200" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">笑容歪斜、眉形异常</text><rect width="185" height="180" x="424" y="60" fill="#fff" stroke="#ece7df" rx="8"/><circle cx="454" cy="95" r="14" fill="#b5654a"/><text x="454" y="99" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">3</text><text x="519" y="99" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">扩散</text><text x="439" y="130" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">肉毒扩散到邻近</text><text x="439" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">非目标肌肉</text><text x="439" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">影响未打部位</text><text x="439" y="200" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">复视、口角歪</text><text x="320" y="262" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">这三个原因都与操作者的解剖功底和剂量控制直接相关</text></svg>