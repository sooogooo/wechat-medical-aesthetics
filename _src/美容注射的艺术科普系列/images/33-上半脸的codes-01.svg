<svg xmlns="http://www.w3.org/2000/svg" aria-label="上半脸三大区域作用" role="img" viewBox="0 0 640 360"><rect width="640" height="360" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">上半脸三大区域与美学作用</text><rect width="185" height="270" x="30" y="60" fill="#fff" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><rect width="185" height="40" x="30" y="60" fill="#7a8b6f" rx="8"/><rect width="185" height="10" x="30" y="90" fill="#7a8b6f"/><text x="122" y="86" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">F 额头</text><text x="122" y="130" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Forehead</text><text x="45" y="165" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">美学作用：</text><text x="45" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 额头饱满度</text><text x="45" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 与眉骨自然过渡</text><text x="45" y="228" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 额头扁平、显老</text><rect width="155" height="60" x="45" y="250" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="122" y="272" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚠ 高危血管区</text><text x="122" y="290" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">眶上、滑车上血管</text><text x="122" y="304" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">与眼动脉交通</text><rect width="185" height="270" x="227" y="60" fill="#fff" stroke="#8a9a7f" stroke-width="1.5" rx="8"/><rect width="185" height="40" x="227" y="60" fill="#8a9a7f" rx="8"/><rect width="185" height="10" x="227" y="90" fill="#8a9a7f"/><text x="320" y="86" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">T 颞部</text><text x="320" y="130" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Temporal</text><text x="242" y="165" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">美学作用：</text><text x="242" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 太阳穴凹陷</text><text x="242" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 上面部框架感</text><text x="242" y="228" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 显憔悴、显凶</text><rect width="155" height="60" x="242" y="250" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="320" y="272" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚠ 血管丰富</text><text x="320" y="290" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">颞浅血管走行</text><text x="320" y="304" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">深部骨面相对安全</text><rect width="185" height="270" x="424" y="60" fill="#fff" stroke="#c9a876" stroke-width="1.5" rx="8"/><rect width="185" height="40" x="424" y="60" fill="#c9a876" rx="8"/><rect width="185" height="10" x="424" y="90" fill="#c9a876"/><text x="516" y="86" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">E 眼周</text><text x="516" y="130" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Periorbital</text><text x="439" y="165" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">美学作用：</text><text x="439" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 泪沟、眼周支撑</text><text x="439" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 改善疲惫感</text><text x="439" y="228" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 眼周年轻化</text><rect width="155" height="60" x="439" y="250" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="516" y="272" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚠ 高危精细区</text><text x="516" y="290" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">皮肤薄、血管密集</text><text x="516" y="304" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">与眼动脉交通</text><text x="320" y="345" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">三大区域共同特点：血管密集，是上半脸注射风险的核心来源</text></svg>