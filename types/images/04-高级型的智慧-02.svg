<svg xmlns="http://www.w3.org/2000/svg" aria-label="耐看的来源" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">&quot;耐看&quot;来自这几个品质</text><rect width="140" height="170" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="100" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">协调</text><text x="100" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">五官之间</text><text x="100" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">和谐的比例</text><text x="100" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">没有突兀的</text><text x="100" y="183" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">局部突出</text><rect width="140" height="170" x="180" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="250" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">自然</text><text x="250" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">动起来自然</text><text x="250" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">静下来舒适</text><text x="250" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">看不出&quot;做&quot;</text><text x="250" y="183" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">的痕迹</text><rect width="140" height="170" x="330" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="400" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">辨识度</text><text x="400" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">保留你的</text><text x="400" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">个人特征</text><text x="400" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不是&quot;另一张</text><text x="400" y="183" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">流水线脸&quot;</text><rect width="140" height="170" x="480" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="550" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">合适</text><text x="550" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">符合你的</text><text x="550" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">年龄/气质</text><text x="550" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不&quot;装嫩&quot;</text><text x="550" y="183" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不&quot;过度&quot;</text><text x="320" y="245" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">协调、自然、辨识度、合适——这四个品质叠加，才是&quot;耐看&quot;的来源</text></svg>