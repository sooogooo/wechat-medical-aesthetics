<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleA101 descA101">
  <title id="titleA101">先分清肚子松垮的四种来源</title>
  <desc id="descA101">腹部问题四种来源，脂肪堆积、皮肤松弛、腹直肌分离、腹壁疝，处理各不相同</desc>
  <defs>
    <marker id="ahA101" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · A1</text>
  <text x="62" y="112" class="title">先分清肚子松垮的四种来源</text>
  <text x="62" y="148" class="kicker">来源不同，处理完全不同，抽脂解决脂肪，腹壁成形解决皮肤和肌肉</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>
  <rect x="62" y="205" width="380" height="140" rx="10" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="102" cy="241" r="17" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="102" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#0072B2" text-anchor="middle">1</text>
  <text x="132" y="247" class="nodeTitle">脂肪堆积</text>
  <text x="84" y="283" class="body">捏起来厚厚一层，皮肤有弹性</text>
  <text x="84" y="309" class="body">仰卧时腹部变平</text>
  <text x="252" y="333" class="small" style="fill:#0072B2" text-anchor="middle">以抽脂或减脂为主，无需四级手术</text>
  <rect x="478" y="205" width="380" height="140" rx="10" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <circle cx="518" cy="241" r="17" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="518" y="247" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#D9930D" text-anchor="middle">2</text>
  <text x="548" y="247" class="nodeTitle">皮肤松弛</text>
  <text x="500" y="283" class="body">皮多、软、下垂，常伴妊娠纹</text>
  <text x="500" y="309" class="body">捏起来皮多肉少</text>
  <text x="668" y="333" class="small" style="fill:#D9930D" text-anchor="middle">需切除多余皮肤（腹壁成形）</text>
  <rect x="62" y="357" width="380" height="140" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="102" cy="393" r="17" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="102" y="399" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#C75B00" text-anchor="middle">3</text>
  <text x="132" y="399" class="nodeTitle">腹直肌分离</text>
  <text x="84" y="435" class="body">腹白线变宽，肚子鼓、无力</text>
  <text x="84" y="461" class="body">运动也收不回</text>
  <text x="252" y="485" class="small" style="fill:#C75B00" text-anchor="middle">需手术收紧肌层（四级手术）</text>
  <rect x="478" y="357" width="380" height="140" rx="10" fill="none" stroke="#B36A98" stroke-width="1.2"/>
  <circle cx="518" cy="393" r="17" fill="none" stroke="#B36A98" stroke-width="1.2"/>
  <text x="518" y="399" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" style="fill:#B36A98" text-anchor="middle">4</text>
  <text x="548" y="399" class="nodeTitle">腹壁疝</text>
  <text x="500" y="435" class="body">缺损处突出，平躺可回纳</text>
  <text x="500" y="461" class="body">可摸到明确的洞边</text>
  <text x="668" y="485" class="small" style="fill:#B36A98" text-anchor="middle">需外科修复，另行评估</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">先分清来源再谈方案，选错工具白受罪</text>
  <text x="62" y="580" class="footer">医学教育示意 · 判断需面诊与体格检查 · 混合型以主要矛盾定方案</text>
</svg>
