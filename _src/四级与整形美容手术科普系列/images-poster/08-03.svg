<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0803 desc0803">
  <title id="title0803">正颌手术的风险与禁忌</title>
  <desc id="desc0803">神经损伤、出血、咬合异常、骨段坏死等风险与不宜手术的情况</desc>
  <defs>
    <linearGradient id="bg0803" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0803" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0803)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0803)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 08</text>
  <text x="62" y="117" class="title">正颌手术的风险与禁忌</text>
  <text x="62" y="153" class="kicker">功能 + 外观双重决策，风险与下颌角手术同级</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：风险 -->
  <rect x="62" y="210" width="450" height="295" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="62" y="210" width="450" height="40" rx="14" fill="#D55E00"/>
  <rect x="62" y="236" width="450" height="14" fill="#D55E00"/>
  <text x="82" y="237" class="nodeTitle" fill="#ffffff">必须正视的风险</text>

  <circle cx="92" cy="276" r="5" fill="#D55E00"/>
  <text x="108" y="281" class="body" font-weight="700">下牙槽神经、眶下神经损伤</text>
  <text x="108" y="299" class="small">唇、颏部麻木，多数恢复少数长期</text>

  <circle cx="92" cy="322" r="5" fill="#D55E00"/>
  <text x="108" y="327" class="body" font-weight="700">出血</text>
  <text x="108" y="345" class="small">上颌骨血供丰富，需输血条件</text>

  <circle cx="92" cy="368" r="5" fill="#D55E00"/>
  <text x="108" y="373" class="body" font-weight="700">咬合关系异常</text>
  <text x="108" y="391" class="small">需正畸精细调整或二次处理</text>

  <circle cx="92" cy="414" r="5" fill="#D55E00"/>
  <text x="108" y="419" class="body" font-weight="700">骨段坏死或不愈合</text>
  <text x="108" y="437" class="small">血供受影响时罕见但严重</text>

  <circle cx="92" cy="460" r="5" fill="#D55E00"/>
  <text x="108" y="465" class="body" font-weight="700">TMJ 问题、感染、不对称、麻醉风险</text>
  <text x="108" y="483" class="small">术前已有 TMJ 紊乱者术后可能变化</text>

  <!-- 右：禁忌 -->
  <rect x="524" y="210" width="314" height="295" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="524" y="210" width="314" height="40" rx="14" fill="#E69F00"/>
  <rect x="524" y="236" width="314" height="14" fill="#E69F00"/>
  <text x="544" y="237" class="nodeTitle" fill="#ffffff">不建议做的情况</text>

  <circle cx="554" cy="278" r="5" fill="#E69F00"/>
  <text x="570" y="283" class="body">颌骨发育未完成的青少年</text>
  <text x="570" y="301" class="small">女性约 14-16 岁后，男性更晚</text>

  <circle cx="554" cy="324" r="5" fill="#E69F00"/>
  <text x="570" y="329" class="body">严重牙周病、龋齿未控制</text>
  <text x="570" y="347" class="small">咬合不稳定</text>

  <circle cx="554" cy="370" r="5" fill="#E69F00"/>
  <text x="570" y="375" class="body">凝血异常、未控制的慢性病</text>
  <text x="570" y="393" class="small">不能耐受全身麻醉</text>

  <circle cx="554" cy="416" r="5" fill="#E69F00"/>
  <text x="570" y="421" class="body">不能配合一到两年</text>
  <text x="570" y="439" class="small">正畸正颌联合治疗</text>

  <rect x="544" y="455" width="274" height="36" rx="8" fill="#fdf3e3"/>
  <text x="681" y="477" class="small" text-anchor="middle">连头影测量都不做的方案不可信</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">正颌同时改善功能和外观，但复杂度高、周期长</text>

  <text x="62" y="582" class="footer">医学教育示意，非教学图 · 正颌手术须在有相应资质、具备急救能力的机构开展</text>
</svg>
