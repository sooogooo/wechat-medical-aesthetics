<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="MD Codes 主要大区与作用">
  <rect width="720" height="420" fill="#faf8f4" rx="12"/>
  <text x="360" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">主要大区及其美学作用</text>

  <!-- 表格 -->
  <rect x="30" y="55" width="660" height="34" rx="4" fill="#7a8b6f"/>
  <text x="110" y="77" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#ffffff">大区</text>
  <text x="240" y="77" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#ffffff">英文缩写</text>
  <text x="490" y="77" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#ffffff">主要美学作用</text>

  <rect x="30" y="89" width="660" height="38" fill="#ffffff" stroke="#ece7df"/>
  <text x="110" y="113" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">额头</text>
  <text x="240" y="113" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">F</text>
  <text x="490" y="113" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">额头饱满度、与眉骨过渡</text>

  <rect x="30" y="127" width="660" height="38" fill="#eef0ea" stroke="#ece7df"/>
  <text x="110" y="151" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">颞部（太阳穴）</text>
  <text x="240" y="151" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">T</text>
  <text x="490" y="151" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">颞部凹陷、上面部框架</text>

  <rect x="30" y="165" width="660" height="38" fill="#ffffff" stroke="#ece7df"/>
  <text x="110" y="189" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">眼周</text>
  <text x="240" y="189" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">E</text>
  <text x="490" y="189" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">泪沟、眼周支撑、疲惫感</text>

  <rect x="30" y="203" width="660" height="38" fill="#eef0ea" stroke="#ece7df"/>
  <text x="110" y="227" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">颊部（苹果肌）</text>
  <text x="240" y="227" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Ck</text>
  <text x="490" y="227" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">中面部支撑、年轻化核心</text>

  <rect x="30" y="241" width="660" height="38" fill="#ffffff" stroke="#ece7df"/>
  <text x="110" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">鼻唇沟</text>
  <text x="240" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Nl</text>
  <text x="490" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">法令纹、面中下移表现</text>

  <rect x="30" y="279" width="660" height="38" fill="#eef0ea" stroke="#ece7df"/>
  <text x="110" y="303" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">下颌线</text>
  <text x="240" y="303" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">Jw</text>
  <text x="490" y="303" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">下面部轮廓、下颌清晰度</text>

  <rect x="30" y="317" width="660" height="38" fill="#ffffff" stroke="#ece7df"/>
  <text x="110" y="341" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">颏部（下巴）</text>
  <text x="240" y="341" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">C</text>
  <text x="490" y="341" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">下巴形态、下面部比例</text>

  <text x="360" y="395" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">本表为大区速览；每个大区再细分为多个 code，详见后续各篇</text>
  <text x="360" y="412" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">MD Codes 体系由 Maurício de Maio 提出，归属其本人；本表为科普性概括</text>
</svg>