<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t07f1 d07f1">
  <title id="t07f1">颧部褐青色痣与黄褐斑鉴别</title>
  <desc id="d07f1">同为面颊褐斑机制不同，褐青色痣色素在真皮深层</desc>
  <defs>
    <linearGradient id="bg07f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh07f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg07f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh07f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 07</text>
  <text x="56" y="90" class="title">颧部褐青色痣 还是黄褐斑</text>
  <text x="56" y="116" class="kicker">同为面颊褐斑机制不同，治疗前先把病名分清</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">两者对照</text>

  <!-- 对照表 -->
  <rect x="56" y="174" width="335" height="180" rx="12" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="30" rx="12" fill="#8a6a3a"/><rect x="56" y="194" width="335" height="10" fill="#8a6a3a"/>
  <text x="72" y="195" class="tag">颧部褐青色痣</text>
  <text x="72" y="226" class="body">成年后出现 双侧颧部</text>
  <text x="72" y="250" class="body">散在灰褐或蓝灰小斑</text>
  <text x="72" y="274" class="body">色素位于真皮深层</text>
  <text x="72" y="298" class="body">护肤品常够不着</text>
  <text x="72" y="332" class="small">多需调Q或皮秒激光多次</text>

  <rect x="409" y="174" width="335" height="180" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="30" rx="12" fill="#7A8B6F"/><rect x="409" y="194" width="335" height="10" fill="#7A8B6F"/>
  <text x="425" y="195" class="tag">黄褐斑</text>
  <text x="425" y="226" class="body">对称片状褐色斑</text>
  <text x="425" y="250" class="body">边界较模糊 范围较大</text>
  <text x="425" y="274" class="body">色素以表皮为主</text>
  <text x="425" y="298" class="body">日晒和可见光加重</text>
  <text x="425" y="332" class="small">外用药与防晒先行</text>

  <!-- 关键提示 -->
  <text x="56" y="378" class="nodeTitle">两者可并存，需医生鉴别</text>
  <rect x="56" y="390" width="688" height="44" rx="10" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.4"/>
  <text x="400" y="410" class="body" text-anchor="middle" font-weight="700">反黑不是一句亚洲人都会就能带过</text>
  <text x="400" y="426" class="small" text-anchor="middle">混合色斑需分区处理，追着颜色加码是疗程中最易犯的错</text>

  <rect x="56" y="442" width="688" height="20" rx="8" fill="#eef4ee"/>
  <text x="400" y="456" class="quote" text-anchor="middle" font-size="14">设定现实终点，比追求零斑更重要</text>
  <text x="56" y="472" class="footer">医学教育示意 · 诊断不只看一张自拍，需皮肤科面诊</text>
</svg>
