<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="技术型美学的测量维度">
  <rect width="640" height="340" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">技术型美学的测量维度</text>

  <!-- 简化面部 + 测量标注 -->
  <ellipse cx="200" cy="170" rx="85" ry="115" fill="#ffffff" stroke="#c9a876" stroke-width="1.5"/>

  <!-- 三庭线 -->
  <line x1="115" y1="135" x2="285" y2="135" stroke="#8a7340" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="115" y1="185" x2="285" y2="185" stroke="#8a7340" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="295" y="115" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">上庭</text>
  <text x="295" y="160" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">中庭</text>
  <text x="295" y="205" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">下庭</text>
  <text x="295" y="140" font-family="PingFang SC,sans-serif" font-size="9" fill="#6b6864">三庭均等</text>

  <!-- 五眼线 -->
  <line x1="120" y1="150" x2="120" y2="155" stroke="#8a7340"/>
  <line x1="155" y1="150" x2="155" y2="155" stroke="#8a7340"/>
  <line x1="200" y1="150" x2="200" y2="155" stroke="#8a7340"/>
  <line x1="245" y1="150" x2="245" y2="155" stroke="#8a7340"/>
  <line x1="280" y1="150" x2="280" y2="155" stroke="#8a7340"/>

  <!-- 鼻额角 -->
  <path d="M 195 145 Q 200 150 205 145" stroke="#b5654a" stroke-width="1" fill="none"/>
  <text x="310" y="265" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">鼻额角 115°–130°</text>

  <!-- 右侧：常见参数 -->
  <rect x="380" y="70" width="240" height="230" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="500" y="95" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">常用美学参数</text>
  <text x="400" y="125" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 三庭五眼（比例）</text>
  <text x="400" y="150" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 黄金比例（1:1.618）</text>
  <text x="400" y="175" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 鼻额角、鼻面角</text>
  <text x="400" y="200" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 下颌角角度</text>
  <text x="400" y="225" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 面部对称度</text>
  <text x="400" y="250" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• Rickett 线（侧颜）</text>
  <text x="400" y="280" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">这些参数提供客观参考</text>
</svg>