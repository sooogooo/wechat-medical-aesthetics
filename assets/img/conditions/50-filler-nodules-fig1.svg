<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t50f1 d50f1" role="img" viewBox="0 0 800 500"><title id="t50f1">注射后硬结的四种可能</title><desc id="d50f1">注射后硬结可能来自材料堆积炎症结节感染或异物肉芽肿</desc><defs><linearGradient id="bg50f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh50f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.card{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg50f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh50f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 50</text><text x="52" y="92" class="title">硬结先分类，再谈处理</text><text x="52" y="116" class="kicker">鼓包、硬结原因不同，处理方式也完全不同</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">四类常见可能</text><rect width="340" height="116" x="52" y="178" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="340" height="30" x="52" y="178" fill="#7A8B6F" rx="12"/><rect width="340" height="14" x="52" y="194" fill="#7A8B6F"/><text x="222" y="198" class="card" text-anchor="middle">材料堆积或移位</text><text x="68" y="230" class="body">出现时间：注射后不久</text><text x="68" y="252" class="body">质地：偏软、边界清楚</text><text x="68" y="274" class="small">透明质酸类可考虑溶解</text><rect width="340" height="116" x="408" y="178" fill="#fbf5ea" stroke="#C9A876" rx="12"/><rect width="340" height="30" x="408" y="178" fill="#C9A876" rx="12"/><rect width="340" height="14" x="408" y="194" fill="#C9A876"/><text x="578" y="198" class="card" text-anchor="middle">炎症结节</text><text x="424" y="230" class="body">出现时间：数日至数周</text><text x="424" y="252" class="body">质地：红、肿、压痛</text><text x="424" y="274" class="small">常与注射刺激、过敏相关</text><rect width="340" height="116" x="52" y="306" fill="#fbf0eb" stroke="#B5654A" rx="12"/><rect width="340" height="30" x="52" y="306" fill="#B5654A" rx="12"/><rect width="340" height="14" x="52" y="322" fill="#B5654A"/><text x="222" y="326" class="card" text-anchor="middle">感染性结节</text><text x="68" y="358" class="body">出现时间：任何时间</text><text x="68" y="380" class="body">质地：红肿热痛、化脓</text><text x="68" y="402" class="small">需抗感染，可能需取材培养</text><rect width="340" height="116" x="408" y="306" fill="#fbf0eb" stroke="#B5654A" rx="12"/><rect width="340" height="30" x="408" y="306" fill="#B5654A" rx="12"/><rect width="340" height="14" x="408" y="322" fill="#B5654A"/><text x="578" y="326" class="card" text-anchor="middle">迟发肉芽肿</text><text x="424" y="358" class="body">出现时间：数月至数年</text><text x="424" y="380" class="body">质地：硬结、多发、炎症</text><text x="424" y="402" class="small">处理复杂，需个体化</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">先确认产品、层次和血流，避免盲目溶解</text><text x="52" y="466" class="footer">健康科普示意 · 注射后异常须及时联系注射医师或就医</text></svg>