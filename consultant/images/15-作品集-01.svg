<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t15a d15a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t15a">科普转写漏斗</title><desc id="d15a">从3-2-1卡片到30篇作品集：选题、四段式初稿、合规自检、发布、复盘</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.stage{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.stageSub{font:500 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.footer,.tri{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.tri{fill:#3e5057}.footer{fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段4 · 15</text><text x="56" y="90" class="title">作品集 从卡片到 30 篇的转写漏斗</text><text x="56" y="116" class="kicker">零经验求职者最缺的是证据——作品集就是你带进面试的证据</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><polygon fill="#fff" stroke="#7A8B6F" stroke-width="1.5" points="190 144 610 144 570 200 230 200"/><text x="400" y="170" class="stage" text-anchor="middle">① 选题 · 60+ 张卡片 × 错题本</text><text x="400" y="190" class="stageSub" text-anchor="middle">配比：皮肤 12 · 注射 8 · 美学与心理 6 · 行业认知 4</text><polygon fill="#fff" stroke="#7A8B6F" stroke-width="1.5" points="240 212 560 212 520 268 280 268"/><text x="400" y="238" class="stage" text-anchor="middle">② 四段式初稿（300-600 字）</text><text x="400" y="258" class="stageSub" text-anchor="middle">钩子痛点 → 一个概念 → 风险提醒 → 可核验的下一步</text><polygon fill="#fff" stroke="#C9A876" stroke-width="1.5" points="290 280 510 280 470 336 330 336"/><text x="400" y="306" class="stage" text-anchor="middle">③ 合规自检（发布前必过）</text><text x="400" y="326" class="stageSub" text-anchor="middle">搜四个词：肯定·绝对·保证·最好 + 图片版权 + 平台规则</text><polygon fill="#fff" stroke="#A8A39D" stroke-width="1.5" points="340 348 460 348 440 404 360 404"/><text x="400" y="372" class="stage" text-anchor="middle">④ 发布</text><text x="400" y="392" class="stageSub" text-anchor="middle">小红书为主 · 朋友圈人设</text><rect width="200" height="34" x="300" y="416" fill="#7A8B6F" rx="10"/><text x="400" y="438" class="num" text-anchor="middle">⑤ 30 篇作品集 + 运营小结</text><rect width="110" height="306" x="56" y="144" fill="#fff" stroke="#a9bba0" stroke-width="1.3" rx="10"/><text x="111" y="170" class="stage" text-anchor="middle">一举三得</text><text x="111" y="200" class="tri" text-anchor="middle">写 = 费曼检验</text><text x="111" y="216" class="tri" text-anchor="middle">写不出=没学透</text><text x="111" y="252" class="tri" text-anchor="middle">发 = 入场券</text><text x="111" y="268" class="tri" text-anchor="middle">账号比简历</text><text x="111" y="284" class="tri" text-anchor="middle">更有说服力</text><text x="111" y="320" class="tri" text-anchor="middle">存 = 内容能力</text><text x="111" y="336" class="tri" text-anchor="middle">通向阶段5</text><text x="111" y="352" class="tri" text-anchor="middle">分支 B</text><rect width="110" height="306" x="634" y="144" fill="#fff" stroke="#d9cbab" stroke-width="1.3" rx="10"/><text x="689" y="170" class="stage" text-anchor="middle">人设定位</text><text x="689" y="200" class="tri" text-anchor="middle">&quot;陪你搞懂</text><text x="689" y="216" class="tri" text-anchor="middle">医美的转行者&quot;</text><text x="689" y="252" class="tri" text-anchor="middle">转行视角</text><text x="689" y="268" class="tri" text-anchor="middle">就是差异化</text><text x="689" y="304" class="tri" text-anchor="middle">每篇必有</text><text x="689" y="320" class="tri" text-anchor="middle">&quot;具体请面诊&quot;</text><text x="689" y="336" class="tri" text-anchor="middle">类出口</text><text x="56" y="466" class="footer">节奏：每周 5 篇 × 6 周 · 每周日复盘数据写进&quot;运营小结&quot;——面试官看到的不仅是会写，还会复盘</text></svg>