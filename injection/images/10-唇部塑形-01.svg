<svg xmlns="http://www.w3.org/2000/svg" aria-label="唇部美学维度示意" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">唇部注射要考虑的维度</text><g transform="translate(220,80)"><path fill="#e3c9bd" stroke="#b5654a" stroke-width="1.5" d="M 0 30 Q 30 10 60 18 Q 90 10 120 18 Q 150 10 180 30 Q 150 45 120 38 Q 90 45 60 38 Q 30 45 0 30 Z"/><path fill="#e3c9bd" stroke="#b5654a" stroke-width="1.5" d="M 20 50 Q 90 80 160 50 Q 130 70 90 72 Q 50 70 20 50 Z"/><circle cx="30" cy="22" r="3" fill="#7a8b6f"/><text x="0" y="0" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">唇峰</text><circle cx="90" cy="40" r="3" fill="#7a8b6f"/><text x="120" y="38" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">唇珠</text><circle cx="90" cy="65" r="3" fill="#c9a876"/><text x="120" y="68" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10">下唇丰满度</text><circle cx="0" cy="30" r="3" fill="#8a9a7f"/><text x="-30" y="50" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">口角</text></g><rect width="180" height="170" x="440" y="70" fill="#fff" stroke="#ece7df" rx="8"/><text x="455" y="95" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">美学考量</text><text x="455" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 上下唇比例（约 1:1.6）</text><text x="455" y="142" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 唇峰与唇珠形态</text><text x="455" y="164" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 人中长度与形态</text><text x="455" y="186" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 口角上扬（避免下垂）</text><text x="455" y="208" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 口周细纹</text><text x="455" y="230" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 与整体五官协调</text><text x="320" y="262" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">图为示意；唇部美学高度个体化，需结合面部整体比例</text></svg>