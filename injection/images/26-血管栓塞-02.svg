<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="栓塞危险信号">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#b5654a">⚠ 出现这些，立即就医</text>

  <rect x="30" y="55" width="135" height="170" rx="8" fill="#ffffff" stroke="#b5654a" stroke-width="1.5"/>
  <circle cx="97" cy="95" r="20" fill="#f7ece6"/>
  <ellipse cx="97" cy="95" rx="14" ry="10" fill="#b5654a" opacity="0.4"/>
  <text x="97" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#2b2a28">皮肤发白</text>
  <text x="97" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">苍白、冰凉</text>
  <text x="97" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">血供中断</text>

  <rect x="180" y="55" width="135" height="170" rx="8" fill="#ffffff" stroke="#b5654a" stroke-width="1.5"/>
  <circle cx="247" cy="95" r="20" fill="#f7ece6"/>
  <path d="M 235 95 Q 247 88 259 95" stroke="#7a5a4a" stroke-width="2" fill="none"/>
  <path d="M 235 100 Q 247 105 259 100" stroke="#7a5a4a" stroke-width="1.5" fill="none"/>
  <text x="247" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#2b2a28">花斑/发紫</text>
  <text x="247" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">网状青紫</text>
  <text x="247" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">缺血进展</text>

  <rect x="330" y="55" width="135" height="170" rx="8" fill="#ffffff" stroke="#b5654a" stroke-width="1.5"/>
  <circle cx="397" cy="95" r="20" fill="#f7ece6"/>
  <text x="397" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#b5654a">!</text>
  <text x="397" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#2b2a28">剧痛</text>
  <text x="397" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">与正常反应不符</text>
  <text x="397" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">的剧烈疼痛</text>

  <rect x="480" y="55" width="135" height="170" rx="8" fill="#ffffff" stroke="#b5654a" stroke-width="1.5"/>
  <circle cx="547" cy="95" r="20" fill="#f7ece6"/>
  <ellipse cx="547" cy="95" rx="12" ry="8" fill="none" stroke="#7a5a4a" stroke-width="2"/>
  <line x1="540" y1="90" x2="554" y2="100" stroke="#7a5a4a" stroke-width="1.5"/>
  <text x="547" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#2b2a28">视力变化</text>
  <text x="547" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">模糊、失明、眼痛</text>
  <text x="547" y="190" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">最紧急</text>

  <text x="320" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">不要等待、不要自行按摩、不要“观察一晚”——立即联系医生或急诊</text>
</svg>