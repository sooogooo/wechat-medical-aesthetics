<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t17a d17a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t17a">入职90天路线图</title><desc id="d17a">30天跟诊记录，60天辅助接诊求匹配度反馈，90天独立与转正述职</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.phase{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.item{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.day{font:700 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.mile{font:700 11.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8b6f}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段4 · 17</text><text x="56" y="90" class="title">入职 90 天 不抢跑、不掉队</text><text x="56" y="116" class="kicker">新人期最大风险是&quot;我已经会了&quot;——跟诊窗口期只有这一段</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="222" height="250" x="56" y="144" fill="#fff" stroke="#a9bba0" stroke-width="1.5" rx="10"/><rect width="88" height="22" x="72" y="160" fill="#7A8B6F" rx="10"/><text x="116" y="175" class="day" text-anchor="middle">第 1-30 天</text><text x="170" y="176" class="phase">跟诊与记录</text><text x="72" y="208" class="item">· 每天一份跟诊笔记：</text><text x="82" y="226" class="item">医生怎么问 · 怎么处理期望</text><text x="82" y="244" class="item">· 我学到的一个具体点</text><text x="72" y="272" class="item">· 熟悉全流程：预约-检测-</text><text x="82" y="290" class="item">面诊-收费-随访</text><text x="72" y="318" class="item">· 建医生档案：专长·脾气·风格</text><text x="72" y="346" class="item">· 语言红线日检 + 错题本继续</text><text x="72" y="378" class="mile">铁律：只跟诊，不独立接单</text><rect width="222" height="250" x="290" y="144" fill="#fff" stroke="#d9cbab" stroke-width="1.5" rx="10"/><rect width="94" height="22" x="306" y="160" fill="#C9A876" rx="10"/><text x="353" y="175" class="day" text-anchor="middle">第 31-60 天</text><text x="412" y="176" class="phase">辅助接诊</text><text x="306" y="208" class="item">· 带教在场下接初诊：</text><text x="316" y="226" class="item">你主谈，她兜底</text><text x="306" y="254" class="item">· 每次接诊写转诊摘要</text><text x="316" y="272" class="item">当面交医生——最快信誉建设</text><text x="306" y="300" class="item">· 每周求一次&quot;匹配度反馈&quot;：</text><text x="316" y="318" class="item">我转的客人方案匹配吗？</text><text x="316" y="336" class="item">哪个判断我偏了？</text><text x="306" y="364" class="item">· 第一单投诉全程记录</text><text x="306" y="382" class="mile">新标准：医生决策匹配度</text><rect width="222" height="250" x="524" y="144" fill="#fff" stroke="#7A8B6F" stroke-width="1.8" rx="10"/><rect width="94" height="22" x="540" y="160" fill="#7A8B6F" rx="10"/><text x="587" y="175" class="day" text-anchor="middle">第 61-90 天</text><text x="646" y="176" class="phase">独立与转正</text><text x="540" y="208" class="item">· 独立接初诊</text><text x="540" y="236" class="item">· 整理 90 天数据备述职</text><text x="540" y="268" class="item">述职五件套：</text><text x="550" y="286" class="item">接待量 · 匹配度案例 · 错题 TOP5</text><text x="550" y="304" class="item">三个案例（含一次劝停）</text><text x="550" y="322" class="item">· 下一步计划与培训诉求</text><text x="540" y="360" class="mile">&quot;我没做这单&quot;的理由</text><text x="540" y="378" class="mile">比成交故事更打动管理者</text><rect width="690" height="52" x="56" y="408" fill="#fff" stroke="#c9c9c4" stroke-width="1.2" rx="10"/><text x="76" y="430" class="item">黄灯兑现期的三条应对：回看《入行决策书》照单执行 · 找一位前辈做非正式导师 · 每周给自己亮一盏&quot;绿波带&quot;</text><text x="76" y="450" class="item">（用跟诊笔记证明给自己看：这周比上周多会了什么）</text><text x="56" y="480" class="footer">通关：转正述职通过 + 至少 2 位医生愿意为你背书</text></svg>