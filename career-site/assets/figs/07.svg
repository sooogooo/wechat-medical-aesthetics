t YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">有人买单</text><rect width="190" height="108" x="450" y="110" fill="#fff" stroke="#e4ddd2" stroke-dasharray="5 4" stroke-width="1.4" rx="8"/><text x="545" y="136" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">负资产</text><text x="545" y="160" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">流量万能 · 方法论优越感</text><text x="545" y="181" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">制度信任 · 快迭代</text><text x="545" y="205" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">以正确感面目出现</text><text x="400" y="345" fill="#c9a876" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">支点是嘴与手的结构</text><text x="400" y="372" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">同一种能力，站对是资产，站错是负资产</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">分界不在于你有什么，在于是否接受嘴与手的结构</text></svg>