<svg xmlns="http://www.w3.org/2000/svg" aria-label="do 脸感的形成机制" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">&quot;do 脸感&quot;是怎么产生的</text><rect width="180" height="150" x="30" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="120" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">过度治疗</text><text x="120" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">每个局部做到极致</text><text x="120" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">缺乏整体协调</text><rect width="180" height="150" x="230" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="320" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">套模板</text><text x="320" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不考虑个人基础</text><text x="320" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">所有人做成一整套</text><rect width="180" height="150" x="430" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="520" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">滤镜审美</text><text x="520" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">把滤镜效果</text><text x="520" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">搬到现实脸上</text><text x="320" y="225" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">本质：把&quot;精致&quot;局部叠加，忽视整体协调与个体基础</text></svg>