<svg xmlns="http://www.w3.org/2000/svg" aria-label="高级脸的视觉特征" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">高级脸的典型特征</text><path fill="#f3efe8" stroke="#a8a39d" d="M 170 130 L 170 240 Q 170 260 200 265 L 240 265 Q 270 260 270 240 L 270 130 Q 270 120 260 115 L 180 115 Q 170 120 170 130 Z"/><path stroke="#2b2a28" stroke-width="2.5" d="M 190 165 L 215 162"/><path stroke="#2b2a28" stroke-width="2.5" d="M 225 162 L 250 165"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 180 195 Q 190 205 200 200"/><path fill="none" stroke="#a8a39d" stroke-width="1" d="M 240 200 Q 250 205 260 195"/><line x1="210" x2="232" y1="235" y2="235" stroke="#b5654a" stroke-width="1.5"/><line x1="190" x2="380" y1="162" y2="100" stroke="#a8a39d" stroke-width="1"/><text x="390" y="95" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">细长眼/单眼皮</text><text x="390" y="112" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">不追求大圆眼</text><line x1="218" x2="380" y1="162" y2="135" stroke="#a8a39d" stroke-width="1"/><text x="390" y="132" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">眼距偏宽</text><text x="390" y="149" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">疏离、不集中</text><line x1="190" x2="380" y1="200" y2="180" stroke="#a8a39d" stroke-width="1"/><text x="390" y="177" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">骨骼感明显</text><text x="390" y="194" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">颧骨、下颌线条</text><line x1="210" x2="380" y1="235" y2="240" stroke="#a8a39d" stroke-width="1"/><text x="390" y="237" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">薄唇、面部留白多</text><text x="390" y="254" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">冷淡、克制</text><line x1="170" x2="380" y1="200" y2="285" stroke="#a8a39d" stroke-width="1"/><text x="390" y="282" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">整体疏离冷感</text><text x="390" y="299" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">不讨好、有距离</text></svg>