<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="颈纹注射的能与不能">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">颈纹注射：现实与边界</text>

  <rect x="30" y="55" width="280" height="180" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="170" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">✓ 能改善</text>
  <text x="50" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 浅表细纹（谨慎填充）</text>
  <text x="50" y="140" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 部分动态纹（肉毒，需经验）</text>
  <text x="50" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 整体肤质（光电联合）</text>
  <text x="50" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">颈部皮肤薄，剂量要克制</text>
  <text x="50" y="213" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">优先非注射手段</text>

  <rect x="330" y="55" width="280" height="180" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="470" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">× 难以解决</text>
  <text x="350" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 深的静态“项链纹”</text>
  <text x="350" y="140" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 颈部皮肤松弛</text>
  <text x="350" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 颈阔肌条带</text>
  <text x="350" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">这些需要其他手段</text>
  <text x="350" y="213" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">（手术、提升类项目）</text>

  <text x="320" y="250" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">颈部注射效果有限，且皮肤薄易出问题，要格外审慎</text>
</svg>