<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t27 d27" role="img" viewBox="0 0 800 500"><title id="t27">皮脂腺异位的处理与沟通</title><desc id="d27">位置会放大焦虑，准确比过度保证更重要</desc><defs><linearGradient id="bg27" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh27" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.num{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg27)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh27)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 27</text><text x="48" y="92" class="title">皮脂腺异位的处理与沟通</text><text x="48" y="116" class="kicker">位置会放大焦虑，准确比过度保证更重要</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">处理选项与边界</text><circle cx="74" cy="208" r="13" fill="#7A8B6F"/><text x="74" y="213" class="num" text-anchor="middle">1</text><text x="98" y="213" class="body">无外观困扰者，无需任何清洁或治疗</text><circle cx="74" cy="250" r="13" fill="#C9A876"/><text x="74" y="255" class="num" text-anchor="middle">2</text><text x="98" y="255" class="body">确有美观困扰，可面诊评估激光或电凝</text><circle cx="74" cy="292" r="13" fill="#7A8B6F"/><text x="74" y="297" class="num" text-anchor="middle">3</text><text x="98" y="297" class="body">向伴侣解释时，准确比过度保证更有用</text><circle cx="74" cy="334" r="13" fill="#B5654A"/><text x="74" y="339" class="num" text-anchor="middle">4</text><text x="98" y="339" class="body">不确定是不是皮脂腺异位，先检查再处理</text><rect width="704" height="40" x="48" y="372" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="397" class="quote" text-anchor="middle">它常见，但位置会放大焦虑</text><text x="48" y="462" class="footer">医学教育示意 · 美容处理需要承认它可能复发</text></svg>