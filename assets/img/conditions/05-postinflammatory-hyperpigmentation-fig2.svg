<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t05f2 d05f2">
  <title id="t05f2">炎症后色沉居家三件事与时间线</title>
  <desc id="d05f2">防晒 减少二次伤害 记录变化，把淡印做成可复核实验</desc>
  <defs>
    <linearGradient id="bg05f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh05f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg05f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh05f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 05</text>
  <text x="56" y="90" class="title">淡印居家三件事与时间线</text>
  <text x="56" y="116" class="kicker">把淡印做成一项可复核的实验</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 三件事 -->
  <text x="56" y="158" class="nodeTitle">最实用的三件小事</text>

  <rect x="56" y="172" width="220" height="92" rx="10" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4"/>
  <rect x="56" y="172" width="220" height="26" rx="10" fill="#7A8B6F"/><rect x="56" y="188" width="220" height="10" fill="#7A8B6F"/>
  <text x="166" y="190" class="tag" text-anchor="middle">持续防晒</text>
  <text x="166" y="224" class="body" text-anchor="middle">广谱 全年</text>
  <text x="166" y="246" class="small" text-anchor="middle">防止色素继续加深</text>

  <rect x="290" y="172" width="220" height="92" rx="10" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4"/>
  <rect x="290" y="172" width="220" height="26" rx="10" fill="#C9A876"/><rect x="290" y="188" width="220" height="10" fill="#C9A876"/>
  <text x="400" y="190" class="tag" text-anchor="middle">减少二次伤害</text>
  <text x="400" y="224" class="body" text-anchor="middle">不抠不摩擦</text>
  <text x="400" y="246" class="small" text-anchor="middle">避免过度刷酸刺激</text>

  <rect x="524" y="172" width="220" height="92" rx="10" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4"/>
  <rect x="524" y="172" width="220" height="26" rx="10" fill="#5F6E54"/><rect x="524" y="188" width="220" height="10" fill="#5F6E54"/>
  <text x="634" y="190" class="tag" text-anchor="middle">记录变化</text>
  <text x="634" y="224" class="body" text-anchor="middle">每四周同条件拍照</text>
  <text x="634" y="246" class="small" text-anchor="middle">用时间线复盘</text>

  <!-- 时间线 -->
  <text x="56" y="296" class="nodeTitle">淡印时间线参考</text>
  <line x1="100" y1="350" x2="700" y2="350" stroke="#cdd8d8" stroke-width="2"/>
  <circle cx="180" cy="350" r="11" fill="#B5654A"/>
  <text x="180" y="330" class="body" text-anchor="middle" font-weight="700">起病</text>
  <text x="180" y="378" class="small" text-anchor="middle">炎症后出现印</text>

  <circle cx="340" cy="350" r="11" fill="#C9A876"/>
  <text x="340" y="330" class="body" text-anchor="middle" font-weight="700">数周</text>
  <text x="340" y="378" class="small" text-anchor="middle">红印开始转淡</text>

  <circle cx="500" cy="350" r="11" fill="#5F6E54"/>
  <text x="500" y="330" class="body" text-anchor="middle" font-weight="700">数月</text>
  <text x="500" y="378" class="small" text-anchor="middle">黑褐印明显变淡</text>

  <circle cx="660" cy="350" r="11" fill="#7A8B6F"/>
  <text x="660" y="330" class="body" text-anchor="middle" font-weight="700">半年以上</text>
  <text x="660" y="378" class="small" text-anchor="middle">多数趋于稳定</text>

  <rect x="56" y="400" width="688" height="36" rx="10" fill="#eef4ee"/>
  <text x="400" y="423" class="quote" text-anchor="middle">某颗印当天变淡不等于稳定，看的是整体趋势</text>
  <text x="56" y="458" class="footer">医学教育示意 · 深肤色 日晒强 炎症重者时间更长</text>
  <text x="56" y="472" class="footer">若数月无改善或加重应面诊，不要无限复购同一产品</text>
</svg>
