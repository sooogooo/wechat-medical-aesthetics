<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t42f2 d42f2" role="img" viewBox="0 0 800 500"><title id="t42f2">痘坑治疗路径与预期管理</title><desc id="d42f2">从控痘到分型到联合治疗的路径与合理预期</desc><defs><linearGradient id="bg42f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh42f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.step{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg42f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh42f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 42</text><text x="52" y="92" class="title">治疗路径与合理预期</text><text x="52" y="116" class="kicker">痘坑是瘢痕，改善是渐进而非消除</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">四步路径</text><rect width="160" height="92" x="52" y="178" fill="#7A8B6F" rx="12"/><text x="132" y="206" class="step" text-anchor="middle">1 控制活动痘</text><text x="132" y="230" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">先稳定炎症</text><text x="132" y="250" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">否则边治边长</text><rect width="160" height="92" x="232" y="178" fill="#7A8B6F" rx="12"/><text x="312" y="206" class="step" text-anchor="middle">2 分型评估</text><text x="312" y="230" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">看清是哪型</text><text x="312" y="250" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">可能混合存在</text><rect width="160" height="92" x="412" y="178" fill="#C9A876" rx="12"/><text x="492" y="206" class="step" text-anchor="middle">3 联合治疗</text><text x="492" y="230" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">单一手段有限</text><text x="492" y="250" fill="#fbf5ea" class="step" font-size="12" text-anchor="middle">分次分型推进</text><rect width="156" height="92" x="592" y="178" fill="#5F6E54" rx="12"/><text x="670" y="206" class="step" text-anchor="middle">4 维护防晒</text><text x="670" y="230" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">避免色沉加重</text><text x="670" y="250" fill="#f1f7f1" class="step" font-size="12" text-anchor="middle">观察效果再追加</text><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 212 224 L 232 224"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 226 218 L 232 224 L 226 230"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 392 224 L 412 224"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 406 218 L 412 224 L 406 230"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 572 224 L 592 224"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 586 218 L 592 224 L 586 230"/><text x="52" y="300" class="nodeTitle">常用治疗手段（医师选择）</text><rect width="170" height="76" x="52" y="310" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><text x="62" y="332" class="body">皮下分离</text><text x="62" y="354" class="small">松解粘连</text><text x="62" y="372" class="small">滚轮型为主</text><rect width="170" height="76" x="232" y="310" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><text x="242" y="332" class="body">激光磨削</text><text x="242" y="354" class="small">点阵激光</text><text x="242" y="372" class="small">箱车、混合型</text><rect width="170" height="76" x="412" y="310" fill="#fbf5ea" stroke="#C9A876" rx="10"/><text x="422" y="332" class="body">微针射频</text><text x="422" y="354" class="small">刺激胶原重塑</text><text x="422" y="372" class="small">整体肤质改善</text><rect width="156" height="76" x="592" y="310" fill="#fbf0eb" stroke="#B5654A" rx="10"/><text x="602" y="332" class="body">填充注射</text><text x="602" y="354" class="small">临时支撑</text><text x="602" y="372" class="small">需多次评估</text><rect width="696" height="22" x="52" y="404" fill="#fbf0eb" rx="8"/><text x="400" y="420" fill="#B5654A" class="small" text-anchor="middle">不切实际承诺：一次平整、永久无痕、无需恢复</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">痘坑改善靠多次累积，不是一次抹平</text><text x="52" y="466" class="footer">健康科普示意 · 治疗方案需医师评估瘢痕类型后制定</text></svg>