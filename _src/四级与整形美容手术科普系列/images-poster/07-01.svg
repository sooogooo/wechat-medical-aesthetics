<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0701 desc0701" role="img" viewBox="0 0 900 620"><title id="title0701">颧骨高是不是骨性的</title><desc id="desc0701">骨性颧骨颧弓突出、软组织因素、整体比例三种来源，只有骨性才是手术对象</desc><defs><linearGradient id="bg0701" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0701" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0701)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0701)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 07</text><text x="62" y="117" class="title">&quot;颧骨高想推一推&quot;前先判断来源</text><text x="62" y="153" class="kicker">面中部宽或高，可能来自三种因素</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">骨性 vs 软组织 · 手术对象只有一种</text><rect width="252" height="270" x="62" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><rect width="252" height="44" x="62" y="232" fill="#D55E00" rx="14"/><rect width="252" height="16" x="62" y="260" fill="#D55E00"/><text x="188" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">骨性突出</text><text x="82" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="82" y="326" class="body">触诊摸到硬骨性突起</text><text x="82" y="348" class="body">影像可确认</text><text x="82" y="378" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="82" y="400" class="body">颧骨颧弓截骨内推</text><text x="82" y="422" class="body">钛板钛钉固定</text><text x="82" y="444" class="body">（四级手术）</text><rect width="212" height="36" x="82" y="454" fill="#fbeae3" rx="8"/><text x="188" y="476" class="small" text-anchor="middle">手术唯一针对的对象</text><rect width="252" height="270" x="324" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="252" height="44" x="324" y="232" fill="#E69F00" rx="14"/><rect width="252" height="16" x="324" y="260" fill="#E69F00"/><text x="450" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">软组织因素</text><text x="344" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="344" y="326" class="body">面部脂肪分布</text><text x="344" y="348" class="body">咬肌、苹果肌饱满</text><text x="344" y="378" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="344" y="400" class="body">非截骨方案</text><text x="344" y="422" class="body">脂肪或软组织调整</text><text x="344" y="444" class="body">（视情况）</text><rect width="212" height="36" x="344" y="454" fill="#fdf3e3" rx="8"/><text x="450" y="476" class="small" text-anchor="middle">削骨解决不了</text><rect width="252" height="270" x="586" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="252" height="44" x="586" y="232" fill="#0072B2" rx="14"/><rect width="252" height="16" x="586" y="260" fill="#0072B2"/><text x="712" y="261" fill="#fff" class="nodeTitle" text-anchor="middle">整体比例</text><text x="606" y="304" fill="#17323d" class="body" font-weight="700">特征</text><text x="606" y="326" class="body">颧骨本身不突出</text><text x="606" y="348" class="body">颞部凹陷或下面部窄</text><text x="606" y="370" class="body">显得颧骨高</text><text x="606" y="400" fill="#17323d" class="body" font-weight="700">处理方式</text><text x="606" y="422" class="body">处理颞部或下面部</text><text x="606" y="444" class="body">可能更合适</text><rect width="212" height="36" x="606" y="454" fill="#eef6f8" rx="8"/><text x="712" y="476" class="small" text-anchor="middle">判断需面诊和影像</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">骨性突出是主因时截骨才有意义，不是看自拍</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 颧骨颧弓成形术为四级手术，须在有相应资质机构开展</text></svg>