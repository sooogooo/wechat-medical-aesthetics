<svg xmlns="http://www.w3.org/2000/svg" aria-label="观念转变对比" role="img" viewBox="0 0 640 220"><rect width="640" height="220" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">观念转变：从庸俗到高级</text><rect width="280" height="130" x="30" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="170" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">庸俗型观念</text><text x="50" y="113" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;流行什么做什么&quot;</text><text x="50" y="135" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;越多越值&quot;</text><text x="50" y="157" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;必须看出变化&quot;</text><text x="50" y="179" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;别人都做我也做&quot;</text><rect width="280" height="130" x="330" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="470" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">高级型观念</text><text x="350" y="113" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;什么适合我做什么&quot;</text><text x="350" y="135" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;够好就停&quot;</text><text x="350" y="157" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;看不出但变好&quot;</text><text x="350" y="179" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• &quot;我有我的判断&quot;</text><text x="320" y="208" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">观念转变是第一步——没有观念转变，其他改变都难持久</text></svg>