<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t03f1 d03f1" role="img" viewBox="0 0 800 500"><title id="t03f1">荨麻疹危险信号识别流程</title><desc id="d03f1">单个风团24小时内消退，出现喉紧呼吸困难头晕需立即急诊</desc><defs><linearGradient id="bg03f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh03f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.footer,.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.small{fill:#5c6c72}.footer{fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg03f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh03f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 03</text><text x="56" y="90" class="title">荨麻疹危险信号识别</text><text x="56" y="116" class="kicker">单个风团通常24小时内消退，先排除急救信号</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="240" height="56" x="280" y="158" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><text x="400" y="182" class="body" font-weight="700" text-anchor="middle">突发剧痒风团</text><text x="400" y="202" class="small" text-anchor="middle">单个皮损 24 小时内消退</text><path fill="none" stroke="#7d8e93" stroke-width="1.6" d="M 400 218 L 400 240"/><path fill="none" stroke="#7d8e93" stroke-width="1.6" d="M 395 234 L 400 240 L 405 234"/><rect width="320" height="50" x="240" y="244" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><text x="400" y="266" class="body" text-anchor="middle">是否伴随以下任一信号</text><text x="400" y="284" class="small" text-anchor="middle">有则立即急诊 无则按慢性评估</text><path fill="none" stroke="#B5654A" stroke-width="1.6" d="M 320 294 L 180 330"/><path fill="none" stroke="#7A8B6F" stroke-width="1.6" d="M 480 294 L 620 330"/><rect width="300" height="124" x="56" y="334" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.8" rx="10"/><rect width="300" height="28" x="56" y="334" fill="#B5654A" rx="10"/><rect width="300" height="10" x="56" y="352" fill="#B5654A"/><text x="206" y="353" class="tag" text-anchor="middle">立即拨打120或急诊</text><text x="72" y="382" class="body">喉咙紧 声音嘶哑</text><text x="72" y="404" class="body">呼吸困难 喘鸣</text><text x="72" y="426" class="body">头晕 晕厥 血压下降</text><text x="72" y="448" fill="#8a3f2b" class="small">不要只吃抗过敏药等待</text><rect width="300" height="124" x="444" y="334" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.8" rx="10"/><rect width="300" height="28" x="444" y="334" fill="#7A8B6F" rx="10"/><rect width="300" height="10" x="444" y="352" fill="#7A8B6F"/><text x="594" y="353" class="tag" text-anchor="middle">皮肤科评估</text><text x="460" y="382" class="body">规律抗组胺控制</text><text x="460" y="404" class="body">记录发作与诱因</text><text x="460" y="426" class="body">慢性者设复评节点</text><text x="460" y="448" class="small">检查不是越多越好</text><text x="56" y="478" class="footer">医学教育示意 · 急性过敏反应进展迅速，疑似喉头水肿立即就医</text></svg>