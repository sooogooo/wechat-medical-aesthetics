  <line x1="486" y1="210" x2="506" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/>
  <rect x="508" y="150" width="128" height="120" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="572" y="192" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" fill="#2b2a28" font-weight="600" text-anchor="middle">四看客源</text><text x="572" y="218" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">直客 · 渠道</text><text x="572" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">电商占比</text>
  <line x1="640" y1="210" x2="660" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/>
  <rect x="662" y="150" width="128" height="120" rx="8" fill="#fff" stroke="#b5654a" stroke-width="1.6"/><text x="726" y="192" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" fill="#b5654a" font-weight="600" text-anchor="middle">五识红旗</text><text x="726" y="218" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">病态 KPI</text><text x="726" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">五个信号</text>
  <text x="400" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#c9a876" text-anchor="middle">前四查是信息动作，第五查是判断动作</text>
  <text x="400" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864" text-anchor="middle">杀手问题，考核口径是营业额还是利润，提成按收银还是按划扣</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">口头承诺的提成点位，在多本账的组织里等于不存在</text>
