<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t17f2 d17f2">
  <title id="t17f2">神经性皮炎止痒与少抓策略</title>
  <desc id="t17f2">给手和环境设置少抓一点的条件，把抓挠变成可观察行为</desc>
  <defs>
    <linearGradient id="bg17f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh17f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg17f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh17f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 17</text>
  <text x="56" y="90" class="title">止痒与少抓的四组策略</text>
  <text x="56" y="116" class="kicker">把抓挠从无意识变成可观察行为</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">四组并行策略</text>

  <rect x="56" y="174" width="335" height="92" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="28" rx="12" fill="#7A8B6F"/><rect x="56" y="192" width="335" height="10" fill="#7A8B6F"/>
  <text x="72" y="193" class="tag">药物止痒</text>
  <text x="72" y="224" class="body">外用抗炎药控制炎症</text>
  <text x="72" y="248" class="small">必要时口服药调节神经瘙痒</text>

  <rect x="409" y="174" width="335" height="92" rx="12" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="28" rx="12" fill="#C9A876"/><rect x="409" y="192" width="335" height="10" fill="#C9A876"/>
  <text x="425" y="193" class="tag">物理隔断</text>
  <text x="425" y="224" class="body">手套敷料短指甲</text>
  <text x="425" y="248" class="small">夜间睡眠时尤其有效</text>

  <rect x="56" y="278" width="335" height="92" rx="12" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6"/>
  <rect x="56" y="278" width="335" height="28" rx="12" fill="#8a6a3a"/><rect x="56" y="296" width="335" height="10" fill="#8a6a3a"/>
  <text x="72" y="297" class="tag">行为替代</text>
  <text x="72" y="328" class="body">痒时冷敷或拍打</text>
  <text x="72" y="352" class="small">替代抓挠的动作</text>

  <rect x="409" y="278" width="335" height="92" rx="12" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.6"/>
  <rect x="409" y="278" width="335" height="28" rx="12" fill="#5F6E54"/><rect x="409" y="296" width="335" height="10" fill="#5F6E54"/>
  <text x="425" y="297" class="tag">压力管理</text>
  <text x="425" y="328" class="body">睡眠放松规律作息</text>
  <text x="425" y="352" class="small">不是都是你想出来的</text>

  <!-- 复发地图 -->
  <text x="56" y="398" class="nodeTitle">复发时先找循环在哪一环重新启动</text>
  <rect x="56" y="412" width="688" height="44" rx="10" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.4"/>
  <text x="400" y="432" class="body" text-anchor="middle">记录发作前后的压力 睡眠 接触物 用药情况</text>
  <text x="400" y="448" class="small" text-anchor="middle">比笼统说我又复发了更有助于调整方案</text>
  <text x="56" y="474" class="footer">医学教育示意 · 诊断前要排除看起来也很厚的病 如银屑病真菌感染</text>
</svg>
