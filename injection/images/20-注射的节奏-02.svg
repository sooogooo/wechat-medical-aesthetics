<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="不同材料的补打节奏">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">不同材料，不同的补打节奏</text>

  <rect x="30" y="55" width="185" height="155" rx="8" fill="#ffffff" stroke="#7a8b6f"/>
  <text x="122" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">透明质酸</text>
  <text x="122" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">6–18 个月</text>
  <text x="122" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">效果消退后补打</text>
  <text x="122" y="160" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不要在仍有明显</text>
  <text x="122" y="176" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">效果时就加量</text>
  <text x="122" y="200" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#5f6e54">可溶，相对可控</text>

  <rect x="227" y="55" width="185" height="155" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="320" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">肉毒杆菌素</text>
  <text x="320" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">3–6 个月</text>
  <text x="320" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">效果消退后补打</text>
  <text x="320" y="160" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">避免过度频繁</text>
  <text x="320" y="176" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">（耐药风险）</text>
  <text x="320" y="200" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#8a7340">自行代谢，需持续</text>

  <rect x="424" y="55" width="185" height="155" rx="8" fill="#ffffff" stroke="#8a9a7f"/>
  <text x="516" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">再生刺激类</text>
  <text x="516" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">1–2 年</text>
  <text x="516" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">分次治疗达到效果</text>
  <text x="516" y="160" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">每次间隔数周到</text>
  <text x="516" y="176" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">数月，看胶原反应</text>
  <text x="516" y="200" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#b5654a">难溶，更需克制</text>

  <text x="320" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">补打节奏遵循材料特性，而不是“想补就补”</text>
</svg>