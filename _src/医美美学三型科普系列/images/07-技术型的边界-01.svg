<svg xmlns="http://www.w3.org/2000/svg" aria-label="技术型的能力" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">技术型能做什么（值得肯定）</text><rect width="180" height="150" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="120" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">客观化</text><text x="120" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">把模糊的&quot;感觉&quot;</text><text x="120" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">变成可讨论的</text><text x="120" y="156" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">数据</text><rect width="180" height="150" x="230" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="320" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">精准化</text><text x="320" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">降低操作</text><text x="320" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">随机性，效果</text><text x="320" y="156" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">更可复现</text><rect width="180" height="150" x="430" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="520" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">沟通化</text><text x="520" y="120" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">医患有共同</text><text x="520" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">语言，减少</text><text x="520" y="156" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">误解</text><text x="320" y="225" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">这些是技术型的真实价值，不应被否定</text></svg>