6" rx="12"/><rect width="165" height="28" x="48" y="200" fill="#7A8B6F" rx="12"/><rect width="165" height="10" x="48" y="218" fill="#7A8B6F"/><text x="130.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">第一级</text><text x="130.5" y="250" class="body" text-anchor="middle">止汗剂</text><text x="130.5" y="268" class="small" text-anchor="middle">氯化铝外用</text><path fill="none" stroke="#2B2A28" stroke-width="1.8" d="M 213 260 L 235 260"/><path fill="#2B2A28" d="M 235 260 l -8 -3 l 2 6 z"/><rect width="165" height="120" x="237" y="200" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="237" y="200" fill="#C9A876" rx="12"/><rect width="165" height="10" x="237" y="218" fill="#C9A876"/><text x="319.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">第二级</text><text x="319.5" y="250" class="body" text-anchor="middle">离子导入</text><text x="319.5" y="268" class="small" text-anchor="middle">自来水直流电</text><path fill="none" stroke="#2B2A28" stroke-width="1.8" d="M 402 260 L 424 260"/><path fill="#2B2A28" d="M 424 260 l -8 -3 l 2 6 z"/><rect width="165" height="120" x="426" y="200" fill="#fbfdfc" stroke="#A88654" stroke-width="1.6" rx="12"/><rect width="165" height="28" x="426" y="200" fill="#A88654" rx="12"/><rect width="165" height="10" x="426" y="218" fill="#A88654"/><text x="508.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">第三级</text><text x="508.5" y="250" class="body" text-anchor="middle">肉毒注射</text><text x="508.5" y="268" class="small" text-anchor="middle">可逆维持数月</text><rect width="135" height="120" x="609" y="200" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="135" height="28" x="609" y="200" fill="#B5654A" rx="12"/><rect width="135" height="10" x="609" y="218" fill="#B5654A"/><text x="676.5" y="220" fill="#fff" class="nodeT2" text-anchor="middle">第四级</text><text x="676.5" y="250" class="body" text-anchor="middle">交感手术</text><text x="676.5" y="268" class="small" text-anchor="middle">最后才考虑</text><rect width="9" height="9" x="60" y="348" fill="#7A8B6F" rx="2"/><text x="78" y="357" class="body">脚汗多还要管皮肤并发问题，如浸渍与足癣</text><rect width="704" height="40" x="48" y="370" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="395" class="quote" text-anchor="middle">治疗前先做一个可逆性排序</text><text x="48" y="462" class="footer">医学教育示意 · 治疗梯度要把副作用算进去</text></svg>