<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="三类材料出问题的处理路径">
  <rect width="640" height="240" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">出问题之后，处理难度对比</text>

  <rect x="30" y="55" width="185" height="150" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="122" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">透明质酸</text>
  <text x="122" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">可酶溶解</text>
  <text x="122" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">多数情况相对可逆</text>
  <text x="122" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">处理路径明确</text>
  <text x="122" y="195" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">后悔成本：较低</text>

  <rect x="227" y="55" width="185" height="150" rx="8" fill="#f4ede0" stroke="#c9a876"/>
  <text x="320" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">肉毒杆菌素</text>
  <text x="320" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">自行代谢消退</text>
  <text x="320" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">等待数月即可</text>
  <text x="320" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">多数可逆</text>
  <text x="320" y="195" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">后悔成本：中（需等待）</text>

  <rect x="424" y="55" width="185" height="150" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="516" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">再生刺激类</text>
  <text x="516" y="115" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">难溶解、难取</text>
  <text x="516" y="140" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">可能需手术</text>
  <text x="516" y="170" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">处理漫长、可能反复</text>
  <text x="516" y="195" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">后悔成本：高</text>

  <text x="320" y="225" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">“维持久”和“出问题难处理”是同一枚硬币的两面</text>
</svg>