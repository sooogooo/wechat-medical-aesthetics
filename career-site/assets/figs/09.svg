  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">签约之前按顺序做完，清单可直接带走</text>

  <rect x="46" y="150" width="128" height="120" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="110" y="192" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" fill="#2b2a28" font-weight="600" text-anchor="middle">一查机构</text><text x="110" y="218" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">执业许可</text><text x="110" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">行政处罚</text>
  <line x1="178" y1="210" x2="198" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/>
  <rect x="200" y="150" width="128" height="120" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/><text x="264" y="192" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" fill="#2b2a28" font-weight="600" text-anchor="middle">二查医生</text><text x="264" y="218" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">执业信息</text><text x="264" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#6b6864" text-anchor="middle">团队稳定性</text>
  <line x1="332" y1="210" x2="352" y2="210" stroke="#c9a876" stroke-width="1.6" marker-end="url(#ah-p2)"/>
