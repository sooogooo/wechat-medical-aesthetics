<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t37f1 d37f1" role="img" viewBox="0 0 800 500"><title id="t37f1">纹身色料位于真皮，激光按颜色选波长</title><desc id="d37f1">纹身与纹绣色料进入真皮层，激光需按颜色匹配波长多次击碎色素</desc><defs><linearGradient id="bg37f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh37f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.tag{font:700 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg37f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh37f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 37</text><text x="52" y="92" class="title">色料在真皮，激光按颜色选波长</text><text x="52" y="116" class="kicker">黑蓝相对容易，红黄绿彩更难，肤色白色可能反而变色</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">皮肤分层与色料所在</text><rect width="300" height="44" x="52" y="172" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.5" rx="8"/><text x="68" y="192" class="body">表皮层</text><text x="68" y="208" class="small">几乎无色料，可再修复</text><rect width="300" height="64" x="52" y="222" fill="#eef3ec" stroke="#5F6E54" stroke-width="2" rx="8"/><text x="68" y="244" class="body">真皮层（色料主要停留处）</text><text x="68" y="262" class="small">被巨噬细胞包裹，形成&quot;稳定&quot;颗粒</text><text x="68" y="278" class="small">激光击碎后由机体缓慢代谢</text><rect width="300" height="44" x="52" y="292" fill="#f8fbfb" stroke="#C9A876" stroke-width="1.5" rx="8"/><text x="68" y="312" class="body">皮下组织</text><text x="68" y="328" class="small">深部色料更难清除</text><text x="388" y="162" class="nodeTitle">颜色与波长对照</text><rect width="360" height="36" x="388" y="172" fill="#5F6E54" rx="8"/><text x="404" y="195" class="tag">黑 · 蓝</text><text x="640" y="195" fill="#fff" class="small">1064nm 相对容易</text><rect width="360" height="36" x="388" y="214" fill="#C9A876" rx="8"/><text x="404" y="237" class="tag">绿 · 紫</text><text x="630" y="237" fill="#fff" class="small">需特殊波长 较难</text><rect width="360" height="36" x="388" y="256" fill="#B5654A" rx="8"/><text x="404" y="279" class="tag">红 · 黄 · 橙</text><text x="620" y="279" fill="#fff" class="small">532nm 注意变色风险</text><rect width="360" height="36" x="388" y="298" fill="#2B2A28" rx="8"/><text x="404" y="321" class="tag">白 · 肤色</text><text x="610" y="321" fill="#fff" class="small">可能瞬间变黑，慎做</text><text x="52" y="368" class="nodeTitle">治疗节奏</text><rect width="170" height="40" x="52" y="378" fill="#eef6f8" stroke="#7A8B6F" rx="10"/><text x="137" y="394" class="body" text-anchor="middle">多次治疗</text><text x="137" y="410" class="small" text-anchor="middle">间隔数周至数月</text><rect width="170" height="40" x="238" y="378" fill="#eef6f8" stroke="#7A8B6F" rx="10"/><text x="323" y="394" class="body" text-anchor="middle">逐次碎裂</text><text x="323" y="410" class="small" text-anchor="middle">能量需循序渐进</text><rect width="170" height="40" x="424" y="378" fill="#fff8ee" stroke="#C9A876" rx="10"/><text x="509" y="394" class="body" text-anchor="middle">淡化不等于清零</text><text x="509" y="410" class="small" text-anchor="middle">可能留痕或反色</text><rect width="696" height="32" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="453" class="quote" text-anchor="middle">洗纹身是淡化，不是恢复原皮</text><text x="52" y="466" class="footer">健康科普示意 · 具体方案与波长选择需由医师面诊评估</text></svg>