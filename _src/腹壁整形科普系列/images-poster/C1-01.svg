<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleC101 descC101">
  <title id="titleC101">疤痕的位置与长度现实</title>
  <desc id="descC101">各术式疤痕相对长度示意，迷你型到环形，倒 T 型另有纵疤</desc>
  <defs>
    <marker id="ahC101" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · C1</text>
  <text x="62" y="112" class="title">疤痕的位置与长度现实</text>
  <text x="62" y="148" class="kicker">术式决定疤的长度，可能增生变宽，可能外露</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>

  <text x="62" y="206" class="small">术式</text>
  <text x="210" y="206" class="small">相对切口长度（示意）</text>

  <text x="62" y="236" class="midTitle">迷你型</text>
  <rect x="210" y="222" width="120" height="10" rx="5" fill="#0072B2"/>
  <text x="344" y="236" class="small">下腹短横切口</text>

  <text x="62" y="290" class="midTitle">标准型</text>
  <rect x="210" y="276" width="240" height="10" rx="5" fill="#0B8A6B"/>
  <text x="464" y="290" class="small">髋到髋横切口</text>

  <text x="62" y="344" class="midTitle">延伸型</text>
  <rect x="210" y="330" width="380" height="10" rx="5" fill="#D9930D"/>
  <text x="604" y="344" class="small">延伸绕到侧腰</text>

  <text x="62" y="398" class="midTitle">环形</text>
  <rect x="210" y="384" width="540" height="10" rx="5" fill="#C75B00"/>
  <text x="764" y="398" class="small">绕躯干一周</text>

  <text x="62" y="452" class="midTitle">倒 T 型</text>
  <rect x="210" y="438" width="280" height="10" rx="5" fill="#B36A98"/>
  <rect x="347" y="410" width="6" height="30" rx="3" fill="#B36A98"/>
  <text x="504" y="452" class="small">横＋正中纵切口</text>
  <text x="62" y="492" class="small">标准型及以上，脐周另有一圈疤，可能增生、变宽，穿低腰裤、泳装时可能显露</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">对疤痕的接受度，是决策的核心之一</text>
  <text x="62" y="580" class="footer">医学教育示意，非教学图 · 疤痕最终表现因人而异</text>
</svg>
