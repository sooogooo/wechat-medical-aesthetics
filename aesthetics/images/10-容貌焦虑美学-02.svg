<svg xmlns="http://www.w3.org/2000/svg" aria-label="容貌焦虑的制造机制" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">焦虑不是天生的，是被制造的</text><rect width="140" height="230" x="30" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="100" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">单一标准</text><text x="100" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">某种审美</text><text x="100" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">被塑造成</text><text x="100" y="152" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;唯一正确&quot;</text><rect width="140" height="230" x="180" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="250" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">无限比较</text><text x="250" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">社交媒体</text><text x="250" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">滤镜美化</text><text x="250" y="152" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">永远有</text><text x="250" y="169" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;更美的人&quot;</text><rect width="140" height="230" x="330" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="400" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">缺陷放大</text><text x="400" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;你的 X 不够 Y&quot;</text><text x="400" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">机构营销</text><text x="400" y="152" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">把正常</text><text x="400" y="169" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">说成缺陷</text><rect width="140" height="230" x="480" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="550" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">即时解决</text><text x="550" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;做了就好&quot;</text><text x="550" y="135" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">的消费承诺</text><text x="550" y="152" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">把焦虑转化</text><text x="550" y="169" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">为购买行为</text><text x="320" y="310" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">四个环节环环相扣——焦虑不是你&quot;矫情&quot;，是一套成熟的商业机制</text></svg>