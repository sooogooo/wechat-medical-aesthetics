<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t00f1 d00f1">
  <title id="t00f1">痤疮四个等级，从堵塞到留疤</title>
  <desc id="d00f1">粉刺、丘疹脓疱、结节囊肿代表炎症由浅入深，留疤风险逐级升高</desc>
  <defs>
    <linearGradient id="bg00f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh00f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .lvl{font:700 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg00f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh00f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 00</text>
  <text x="56" y="90" class="title">痤疮四个等级 从堵塞到留疤</text>
  <text x="56" y="116" class="kicker">先看类型和深度，而不是只数多少颗</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">炎症由浅入深，留疤风险逐级升高</text>

  <!-- 四级阶梯 -->
  <rect x="56" y="180" width="160" height="120" rx="12" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="2"/>
  <rect x="56" y="180" width="160" height="30" rx="12" fill="#7A8B6F"/><rect x="56" y="200" width="160" height="10" fill="#7A8B6F"/>
  <text x="136" y="201" class="lvl" text-anchor="middle">一级 粉刺</text>
  <text x="136" y="234" class="body" text-anchor="middle">白头 黑头 闭口</text>
  <text x="136" y="254" class="small" text-anchor="middle">毛囊口堵塞为主</text>
  <text x="136" y="274" class="small" text-anchor="middle">炎症轻微</text>

  <rect x="232" y="200" width="160" height="120" rx="12" fill="#f8fbfb" stroke="#C9A876" stroke-width="2"/>
  <rect x="232" y="200" width="160" height="30" rx="12" fill="#C9A876"/><rect x="232" y="220" width="160" height="10" fill="#C9A876"/>
  <text x="312" y="221" class="lvl" text-anchor="middle">二级 丘疹脓疱</text>
  <text x="312" y="254" class="body" text-anchor="middle">红肿 灼热 起脓头</text>
  <text x="312" y="274" class="small" text-anchor="middle">炎症已较明显</text>
  <text x="312" y="294" class="small" text-anchor="middle">留红痘印风险升高</text>

  <rect x="408" y="220" width="160" height="120" rx="12" fill="#fff8ee" stroke="#B5654A" stroke-width="2"/>
  <rect x="408" y="220" width="160" height="30" rx="12" fill="#B5654A"/><rect x="408" y="240" width="160" height="10" fill="#B5654A"/>
  <text x="488" y="241" class="lvl" text-anchor="middle">三级 结节囊肿</text>
  <text x="488" y="274" class="body" text-anchor="middle">深在 疼痛 迟迟不退</text>
  <text x="488" y="294" class="small" text-anchor="middle">真皮深层炎症</text>
  <text x="488" y="314" class="small" text-anchor="middle">凹陷痘坑风险高</text>

  <rect x="584" y="240" width="160" height="120" rx="12" fill="#fdf1ee" stroke="#8a3f2b" stroke-width="2.5"/>
  <rect x="584" y="240" width="160" height="30" rx="12" fill="#8a3f2b"/><rect x="584" y="260" width="160" height="10" fill="#8a3f2b"/>
  <text x="664" y="261" class="lvl" text-anchor="middle">四级 瘢痕</text>
  <text x="664" y="294" class="body" text-anchor="middle">滚轮 箱车 冰锥</text>
  <text x="664" y="314" class="small" text-anchor="middle">真皮结构已改变</text>
  <text x="664" y="334" class="small" text-anchor="middle">需先控痘再处理</text>

  <path d="M 196 285 Q 400 235 584 295" stroke="#7d8e93" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/>
  <path d="M 578 288 L 584 295 L 574 298" fill="none" stroke="#7d8e93" stroke-width="1.6"/>
  <text x="400" y="385" class="small" text-anchor="middle">越早控制炎症 · 越能减少痘印和永久性痘坑</text>

  <rect x="56" y="402" width="688" height="36" rx="10" fill="#eef4ee"/>
  <text x="400" y="425" class="quote" text-anchor="middle">痤疮是慢性炎症，不是脸没洗干净</text>
  <text x="56" y="458" class="footer">医学教育示意 · 严重度分级与方案需皮肤科面诊确定</text>
</svg>
