<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="动态纹与静态纹的表情测试">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">一个简单的判断方法</text>

  <!-- 静态脸 -->
  <rect x="40" y="60" width="260" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="170" cy="150" rx="55" ry="70" fill="#f3efe8" stroke="#a8a39d"/>
  <ellipse cx="148" cy="135" rx="5" ry="3" fill="#a8a39d"/>
  <ellipse cx="192" cy="135" rx="5" ry="3" fill="#a8a39d"/>
  <line x1="155" y1="172" x2="185" y2="172" stroke="#a8a39d" stroke-width="1.5"/>
  <text x="170" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">面部放松</text>
  <text x="170" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">不动时</text>

  <!-- 动态脸 -->
  <rect x="340" y="60" width="260" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="470" cy="150" rx="55" ry="70" fill="#f3efe8" stroke="#a8a39d"/>
  <ellipse cx="448" cy="128" rx="5" ry="3" fill="#a8a39d"/>
  <ellipse cx="492" cy="128" rx="5" ry="3" fill="#a8a39d"/>
  <!-- 抬头纹 -->
  <path d="M 440 105 L 460 103 M 440 112 L 460 110 M 440 119 L 460 117" stroke="#7a8b6f" stroke-width="1.5"/>
  <!-- 鱼尾纹 -->
  <path d="M 425 135 L 415 132 M 425 140 L 413 140 M 425 145 L 415 148" stroke="#7a8b6f" stroke-width="1.5"/>
  <path d="M 515 135 L 525 132 M 515 140 L 527 140 M 515 145 L 525 148" stroke="#7a8b6f" stroke-width="1.5"/>
  <!-- 笑嘴 -->
  <path d="M 450 172 Q 470 185 490 172" stroke="#a8a39d" stroke-width="1.5" fill="none"/>
  <text x="470" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">做表情</text>
  <text x="470" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">抬眉、笑、皱眉时</text>

  <text x="320" y="266" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">放松时没有、表情时出现的纹 = 动态纹；放松时就在的纹 = 静态纹</text>
</svg>