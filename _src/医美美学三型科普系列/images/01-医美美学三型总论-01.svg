<svg xmlns="http://www.w3.org/2000/svg" aria-label="医美美学三型分类框架" role="img" viewBox="0 0 720 420"><rect width="720" height="420" fill="#faf8f4" rx="12"/><text x="360" y="34" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">医美美学三型：从结果与思路分类</text><rect width="360" height="50" x="180" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="360" y="82" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">分类维度</text><text x="360" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">思路 × 结果：是&quot;怎么想 + 怎么做 + 做出来什么样&quot;</text><rect width="210" height="250" x="40" y="130" fill="#fff" stroke="#7a8b6f" stroke-width="2" rx="10"/><rect width="210" height="44" x="40" y="130" fill="#7a8b6f" rx="10"/><rect width="210" height="10" x="40" y="164" fill="#7a8b6f"/><text x="145" y="158" fill="#fff" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">高级型</text><text x="60" y="200" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">思路：克制、整体、</text><text x="60" y="218" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">个性化</text><text x="60" y="248" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">结果：</text><text x="60" y="268" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">• 耐看、协调</text><text x="60" y="288" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">• 保留辨识度</text><text x="60" y="308" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">• 看不出但变好</text><text x="60" y="340" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">本系列倡导</text><rect width="210" height="250" x="255" y="130" fill="#fff" stroke="#c9a876" stroke-width="2" rx="10"/><rect width="210" height="44" x="255" y="130" fill="#c9a876" rx="10"/><rect width="210" height="10" x="255" y="164" fill="#c9a876"/><text x="360" y="158" fill="#fff" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">技术型</text><text x="275" y="200" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">思路：精准、数据、</text><text x="275" y="218" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">参数驱动</text><text x="275" y="248" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11">结果：</text><text x="275" y="268" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11">• 精准可复现</text><text x="275" y="288" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11">• 有数据支撑</text><text x="275" y="308" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11">• 但有审美边界</text><text x="275" y="340" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">客观介绍</text><rect width="210" height="250" x="470" y="130" fill="#fff" stroke="#b5654a" stroke-width="2" rx="10"/><rect width="210" height="44" x="470" y="130" fill="#b5654a" rx="10"/><rect width="210" height="10" x="470" y="164" fill="#b5654a"/><text x="575" y="158" fill="#fff" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">庸俗型</text><text x="490" y="200" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">思路：过度、趋同、</text><text x="490" y="218" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">套模板、追流行</text><text x="490" y="248" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11">结果：</text><text x="490" y="268" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11">• 显假、显俗</text><text x="490" y="288" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11">• 千篇一律</text><text x="490" y="308" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11">• 一眼看穿</text><text x="490" y="340" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">本系列警示</text><text x="360" y="405" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">三型不是对人的分类，而是对医美思路与结果的分类——同一个人可能落在不同型</text></svg>