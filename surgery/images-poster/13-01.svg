<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1301 desc1301">
  <title id="title1301">假体隆乳的五个关键选择</title>
  <desc id="desc1301">隆乳假体选择涉及填充材料、形状、层次、切口、大小五个维度</desc>
  <defs>
    <linearGradient id="bg1301" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1301" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1301)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1301)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 13</text>
  <text x="62" y="117" class="title">假体隆乳：五个关键选择</text>
  <text x="62" y="153" class="kicker">由医生根据解剖和诉求提出建议，不是你想多大就多大</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 五张小卡（3+2 布局） -->
  <!-- 卡1 填充材料 -->
  <rect x="62" y="208" width="250" height="148" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="100" cy="244" r="20" fill="#0072B2"/>
  <text x="100" y="252" class="num" text-anchor="middle">1</text>
  <text x="132" y="250" class="nodeTitle">填充材料</text>
  <text x="82" y="285" class="body">硅胶假体（最常用）</text>
  <text x="82" y="310" class="body">盐水假体</text>
  <text x="82" y="340" class="small">毛面／光面 · 凝胶特性细分</text>

  <!-- 卡2 形状 -->
  <rect x="325" y="208" width="250" height="148" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="363" cy="244" r="20" fill="#0072B2"/>
  <text x="363" y="252" class="num" text-anchor="middle">2</text>
  <text x="395" y="250" class="nodeTitle">形状</text>
  <text x="345" y="285" class="body">圆形</text>
  <text x="345" y="310" class="body">解剖型（水滴形）</text>
  <text x="345" y="340" class="small">适合不同基础与诉求</text>

  <!-- 卡3 层次 -->
  <rect x="588" y="208" width="250" height="148" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="626" cy="244" r="20" fill="#E69F00"/>
  <text x="626" y="252" class="num" text-anchor="middle">3</text>
  <text x="658" y="250" class="nodeTitle">层次</text>
  <text x="608" y="285" class="body">胸大肌后</text>
  <text x="608" y="310" class="body">双平面／乳腺后</text>
  <text x="608" y="340" class="small">影响手感与包膜挛缩率</text>

  <!-- 卡4 切口 -->
  <rect x="62" y="370" width="380" height="148" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="100" cy="406" r="20" fill="#E69F00"/>
  <text x="100" y="414" class="num" text-anchor="middle">4</text>
  <text x="132" y="412" class="nodeTitle">切口</text>
  <text x="82" y="447" class="body">乳晕 · 乳房下皱襞 · 腋窝</text>
  <text x="82" y="472" class="body">影响疤痕位置与操作难度</text>
  <text x="82" y="500" class="small">示意，非教学图 · 不展示具体点位</text>

  <!-- 卡5 大小 -->
  <rect x="458" y="370" width="380" height="148" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="496" cy="406" r="20" fill="#D55E00"/>
  <text x="496" y="414" class="num" text-anchor="middle">5</text>
  <text x="528" y="412" class="nodeTitle">大小</text>
  <text x="478" y="447" class="body">不是想多大就多大</text>
  <text x="478" y="472" class="body">需综合胸廓宽度、皮肤弹性、组织厚度</text>
  <rect x="478" y="485" width="340" height="26" rx="6" fill="#fbeae3"/>
  <text x="648" y="503" class="small" text-anchor="middle">过大假体会增加远期并发症</text>

  <!-- 金句 -->
  <rect x="62" y="530" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="556" class="quote" text-anchor="middle">单方面决定要最大号，往往是远期问题的开始</text>

  <text x="62" y="582" class="footer">医学教育示意 · 选择逻辑须由医生面诊后提出 · 不展示可模仿的切口点位</text>
</svg>
