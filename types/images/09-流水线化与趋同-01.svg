<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="庸俗型医美的流水线">
  <rect width="720" height="300" fill="#faf8f4" rx="12"/>
  <text x="360" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">庸俗型医美的&quot;流水线&quot;</text>

  <!-- 流水线节点 -->
  <rect x="30" y="100" width="120" height="100" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="90" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">进店</text>
  <text x="90" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">咨询师接待</text>
  <text x="90" y="168" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;评估&quot;诉求</text>

  <polygon points="160,150 175,140 175,160" fill="#b5654a"/>

  <rect x="180" y="100" width="120" height="100" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="240" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">推销套餐</text>
  <text x="240" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;全套解决方案&quot;</text>
  <text x="240" y="168" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不顾个体差异</text>

  <polygon points="310,150 325,140 325,160" fill="#b5654a"/>

  <rect x="330" y="100" width="120" height="100" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="390" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">套模板</text>
  <text x="390" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;网红同款&quot;</text>
  <text x="390" y="168" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;明星款&quot;</text>

  <polygon points="460,150 475,140 475,160" fill="#b5654a"/>

  <rect x="480" y="100" width="120" height="100" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="540" y="128" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">医生执行</text>
  <text x="540" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">快速操作</text>
  <text x="540" y="168" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">批量节奏</text>

  <polygon points="610,150 625,140 625,160" fill="#b5654a"/>

  <rect x="630" y="100" width="60" height="100" rx="8" fill="#b5654a"/>
  <text x="660" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#ffffff">标准</text>
  <text x="660" y="163" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#ffffff">品脸</text>

  <text x="360" y="240" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">每个节点都在消除个体差异——最终产出趋同的&quot;标准品&quot;</text>
  <text x="360" y="270" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">流水线的特征：高效、可复制、利润高——但代价是个体性的丧失</text>
</svg>