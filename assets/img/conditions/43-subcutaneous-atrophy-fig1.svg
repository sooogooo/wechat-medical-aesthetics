<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t43f1 d43f1" role="img" viewBox="0 0 800 500"><title id="t43f1">皮肤凹陷可能涉及多层组织</title><desc id="d43f1">外伤手术感染或注射后皮肤凹陷可能涉及真皮脂肪和深层粘连</desc><defs><linearGradient id="bg43f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh43f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.layer{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg43f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh43f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 43</text><text x="52" y="92" class="title">凹陷不止在表面</text><text x="52" y="116" class="kicker">磨皮只解决表层，深层缺损要先评估层次和活动度</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">分层模型与常见凹陷原因</text><rect width="320" height="220" x="52" y="180" fill="#5F6E54" rx="10"/><text x="68" y="206" class="layer">表皮 + 真皮</text><text x="68" y="226" class="layer" font-size="12">瘢痕、变薄、磨削可改善</text><rect width="320" height="70" x="52" y="250" fill="#C9A876" rx="10"/><text x="68" y="276" class="layer">皮下脂肪</text><text x="68" y="296" class="layer" font-size="12">萎缩或被吸收</text><text x="68" y="312" class="layer" font-size="12">凹陷的常见层次</text><rect width="320" height="70" x="52" y="330" fill="#B5654A" rx="10"/><text x="68" y="356" class="layer">筋膜 · 肌肉 · 粘连</text><text x="68" y="376" class="layer" font-size="12">深层牵拉形成&quot;酒窝&quot;</text><text x="68" y="392" class="layer" font-size="12">表面处理无效</text><text x="396" y="162" class="nodeTitle">常见原因</text><rect width="352" height="220" x="396" y="180" fill="#f8fbfb" stroke="#7A8B6F" rx="10"/><circle cx="412" cy="210" r="3" fill="#5F6E54"/><text x="424" y="214" class="body">外伤撕裂、瘢痕粘连</text><circle cx="412" cy="240" r="3" fill="#5F6E54"/><text x="424" y="244" class="body">手术切除后局部缺损</text><circle cx="412" cy="270" r="3" fill="#C9A876"/><text x="424" y="274" class="body">局部激素或注射后脂肪萎缩</text><circle cx="412" cy="300" r="3" fill="#C9A876"/><text x="424" y="304" class="body">感染脓肿愈合后</text><circle cx="412" cy="330" r="3" fill="#B5654A"/><text x="424" y="334" class="body">医美填充吸收或移位</text><circle cx="412" cy="360" r="3" fill="#B5654A"/><text x="424" y="364" class="body">结缔组织病、先天因素</text><circle cx="412" cy="388" r="3" fill="#B5654A"/><text x="424" y="392" class="body">不明原因需排查</text><text x="52" y="420" class="nodeTitle">面诊评估三问</text><rect width="230" height="30" x="52" y="432" fill="#5F6E54" rx="8"/><text x="167" y="452" fill="#fff" class="small" text-anchor="middle">哪一层缺损</text><rect width="200" height="30" x="298" y="432" fill="#C9A876" rx="8"/><text x="398" y="452" fill="#fff" class="small" text-anchor="middle">能否活动</text><rect width="234" height="30" x="514" y="432" fill="#5F6E54" rx="8"/><text x="631" y="452" fill="#fff" class="small" text-anchor="middle">是否还在进展</text><text x="52" y="470" class="footer">健康科普示意 · 凹陷层次与方案需医师触诊与影像评估</text></svg>