<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p1" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2f4858" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#2f4858" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">乱象是真的，机会也是真的</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">行业周期与监管节奏</text><line x1="80" x2="720" y1="280" y2="280" stroke="#2b2a28" stroke-width="1.8"/><circle cx="80" cy="280" r="5" fill="#2b2a28"/><text x="80" y="316" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">2018 年末</text><text x="80" y="250" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">大批机构倒闭</text><circle cx="253" cy="280" r="5" fill="#2b2a28"/><text x="253" y="316" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">2019</text><text x="253" y="250" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">消费低迷担忧</text><circle cx="426" cy="280" r="5" fill="#2b2a28"/><text x="426" y="316" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">2021</text><text x="426" y="250" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">咨询师取缔提案</text><circle cx="600" cy="280" r="5" fill="#2f4858"/><text x="600" y="316" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">2025</text><text x="600" y="250" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="600" text-anchor="middle">十四部门联合整治</text><circle cx="720" cy="280" r="5" fill="#2f4858"/><text x="720" y="316" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">下一轮</text><line x1="80" x2="720" y1="200" y2="200" stroke="#e4ddd2" stroke-dasharray="4 4" stroke-width="1.4"/><text x="400" y="190" fill="#2f4858" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" text-anchor="middle">每 10 年一次大变化 · 整治是周期性天气，不是一次性事件</text><text x="400" y="392" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">入场时间风险自检，赌现状的钱还是转型的钱，能承受多长逆风</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">不成熟既生产黑机构，也生产空白</text></svg>