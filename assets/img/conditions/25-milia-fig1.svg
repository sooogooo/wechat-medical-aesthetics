dth="1.6" rx="12"/><rect width="220" height="28" x="48" y="188" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="48" y="206" fill="#7A8B6F"/><text x="158" y="208" fill="#fff" class="nodeT2" text-anchor="middle">粟丘疹</text><text x="158" y="238" class="body" text-anchor="middle">表皮下角蛋白囊肿</text><text x="158" y="256" class="small" text-anchor="middle">白黄色，质硬，挤不动</text><rect width="220" height="170" x="290" y="188" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="188" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="206" fill="#C9A876"/><text x="400" y="208" fill="#fff" class="nodeT2" text-anchor="middle">汗管瘤</text><text x="400" y="238" class="body" text-anchor="middle">肤色肉色小丘疹</text><text x="400" y="256" class="small" text-anchor="middle">较软，成片分布</text><rect width="220" height="170" x="532" y="188" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="532" y="188" fill="#B5654A" rx="12"/><rect width="220" height="10" x="532" y="206" fill="#B5654A"/><text x="642" y="208" fill="#fff" class="nodeT2" text-anchor="middle">扁平疣</text><text x="642" y="238" class="body" text-anchor="middle">平顶小丘疹</text><text x="642" y="256" class="small" text-anchor="middle">可沿抓痕排列</text><text x="400" y="395" class="small" text-anchor="middle">自己用针挑容易留下红印甚至感染</text><rect width="704" height="28" x="48" y="410" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="429" class="quote" text-anchor="middle">不痛不痒，可以完全不管</text><text x="48" y="462" class="footer">医学教育示意 · 与血脂无关，稳定无症状可不处理</text></svg>