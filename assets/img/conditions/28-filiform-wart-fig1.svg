<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t28 d28" role="img" viewBox="0 0 800 500"><title id="t28">脖子眼皮的“小肉刺”</title><desc id="d28">丝状疣和皮赘不是一回事</desc><defs><linearGradient id="bg28" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh28" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT,.nodeT2{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.nodeT2{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg28)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh28)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 28</text><text x="48" y="92" class="title">脖子眼皮的“小肉刺”</text><text x="48" y="116" class="kicker">丝状疣和皮赘不是一回事</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">细长突起可能是谁</text><rect width="220" height="170" x="48" y="188" fill="#fbfdfc" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="48" y="188" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="48" y="206" fill="#7A8B6F"/><text x="158" y="208" fill="#fff" class="nodeT2" text-anchor="middle">丝状疣</text><text x="158" y="238" class="body" text-anchor="middle">HPV相关皮肤疣</text><text x="158" y="256" class="small" text-anchor="middle">细长指状，可传播</text><rect width="220" height="170" x="290" y="188" fill="#fbfdfc" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="188" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="206" fill="#C9A876"/><text x="400" y="208" fill="#fff" class="nodeT2" text-anchor="middle">皮赘</text><text x="400" y="238" class="body" text-anchor="middle">结缔组织软纤维瘤</text><text x="400" y="256" class="small" text-anchor="middle">柔软无传染性</text><rect width="220" height="170" x="532" y="188" fill="#fbfdfc" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="532" y="188" fill="#B5654A" rx="12"/><rect width="220" height="10" x="532" y="206" fill="#B5654A"/><text x="642" y="208" fill="#fff" class="nodeT2" text-anchor="middle">其他需鉴别</text><text x="642" y="238" class="body" text-anchor="middle">痣、纤维瘤等</text><text x="642" y="256" class="small" text-anchor="middle">形态变化需活检</text><text x="400" y="395" class="small" text-anchor="middle">不能靠形容词确诊，是否传染决定处理思路</text><rect width="704" height="28" x="48" y="410" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="429" class="quote" text-anchor="middle">不要把普通疣和高危型HPV混为一谈</text><text x="48" y="462" class="footer">医学教育示意 · 细长突起也可能是皮赘或软纤维瘤</text></svg>