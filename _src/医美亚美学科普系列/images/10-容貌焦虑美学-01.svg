<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="容貌焦虑的循环">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">容貌焦虑的循环</text>

  <!-- 循环图 -->
  <ellipse cx="160" cy="150" rx="70" ry="40" fill="#f7ece6" stroke="#b5654a"/>
  <text x="160" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">&quot;我不够美&quot;</text>
  <text x="160" y="163" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">焦虑感</text>

  <path d="M 230 150 Q 280 100 330 130" stroke="#b5654a" stroke-width="2" fill="none" marker-end="url(#anx)"/>

  <ellipse cx="400" cy="150" rx="70" ry="40" fill="#f4ede0" stroke="#c9a876"/>
  <text x="400" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">寻找&quot;解决方案&quot;</text>
  <text x="400" y="163" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">医美项目</text>

  <path d="M 470 150 Q 520 200 480 220" stroke="#c9a876" stroke-width="2" fill="none" marker-end="url(#anx)"/>

  <ellipse cx="400" cy="240" rx="70" ry="30" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="400" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">短暂满足</text>

  <path d="M 330 240 Q 250 240 200 200" stroke="#7a8b6f" stroke-width="2" fill="none" marker-end="url(#anx)"/>
  <text x="240" y="225" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">发现新的&quot;不够&quot;</text>

  <defs>
    <marker id="anx" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#a8a39d"/>
    </marker>
  </defs>

  <text x="320" y="270" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">焦虑 → 消费 → 短暂满足 → 新的焦虑——这是一个永不停歇的循环</text>
</svg>