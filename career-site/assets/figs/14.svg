<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p4" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#5f6e54" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#5f6e54" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">被高估的机会与被低估的代价</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">每条都标了证据强度</text><rect width="310" height="250" x="60" y="116" fill="#edf0ea" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="215" y="146" fill="#5f6e54" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle">机会四条</text><text x="80" y="178" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">翻译者缺口（买方稀少）</text><text x="80" y="208" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">公立窗口（待核实）</text><text x="80" y="238" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">表达者红利</text><text x="80" y="268" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">AI 窗口（宽度待核验）</text><text x="80" y="330" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">真实，但多数带但字</text><rect width="310" height="250" x="430" y="116" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="585" y="146" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle">代价四条</text><text x="450" y="178" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">职业声望折价</text><text x="450" y="208" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">薪酬结构落差</text><text x="450" y="238" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">以为看懂了的风险加倍</text><text x="450" y="268" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13">天花板是结构性的</text><text x="585" y="330" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">全部成立，且互相叠加计息</text><text x="400" y="410" fill="#5f6e54" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">名校牌买不到行业信用，只能买到一个月的耐心</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">最优策略，不带救世主心态来，带学生心态来</text></svg>