<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2301 desc2301" role="img" viewBox="0 0 900 620"><title id="title2301">眼周问题的来源分型</title><desc id="desc2301">上睑松垂、眼袋、上睑下垂（提肌问题）等眼周问题来源不同，处理方式不同，关键区分提肌无力与皮肤松弛</desc><defs><linearGradient id="bg2301" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2301" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff;letter-spacing:1px}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2301)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2301)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 23</text><text x="62" y="117" class="title">眼周问题分清来源再动手</text><text x="62" y="153" class="kicker">提肌无力和皮肤松弛是两回事，处理方式完全不同</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">眼周六类常见问题</text><rect width="250" height="125" x="62" y="240" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="250" height="36" x="62" y="240" fill="#0072B2" rx="14"/><rect width="250" height="14" x="62" y="262" fill="#0072B2"/><text x="187" y="264" class="tag" text-anchor="middle">上睑松垂</text><text x="82" y="302" class="body">上睑皮肤松弛下垂</text><text x="82" y="326" class="body">严重者遮挡视线</text><text x="82" y="350" class="small">皮肤切除为主，常联合重睑</text><rect width="250" height="125" x="325" y="240" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="250" height="36" x="325" y="240" fill="#E69F00" rx="14"/><rect width="250" height="14" x="325" y="262" fill="#E69F00"/><text x="450" y="264" class="tag" text-anchor="middle">眼袋</text><text x="345" y="302" class="body">眶隔脂肪疝出</text><text x="345" y="326" class="body">下睑膨隆显疲态</text><text x="345" y="350" class="small">去脂或重分布脂肪为主</text><rect width="250" height="125" x="588" y="240" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5" rx="14"/><rect width="250" height="36" x="588" y="240" fill="#D55E00" rx="14"/><rect width="250" height="14" x="588" y="262" fill="#D55E00"/><text x="713" y="264" class="tag" text-anchor="middle">上睑下垂（提肌）</text><text x="608" y="302" class="body">提肌无力、睁眼费力</text><text x="608" y="326" class="body">功能性手术</text><text x="608" y="350" class="small">非单纯双眼皮能解决</text><rect width="250" height="125" x="62" y="380" fill="#f8fbfb" stroke="#009E73" stroke-width="2" rx="14"/><rect width="250" height="36" x="62" y="380" fill="#009E73" rx="14"/><rect width="250" height="14" x="62" y="402" fill="#009E73"/><text x="187" y="404" class="tag" text-anchor="middle">重睑形态</text><text x="82" y="442" class="body">单眼皮或调整形态</text><text x="82" y="466" class="body">左右差异</text><text x="82" y="490" class="small">重睑成形或修整</text><rect width="250" height="125" x="325" y="380" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="250" height="36" x="325" y="380" fill="#E69F00" rx="14"/><rect width="250" height="14" x="325" y="402" fill="#E69F00"/><text x="450" y="404" class="tag" text-anchor="middle">下睑松垂 · 泪沟</text><text x="345" y="442" class="body">下睑皮肤松弛</text><text x="345" y="466" class="body">泪沟凹陷</text><text x="345" y="490" class="small">切除或填充改善</text><rect width="250" height="125" x="588" y="380" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="250" height="36" x="588" y="380" fill="#0072B2" rx="14"/><rect width="250" height="14" x="588" y="402" fill="#0072B2"/><text x="713" y="404" class="tag" text-anchor="middle">干眼 · 泪液状况</text><text x="608" y="442" class="body">术前应评估泪液</text><text x="608" y="466" class="body">原有干眼风险高</text><text x="608" y="490" class="small">影响术式选择</text><rect width="776" height="40" x="62" y="525" fill="#fbeae3" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">把提肌问题当皮肤松弛处理，效果必然不佳</text><text x="62" y="582" class="footer">示意，非教学图 · 具体诊断与术式以面诊评估为准</text></svg>