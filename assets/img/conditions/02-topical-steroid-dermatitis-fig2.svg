<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t02f2 d02f2" role="img" viewBox="0 0 800 500"><title id="t02f2">屏障修复分阶段与暴露账本</title><desc id="d02f2">减少损伤恢复耐受需分阶段，记录暴露比检测仪更可靠</desc><defs><linearGradient id="bg02f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh02f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg02f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh02f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 02</text><text x="56" y="90" class="title">屏障修复分阶段时间轴</text><text x="56" y="116" class="kicker">减少损伤并恢复耐受，需要的是可执行的节奏</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">恢复耐受分四个阶段</text><line x1="100" x2="700" y1="220" y2="220" stroke="#cdd8d8" stroke-width="2"/><circle cx="150" cy="220" r="12" fill="#7A8B6F"/><text x="150" y="195" class="body" font-weight="700" text-anchor="middle">停损</text><text x="150" y="250" class="small" text-anchor="middle">停不明霜剂</text><text x="150" y="266" class="small" text-anchor="middle">减刺激护肤</text><circle cx="330" cy="220" r="12" fill="#5F6E54"/><text x="330" y="195" class="body" font-weight="700" text-anchor="middle">降阶梯</text><text x="330" y="250" class="small" text-anchor="middle">按医嘱减强度</text><text x="330" y="266" class="small" text-anchor="middle">不突然断药</text><circle cx="510" cy="220" r="12" fill="#C9A876"/><text x="510" y="195" class="body" font-weight="700" text-anchor="middle">修复</text><text x="510" y="250" class="small" text-anchor="middle">温和保湿防晒</text><text x="510" y="266" class="small" text-anchor="middle">屏障逐步耐受</text><circle cx="690" cy="220" r="12" fill="#B5654A"/><text x="690" y="195" class="body" font-weight="700" text-anchor="middle">再引入</text><text x="690" y="250" class="small" text-anchor="middle">一次加一个</text><text x="690" y="266" class="small" text-anchor="middle">局部先试用</text><text x="56" y="320" class="nodeTitle">建一份暴露账本</text><rect width="688" height="86" x="56" y="334" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><text x="76" y="362" class="body">记录日期 产品名称 用药强度 使用部位 当日反应</text><text x="76" y="388" class="small">含网购霜 代购 滴眼液 滴鼻液 含激素喷雾 不明中成药膏</text><text x="76" y="408" class="small">比买检测仪更可靠，能帮医生判断是反跳还是原发病未控</text><rect width="688" height="32" x="56" y="432" fill="#eef4ee" rx="10"/><text x="400" y="453" class="quote" text-anchor="middle">修复核心是减少损伤并恢复耐受，不是堆产品</text><text x="56" y="470" class="footer">医学教育示意 · 恢复功效护肤或光电需医生评估时机</text></svg>