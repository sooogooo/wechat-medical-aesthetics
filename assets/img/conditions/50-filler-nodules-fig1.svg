<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t50f1 d50f1">
  <title id="t50f1">注射后硬结的四种可能</title>
  <desc id="d50f1">注射后硬结可能来自材料堆积炎症结节感染或异物肉芽肿</desc>
  <defs>
    <linearGradient id="bg50f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh50f1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .card { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg50f1)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh50f1)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 50</text>
  <text x="52" y="92" class="title">硬结先分类，再谈处理</text>
  <text x="52" y="116" class="kicker">鼓包、硬结原因不同，处理方式也完全不同</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <text x="52" y="162" class="nodeTitle">四类常见可能</text>

  <!-- 4卡 -->
  <rect x="52" y="178" width="340" height="116" rx="12" fill="#f4f7f1" stroke="#7A8B6F"/>
  <rect x="52" y="178" width="340" height="30" rx="12" fill="#7A8B6F"/>
  <rect x="52" y="194" width="340" height="14" fill="#7A8B6F"/>
  <text x="222" y="198" class="card" text-anchor="middle">材料堆积或移位</text>
  <text x="68" y="230" class="body">出现时间：注射后不久</text>
  <text x="68" y="252" class="body">质地：偏软、边界清楚</text>
  <text x="68" y="274" class="small">透明质酸类可考虑溶解</text>

  <rect x="408" y="178" width="340" height="116" rx="12" fill="#fbf5ea" stroke="#C9A876"/>
  <rect x="408" y="178" width="340" height="30" rx="12" fill="#C9A876"/>
  <rect x="408" y="194" width="340" height="14" fill="#C9A876"/>
  <text x="578" y="198" class="card" text-anchor="middle">炎症结节</text>
  <text x="424" y="230" class="body">出现时间：数日至数周</text>
  <text x="424" y="252" class="body">质地：红、肿、压痛</text>
  <text x="424" y="274" class="small">常与注射刺激、过敏相关</text>

  <rect x="52" y="306" width="340" height="116" rx="12" fill="#fbf0eb" stroke="#B5654A"/>
  <rect x="52" y="306" width="340" height="30" rx="12" fill="#B5654A"/>
  <rect x="52" y="322" width="340" height="14" fill="#B5654A"/>
  <text x="222" y="326" class="card" text-anchor="middle">感染性结节</text>
  <text x="68" y="358" class="body">出现时间：任何时间</text>
  <text x="68" y="380" class="body">质地：红肿热痛、化脓</text>
  <text x="68" y="402" class="small">需抗感染，可能需取材培养</text>

  <rect x="408" y="306" width="340" height="116" rx="12" fill="#fbf0eb" stroke="#B5654A"/>
  <rect x="408" y="306" width="340" height="30" rx="12" fill="#B5654A"/>
  <rect x="408" y="322" width="340" height="14" fill="#B5654A"/>
  <text x="578" y="326" class="card" text-anchor="middle">迟发肉芽肿</text>
  <text x="424" y="358" class="body">出现时间：数月至数年</text>
  <text x="424" y="380" class="body">质地：硬结、多发、炎症</text>
  <text x="424" y="402" class="small">处理复杂，需个体化</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">先确认产品、层次和血流，避免盲目溶解</text>
  <text x="52" y="466" class="footer">健康科普示意 · 注射后异常须及时联系注射医师或就医</text>
</svg>
