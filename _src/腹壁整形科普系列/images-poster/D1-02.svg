<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleD102 descD102">
  <title id="titleD102">等一等，等到什么时候</title>
  <desc id="descD102">七条红线对应的等待条件，生育完成、体重稳定、戒烟、控病、生活平稳</desc>
  <defs>
    <marker id="ahD102" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · D1</text>
  <text x="62" y="112" class="title">等一等，等到什么时候</text>
  <text x="62" y="148" class="kicker">大部分红线是暂时的，条件到位再做</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>

  <text x="62" y="200" class="small">现在的情况</text>
  <text x="460" y="200" class="small">先等到</text>

  <rect x="62" y="212" width="300" height="52" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="82" y="244" class="body">还想生育</text>
  <line x1="372" y1="238" x2="448" y2="238" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahD102)"/>
  <rect x="460" y="212" width="378" height="52" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="480" y="244" class="body">等生育计划完成</text>

  <rect x="62" y="272" width="300" height="52" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="82" y="304" class="body">体重在变</text>
  <line x1="372" y1="298" x2="448" y2="298" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahD102)"/>
  <rect x="460" y="272" width="378" height="52" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="480" y="304" class="body">等稳定至少 6 个月</text>

  <rect x="62" y="332" width="300" height="52" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="82" y="364" class="body">吸烟未戒</text>
  <line x1="372" y1="358" x2="448" y2="358" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahD102)"/>
  <rect x="460" y="332" width="378" height="52" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="480" y="364" class="body">先戒烟 4～6 周</text>

  <rect x="62" y="392" width="300" height="52" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="82" y="424" class="body">基础病未控</text>
  <line x1="372" y1="418" x2="448" y2="418" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahD102)"/>
  <rect x="460" y="392" width="378" height="52" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="480" y="424" class="body">先治疗到稳定</text>

  <rect x="62" y="452" width="300" height="52" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="82" y="484" class="body">情绪不稳、生活变故</text>
  <line x1="372" y1="478" x2="448" y2="478" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahD102)"/>
  <rect x="460" y="452" width="378" height="52" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="480" y="484" class="body">等生活平稳再做决定</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">在对的条件下做，满意度高得多</text>
  <text x="62" y="580" class="footer">医学教育示意 · 等待条件达成后再评估手术</text>
</svg>
