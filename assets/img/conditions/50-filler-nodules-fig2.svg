<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t50f2 d50f2">
  <title id="t50f2">注射后硬结的处理决策</title>
  <desc id="d50f2">从评估产品层次血流到分类处理的决策流程及警示</desc>
  <defs>
    <linearGradient id="bg50f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh50f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .step { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg50f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh50f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 50</text>
  <text x="52" y="92" class="title">处理决策流程</text>
  <text x="52" y="116" class="kicker">先评估三要素，再决定溶解、抗炎还是抗感染</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 评估三问 -->
  <text x="52" y="162" class="nodeTitle">第一步 评估三要素</text>
  <rect x="52" y="176" width="220" height="50" rx="10" fill="#7A8B6F"/>
  <text x="162" y="198" class="step" text-anchor="middle">什么产品</text>
  <text x="162" y="216" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">玻尿酸、胶原、其他</text>

  <rect x="290" y="176" width="220" height="50" rx="10" fill="#7A8B6F"/>
  <text x="400" y="198" class="step" text-anchor="middle">什么层次</text>
  <text x="400" y="216" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">真皮、脂肪、深层</text>

  <rect x="528" y="176" width="220" height="50" rx="10" fill="#7A8B6F"/>
  <text x="638" y="198" class="step" text-anchor="middle">血流是否受累</text>
  <text x="638" y="216" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">皮肤颜色、温度</text>

  <!-- 分支 -->
  <text x="52" y="252" class="nodeTitle">第二步 分类处理</text>

  <rect x="52" y="266" width="210" height="100" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <rect x="52" y="266" width="210" height="24" rx="10" fill="#7A8B6F"/>
  <rect x="52" y="280" width="210" height="10" fill="#7A8B6F"/>
  <text x="157" y="282" class="step" text-anchor="middle" font-size="13">材料相关</text>
  <text x="64" y="310" class="small">玻尿酸→溶解酶</text>
  <text x="64" y="330" class="small">不可溶→评估取出</text>
  <text x="64" y="350" class="small" fill="#B5654A">勿在感染时盲目溶</text>

  <rect x="278" y="266" width="210" height="100" rx="10" fill="#fbf5ea" stroke="#C9A876"/>
  <rect x="278" y="266" width="210" height="24" rx="10" fill="#C9A876"/>
  <rect x="278" y="280" width="210" height="10" fill="#C9A876"/>
  <text x="383" y="282" class="step" text-anchor="middle" font-size="13">炎症结节</text>
  <text x="290" y="310" class="small">抗炎、观察</text>
  <text x="290" y="330" class="small">必要时局部处理</text>
  <text x="290" y="350" class="small" fill="#5F6E54">多数可逐渐消退</text>

  <rect x="504" y="266" width="244" height="100" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <rect x="504" y="266" width="244" height="24" rx="10" fill="#B5654A"/>
  <rect x="504" y="280" width="244" height="10" fill="#B5654A"/>
  <text x="626" y="282" class="step" text-anchor="middle" font-size="13">感染或肉芽肿</text>
  <text x="516" y="310" class="small">抗感染、取材培养</text>
  <text x="516" y="330" class="small">肉芽肿需联合方案</text>
  <text x="516" y="350" class="small" fill="#B5654A">可能需多次、长期</text>

  <!-- 警示 -->
  <rect x="52" y="382" width="696" height="44" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <text x="64" y="402" class="body" fill="#B5654A">立即就医的紧急信号</text>
  <text x="64" y="420" class="small">皮肤发白发紫、剧痛、温度改变、视力变化、破溃流脓</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">保存注射记录，关键时刻能救命</text>
  <text x="52" y="466" class="footer">健康科普示意 · 注射后异常须及时就医，处理须由医师评估</text>
</svg>
