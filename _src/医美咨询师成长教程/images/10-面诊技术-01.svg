<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t10s d10s" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t10s">一次面诊的三个泳道</title><desc id="d10s">求美者、咨询师、医生三个泳道的初诊流程：求美者诉说诉求，咨询师倾听并整理成转诊摘要交给医生，医生面诊评估后给出方案与效果区间，咨询师在风险讲清后报价，求美者知情决定。转诊摘要是整条流程的关键交接。</desc><defs><marker id="ar10s" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#6b6864" points="0 0 8 3 0 6"/></marker><marker id="ar10sa" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#7a8b6f" points="0 0 8 3 0 6"/></marker></defs><rect width="800" height="500" fill="#faf8f4"/><text x="56" y="52" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".18em">SWIMLANE · 初诊面诊</text><text x="56" y="84" fill="#2b2a28" font-family="'Songti SC',Georgia,serif" font-size="28">一次面诊的三个泳道</text><text x="56" y="106" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">最关键的交接，是咨询师交给医生的转诊摘要</text><line x1="120" x2="760" y1="124" y2="124" stroke="rgba(43,42,40,0.12)" stroke-width="1"/><line x1="120" x2="760" y1="196" y2="196" stroke="rgba(43,42,40,0.12)" stroke-width="1"/><line x1="120" x2="760" y1="276" y2="276" stroke="rgba(43,42,40,0.12)" stroke-width="1"/><line x1="120" x2="760" y1="356" y2="356" stroke="rgba(43,42,40,0.12)" stroke-width="1"/><text x="48" y="156" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">CLIENT</text><text x="48" y="174" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600">求美者</text><text x="48" y="236" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">CONSULTANT</text><text x="48" y="254" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600">咨询师</text><text x="48" y="316" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">DOCTOR</text><text x="48" y="334" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600">医生</text><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ar10s)" d="M 192 182 L 192 216"/><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ar10s)" d="M 244 160 L 340 160"/><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ar10s)" d="M 248 240 L 292 240"/><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ar10s)" d="M 400 240 L 436 240"/><path fill="none" stroke="#7a8b6f" stroke-width="1.2" marker-end="url(#ar10sa)" d="M 488 262 L 488 296"/><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ar10s)" d="M 540 320 L 592 320"/><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ar10s)" d="M 648 298 L 648 266"/><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ar10s)" d="M 648 218 L 648 186"/><rect width="104" height="44" x="140" y="138" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="192" y="158" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">诉说诉求</text><text x="192" y="174" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">OD · 从哪来到哪去</text><rect width="104" height="44" x="344" y="138" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="396" y="158" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">提问与疑虑</text><text x="396" y="174" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">病史 · 预算 · 时机</text><rect width="104" height="44" x="596" y="138" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="648" y="158" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">知情决定</text><text x="648" y="174" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">成交 · 缓行 · 转介</text><rect width="112" height="44" x="136" y="218" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="192" y="238" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">倾听 · 绿灯</text><text x="192" y="254" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">0-15 MIN 不打断</text><rect width="104" height="44" x="296" y="218" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="348" y="238" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">望闻问切</text><text x="348" y="254" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">OD 四问补全</text><rect width="96" height="44" x="440" y="218" fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2" rx="6"/><text x="488" y="238" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">转诊摘要</text><text x="488" y="254" fill="#7a8b6f" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">一页纸 · 硬通货</text><rect width="104" height="44" x="596" y="218" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="648" y="238" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">报价 · 红灯</text><text x="648" y="254" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">风险讲清后方可</text><rect width="104" height="44" x="436" y="298" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="488" y="318" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">面诊评估</text><text x="488" y="334" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">医疗决策权在此</text><rect width="104" height="44" x="596" y="298" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="6"/><text x="648" y="318" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">方案与区间</text><text x="648" y="334" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">多数人 · 因人而异</text><line x1="56" x2="744" y1="396" y2="396" stroke="rgba(43,42,40,0.12)" stroke-width=".8"/><text x="56" y="412" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">LEGEND</text><rect width="14" height="12" x="128" y="402" fill="#fff" stroke="#2b2a28" stroke-width="1" rx="3"/><text x="148" y="412" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">流程步</text><path fill="none" stroke="#7a8b6f" stroke-width="1.2" marker-end="url(#ar10sa)" d="M 224 408 L 252 408"/><text x="262" y="412" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">关键交接（转诊摘要）</text><line x1="416" x2="416" y1="402" y2="414" stroke="rgba(43,42,40,0.12)" stroke-width="1"/><text x="428" y="412" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">泳道 = 责任边界</text><text x="56" y="444" fill="#a8a39d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">箭头方向即责任移交方向；咨询师不做诊断与方案，医生拥有最终决策权。</text></svg>