<svg xmlns="http://www.w3.org/2000/svg" aria-label="庸俗型的典型特征" role="img" viewBox="0 0 640 340"><rect width="640" height="340" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">庸俗型的典型特征</text><rect width="185" height="250" x="30" y="60" fill="#fff" stroke="#b5654a" rx="8"/><rect width="185" height="36" x="30" y="60" fill="#b5654a" rx="8"/><rect width="185" height="10" x="30" y="86" fill="#b5654a"/><text x="122" y="84" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">过度</text><text x="45" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">剂量过度</text><text x="45" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">每个局部做到极致</text><text x="45" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">填充饱满到不自然</text><text x="45" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">肌肉放松到僵硬</text><text x="45" y="220" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">项目过度</text><text x="45" y="240" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">能做的全做</text><text x="45" y="258" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">&quot;全套套餐&quot;</text><text x="45" y="288" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">= 显假</text><rect width="185" height="250" x="227" y="60" fill="#fff" stroke="#b5654a" rx="8"/><rect width="185" height="36" x="227" y="60" fill="#b5654a" rx="8"/><rect width="185" height="10" x="227" y="86" fill="#b5654a"/><text x="320" y="84" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">趋同</text><text x="242" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">所有人一张脸</text><text x="242" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">套同一种模板</text><text x="242" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">追求同一种&quot;标准&quot;</text><text x="242" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">辨识度被抹平</text><text x="242" y="220" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">追逐流行</text><text x="242" y="240" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">今年流行什么做什么</text><text x="242" y="258" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">不顾自己适合与否</text><text x="242" y="288" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">= 失去自己</text><rect width="185" height="250" x="424" y="60" fill="#fff" stroke="#b5654a" rx="8"/><rect width="185" height="36" x="424" y="60" fill="#b5654a" rx="8"/><rect width="185" height="10" x="424" y="86" fill="#b5654a"/><text x="516" y="84" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">套模板</text><text x="439" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">无视基础</text><text x="439" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">把不适合的模板</text><text x="439" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">套到每个人脸上</text><text x="439" y="180" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">骨骼、气质被忽视</text><text x="439" y="220" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">孤立局部</text><text x="439" y="240" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">鼻子单独最高</text><text x="439" y="258" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">下巴单独最尖</text><text x="439" y="288" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">= 拼盘失协</text><text x="320" y="330" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">三大特征叠加 → 一眼看出&quot;做过&quot;、显俗、不耐看</text></svg>