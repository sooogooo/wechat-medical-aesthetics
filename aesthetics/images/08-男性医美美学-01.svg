<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="男性审美的两极与位移">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">男性审美的两极与位移</text>

  <!-- 传统硬朗 -->
  <rect x="30" y="70" width="270" height="220" rx="8" fill="#ffffff" stroke="#5f6e54" stroke-width="1.5"/>
  <rect x="30" y="70" width="270" height="40" rx="8" fill="#5f6e54"/>
  <rect x="30" y="100" width="270" height="10" fill="#5f6e54"/>
  <text x="165" y="96" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">传统：硬朗粗犷</text>
  <text x="50" y="140" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 方形下颌、明显下颌角</text>
  <text x="50" y="163" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 浓眉、深邃五官</text>
  <text x="50" y="186" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 胡须、体毛保留</text>
  <text x="50" y="209" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 皮肤质感&quot;糙&quot;也可</text>
  <text x="50" y="232" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• &quot;不修边幅&quot;= 阳刚</text>
  <text x="50" y="265" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">= 男性气质的传统模板</text>

  <!-- 新兴精致 -->
  <rect x="340" y="70" width="270" height="220" rx="8" fill="#ffffff" stroke="#c9a876" stroke-width="1.5"/>
  <rect x="340" y="70" width="270" height="40" rx="8" fill="#c9a876"/>
  <rect x="340" y="100" width="270" height="10" fill="#c9a876"/>
  <text x="475" y="96" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">新兴：精致打理</text>
  <text x="360" y="140" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 干净皮肤、无瑕疵</text>
  <text x="360" y="163" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 修整眉形、清爽发际</text>
  <text x="360" y="186" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 脱毛（胡须外的体毛）</text>
  <text x="360" y="209" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 鼻部、下颌适度精修</text>
  <text x="360" y="232" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• &quot;有打理感&quot;= 魅力</text>
  <text x="360" y="265" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">= 年轻一代的新模板</text>

  <text x="320" y="310" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">位移并非取代，而是多元共存——但&quot;精致男&quot;的兴起确实改变了男性审美格局</text>
</svg>