<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t11a d11a">
  <title id="t11a">承诺话术与区间话术对比</title>
  <desc id="d11a">红灯点承诺与绿灯区间加条件说法对照，期望管理的语言纪律</desc>
  <defs>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .colHead{font:700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;}
      .bad{font:500 11.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#B5654A;}
      .good{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .rule{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .ruleSub{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect x="30" y="26" width="740" height="448" rx="10" fill="#ffffff" stroke="#e4ddd2"/>
  <text x="56" y="58" class="series">医美咨询师成长教程 · 阶段3 · 11</text>
  <text x="56" y="90" class="title">期望管理 把"点"换成"区间"</text>
  <text x="56" y="116" class="kicker">术后纠纷的种子大多在面诊桌上种下——落差就是投诉</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 左：红灯 -->
  <rect x="56" y="144" width="330" height="200" rx="10" fill="#ffffff" stroke="#B5654A" stroke-width="1.6"/>
  <text x="76" y="170" class="colHead" fill="#B5654A">✕ 红灯 · 点承诺</text>
  <text x="76" y="196" class="bad">"肯定能维持两年。"</text>
  <text x="76" y="220" class="bad">"做完就跟这张照片一样。"</text>
  <text x="76" y="244" class="bad">"三天就能化滤镜妆。"</text>
  <text x="76" y="268" class="bad">"绝对安全，零风险。"</text>
  <text x="76" y="300" class="bad">共同点：把概率说成确定</text>
  <text x="76" y="318" class="bad">客人拿着"你说的"对照"我得到的"</text>
  <text x="76" y="336" class="bad">——落差就是投诉</text>

  <!-- 右：绿灯 -->
  <rect x="414" y="144" width="330" height="200" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.6"/>
  <text x="434" y="170" class="colHead" fill="#7A8B6F">✓ 绿灯 · 区间 + 条件</text>
  <text x="434" y="194" class="good">"多数人在 X 到 Y 个月之间，具体到您，</text>
  <text x="434" y="210" class="good">医生面诊后会按部位和代谢给参考。"</text>
  <text x="434" y="232" class="good">"照片说明方向，医生会先评估您能达到</text>
  <text x="434" y="248" class="good">的改善区间。"</text>
  <text x="434" y="270" class="good">"任何医疗操作都有风险——我们把风险</text>
  <text x="434" y="286" class="good">讲清楚，由医生评估适不适合。"</text>
  <text x="434" y="312" class="good">共同结构：区间 + 个体差异 + 落到医生评估</text>
  <text x="434" y="330" class="good">区间不是含糊，是诚实——医学是概率的语言</text>

  <!-- 底部：翻译三步 + 日检 -->
  <rect x="56" y="356" width="688" height="92" rx="10" fill="#ffffff" stroke="#d9cbab" stroke-width="1.3"/>
  <text x="76" y="382" class="rule">翻译医生方案三步法</text>
  <text x="76" y="404" class="ruleSub">① 复述（解决什么→用什么手段→达到什么区间→有什么代价）　② 具象（术语翻成生活语言，必要时画图）　③ 确认（留追问空间，别带着疑惑签字）</text>
  <text x="76" y="430" class="ruleSub">语言红线日检：每天下班搜四个词——肯定 · 绝对 · 保证 · 最好——搜到一个记入错题本，重写成区间表述</text>

  <text x="56" y="468" class="footer">价格纪律：拆价值不贬同行 · 不临时砍价换成交 · 价格分歧往价值走不往情绪走</text>
</svg>
