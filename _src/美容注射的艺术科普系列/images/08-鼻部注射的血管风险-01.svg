<svg xmlns="http://www.w3.org/2000/svg" aria-label="鼻部血管与眼动脉交通示意" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">为什么鼻部注射可能影响视力</text><g transform="translate(120,70)"><circle cx="40" cy="180" r="14" fill="#b5654a"/><text x="40" y="184" fill="#fff" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">误入</text><text x="40" y="210" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">鼻部血管</text><path fill="none" stroke="#b5654a" stroke-width="2.5" marker-end="url(#arrow)" d="M 54 175 Q 120 150 180 120"/><text x="130" y="145" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">逆流</text><circle cx="190" cy="115" r="10" fill="#c9a876"/><text x="190" y="100" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">鼻背动脉</text><path fill="none" stroke="#b5654a" stroke-width="2.5" marker-end="url(#arrow)" d="M 200 110 Q 260 90 320 80"/><circle cx="330" cy="78" r="12" fill="#b5654a"/><text x="330" y="60" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">眼动脉</text><path fill="none" stroke="#b5654a" stroke-width="2.5" marker-end="url(#arrow)" d="M 342 75 Q 380 70 410 75"/><circle cx="425" cy="78" r="14" fill="#5f6e54"/><text x="425" y="82" fill="#fff" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">视网膜</text><text x="425" y="105" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">中央动脉栓塞</text><path fill="none" stroke="#b5654a" stroke-dasharray="3 2" stroke-width="2" marker-end="url(#arrow)" d="M 440 85 Q 470 110 470 140"/><rect width="100" height="40" x="430" y="150" fill="#f7ece6" stroke="#b5654a" rx="6"/><text x="480" y="168" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">视网膜缺血</text><text x="480" y="184" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">→ 失明</text><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4"><polygon fill="#b5654a" points="0 0 8 4 0 8"/></marker></defs></g><text x="320" y="290" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">鼻部血管与眼动脉存在交通，材料误入血管可逆流至眼部</text><text x="320" y="308" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">图为机制示意；实际血管走行有个体差异，栓塞可在极短时间内发生</text></svg>