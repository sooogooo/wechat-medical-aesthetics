<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t53f1 d53f1" role="img" viewBox="0 0 800 500"><title id="t53f1">单纯疱疹的潜伏与复发</title><desc id="d53f1">病毒潜伏于神经节在疲劳日晒等诱因下复发成簇水疱</desc><defs><linearGradient id="bg53f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh53f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.step{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg53f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh53f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 53</text><text x="52" y="92" class="title">潜伏与复发的循环</text><text x="52" y="116" class="kicker">病毒会长期潜伏，在诱因下反复发作</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">复发周期</text><circle cx="400" cy="290" r="50" fill="#5F6E54"/><text x="400" y="284" fill="#fff" class="step" text-anchor="middle">病毒</text><text x="400" y="304" fill="#fff" class="step" font-size="12" text-anchor="middle">潜伏</text><rect width="180" height="68" x="60" y="190" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="180" height="22" x="60" y="190" fill="#7A8B6F" rx="12"/><rect width="180" height="8" x="60" y="204" fill="#7A8B6F"/><text x="150" y="206" class="step" font-size="13" text-anchor="middle">1 潜伏期</text><text x="72" y="232" class="small">藏在神经节</text><text x="72" y="250" class="small">无症状</text><rect width="180" height="68" x="560" y="190" fill="#fbf5ea" stroke="#C9A876" rx="12"/><rect width="180" height="22" x="560" y="190" fill="#C9A876" rx="12"/><rect width="180" height="8" x="560" y="204" fill="#C9A876"/><text x="650" y="206" class="step" font-size="13" text-anchor="middle">2 前驱期</text><text x="572" y="232" class="small">刺痛、灼热、瘙痒</text><text x="572" y="250" fill="#C9A876" class="small">此时传染性已开始</text><rect width="180" height="68" x="560" y="322" fill="#fbf0eb" stroke="#B5654A" rx="12"/><rect width="180" height="22" x="560" y="322" fill="#B5654A" rx="12"/><rect width="180" height="8" x="560" y="336" fill="#B5654A"/><text x="650" y="338" class="step" font-size="13" text-anchor="middle">3 发作期</text><text x="572" y="364" class="small">成簇水疱、破溃结痂</text><text x="572" y="382" class="small">传染性最强</text><rect width="180" height="68" x="60" y="322" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="180" height="22" x="60" y="322" fill="#7A8B6F" rx="12"/><rect width="180" height="8" x="60" y="336" fill="#7A8B6F"/><text x="150" y="338" class="step" font-size="13" text-anchor="middle">4 愈合期</text><text x="72" y="364" class="small">痂皮脱落、皮肤恢复</text><text x="72" y="382" class="small">病毒再次潜伏</text><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 240 224 Q 400 200 560 224"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 552 218 L 560 224 L 552 228"/><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 650 258 L 650 322"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 644 316 L 650 322 L 656 316"/><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 560 356 Q 400 380 240 356"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 248 350 L 240 356 L 248 362"/><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 150 322 L 150 258"/><path fill="none" stroke="#7d8e93" stroke-width="1.5" d="M 144 264 L 150 258 L 156 264"/><text x="52" y="412" class="nodeTitle">常见复发诱因</text><rect width="110" height="20" x="52" y="422" fill="#C9A876" rx="6"/><text x="107" y="436" fill="#fff" class="small" text-anchor="middle">疲劳熬夜</text><rect width="110" height="20" x="172" y="422" fill="#C9A876" rx="6"/><text x="227" y="436" fill="#fff" class="small" text-anchor="middle">日晒</text><rect width="110" height="20" x="292" y="422" fill="#C9A876" rx="6"/><text x="347" y="436" fill="#fff" class="small" text-anchor="middle">精神压力</text><rect width="110" height="20" x="412" y="422" fill="#C9A876" rx="6"/><text x="467" y="436" fill="#fff" class="small" text-anchor="middle">月经期</text><rect width="110" height="20" x="532" y="422" fill="#C9A876" rx="6"/><text x="587" y="436" fill="#fff" class="small" text-anchor="middle">感冒发热</text><rect width="96" height="20" x="652" y="422" fill="#C9A876" rx="6"/><text x="700" y="436" fill="#fff" class="small" text-anchor="middle">外伤手术</text><text x="52" y="466" class="footer">健康科普示意 · 频繁复发或眼部受累须及时就医</text></svg>