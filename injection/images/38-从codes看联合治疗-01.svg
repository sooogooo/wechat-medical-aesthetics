<svg xmlns="http://www.w3.org/2000/svg" aria-label="静态填充与动态肉毒的协作" role="img" viewBox="0 0 640 300"><rect width="640" height="300" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">两类问题，两种手段，常常并存</text><rect width="280" height="200" x="30" y="65" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="170" y="95" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">填充 codes（静态）</text><text x="50" y="125" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">解决：</text><text x="50" y="148" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 容积流失（凹陷、干瘪）</text><text x="50" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 支撑下降（下垂、轮廓模糊）</text><text x="50" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 静态纹（不动时就在的）</text><text x="50" y="220" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">代表 codes：</text><text x="50" y="240" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">Ck、T、F、Jw、Nl 等</text><rect width="280" height="200" x="330" y="65" fill="#f4ede0" stroke="#c9a876" rx="8"/><text x="470" y="95" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">肉毒（动态）</text><text x="350" y="125" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">解决：</text><text x="350" y="148" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 动态纹（表情时出现）</text><text x="350" y="168" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 肌肉型轮廓（咬肌肥大）</text><text x="350" y="188" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11">• 肌肉过度活动</text><text x="350" y="220" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">代表部位：</text><text x="350" y="240" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11">额肌、皱眉肌、眼轮匝肌、咬肌</text><text x="320" y="285" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">同一个人常同时有静态和动态问题——这就是联合治疗的基础</text></svg>