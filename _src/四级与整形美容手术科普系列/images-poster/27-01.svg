<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2701 desc2701" role="img" viewBox="0 0 900 620"><title id="title2701">正常术后反应时间线</title><desc id="desc2701">肿胀、疼痛、淤青、吸收热随时间改善是正常愈合，核心线索是「随时间改善」</desc><defs><linearGradient id="bg2701" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2701" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff;letter-spacing:1px}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2701)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2701)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 27</text><text x="62" y="117" class="title">先理解正常的术后反应</text><text x="62" y="153" class="kicker">判断正常与异常的核心线索：「随时间改善」</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="222" class="nodeTitle">四类正常反应 · 都会随时间改善</text><line x1="120" x2="780" y1="455" y2="455" stroke="#0072B2" stroke-width="3"/><circle cx="120" cy="455" r="8" fill="#0072B2"/><circle cx="380" cy="455" r="8" fill="#E69F00"/><circle cx="780" cy="455" r="8" fill="#009E73"/><text x="120" y="485" class="small" text-anchor="middle">术后即刻</text><text x="380" y="485" class="small" text-anchor="middle">48–72 小时高峰</text><text x="780" y="485" class="small" text-anchor="middle">逐渐消退</text><rect width="186" height="170" x="62" y="250" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="186" height="36" x="62" y="250" fill="#0072B2" rx="14"/><rect width="186" height="14" x="62" y="272" fill="#0072B2"/><text x="155" y="274" class="tag" text-anchor="middle">肿胀</text><text x="82" y="312" class="body">48–72 小时达高峰</text><text x="82" y="339" class="body">之后逐渐消退</text><text x="82" y="366" class="body">面部手术较明显</text><text x="82" y="398" class="small">随时间改善 = 正常</text><rect width="186" height="170" x="262" y="250" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="186" height="36" x="262" y="250" fill="#E69F00" rx="14"/><rect width="186" height="14" x="262" y="272" fill="#E69F00"/><text x="355" y="274" class="tag" text-anchor="middle">疼痛</text><text x="282" y="312" class="body">可控的疼痛</text><text x="282" y="339" class="body">随时间减轻</text><text x="282" y="366" class="body">止痛药可缓解</text><text x="282" y="398" class="small">持续加重 = 异常</text><rect width="186" height="170" x="462" y="250" fill="#f8fbfb" stroke="#009E73" stroke-width="2" rx="14"/><rect width="186" height="36" x="462" y="250" fill="#009E73" rx="14"/><rect width="186" height="14" x="462" y="272" fill="#009E73"/><text x="555" y="274" class="tag" text-anchor="middle">淤青</text><text x="482" y="312" class="body">紫红 → 黄绿</text><text x="482" y="339" class="body">逐渐吸收</text><text x="482" y="366" class="body">颜色随时间变化</text><text x="482" y="398" class="small">属正常愈合过程</text><rect width="176" height="170" x="662" y="250" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="176" height="36" x="662" y="250" fill="#E69F00" rx="14"/><rect width="176" height="14" x="662" y="272" fill="#E69F00"/><text x="750" y="274" class="tag" text-anchor="middle">吸收热</text><text x="682" y="312" class="body">24–48 小时内</text><text x="682" y="339" class="body">通常不高</text><text x="682" y="366" class="body">轻度发热疲倦</text><text x="682" y="398" class="small">高热需警惕（见下页）</text><rect width="776" height="40" x="62" y="510" fill="#eef6f8" rx="12"/><text x="450" y="536" class="quote" text-anchor="middle">「随时间改善」是判断正常与异常的核心线索</text><text x="62" y="568" class="small">不同手术的正常反应不同，以上为一般规律；持续加重或超出范围需就医</text><text x="62" y="584" class="footer">医学教育示意 · 具体术后反应以手术医生告知为准</text></svg>