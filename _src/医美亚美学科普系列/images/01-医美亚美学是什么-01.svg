<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="医美亚美学谱系图">
  <rect width="720" height="380" fill="#faf8f4" rx="12"/>
  <text x="360" y="34" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">医美亚美学的主要流派</text>

  <!-- 中心 -->
  <circle cx="360" cy="200" r="48" fill="#7a8b6f"/>
  <text x="360" y="196" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">医美</text>
  <text x="360" y="214" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">亚美学</text>

  <!-- 周围流派 -->
  <g font-family="PingFang SC,sans-serif" font-size="11">
    <!-- 幼态脸 -->
    <line x1="320" y1="165" x2="200" y2="90" stroke="#a8a39d" stroke-width="1"/>
    <ellipse cx="180" cy="80" rx="52" ry="26" fill="#eef0ea" stroke="#7a8b6f"/>
    <text x="180" y="84" text-anchor="middle" fill="#5f6e54" font-weight="600">幼态脸</text>

    <!-- 高级脸 -->
    <line x1="400" y1="165" x2="520" y2="90" stroke="#a8a39d" stroke-width="1"/>
    <ellipse cx="540" cy="80" rx="52" ry="26" fill="#f4ede0" stroke="#c9a876"/>
    <text x="540" y="84" text-anchor="middle" fill="#8a7340" font-weight="600">高级脸</text>

    <!-- 妈生款 -->
    <line x1="312" y1="200" x2="170" y2="200" stroke="#a8a39d" stroke-width="1"/>
    <ellipse cx="120" cy="200" rx="52" ry="26" fill="#eef0ea" stroke="#8a9a7f"/>
    <text x="120" y="204" text-anchor="middle" fill="#5f6e54" font-weight="600">妈生款</text>

    <!-- do 脸感 -->
    <line x1="408" y1="200" x2="550" y2="200" stroke="#a8a39d" stroke-width="1"/>
    <ellipse cx="600" cy="200" rx="52" ry="26" fill="#f7ece6" stroke="#b5654a"/>
    <text x="600" y="204" text-anchor="middle" fill="#b5654a" font-weight="600">do 脸感</text>

    <!-- 骨相美 -->
    <line x1="320" y1="235" x2="200" y2="310" stroke="#a8a39d" stroke-width="1"/>
    <ellipse cx="180" cy="320" rx="52" ry="26" fill="#eef0ea" stroke="#7a8b6f"/>
    <text x="180" y="324" text-anchor="middle" fill="#5f6e54" font-weight="600">骨相美</text>

    <!-- 抗老美学 -->
    <line x1="400" y1="235" x2="520" y2="310" stroke="#a8a39d" stroke-width="1"/>
    <ellipse cx="540" cy="320" rx="52" ry="26" fill="#f4ede0" stroke="#c9a876"/>
    <text x="540" y="324" text-anchor="middle" fill="#8a7340" font-weight="600">抗老美学</text>
  </g>

  <text x="360" y="365" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">本系列盘点 10 种主流亚美学，每种都有其特征、成因与争议</text>
</svg>