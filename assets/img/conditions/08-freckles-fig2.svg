<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t08f2 d08f2" role="img" viewBox="0 0 800 500"><title id="t08f2">雀斑治疗动机检查与测试点</title><desc id="d08f2">决定治疗前先做动机检查，用测试点判断皮肤反应</desc><defs><linearGradient id="bg08f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh08f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg08f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh08f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 08</text><text x="56" y="90" class="title">治疗前的动机检查</text><text x="56" y="116" class="kicker">先问自己四个问题，再决定是否治疗</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">动机检查四问</text><rect width="335" height="58" x="56" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="84" cy="201" r="16" fill="#7A8B6F"/><text x="84" y="206" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="112" y="197" class="body" font-weight="700">是为自己还是他人</text><text x="112" y="217" class="small">不必为他人的评价改变自己</text><rect width="335" height="58" x="409" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="437" cy="201" r="16" fill="#7A8B6F"/><text x="437" y="206" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="465" y="197" class="body" font-weight="700">期待一次清零吗</text><text x="465" y="217" class="small">雀斑易随日晒复发 需长期防晒</text><rect width="335" height="58" x="56" y="242" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><circle cx="84" cy="271" r="16" fill="#C9A876"/><text x="84" y="276" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="112" y="267" class="body" font-weight="700">能接受反黑或色减吗</text><text x="112" y="287" class="small">深肤色人群风险更高</text><rect width="335" height="58" x="409" y="242" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><circle cx="437" cy="271" r="16" fill="#C9A876"/><text x="437" y="276" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="465" y="267" class="body" font-weight="700">是否愿意先做测试点</text><text x="465" y="287" class="small">小范围验证再决定全脸</text><text x="56" y="338" class="nodeTitle">测试点流程</text><rect width="688" height="78" x="56" y="352" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="76" y="378" class="body" font-weight="700">选一两颗代表性雀斑做测试</text><text x="76" y="400" class="small">观察两到四周反应 是否有反黑 色减 红肿</text><text x="76" y="420" class="small">反应良好再扩大范围 反应明显则调整参数或换方案</text><rect width="688" height="22" x="56" y="440" fill="#eef4ee" rx="8"/><text x="400" y="455" class="quote" font-size="14" text-anchor="middle">日常记录别被季节变化骗了，夏深冬浅是常态</text><text x="56" y="472" class="footer">医学教育示意 · 测试点不是走形式 是判断皮肤反应的关键</text></svg>