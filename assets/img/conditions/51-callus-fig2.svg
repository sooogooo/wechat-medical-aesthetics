<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t51f2 d51f2" role="img" viewBox="0 0 800 500"><title id="t51f2">胼胝的护理与管理</title><desc id="d51f2">通过鞋袜受力调整保湿和专业修脚减少胼胝复发</desc><defs><linearGradient id="bg51f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh51f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg51f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh51f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 51</text><text x="52" y="92" class="title">护理与管理清单</text><text x="52" y="116" class="kicker">减少压力、保持滋润、专业修护，三管齐下</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="220" height="34" x="52" y="150" fill="#5F6E54" rx="8"/><text x="162" y="172" class="nodeTitle" text-anchor="middle">调整受力（最关键）</text><rect width="220" height="206" x="52" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="68" cy="214" r="3" fill="#5F6E54"/><text x="80" y="218" class="body">选合脚、有缓冲的鞋</text><circle cx="68" cy="244" r="3" fill="#5F6E54"/><text x="80" y="248" class="body">鞋跟不宜过高过紧</text><circle cx="68" cy="274" r="3" fill="#5F6E54"/><text x="80" y="278" class="body">使用减压垫、硅胶垫</text><circle cx="68" cy="304" r="3" fill="#5F6E54"/><text x="80" y="308" class="body">长时间站立注意休息</text><circle cx="68" cy="334" r="3" fill="#5F6E54"/><text x="80" y="338" class="body">足部畸形可定制鞋垫</text><circle cx="68" cy="372" r="3" fill="#5F6E54"/><text x="80" y="376" fill="#5F6E54" class="small">改鞋比改皮更有效</text><rect width="220" height="34" x="290" y="150" fill="#7A8B6F" rx="8"/><text x="400" y="172" class="nodeTitle" text-anchor="middle">皮肤保湿</text><rect width="220" height="206" x="290" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="306" cy="214" r="3" fill="#5F6E54"/><text x="318" y="218" class="body">温水泡脚软化角质</text><circle cx="306" cy="244" r="3" fill="#5F6E54"/><text x="318" y="248" class="body">泡后涂抹尿素霜</text><circle cx="306" cy="274" r="3" fill="#5F6E54"/><text x="318" y="278" class="body">保鲜膜封包促吸收</text><circle cx="306" cy="304" r="3" fill="#5F6E54"/><text x="318" y="308" class="body">坚持每日保湿</text><circle cx="306" cy="334" r="3" fill="#5F6E54"/><text x="318" y="338" class="small">干燥会加重增厚</text><circle cx="306" cy="372" r="3" fill="#5F6E54"/><text x="318" y="376" fill="#5F6E54" class="small">冬季尤其重要</text><rect width="220" height="34" x="528" y="150" fill="#C9A876" rx="8"/><text x="638" y="172" class="nodeTitle" text-anchor="middle">专业修护</text><rect width="220" height="206" x="528" y="188" fill="#fbf5ea" stroke="#C9A876" rx="10"/><circle cx="544" cy="214" r="3" fill="#C9A876"/><text x="556" y="218" class="body">由专业人员修薄</text><circle cx="544" cy="244" r="3" fill="#C9A876"/><text x="556" y="248" class="body">勿用剪刀自削</text><circle cx="544" cy="274" r="3" fill="#C9A876"/><text x="556" y="278" class="body">勿乱用强酸腐蚀</text><circle cx="544" cy="304" r="3" fill="#C9A876"/><text x="556" y="308" class="body">疼痛、破溃须就医</text><circle cx="544" cy="334" r="3" fill="#C9A876"/><text x="556" y="338" class="small">糖尿病者禁自行处理</text><circle cx="544" cy="372" r="3" fill="#B5654A"/><text x="556" y="376" fill="#B5654A" class="small">神经病变者更高危</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">削掉的是症状，调好鞋袜才治本</text><text x="52" y="466" class="footer">健康科普示意 · 糖尿病等高危足的修护须由足病或专科医师进行</text></svg>