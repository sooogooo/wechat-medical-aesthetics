<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1602 desc1602" role="img" viewBox="0 0 900 620"><title id="title1602">男性乳房发育：先排查病因再谈手术</title><desc id="desc1602">药物、肝病、内分泌肿瘤等都可能引起乳腺增生，跳过病因排查直接手术不负责任</desc><defs><linearGradient id="bg1602" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1602" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg1602)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1602)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 16</text><text x="62" y="117" class="title">不排查病因就安排手术，是漏诊</text><text x="62" y="153" class="kicker">关键一步：找到有没有需要治疗的原因</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="250" height="280" x="62" y="210" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="105" cy="253" r="22" fill="#D55E00"/><text x="105" y="262" class="num" text-anchor="middle">1</text><text x="140" y="260" class="nodeTitle">排查病因</text><text x="82" y="300" class="body">药物（抗雄、心血管、精神类）</text><text x="82" y="328" class="body">肝脏疾病</text><text x="82" y="356" class="body">性腺功能异常</text><text x="82" y="384" class="body">少见：内分泌肿瘤</text><rect width="210" height="60" x="82" y="410" fill="#fbeae3" rx="8"/><text x="187" y="433" class="small" text-anchor="middle">必要时：激素检查 · 超声</text><text x="187" y="455" class="small" text-anchor="middle">相关科室会诊</text><path stroke="#7d8e93" stroke-width="2" d="M 312 350 L 325 350"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 320 344 L 325 350 L 320 356"/><rect width="250" height="280" x="325" y="210" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="368" cy="253" r="22" fill="#E69F00"/><text x="368" y="262" class="num" text-anchor="middle">2</text><text x="403" y="260" class="nodeTitle">当面评估</text><text x="345" y="300" class="body">腺体／脂肪比例</text><text x="345" y="328" class="body">皮肤状况</text><text x="345" y="356" class="body">是否稳定（非青春期一过性）</text><text x="345" y="384" class="body">症状与心理影响</text><rect width="210" height="60" x="345" y="410" fill="#fdf3e3" rx="8"/><text x="450" y="433" class="small" text-anchor="middle">新近出现、快速增大、疼痛</text><text x="450" y="455" class="small" text-anchor="middle">需先排查肿瘤或内分泌病</text><path stroke="#7d8e93" stroke-width="2" d="M 575 350 L 588 350"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 583 344 L 588 350 L 583 356"/><rect width="250" height="280" x="588" y="210" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="631" cy="253" r="22" fill="#0072B2"/><text x="631" y="262" class="num" text-anchor="middle">3</text><text x="666" y="260" class="nodeTitle">手术（视情）</text><text x="608" y="300" class="body">腺体切除（真性）</text><text x="608" y="328" class="body">吸脂（假性或混合）</text><text x="608" y="356" class="body">皮肤切除（严重松弛）</text><rect width="210" height="60" x="608" y="410" fill="#eef6f8" rx="8"/><text x="713" y="433" class="small" text-anchor="middle">适合：稳定、病因明确</text><text x="713" y="455" class="small" text-anchor="middle">症状或心理影响明显者</text><rect width="776" height="40" x="62" y="505" fill="#fdf1ee" rx="12"/><text x="450" y="531" class="quote" text-anchor="middle">跳过病因排查直接安排手术的机构，不够负责</text><text x="62" y="582" class="footer">医学教育示意 · 青春期一过性者相当比例会自行消退 · 须在正规医疗机构评估</text></svg>