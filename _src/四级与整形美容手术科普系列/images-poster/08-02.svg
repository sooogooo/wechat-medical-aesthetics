<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0802 desc0802" role="img" viewBox="0 0 900 620"><title id="title0802">正颌手术流程：正畸与正颌联合</title><desc id="desc0802">预正畸、正颌手术、术后正畸精细调整的长周期流程，常需一到两年</desc><defs><linearGradient id="bg0802" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0802" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.num{font:700 24px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0802)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0802)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 08</text><text x="62" y="117" class="title">正颌流程：正畸与正颌联合</text><text x="62" y="153" class="kicker">整个过程可能持续一到两年，不是一次手术解决</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="180" height="160" x="62" y="215" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="100" cy="252" r="20" fill="#0072B2"/><text x="100" y="260" class="num" font-size="20" text-anchor="middle">1</text><text x="132" y="248" class="nodeTitle" font-size="16">术前评估</text><text x="82" y="290" class="body">头颅正侧位片</text><text x="82" y="312" class="body">全景片或 CBCT</text><text x="82" y="334" class="body">牙模、咬合记录</text><text x="82" y="356" class="body">睡眠监测（必要时）</text><rect width="180" height="160" x="254" y="215" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="292" cy="252" r="20" fill="#E69F00"/><text x="292" y="260" class="num" font-size="20" text-anchor="middle">2</text><text x="324" y="248" class="nodeTitle" font-size="16">预正畸</text><text x="274" y="290" class="body">先戴牙套</text><text x="274" y="312" class="body">排齐牙齿</text><text x="274" y="334" class="body">去代偿</text><text x="274" y="356" class="body">为截骨准备</text><rect width="180" height="160" x="446" y="215" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="484" cy="252" r="20" fill="#D55E00"/><text x="484" y="260" class="num" font-size="20" text-anchor="middle">3</text><text x="516" y="248" class="nodeTitle" font-size="16">正颌手术</text><text x="466" y="290" class="body">全身麻醉</text><text x="466" y="312" class="body">Le Fort I 截骨</text><text x="466" y="334" class="body">下颌支矢状劈开</text><text x="466" y="356" class="body">颏成形（视方案）</text><rect width="200" height="160" x="638" y="215" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="676" cy="252" r="20" fill="#E69F00"/><text x="676" y="260" class="num" font-size="20" text-anchor="middle">4</text><text x="708" y="248" class="nodeTitle" font-size="16">术后正畸</text><text x="658" y="290" class="body">精细调整咬合</text><text x="658" y="312" class="body">稳定骨段位置</text><text x="658" y="334" class="body">定期复诊</text><text x="658" y="356" class="body">功能与外观并重</text><path stroke="#7d8e93" stroke-width="2" d="M 242 295 L 254 295"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 249 290 L 254 295 L 249 300"/><path stroke="#7d8e93" stroke-width="2" d="M 434 295 L 446 295"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 441 290 L 446 295 L 441 300"/><path stroke="#7d8e93" stroke-width="2" d="M 626 295 L 638 295"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 633 290 L 638 295 L 633 300"/><rect width="776" height="118" x="62" y="395" fill="#eef6f8" stroke="#dce8e8" rx="12"/><text x="82" y="420" class="nodeTitle">常见术式说明</text><text x="82" y="445" class="body">· Le Fort I 型截骨：上颌骨整体移动，矫正上颌前突、后缩或偏斜</text><text x="82" y="468" class="body">· 下颌支矢状劈开截骨术（BSSO）：下颌前移或后退，矫正地包天或小下巴</text><text x="82" y="491" class="body">· 颏成形术：单独调整颏部位置，常与上述术式联合（见第 09 篇）</text><rect width="776" height="40" x="62" y="525" fill="#fdf3e3" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">长周期、高风险——不能配合一到两年正畸者不建议做</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 正颌手术须在有相应资质机构由具备权限医师开展</text></svg>