<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1303 desc1303" role="img" viewBox="0 0 900 620"><title id="title1303">隆乳术决策前的硬要求</title><desc id="desc1303">面诊隆乳应做到选择资质机构、评估解剖、讨论选择逻辑、理解远期风险、确认植入物可追溯</desc><defs><linearGradient id="bg1303" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1303" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 24px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg1303)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1303)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 13</text><text x="62" y="117" class="title">隆乳面诊，至少做到这些</text><text x="62" y="153" class="kicker">六个硬要求，缺一项都该追问</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="250" height="148" x="62" y="205" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="100" cy="241" r="20" fill="#0072B2"/><text x="100" y="249" class="num" text-anchor="middle">1</text><text x="132" y="247" class="nodeTitle">资质核验</text><text x="82" y="282" class="body">有资质的机构和主刀</text><text x="82" y="307" class="body">执业许可证可查</text><text x="82" y="335" class="small">复杂病例可达三级／四级</text><rect width="250" height="148" x="325" y="205" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="363" cy="241" r="20" fill="#0072B2"/><text x="363" y="249" class="num" text-anchor="middle">2</text><text x="395" y="247" class="nodeTitle">解剖评估</text><text x="345" y="282" class="body">胸廓宽度</text><text x="345" y="307" class="body">皮肤弹性 · 组织厚度</text><text x="345" y="335" class="small">对称性综合判断</text><rect width="250" height="148" x="588" y="205" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="626" cy="241" r="20" fill="#E69F00"/><text x="626" y="249" class="num" text-anchor="middle">3</text><text x="658" y="247" class="nodeTitle">选择逻辑</text><text x="608" y="282" class="body">类型 · 层次 · 切口 · 大小</text><text x="608" y="307" class="body">由医生提出建议</text><text x="608" y="335" class="small">不是单方面决定</text><rect width="250" height="148" x="62" y="365" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="100" cy="401" r="20" fill="#E69F00"/><text x="100" y="409" class="num" text-anchor="middle">4</text><text x="132" y="407" class="nodeTitle">远期风险</text><text x="82" y="442" class="body">理解二次手术现实</text><text x="82" y="467" class="body">包膜挛缩 · 破裂</text><text x="82" y="495" class="small">假体非终身植入物</text><rect width="250" height="148" x="325" y="365" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="363" cy="401" r="20" fill="#0072B2"/><text x="363" y="409" class="num" text-anchor="middle">5</text><text x="395" y="407" class="nodeTitle">植入物追溯</text><text x="345" y="442" class="body">可追溯批号</text><text x="345" y="467" class="body">注册证号</text><text x="345" y="495" class="small">写入病历记录</text><rect width="250" height="148" x="588" y="365" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="626" cy="401" r="20" fill="#D55E00"/><text x="626" y="409" class="num" text-anchor="middle">6</text><text x="658" y="407" class="nodeTitle">麻醉与急救</text><text x="608" y="442" class="body">全麻条件</text><text x="608" y="467" class="body">急救与监护能力</text><text x="608" y="495" class="small">含血备或输血渠道</text><rect width="776" height="40" x="62" y="528" fill="#fbeae3" rx="12"/><text x="450" y="554" class="quote" text-anchor="middle">对植入物来源含糊其辞的机构，不值得信任</text><text x="62" y="582" class="footer">医学教育示意 · 具体资质以官方核验结果为准</text></svg>