<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="MD Codes 注射的核心技术维度">
  <rect width="640" height="300" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">每个 code 的四个技术维度</text>

  <rect x="30" y="60" width="140" height="210" rx="8" fill="#ffffff" stroke="#7a8b6f"/>
  <circle cx="100" cy="100" r="16" fill="#7a8b6f"/>
  <text x="100" y="105" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">1</text>
  <text x="100" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">层次</text>
  <text x="100" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">骨膜上深层</text>
  <text x="100" y="192" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">皮下层</text>
  <text x="100" y="209" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">真皮层</text>
  <text x="100" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">决定安全与效果</text>

  <rect x="180" y="60" width="140" height="210" rx="8" fill="#ffffff" stroke="#8a9a7f"/>
  <circle cx="250" cy="100" r="16" fill="#8a9a7f"/>
  <text x="250" y="105" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">2</text>
  <text x="250" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">针具</text>
  <text x="250" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">锐针</text>
  <text x="250" y="192" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">钝针（套管）</text>
  <text x="250" y="209" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不同型号</text>
  <text x="250" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">影响创伤与血管风险</text>

  <rect x="330" y="60" width="140" height="210" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <circle cx="400" cy="100" r="16" fill="#c9a876"/>
  <text x="400" y="105" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text x="400" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">剂量</text>
  <text x="400" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">每个 code</text>
  <text x="400" y="192" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">推荐剂量范围</text>
  <text x="400" y="209" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">克制原则</text>
  <text x="400" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">多了显假、少了无效</text>

  <rect x="480" y="60" width="140" height="210" rx="8" fill="#ffffff" stroke="#5f6e54"/>
  <circle cx="550" cy="100" r="16" fill="#5f6e54"/>
  <text x="550" y="105" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">4</text>
  <text x="550" y="145" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">手法</text>
  <text x="550" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">少量慢推</text>
  <text x="550" y="192" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">注射前回抽</text>
  <text x="550" y="209" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">分层注射</text>
  <text x="550" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">降低栓塞等并发症</text>

  <text x="320" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">这四个维度组合，决定了一针打下去是“安全自然”还是“出问题”</text>
</svg>