<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="中脸 codes 风险要点">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">中脸 codes 的主要风险</text>

  <rect x="30" y="55" width="280" height="170" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="170" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">血管风险</text>
  <text x="50" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 面动脉及其分支</text>
  <text x="50" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">  （鼻唇沟、面颊区域）</text>
  <text x="50" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 角动脉（内眦附近）</text>
  <text x="50" y="184" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 深层骨面相对安全</text>
  <text x="50" y="207" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">熟悉解剖是核心</text>

  <rect x="330" y="55" width="280" height="170" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="470" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">美学风险</text>
  <text x="350" y="115" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 过度填充 → 显宽、显肿</text>
  <text x="350" y="138" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 只填沟不支撑 → 假面</text>
  <text x="350" y="161" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 两侧不对称</text>
  <text x="350" y="184" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 材料移位</text>
  <text x="350" y="207" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">剂量与组合是关键</text>

  <text x="320" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">中脸是年轻化核心，也是最容易“打假”的区域——技术含量高</text>
</svg>