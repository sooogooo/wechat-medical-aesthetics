<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1502 desc1502">
  <title id="title1502">乳房上提术的疤痕权衡</title>
  <desc id="desc1502">三种术式疤痕从小到大：甜甜圈型、棒棒糖型、锚状，提升力度与疤痕递增</desc>
  <defs>
    <linearGradient id="bg1502" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1502" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1502)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1502)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 15</text>
  <text x="62" y="117" class="title">提升力度与疤痕：无法回避的权衡</text>
  <text x="62" y="153" class="kicker">三种术式，疤痕从短到长，提升从弱到强</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 权衡进度条（左到右，提升↑ 疤痕↑） -->
  <rect x="62" y="208" width="776" height="36" rx="8" fill="#f8fbfb" stroke="#dce8e8"/>
  <text x="82" y="231" class="small">疤痕短 · 提升弱</text>
  <text x="818" y="231" class="small" text-anchor="end">疤痕长 · 提升强</text>
  <line x1="430" y1="226" x2="470" y2="226" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 462 220 L 470 226 L 462 232" fill="none" stroke="#7d8e93" stroke-width="2"/>

  <!-- 三张术式卡 -->
  <!-- 卡1：甜甜圈型 -->
  <rect x="62" y="260" width="250" height="245" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <text x="187" y="290" class="nodeTitle" text-anchor="middle">乳晕周围切口</text>
  <text x="187" y="312" class="small" text-anchor="middle">（甜甜圈型）</text>
  <!-- 示意符号：环形 -->
  <circle cx="187" cy="360" r="26" fill="none" stroke="#0072B2" stroke-width="2.5"/>
  <text x="187" y="408" class="body" text-anchor="middle">疤痕相对小</text>
  <text x="187" y="432" class="small" text-anchor="middle">适合轻度下垂</text>
  <text x="187" y="452" class="small" text-anchor="middle">提升力度有限</text>
  <rect x="82" y="465" width="210" height="30" rx="6" fill="#eef6f8"/>
  <text x="187" y="485" class="small" text-anchor="middle">可能致乳晕变宽</text>

  <!-- 卡2：棒棒糖型 -->
  <rect x="325" y="260" width="250" height="245" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <text x="450" y="290" class="nodeTitle" text-anchor="middle">垂直切口</text>
  <text x="450" y="312" class="small" text-anchor="middle">（棒棒糖型）</text>
  <!-- 示意符号：环形+垂直线 -->
  <circle cx="450" cy="345" r="18" fill="none" stroke="#E69F00" stroke-width="2.5"/>
  <line x1="450" y1="363" x2="450" y2="395" stroke="#E69F00" stroke-width="2.5"/>
  <text x="450" y="418" class="body" text-anchor="middle">平衡力度与疤痕</text>
  <text x="450" y="442" class="small" text-anchor="middle">适合中度下垂</text>
  <text x="450" y="462" class="small" text-anchor="middle">最常用的折中术式</text>
  <rect x="345" y="470" width="210" height="25" rx="6" fill="#fdf3e3"/>
  <text x="450" y="487" class="small" text-anchor="middle">乳晕周围加垂直切口</text>

  <!-- 卡3：锚状 -->
  <rect x="588" y="260" width="250" height="245" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <text x="713" y="290" class="nodeTitle" text-anchor="middle">倒 T 型</text>
  <text x="713" y="312" class="small" text-anchor="middle">（锚状）</text>
  <!-- 示意符号：环形+垂直线+横线 -->
  <circle cx="713" cy="345" r="16" fill="none" stroke="#D55E00" stroke-width="2.5"/>
  <line x1="713" y1="361" x2="713" y2="388" stroke="#D55E00" stroke-width="2.5"/>
  <line x1="685" y1="388" x2="741" y2="388" stroke="#D55E00" stroke-width="2.5"/>
  <text x="713" y="412" class="body" text-anchor="middle">提升最彻底</text>
  <text x="713" y="436" class="small" text-anchor="middle">适合重度下垂或大量切除</text>
  <text x="713" y="456" class="small" text-anchor="middle">疤痕最长</text>
  <rect x="608" y="470" width="210" height="25" rx="6" fill="#fbeae3"/>
  <text x="713" y="487" class="small" text-anchor="middle">再加下皱襞横切口</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="551" class="quote" text-anchor="middle">宣传无痕提升、不留疤的，都不诚实</text>

  <text x="62" y="582" class="footer">医学教育示意 · 术式选择需面诊评估 · 复杂或联合假体可达三级／四级</text>
</svg>
