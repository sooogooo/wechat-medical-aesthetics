<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleA202 descA202">
  <title id="titleA202">分离到什么程度，才考虑手术</title>
  <desc id="descA202">腹直肌分离按宽度分度，两指以内观察、2～3 指康复训练、3 指以上面诊评估</desc>
  <defs>
    <marker id="ahA202" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · A2</text>
  <text x="62" y="112" class="title">分离到什么程度，才考虑手术</text>
  <text x="62" y="148" class="kicker">轻度首选康复训练，重度伴功能障碍才谈手术</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>
  <rect x="62" y="205" width="250" height="270" rx="10" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="84" y="243" class="nodeTitle">两指以内</text>
  <text x="84" y="277" class="body">基本正常</text>
  <text x="84" y="303" class="body">观察即可，无需特殊处理</text>
  <text x="187" y="463" class="small" style="fill:#0B8A6B" text-anchor="middle">别盲目做卷腹</text>
  <rect x="324" y="205" width="250" height="270" rx="10" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="346" y="243" class="nodeTitle">2～3 指</text>
  <text x="346" y="277" class="body">轻到中度分离</text>
  <text x="346" y="303" class="body">首选产后康复训练</text>
  <text x="346" y="329" class="body">核心训练＋呼吸控制</text>
  <text x="346" y="355" class="body">需要专业指导</text>
  <text x="449" y="463" class="small" style="fill:#D9930D" text-anchor="middle">训练数月无改善再评估</text>
  <rect x="586" y="205" width="250" height="270" rx="10" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="608" y="243" class="nodeTitle">3 指以上</text>
  <text x="608" y="277" class="body">中重度分离</text>
  <text x="608" y="303" class="body">面诊评估，超声测量</text>
  <text x="608" y="329" class="body">训练无效伴功能障碍</text>
  <text x="608" y="355" class="body">才考虑手术收紧</text>
  <text x="711" y="463" class="small" style="fill:#C75B00" text-anchor="middle">收紧肌层属四级手术</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">把手术留给康复搞不定的情况</text>
  <text x="62" y="580" class="footer">医学教育示意 · 是否手术由资质医师评估 · 康复训练需专业指导</text>
</svg>
