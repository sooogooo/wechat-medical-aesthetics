  <rect x="146" y="394" width="130" height="50" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.5"/>
  <text x="211" y="415" class="nodeTitle" text-anchor="middle">知情陪伴</text>
  <text x="211" y="433" class="nodeSub" text-anchor="middle">知情选择替代劝说</text>
