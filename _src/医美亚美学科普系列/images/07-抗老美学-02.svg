<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="抗老美学的代价">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">&quot;必须显年轻&quot;带来的几重代价</text>

  <rect x="30" y="60" width="185" height="190" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="122" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">焦虑永续</text>
  <text x="45" y="118" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">衰老不可逆</text>
  <text x="45" y="138" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">抗老成了无终点</text>
  <text x="45" y="158" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">的追逐</text>
  <text x="45" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">永远&quot;还不够年轻&quot;</text>

  <rect x="227" y="60" width="185" height="190" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">年龄歧视</text>
  <text x="242" y="118" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;显老&quot;成贬义</text>
  <text x="242" y="138" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">中老年被污名</text>
  <text x="242" y="158" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">成熟之美被否定</text>
  <text x="242" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">每个人都会老</text>

  <rect x="424" y="60" width="185" height="190" rx="8" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="516" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">过度消费</text>
  <text x="439" y="118" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">为&quot;抗老&quot;反复</text>
  <text x="439" y="138" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">投入大量金钱</text>
  <text x="439" y="158" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">和时间</text>
  <text x="439" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">可能过度治疗</text>

  <text x="320" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">反对&quot;年轻至上&quot;，不是反对延缓衰老，而是反对它成为唯一的审美方向</text>
</svg>