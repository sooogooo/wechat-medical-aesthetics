<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t40f1 d40f1">
  <title id="t40f1">剥脱性唇炎不只是缺水</title>
  <desc id="d40f1">剥脱性唇炎的脱屑结痂与舔咬接触感染心理等多因素相关</desc>
  <defs>
    <linearGradient id="bg40f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh40f1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .center { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .card { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg40f1)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh40f1)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 40</text>
  <text x="52" y="92" class="title">剥脱性唇炎的多因素成因</text>
  <text x="52" y="116" class="kicker">反复结痂脱一层长一层，先找原因，再谈修复</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <text x="52" y="162" class="nodeTitle">五类常见诱因</text>

  <!-- 中心圆 -->
  <circle cx="400" cy="280" r="58" fill="#5F6E54"/>
  <text x="400" y="274" class="center" text-anchor="middle">唇部</text>
  <text x="400" y="296" class="center" text-anchor="middle">反复脱屑</text>

  <!-- 5张诱因卡环绕 -->
  <rect x="70" y="190" width="180" height="78" rx="12" fill="#fbf0eb" stroke="#B5654A"/>
  <text x="80" y="214" class="card">习惯性舔咬</text>
  <text x="80" y="236" class="small">舔唇越湿越干</text>
  <text x="80" y="256" class="small">撕皮造成新损伤</text>

  <rect x="70" y="292" width="180" height="78" rx="12" fill="#fbf5ea" stroke="#C9A876"/>
  <text x="80" y="316" class="card">接触过敏</text>
  <text x="80" y="338" class="small">唇膏、牙膏、香料</text>
  <text x="80" y="358" class="small">食物与药物</text>

  <rect x="310" y="372" width="180" height="62" rx="12" fill="#f4f7f1" stroke="#7A8B6F"/>
  <text x="320" y="396" class="card">感染因素</text>
  <text x="320" y="418" class="small">细菌、真菌、念珠菌</text>
  <text x="320" y="430" class="small" fill="#B5654A">需医师取材镜检</text>

  <rect x="550" y="292" width="180" height="78" rx="12" fill="#f4f7f1" stroke="#7A8B6F"/>
  <text x="560" y="316" class="card">心理行为</text>
  <text x="560" y="338" class="small">焦虑、强迫舔咬</text>
  <text x="560" y="358" class="small">压力诱发</text>

  <rect x="550" y="190" width="180" height="78" rx="12" fill="#fbf0eb" stroke="#B5654A"/>
  <text x="560" y="214" class="card">日晒与气候</text>
  <text x="560" y="236" class="small">干燥、寒冷、风吹</text>
  <text x="560" y="256" class="small">光化学损伤</text>

  <!-- 连线到中心 -->
  <path d="M 250 229 Q 320 250 348 268" stroke="#7d8e93" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 250 331 Q 320 300 348 290" stroke="#7d8e93" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 400 372 L 400 340" stroke="#7d8e93" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 550 331 Q 480 300 452 290" stroke="#7d8e93" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 550 229 Q 480 250 452 268" stroke="#7d8e93" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">脱下来的不是皮，是还没长好的屏障</text>
  <text x="52" y="466" class="footer">健康科普示意 · 感染与心理因素需医师评估并对应处理</text>
</svg>
