<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t09a d09a" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t09a">面部评估框架与词汇翻译器</title><desc id="d09a">三庭五眼是参考不是尺子，右侧把求美者愿望词汇翻译成医学现实</desc><defs><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.panel{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.lbl{font:500 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.word{font:700 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.trans{font:500 10.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#e4ddd2" rx="10"/><text x="56" y="58" class="series">医美咨询师成长教程 · 阶段2 · 09</text><text x="56" y="90" class="title">美学语言 评估框架 + 词汇翻译器</text><text x="56" y="116" class="kicker">客人说的是愿望，不是解剖——咨询师是愿望与医学之间的翻译官</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><rect width="330" height="304" x="56" y="144" fill="#fff" stroke="#a9bba0" stroke-width="1.4" rx="10"/><text x="72" y="170" class="panel">三庭五眼 · 参考不是尺子</text><ellipse cx="221" cy="300" fill="#fff" stroke="#2B2A28" stroke-width="2" rx="10" ry="118"/><line x1="145" x2="297" y1="212" y2="212" stroke="#7A8B6F" stroke-dasharray="5 4" stroke-width="1.3"/><line x1="133" x2="309" y1="288" y2="288" stroke="#7A8B6F" stroke-dasharray="5 4" stroke-width="1.3"/><line x1="145" x2="297" y1="364" y2="364" stroke="#7A8B6F" stroke-dasharray="5 4" stroke-width="1.3"/><text x="126" y="216" class="lbl" text-anchor="end">发际线</text><text x="126" y="292" class="lbl" text-anchor="end">眉线</text><text x="126" y="368" class="lbl" text-anchor="end">鼻底</text><text x="312" y="256" class="lbl">上庭</text><text x="312" y="332" class="lbl">中庭</text><text x="312" y="404" class="lbl">下庭</text><ellipse cx="186" cy="276" fill="#fff" stroke="#2B2A28" stroke-width="1.2" rx="10" ry="7"/><ellipse cx="256" cy="276" fill="#fff" stroke="#2B2A28" stroke-width="1.2" rx="10" ry="7"/><text x="221" y="436" class="lbl" text-anchor="middle">五眼：脸宽 ≈ 五只眼睛的宽度 · 动态表情比静态照更真实</text><rect width="344" height="304" x="402" y="144" fill="#fff" stroke="#d9cbab" stroke-width="1.4" rx="10"/><text x="418" y="170" class="panel">词汇翻译器：听到愿望，翻译现实</text><rect width="76" height="24" x="418" y="182" fill="#fff" stroke="#7A8B6F" stroke-width="1.2" rx="10"/><text x="456" y="198" class="word" text-anchor="middle">幼态脸</text><text x="506" y="192" class="trans">短中庭 · 圆润减龄 → 多手段组合</text><text x="506" y="206" class="trans">且有&quot;过度幼态不自然&quot;的边界</text><rect width="76" height="24" x="418" y="216" fill="#fff" stroke="#7A8B6F" stroke-width="1.2" rx="10"/><text x="456" y="232" class="word" text-anchor="middle">高级脸</text><text x="506" y="226" class="trans">骨相清晰 · 有留白耐看 → 往往</text><text x="506" y="240" class="trans">要做减法，与堆项目直觉相反</text><rect width="76" height="24" x="418" y="250" fill="#fff" stroke="#7A8B6F" stroke-width="1.2" rx="10"/><text x="456" y="266" class="word" text-anchor="middle">妈生款</text><text x="506" y="260" class="trans">看不出做过 → 宁可不足、分次</text><text x="506" y="274" class="trans">调整，克制比饱和更重要</text><rect width="76" height="24" x="418" y="284" fill="#fff" stroke="#B5654A" stroke-width="1.2" rx="10"/><text x="456" y="300" class="word" text-anchor="middle">do脸感</text><text x="506" y="294" class="trans">她不想要的样子 → 过度填充的</text><text x="506" y="308" class="trans">警示词，反向校准方案</text><rect width="76" height="24" x="418" y="318" fill="#fff" stroke="#7A8B6F" stroke-width="1.2" rx="10"/><text x="456" y="334" class="word" text-anchor="middle">抗老</text><text x="506" y="328" class="trans">维持现状而非变年轻 → 慢变量：</text><text x="506" y="342" class="trans">皮肤质地+容量+支撑的综合管理</text><rect width="312" height="72" x="418" y="358" fill="#fff" stroke="#d9cbab" stroke-width="1.2" rx="10"/><text x="434" y="382" fill="#2B2A28" class="trans" font-weight="700">翻译纪律：先复述愿望 → 再讲现实区间 → 最后交给医生评估</text><text x="434" y="402" class="trans">顺序不能反：上来就泼冷水，客人只会去找敢承诺的人</text><text x="56" y="466" class="footer">审美底线：三型中的庸俗型=把不同的人做成同一张脸 · 放大焦虑能成交，但那是红灯区</text></svg>