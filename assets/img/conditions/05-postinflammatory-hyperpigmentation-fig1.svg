<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t05f1 d05f1">
  <title id="t05f1">炎症后色沉两种颜色来源</title>
  <desc id="d05f1">红印与黑褐色印机制不同，治疗顺序是先灭火再处理余温</desc>
  <defs>
    <linearGradient id="bg05f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh05f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg05f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh05f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 05</text>
  <text x="56" y="90" class="title">同一个印 为什么有时深有时浅</text>
  <text x="56" y="116" class="kicker">炎症后色沉不是色素毒素，机制不同处理也不同</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">两种颜色两种来源</text>

  <!-- 红印 -->
  <rect x="56" y="174" width="335" height="150" rx="12" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="30" rx="12" fill="#B5654A"/><rect x="56" y="194" width="335" height="10" fill="#B5654A"/>
  <text x="72" y="195" class="tag">红印 炎症后血管变化</text>
  <text x="72" y="226" class="body">局部血管扩张 通透性增高</text>
  <text x="72" y="252" class="body">随炎症消退逐渐变淡</text>
  <text x="72" y="278" class="small">时间因肤色 日晒 炎症程度而异</text>
  <text x="72" y="304" class="small">控制新炎症比美白更关键</text>

  <!-- 黑褐色印 -->
  <rect x="409" y="174" width="335" height="150" rx="12" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="30" rx="12" fill="#8a6a3a"/><rect x="409" y="194" width="335" height="10" fill="#8a6a3a"/>
  <text x="425" y="195" class="tag">黑褐色印 黑色素沉积</text>
  <text x="425" y="226" class="body">炎症刺激黑色素细胞产色素</text>
  <text x="425" y="252" class="body">美白防晒可帮助淡化</text>
  <text x="425" y="278" class="small">激光可快但也可能放大问题</text>
  <text x="425" y="304" class="small">深肤色人群需更谨慎</text>

  <!-- 治疗顺序 -->
  <text x="56" y="356" class="nodeTitle">治疗顺序 先灭火 再处理余温</text>
  <rect x="56" y="370" width="688" height="56" rx="10" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4"/>
  <text x="76" y="394" class="body" font-weight="700">第一步 控制原发炎症</text>
  <text x="76" y="414" class="small">痘痘 湿疹 抓挠 治疗刺激都是源头 不控炎症淡印无意义</text>

  <rect x="56" y="432" width="688" height="32" rx="8" fill="#eef4ee"/>
  <text x="400" y="453" class="quote" text-anchor="middle">能逐渐变淡，但前提是控制炎症防晒并减少二次伤害</text>
  <text x="56" y="472" class="footer">医学教育示意 · 激光可快但也可能把问题放大，深肤色需谨慎</text>
</svg>
