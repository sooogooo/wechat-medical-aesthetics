<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2401 desc2401" role="img" viewBox="0 0 900 620"><title id="title2401">体表肿物切除：性质判断优先于美观</title><desc id="desc2401">先判断良性/恶性/性质不明再决定术式，ABCDE原则识别可疑痣，任何切除组织都应送病理</desc><defs><linearGradient id="bg2401" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2401" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff;letter-spacing:1px}.letter{font:700 28px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg2401)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2401)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 24</text><text x="62" y="117" class="title">性质判断优先于美观</text><text x="62" y="153" class="kicker">「切干净」永远高于「留小疤」——美容不能凌驾于肿瘤安全</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">第一步：判断性质</text><rect width="250" height="100" x="62" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="250" height="32" x="62" y="232" fill="#0072B2" rx="14"/><rect width="250" height="12" x="62" y="252" fill="#0072B2"/><text x="187" y="254" class="tag" text-anchor="middle">良性</text><text x="82" y="290" class="body">色素痣 · 囊肿 · 脂肪瘤</text><text x="82" y="314" class="small">美容考量可主导术式</text><rect width="250" height="100" x="325" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5" rx="14"/><rect width="250" height="32" x="325" y="232" fill="#D55E00" rx="14"/><rect width="250" height="12" x="325" y="252" fill="#D55E00"/><text x="450" y="254" class="tag" text-anchor="middle">恶性或可疑恶性</text><text x="345" y="290" class="body">基底细胞癌 · 鳞癌 · 黑色素瘤</text><text x="345" y="314" class="small">必须按肿瘤学原则切除</text><rect width="250" height="100" x="588" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="250" height="32" x="588" y="232" fill="#E69F00" rx="14"/><rect width="250" height="12" x="588" y="252" fill="#E69F00"/><text x="713" y="254" class="tag" text-anchor="middle">性质不明</text><text x="608" y="290" class="body">增大 · 破溃 · 颜色改变</text><text x="608" y="314" class="small">先评估，必要时活检</text><text x="62" y="365" class="nodeTitle">第二步：可疑痣的 ABCDE 原则（一般科普，不能替代诊断）</text><rect width="150" height="105" x="62" y="382" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8" rx="12"/><circle cx="92" cy="412" r="18" fill="#D55E00"/><text x="92" y="420" class="letter" text-anchor="middle">A</text><text x="120" y="418" class="nodeTitle">不对称</text><text x="78" y="455" class="small">形状不对称</text><text x="78" y="475" class="small">两半不匹配</text><rect width="150" height="105" x="223" y="382" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8" rx="12"/><circle cx="253" cy="412" r="18" fill="#D55E00"/><text x="253" y="420" class="letter" text-anchor="middle">B</text><text x="281" y="418" class="nodeTitle">边界</text><text x="239" y="455" class="small">不规则、模糊</text><text x="239" y="475" class="small">边缘不整</text><rect width="150" height="105" x="384" y="382" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8" rx="12"/><circle cx="414" cy="412" r="18" fill="#D55E00"/><text x="414" y="420" class="letter" text-anchor="middle">C</text><text x="442" y="418" class="nodeTitle">颜色</text><text x="400" y="455" class="small">颜色不均</text><text x="400" y="475" class="small">多种色彩</text><rect width="150" height="105" x="545" y="382" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8" rx="12"/><circle cx="575" cy="412" r="18" fill="#D55E00"/><text x="575" y="420" class="letter" text-anchor="middle">D</text><text x="603" y="418" class="nodeTitle">直径</text><text x="561" y="455" class="small">参考 6 毫米</text><text x="561" y="475" class="small">直径较大</text><rect width="132" height="105" x="706" y="382" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.8" rx="12"/><circle cx="736" cy="412" r="18" fill="#D55E00"/><text x="736" y="420" class="letter" text-anchor="middle">E</text><text x="764" y="418" class="nodeTitle">演变</text><text x="722" y="455" class="small">大小、形状</text><text x="722" y="475" class="small">感觉在变化</text><rect width="776" height="40" x="62" y="503" fill="#fbeae3" rx="12"/><text x="450" y="529" class="quote" text-anchor="middle">任何切除组织都应送病理——不送病理的切除是不规范的</text><text x="62" y="566" class="small">ABCDE 为一般科普原则，不能替代专业诊断；符合特征之一应先皮肤科评估</text><text x="62" y="582" class="footer">医学教育示意 · 性质判断与术式以皮肤科或外科面诊为准</text></svg>