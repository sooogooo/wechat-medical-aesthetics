<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="面部衰老的多维变化">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">面部衰老的三个维度</text>

  <rect x="30" y="60" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="122" cy="135" rx="50" ry="65" fill="#f3efe8" stroke="#a8a39d"/>
  <path d="M 100 100 L 110 98 M 130 100 L 140 98" stroke="#7a8b6f" stroke-width="1.5"/>
  <text x="122" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">皮肤老化</text>
  <text x="122" y="220" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">皱纹、松弛、色斑、肤质</text>
  <text x="122" y="238" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">最表层，最容易被注意</text>

  <rect x="227" y="60" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="320" cy="135" rx="50" ry="65" fill="#eef0ea" stroke="#a8a39d"/>
  <ellipse cx="320" cy="150" rx="30" ry="25" fill="#e3e8dc" opacity="0.6"/>
  <text x="320" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">容量流失</text>
  <text x="320" y="220" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">脂肪垫萎缩、骨吸收</text>
  <text x="320" y="238" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">凹陷、干瘪、支撑下降</text>

  <rect x="424" y="60" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="516" cy="140" rx="50" ry="65" fill="#f3efe8" stroke="#a8a39d"/>
  <path d="M 480 160 Q 516 180 552 160" stroke="#b5654a" stroke-width="2" fill="none"/>
  <path d="M 490 175 Q 516 185 542 175" stroke="#b5654a" stroke-width="1.5" fill="none"/>
  <text x="516" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">组织下移</text>
  <text x="516" y="220" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">脂肪垫下移、韧带松弛</text>
  <text x="516" y="238" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">法令纹、木偶纹、下颌缘模糊</text>

  <text x="320" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">三个维度往往同时发生，注射年轻化主要针对后两者</text>
</svg>