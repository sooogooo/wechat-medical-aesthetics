  <text x="64" y="326" class="small">家族聚集</text>

  <rect x="278" y="266" width="210" height="76" rx="12" fill="#f4f7f1" stroke="#7A8B6F"/>
  <rect x="278" y="266" width="210" height="24" rx="12" fill="#7A8B6F"/>
  <rect x="278" y="280" width="210" height="10" fill="#7A8B6F"/>
