<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="肉毒不自然的原因">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">“僵”通常来自这三个原因</text>

  <rect x="30" y="60" width="185" height="180" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <circle cx="60" cy="95" r="14" fill="#b5654a"/>
  <text x="60" y="99" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#ffffff">1</text>
  <text x="125" y="99" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#2b2a28">过量</text>
  <text x="45" y="130" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">剂量超过肌肉需要</text>
  <text x="45" y="150" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">肌肉过度放松</text>
  <text x="45" y="170" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">表情&quot;卡住&quot;</text>
  <text x="45" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">眉头下垂、眼睑下垂</text>

  <rect x="227" y="60" width="185" height="180" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <circle cx="257" cy="95" r="14" fill="#b5654a"/>
  <text x="257" y="99" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#ffffff">2</text>
  <text x="322" y="99" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#2b2a28">部位不准</text>
  <text x="242" y="130" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">没打到目标肌肉</text>
  <text x="242" y="150" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">或打了不该打的</text>
  <text x="242" y="170" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">不对称</text>
  <text x="242" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">笑容歪斜、眉形异常</text>

  <rect x="424" y="60" width="185" height="180" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <circle cx="454" cy="95" r="14" fill="#b5654a"/>
  <text x="454" y="99" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#ffffff">3</text>
  <text x="519" y="99" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#2b2a28">扩散</text>
  <text x="439" y="130" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">肉毒扩散到邻近</text>
  <text x="439" y="150" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">非目标肌肉</text>
  <text x="439" y="170" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">影响未打部位</text>
  <text x="439" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">复视、口角歪</text>

  <text x="320" y="262" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">这三个原因都与操作者的解剖功底和剂量控制直接相关</text>
</svg>