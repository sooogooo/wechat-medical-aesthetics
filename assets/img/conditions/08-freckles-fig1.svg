<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t08f1 d08f1">
  <title id="t08f1">雀斑与相似小褐斑鉴别</title>
  <desc id="d08f1">雀斑有遗传倾向，需与褐青色痣日光性黑子等区分</desc>
  <defs>
    <linearGradient id="bg08f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh08f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg08f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh08f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 08</text>
  <text x="56" y="90" class="title">长得像雀斑的东西不少</text>
  <text x="56" y="116" class="kicker">雀斑常有遗传倾向，夏深冬浅是其特点</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">四种相似小褐斑对照</text>

  <rect x="56" y="174" width="335" height="90" rx="10" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="335" height="28" rx="10" fill="#7A8B6F"/><rect x="56" y="192" width="335" height="10" fill="#7A8B6F"/>
  <text x="72" y="193" class="tag">雀斑</text>
  <text x="72" y="224" class="body">童年后出现 面部为主</text>
  <text x="72" y="246" class="small">夏深冬浅 有遗传倾向 本身无害</text>

  <rect x="409" y="174" width="335" height="90" rx="10" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="409" y="174" width="335" height="28" rx="10" fill="#C9A876"/><rect x="409" y="192" width="335" height="10" fill="#C9A876"/>
  <text x="425" y="193" class="tag">日光性黑子</text>
  <text x="425" y="224" class="body">成年后 日晒部位</text>
  <text x="425" y="246" class="small">边界清楚 不随季节大幅变化</text>

  <rect x="56" y="278" width="335" height="90" rx="10" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6"/>
  <rect x="56" y="278" width="335" height="28" rx="10" fill="#8a6a3a"/><rect x="56" y="296" width="335" height="10" fill="#8a6a3a"/>
  <text x="72" y="297" class="tag">颧部褐青色痣</text>
  <text x="72" y="328" class="body">成年后 双侧颧部</text>
  <text x="72" y="350" class="small">灰褐或蓝灰小斑 真皮深层</text>

  <rect x="409" y="278" width="335" height="90" rx="10" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="409" y="278" width="335" height="28" rx="10" fill="#B5654A"/><rect x="409" y="296" width="335" height="10" fill="#B5654A"/>
  <text x="425" y="297" class="tag">咖啡斑</text>
  <text x="425" y="328" class="body">边界清楚 均匀浅褐</text>
  <text x="425" y="350" class="small">多发需评估 一两块常见</text>

  <rect x="56" y="386" width="688" height="44" rx="10" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4"/>
  <text x="400" y="406" class="body" text-anchor="middle">防晒能减少加深，却不能改写遗传</text>
  <text x="400" y="422" class="small" text-anchor="middle">是否治疗是个人选择，本身无害</text>

  <rect x="56" y="440" width="688" height="22" rx="8" fill="#eef4ee"/>
  <text x="400" y="455" class="quote" text-anchor="middle" font-size="14">这些家庭偏方不要试 点痣水强酸腐蚀风险高</text>
  <text x="56" y="472" class="footer">医学教育示意 · 治疗前先做动机检查与测试点判断皮肤反应</text>
</svg>
