<svg xmlns="http://www.w3.org/2000/svg" aria-label="技术型美学的价值" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">技术型美学的真正价值</text><rect width="180" height="150" x="30" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="120" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">客观参考</text><text x="120" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">减少&quot;凭感觉&quot;</text><text x="120" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">提供讨论基础</text><text x="120" y="170" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">医患有共同语言</text><rect width="180" height="150" x="230" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="320" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">精准可复现</text><text x="320" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不同次治疗</text><text x="320" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">效果更稳定</text><text x="320" y="170" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">降低随机性</text><rect width="180" height="150" x="430" y="60" fill="#fff" stroke="#c9a876" rx="8"/><text x="520" y="88" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">风险识别</text><text x="520" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">识别不对称</text><text x="520" y="138" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">评估骨性基础</text><text x="520" y="170" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">术前模拟</text><text x="320" y="225" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">技术是工具——它的价值在于&quot;让决策更有依据&quot;，而非&quot;取代审美&quot;</text></svg>