<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto" role="img" aria-labelledby="t07a d07a">
  <title id="t07a">注射知识地图</title>
  <desc id="d07a">注射三大逻辑，血管栓塞安全红线，咨询师站位：懂风险不荐剂量</desc>
  <defs>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .grpName{font:700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .grpItem{font:500 10.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .step{font:700 11.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#B5654A;}
      .stepSub{font:500 10px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .pos{font:500 11.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
    </style>
  </defs>
  <rect x="30" y="26" width="740" height="448" rx="10" fill="#ffffff" stroke="#e4ddd2"/>
  <text x="56" y="58" class="series">医美咨询师成长教程 · 阶段2 · 07</text>
  <text x="56" y="90" class="title">注射知识地图 三大逻辑与安全红线</text>
  <text x="56" y="116" class="kicker">所有注射只有三种工作原理——先懂逻辑，再懂风险，最后才是项目名</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>

  <!-- 三大逻辑 -->
  <rect x="56" y="144" width="222" height="104" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.6"/>
  <text x="72" y="170" class="grpName">逻辑一 · 填充</text>
  <text x="72" y="194" class="grpItem">玻尿酸 / 胶原蛋白补容积</text>
  <text x="72" y="212" class="grpItem">泪沟 · 苹果肌 · 法令纹 · 下巴</text>
  <text x="72" y="234" class="grpItem">可溶解 = 相对可逆</text>
  <rect x="290" y="144" width="222" height="104" rx="10" fill="#ffffff" stroke="#C9A876" stroke-width="1.6"/>
  <text x="306" y="170" class="grpName">逻辑二 · 松弛肌肉</text>
  <text x="306" y="194" class="grpItem">肉毒杆菌素放松过度收缩肌肉</text>
  <text x="306" y="212" class="grpItem">动态纹 · 咬肌 · 提升类应用</text>
  <text x="306" y="234" class="grpItem">可代谢 · 需定期维持</text>
  <rect x="524" y="144" width="222" height="104" rx="10" fill="#ffffff" stroke="#A8A39D" stroke-width="1.6"/>
  <text x="540" y="170" class="grpName">逻辑三 · 刺激再生</text>
  <text x="540" y="194" class="grpItem">再生材料诱导自身胶原生成</text>
  <text x="540" y="212" class="grpItem">起效慢 · 维持久</text>
  <text x="540" y="234" class="grpItem">不可溶解 = 风险特征不同</text>

  <!-- 安全红线 -->
  <rect x="56" y="262" width="690" height="88" rx="10" fill="#ffffff" stroke="#B5654A" stroke-width="1.8"/>
  <text x="76" y="288" class="grpName" fill="#B5654A">安全红线 · 血管栓塞是最高危事件（必须条件反射）</text>
  <rect x="76" y="300" width="150" height="38" rx="8" fill="#ffffff" stroke="#d9b3a6" stroke-width="1.2"/>
  <text x="151" y="317" class="step" text-anchor="middle">① 为什么危险</text>
  <text x="151" y="332" class="stepSub" text-anchor="middle">面部血管与眼部交通</text>
  <path d="M230 319 L246 319 M240 314 L250 319 L240 324" stroke="#B5654A" stroke-width="1.6" fill="none"/>
  <rect x="252" y="300" width="180" height="38" rx="8" fill="#ffffff" stroke="#d9b3a6" stroke-width="1.2"/>
  <text x="342" y="317" class="step" text-anchor="middle">② 识别信号</text>
  <text x="342" y="332" class="stepSub" text-anchor="middle">剧痛 · 皮肤发白发紫 · 视力异常</text>
  <path d="M436 319 L452 319 M446 314 L456 319 L446 324" stroke="#B5654A" stroke-width="1.6" fill="none"/>
  <rect x="458" y="300" width="270" height="38" rx="8" fill="#ffffff" stroke="#d9b3a6" stroke-width="1.2"/>
  <text x="593" y="317" class="step" text-anchor="middle">③ 咨询师第一动作</text>
  <text x="593" y="332" class="stepSub" text-anchor="middle">立即停止注射 · 第一时间找医生（不是我判断要不要紧）</text>

  <!-- 咨询师站位 -->
  <rect x="56" y="364" width="690" height="84" rx="10" fill="#ffffff" stroke="#7A8B6F" stroke-width="1.6"/>
  <text x="76" y="390" class="grpName" fill="#7A8B6F">咨询师站位：懂风险，不荐剂量</text>
  <text x="76" y="414" class="pos">✓ 三件事：备好问医生的问题清单（病史/既往注射/期望预算）· 传递"选医生重于选材料" · 懂何时该劝停</text>
  <text x="76" y="436" class="pos">✕ 三个不做：不推荐剂量（打几支是医生的话）· 不比较品牌"哪个最好" · 不替客人决定"今天就打"</text>

  <text x="56" y="466" class="footer">教材：《美容注射的艺术科普系列》15 篇精读 · MD Codes 章节留到阶段 3</text>
</svg>
