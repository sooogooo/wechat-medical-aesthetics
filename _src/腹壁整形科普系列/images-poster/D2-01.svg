      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · D2</text>
  <text x="62" y="112" class="title">面诊必问的 12 个问题</text>
  <text x="62" y="148" class="kicker">按颜色分组，术式、联合与预期、风险与资质、费用</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>

  <circle cx="67" cy="204" r="5" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="80" y="209" class="small">问题与术式</text>
  <circle cx="267" cy="204" r="5" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="280" y="209" class="small">联合与预期</text>
  <circle cx="467" cy="204" r="5" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="480" y="209" class="small">风险与资质</text>
  <circle cx="667" cy="204" r="5" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="680" y="209" class="small">费用</text>

  <rect x="62" y="238" width="250" height="52" rx="9" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="92" cy="264" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="92" y="269" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#0072B2" text-anchor="middle">1</text>
  <text x="118" y="269" class="body">我的问题属于哪类</text>

  <rect x="324" y="238" width="250" height="52" rx="9" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="354" cy="264" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="354" y="269" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#0072B2" text-anchor="middle">2</text>
  <text x="380" y="269" class="body">建议哪种术式、为何</text>

  <rect x="586" y="238" width="250" height="52" rx="9" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="616" cy="264" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="616" y="269" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#0072B2" text-anchor="middle">3</text>
  <text x="642" y="269" class="body">切口从哪到哪</text>

  <rect x="62" y="300" width="250" height="52" rx="9" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <circle cx="92" cy="326" r="13" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="92" y="331" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#0072B2" text-anchor="middle">4</text>
  <text x="118" y="331" class="body">肌分离是否收紧</text>

  <rect x="324" y="300" width="250" height="52" rx="9" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <circle cx="354" cy="326" r="13" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="354" y="331" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#D9930D" text-anchor="middle">5</text>
  <text x="380" y="331" class="body">要不要联合吸脂</text>

  <rect x="586" y="300" width="250" height="52" rx="9" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <circle cx="616" cy="326" r="13" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="616" y="331" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#D9930D" text-anchor="middle">6</text>
  <text x="642" y="331" class="body">手术时长与住院</text>

  <rect x="62" y="362" width="250" height="52" rx="9" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <circle cx="92" cy="388" r="13" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="92" y="393" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#D9930D" text-anchor="middle">7</text>
  <text x="118" y="393" class="body">效果边界与定型</text>

  <rect x="324" y="362" width="250" height="52" rx="9" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="354" cy="388" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="354" y="393" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#C75B00" text-anchor="middle">8</text>
  <text x="380" y="393" class="body">麻醉、血库、通道</text>

  <rect x="586" y="362" width="250" height="52" rx="9" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="616" cy="388" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="616" y="393" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#C75B00" text-anchor="middle">9</text>
  <text x="642" y="393" class="body">血栓预防方案</text>

  <rect x="62" y="424" width="250" height="52" rx="9" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="92" cy="450" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="92" y="455" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#C75B00" text-anchor="middle">10</text>
  <text x="118" y="455" class="body">我的个人风险</text>

  <rect x="324" y="424" width="250" height="52" rx="9" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <circle cx="354" cy="450" r="13" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="354" y="455" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#C75B00" text-anchor="middle">11</text>
  <text x="380" y="455" class="body">主刀资质与经验</text>

  <rect x="586" y="424" width="250" height="52" rx="9" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <circle cx="616" cy="450" r="13" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="616" y="455" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" style="fill:#0B8A6B" text-anchor="middle">12</text>
  <text x="642" y="455" class="body">总费用包含什么</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">被回避的问题，往往就是风险所在</text>
  <text x="62" y="580" class="footer">医学教育示意 · 资质请通过卫健委官方渠道核验</text>
