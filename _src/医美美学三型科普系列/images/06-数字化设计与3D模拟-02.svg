<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="模拟与现实的差距">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">为什么&quot;模拟&quot;不等于&quot;结果&quot;</text>

  <rect x="30" y="60" width="580" height="55" rx="6" fill="#f7ece6" stroke="#b5654a"/>
  <text x="320" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">软件预测的局限</text>
  <text x="320" y="103" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">组织愈合、肿胀消退、材料特性、个体反应，软件无法完全模拟</text>

  <rect x="30" y="125" width="580" height="55" rx="6" fill="#f7ece6" stroke="#b5654a"/>
  <text x="320" y="150" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">模拟的&quot;美化倾向&quot;</text>
  <text x="320" y="168" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">部分机构的模拟图倾向&quot;理想化&quot;，诱导决策，实际效果可能不如模拟</text>

  <rect x="30" y="190" width="580" height="50" rx="6" fill="#f4ede0" stroke="#c9a876"/>
  <text x="320" y="215" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">核心认知</text>
  <text x="320" y="232" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">模拟是&quot;参考预览&quot;，不是&quot;效果保证&quot;——任何机构用模拟承诺&quot;做完就这样&quot;都不可信</text>
</svg>