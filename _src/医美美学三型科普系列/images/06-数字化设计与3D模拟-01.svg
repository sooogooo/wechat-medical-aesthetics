<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="数字化医美工具的能力">
  <rect width="640" height="300" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">数字化工具的真实能力</text>

  <rect x="30" y="60" width="185" height="210" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="122" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">3D 成像</text>
  <text x="45" y="118" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 面部三维扫描</text>
  <text x="45" y="138" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 量化不对称</text>
  <text x="45" y="158" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 测量容积</text>
  <text x="45" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">提供客观数据</text>

  <rect x="227" y="60" width="185" height="210" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">术前模拟</text>
  <text x="242" y="118" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 模拟术后效果</text>
  <text x="242" y="138" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 多方案对比</text>
  <text x="242" y="158" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 直观沟通</text>
  <text x="242" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">辅助决策</text>

  <rect x="424" y="60" width="185" height="210" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="516" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">AI 分析</text>
  <text x="439" y="118" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 自动识别特征</text>
  <text x="439" y="138" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 输出&quot;评分&quot;</text>
  <text x="439" y="158" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 推荐项目</text>
  <text x="439" y="195" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">⚠ 最需警惕</text>

  <text x="320" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">这些工具有用，但都不是&quot;客观真理&quot;——它们的价值取决于使用者</text>
</svg>