<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2002 desc2002" role="img" viewBox="0 0 900 620"><title id="title2002">注射隆鼻的血管栓塞机制</title><desc id="desc2002">面部血管丰富且与眼动脉、颅内血管有交通，注射误入血管可致皮肤坏死、失明、脑栓塞</desc><defs><linearGradient id="bg2002" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2002" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.warn{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#d55e00}</style></defs><rect width="900" height="620" fill="url(#bg2002)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2002)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 20</text><text x="62" y="117" class="title">最被低估的风险：血管栓塞</text><text x="62" y="153" class="kicker">面部血管与眼动脉、颅内血管有交通——打一针看似简单，实则考验解剖功底</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">栓塞如何发生与后果</text><rect width="180" height="135" x="62" y="230" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="12"/><circle cx="100" cy="262" r="18" fill="#E69F00"/><text x="100" y="269" class="small" text-anchor="middle" style="fill:#fff;font-weight:700">1</text><text x="152" y="262" class="nodeTitle" text-anchor="middle" style="font-size:16px">误入血管</text><text x="152" y="295" class="small" text-anchor="middle">注射材料</text><text x="152" y="315" class="small" text-anchor="middle">进入面部血管</text><text x="152" y="345" class="small" text-anchor="middle" style="fill:#d55e00">与解剖知识相关</text><path stroke="#7d8e93" stroke-width="2" d="M 242 297 L 260 297"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 254 291 L 260 297 L 254 303"/><rect width="180" height="135" x="260" y="230" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="12"/><circle cx="298" cy="262" r="18" fill="#E69F00"/><text x="298" y="269" class="small" text-anchor="middle" style="fill:#fff;font-weight:700">2</text><text x="350" y="262" class="nodeTitle" text-anchor="middle" style="font-size:16px">血管交通</text><text x="350" y="295" class="small" text-anchor="middle">可逆流至眼动脉</text><text x="350" y="315" class="small" text-anchor="middle">或颅内血管</text><text x="350" y="345" class="small" text-anchor="middle" style="fill:#d55e00">鼻部、眉间尤甚</text><path stroke="#7d8e93" stroke-width="2" d="M 440 297 L 458 297"/><path fill="none" stroke="#7d8e93" stroke-width="2" d="M 452 291 L 458 297 L 452 303"/><rect width="380" height="135" x="458" y="230" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="12"/><circle cx="496" cy="262" r="18" fill="#D55E00"/><text x="496" y="269" class="small" text-anchor="middle" style="fill:#fff;font-weight:700">3</text><text x="528" y="262" class="warn">三种严重后果</text><circle cx="478" cy="295" r="4" fill="#D55E00"/><text x="492" y="300" class="body">皮肤坏死：栓塞区缺血，可能留永久疤痕</text><circle cx="478" cy="325" r="4" fill="#D55E00"/><text x="492" y="330" class="body">失明：逆流至眼动脉，多数不可逆</text><circle cx="478" cy="352" r="4" fill="#D55E00"/><text x="492" y="357" class="small">脑栓塞：极罕见但可能致命</text><rect width="776" height="115" x="62" y="385" fill="#f8fbfb" stroke="#0072B2" stroke-width="1.5" rx="12"/><text x="82" y="412" class="nodeTitle" style="fill:#0072b2">透明质酸酶不是万能后悔药</text><text x="82" y="438" class="body">· 透明质酸类材料出现栓塞时，及时使用透明质酸酶可能挽救</text><text x="82" y="460" class="body">· 但使用有时机要求，且不是所有注射材料都能用酶解</text><text x="82" y="484" class="small">能否及时得到有经验医生的处理，直接影响后果——选择机构要确认具备急救条件</text><rect width="776" height="40" x="62" y="515" fill="#fdf1ee" rx="12"/><text x="450" y="541" class="quote" text-anchor="middle">打一针看似简单，恰恰是最考验解剖功底的操作之一</text><text x="62" y="582" class="footer">医学教育示意 · 图示为机制示意，非教学图 · 须在正规医疗机构由具备资质的医师操作</text></svg>