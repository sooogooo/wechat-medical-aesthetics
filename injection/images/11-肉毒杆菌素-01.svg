<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="肉毒杆菌素作用机制示意">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">肉毒如何让肌肉放松</text>

  <!-- 左：正常 -->
  <rect x="40" y="60" width="260" height="230" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="170" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">正常状态</text>
  <!-- 神经 -->
  <rect x="120" y="110" width="100" height="20" rx="4" fill="#7a8b6f"/>
  <text x="170" y="124" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#ffffff">神经末梢</text>
  <!-- 乙酰胆碱囊泡 -->
  <circle cx="140" cy="150" r="5" fill="#c9a876"/>
  <circle cx="160" cy="152" r="5" fill="#c9a876"/>
  <circle cx="180" cy="150" r="5" fill="#c9a876"/>
  <text x="245" y="154" font-family="PingFang SC,sans-serif" font-size="9" fill="#8a7340">乙酰胆碱释放</text>
  <!-- 肌肉（收缩） -->
  <rect x="100" y="180" width="140" height="40" rx="6" fill="#b5654a"/>
  <text x="170" y="204" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#ffffff">肌肉收缩 → 皱纹出现</text>
  <text x="170" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">神经信号传导 → 肌肉动</text>

  <!-- 箭头 -->
  <polygon points="320,175 340,165 340,185" fill="#a8a39d"/>
  <text x="320" y="155" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">注射肉毒</text>

  <!-- 右：注射后 -->
  <rect x="350" y="60" width="260" height="230" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="480" y="85" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">注射肉毒后</text>
  <rect x="430" y="110" width="100" height="20" rx="4" fill="#7a8b6f" opacity="0.6"/>
  <text x="480" y="124" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#ffffff">神经末梢</text>
  <!-- 被阻断的囊泡 -->
  <line x1="430" y1="150" x2="530" y2="150" stroke="#b5654a" stroke-width="2"/>
  <circle cx="450" cy="150" r="5" fill="#c9a876" opacity="0.3"/>
  <circle cx="470" cy="152" r="5" fill="#c9a876" opacity="0.3"/>
  <text x="555" y="154" font-family="PingFang SC,sans-serif" font-size="9" fill="#b5654a">释放被阻断</text>
  <!-- 肌肉放松 -->
  <rect x="410" y="180" width="140" height="40" rx="6" fill="#7a8b6f"/>
  <text x="480" y="204" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#ffffff">肌肉放松 → 皱纹减轻</text>
  <text x="480" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">信号被阻断 → 肌肉不动</text>

  <text x="320" y="310" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">机制示意；效果在注射后数天到两周渐进出现，维持 3–6 个月</text>
</svg>