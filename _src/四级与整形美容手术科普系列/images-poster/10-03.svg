<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1003 desc1003" role="img" viewBox="0 0 900 620"><title id="title1003">颌面四级手术机构的硬门槛</title><desc id="desc1003">资质、麻醉、血备、术后监护、转诊通道五项硬门槛，缺一不应开展</desc><defs><linearGradient id="bg1003" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1003" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.num{font:700 24px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg1003)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1003)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 10</text><text x="62" y="117" class="title">颌面四级手术机构的硬门槛</text><text x="62" y="153" class="kicker">急救能力应放在和主刀技术同等甚至更高的位置</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">五项硬门槛 · 缺一不应开展</text><rect width="148" height="240" x="62" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="136" cy="268" r="20" fill="#0072B2"/><text x="136" y="276" class="num" font-size="20" text-anchor="middle">1</text><text x="136" y="308" class="nodeTitle" font-size="16" text-anchor="middle">机构资质</text><text x="136" y="338" class="body" text-anchor="middle">执业许可证</text><text x="136" y="360" class="body" text-anchor="middle">核准四级手术</text><text x="136" y="382" class="body" text-anchor="middle">主刀医师</text><text x="136" y="404" class="body" text-anchor="middle">具备权限</text><rect width="120" height="34" x="76" y="424" fill="#eef6f8" rx="6"/><text x="136" y="445" class="small" text-anchor="middle">门诊部一般</text><text x="136" y="475" class="small" text-anchor="middle">不核准四级</text><rect width="148" height="240" x="220" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="294" cy="268" r="20" fill="#E69F00"/><text x="294" y="276" class="num" font-size="20" text-anchor="middle">2</text><text x="294" y="308" class="nodeTitle" font-size="16" text-anchor="middle">麻醉科</text><text x="294" y="338" class="body" text-anchor="middle">常驻麻醉</text><text x="294" y="360" class="body" text-anchor="middle">医生（非外请）</text><text x="294" y="382" class="body" text-anchor="middle">全程监护</text><text x="294" y="404" class="body" text-anchor="middle">全麻保障</text><rect width="120" height="34" x="234" y="424" fill="#fdf3e3" rx="6"/><text x="294" y="445" class="small" text-anchor="middle">全麻本身</text><text x="294" y="475" class="small" text-anchor="middle">即有风险</text><rect width="148" height="240" x="378" y="232" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="14"/><circle cx="452" cy="268" r="20" fill="#D55E00"/><text x="452" y="276" class="num" font-size="20" text-anchor="middle">3</text><text x="452" y="308" class="nodeTitle" font-size="16" text-anchor="middle">血备/输血</text><text x="452" y="338" class="body" text-anchor="middle">血库或</text><text x="452" y="360" class="body" text-anchor="middle">可靠备血渠道</text><text x="452" y="382" class="body" text-anchor="middle">大出血可输血</text><text x="452" y="404" class="body" text-anchor="middle">止血设备</text><rect width="120" height="34" x="392" y="424" fill="#fbeae3" rx="6"/><text x="452" y="445" class="small" text-anchor="middle">颌面血供</text><text x="452" y="475" class="small" text-anchor="middle">丰富</text><rect width="148" height="240" x="536" y="232" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><circle cx="610" cy="268" r="20" fill="#E69F00"/><text x="610" y="276" class="num" font-size="20" text-anchor="middle">4</text><text x="610" y="308" class="nodeTitle" font-size="16" text-anchor="middle">术后监护</text><text x="610" y="338" class="body" text-anchor="middle">住院观察</text><text x="610" y="360" class="body" text-anchor="middle">气道管理</text><text x="610" y="382" class="body" text-anchor="middle">非观察几小时</text><text x="610" y="404" class="body" text-anchor="middle">就走</text><rect width="120" height="34" x="550" y="424" fill="#fdf3e3" rx="6"/><text x="610" y="445" class="small" text-anchor="middle">&quot;当天回家&quot;</text><text x="610" y="475" class="small" text-anchor="middle">＝危险信号</text><rect width="144" height="240" x="694" y="232" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><circle cx="766" cy="268" r="20" fill="#0072B2"/><text x="766" y="276" class="num" font-size="20" text-anchor="middle">5</text><text x="766" y="308" class="nodeTitle" font-size="16" text-anchor="middle">转诊通道</text><text x="766" y="338" class="body" text-anchor="middle">绿色通道</text><text x="766" y="360" class="body" text-anchor="middle">最近有抢救</text><text x="766" y="382" class="body" text-anchor="middle">能力的医院</text><text x="766" y="404" class="body" text-anchor="middle">转诊协议</text><rect width="116" height="34" x="708" y="424" fill="#eef6f8" rx="6"/><text x="766" y="445" class="small" text-anchor="middle">出事能快速</text><text x="766" y="475" class="small" text-anchor="middle">转送抢救</text><rect width="776" height="40" x="62" y="525" fill="#fdf1ee" rx="12"/><text x="450" y="551" fill="#17323d" class="quote" text-anchor="middle">把&quot;急救能力&quot;放在和&quot;主刀技术&quot;同等甚至更高的位置考量</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 颌面四级手术须在有相应资质、具备急救能力的机构开展</text></svg>