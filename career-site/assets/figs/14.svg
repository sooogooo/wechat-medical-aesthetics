<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5f6e54"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#5f6e54"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">被高估的机会与被低估的代价</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">每条都标了证据强度</text>

  <rect x="60" y="116" width="310" height="250" rx="8" fill="#edf0ea" stroke="#e4ddd2" stroke-width="1.4"/>
  <text x="215" y="146" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#5f6e54" font-weight="600" text-anchor="middle">机会四条</text>
  <text x="80" y="178" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">翻译者缺口（买方稀少）</text>
  <text x="80" y="208" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">公立窗口（待核实）</text>
  <text x="80" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">表达者红利</text>
  <text x="80" y="268" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">AI 窗口（宽度待核验）</text>
  <text x="80" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">真实，但多数带但字</text>
  <rect x="430" y="116" width="310" height="250" rx="8" fill="#fff" stroke="#e4ddd2" stroke-width="1.4"/>
  <text x="585" y="146" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#2b2a28" font-weight="600" text-anchor="middle">代价四条</text>
  <text x="450" y="178" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">职业声望折价</text>
  <text x="450" y="208" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">薪酬结构落差</text>
  <text x="450" y="238" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">以为看懂了的风险加倍</text>
  <text x="450" y="268" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#2b2a28">天花板是结构性的</text>
  <text x="585" y="330" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d" text-anchor="middle">全部成立，且互相叠加计息</text>
  <text x="400" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#5f6e54" font-weight="600" text-anchor="middle">名校牌买不到行业信用，只能买到一个月的耐心</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">最优策略，不带救世主心态来，带学生心态来</text>
</svg>