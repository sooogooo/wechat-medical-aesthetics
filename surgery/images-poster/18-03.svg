<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1803 desc1803">
  <title id="title1803">鼻修复：何时该停下来</title>
  <desc id="desc1803">反复修复多次、组织条件极差时，不再手术可能比继续修更明智</desc>
  <defs>
    <linearGradient id="bg1803" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1803" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1803)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1803)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 18</text>
  <text x="62" y="117" class="title">有些时候，不再手术更明智</text>
  <text x="62" y="153" class="kicker">修复的目标是解决具体问题，不是做到完美</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：建议暂缓或谨慎的情况 -->
  <text x="62" y="216" class="nodeTitle">建议暂缓或谨慎的情况</text>
  <rect x="62" y="230" width="400" height="270" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>

  <circle cx="88" cy="265" r="5" fill="#E69F00"/>
  <text x="106" y="270" class="body">对修复效果抱有做到完美期待</text>

  <circle cx="88" cy="300" r="5" fill="#E69F00"/>
  <text x="106" y="305" class="body">前次手术时间尚短</text>
  <text x="106" y="324" class="small">建议术后至少半年到一年，等组织稳定</text>

  <circle cx="88" cy="355" r="5" fill="#E69F00"/>
  <text x="106" y="360" class="body">心理状态不稳</text>
  <text x="106" y="379" class="small">仍在前次失败的强烈情绪中</text>

  <circle cx="88" cy="410" r="5" fill="#D55E00"/>
  <text x="106" y="415" class="body" style="fill:#D55E00">反复修复已经多次</text>
  <text x="106" y="434" class="small">组织条件极差者</text>
  <rect x="106" y="450" width="336" height="32" rx="6" fill="#fbeae3"/>
  <text x="274" y="471" class="small" text-anchor="middle">此时不再手术，可能比继续修更明智</text>

  <!-- 右：合理的修复目标 -->
  <text x="490" y="216" class="nodeTitle">合理的修复目标</text>
  <rect x="490" y="230" width="348" height="270" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>

  <circle cx="516" cy="265" r="14" fill="#0072B2"/>
  <text x="516" y="270" class="small" text-anchor="middle" style="fill:#ffffff;font-weight:700">功能</text>
  <text x="540" y="270" class="body">呼吸不畅、鼻塞（强适应证）</text>

  <circle cx="516" cy="305" r="14" fill="#0072B2"/>
  <text x="516" y="310" class="small" text-anchor="middle" style="fill:#ffffff;font-weight:700">并发</text>
  <text x="540" y="310" class="body">假体穿出、感染、移位</text>

  <circle cx="516" cy="345" r="14" fill="#E69F00"/>
  <text x="516" y="350" class="small" text-anchor="middle" style="fill:#ffffff;font-weight:700">外观</text>
  <text x="540" y="350" class="body">明显歪斜、过宽、不自然</text>

  <circle cx="516" cy="385" r="14" fill="#5c6c72"/>
  <text x="516" y="390" class="small" text-anchor="middle" style="fill:#ffffff;font-weight:700">轻微</text>
  <text x="540" y="390" class="body">轻微不满意：诚实评估值不值</text>
  <text x="540" y="410" class="small">有时不值得承担修复风险</text>

  <rect x="510" y="440" width="308" height="42" rx="8" fill="#eef6f8"/>
  <text x="664" y="460" class="small" text-anchor="middle">承诺修复一次完美、保证不再出问题</text>
  <text x="664" y="476" class="small" text-anchor="middle">的机构，恰恰把你推向反复修复</text>

  <!-- 金句 -->
  <rect x="62" y="515" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="541" class="quote" text-anchor="middle">有时不再手术，比继续修更明智</text>

  <text x="62" y="582" class="footer">医学教育示意 · 修复须由有丰富经验的医师评估 · 复杂重建可达三级／四级</text>
</svg>
