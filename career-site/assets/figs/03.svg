="341" fill="#b5654a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">最苦 · 2 亿营收利润 600 万已是赢家</text><text x="90" y="396" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">你的岗位大概率在这一层</text><line x1="220" x2="220" y1="376" y2="100" stroke="#e4ddd2" stroke-dasharray="3 3" stroke-width="1.4"/><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">过去十几年，行业赚的主要是信息差和渠道的钱</text></svg>