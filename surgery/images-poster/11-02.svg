<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1102 desc1102" role="img" viewBox="0 0 900 620"><title id="title1102">腹壁成形术必须正视的风险</title><desc id="desc1102">腹壁成形术是四级手术，列出出血血肿、皮瓣坏死、血栓栓塞等关键风险</desc><defs><linearGradient id="bg1102" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1102" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.warn{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#d55e00}</style></defs><rect width="900" height="620" fill="url(#bg1102)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1102)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 11</text><text x="62" y="117" class="title">腹壁成形术：四级手术的风险清单</text><text x="62" y="153" class="kicker">创伤大、恢复长——这些风险必须在术前正视</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="776" height="48" x="62" y="205" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5" rx="10"/><rect width="8" height="48" x="62" y="205" fill="#D55E00" rx="4"/><text x="86" y="234" class="nodeTitle">出血与血肿</text><text x="280" y="234" class="body">腹部皮瓣血供丰富，需具备输血条件</text><rect width="776" height="48" x="62" y="261" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5" rx="10"/><rect width="8" height="48" x="62" y="261" fill="#D55E00" rx="4"/><text x="86" y="290" class="nodeTitle">皮瓣坏死与愈合不良</text><text x="320" y="290" class="body">中央下缘尤甚，吸烟、糖尿病者风险更高</text><rect width="776" height="48" x="62" y="317" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5" rx="10"/><rect width="8" height="48" x="62" y="317" fill="#E69F00" rx="4"/><text x="86" y="346" class="nodeTitle">感染与血清肿</text><text x="280" y="346" class="body">皮下剥离范围大，积液与感染风险存在</text><rect width="776" height="48" x="62" y="373" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="10"/><rect width="8" height="48" x="62" y="373" fill="#D55E00" rx="4"/><text x="86" y="402" class="nodeTitle">深静脉血栓与肺栓塞</text><text x="340" y="402" class="warn">需严肃对待 · 早期活动／抗凝／弹力袜预防</text><rect width="776" height="48" x="62" y="429" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5" rx="10"/><rect width="8" height="48" x="62" y="429" fill="#E69F00" rx="4"/><text x="86" y="458" class="nodeTitle">瘢痕与轮廓不平整</text><text x="320" y="458" class="body">下腹横行长疤，可能增生变宽，脐周亦有疤</text><rect width="776" height="36" x="62" y="488" fill="#eef6f8" rx="8"/><text x="450" y="511" class="small" text-anchor="middle">另有：感觉改变 · 麻醉相关风险 · 腹壁不对称 · 血清肿</text><rect width="776" height="40" x="62" y="530" fill="#fbeae3" rx="12"/><text x="450" y="556" class="quote" text-anchor="middle">把它当成大号抽脂，是腹壁成形最常见的误解</text><text x="62" y="582" class="footer">医学教育示意 · 风险发生率因人而异 · 须在有四级资质的医疗机构开展</text></svg>