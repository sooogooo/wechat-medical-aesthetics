<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t19 d19" role="img" viewBox="0 0 800 500"><title id="t19">毛囊炎护理三件事</title><desc id="d19">把闷、磨、刮三个刺激因素降下来</desc><defs><linearGradient id="bg19" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh19" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.num{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg19)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh19)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 19</text><text x="48" y="92" class="title">毛囊炎护理三件事</text><text x="48" y="116" class="kicker">把闷、磨、刮三个刺激因素降下来</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">减少毛囊被反复激惹的入口</text><circle cx="74" cy="208" r="13" fill="#7A8B6F"/><text x="74" y="213" class="num" text-anchor="middle">1</text><text x="98" y="213" class="body">保持透气：运动后及时换下汗湿衣物，避免紧身化纤</text><circle cx="74" cy="250" r="13" fill="#7A8B6F"/><text x="74" y="255" class="num" text-anchor="middle">2</text><text x="98" y="255" class="body">减少摩擦：剃毛顺毛向、单层剃须泡沫，钝刀片及时换</text><circle cx="74" cy="292" r="13" fill="#C9A876"/><text x="74" y="297" class="num" text-anchor="middle">3</text><text x="98" y="297" class="body">避免闷堵：油性外用产品、厚重遮盖先暂停一段时间</text><circle cx="74" cy="334" r="13" fill="#B5654A"/><text x="74" y="339" class="num" text-anchor="middle">4</text><text x="98" y="339" class="body">用药对类型：细菌与真菌方向不同，勿自行长期涂激素</text><rect width="704" height="40" x="48" y="372" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="397" class="quote" text-anchor="middle">反复不等于身体“湿气重”，先查毛囊为什么被激惹</text><text x="48" y="462" class="footer">家庭护理示意 · 脓疱增大、发热或扩散应就医，不自行挤压</text></svg>