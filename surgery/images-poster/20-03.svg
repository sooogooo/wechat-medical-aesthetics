<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title2003 desc2003" role="img" viewBox="0 0 900 620"><title id="title2003">注射鼻整形的危险信号</title><desc id="desc2003">非医疗机构注射、操作者非医师、材料来源不明、承诺零风险等都应直接拒绝</desc><defs><linearGradient id="bg2003" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh2003" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.danger{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#d55e00}</style></defs><rect width="900" height="620" fill="url(#bg2003)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh2003)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 20</text><text x="62" y="117" class="title">这些信号出现，应直接拒绝</text><text x="62" y="153" class="kicker">不是省钱的问题——是在拿视力和皮肤冒险</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="776" height="52" x="62" y="205" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="10"/><rect width="8" height="52" x="62" y="205" fill="#D55E00" rx="4"/><circle cx="100" cy="231" r="16" fill="#D55E00"/><text x="100" y="237" class="small" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:18px">!</text><text x="130" y="227" class="danger">在非医疗机构注射</text><text x="130" y="248" class="small">美容院、工作室、私人会所——这是非法行为，出问题没有保障</text><rect width="776" height="52" x="62" y="265" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="10"/><rect width="8" height="52" x="62" y="265" fill="#D55E00" rx="4"/><circle cx="100" cy="291" r="16" fill="#D55E00"/><text x="100" y="297" class="small" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:18px">!</text><text x="130" y="287" class="danger">操作者不是医师，或无相关执业范围</text><text x="130" y="308" class="small">注射属医疗美容操作，须由具备资质的医师进行</text><rect width="776" height="52" x="62" y="325" fill="#fdf1ee" stroke="#D55E00" stroke-width="2" rx="10"/><rect width="8" height="52" x="62" y="325" fill="#D55E00" rx="4"/><circle cx="100" cy="351" r="16" fill="#D55E00"/><text x="100" y="357" class="small" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:18px">!</text><text x="130" y="347" class="danger">不说明材料品牌批号，或使用水货</text><text x="130" y="368" class="small">合法产品应有可追溯批号——来源不明、廉价的要拒绝</text><rect width="776" height="52" x="62" y="385" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="10"/><rect width="8" height="52" x="62" y="385" fill="#E69F00" rx="4"/><circle cx="100" cy="411" r="16" fill="#E69F00"/><text x="100" y="417" class="small" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:18px">!</text><text x="130" y="407" class="danger">承诺零风险、一针成型永久</text><text x="130" y="428" class="small">任何医疗操作都有风险，零风险承诺本身就是欺骗</text><rect width="776" height="52" x="62" y="445" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="10"/><rect width="8" height="52" x="62" y="445" fill="#E69F00" rx="4"/><circle cx="100" cy="471" r="16" fill="#E69F00"/><text x="100" y="477" class="small" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:18px">!</text><text x="130" y="467" class="danger">没有急救药品和应急流程</text><text x="130" y="488" class="small">应具备透明质酸酶等急救条件——打完就走的机构要警惕</text><rect width="776" height="40" x="62" y="510" fill="#fdf1ee" rx="12"/><text x="450" y="536" class="quote" text-anchor="middle">工作室、上门注射、熟人介绍打一针——都应直接拒绝</text><text x="62" y="572" class="footer">医学教育示意 · 注射填充属医疗美容操作 · 须在正规医疗机构由具备资质的医师开展</text></svg>