<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t42f2 d42f2">
  <title id="t42f2">痘坑治疗路径与预期管理</title>
  <desc id="d42f2">从控痘到分型到联合治疗的路径与合理预期</desc>
  <defs>
    <linearGradient id="bg42f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh42f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .step { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg42f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh42f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 42</text>
  <text x="52" y="92" class="title">治疗路径与合理预期</text>
  <text x="52" y="116" class="kicker">痘坑是瘢痕，改善是渐进而非消除</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <text x="52" y="162" class="nodeTitle">四步路径</text>

  <!-- 4 步横向 -->
  <rect x="52" y="178" width="160" height="92" rx="12" fill="#7A8B6F"/>
  <text x="132" y="206" class="step" text-anchor="middle">1 控制活动痘</text>
  <text x="132" y="230" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">先稳定炎症</text>
  <text x="132" y="250" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">否则边治边长</text>

  <rect x="232" y="178" width="160" height="92" rx="12" fill="#7A8B6F"/>
  <text x="312" y="206" class="step" text-anchor="middle">2 分型评估</text>
  <text x="312" y="230" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">看清是哪型</text>
  <text x="312" y="250" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">可能混合存在</text>

  <rect x="412" y="178" width="160" height="92" rx="12" fill="#C9A876"/>
  <text x="492" y="206" class="step" text-anchor="middle">3 联合治疗</text>
  <text x="492" y="230" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">单一手段有限</text>
  <text x="492" y="250" class="step" text-anchor="middle" font-size="12" fill="#fbf5ea">分次分型推进</text>

  <rect x="592" y="178" width="156" height="92" rx="12" fill="#5F6E54"/>
  <text x="670" y="206" class="step" text-anchor="middle">4 维护防晒</text>
  <text x="670" y="230" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">避免色沉加重</text>
  <text x="670" y="250" class="step" text-anchor="middle" font-size="12" fill="#f1f7f1">观察效果再追加</text>

  <!-- 箭头 -->
  <path d="M 212 224 L 232 224" stroke="#7d8e93" stroke-width="2" fill="none"/>
  <path d="M 226 218 L 232 224 L 226 230" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 392 224 L 412 224" stroke="#7d8e93" stroke-width="2" fill="none"/>
  <path d="M 406 218 L 412 224 L 406 230" fill="none" stroke="#7d8e93" stroke-width="2"/>
  <path d="M 572 224 L 592 224" stroke="#7d8e93" stroke-width="2" fill="none"/>
  <path d="M 586 218 L 592 224 L 586 230" fill="none" stroke="#7d8e93" stroke-width="2"/>

  <!-- 常用手段清单 -->
  <text x="52" y="300" class="nodeTitle">常用治疗手段（医师选择）</text>
  <rect x="52" y="310" width="170" height="76" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <text x="62" y="332" class="body">皮下分离</text>
  <text x="62" y="354" class="small">松解粘连</text>
  <text x="62" y="372" class="small">滚轮型为主</text>

  <rect x="232" y="310" width="170" height="76" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <text x="242" y="332" class="body">激光磨削</text>
  <text x="242" y="354" class="small">点阵激光</text>
  <text x="242" y="372" class="small">箱车、混合型</text>

  <rect x="412" y="310" width="170" height="76" rx="10" fill="#fbf5ea" stroke="#C9A876"/>
  <text x="422" y="332" class="body">微针射频</text>
  <text x="422" y="354" class="small">刺激胶原重塑</text>
  <text x="422" y="372" class="small">整体肤质改善</text>

  <rect x="592" y="310" width="156" height="76" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <text x="602" y="332" class="body">填充注射</text>
  <text x="602" y="354" class="small">临时支撑</text>
  <text x="602" y="372" class="small">需多次评估</text>

  <rect x="52" y="404" width="696" height="22" rx="8" fill="#fbf0eb"/>
  <text x="400" y="420" class="small" text-anchor="middle" fill="#B5654A">不切实际承诺：一次平整、永久无痕、无需恢复</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">痘坑改善靠多次累积，不是一次抹平</text>
  <text x="52" y="466" class="footer">健康科普示意 · 治疗方案需医师评估瘢痕类型后制定</text>
</svg>
