<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t17f2 d17f2" role="img" viewBox="0 0 800 500"><title id="t17f2">神经性皮炎止痒与少抓策略</title><desc id="t17f2">给手和环境设置少抓一点的条件，把抓挠变成可观察行为</desc><defs><linearGradient id="bg17f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh17f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.footer,.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.small{fill:#5c6c72}.footer{fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg17f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh17f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 17</text><text x="56" y="90" class="title">止痒与少抓的四组策略</text><text x="56" y="116" class="kicker">把抓挠从无意识变成可观察行为</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">四组并行策略</text><rect width="335" height="92" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="174" fill="#7A8B6F" rx="12"/><rect width="335" height="10" x="56" y="192" fill="#7A8B6F"/><text x="72" y="193" class="tag">药物止痒</text><text x="72" y="224" class="body">外用抗炎药控制炎症</text><text x="72" y="248" class="small">必要时口服药调节神经瘙痒</text><rect width="335" height="92" x="409" y="174" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="174" fill="#C9A876" rx="12"/><rect width="335" height="10" x="409" y="192" fill="#C9A876"/><text x="425" y="193" class="tag">物理隔断</text><text x="425" y="224" class="body">手套敷料短指甲</text><text x="425" y="248" class="small">夜间睡眠时尤其有效</text><rect width="335" height="92" x="56" y="278" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="278" fill="#8a6a3a" rx="12"/><rect width="335" height="10" x="56" y="296" fill="#8a6a3a"/><text x="72" y="297" class="tag">行为替代</text><text x="72" y="328" class="body">痒时冷敷或拍打</text><text x="72" y="352" class="small">替代抓挠的动作</text><rect width="335" height="92" x="409" y="278" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="278" fill="#5F6E54" rx="12"/><rect width="335" height="10" x="409" y="296" fill="#5F6E54"/><text x="425" y="297" class="tag">压力管理</text><text x="425" y="328" class="body">睡眠放松规律作息</text><text x="425" y="352" class="small">不是都是你想出来的</text><text x="56" y="398" class="nodeTitle">复发时先找循环在哪一环重新启动</text><rect width="688" height="44" x="56" y="412" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.4" rx="10"/><text x="400" y="432" class="body" text-anchor="middle">记录发作前后的压力 睡眠 接触物 用药情况</text><text x="400" y="448" class="small" text-anchor="middle">比笼统说我又复发了更有助于调整方案</text><text x="56" y="474" class="footer">医学教育示意 · 诊断前要排除看起来也很厚的病 如银屑病真菌感染</text></svg>