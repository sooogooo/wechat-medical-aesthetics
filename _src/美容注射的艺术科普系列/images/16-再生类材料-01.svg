<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="再生类与透明质酸对比">
  <rect width="640" height="300" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">两种&quot;填充&quot;，完全不同的逻辑</text>

  <!-- 透明质酸 -->
  <rect x="30" y="55" width="280" height="220" rx="8" fill="#ffffff" stroke="#7a8b6f" stroke-width="1.5"/>
  <rect x="30" y="55" width="280" height="36" rx="8" fill="#7a8b6f"/>
  <rect x="30" y="81" width="280" height="10" fill="#7a8b6f"/>
  <text x="170" y="79" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">透明质酸</text>
  <text x="50" y="118" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">作用：物理填充容积</text>
  <text x="50" y="142" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">效果：即刻（注射完可见）</text>
  <text x="50" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">成分：交联透明质酸凝胶</text>
  <text x="50" y="190" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">维持：6–18 个月</text>
  <rect x="50" y="210" width="240" height="50" rx="6" fill="#eef0ea"/>
  <text x="170" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">出问题：可酶溶解</text>
  <text x="170" y="248" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">后悔成本相对低</text>

  <!-- 再生类 -->
  <rect x="330" y="55" width="280" height="220" rx="8" fill="#ffffff" stroke="#8a9a7f" stroke-width="1.5"/>
  <rect x="330" y="55" width="280" height="36" rx="8" fill="#8a9a7f"/>
  <rect x="330" y="81" width="280" height="10" fill="#8a9a7f"/>
  <text x="470" y="79" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">再生刺激类</text>
  <text x="350" y="118" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">作用：诱导自身胶原增生</text>
  <text x="350" y="142" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">效果：渐进（数周到数月）</text>
  <text x="350" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">成分：载体 + 微球（如 PLLA/CaHA）</text>
  <text x="350" y="190" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">维持：1–2 年（个体差异大）</text>
  <rect x="350" y="210" width="240" height="50" rx="6" fill="#f7ece6"/>
  <text x="470" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">出问题：难溶解、难取</text>
  <text x="470" y="248" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">后悔成本高</text>

  <text x="320" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">同为“填充类”，但可逆性差异巨大——这是决策的核心维度</text>
</svg>