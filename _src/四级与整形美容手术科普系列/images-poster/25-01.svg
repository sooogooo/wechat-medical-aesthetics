<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2501 desc2501">
  <title id="title2501">瘢痕的七种类型分型</title>
  <desc id="desc2501">成熟、增生性、瘢痕疙瘩、凹陷性、萎缩性、挛缩性、色素异常，类型不同处理逻辑不同</desc>
  <defs>
    <linearGradient id="bg2501" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2501" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .tag { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:1px; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2501)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2501)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 25</text>
  <text x="62" y="117" class="title">先分清瘢痕类型，再谈治疗</text>
  <text x="62" y="153" class="kicker">类型不同处理逻辑不同——把疙瘩当普通疤切除，几乎注定复发</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 上排4张 -->
  <!-- 成熟瘢痕 -->
  <rect x="62" y="210" width="186" height="130" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="210" width="186" height="32" rx="14" fill="#0072B2"/>
  <rect x="62" y="230" width="186" height="12" fill="#0072B2"/>
  <text x="155" y="232" class="tag" text-anchor="middle">成熟瘢痕</text>
  <text x="82" y="270" class="body">颜色接近肤色</text>
  <text x="82" y="295" class="body">平整柔软</text>
  <text x="82" y="322" class="small">修复的基础状态</text>

  <!-- 增生性瘢痕 -->
  <rect x="262" y="210" width="186" height="130" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="262" y="210" width="186" height="32" rx="14" fill="#E69F00"/>
  <rect x="262" y="230" width="186" height="12" fill="#E69F00"/>
  <text x="355" y="232" class="tag" text-anchor="middle">增生性瘢痕</text>
  <text x="282" y="270" class="body">高出皮面、发红</text>
  <text x="282" y="295" class="body">局限于原创伤范围</text>
  <text x="282" y="322" class="small">可能痒痛，部分可消退</text>

  <!-- 瘢痕疙瘩（红框重点） -->
  <rect x="462" y="210" width="186" height="130" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2.5"/>
  <rect x="462" y="210" width="186" height="32" rx="14" fill="#D55E00"/>
  <rect x="462" y="230" width="186" height="12" fill="#D55E00"/>
  <text x="555" y="232" class="tag" text-anchor="middle">瘢痕疙瘩</text>
  <text x="482" y="270" class="body">超出原创伤范围</text>
  <text x="482" y="295" class="body">蟹足样浸润生长</text>
  <text x="482" y="322" class="small">切除后极易复发</text>

  <!-- 凹陷性瘢痕 -->
  <rect x="662" y="210" width="176" height="130" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="662" y="210" width="176" height="32" rx="14" fill="#E69F00"/>
  <rect x="662" y="230" width="176" height="12" fill="#E69F00"/>
  <text x="750" y="232" class="tag" text-anchor="middle">凹陷性瘢痕</text>
  <text x="682" y="270" class="body">低于皮面</text>
  <text x="682" y="295" class="body">痤疮后、外伤后</text>
  <text x="682" y="322" class="small">填充或激光改善</text>

  <!-- 下排3张 -->
  <!-- 萎缩性 -->
  <rect x="62" y="360" width="250" height="125" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="360" width="250" height="32" rx="14" fill="#0072B2"/>
  <rect x="62" y="380" width="250" height="12" fill="#0072B2"/>
  <text x="187" y="382" class="tag" text-anchor="middle">萎缩性瘢痕</text>
  <text x="82" y="420" class="body">薄、可能粘连深层</text>
  <text x="82" y="445" class="body">需视情况处理</text>

  <!-- 挛缩性（红-影响功能） -->
  <rect x="325" y="360" width="250" height="125" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="325" y="360" width="250" height="32" rx="14" fill="#D55E00"/>
  <rect x="325" y="380" width="250" height="12" fill="#D55E00"/>
  <text x="450" y="382" class="tag" text-anchor="middle">挛缩性瘢痕</text>
  <text x="345" y="420" class="body">跨关节、影响功能</text>
  <text x="345" y="445" class="body">手部、颈部、眼周</text>

  <!-- 色素异常 -->
  <rect x="588" y="360" width="250" height="125" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="588" y="360" width="250" height="32" rx="14" fill="#E69F00"/>
  <rect x="588" y="380" width="250" height="12" fill="#E69F00"/>
  <text x="713" y="382" class="tag" text-anchor="middle">色素异常</text>
  <text x="608" y="420" class="body">色素沉着或脱失</text>
  <text x="608" y="445" class="body">需针对性处理</text>

  <!-- 金句 -->
  <rect x="62" y="503" width="776" height="40" rx="12" fill="#fbeae3"/>
  <text x="450" y="529" class="quote" text-anchor="middle">把瘢痕疙瘩当普通瘢痕单纯切除，几乎注定复发</text>

  <text x="62" y="566" class="small">示意，非教学图 · 判断类型是治疗的前提，需专业面诊</text>
  <text x="62" y="582" class="footer">医学教育示意 · 瘢痕类型与治疗方案以面诊评估为准</text>
</svg>
