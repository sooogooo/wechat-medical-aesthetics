<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t09f2 d09f2">
  <title id="t09f2">脂溢性角化皮损三类分治</title>
  <desc id="d09f2">治疗前把皮损分成三类，对应不同处理策略</desc>
  <defs>
    <linearGradient id="bg09f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh09f2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg09f2)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh09f2)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 09</text>
  <text x="56" y="90" class="title">治疗前把皮损分成三类</text>
  <text x="56" y="116" class="kicker">不处理通常是完全可以的选择</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">三类分治策略</text>

  <rect x="56" y="174" width="220" height="150" rx="12" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6"/>
  <rect x="56" y="174" width="220" height="28" rx="12" fill="#7A8B6F"/><rect x="56" y="192" width="220" height="10" fill="#7A8B6F"/>
  <text x="166" y="193" class="tag" text-anchor="middle">稳定观察</text>
  <text x="166" y="226" class="body" text-anchor="middle">长期无变化</text>
  <text x="166" y="250" class="body" text-anchor="middle">不影响功能美观</text>
  <text x="166" y="282" class="small" text-anchor="middle">可完全不处理</text>
  <text x="166" y="304" class="small" text-anchor="middle">定期自查即可</text>

  <rect x="290" y="174" width="220" height="150" rx="12" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6"/>
  <rect x="290" y="174" width="220" height="28" rx="12" fill="#C9A876"/><rect x="290" y="192" width="220" height="10" fill="#C9A876"/>
  <text x="400" y="193" class="tag" text-anchor="middle">美观处理</text>
  <text x="400" y="226" class="body" text-anchor="middle">有外观困扰</text>
  <text x="400" y="250" class="body" text-anchor="middle">位置明显 易摩擦</text>
  <text x="400" y="282" class="small" text-anchor="middle">激光 冷冻切除</text>
  <text x="400" y="304" class="small" text-anchor="middle">术后护理决定色差</text>

  <rect x="524" y="174" width="220" height="150" rx="12" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6"/>
  <rect x="524" y="174" width="220" height="28" rx="12" fill="#B5654A"/><rect x="524" y="192" width="220" height="10" fill="#B5654A"/>
  <text x="634" y="193" class="tag" text-anchor="middle">需先就医</text>
  <text x="634" y="226" class="body" text-anchor="middle">快速变化 破溃</text>
  <text x="634" y="250" class="body" text-anchor="middle">颜色不均 出血</text>
  <text x="634" y="282" class="small" text-anchor="middle">短期爆发很多颗</text>
  <text x="634" y="304" class="small" text-anchor="middle">排除恶性病变</text>

  <!-- 术后护理 -->
  <text x="56" y="356" class="nodeTitle">术后护理要点</text>
  <rect x="56" y="370" width="688" height="62" rx="10" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4"/>
  <text x="76" y="394" class="body">结痂期让其自然脱落，不要提前抠掉</text>
  <text x="76" y="416" class="small">严格防晒 避免摩擦 深肤色人群色差风险更高 眼周更谨慎</text>

  <rect x="56" y="442" width="688" height="22" rx="8" fill="#eef4ee"/>
  <text x="400" y="457" class="quote" text-anchor="middle" font-size="14">突然爆发很多颗，需结合全身情况评估</text>
  <text x="56" y="474" class="footer">医学教育示意 · 是否处理取决于症状美观与变化，需面诊判断</text>
</svg>
