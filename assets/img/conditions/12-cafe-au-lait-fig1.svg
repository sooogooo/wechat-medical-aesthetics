<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t12f1 d12f1" role="img" viewBox="0 0 800 500"><title id="t12f1">咖啡斑一两块常见多块要会数</title><desc id="d12f1">单个少量常见，儿童多发较大咖啡斑或伴腋窝雀斑样改变需评估</desc><defs><linearGradient id="bg12f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh12f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg12f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh12f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 12</text><text x="56" y="90" class="title">咖啡斑 一两块常见 多块要会数</text><text x="56" y="116" class="kicker">边界清楚颜色均匀的浅褐色斑，重点是数量和变化</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">两种情形对照</text><rect width="335" height="170" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="335" height="30" x="56" y="174" fill="#7A8B6F" rx="12"/><rect width="335" height="10" x="56" y="194" fill="#7A8B6F"/><text x="72" y="195" class="tag">单个或少量 常见</text><text x="72" y="226" class="body">边界规则 颜色均匀</text><text x="72" y="250" class="body">稳定不变化</text><text x="72" y="274" class="body">无伴随表现</text><text x="72" y="298" class="body">多为良性</text><text x="72" y="326" class="small">可选激光淡化 复色不少见</text><rect width="335" height="170" x="409" y="174" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="335" height="30" x="409" y="174" fill="#B5654A" rx="12"/><rect width="335" height="10" x="409" y="194" fill="#B5654A"/><text x="425" y="195" class="tag">多发或较大 需评估</text><text x="425" y="226" class="body">数量多 直径较大</text><text x="425" y="250" class="body">伴腋窝雀斑样改变</text><text x="425" y="274" class="body">伴其他系统表现</text><text x="425" y="298" class="body">需进一步评估</text><text x="425" y="326" fill="#8a3f2b" class="small">不要让激光替代完整评估</text><text x="56" y="372" class="nodeTitle">家长最实用的不是天天量</text><rect width="688" height="56" x="56" y="386" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="76" y="410" class="body">而是做规范记录 数量 位置 变化 每隔数月拍照</text><text x="76" y="430" class="small">发现新增 较大 伴其他表现时及时带去皮肤科评估</text><rect width="688" height="20" x="56" y="452" fill="#eef4ee" rx="8"/><text x="400" y="466" class="quote" font-size="14" text-anchor="middle">和孩子谈外观时别提前制造缺陷感</text><text x="56" y="474" class="footer">医学教育示意 · 儿童审美决定要给孩子留位置</text></svg>