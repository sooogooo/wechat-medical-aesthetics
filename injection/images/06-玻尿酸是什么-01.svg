<svg xmlns="http://www.w3.org/2000/svg" aria-label="护肤品与注射玻尿酸对比" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="32" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">同名，但完全不同</text><rect width="280" height="200" x="30" y="55" fill="#fff" stroke="#ece7df" rx="10"/><rect width="280" height="36" x="30" y="55" fill="#c9a876" rx="10"/><rect width="280" height="10" x="30" y="81" fill="#c9a876"/><text x="170" y="79" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">护肤品里的玻尿酸</text><text x="50" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 非交联，游离分子</text><text x="50" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 分子量大，主要停留在角质层</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 作用：表层保湿、软化</text><text x="50" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 无法进入真皮，不能填充</text><text x="50" y="214" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 反复涂抹，效果短暂</text><text x="50" y="238" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11">本质：化妆品成分</text><rect width="280" height="200" x="330" y="55" fill="#fff" stroke="#ece7df" rx="10"/><rect width="280" height="36" x="330" y="55" fill="#7a8b6f" rx="10"/><rect width="280" height="10" x="330" y="81" fill="#7a8b6f"/><text x="470" y="79" fill="#fff" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">注射用透明质酸</text><text x="350" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 经交联，形成三维网状结构</text><text x="350" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 注射到真皮深层或皮下</text><text x="350" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 作用：填充容积、支撑轮廓</text><text x="350" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 维持数月到一年以上</text><text x="350" y="214" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 可用透明质酸酶溶解</text><text x="350" y="238" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11">本质：医疗器械，须有注册证</text><text x="320" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">同名不代表同物——把注射当“深层补水”是常见误解</text></svg>