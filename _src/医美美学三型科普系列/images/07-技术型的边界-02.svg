<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="技术型不能衡量的维度">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">技术型衡量不了的&quot;美&quot;</text>

  <rect x="30" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="100" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">气质</text>
  <text x="100" y="125" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">清冷、温暖、</text>
  <text x="100" y="143" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">疏离、亲和</text>
  <text x="100" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">无参数</text>

  <rect x="180" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="250" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">辨识度</text>
  <text x="250" y="125" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;像那个人&quot;</text>
  <text x="250" y="143" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">的个人特征</text>
  <text x="250" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">无参数</text>

  <rect x="330" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="400" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">神态</text>
  <text x="400" y="125" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">笑起来的</text>
  <text x="400" y="143" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">感染力</text>
  <text x="400" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">无参数</text>

  <rect x="480" y="60" width="140" height="230" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="550" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">协调感</text>
  <text x="550" y="125" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">五官之间的</text>
  <text x="550" y="143" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">整体节奏</text>
  <text x="550" y="175" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">难以量化</text>

  <text x="320" y="310" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">这些恰恰是&quot;耐看&quot;的核心——而它们都无法用数字衡量</text>
</svg>