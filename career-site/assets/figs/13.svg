<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p3" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#b5654a" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#b5654a" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">谁留下了，谁离开了</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">转行结局的模式分布</text><rect width="160" height="52" x="320" y="120" fill="#f8f2f0" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="400" y="152" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle">转行进场</text><line x1="375" x2="235" y1="172" y2="216" stroke="#5f6e54" stroke-width="1.6" marker-end="url(#ah-p4)"/><line x1="425" x2="565" y1="172" y2="216" stroke="#b5654a" stroke-width="1.6" marker-end="url(#ah-p3)"/><rect width="300" height="130" x="80" y="220" fill="#fff" stroke="#5f6e54" stroke-width="1.6" rx="8"/><text x="230" y="248" fill="#5f6e54" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">留下的人</text><text x="230" y="274" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">观察者 · 保留身位</text><text x="230" y="298" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">走完信用积累的人</text><text x="230" y="322" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">红利边缘的分享者</text><rect width="300" height="130" x="420" y="220" fill="#fff" stroke="#b5654a" stroke-width="1.6" rx="8"/><text x="570" y="248" fill="#b5654a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">离开的人</text><text x="570" y="274" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">收入落差 · 方法论无处安放</text><text x="570" y="298" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">组织摩擦 · 价值观冲突</text><text x="570" y="322" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">四个触发点 · 三特征，皆为假设</text><text x="400" y="396" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" text-anchor="middle">没有比例数据，只有模式——人物为合成原型，待真实采访验证</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">离开不是失败，把红绿灯系统当救命系统用</text></svg>