<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t53f2 d53f2" role="img" viewBox="0 0 800 500"><title id="t53f2">单纯疱疹的管理与防传播</title><desc id="d53f2">早期抗病毒减少传播与复发管理的清单</desc><defs><linearGradient id="bg53f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh53f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg53f2)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh53f2)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 53</text><text x="52" y="92" class="title">管理与防传播清单</text><text x="52" y="116" class="kicker">早期抗病毒、减少接触、识别复发先兆</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="220" height="34" x="52" y="150" fill="#5F6E54" rx="8"/><text x="162" y="172" class="nodeTitle" text-anchor="middle">早期抗病毒</text><rect width="220" height="206" x="52" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="68" cy="214" r="3" fill="#5F6E54"/><text x="80" y="218" class="body">前驱期即开始用药</text><circle cx="68" cy="244" r="3" fill="#5F6E54"/><text x="80" y="248" class="body">口服或外用抗病毒</text><circle cx="68" cy="274" r="3" fill="#5F6E54"/><text x="80" y="278" class="body">越早越能缩短病程</text><circle cx="68" cy="304" r="3" fill="#5F6E54"/><text x="80" y="308" class="body">频繁复发可抑制治疗</text><circle cx="68" cy="334" r="3" fill="#5F6E54"/><text x="80" y="338" class="small">需医师评估疗程</text><circle cx="68" cy="372" r="3" fill="#5F6E54"/><text x="80" y="376" fill="#B5654A" class="small">免疫低下者须就医</text><rect width="220" height="34" x="290" y="150" fill="#C9A876" rx="8"/><text x="400" y="172" class="nodeTitle" text-anchor="middle">减少传播</text><rect width="220" height="206" x="290" y="188" fill="#fbf5ea" stroke="#C9A876" rx="10"/><circle cx="306" cy="214" r="3" fill="#C9A876"/><text x="318" y="218" class="body">发作期避免亲密接触</text><circle cx="306" cy="244" r="3" fill="#C9A876"/><text x="318" y="248" class="body">不与他人共用毛巾</text><circle cx="306" cy="274" r="3" fill="#C9A876"/><text x="318" y="278" class="body">不共用杯具、餐具</text><circle cx="306" cy="304" r="3" fill="#C9A876"/><text x="318" y="308" class="body">勿触摸水疱再揉眼</text><circle cx="306" cy="334" r="3" fill="#C9A876"/><text x="318" y="338" class="small">孕妇生殖器疱疹须告知</text><circle cx="306" cy="372" r="3" fill="#C9A876"/><text x="318" y="376" fill="#B5654A" class="small">接触婴儿须格外注意</text><rect width="220" height="34" x="528" y="150" fill="#7A8B6F" rx="8"/><text x="638" y="172" class="nodeTitle" text-anchor="middle">减少复发</text><rect width="220" height="206" x="528" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><circle cx="544" cy="214" r="3" fill="#5F6E54"/><text x="556" y="218" class="body">规律作息、避免熬夜</text><circle cx="544" cy="244" r="3" fill="#5F6E54"/><text x="556" y="248" class="body">做好防晒</text><circle cx="544" cy="274" r="3" fill="#5F6E54"/><text x="556" y="278" class="body">管理压力与情绪</text><circle cx="544" cy="304" r="3" fill="#5F6E54"/><text x="556" y="308" class="body">记录复发诱因</text><circle cx="544" cy="334" r="3" fill="#5F6E54"/><text x="556" y="338" class="small">前驱期立即用药</text><circle cx="544" cy="372" r="3" fill="#5F6E54"/><text x="556" y="376" fill="#5F6E54" class="small">一年超过6次可考虑抑制</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">不是上火，是病毒在反复</text><text x="52" y="466" class="footer">健康科普示意 · 用药方案及特殊人群管理须由医师评估</text></svg>