<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1202 desc1202">
  <title id="title1202">脂肪抽吸必须正视的风险</title>
  <desc id="desc1202">吸脂有脂肪栓塞、出血、轮廓不平整、血栓等风险，大量抽吸级别更高</desc>
  <defs>
    <linearGradient id="bg1202" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1202" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
      .warn { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#D55E00; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1202)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1202)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 12</text>
  <text x="62" y="117" class="title">吸脂的风险清单：不是小项目</text>
  <text x="62" y="153" class="kicker">单次大量抽吸可达三级／四级——风险随抽吸量上升</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 风险条目列表 -->
  <!-- 1 脂肪栓塞（最严重，高亮） -->
  <rect x="62" y="205" width="776" height="52" rx="10" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <rect x="62" y="205" width="8" height="52" rx="4" fill="#D55E00"/>
  <text x="86" y="227" class="warn">脂肪栓塞</text>
  <text x="86" y="248" class="small">罕见但可危及生命，大体积吸脂最需警惕</text>

  <!-- 2 脏器穿孔 -->
  <rect x="62" y="265" width="776" height="44" rx="10" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5"/>
  <rect x="62" y="265" width="8" height="44" rx="4" fill="#D55E00"/>
  <text x="86" y="293" class="nodeTitle">腹腔或脏器穿孔</text>
  <text x="320" y="293" class="body">罕见但严重，多见于腹部吸脂</text>

  <!-- 3 深静脉血栓与肺栓塞 -->
  <rect x="62" y="317" width="776" height="44" rx="10" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5"/>
  <rect x="62" y="317" width="8" height="44" rx="4" fill="#D55E00"/>
  <text x="86" y="345" class="nodeTitle">深静脉血栓与肺栓塞</text>
  <text x="340" y="345" class="body">与体位、制动有关，需规范预防</text>

  <!-- 4 轮廓不平整 -->
  <rect x="62" y="369" width="776" height="44" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5"/>
  <rect x="62" y="369" width="8" height="44" rx="4" fill="#E69F00"/>
  <text x="86" y="397" class="nodeTitle">轮廓不平整、不对称</text>
  <text x="320" y="397" class="body">过度或抽取不足，修整比初次更难</text>

  <!-- 5 皮肤松弛与色素改变 -->
  <rect x="62" y="421" width="776" height="44" rx="10" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5"/>
  <rect x="62" y="421" width="8" height="44" rx="4" fill="#E69F00"/>
  <text x="86" y="449" class="nodeTitle">皮肤松弛、凹凸、色素改变</text>
  <text x="360" y="449" class="body">皮肤弹性差者更明显</text>

  <!-- 其他 -->
  <rect x="62" y="473" width="776" height="44" rx="10" fill="#f8fbfb" stroke="#dce8e8" stroke-width="1.5"/>
  <rect x="62" y="473" width="8" height="44" rx="4" fill="#5c6c72"/>
  <text x="86" y="501" class="nodeTitle">出血 · 血清肿 · 感染 · 感觉改变 · 麻醉风险</text>

  <!-- 金句 -->
  <rect x="62" y="528" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="554" class="quote" text-anchor="middle">承诺一次成型、永不反弹、无风险的机构，不值得信任</text>

  <text x="62" y="582" class="footer">医学教育示意 · 大量抽吸须在有相应资质的医疗机构开展</text>
</svg>
