<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="幼态脸流行的原因">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">幼态脸流行的几股推力</text>

  <rect x="30" y="60" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="122" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">文化预设</text>
  <text x="45" y="115" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• &quot;年轻=有价值&quot;</text>
  <text x="45" y="135" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 女性价值与青春</text>
  <text x="45" y="153" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">  强绑定</text>
  <text x="45" y="180" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• &quot;显小&quot;被夸赞</text>
  <text x="45" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• &quot;显老&quot;成为贬义</text>

  <rect x="227" y="60" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">商业推动</text>
  <text x="242" y="115" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 社交媒体种草</text>
  <text x="242" y="135" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 明星/网红示范</text>
  <text x="242" y="155" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 机构打包&quot;幼态套餐&quot;</text>
  <text x="242" y="175" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 滤镜强化幼态审美</text>
  <text x="242" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 制造&quot;不够幼&quot;焦虑</text>

  <rect x="424" y="60" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <text x="516" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">心理需求</text>
  <text x="439" y="115" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 对衰老的恐惧</text>
  <text x="439" y="135" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 对被保护的需要</text>
  <text x="439" y="155" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 职场/婚恋压力</text>
  <text x="439" y="175" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 同辈比较</text>
  <text x="439" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">• 自我价值的外求</text>

  <text x="320" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">流行从不是&quot;自然&quot;的，它是多股力量共同塑造的结果</text>
</svg>