<svg xmlns="http://www.w3.org/2000/svg" aria-label="把握技术型边界的原则" role="img" viewBox="0 0 640 220"><rect width="640" height="220" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">用好技术型的几个原则</text><rect width="280" height="70" x="30" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="50" y="80" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">✓ 数据是参考，不是标准</text><text x="50" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">参数辅助判断，不取代审美</text><text x="50" y="116" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">正常范围内即可，不必&quot;最佳值&quot;</text><rect width="280" height="70" x="330" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="350" y="80" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">✓ 整体协调 &gt; 局部达标</text><text x="350" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">一个参数不达标但协调的脸</text><text x="350" y="116" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">比全部达标但失协的脸更美</text><rect width="280" height="60" x="30" y="140" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="50" y="165" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">✓ 保留&quot;测不出&quot;的维度</text><text x="50" y="185" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">气质、辨识度、神态比参数重要</text><rect width="280" height="60" x="330" y="140" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="350" y="165" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">✓ 接受正常的不对称</text><text x="350" y="185" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">轻微不对称是真实与生动的来源</text></svg>