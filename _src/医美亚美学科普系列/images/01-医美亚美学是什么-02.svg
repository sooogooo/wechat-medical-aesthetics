<svg xmlns="http://www.w3.org/2000/svg" aria-label="亚美学的双重性" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">亚美学既是工具，也是话术</text><rect width="280" height="170" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="170" y="90" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">作为认知工具</text><text x="50" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 帮你描述模糊的审美偏好</text><text x="50" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 提供与医生沟通的共同语言</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 让&quot;我想要的感觉&quot;可传达</text><text x="50" y="200" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">中性，有正面价值</text><rect width="280" height="170" x="330" y="60" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="470" y="90" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">作为营销话术</text><text x="350" y="120" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 制造&quot;缺什么&quot;的焦虑</text><text x="350" y="143" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 把医学项目包装成&quot;款&quot;</text><text x="350" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 推动趋同化和过度消费</text><text x="350" y="200" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">需要警惕的部分</text><text x="320" y="245" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">本系列的目的：让你能用其工具性，识破其话术性</text></svg>