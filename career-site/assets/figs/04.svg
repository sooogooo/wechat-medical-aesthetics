<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">

  <marker id="ah-p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2f4858"/>
  </marker>

  <rect x="0" y="0" width="800" height="500" fill="#fffdf9"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#ffffff" stroke="#e4ddd2"/>
  <rect x="24" y="24" width="4" height="46" rx="2" fill="#2f4858"/>
  <text x="46" y="46" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#2b2a28" font-weight="600">谁说了算</text>
  <text x="46" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">权力以稀缺手艺为锚，不随职级分配</text>

  <circle cx="400" cy="265" r="175" fill="none" stroke="#e4ddd2" stroke-width="1.2"/>
  <circle cx="400" cy="265" r="115" fill="none" stroke="#e4ddd2" stroke-width="1.2"/>
  <circle cx="400" cy="258" r="58" fill="#edf1f4"/>
  <text x="400" y="252" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#2f4858" font-weight="600" text-anchor="middle">医　生</text>
  <text x="400" y="276" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#2f4858" text-anchor="middle">稀缺手艺</text>
  <text x="400" y="128" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">老板 / 投资人　资本与直觉，规则的真正来源</text>
  <text x="400" y="192" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#6b6864" text-anchor="middle">经营院长 · 咨询师　服务层，获客变现的责任</text>
  <line x1="640" y1="350" x2="470" y2="300" stroke="#2f4858" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah-p1)"/>
  <text x="648" y="344" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#2f4858">冲突时的牺牲顺序</text>
  <text x="648" y="362" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">由外向内，</text>
  <text x="648" y="380" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">离开院长可以，</text>
  <text x="648" y="398" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#6b6864">离开医生不行</text>

<text x="46" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#a8a39d">外行不能领导内行，管不了一双手</text>
</svg>