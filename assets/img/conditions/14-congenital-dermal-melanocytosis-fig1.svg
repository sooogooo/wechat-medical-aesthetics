<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t14f1 d14f1" role="img" viewBox="0 0 800 500"><title id="t14f1">先天性青斑会变淡的自然病程</title><desc id="t14f1">腰骶臀部蓝灰色平坦斑多数会在儿童期逐渐变淡</desc><defs><linearGradient id="bg14f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh14f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg14f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh14f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 14</text><text x="56" y="90" class="title">宝宝青斑 多数会慢慢变淡</text><text x="56" y="116" class="kicker">腰骶臀部蓝灰色平坦斑，旧称蒙古斑</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">自然病程时间轴</text><line x1="100" x2="700" y1="240" y2="240" stroke="#cdd8d8" stroke-width="2"/><circle cx="160" cy="240" r="13" fill="#8a6a3a"/><text x="160" y="216" class="body" font-weight="700" text-anchor="middle">出生</text><text x="160" y="270" class="small" text-anchor="middle">蓝灰色明显</text><text x="160" y="286" class="small" text-anchor="middle">腰骶臀为主</text><circle cx="320" cy="240" r="13" fill="#C9A876"/><text x="320" y="216" class="body" font-weight="700" text-anchor="middle">婴幼儿期</text><text x="320" y="270" class="small" text-anchor="middle">颜色稳定或略淡</text><text x="320" y="286" class="small" text-anchor="middle">记录位置范围</text><circle cx="480" cy="240" r="13" fill="#5F6E54"/><text x="480" y="216" class="body" font-weight="700" text-anchor="middle">学龄前</text><text x="480" y="270" class="small" text-anchor="middle">多数开始变淡</text><text x="480" y="286" class="small" text-anchor="middle">渐不明显</text><circle cx="640" cy="240" r="13" fill="#7A8B6F"/><text x="640" y="216" class="body" font-weight="700" text-anchor="middle">儿童期后</text><text x="640" y="270" class="small" text-anchor="middle">大部分消退</text><text x="640" y="286" class="small" text-anchor="middle">少数持续</text><text x="56" y="330" class="nodeTitle">哪些情况值得进一步评估</text><rect width="688" height="74" x="56" y="344" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.4" rx="10"/><text x="76" y="368" class="body">分布不典型 位于非腰骶臀部位</text><text x="76" y="388" class="body">持续不退或逐渐加深 范围扩大</text><text x="76" y="408" class="small">伴其他皮肤或系统表现时，需医生评估非典型不等于危险但值得确认</text><rect width="688" height="36" x="56" y="430" fill="#eef4ee" rx="10"/><text x="400" y="453" class="quote" text-anchor="middle">给它一个合理的时间尺度，不必急于激光</text><text x="56" y="474" class="footer">医学教育示意 · 在出生记录里写清楚位置和范围，便于后续对比</text></svg>