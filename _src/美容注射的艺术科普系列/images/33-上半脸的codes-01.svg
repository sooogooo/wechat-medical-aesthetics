<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="上半脸三大区域作用">
  <rect width="640" height="360" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">上半脸三大区域与美学作用</text>

  <!-- F 额头 -->
  <rect x="30" y="60" width="185" height="270" rx="8" fill="#ffffff" stroke="#7a8b6f" stroke-width="1.5"/>
  <rect x="30" y="60" width="185" height="40" rx="8" fill="#7a8b6f"/>
  <rect x="30" y="90" width="185" height="10" fill="#7a8b6f"/>
  <text x="122" y="86" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">F 额头</text>
  <text x="122" y="130" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">Forehead</text>
  <text x="45" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">美学作用：</text>
  <text x="45" y="188" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 额头饱满度</text>
  <text x="45" y="208" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 与眉骨自然过渡</text>
  <text x="45" y="228" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 额头扁平、显老</text>
  <rect x="45" y="250" width="155" height="60" rx="6" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="122" y="272" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#b5654a">⚠ 高危血管区</text>
  <text x="122" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">眶上、滑车上血管</text>
  <text x="122" y="304" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">与眼动脉交通</text>

  <!-- T 颞部 -->
  <rect x="227" y="60" width="185" height="270" rx="8" fill="#ffffff" stroke="#8a9a7f" stroke-width="1.5"/>
  <rect x="227" y="60" width="185" height="40" rx="8" fill="#8a9a7f"/>
  <rect x="227" y="90" width="185" height="10" fill="#8a9a7f"/>
  <text x="320" y="86" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">T 颞部</text>
  <text x="320" y="130" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">Temporal</text>
  <text x="242" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">美学作用：</text>
  <text x="242" y="188" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 太阳穴凹陷</text>
  <text x="242" y="208" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 上面部框架感</text>
  <text x="242" y="228" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 显憔悴、显凶</text>
  <rect x="242" y="250" width="155" height="60" rx="6" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="320" y="272" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#b5654a">⚠ 血管丰富</text>
  <text x="320" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">颞浅血管走行</text>
  <text x="320" y="304" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">深部骨面相对安全</text>

  <!-- E 眼周 -->
  <rect x="424" y="60" width="185" height="270" rx="8" fill="#ffffff" stroke="#c9a876" stroke-width="1.5"/>
  <rect x="424" y="60" width="185" height="40" rx="8" fill="#c9a876"/>
  <rect x="424" y="90" width="185" height="10" fill="#c9a876"/>
  <text x="516" y="86" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" fill="#ffffff">E 眼周</text>
  <text x="516" y="130" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">Periorbital</text>
  <text x="439" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">美学作用：</text>
  <text x="439" y="188" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 泪沟、眼周支撑</text>
  <text x="439" y="208" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 改善疲惫感</text>
  <text x="439" y="228" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 眼周年轻化</text>
  <rect x="439" y="250" width="155" height="60" rx="6" fill="#f7ece6" stroke="#e3c9bd"/>
  <text x="516" y="272" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#b5654a">⚠ 高危精细区</text>
  <text x="516" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">皮肤薄、血管密集</text>
  <text x="516" y="304" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">与眼动脉交通</text>

  <text x="320" y="345" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">三大区域共同特点：血管密集，是上半脸注射风险的核心来源</text>
</svg>