<svg xmlns="http://www.w3.org/2000/svg" aria-label="诉求与材料类别匹配图" role="img" viewBox="0 0 720 340"><rect width="720" height="340" fill="#faf8f4" rx="12"/><text x="360" y="32" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">我的诉求，对应哪一类材料</text><text x="120" y="62" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">常见诉求</text><rect width="180" height="40" x="40" y="74" fill="#fff" stroke="#ddd6ca" rx="6"/><text x="130" y="99" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">泪沟、太阳穴凹陷</text><rect width="180" height="40" x="40" y="120" fill="#fff" stroke="#ddd6ca" rx="6"/><text x="130" y="145" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">鼻梁低、下巴短</text><rect width="180" height="40" x="40" y="166" fill="#fff" stroke="#ddd6ca" rx="6"/><text x="130" y="191" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">抬头纹、鱼尾纹</text><rect width="180" height="40" x="40" y="212" fill="#fff" stroke="#ddd6ca" rx="6"/><text x="130" y="237" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">咬肌大、方脸</text><rect width="180" height="40" x="40" y="258" fill="#fff" stroke="#ddd6ca" rx="6"/><text x="130" y="283" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12" text-anchor="middle">肤质粗糙、整体松弛</text><line x1="220" x2="300" y1="94" y2="94" stroke="#7a8b6f" stroke-width="2"/><polygon fill="#7a8b6f" points="300 94 294 90 294 98"/><line x1="220" x2="300" y1="140" y2="140" stroke="#7a8b6f" stroke-width="2"/><polygon fill="#7a8b6f" points="300 140 294 136 294 144"/><line x1="220" x2="430" y1="186" y2="186" stroke="#c9a876" stroke-width="2"/><polygon fill="#c9a876" points="430 186 424 182 424 190"/><line x1="220" x2="430" y1="232" y2="232" stroke="#c9a876" stroke-width="2"/><polygon fill="#c9a876" points="430 232 424 228 424 236"/><line x1="220" x2="560" y1="278" y2="278" stroke="#8a9a7f" stroke-width="2"/><polygon fill="#8a9a7f" points="560 278 554 274 554 282"/><rect width="160" height="100" x="300" y="70" fill="#eef0ea" stroke="#7a8b6f" stroke-width="1.5" rx="8"/><text x="380" y="96" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">填充类</text><text x="380" y="118" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">透明质酸为主</text><text x="380" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">即刻补容积</text><text x="380" y="158" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">可溶可逆</text><rect width="160" height="90" x="430" y="170" fill="#f4ede0" stroke="#c9a876" stroke-width="1.5" rx="8"/><text x="510" y="196" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">肌肉松弛类</text><text x="510" y="218" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">肉毒杆菌素</text><text x="510" y="240" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">放松表情肌</text><rect width="140" height="70" x="560" y="250" fill="#eef0ea" stroke="#8a9a7f" stroke-width="1.5" rx="8"/><text x="630" y="276" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">再生刺激类</text><text x="630" y="298" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">渐进改善</text><text x="360" y="330" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">图为常见匹配示意，实际选择需面诊评估</text></svg>