<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1601 desc1601">
  <title id="title1601">男性乳房发育：真性与假性</title>
  <desc id="desc1601">真性为腺体增生需切除，假性为脂肪堆积需减重或吸脂，混合型联合处理</desc>
  <defs>
    <linearGradient id="bg1601" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1601" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1601)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1601)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 16</text>
  <text x="62" y="117" class="title">男生胸大，先分腺体还是脂肪</text>
  <text x="62" y="153" class="kicker">真性和假性的处理方式完全不同</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：真性 -->
  <rect x="62" y="210" width="380" height="295" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <rect x="62" y="210" width="380" height="46" rx="16" fill="#0072B2"/>
  <rect x="62" y="240" width="380" height="16" fill="#0072B2"/>
  <text x="252" y="240" class="nodeTitle" text-anchor="middle" style="fill:#ffffff">真性男性乳房发育</text>
  <text x="82" y="290" class="body">本质：乳腺腺体增生</text>
  <text x="82" y="320" class="body">触诊：能摸到腺体（盘状硬结）</text>
  <text x="82" y="350" class="body">成因：激素、药物、肝病、内分泌</text>
  <text x="82" y="380" class="body">健身减不掉属正常</text>
  <rect x="82" y="410" width="340" height="78" rx="8" fill="#eef6f8"/>
  <text x="252" y="434" class="small" text-anchor="middle">处理：以腺体切除为主</text>
  <text x="252" y="456" class="small" text-anchor="middle">经乳晕边缘小切口</text>
  <text x="252" y="476" class="small" text-anchor="middle">必须先排查病因</text>

  <!-- 右：假性 -->
  <rect x="458" y="210" width="380" height="295" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <rect x="458" y="210" width="380" height="46" rx="16" fill="#E69F00"/>
  <rect x="458" y="240" width="380" height="16" fill="#E69F00"/>
  <text x="648" y="240" class="nodeTitle" text-anchor="middle" style="fill:#ffffff">假性男性乳房发育</text>
  <text x="478" y="290" class="body">本质：脂肪堆积为主</text>
  <text x="478" y="320" class="body">触诊：无明确腺体</text>
  <text x="478" y="350" class="body">成因：多与肥胖有关</text>
  <text x="478" y="380" class="body">体重下降可改善</text>
  <rect x="478" y="410" width="340" height="78" rx="8" fill="#fdf3e3"/>
  <text x="648" y="434" class="small" text-anchor="middle">处理：以减重或吸脂为主</text>
  <text x="648" y="456" class="small" text-anchor="middle">重度肥胖建议先医学减重</text>
  <text x="648" y="476" class="small" text-anchor="middle">部分假性会随之改善</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">混合型需联合处理——判断要靠面诊触诊，必要时辅以超声或激素检查</text>

  <text x="62" y="582" class="footer">医学教育示意 · 分级通常一至二级 · 复杂或大面积可达更高级别</text>
</svg>
