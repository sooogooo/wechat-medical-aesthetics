<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t53f2 d53f2">
  <title id="t53f2">单纯疱疹的管理与防传播</title>
  <desc id="d53f2">早期抗病毒减少传播与复发管理的清单</desc>
  <defs>
    <linearGradient id="bg53f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh53f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg53f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh53f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 53</text>
  <text x="52" y="92" class="title">管理与防传播清单</text>
  <text x="52" y="116" class="kicker">早期抗病毒、减少接触、识别复发先兆</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 三列 -->
  <rect x="52" y="150" width="220" height="34" rx="8" fill="#5F6E54"/>
  <text x="162" y="172" class="nodeTitle" text-anchor="middle">早期抗病毒</text>
  <rect x="52" y="188" width="220" height="206" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <circle cx="68" cy="214" r="3" fill="#5F6E54"/>
  <text x="80" y="218" class="body">前驱期即开始用药</text>
  <circle cx="68" cy="244" r="3" fill="#5F6E54"/>
  <text x="80" y="248" class="body">口服或外用抗病毒</text>
  <circle cx="68" cy="274" r="3" fill="#5F6E54"/>
  <text x="80" y="278" class="body">越早越能缩短病程</text>
  <circle cx="68" cy="304" r="3" fill="#5F6E54"/>
  <text x="80" y="308" class="body">频繁复发可抑制治疗</text>
  <circle cx="68" cy="334" r="3" fill="#5F6E54"/>
  <text x="80" y="338" class="small">需医师评估疗程</text>
  <circle cx="68" cy="372" r="3" fill="#5F6E54"/>
  <text x="80" y="376" class="small" fill="#B5654A">免疫低下者须就医</text>

  <rect x="290" y="150" width="220" height="34" rx="8" fill="#C9A876"/>
  <text x="400" y="172" class="nodeTitle" text-anchor="middle">减少传播</text>
  <rect x="290" y="188" width="220" height="206" rx="10" fill="#fbf5ea" stroke="#C9A876"/>
  <circle cx="306" cy="214" r="3" fill="#C9A876"/>
  <text x="318" y="218" class="body">发作期避免亲密接触</text>
  <circle cx="306" cy="244" r="3" fill="#C9A876"/>
  <text x="318" y="248" class="body">不与他人共用毛巾</text>
  <circle cx="306" cy="274" r="3" fill="#C9A876"/>
  <text x="318" y="278" class="body">不共用杯具、餐具</text>
  <circle cx="306" cy="304" r="3" fill="#C9A876"/>
  <text x="318" y="308" class="body">勿触摸水疱再揉眼</text>
  <circle cx="306" cy="334" r="3" fill="#C9A876"/>
  <text x="318" y="338" class="small">孕妇生殖器疱疹须告知</text>
  <circle cx="306" cy="372" r="3" fill="#C9A876"/>
  <text x="318" y="376" class="small" fill="#B5654A">接触婴儿须格外注意</text>

  <rect x="528" y="150" width="220" height="34" rx="8" fill="#7A8B6F"/>
  <text x="638" y="172" class="nodeTitle" text-anchor="middle">减少复发</text>
  <rect x="528" y="188" width="220" height="206" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <circle cx="544" cy="214" r="3" fill="#5F6E54"/>
  <text x="556" y="218" class="body">规律作息、避免熬夜</text>
  <circle cx="544" cy="244" r="3" fill="#5F6E54"/>
  <text x="556" y="248" class="body">做好防晒</text>
  <circle cx="544" cy="274" r="3" fill="#5F6E54"/>
  <text x="556" y="278" class="body">管理压力与情绪</text>
  <circle cx="544" cy="304" r="3" fill="#5F6E54"/>
  <text x="556" y="308" class="body">记录复发诱因</text>
  <circle cx="544" cy="334" r="3" fill="#5F6E54"/>
  <text x="556" y="338" class="small">前驱期立即用药</text>
  <circle cx="544" cy="372" r="3" fill="#5F6E54"/>
  <text x="556" y="376" class="small" fill="#5F6E54">一年超过6次可考虑抑制</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">不是上火，是病毒在反复</text>
  <text x="52" y="466" class="footer">健康科普示意 · 用药方案及特殊人群管理须由医师评估</text>
</svg>
