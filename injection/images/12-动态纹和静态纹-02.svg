<svg xmlns="http://www.w3.org/2000/svg" aria-label="常见纹路分类" role="img" viewBox="0 0 640 340"><rect width="640" height="340" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">常见皱纹的类型与首选手段</text><rect width="580" height="32" x="30" y="50" fill="#7a8b6f" rx="4"/><text x="120" y="71" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">皱纹类型</text><text x="290" y="71" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">特征</text><text x="480" y="71" fill="#fff" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">首选手段</text><rect width="580" height="42" x="30" y="82" fill="#fff" stroke="#ece7df"/><text x="120" y="108" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">抬头纹</text><text x="290" y="108" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">抬眉时横纹，通常动态为主</text><text x="480" y="108" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">肉毒</text><rect width="580" height="42" x="30" y="124" fill="#eef0ea" stroke="#ece7df"/><text x="120" y="150" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">眉间纹（川字纹）</text><text x="290" y="150" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">皱眉时竖纹，可发展为静态</text><text x="480" y="150" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">肉毒为主</text><rect width="580" height="42" x="30" y="166" fill="#fff" stroke="#ece7df"/><text x="120" y="192" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">鱼尾纹</text><text x="290" y="192" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">笑时眼角放射纹</text><text x="480" y="192" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">肉毒</text><rect width="580" height="42" x="30" y="208" fill="#eef0ea" stroke="#ece7df"/><text x="120" y="234" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">法令纹</text><text x="290" y="234" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">鼻翼到口角的沟，多为静态</text><text x="480" y="234" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">填充 / 中面部提升</text><rect width="580" height="42" x="30" y="250" fill="#fff" stroke="#ece7df"/><text x="120" y="276" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">木偶纹</text><text x="290" y="276" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">口角下方的沟，多为静态</text><text x="480" y="276" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">填充为主</text><text x="320" y="320" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">此表为一般规律；实际方案需医生面诊，常需联合治疗</text></svg>