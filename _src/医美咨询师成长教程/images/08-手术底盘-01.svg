<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t08p d08p" role="img" viewBox="0 0 800 500" style="max-width:100%;height:auto;display:block;margin:0 auto"><title id="t08p">手术分级金字塔，四级手术在塔尖</title><desc id="d08p">四级金字塔自底向上为一级皮肤小手术、二级中等复杂手术、三级眼鼻胸腹类手术、四级颌面轮廓类手术；层级越高机构与医生资质要求越严，塔尖的四级手术需要零容忍核验。</desc><defs><marker id="ax08p" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#6b6864" points="0 0 8 3 0 6"/></marker></defs><rect width="800" height="500" fill="#faf8f4"/><text x="56" y="52" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".18em">PYRAMID · 手术分级</text><text x="56" y="84" fill="#2b2a28" font-family="'Songti SC',Georgia,serif" font-size="28">四级手术在塔尖</text><text x="56" y="106" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">级别越高，机构与医生资质要求越严</text><path fill="none" stroke="#6b6864" stroke-width="1" marker-end="url(#ax08p)" d="M 64 420 L 64 152"/><text x="64" y="136" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em" text-anchor="middle">资质要求</text><polygon fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2" points="296 140 344 140 392 210 248 210"/><text x="320" y="172" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">四级 · 颌面轮廓</text><text x="320" y="192" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">下颌角 · 颧骨</text><polygon fill="#fff" stroke="#2b2a28" stroke-width="1" points="248 210 392 210 440 280 200 280"/><text x="344" y="242" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">三级 · 眼鼻胸腹</text><text x="344" y="262" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">综合鼻 · 隆胸 · 腹壁</text><polygon fill="#fff" stroke="#2b2a28" stroke-width="1" points="200 280 440 280 488 350 152 350"/><text x="368" y="312" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">二级 · 中等复杂</text><text x="368" y="332" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">常规住院 · 系统管理</text><polygon fill="#fff" stroke="#2b2a28" stroke-width="1" points="152 350 488 350 536 420 104 420"/><text x="392" y="382" fill="#2b2a28" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" text-anchor="middle">一级 · 皮肤小手术</text><text x="392" y="402" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" text-anchor="middle">痣 · 赘生物切除 · 持证门诊</text><line x1="396" x2="588" y1="175" y2="175" stroke="rgba(43,42,40,0.12)" stroke-width=".8"/><text x="596" y="172" fill="#7a8b6f" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">机构 + 医生 双重零容忍</text><text x="596" y="186" fill="#a8a39d" font-family="'SF Mono',Consolas,monospace" font-size="8">查不到 = 不往前走</text><line x1="418" x2="588" y1="245" y2="245" stroke="rgba(43,42,40,0.12)" stroke-width=".8"/><text x="596" y="242" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">审美沟通 · 修复率敏感</text><line x1="468" x2="620" y1="315" y2="315" stroke="rgba(43,42,40,0.12)" stroke-width=".8"/><text x="596" y="312" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">住院与随访体系</text><text x="392" y="440" fill="#a8a39d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" text-anchor="middle">塔基最宽 = 项目最多 · 塔尖最窄 = 门槛最高</text><line x1="56" x2="744" y1="456" y2="456" stroke="rgba(43,42,40,0.12)" stroke-width=".8"/><text x="56" y="472" fill="#6b6864" font-family="'SF Mono',Consolas,monospace" font-size="8" letter-spacing=".14em">LEGEND</text><polygon fill="#fff" stroke="#2b2a28" stroke-width="1" points="128 464 140 464 146 476 122 476"/><text x="152" y="474" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">层级 = 资质门槛</text><polygon fill="rgba(122,139,111,0.10)" stroke="#7a8b6f" stroke-width="1.2" points="256 463 264 463 270 476 250 476"/><text x="278" y="474" fill="#6b6864" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">焦点 = 核验零容忍</text><text x="420" y="474" fill="#a8a39d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8">宽度示意项目数量相对关系，非统计比例</text></svg>