<svg xmlns="http://www.w3.org/2000/svg" aria-label="透明质酸酶的用途" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">透明质酸酶能用在哪些情况</text><rect width="135" height="120" x="30" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="97" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">血管栓塞</text><text x="97" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">急救用途</text><text x="97" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">时间窗关键</text><text x="97" y="160" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">最紧急</text><rect width="135" height="120" x="180" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="247" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">过度填充</text><text x="247" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">修整用途</text><text x="247" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">局部精准溶解</text><rect width="135" height="120" x="330" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="397" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">移位/不平</text><text x="397" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">调整用途</text><text x="397" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">溶解后重新填充</text><rect width="135" height="120" x="480" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="547" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">结节</text><text x="547" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">处理用途</text><text x="547" y="140" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">针对透明质酸结节</text><rect width="580" height="70" x="30" y="190" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="320" y="215" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚠ 透明质酸酶只对透明质酸有效</text><text x="320" y="238" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">对再生类材料、胶原蛋白、不明注射物无效</text><text x="320" y="270" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">“能溶”是透明质酸相对于其他材料的优势，但它不是万能后悔药</text></svg>