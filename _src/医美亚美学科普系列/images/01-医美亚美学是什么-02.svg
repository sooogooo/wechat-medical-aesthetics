<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="亚美学的双重性">
  <rect width="640" height="260" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">亚美学既是工具，也是话术</text>

  <rect x="30" y="60" width="280" height="170" rx="8" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="170" y="90" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">作为认知工具</text>
  <text x="50" y="120" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 帮你描述模糊的审美偏好</text>
  <text x="50" y="143" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 提供与医生沟通的共同语言</text>
  <text x="50" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 让&quot;我想要的感觉&quot;可传达</text>
  <text x="50" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">中性，有正面价值</text>

  <rect x="330" y="60" width="280" height="170" rx="8" fill="#f7ece6" stroke="#b5654a"/>
  <text x="470" y="90" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#b5654a">作为营销话术</text>
  <text x="350" y="120" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 制造&quot;缺什么&quot;的焦虑</text>
  <text x="350" y="143" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 把医学项目包装成&quot;款&quot;</text>
  <text x="350" y="166" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 推动趋同化和过度消费</text>
  <text x="350" y="200" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">需要警惕的部分</text>

  <text x="320" y="245" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">本系列的目的：让你能用其工具性，识破其话术性</text>
</svg>