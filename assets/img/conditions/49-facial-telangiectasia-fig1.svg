<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t49f1 d49f1" role="img" viewBox="0 0 800 500"><title id="t49f1">面部红血丝的常见原因</title><desc id="d49f1">面部毛细血管扩张持续可见的红色细线与玫瑰痤疮日晒激素遗传相关</desc><defs><linearGradient id="bg49f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh49f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.card,.nodeTitle{fill:#2b2a28}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.card{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.step{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg49f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh49f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 49</text><text x="52" y="92" class="title">红血丝先找原因，再谈封血管</text><text x="52" y="116" class="kicker">毛细血管扩张是结果，背后原因决定处理顺序</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">五类常见原因</text><rect width="210" height="76" x="52" y="176" fill="#fbf0eb" stroke="#B5654A" rx="12"/><rect width="210" height="24" x="52" y="176" fill="#B5654A" rx="12"/><rect width="210" height="10" x="52" y="190" fill="#B5654A"/><text x="157" y="192" fill="#fff" class="card" text-anchor="middle">玫瑰痤疮</text><text x="64" y="218" class="small">鼻翼脸颊为主</text><text x="64" y="236" class="small">伴阵发潮红、丘疹</text><rect width="210" height="76" x="278" y="176" fill="#fbf5ea" stroke="#C9A876" rx="12"/><rect width="210" height="24" x="278" y="176" fill="#C9A876" rx="12"/><rect width="210" height="10" x="278" y="190" fill="#C9A876"/><text x="383" y="192" fill="#fff" class="card" text-anchor="middle">长期日晒</text><text x="290" y="218" class="small">高原、户外工作者</text><text x="290" y="236" class="small">光老化累积</text><rect width="210" height="76" x="504" y="176" fill="#fbf5ea" stroke="#C9A876" rx="12"/><rect width="210" height="24" x="504" y="176" fill="#C9A876" rx="12"/><rect width="210" height="10" x="504" y="190" fill="#C9A876"/><text x="609" y="192" fill="#fff" class="card" text-anchor="middle">激素使用</text><text x="516" y="218" class="small">长期外用激素</text><text x="516" y="236" class="small">激素依赖性皮炎</text><rect width="210" height="76" x="52" y="266" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="210" height="24" x="52" y="266" fill="#7A8B6F" rx="12"/><rect width="210" height="10" x="52" y="280" fill="#7A8B6F"/><text x="157" y="282" fill="#fff" class="card" text-anchor="middle">遗传体质</text><text x="64" y="308" class="small">皮肤薄、白皙</text><text x="64" y="326" class="small">家族聚集</text><rect width="210" height="76" x="278" y="266" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><rect width="210" height="24" x="278" y="266" fill="#7A8B6F" rx="12"/><rect width="210" height="10" x="278" y="280" fill="#7A8B6F"/><text x="383" y="282" fill="#fff" class="card" text-anchor="middle">物理与疾病</text><text x="290" y="308" class="small">冷热刺激、护肤不当</text><text x="290" y="326" class="small">结缔组织病</text><text x="52" y="372" class="nodeTitle">处理顺序</text><rect width="166" height="40" x="52" y="382" fill="#7A8B6F" rx="10"/><text x="135" y="398" class="step" text-anchor="middle">1 先诊断</text><text x="135" y="414" fill="#f1f7f1" class="step" font-size="11" text-anchor="middle">明确原因</text><rect width="166" height="40" x="230" y="382" fill="#7A8B6F" rx="10"/><text x="313" y="398" class="step" text-anchor="middle">2 控炎症</text><text x="313" y="414" fill="#f1f7f1" class="step" font-size="11" text-anchor="middle">先稳定活动期</text><rect width="166" height="40" x="408" y="382" fill="#C9A876" rx="10"/><text x="491" y="398" class="step" text-anchor="middle">3 后封闭</text><text x="491" y="414" fill="#fbf5ea" class="step" font-size="11" text-anchor="middle">光电封血管</text><rect width="166" height="40" x="586" y="382" fill="#5F6E54" rx="10"/><text x="669" y="398" class="step" text-anchor="middle">4 维护防晒</text><text x="669" y="414" fill="#f1f7f1" class="step" font-size="11" text-anchor="middle">减少复发</text><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">光电能改善，但先诊断和稳定炎症</text><text x="52" y="466" class="footer">健康科普示意 · 治疗方案须由医师面诊后制定</text></svg>