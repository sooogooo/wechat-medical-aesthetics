<svg xmlns="http://www.w3.org/2000/svg" aria-label="面部层次结构示意图" role="img" viewBox="0 0 640 400"><rect width="640" height="400" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">面部分层与注射风险区</text><g transform="translate(60,70)"><polygon fill="#f4ede0" stroke="#ddd6ca" points="0 0 200 0 230 20 30 20"/><polygon fill="#ede4d3" stroke="#ddd6ca" points="30 20 230 20 230 32 30 32"/><text x="115" y="16" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">表皮</text><polygon fill="#eef0ea" stroke="#ddd6ca" points="30 32 230 32 260 52 60 52"/><polygon fill="#e3e8dc" stroke="#ddd6ca" points="60 52 260 52 260 70 60 70"/><text x="145" y="48" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">真皮浅层</text><polygon fill="#dde4d6" stroke="#ddd6ca" points="60 70 260 70 290 90 90 90"/><polygon fill="#cdd8c0" stroke="#ddd6ca" points="90 90 290 90 290 112 90 112"/><text x="175" y="86" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">真皮深层（填充常用）</text><polygon fill="#c9d4be" stroke="#ddd6ca" points="90 112 290 112 320 132 120 132"/><polygon fill="#b5c5a8" stroke="#ddd6ca" points="120 132 320 132 320 162 120 162"/><text x="205" y="128" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">皮下脂肪层</text><polygon fill="#a8b6a0" stroke="#ddd6ca" points="120 162 320 162 350 182 150 182"/><polygon fill="#94a48a" stroke="#ddd6ca" points="150 182 350 182 350 206 150 206"/><text x="235" y="178" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">SMAS / 肌肉层</text><polygon fill="#7a8b6f" stroke="#5f6e54" points="150 206 350 206 380 226 180 226"/><rect width="200" height="20" x="180" y="226" fill="#5f6e54"/><text x="265" y="222" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">骨膜 / 骨</text></g><line x1="380" x2="430" y1="90" y2="90" stroke="#a8a39d" stroke-dasharray="2 2" stroke-width="1"/><circle cx="430" cy="90" r="5" fill="#7a8b6f"/><text x="445" y="86" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">真皮深层</text><text x="445" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">浅纹、细纹常用</text><line x1="380" x2="430" y1="150" y2="150" stroke="#a8a39d" stroke-dasharray="2 2" stroke-width="1"/><circle cx="430" cy="150" r="5" fill="#7a8b6f"/><text x="445" y="146" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">皮下脂肪层</text><text x="445" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">容积填充常用，血管丰富</text><line x1="380" x2="430" y1="200" y2="200" stroke="#a8a39d" stroke-dasharray="2 2" stroke-width="1"/><circle cx="430" cy="200" r="5" fill="#c9a876"/><text x="445" y="196" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">肌肉层</text><text x="445" y="210" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">肉毒注射目标</text><line x1="380" x2="430" y1="240" y2="240" stroke="#b5654a" stroke-dasharray="2 2" stroke-width="1.5"/><circle cx="430" cy="240" r="6" fill="#b5654a"/><text x="445" y="236" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">骨膜上</text><text x="445" y="250" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">支撑性填充，需精准</text><text x="320" y="380" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">层次因部位而异；血管在多个层次均有走行，是个体差异最大的风险因素</text></svg>