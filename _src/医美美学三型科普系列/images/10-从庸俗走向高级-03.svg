<svg xmlns="http://www.w3.org/2000/svg" aria-label="走向高级型自检清单" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">走向高级型：自检清单</text><rect width="580" height="200" x="30" y="60" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="50" y="88" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">✓ 这些信号说明你在走向高级型</text><text x="50" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">□ 我能说出&quot;想解决的具体问题&quot;，而非&quot;想变好看&quot;</text><text x="50" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">□ 我与医生直接沟通，而非只与咨询师</text><text x="50" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">□ 我拒绝了不适合的&quot;套餐&quot;或&quot;模板&quot;</text><text x="50" y="184" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">□ 我接受&quot;看不出做过&quot;的结果</text><text x="50" y="207" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">□ 我有停止标准和治疗档案</text><text x="50" y="230" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">□ 我追求&quot;耐看&quot;，不追逐&quot;流行&quot;</text><text x="50" y="253" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">□ 我对庸俗型的话术保持警惕</text><text x="320" y="272" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">每打一个勾，都意味着你向高级型靠近一步</text></svg>