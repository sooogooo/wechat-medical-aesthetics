<svg xmlns="http://www.w3.org/2000/svg" aria-label="选医生的硬指标清单" role="img" viewBox="0 0 680 380"><rect width="680" height="380" fill="#faf8f4" rx="12"/><text x="340" y="32" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">选注射医生：该看什么，别看什么</text><rect width="300" height="305" x="30" y="55" fill="#eef0ea" stroke="#7a8b6f" stroke-width="1.5" rx="10"/><rect width="300" height="38" x="30" y="55" fill="#7a8b6f" rx="10"/><rect width="300" height="10" x="30" y="83" fill="#7a8b6f"/><text x="180" y="80" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">✓ 该看的硬指标</text><text x="50" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 医师执业资格（临床 / 医疗美容科）</text><text x="50" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 执业范围与机构一致</text><text x="50" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 正规医疗机构执业许可证</text><text x="50" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 解剖功底与注射培训背景</text><text x="50" y="214" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 主动告知材料、风险、替代方案</text><text x="50" y="238" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 当面解释个体风险（结合部位）</text><text x="50" y="262" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 具备并发症识别与急救能力</text><text x="50" y="286" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 备有透明质酸酶等急救药品</text><text x="50" y="310" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 提供材料批号、可追溯</text><text x="50" y="334" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 不催促、不夸大、不打包票</text><rect width="300" height="305" x="350" y="55" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5" rx="10"/><rect width="300" height="38" x="350" y="55" fill="#b5654a" rx="10"/><rect width="300" height="10" x="350" y="83" fill="#b5654a"/><text x="500" y="80" fill="#fff" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">✗ 别被绕晕的噱头</text><text x="370" y="118" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• “院长”“首席”等自封头衔</text><text x="370" y="142" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 来路不明的“国际会员”</text><text x="370" y="166" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• “做过一万例”无法核实</text><text x="370" y="190" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 只展示精修过的案例图</text><text x="370" y="214" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 强调“进口设备”回避资质</text><text x="370" y="238" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• “咨询师”主导全程决策</text><text x="370" y="262" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• “保证满意”“零风险”</text><text x="370" y="286" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• “今天定下来有优惠”</text><text x="370" y="310" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 不说明材料品牌、批号</text><text x="370" y="334" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="12">• 回避风险讨论</text><text x="340" y="372" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">资质可在国家卫健委医师执业注册查询系统核实</text></svg>