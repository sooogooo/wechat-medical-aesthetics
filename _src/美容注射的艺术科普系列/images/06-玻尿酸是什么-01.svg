<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="护肤品与注射玻尿酸对比">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="32" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">同名，但完全不同</text>

  <!-- 左：护肤品 -->
  <rect x="30" y="55" width="280" height="200" rx="10" fill="#ffffff" stroke="#ece7df"/>
  <rect x="30" y="55" width="280" height="36" rx="10" fill="#c9a876"/>
  <rect x="30" y="81" width="280" height="10" fill="#c9a876"/>
  <text x="170" y="79" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">护肤品里的玻尿酸</text>
  <text x="50" y="118" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 非交联，游离分子</text>
  <text x="50" y="142" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 分子量大，主要停留在角质层</text>
  <text x="50" y="166" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 作用：表层保湿、软化</text>
  <text x="50" y="190" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 无法进入真皮，不能填充</text>
  <text x="50" y="214" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 反复涂抹，效果短暂</text>
  <text x="50" y="238" font-family="PingFang SC,sans-serif" font-size="11" fill="#8a7340">本质：化妆品成分</text>

  <!-- 右：注射 -->
  <rect x="330" y="55" width="280" height="200" rx="10" fill="#ffffff" stroke="#ece7df"/>
  <rect x="330" y="55" width="280" height="36" rx="10" fill="#7a8b6f"/>
  <rect x="330" y="81" width="280" height="10" fill="#7a8b6f"/>
  <text x="470" y="79" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">注射用透明质酸</text>
  <text x="350" y="118" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 经交联，形成三维网状结构</text>
  <text x="350" y="142" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 注射到真皮深层或皮下</text>
  <text x="350" y="166" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 作用：填充容积、支撑轮廓</text>
  <text x="350" y="190" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 维持数月到一年以上</text>
  <text x="350" y="214" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">• 可用透明质酸酶溶解</text>
  <text x="350" y="238" font-family="PingFang SC,sans-serif" font-size="11" fill="#5f6e54">本质：医疗器械，须有注册证</text>

  <text x="320" y="270" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">同名不代表同物——把注射当“深层补水”是常见误解</text>
</svg>