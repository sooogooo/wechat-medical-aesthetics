<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="妈生款的核心理念">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">妈生款 / 自然款的核心理念</text>

  <rect x="120" y="60" width="400" height="180" rx="12" fill="#eef0ea" stroke="#7a8b6f"/>
  <text x="320" y="100" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#5f6e54">&quot;看不出做过&quot;</text>
  <text x="320" y="130" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">= 最高赞美</text>
  <line x1="180" y1="145" x2="460" y2="145" stroke="#a8a39d" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="320" y="172" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 克制的剂量与设计</text>
  <text x="320" y="194" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 保留个人特征</text>
  <text x="320" y="216" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 不追求夸张变化</text>

  <text x="320" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">&quot;妈生&quot;——形容像妈妈天生给的，而不是医生做的</text>
</svg>