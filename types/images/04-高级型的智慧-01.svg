<svg xmlns="http://www.w3.org/2000/svg" aria-label="惊艳与耐看的对比" role="img" viewBox="0 0 640 300"><rect width="640" height="300" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">惊艳 vs 耐看：两种美的时效</text><text x="120" y="70" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">庸俗型追求：惊艳</text><line x1="50" x2="290" y1="220" y2="220" stroke="#a8a39d" stroke-width="1.5"/><line x1="50" x2="50" y1="90" y2="220" stroke="#a8a39d" stroke-width="1.5"/><text x="35" y="155" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle" transform="rotate(-90 35 155)">美感强度</text><path fill="none" stroke="#b5654a" stroke-width="2.5" d="M 50 215 Q 80 100 140 105 Q 200 115 260 180 Q 285 210 290 215"/><circle cx="140" cy="105" r="4" fill="#b5654a"/><text x="140" y="92" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">立刻惊艳</text><text x="270" y="240" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">时间 → 衰减快</text><text x="490" y="70" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">高级型追求：耐看</text><line x1="370" x2="610" y1="220" y2="220" stroke="#a8a39d" stroke-width="1.5"/><line x1="370" x2="370" y1="90" y2="220" stroke="#a8a39d" stroke-width="1.5"/><text x="355" y="155" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle" transform="rotate(-90 355 155)">美感强度</text><path fill="none" stroke="#7a8b6f" stroke-width="2.5" d="M 370 215 Q 410 150 470 130 Q 530 128 590 138"/><circle cx="470" cy="130" r="4" fill="#7a8b6f"/><text x="470" y="117" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">渐入佳境</text><text x="590" y="240" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">时间 → 稳定持久</text><text x="320" y="280" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">惊艳曲线：高开低走，随时间衰减；耐看曲线：渐升稳定，经得起打量</text></svg>