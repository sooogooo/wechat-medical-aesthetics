<svg xmlns="http://www.w3.org/2000/svg" aria-label="肉毒杆菌素作用机制示意" role="img" viewBox="0 0 640 320"><rect width="640" height="320" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">肉毒如何让肌肉放松</text><rect width="260" height="230" x="40" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="170" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">正常状态</text><rect width="100" height="20" x="120" y="110" fill="#7a8b6f" rx="4"/><text x="170" y="124" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">神经末梢</text><circle cx="140" cy="150" r="5" fill="#c9a876"/><circle cx="160" cy="152" r="5" fill="#c9a876"/><circle cx="180" cy="150" r="5" fill="#c9a876"/><text x="245" y="154" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="9">乙酰胆碱释放</text><rect width="140" height="40" x="100" y="180" fill="#b5654a" rx="6"/><text x="170" y="204" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">肌肉收缩 → 皱纹出现</text><text x="170" y="265" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">神经信号传导 → 肌肉动</text><polygon fill="#a8a39d" points="320 175 340 165 340 185"/><text x="320" y="155" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">注射肉毒</text><rect width="260" height="230" x="350" y="60" fill="#fff" stroke="#ece7df" rx="8"/><text x="480" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">注射肉毒后</text><rect width="100" height="20" x="430" y="110" fill="#7a8b6f" opacity=".6" rx="4"/><text x="480" y="124" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">神经末梢</text><line x1="430" x2="530" y1="150" y2="150" stroke="#b5654a" stroke-width="2"/><circle cx="450" cy="150" r="5" fill="#c9a876" opacity=".3"/><circle cx="470" cy="152" r="5" fill="#c9a876" opacity=".3"/><text x="555" y="154" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="9">释放被阻断</text><rect width="140" height="40" x="410" y="180" fill="#7a8b6f" rx="6"/><text x="480" y="204" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">肌肉放松 → 皱纹减轻</text><text x="480" y="265" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">信号被阻断 → 肌肉不动</text><text x="320" y="310" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">机制示意；效果在注射后数天到两周渐进出现，维持 3–6 个月</text></svg>