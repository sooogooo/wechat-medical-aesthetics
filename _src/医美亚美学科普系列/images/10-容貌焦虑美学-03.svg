<svg xmlns="http://www.w3.org/2000/svg" aria-label="容貌焦虑的代价" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">容貌焦虑带走的，不只是钱</text><rect width="185" height="150" x="30" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="122" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">心理代价</text><text x="122" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">长期不满足</text><text x="122" y="133" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">自卑、抑郁倾向</text><text x="122" y="151" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">社交回避</text><text x="122" y="180" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">自我价值感低</text><rect width="185" height="150" x="227" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="320" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">经济代价</text><text x="320" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">反复消费</text><text x="320" y="133" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">累计花费巨大</text><text x="320" y="151" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">超出承受能力</text><text x="320" y="180" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">负债风险</text><rect width="185" height="150" x="424" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="516" y="88" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" text-anchor="middle">身体代价</text><text x="516" y="115" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">过度治疗</text><text x="516" y="133" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">并发症风险</text><text x="516" y="151" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不可逆后悔</text><text x="516" y="180" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">体象障碍风险</text><text x="320" y="225" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">焦虑驱动的医美，几乎注定无法带来真正的满足</text></svg>