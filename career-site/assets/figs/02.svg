<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p1" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2f4858" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#2f4858" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">消费的嘴，医疗的手</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">医美这个生意最底层的结构矛盾</text><rect width="240" height="200" x="60" y="120" fill="#edf1f4" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="180" y="158" fill="#2f4858" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600" text-anchor="middle">消费的嘴</text><text x="180" y="196" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" text-anchor="middle">流量 · 低价 · 标准化</text><text x="180" y="226" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">电商获客 · ROI 一比一</text><text x="180" y="256" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">拼规模 · 拼转化</text><rect width="240" height="200" x="500" y="120" fill="#edf1f4" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="620" y="158" fill="#2f4858" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600" text-anchor="middle">医疗的手</text><text x="620" y="196" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" text-anchor="middle">医生 · 个性化 · 手艺</text><text x="620" y="226" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">容错率最低 · 不可逆</text><text x="620" y="256" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">稀缺资源 · 不可扩容</text><line x1="320" x2="480" y1="220" y2="220" stroke="#2f4858" stroke-dasharray="5 5" stroke-width="1.8"/><text x="400" y="200" fill="#2f4858" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="600" text-anchor="middle">结构矛盾</text><text x="400" y="244" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" text-anchor="middle">两端长在一具身体上</text><rect width="170" height="44" x="120" y="366" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="205" y="393" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" text-anchor="middle">价值悖论</text><rect width="170" height="44" x="315" y="366" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="400" y="393" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" text-anchor="middle">传播悖论</text><rect width="170" height="44" x="510" y="366" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="595" y="393" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" text-anchor="middle">生态悖论</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">嘴可以没有手，手不依赖嘴，大厂人的岗位多在嘴端</text></svg>