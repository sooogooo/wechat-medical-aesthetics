<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="不同 code 的血管风险等级">
  <rect width="640" height="360" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">codes 的血管风险分级（示意）</text>

  <!-- 高危区 -->
  <rect x="30" y="60" width="185" height="270" rx="8" fill="#f7ece6" stroke="#b5654a" stroke-width="1.5"/>
  <rect x="30" y="60" width="185" height="36" rx="8" fill="#b5654a"/>
  <rect x="30" y="86" width="185" height="10" fill="#b5654a"/>
  <text x="122" y="84" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">高危 codes</text>
  <text x="45" y="120" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#b5654a">与眼动脉交通</text>
  <text x="45" y="145" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 鼻部相关 code</text>
  <text x="45" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 眉间相关 code</text>
  <text x="45" y="185" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 额头相关 code（F）</text>
  <text x="45" y="205" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 鼻唇沟（Nl）</text>
  <text x="45" y="240" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">栓塞后果重：</text>
  <text x="45" y="258" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">皮肤坏死、失明</text>
  <text x="45" y="285" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#b5654a">须备酶、懂解剖</text>

  <!-- 中危区 -->
  <rect x="227" y="60" width="185" height="270" rx="8" fill="#f4ede0" stroke="#c9a876" stroke-width="1.5"/>
  <rect x="227" y="60" width="185" height="36" rx="8" fill="#c9a876"/>
  <rect x="227" y="86" width="185" height="10" fill="#c9a876"/>
  <text x="320" y="84" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">中危 codes</text>
  <text x="242" y="120" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#8a7340">血管较丰富</text>
  <text x="242" y="145" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 颞部（T）</text>
  <text x="242" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 眼周（E）</text>
  <text x="242" y="185" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 面颊（Ck 浅层）</text>
  <text x="242" y="205" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 下颌线（Jw）</text>
  <text x="242" y="240" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">深层骨面相对安全</text>
  <text x="242" y="258" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">浅层风险升高</text>
  <text x="242" y="285" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#8a7340">层次精准是关键</text>

  <!-- 低危区 -->
  <rect x="424" y="60" width="185" height="270" rx="8" fill="#eef0ea" stroke="#7a8b6f" stroke-width="1.5"/>
  <rect x="424" y="60" width="185" height="36" rx="8" fill="#7a8b6f"/>
  <rect x="424" y="86" width="185" height="10" fill="#7a8b6f"/>
  <text x="516" y="84" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#ffffff">相对低危 codes</text>
  <text x="439" y="120" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#5f6e54">血管相对稀疏</text>
  <text x="439" y="145" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 颊部深层（Ck1 骨面）</text>
  <text x="439" y="165" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 颏部深层（C 骨面）</text>
  <text x="439" y="185" font-family="PingFang SC,sans-serif" font-size="11" fill="#2b2a28">• 部分下颌深点</text>
  <text x="439" y="240" font-family="PingFang SC,sans-serif" font-size="10" fill="#5f6e54">深层骨面注射</text>
  <text x="439" y="258" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">相对安全</text>
  <text x="439" y="285" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" fill="#5f6e54">仍需规范操作</text>

  <text x="320" y="345" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">风险分级是相对的；任何 code 都不能掉以轻心，规范操作是底线</text>
</svg>