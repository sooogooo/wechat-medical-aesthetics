<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif" viewBox="0 0 800 500"><marker id="ah-p3" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#b5654a" d="M0,0 L10,5 L0,10 z"/></marker><rect width="800" height="500" x="0" y="0" fill="#fffdf9"/><rect width="752" height="452" x="24" y="24" fill="#fff" stroke="#e4ddd2" rx="12"/><rect width="4" height="46" x="24" y="24" fill="#b5654a" rx="2"/><text x="46" y="46" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600">和医生共事，先读懂六条</text><text x="46" y="70" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5">医生群体行为逻辑的结构来源</text><rect width="216" height="96" x="60" y="120" fill="#f8f2f0" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="168" y="164" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">容错率最低</text><text x="168" y="190" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">结果在脸上体表</text><rect width="216" height="96" x="296" y="120" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="404" y="164" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">各种学霸</text><text x="404" y="190" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">理性用在了专业上</text><rect width="216" height="96" x="532" y="120" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="640" y="164" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">尊严与金钱打架</text><text x="640" y="190" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">尊严赢</text><rect width="216" height="96" x="60" y="238" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="168" y="282" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">胆子小</text><text x="168" y="308" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">是行业淘汰出来的</text><rect width="216" height="96" x="296" y="238" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="404" y="282" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">手艺人</text><text x="404" y="308" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">凭技术吃饭</text><rect width="216" height="96" x="532" y="238" fill="#fff" stroke="#e4ddd2" stroke-width="1.4" rx="8"/><text x="640" y="282" fill="#2b2a28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">活在当下</text><text x="640" y="308" fill="#6b6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" text-anchor="middle">营销要快速见效</text><text x="400" y="396" fill="#b5654a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" text-anchor="middle">行业结构塑形的结果，不是性格缺陷清单</text><text x="46" y="460" fill="#a8a39d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5">摆正位置，快速见效，事实说话，永远不来硬的</text></svg>