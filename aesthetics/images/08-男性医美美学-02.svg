<svg xmlns="http://www.w3.org/2000/svg" aria-label="男性医美的耻感来源" role="img" viewBox="0 0 640 240"><rect width="640" height="240" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">&quot;男生不该 do 脸&quot;的压力从哪来</text><rect width="580" height="50" x="30" y="60" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="320" y="82" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">性别规训：&quot;真男人不该在意外表&quot;</text><text x="320" y="100" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">把&quot;在意仪表&quot;等同于&quot;不够男性化&quot;</text><rect width="580" height="50" x="30" y="120" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="320" y="142" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">污名化：&quot;做医美的男人&quot;被嘲讽</text><text x="320" y="160" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">&quot;娘&quot;&quot;虚荣&quot;&quot;不实在&quot;等标签</text><rect width="580" height="40" x="30" y="180" fill="#f4ede0" stroke="#c9a876" rx="6"/><text x="320" y="205" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">结果：男性医美常在隐蔽中进行，不敢公开讨论，反而增加风险决策的可能</text></svg>