<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="传统注射与MD Codes思路对比">
  <rect width="720" height="360" fill="#faf8f4" rx="12"/>
  <text x="360" y="34" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">两种注射思维的对比</text>

  <!-- 左：传统思路 -->
  <rect x="30" y="60" width="320" height="270" rx="10" fill="#ffffff" stroke="#e3c9bd" stroke-width="1.5"/>
  <rect x="30" y="60" width="320" height="44" rx="10" fill="#b5654a"/>
  <rect x="30" y="94" width="320" height="10" fill="#b5654a"/>
  <text x="190" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">传统思路：哪里凹填哪里</text>

  <!-- 简化脸 + 凹点 -->
  <ellipse cx="190" cy="180" rx="60" ry="75" fill="#f3efe8" stroke="#a8a39d"/>
  <circle cx="165" cy="200" r="8" fill="#b5654a" opacity="0.6"/>
  <circle cx="215" cy="200" r="8" fill="#b5654a" opacity="0.6"/>
  <circle cx="190" cy="230" r="8" fill="#b5654a" opacity="0.6"/>
  <text x="190" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">凭直觉补洞</text>
  <text x="50" y="315" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 治标不治本</text>
  <text x="50" y="335" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 局部堆积易显假</text>

  <!-- 右：MD Codes 思路 -->
  <rect x="370" y="60" width="320" height="270" rx="10" fill="#ffffff" stroke="#7a8b6f" stroke-width="1.5"/>
  <rect x="370" y="60" width="320" height="44" rx="10" fill="#7a8b6f"/>
  <rect x="370" y="94" width="320" height="10" fill="#7a8b6f"/>
  <text x="530" y="88" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#ffffff">MD Codes：编码注射</text>

  <!-- 简化脸 + 编码格子 -->
  <ellipse cx="530" cy="180" rx="60" ry="75" fill="#f3efe8" stroke="#a8a39d"/>
  <rect x="510" y="150" width="20" height="18" rx="3" fill="#7a8b6f" opacity="0.5"/>
  <rect x="530" y="150" width="20" height="18" rx="3" fill="#7a8b6f" opacity="0.5"/>
  <rect x="500" y="175" width="20" height="18" rx="3" fill="#8a9a7f" opacity="0.5"/>
  <rect x="540" y="175" width="20" height="18" rx="3" fill="#8a9a7f" opacity="0.5"/>
  <rect x="520" y="205" width="20" height="18" rx="3" fill="#c9a876" opacity="0.5"/>
  <text x="530" y="290" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" fill="#2b2a28">按编码系统重建</text>
  <text x="390" y="315" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 针对根源，整体协调</text>
  <text x="390" y="335" font-family="PingFang SC,sans-serif" font-size="11" fill="#6b6864">• 可复现、可沟通、可控</text>
</svg>