<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="应暂缓或停止注射的情况">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">这些情况，建议暂缓或停止</text>

  <rect x="30" y="55" width="185" height="115" rx="8" fill="#ffffff" stroke="#c9a876"/>
  <text x="122" y="82" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#8a7340">情绪不稳</text>
  <text x="45" y="108" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">重大生活变故、</text>
  <text x="45" y="124" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">情绪低落期间</text>
  <text x="45" y="148" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">不要在情绪中</text>
  <text x="45" y="162" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">做不可逆决定</text>

  <rect x="227" y="55" width="185" height="115" rx="8" fill="#ffffff" stroke="#b5654a"/>
  <text x="320" y="82" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">体象困扰</text>
  <text x="45" y="0" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864"/>
  <text x="242" y="108" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">对微小缺陷过度</text>
  <text x="242" y="124" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">关注、反复注射</text>
  <text x="242" y="148" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">仍不满意</text>
  <text x="242" y="162" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">→ 需心理评估</text>

  <rect x="424" y="55" width="185" height="115" rx="8" fill="#ffffff" stroke="#b5654a"/>
  <text x="516" y="82" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">过度累积</text>
  <text x="439" y="108" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">已经多次注射、</text>
  <text x="439" y="124" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">开始显假、显宽</text>
  <text x="439" y="148" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">→ 应停止叠加</text>
  <text x="439" y="162" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">  必要时溶解</text>

  <rect x="30" y="185" width="185" height="115" rx="8" fill="#ffffff" stroke="#7a8b6f"/>
  <text x="122" y="212" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">问题不适合</text>
  <text x="45" y="238" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">严重松弛需手术、</text>
  <text x="45" y="254" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">骨性问题、脂肪</text>
  <text x="45" y="278" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">→ 用对手段</text>
  <text x="45" y="292" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">  而非硬打</text>

  <rect x="227" y="185" width="185" height="115" rx="8" fill="#ffffff" stroke="#7a8b6f"/>
  <text x="320" y="212" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">预期不合理</text>
  <text x="242" y="238" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">期待&quot;换脸&quot;&quot;完美&quot;</text>
  <text x="242" y="254" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">&quot;解决人生问题&quot;</text>
  <text x="242" y="278" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">→ 调整预期</text>
  <text x="242" y="292" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">  再考虑</text>

  <rect x="424" y="185" width="185" height="115" rx="8" fill="#ffffff" stroke="#7a8b6f"/>
  <text x="516" y="212" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#5f6e54">健康状况</text>
  <text x="439" y="238" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">妊娠/哺乳、活动</text>
  <text x="439" y="254" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">感染、自身免疫病</text>
  <text x="439" y="278" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">→ 等待或禁忌</text>

  <text x="320" y="315" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="9" fill="#a8a39d">识别这些情况，比知道“该打什么”更重要</text>
</svg>