<svg xmlns="http://www.w3.org/2000/svg" aria-label="部位与材料硬度匹配图" role="img" viewBox="0 0 660 340"><rect width="660" height="340" fill="#faf8f4" rx="12"/><text x="330" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">不同部位，需要不同硬度</text><rect width="560" height="6" x="50" y="200" fill="#e3e8dc" rx="3"/><text x="50" y="230" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">柔软易铺展</text><text x="610" y="230" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">坚硬高支撑</text><circle cx="90" cy="203" r="9" fill="#a8b6a0"/><text x="90" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">唇部</text><text x="90" y="260" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">极柔软、活动频繁</text><text x="90" y="276" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需低粘弹性</text><circle cx="180" cy="203" r="9" fill="#9aab93"/><text x="180" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">泪沟</text><text x="180" y="260" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">皮肤薄、易透光</text><text x="180" y="276" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需小粒径</text><circle cx="280" cy="203" r="9" fill="#8a9a7f"/><text x="280" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">法令纹</text><text x="280" y="260" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">动态皱褶</text><text x="280" y="276" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需中等支撑</text><circle cx="380" cy="203" r="9" fill="#7a8b6f"/><text x="380" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">苹果肌</text><text x="380" y="260" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需容积与支撑</text><text x="380" y="276" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">深层提升</text><circle cx="490" cy="203" r="9" fill="#5f6e54"/><text x="490" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">鼻梁</text><text x="490" y="260" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需塑形支撑</text><text x="490" y="276" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">高粘弹性、高危血管</text><circle cx="580" cy="203" r="9" fill="#4a5840"/><text x="580" y="180" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">下巴</text><text x="580" y="260" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需坚硬支撑</text><text x="580" y="276" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">抗变形</text><rect width="560" height="30" x="50" y="295" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="330" y="315" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">⚠ 鼻部、眉间、额头是高危血管区，型号选择和层次精准都至关重要</text></svg>