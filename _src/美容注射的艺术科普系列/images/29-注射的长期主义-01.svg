<svg xmlns="http://www.w3.org/2000/svg" aria-label="两种注射路径对比" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">两种长期路径，两种走向</text><rect width="280" height="180" x="30" y="55" fill="#f7ece6" stroke="#e3c9bd" rx="8"/><text x="170" y="85" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">× 短期消费视角</text><text x="50" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 不同机构、不同医生</text><text x="50" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 无记录、不知道打了什么</text><text x="50" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 每次“再加一点”</text><text x="50" y="184" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 追求单次最大化</text><text x="50" y="207" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 没有停止标准</text><text x="50" y="228" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">→ 走向过度、假面</text><rect width="280" height="180" x="330" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="470" y="85" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✓ 长期管理视角</text><text x="350" y="115" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 相对固定的医生</text><text x="350" y="138" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 完整的注射档案</text><text x="350" y="161" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 遵循材料节奏</text><text x="350" y="184" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 设立停止标准</text><text x="350" y="207" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">• 定期冷静评估</text><text x="350" y="228" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600">→ 长期自然、可控</text><text x="320" y="252" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">“长期主义”不是打得更多，而是打得更可控</text></svg>