<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title0401 desc0401">
  <title id="title0401">四级手术的费用由什么构成</title>
  <desc id="desc0401">术前评估、麻醉、手术耗材、住院监护、术后管理五大硬成本构成</desc>
  <defs>
    <linearGradient id="bg0401" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh0401" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 22px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg0401)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh0401)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 04</text>
  <text x="62" y="117" class="title">四级手术的费用由什么构成</text>
  <text x="62" y="153" class="kicker">看懂钱花在哪，比只比总价更能避坑</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <text x="62" y="216" class="nodeTitle" font-size="19">五大硬成本，缺一不可</text>

  <!-- 5个成本块，水平排列 -->
  <!-- 块1：术前评估 -->
  <rect x="62" y="232" width="148" height="200" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="136" cy="270" r="20" fill="#0072B2"/>
  <text x="136" y="278" class="num" text-anchor="middle">1</text>
  <text x="136" y="312" class="nodeTitle" text-anchor="middle">术前评估</text>
  <text x="136" y="340" class="body" text-anchor="middle">影像检查</text>
  <text x="136" y="362" class="body" text-anchor="middle">血液化验</text>
  <text x="136" y="384" class="body" text-anchor="middle">心电图</text>
  <text x="136" y="406" class="body" text-anchor="middle">麻醉评估</text>
  <rect x="76" y="416" width="120" height="16" rx="4" fill="#eef6f8"/>
  <text x="136" y="429" class="small" text-anchor="middle">制定方案基础</text>

  <!-- 块2：麻醉 -->
  <rect x="220" y="232" width="148" height="200" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="294" cy="270" r="20" fill="#E69F00"/>
  <text x="294" y="278" class="num" text-anchor="middle">2</text>
  <text x="294" y="312" class="nodeTitle" text-anchor="middle">麻醉费用</text>
  <text x="294" y="340" class="body" text-anchor="middle">专业麻醉科</text>
  <text x="294" y="362" class="body" text-anchor="middle">全程监护</text>
  <text x="294" y="384" class="body" text-anchor="middle">麻醉药品</text>
  <text x="294" y="406" class="body" text-anchor="middle">不可省</text>
  <rect x="234" y="416" width="120" height="16" rx="4" fill="#fdf3e3"/>
  <text x="294" y="429" class="small" text-anchor="middle">四级多为全麻</text>

  <!-- 块3：手术耗材 -->
  <rect x="378" y="232" width="148" height="200" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="452" cy="270" r="20" fill="#0072B2"/>
  <text x="452" y="278" class="num" text-anchor="middle">3</text>
  <text x="452" y="312" class="nodeTitle" text-anchor="middle">手术耗材</text>
  <text x="452" y="340" class="body" text-anchor="middle">主刀助手费</text>
  <text x="452" y="362" class="body" text-anchor="middle">植入物</text>
  <text x="452" y="384" class="body" text-anchor="middle">钛板钛钉</text>
  <text x="452" y="406" class="body" text-anchor="middle">特殊器械</text>
  <rect x="392" y="416" width="120" height="16" rx="4" fill="#eef6f8"/>
  <text x="452" y="429" class="small" text-anchor="middle">应有注册证号</text>

  <!-- 块4：住院监护 -->
  <rect x="536" y="232" width="148" height="200" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="610" cy="270" r="20" fill="#E69F00"/>
  <text x="610" y="278" class="num" text-anchor="middle">4</text>
  <text x="610" y="312" class="nodeTitle" text-anchor="middle">住院监护</text>
  <text x="610" y="340" class="body" text-anchor="middle">术后观察</text>
  <text x="610" y="362" class="body" text-anchor="middle">护理</text>
  <text x="610" y="384" class="body" text-anchor="middle">ICU 或</text>
  <text x="610" y="406" class="body" text-anchor="middle">过渡监护</text>
  <rect x="550" y="416" width="120" height="16" rx="4" fill="#fdf3e3"/>
  <text x="610" y="429" class="small" text-anchor="middle">气道 · 血肿监护</text>

  <!-- 块5：术后管理 -->
  <rect x="694" y="232" width="144" height="200" rx="14" fill="#fdf1ee" stroke="#D55E00" stroke-width="2"/>
  <circle cx="766" cy="270" r="20" fill="#D55E00"/>
  <text x="766" y="278" class="num" text-anchor="middle">5</text>
  <text x="766" y="312" class="nodeTitle" text-anchor="middle">术后管理</text>
  <text x="766" y="340" class="body" text-anchor="middle">抗感染消肿</text>
  <text x="766" y="362" class="body" text-anchor="middle">拆线</text>
  <text x="766" y="384" class="body" text-anchor="middle">影像复查</text>
  <text x="766" y="406" class="body" text-anchor="middle">并发症处理</text>
  <rect x="708" y="416" width="116" height="16" rx="4" fill="#fbeae3"/>
  <text x="766" y="429" class="small" text-anchor="middle">复诊路径</text>

  <!-- 提示框 -->
  <rect x="62" y="450" width="776" height="62" rx="12" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5"/>
  <text x="82" y="475" class="body" font-weight="700" fill="#17323d">低价必然在某环节被压缩</text>
  <text x="82" y="498" class="small">省术前检查 · 用低质植入物 · 咨询师替代医生主刀 · 术后管理甩给患者自理——便宜是把风险转嫁给患者</text>

  <rect x="62" y="525" width="776" height="40" rx="12" fill="#eef6f8"/>
  <text x="450" y="551" class="quote" text-anchor="middle">让机构把费用拆开列清单，比接受模糊打包更安全</text>

  <text x="62" y="582" class="footer">医学教育示意 · 本文不构成具体价格建议，市场价格以实地咨询和官方渠道为准</text>
</svg>
