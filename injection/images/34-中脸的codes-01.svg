<svg xmlns="http://www.w3.org/2000/svg" aria-label="中脸 Ck codes 协作示意" role="img" viewBox="0 0 640 340"><rect width="640" height="340" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" text-anchor="middle">苹果肌（Ck）的协作 codes</text><ellipse cx="320" cy="180" fill="#f3efe8" stroke="#a8a39d" rx="130" ry="110"/><circle cx="285" cy="165" r="18" fill="#5f6e54" opacity=".5"/><text x="285" y="169" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ck1</text><line x1="285" x2="180" y1="165" y2="100" stroke="#a8a39d" stroke-width="1"/><text x="100" y="95" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">Ck1 颧骨前</text><text x="100" y="112" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">深层支撑核心</text><circle cx="355" cy="165" r="18" fill="#7a8b6f" opacity=".5"/><text x="355" y="169" fill="#fff" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ck2</text><line x1="355" x2="460" y1="165" y2="100" stroke="#a8a39d" stroke-width="1"/><text x="470" y="95" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">Ck2 颧弓侧</text><text x="470" y="112" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">外侧衔接</text><circle cx="380" cy="210" r="16" fill="#8a9a7f" opacity=".5"/><text x="380" y="214" fill="#fff" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ck3</text><line x1="380" x2="490" y1="210" y2="240" stroke="#a8a39d" stroke-width="1"/><text x="500" y="235" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">Ck3 颊侧</text><text x="500" y="252" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">面颊凹陷</text><ellipse cx="270" cy="230" fill="#c9a876" opacity=".4" rx="10" ry="18"/><text x="270" y="234" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Nl</text><line x1="270" x2="160" y1="230" y2="270" stroke="#a8a39d" stroke-width="1"/><text x="80" y="265" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600">Nl 鼻唇沟</text><text x="80" y="282" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10">法令纹修饰</text><text x="320" y="315" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">几个 Ck 协作 + Nl 修饰，才能实现中面部整体的年轻化</text><text x="320" y="332" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">图为示意；具体 code 数量与定位以 MD Codes 体系为准</text></svg>