<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleB102 descB102">
  <title id="titleB102">术式不是选出来的，是松出来的</title>
  <desc id="descB102">按松弛程度递进的术式选择，迷你型到环形、倒 T 型</desc>
  <defs>
    <marker id="ahB102" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · B1</text>
  <text x="62" y="112" class="title">术式不是选出来的，是松出来的</text>
  <text x="62" y="148" class="kicker">松弛范围越大，需要的术式越广</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>

  <line x1="62" y1="478" x2="832" y2="478" stroke="#e3e9ea" stroke-width="1"/>

  <rect x="62" y="378" width="170" height="100" rx="8" fill="none" stroke="#0072B2" stroke-width="1.2"/>
  <text x="147" y="366" class="midTitle" text-anchor="middle" style="fill:#0072B2">迷你型</text>
  <text x="147" y="412" class="body" text-anchor="middle">下腹局限松弛</text>
  <line x1="236" y1="392" x2="252" y2="352" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahB102)"/>

  <rect x="258" y="338" width="170" height="140" rx="8" fill="none" stroke="#0B8A6B" stroke-width="1.2"/>
  <text x="343" y="326" class="midTitle" text-anchor="middle" style="fill:#0B8A6B">标准型</text>
  <text x="343" y="372" class="body" text-anchor="middle">全前腹＋肌分离</text>
  <line x1="432" y1="352" x2="448" y2="312" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahB102)"/>

  <rect x="454" y="298" width="170" height="180" rx="8" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="539" y="286" class="midTitle" text-anchor="middle" style="fill:#D9930D">延伸型</text>
  <text x="539" y="332" class="body" text-anchor="middle">延及侧腰</text>
  <line x1="628" y1="312" x2="644" y2="272" stroke="#b7c6cb" stroke-width="1.2" marker-end="url(#ahB102)"/>

  <rect x="650" y="258" width="170" height="220" rx="8" fill="none" stroke="#C75B00" stroke-width="1.2"/>
  <text x="735" y="246" class="midTitle" text-anchor="middle" style="fill:#C75B00">环形／倒 T</text>
  <text x="735" y="292" class="body" text-anchor="middle">整圈或两向过剩</text>
  <text x="450" y="506" class="small" text-anchor="middle">术式由松弛范围决定，不是越大越好，也不是想小就能小</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">术式由松弛范围决定，不是想小就能小</text>
  <text x="62" y="580" class="footer">医学教育示意 · 术式由松弛范围决定，非个人意愿选择</text>
</svg>
