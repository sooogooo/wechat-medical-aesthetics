<svg xmlns="http://www.w3.org/2000/svg" aria-label="下面部宽大的三种来源" role="img" viewBox="0 0 640 280"><rect width="640" height="280" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">脸方/脸宽，可能是这三种</text><rect width="185" height="190" x="30" y="55" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="122" cy="150" fill="#f3efe8" stroke="#a8a39d" rx="48" ry="62"/><ellipse cx="85" cy="170" fill="#7a8b6f" opacity=".7" rx="14" ry="20"/><ellipse cx="160" cy="170" fill="#7a8b6f" opacity=".7" rx="14" ry="20"/><text x="122" y="80" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">咬肌肥厚</text><text x="122" y="230" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">咬牙时耳前鼓起</text><text x="122" y="246" fill="#7a8b6f" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">肉毒有效</text><rect width="185" height="190" x="227" y="55" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="320" cy="150" fill="#eef0ea" stroke="#a8a39d" rx="54" ry="66"/><ellipse cx="320" cy="160" fill="#e3e8dc" opacity=".7" rx="48" ry="58"/><text x="320" y="80" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">脂肪堆积</text><text x="320" y="230" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">捏得起软组织</text><text x="320" y="246" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">减脂/吸脂</text><rect width="185" height="190" x="424" y="55" fill="#fff" stroke="#ece7df" rx="8"/><ellipse cx="516" cy="150" fill="#f3efe8" stroke="#a8a39d" rx="48" ry="62"/><path fill="none" stroke="#5f6e54" stroke-width="3" d="M 470 175 Q 516 195 562 175"/><path fill="none" stroke="#5f6e54" stroke-width="2" d="M 468 150 Q 516 165 564 150"/><text x="516" y="80" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">骨性宽大</text><text x="516" y="230" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">摸到硬的骨性轮廓</text><text x="516" y="246" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">需要手术</text><text x="320" y="265" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">判断方法：咬紧牙关，摸耳前下方——鼓起的硬块是咬肌</text></svg>