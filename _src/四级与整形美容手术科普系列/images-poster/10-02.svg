<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title1002 desc1002" role="img" viewBox="0 0 900 620"><title id="title1002">急救能力核实清单</title><desc id="desc1002">面诊时直接问的急救能力问题，能正面回答的才值得考虑</desc><defs><linearGradient id="bg1002" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh1002" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg1002)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh1002)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 10</text><text x="62" y="117" class="title">急救能力核实清单</text><text x="62" y="153" class="kicker">面诊时直接问，能正面回答并展示配置的才值得考虑</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><rect width="450" height="295" x="62" y="210" fill="#f8fbfb" stroke="#0072B2" stroke-width="2" rx="14"/><rect width="450" height="40" x="62" y="210" fill="#0072B2" rx="14"/><rect width="450" height="14" x="62" y="236" fill="#0072B2"/><text x="82" y="237" fill="#fff" class="nodeTitle">面诊直接问的四个问题</text><text x="82" y="280" class="body" font-weight="700">① 监护</text><text x="82" y="302" class="body">术中术后由谁监护？麻醉科常驻还是外请？</text><text x="82" y="334" class="body" font-weight="700">② 血备</text><text x="82" y="356" class="body">有没有血库或可靠备血渠道？大出血怎么办？</text><text x="82" y="388" class="body" font-weight="700">③ 术后观察</text><text x="82" y="410" class="body">术后在哪观察、监护多久？气道问题怎么发现处理？</text><text x="82" y="442" class="body" font-weight="700">④ 转诊</text><text x="82" y="464" class="body">转诊通道怎样？最近有抢救能力的医院在哪？</text><rect width="410" height="18" x="82" y="478" fill="#eef6f8" rx="6"/><text x="287" y="491" class="small" text-anchor="middle">回避或答&quot;放心不会出事&quot;＝最没能力应对</text><rect width="314" height="295" x="524" y="210" fill="#fff8ee" stroke="#E69F00" stroke-width="2" rx="14"/><rect width="314" height="40" x="524" y="210" fill="#E69F00" rx="14"/><rect width="314" height="14" x="524" y="236" fill="#E69F00"/><text x="544" y="237" fill="#fff" class="nodeTitle">应能展示的配置</text><circle cx="554" cy="280" r="5" fill="#E69F00"/><text x="570" y="285" class="body">监护室 / 过渡监护</text><circle cx="554" cy="314" r="5" fill="#E69F00"/><text x="570" y="319" class="body">血备记录</text><circle cx="554" cy="348" r="5" fill="#E69F00"/><text x="570" y="353" class="body">气道管理设备</text><circle cx="554" cy="382" r="5" fill="#E69F00"/><text x="570" y="387" class="body">转诊协议</text><circle cx="554" cy="416" r="5" fill="#E69F00"/><text x="570" y="421" class="body">常驻麻醉科医生</text><rect width="274" height="50" x="544" y="442" fill="#fdf3e3" rx="8"/><text x="681" y="463" class="small" text-anchor="middle">这些是四级手术资质的</text><text x="681" y="481" class="small" text-anchor="middle">硬件要求本身就是为风险准备的</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">案例再多但出事救不了的机构，对那一台出事者就是 100% 灾难</text><text x="62" y="582" class="footer">医学教育示意，非教学图 · 急救能力是颌面四级手术机构的底线，不是加分项</text></svg>