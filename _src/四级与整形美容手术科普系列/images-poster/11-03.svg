<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1103 desc1103">
  <title id="title1103">腹壁成形术的疤痕现实</title>
  <desc id="desc1103">腹壁成形术必然留下下腹部横行疤痕，可能增生变宽，是决策核心</desc>
  <defs>
    <linearGradient id="bg1103" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1103" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .num { font: 700 28px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1103)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1103)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 11</text>
  <text x="62" y="117" class="title">腹壁成形必然留疤：接受度是决策核心</text>
  <text x="62" y="153" class="kicker">宣传不留疤的，都不诚实</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左侧：疤痕事实清单 -->
  <text x="62" y="216" class="nodeTitle">疤痕的现实</text>
  <rect x="62" y="230" width="400" height="270" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="100" cy="265" r="6" fill="#E69F00"/>
  <text x="118" y="270" class="body">下腹部横行切口，长十几到几十厘米</text>
  <circle cx="100" cy="300" r="6" fill="#E69F00"/>
  <text x="118" y="305" class="body">脐周也会留下疤痕</text>
  <circle cx="100" cy="335" r="6" fill="#E69F00"/>
  <text x="118" y="340" class="body">疤痕可能增生、变宽</text>
  <circle cx="100" cy="370" r="6" fill="#E69F00"/>
  <text x="118" y="375" class="body">即使位于比基尼线内</text>
  <text x="118" y="395" class="small">穿低腰裤或泳装时仍可能显露</text>
  <circle cx="100" cy="425" r="6" fill="#D55E00"/>
  <text x="118" y="430" class="body">吸烟者愈合不良风险显著升高</text>
  <rect x="82" y="455" width="360" height="32" rx="8" fill="#fdf3e3"/>
  <text x="262" y="476" class="small" text-anchor="middle">对疤痕完全不能接受者，不适合此手术</text>

  <!-- 右侧：决策提示 -->
  <text x="490" y="216" class="nodeTitle">术前的硬要求</text>
  <rect x="490" y="230" width="348" height="270" rx="14" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="516" cy="265" r="14" fill="#0072B2"/>
  <text x="516" y="270" class="num" text-anchor="middle" style="font-size:16px">✓</text>
  <text x="540" y="270" class="body">当面评估松弛来源（皮肤／肌肉／脂肪）</text>
  <circle cx="516" cy="300" r="14" fill="#0072B2"/>
  <text x="516" y="305" class="num" text-anchor="middle" style="font-size:16px">✓</text>
  <text x="540" y="305" class="body">讨论切口长度与是否联合抽脂</text>
  <circle cx="516" cy="335" r="14" fill="#0072B2"/>
  <text x="516" y="340" class="num" text-anchor="middle" style="font-size:16px">✓</text>
  <text x="540" y="340" class="body">明确疤痕位置与预期</text>
  <circle cx="516" cy="370" r="14" fill="#0072B2"/>
  <text x="516" y="375" class="num" text-anchor="middle" style="font-size:16px">✓</text>
  <text x="540" y="375" class="body">确认血库、住院、血栓预防</text>
  <circle cx="516" cy="405" r="14" fill="#D55E00"/>
  <text x="516" y="410" class="num" text-anchor="middle" style="font-size:16px">✗</text>
  <text x="540" y="410" class="body" style="fill:#D55E00">未完成生育计划者建议暂缓</text>
  <rect x="510" y="445" width="308" height="42" rx="8" fill="#eef6f8"/>
  <text x="664" y="464" class="small" text-anchor="middle">选择有四级资质的机构和主刀</text>
  <text x="664" y="481" class="small" text-anchor="middle">现场可查执业许可证</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="551" class="quote" text-anchor="middle">把疤痕现实纳入决策，比事后抱怨更有意义</text>

  <text x="62" y="582" class="footer">医学教育示意 · 疤痕形态因人体质与术后护理而异</text>
</svg>
