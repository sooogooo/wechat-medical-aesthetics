<svg xmlns="http://www.w3.org/2000/svg" aria-label="栓塞危险信号" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">⚠ 出现这些，立即就医</text><rect width="135" height="170" x="30" y="55" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="97" cy="95" r="20" fill="#f7ece6"/><ellipse cx="97" cy="95" fill="#b5654a" opacity=".4" rx="14" ry="10"/><text x="97" y="145" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">皮肤发白</text><text x="97" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">苍白、冰凉</text><text x="97" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">血供中断</text><rect width="135" height="170" x="180" y="55" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="247" cy="95" r="20" fill="#f7ece6"/><path fill="none" stroke="#7a5a4a" stroke-width="2" d="M 235 95 Q 247 88 259 95"/><path fill="none" stroke="#7a5a4a" stroke-width="1.5" d="M 235 100 Q 247 105 259 100"/><text x="247" y="145" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">花斑/发紫</text><text x="247" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">网状青紫</text><text x="247" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">缺血进展</text><rect width="135" height="170" x="330" y="55" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="397" cy="95" r="20" fill="#f7ece6"/><text x="397" y="100" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600" text-anchor="middle">!</text><text x="397" y="145" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">剧痛</text><text x="397" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">与正常反应不符</text><text x="397" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">的剧烈疼痛</text><rect width="135" height="170" x="480" y="55" fill="#fff" stroke="#b5654a" stroke-width="1.5" rx="8"/><circle cx="547" cy="95" r="20" fill="#f7ece6"/><ellipse cx="547" cy="95" fill="none" stroke="#7a5a4a" stroke-width="2" rx="12" ry="8"/><line x1="540" x2="554" y1="90" y2="100" stroke="#7a5a4a" stroke-width="1.5"/><text x="547" y="145" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">视力变化</text><text x="547" y="170" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">模糊、失明、眼痛</text><text x="547" y="190" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">最紧急</text><text x="320" y="245" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">不要等待、不要自行按摩、不要“观察一晚”——立即联系医生或急诊</text></svg>