<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="下面部宽大的三种来源">
  <rect width="640" height="280" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" fill="#2b2a28">脸方/脸宽，可能是这三种</text>

  <rect x="30" y="55" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="122" cy="150" rx="48" ry="62" fill="#f3efe8" stroke="#a8a39d"/>
  <ellipse cx="85" cy="170" rx="14" ry="20" fill="#7a8b6f" opacity="0.7"/>
  <ellipse cx="160" cy="170" rx="14" ry="20" fill="#7a8b6f" opacity="0.7"/>
  <text x="122" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">咬肌肥厚</text>
  <text x="122" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">咬牙时耳前鼓起</text>
  <text x="122" y="246" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#7a8b6f">肉毒有效</text>

  <rect x="227" y="55" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="320" cy="150" rx="54" ry="66" fill="#eef0ea" stroke="#a8a39d"/>
  <ellipse cx="320" cy="160" rx="48" ry="58" fill="#e3e8dc" opacity="0.7"/>
  <text x="320" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#8a7340">脂肪堆积</text>
  <text x="320" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">捏得起软组织</text>
  <text x="320" y="246" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#8a7340">减脂/吸脂</text>

  <rect x="424" y="55" width="185" height="190" rx="8" fill="#ffffff" stroke="#ece7df"/>
  <ellipse cx="516" cy="150" rx="48" ry="62" fill="#f3efe8" stroke="#a8a39d"/>
  <path d="M 470 175 Q 516 195 562 175" stroke="#5f6e54" stroke-width="3" fill="none"/>
  <path d="M 468 150 Q 516 165 564 150" stroke="#5f6e54" stroke-width="2" fill="none"/>
  <text x="516" y="80" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" fill="#5f6e54">骨性宽大</text>
  <text x="516" y="230" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">摸到硬的骨性轮廓</text>
  <text x="516" y="246" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#b5654a">需要手术</text>

  <text x="320" y="265" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="10" fill="#a8a39d">判断方法：咬紧牙关，摸耳前下方——鼓起的硬块是咬肌</text>
</svg>