<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleB101 descB101">
  <title id="titleB101">五种术式的切口与适用对照</title>
  <desc id="descB101">五种腹壁成形术式的切口位置与适用人群对照</desc>
  <defs>
    <marker id="ahB101" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · B1</text>
  <text x="62" y="112" class="title">五种术式的切口与适用对照</text>
  <text x="62" y="148" class="kicker">迷你、标准、延伸、环形、倒 T，按松弛范围分</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>

  <text x="96" y="206" class="small">术式</text>
  <text x="250" y="206" class="small">切口位置</text>
  <text x="470" y="206" class="small">适合人群</text>

  <line x1="66" y1="224" x2="66" y2="256" stroke="#0072B2" stroke-width="2"/>
  <text x="96" y="250" class="midTitle" text-anchor="start" style="fill:#0072B2">迷你型</text>
  <text x="250" y="250" class="body">下腹短横切口</text>
  <text x="470" y="250" class="body">下腹局限松弛、上腹良好</text>
  <line x1="62" y1="268" x2="838" y2="268" stroke="#e3e9ea" stroke-width="1"/>

  <line x1="66" y1="282" x2="66" y2="314" stroke="#0B8A6B" stroke-width="2"/>
  <text x="96" y="308" class="midTitle" text-anchor="start" style="fill:#0B8A6B">标准型</text>
  <text x="250" y="308" class="body">髋到髋横切口</text>
  <text x="470" y="308" class="body">中度松弛＋腹直肌分离</text>
  <line x1="62" y1="326" x2="838" y2="326" stroke="#e3e9ea" stroke-width="1"/>

  <line x1="66" y1="340" x2="66" y2="372" stroke="#D9930D" stroke-width="2"/>
  <text x="96" y="366" class="midTitle" text-anchor="start" style="fill:#D9930D">延伸型</text>
  <text x="250" y="366" class="body">横切口绕到侧腰</text>
  <text x="470" y="366" class="body">松弛延及侧腰</text>
  <line x1="62" y1="384" x2="838" y2="384" stroke="#e3e9ea" stroke-width="1"/>

  <line x1="66" y1="398" x2="66" y2="430" stroke="#C75B00" stroke-width="2"/>
  <text x="96" y="424" class="midTitle" text-anchor="start" style="fill:#C75B00">环形</text>
  <text x="250" y="424" class="body">绕躯干一周</text>
  <text x="470" y="424" class="body">减重后整圈松弛</text>
  <line x1="62" y1="442" x2="838" y2="442" stroke="#e3e9ea" stroke-width="1"/>

  <line x1="66" y1="456" x2="66" y2="488" stroke="#B36A98" stroke-width="2"/>
  <text x="96" y="482" class="midTitle" text-anchor="start" style="fill:#B36A98">倒 T 型</text>
  <text x="250" y="482" class="body">横＋正中纵切口</text>
  <text x="470" y="482" class="body">横向纵向皮肤都过剩</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">没有最好的术式，只有对应的术式</text>
  <text x="62" y="580" class="footer">医学教育示意 · 术式选择以面诊体格检查为准 · 切口设计因人而异</text>
</svg>
