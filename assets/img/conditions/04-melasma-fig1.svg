<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t04f1 d04f1" role="img" viewBox="0 0 800 500"><title id="t04f1">黄褐斑三型分布与治疗底盘</title><desc id="d04f1">表皮型真皮型混合型处理不同，防晒是治疗底盘而非配角</desc><defs><linearGradient id="bg04f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh04f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg04f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh04f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 04</text><text x="56" y="90" class="title">黄褐斑分型与治疗底盘</text><text x="56" y="116" class="kicker">对称褐斑不一定都是黄褐斑，先诊断再谈方案</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">按色素深度分三型</text><rect width="220" height="110" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="56" y="174" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="56" y="192" fill="#7A8B6F"/><text x="166" y="193" class="tag" text-anchor="middle">表皮型</text><text x="166" y="226" class="body" text-anchor="middle">颜色较浅 褐色为主</text><text x="166" y="248" class="small" text-anchor="middle">外用药起效相对好</text><text x="166" y="270" class="small" text-anchor="middle">按月计算效果</text><rect width="220" height="110" x="290" y="174" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="174" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="192" fill="#C9A876"/><text x="400" y="193" class="tag" text-anchor="middle">真皮型</text><text x="400" y="226" class="body" text-anchor="middle">灰褐色 偏深</text><text x="400" y="248" class="small" text-anchor="middle">药物较难够到</text><text x="400" y="270" class="small" text-anchor="middle">常需多次光电</text><rect width="220" height="110" x="524" y="174" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="524" y="174" fill="#B5654A" rx="12"/><rect width="220" height="10" x="524" y="192" fill="#B5654A"/><text x="634" y="193" class="tag" text-anchor="middle">混合型</text><text x="634" y="226" class="body" text-anchor="middle">深浅并存</text><text x="634" y="248" class="small" text-anchor="middle">最常见 分区处理</text><text x="634" y="270" class="small" text-anchor="middle">易反黑需克制</text><text x="56" y="316" class="nodeTitle">治疗组合底盘</text><rect width="688" height="86" x="56" y="330" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><rect width="688" height="28" x="56" y="330" fill="#7A8B6F" rx="10"/><rect width="688" height="10" x="56" y="348" fill="#7A8B6F"/><text x="400" y="350" class="tag" text-anchor="middle">防晒不是配角，而是治疗底盘</text><text x="76" y="378" class="body">广谱防晒 全年 防可见光</text><text x="76" y="400" class="small">外用药先行 光电换肤克制 追求长期稳住而非一次清零</text><rect width="688" height="32" x="56" y="430" fill="#eef4ee" rx="8"/><text x="400" y="451" class="quote" text-anchor="middle">把期待从祛干净改成长期稳住</text><text x="56" y="470" class="footer">医学教育示意 · 妊娠期方案不同，需面诊确定分型与药物</text></svg>