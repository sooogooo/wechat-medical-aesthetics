<svg xmlns="http://www.w3.org/2000/svg" aria-label="迟发性结节时间线" role="img" viewBox="0 0 640 260"><rect width="640" height="260" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">再生类材料并发症可能出现的时间</text><line x1="50" x2="590" y1="140" y2="140" stroke="#a8a39d" stroke-width="2"/><polygon fill="#a8a39d" points="590 140 582 135 582 145"/><circle cx="80" cy="140" r="8" fill="#7a8b6f"/><text x="80" y="120" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="11" font-weight="600" text-anchor="middle">注射</text><text x="80" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">即刻</text><circle cx="200" cy="140" r="6" fill="#c9a876"/><text x="200" y="120" fill="#8a7340" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">肿胀/过敏</text><text x="200" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">数天–数周</text><circle cx="320" cy="140" r="6" fill="#8a9a7f"/><text x="320" y="120" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">胶原增生</text><text x="320" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">1–3 个月</text><circle cx="460" cy="140" r="8" fill="#b5654a"/><text x="460" y="120" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">迟发结节</text><text x="460" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">数月–数年</text><circle cx="560" cy="140" r="8" fill="#b5654a"/><text x="560" y="120" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10" font-weight="600" text-anchor="middle">过度增生</text><text x="560" y="165" fill="#6b6864" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">远期</text><rect width="540" height="40" x="50" y="195" fill="#f7ece6" stroke="#e3c9bd" rx="6"/><text x="320" y="215" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="11" text-anchor="middle">⚠ 迟发结节可能在注射很久之后才出现，且不能酶解——这是再生类材料最大的远期风险</text><text x="320" y="248" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="9" text-anchor="middle">图为示意；实际发生时间、概率因产品、部位、剂量和个体差异而不同</text></svg>