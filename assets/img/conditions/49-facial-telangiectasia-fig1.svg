  <text x="52" y="116" class="kicker">毛细血管扩张是结果，背后原因决定处理顺序</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <text x="52" y="162" class="nodeTitle">五类常见原因</text>

