<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t09f2 d09f2" role="img" viewBox="0 0 800 500"><title id="t09f2">脂溢性角化皮损三类分治</title><desc id="d09f2">治疗前把皮损分成三类，对应不同处理策略</desc><defs><linearGradient id="bg09f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh09f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg09f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh09f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 09</text><text x="56" y="90" class="title">治疗前把皮损分成三类</text><text x="56" y="116" class="kicker">不处理通常是完全可以的选择</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">三类分治策略</text><rect width="220" height="150" x="56" y="174" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="56" y="174" fill="#7A8B6F" rx="12"/><rect width="220" height="10" x="56" y="192" fill="#7A8B6F"/><text x="166" y="193" class="tag" text-anchor="middle">稳定观察</text><text x="166" y="226" class="body" text-anchor="middle">长期无变化</text><text x="166" y="250" class="body" text-anchor="middle">不影响功能美观</text><text x="166" y="282" class="small" text-anchor="middle">可完全不处理</text><text x="166" y="304" class="small" text-anchor="middle">定期自查即可</text><rect width="220" height="150" x="290" y="174" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="290" y="174" fill="#C9A876" rx="12"/><rect width="220" height="10" x="290" y="192" fill="#C9A876"/><text x="400" y="193" class="tag" text-anchor="middle">美观处理</text><text x="400" y="226" class="body" text-anchor="middle">有外观困扰</text><text x="400" y="250" class="body" text-anchor="middle">位置明显 易摩擦</text><text x="400" y="282" class="small" text-anchor="middle">激光 冷冻切除</text><text x="400" y="304" class="small" text-anchor="middle">术后护理决定色差</text><rect width="220" height="150" x="524" y="174" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="220" height="28" x="524" y="174" fill="#B5654A" rx="12"/><rect width="220" height="10" x="524" y="192" fill="#B5654A"/><text x="634" y="193" class="tag" text-anchor="middle">需先就医</text><text x="634" y="226" class="body" text-anchor="middle">快速变化 破溃</text><text x="634" y="250" class="body" text-anchor="middle">颜色不均 出血</text><text x="634" y="282" class="small" text-anchor="middle">短期爆发很多颗</text><text x="634" y="304" class="small" text-anchor="middle">排除恶性病变</text><text x="56" y="356" class="nodeTitle">术后护理要点</text><rect width="688" height="62" x="56" y="370" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="76" y="394" class="body">结痂期让其自然脱落，不要提前抠掉</text><text x="76" y="416" class="small">严格防晒 避免摩擦 深肤色人群色差风险更高 眼周更谨慎</text><rect width="688" height="22" x="56" y="442" fill="#eef4ee" rx="8"/><text x="400" y="457" class="quote" font-size="14" text-anchor="middle">突然爆发很多颗，需结合全身情况评估</text><text x="56" y="474" class="footer">医学教育示意 · 是否处理取决于症状美观与变化，需面诊判断</text></svg>