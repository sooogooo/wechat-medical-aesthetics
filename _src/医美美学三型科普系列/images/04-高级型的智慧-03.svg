<svg xmlns="http://www.w3.org/2000/svg" aria-label="耐看与潮流的关系" role="img" viewBox="0 0 640 220"><rect width="640" height="220" fill="#faf8f4" rx="12"/><text x="320" y="30" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="15" font-weight="600" text-anchor="middle">耐看 = 超越潮流</text><rect width="280" height="130" x="30" y="55" fill="#f7ece6" stroke="#b5654a" rx="8"/><text x="170" y="83" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✗ 庸俗型：追潮流</text><text x="50" y="113" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">追&quot;今天的标准脸&quot;</text><text x="50" y="136" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">→ 潮流变，脸就过时</text><text x="50" y="165" fill="#b5654a" font-family="PingFang SC,sans-serif" font-size="10">不可逆改变后无法回头</text><rect width="280" height="130" x="330" y="55" fill="#eef0ea" stroke="#7a8b6f" rx="8"/><text x="470" y="83" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="13" font-weight="600" text-anchor="middle">✓ 高级型：超越潮流</text><text x="350" y="113" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">追求&quot;协调、属于你&quot;</text><text x="350" y="136" fill="#2b2a28" font-family="PingFang SC,sans-serif" font-size="11">→ 潮流变，脸仍耐看</text><text x="350" y="165" fill="#5f6e54" font-family="PingFang SC,sans-serif" font-size="10">经得起时间检验</text><text x="320" y="205" fill="#a8a39d" font-family="PingFang SC,sans-serif" font-size="10" text-anchor="middle">时间是审美的试金石——耐看的脸，五年十年后仍然好看</text></svg>