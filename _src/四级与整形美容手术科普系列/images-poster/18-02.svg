<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title1802 desc1802">
  <title id="title1802">鼻修复的递减规律</title>
  <desc id="desc1802">每次修复能改善的余地通常缩小，风险升高，避免轻率进入反复修复循环</desc>
  <defs>
    <linearGradient id="bg1802" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh1802" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
      .lbl { font: 700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg1802)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh1802)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 18</text>
  <text x="62" y="117" class="title">修复次数越多，余地越小，风险越高</text>
  <text x="62" y="153" class="kicker">这是一个残酷但真实的规律</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 双轴图：改善余地↓ 并发症风险↑ -->
  <text x="62" y="216" class="nodeTitle">递减规律示意</text>

  <!-- 坐标系背景 -->
  <rect x="62" y="230" width="480" height="270" rx="14" fill="#f8fbfb" stroke="#dce8e8"/>

  <!-- 轴线 -->
  <line x1="120" y1="470" x2="520" y2="470" stroke="#5c6c72" stroke-width="1.5"/>
  <line x1="120" y1="270" x2="120" y2="470" stroke="#5c6c72" stroke-width="1.5"/>
  <text x="320" y="490" class="small" text-anchor="middle">修复次数 →</text>
  <text x="100" y="370" class="small" text-anchor="middle" transform="rotate(-90 100 370)">程度</text>

  <!-- 改善余地曲线（下降，蓝绿） -->
  <path d="M 150 290 Q 250 320 350 380 Q 420 420 500 450" stroke="#0072B2" stroke-width="3" fill="none"/>
  <circle cx="150" cy="290" r="5" fill="#0072B2"/>
  <circle cx="250" cy="330" r="5" fill="#0072B2"/>
  <circle cx="350" cy="385" r="5" fill="#0072B2"/>
  <circle cx="500" cy="450" r="5" fill="#0072B2"/>
  <text x="150" y="280" class="small" text-anchor="middle" style="fill:#0072B2">初鼻</text>
  <text x="250" y="320" class="small" text-anchor="middle" style="fill:#0072B2">第1次</text>
  <text x="350" y="375" class="small" text-anchor="middle" style="fill:#0072B2">第2次</text>
  <text x="500" y="465" class="small" text-anchor="end" style="fill:#0072B2">第3-4次</text>

  <!-- 并发症风险曲线（上升，砖红） -->
  <path d="M 150 455 Q 250 440 350 400 Q 420 360 500 295" stroke="#D55E00" stroke-width="3" fill="none" stroke-dasharray="6,4"/>
  <circle cx="150" cy="455" r="5" fill="#D55E00"/>
  <circle cx="500" cy="295" r="5" fill="#D55E00"/>
  <text x="510" y="290" class="small" style="fill:#D55E00">风险↑</text>

  <!-- 图例 -->
  <line x1="150" y1="500" x2="175" y2="500" stroke="#0072B2" stroke-width="3"/>
  <text x="183" y="504" class="small">改善余地（递减）</text>
  <line x1="320" y1="500" x2="345" y2="500" stroke="#D55E00" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="353" y="504" class="small">并发症风险（递增）</text>

  <!-- 右侧：说明 -->
  <text x="560" y="216" class="nodeTitle">规律的含义</text>
  <rect x="560" y="230" width="278" height="270" rx="14" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>

  <text x="580" y="262" class="body">第一次修复：</text>
  <text x="580" y="284" class="small">改善可能明显</text>

  <text x="580" y="316" class="body">第三次、第四次：</text>
  <text x="580" y="338" class="small">往往只能做有限调整</text>
  <text x="580" y="358" class="small">并发症概率显著上升</text>

  <rect x="580" y="380" width="238" height="62" rx="8" fill="#fdf3e3"/>
  <text x="599" y="404" class="small" text-anchor="middle">皮肤坏死 · 感染 · 假体暴露</text>
  <text x="599" y="424" class="small" text-anchor="middle">疤痕增生 · 挛缩鼻</text>

  <rect x="580" y="455" width="238" height="34" rx="8" fill="#fbeae3"/>
  <text x="599" y="476" class="small" text-anchor="middle">决定第一次修复就要慎重</text>

  <!-- 金句 -->
  <rect x="62" y="515" width="776" height="40" rx="12" fill="#fdf1ee"/>
  <text x="450" y="541" class="quote" text-anchor="middle">把修复到完美作为目标是危险的——它会推动反复手术</text>

  <text x="62" y="582" class="footer">医学教育示意 · 图示为趋势示意，非教学图 · 修复须由有经验的医师开展</text>
</svg>
