<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t40f1 d40f1" role="img" viewBox="0 0 800 500"><title id="t40f1">剥脱性唇炎不只是缺水</title><desc id="d40f1">剥脱性唇炎的脱屑结痂与舔咬接触感染心理等多因素相关</desc><defs><linearGradient id="bg40f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh40f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.center{font:700 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.card{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg40f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh40f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 40</text><text x="52" y="92" class="title">剥脱性唇炎的多因素成因</text><text x="52" y="116" class="kicker">反复结痂脱一层长一层，先找原因，再谈修复</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><text x="52" y="162" class="nodeTitle">五类常见诱因</text><circle cx="400" cy="280" r="58" fill="#5F6E54"/><text x="400" y="274" class="center" text-anchor="middle">唇部</text><text x="400" y="296" class="center" text-anchor="middle">反复脱屑</text><rect width="180" height="78" x="70" y="190" fill="#fbf0eb" stroke="#B5654A" rx="12"/><text x="80" y="214" class="card">习惯性舔咬</text><text x="80" y="236" class="small">舔唇越湿越干</text><text x="80" y="256" class="small">撕皮造成新损伤</text><rect width="180" height="78" x="70" y="292" fill="#fbf5ea" stroke="#C9A876" rx="12"/><text x="80" y="316" class="card">接触过敏</text><text x="80" y="338" class="small">唇膏、牙膏、香料</text><text x="80" y="358" class="small">食物与药物</text><rect width="180" height="62" x="310" y="372" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><text x="320" y="396" class="card">感染因素</text><text x="320" y="418" class="small">细菌、真菌、念珠菌</text><text x="320" y="430" fill="#B5654A" class="small">需医师取材镜检</text><rect width="180" height="78" x="550" y="292" fill="#f4f7f1" stroke="#7A8B6F" rx="12"/><text x="560" y="316" class="card">心理行为</text><text x="560" y="338" class="small">焦虑、强迫舔咬</text><text x="560" y="358" class="small">压力诱发</text><rect width="180" height="78" x="550" y="190" fill="#fbf0eb" stroke="#B5654A" rx="12"/><text x="560" y="214" class="card">日晒与气候</text><text x="560" y="236" class="small">干燥、寒冷、风吹</text><text x="560" y="256" class="small">光化学损伤</text><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 250 229 Q 320 250 348 268"/><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 250 331 Q 320 300 348 290"/><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 400 372 L 400 340"/><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 550 331 Q 480 300 452 290"/><path fill="none" stroke="#7d8e93" stroke-dasharray="4 3" stroke-width="1.5" d="M 550 229 Q 480 250 452 268"/><rect width="696" height="30" x="52" y="432" fill="#eef6f8" rx="10"/><text x="400" y="452" class="quote" text-anchor="middle">脱下来的不是皮，是还没长好的屏障</text>