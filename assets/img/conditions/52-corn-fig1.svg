<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t52f1 d52f1" role="img" viewBox="0 0 800 500"><title id="t52f1">鸡眼的芯来自压力</title><desc id="d52f1">鸡眼是局部长期压力形成的圆锥形角质栓垂直受压时疼</desc><defs><linearGradient id="bg52f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh52f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 26px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.col,.nodeTitle{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif}.nodeTitle{fill:#2b2a28}.col{fill:#fff}.small{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg52f1)" rx="22"/><rect width="744" height="452" x="28" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh52f1)" opacity=".96" rx="20"/><text x="52" y="56" class="series">皮肤病症科普 · 52</text><text x="52" y="92" class="title">鸡眼和胼胝不是一回事</text><text x="52" y="116" class="kicker">鸡眼有&quot;芯&quot;，垂直受压时疼；胼胝是广而浅的硬茧</text><line x1="52" x2="748" y1="134" y2="134" stroke="#dce5e5"/><rect width="340" height="34" x="52" y="150" fill="#B5654A" rx="8"/><text x="222" y="172" class="col" text-anchor="middle">鸡眼</text><rect width="340" height="218" x="52" y="188" fill="#fbf0eb" stroke="#B5654A" rx="10"/><g transform="translate(110,260)"><path fill="#C9A876" stroke="#7a3a25" stroke-width="1.5" d="M -30 -20 L 30 -20 L 6 50 L -6 50 Z"/><ellipse cx="0" cy="-20" fill="#B5654A" rx="30" ry="6"/><line x1="0" x2="0" y1="-20" y2="50" stroke="#7a3a25" stroke-dasharray="3 2" stroke-width="1.5"/><text x="40" y="0" class="small">圆锥形角质栓</text><text x="40" y="20" fill="#B5654A" class="small">尖端向内</text><text x="40" y="40" class="small">像扎进一颗钉子</text></g><text x="222" y="380" class="small" text-anchor="middle">垂直受压时刺痛</text><rect width="340" height="34" x="408" y="150" fill="#7A8B6F" rx="8"/><text x="578" y="172" class="col" text-anchor="middle">胼胝</text><rect width="340" height="218" x="408" y="188" fill="#f4f7f1" stroke="#7A8B6F" rx="10"/><g transform="translate(530,260)"><ellipse cx="0" cy="0" fill="#C9A876" opacity=".7" rx="50" ry="20"/><ellipse cx="0" cy="-2" fill="#C9A876" rx="40" ry="14"/><text x="70" y="-10" class="small">广而浅的硬茧</text><text x="70" y="10" fill="#5F6E54" class="small">边界不清</text><text x="70" y="30" class="small">无明显&quot;芯&quot;</text></g><text x="578" y="380" class="small" text-anchor="middle">挤压或侧压时不适，垂直压痛较轻</text><text x="52" y="412" class="nodeTitle">鸡眼常见部位</text><rect width="160" height="18" x="52" y="422" fill="#7A8B6F" rx="6"/><text x="132" y="435" fill="#fff" class="small" text-anchor="middle">脚趾背</text><rect width="160" height="18" x="222" y="422" fill="#7A8B6F" rx="6"/><text x="302" y="435" fill="#fff" class="small" text-anchor="middle">趾缝（软鸡眼）</text><rect width="160" height="18" x="392" y="422" fill="#7A8B6F" rx="6"/><text x="472" y="435" fill="#fff" class="small" text-anchor="middle">前掌</text><rect width="186" height="18" x="562" y="422" fill="#C9A876" rx="6"/><text x="655" y="435" fill="#fff" class="small" text-anchor="middle">小趾外侧</text><text x="52" y="466" class="footer">健康科普示意 · 诊断与处理须由专业人员评估</text></svg>