<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="title0101 desc0101" role="img" viewBox="0 0 900 620"><title id="title0101">诊所、门诊部、医院差在哪</title><desc id="desc0101">美容外科诊所、医疗美容门诊部、美容医院三级机构在床位、麻醉、急救与手术级别上的对比</desc><defs><linearGradient id="bg0101" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh0101" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.4px;fill:#0072b2}.title{font:700 31px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.kicker{font:500 17px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.lvl{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}.body{font:500 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 19px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#17323d}.footer{font:500 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="900" height="620" fill="url(#bg0101)" rx="28"/><rect width="832" height="560" x="34" y="30" fill="#fff" stroke="#dce8e8" filter="url(#sh0101)" opacity=".96" rx="24"/><text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 01</text><text x="62" y="117" class="title">诊所、门诊部、医院差在哪</text><text x="62" y="153" class="kicker">名字差的不只是规模，是床位、麻醉、急救与手术级别</text><line x1="62" x2="838" y1="181" y2="181" stroke="#dce5e5"/><text x="62" y="216" class="nodeTitle">三级机构基本差别</text><rect width="776" height="32" x="62" y="232" fill="#eef3f4" rx="6"/><text x="120" y="254" fill="#17323d" class="small" font-weight="700" text-anchor="middle">机构类型</text><text x="300" y="254" fill="#17323d" class="small" font-weight="700" text-anchor="middle">住院床位</text><text x="470" y="254" fill="#17323d" class="small" font-weight="700" text-anchor="middle">麻醉与抢救</text><text x="660" y="254" fill="#17323d" class="small" font-weight="700" text-anchor="middle">常见手术级别</text><rect width="776" height="74" x="62" y="264" fill="#f8fbfb" stroke="#56B4E9" stroke-width="1.5" rx="6"/><rect width="116" height="74" x="62" y="264" fill="#56B4E9" rx="6"/><rect width="8" height="74" x="170" y="264" fill="#56B4E9"/><text x="120" y="297" class="lvl" text-anchor="middle">美容外科</text><text x="120" y="320" class="lvl" text-anchor="middle">诊所</text><text x="300" y="298" class="body" text-anchor="middle">通常无住院床位</text><text x="300" y="321" class="small" text-anchor="middle">仅设诊室</text><text x="470" y="298" class="body" text-anchor="middle">配置有限</text><text x="470" y="321" class="small" text-anchor="middle">无独立麻醉科</text><text x="660" y="298" class="body" text-anchor="middle">一级或不分级</text><text x="660" y="321" class="small" text-anchor="middle">小项目为主</text><rect width="776" height="74" x="62" y="346" fill="#fff8ee" stroke="#E69F00" stroke-width="1.5" rx="6"/><rect width="116" height="74" x="62" y="346" fill="#E69F00" rx="6"/><rect width="8" height="74" x="170" y="346" fill="#E69F00"/><text x="120" y="379" class="lvl" text-anchor="middle">医疗美容</text><text x="120" y="402" class="lvl" text-anchor="middle">门诊部</text><text x="300" y="380" class="body" text-anchor="middle">可设少量观察床</text><text x="300" y="403" class="small" text-anchor="middle">短期观察</text><text x="470" y="380" class="body" text-anchor="middle">一定医技与急救</text><text x="470" y="403" class="small" text-anchor="middle">条件较诊所完善</text><text x="660" y="380" class="body" text-anchor="middle">一级、二级为主</text><text x="660" y="403" class="small" text-anchor="middle">一般不核准四级</text><rect width="776" height="74" x="62" y="428" fill="#fdf1ee" stroke="#D55E00" stroke-width="1.5" rx="6"/><rect width="116" height="74" x="62" y="428" fill="#D55E00" rx="6"/><rect width="8" height="74" x="170" y="428" fill="#D55E00"/><text x="120" y="461" class="lvl" text-anchor="middle">美容医院</text><text x="120" y="484" class="lvl" text-anchor="middle">整形外科医院</text><text x="300" y="462" class="body" text-anchor="middle">设有住院床位</text><text x="300" y="485" class="small" text-anchor="middle">手术室、ICU 或通道</text><text x="470" y="462" class="body" text-anchor="middle">麻醉科、血备</text><text x="470" y="485" class="small" text-anchor="middle">检验、影像配套</text><text x="660" y="462" class="body" text-anchor="middle">经核准可至四级</text><text x="660" y="485" class="small" text-anchor="middle">须团队与资质</text><path fill="none" stroke="#7d8e93" stroke-dasharray="5 4" stroke-width="1.6" d="M 700 215 L 836 215"/><path fill="none" stroke="#7d8e93" stroke-width="1.6" d="M 828 209 L 836 215 L 828 221"/><text x="768" y="206" class="small" text-anchor="middle">能力递增</text><rect width="776" height="40" x="62" y="525" fill="#eef6f8" rx="12"/><text x="450" y="551" class="quote" text-anchor="middle">挂&quot;医院&quot;牌≠核准四级，看执业许可证才算数</text><text x="62" y="582" class="footer">医学教育示意 · 机构类别与核准科目以执业许可证登记和属地卫健部门现行规定为准</text></svg>