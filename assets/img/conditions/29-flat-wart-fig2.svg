<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t29 d29" role="img" viewBox="0 0 800 500"><title id="t29">扁平疣治疗选择因素</title><desc id="d29">数量、部位和肤色影响方案</desc><defs><linearGradient id="bg29" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh29" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#183642" flood-opacity=".1" stdDeviation="6"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5f6e54}.nodeT{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.num{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg29)" rx="22"/><rect width="748" height="452" x="26" y="24" fill="#fff" stroke="#dce8e8" filter="url(#sh29)" opacity=".96" rx="18"/><text x="48" y="58" class="series">皮肤病症科普 · 29</text><text x="48" y="92" class="title">扁平疣治疗选择因素</text><text x="48" y="116" class="kicker">数量、部位和肤色影响方案</text><line x1="48" x2="752" y1="134" y2="134" stroke="#dce8e8"/><text x="48" y="168" class="nodeT">给免疫反应时间，也给随访一个期限</text><circle cx="74" cy="208" r="13" fill="#7A8B6F"/><text x="74" y="213" class="num" text-anchor="middle">1</text><text x="98" y="213" class="body">部分扁平疣可自行消退，先评估再决定</text><circle cx="74" cy="250" r="13" fill="#C9A876"/><text x="74" y="255" class="num" text-anchor="middle">2</text><text x="98" y="255" class="body">面部治疗兼顾传染风险与色沉风险</text><circle cx="74" cy="292" r="13" fill="#B5654A"/><text x="74" y="297" class="num" text-anchor="middle">3</text><text x="98" y="297" class="body">减少抓挠，避免同形反应让皮损变多</text><circle cx="74" cy="334" r="13" fill="#7A8B6F"/><text x="74" y="339" class="num" text-anchor="middle">4</text><text x="98" y="339" class="body">家庭成员有疣不等于必须集体治疗</text><rect width="704" height="40" x="48" y="372" fill="#eef4ee" stroke="#7A8B6F" stroke-opacity=".35" rx="10"/><text x="400" y="397" class="quote" text-anchor="middle">日常护理重点是减少传播和反复</text><text x="48" y="462" class="footer">医学教育示意 · 面部小丘疹最怕未经诊断就腐蚀</text></svg>