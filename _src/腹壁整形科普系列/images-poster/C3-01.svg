<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" aria-labelledby="titleC301 descC301" role="img" viewBox="0 0 900 620"><title id="titleC301">恢复时间线，从引流到定型</title><desc id="descC301">腹壁成形术后恢复时间线，引流、弯腰行走、限制活动、消肿、定型</desc><defs><marker id="ahC301" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#b7c6cb" d="M0,0 L10,5 L0,10 z"/></marker><style>.series{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.8px;fill:#7d97a4}.title{font:300 32px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.kicker{font:400 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.midTitle{font:500 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.small{font:400 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#7a8a90}.quote{font:400 18px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#22333b}.footer{font:400 12px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#93a3a8}</style></defs><rect width="899" height="619" x=".5" y=".5" fill="#fff" stroke="#dde5e7" stroke-width="1"/><text x="62" y="64" class="series">腹壁整形 12 讲 · C3</text><text x="62" y="112" class="title">恢复时间线，从引流到定型</text><text x="62" y="148" class="kicker">数周到数月的限制，一年以上的定型</text><line x1="62" x2="838" y1="172" y2="172" stroke="#e3e9ea" stroke-width="1"/><text x="62" y="224" class="small">生活冲击（提前安排）</text><rect width="182" height="44" x="62" y="236" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="153" y="263" class="small" text-anchor="middle">带娃需帮手数周</text><rect width="182" height="44" x="258" y="236" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="349" y="263" class="small" text-anchor="middle">请假 2～4 周</text><rect width="182" height="44" x="454" y="236" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="545" y="263" class="small" text-anchor="middle">运动停数周至数月</text><rect width="182" height="44" x="650" y="236" fill="none" stroke="#56B4E9" stroke-width="1.2" rx="9"/><text x="741" y="263" class="small" text-anchor="middle">独居需陪护</text><line x1="70" x2="826" y1="385" y2="385" stroke="#b7c6cb" stroke-width="1.2"/><circle cx="110" cy="385" r="5" fill="#0072B2"/><text x="110" y="420" class="midTitle" text-anchor="middle">0～2 周</text><text x="110" y="442" class="small" text-anchor="middle">引流管在身上</text><text x="110" y="462" class="small" text-anchor="middle">弯腰行走，慢慢直起</text><circle cx="265" cy="385" r="5" fill="#56B4E9"/><text x="265" y="420" class="midTitle" text-anchor="middle">2～6 周</text><text x="265" y="442" class="small" text-anchor="middle">不能提重物</text><text x="265" y="462" class="small" text-anchor="middle">弹力衣持续穿戴</text><circle cx="420" cy="385" r="5" fill="#0B8A6B"/><text x="420" y="420" class="midTitle" text-anchor="middle">6 周后</text><text x="420" y="442" class="small" text-anchor="middle">逐渐恢复运动</text><text x="420" y="462" class="small" text-anchor="middle">循序渐进，别上强度</text><circle cx="575" cy="385" r="5" fill="#D9930D"/><text x="575" y="420" class="midTitle" text-anchor="middle">3～6 个月</text><text x="575" y="442" class="small" text-anchor="middle">肿胀逐渐消退</text><text x="575" y="462" class="small" text-anchor="middle">轮廓渐趋稳定</text><circle cx="730" cy="385" r="5" fill="#C75B00"/><text x="730" y="420" class="midTitle" text-anchor="middle">1 年以上</text><text x="730" y="442" class="small" text-anchor="middle">轮廓与疤痕定型</text><text x="730" y="462" class="small" text-anchor="middle">感觉部分恢复</text><line x1="62" x2="838" y1="520" y2="520" stroke="#e3e9ea" stroke-width="1"/><text x="450" y="548" class="quote" text-anchor="middle">把恢复期算进决策，比只算手术费更真实</text><text x="62" y="580" class="footer">医学教育示意 · 时间节点因人而异，以主刀方案为准</text></svg>