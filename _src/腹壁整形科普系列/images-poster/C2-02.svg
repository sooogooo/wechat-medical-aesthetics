<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="titleC202 descC202">
  <title id="titleC202">出现这些危险信号就就医</title>
  <desc id="descC202">腹壁成形术后危险信号分级，立即急诊与尽快就医</desc>
  <defs>
    <marker id="ahC202" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7c6cb"/>
    </marker>
    <style>
      .series { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.8px; fill:#7d97a4; }
      .title { font: 300 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .kicker { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .nodeTitle { font: 500 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .midTitle { font: 500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .body { font: 400 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#4a5a60; }
      .small { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#7a8a90; }
      .quote { font: 400 18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#22333b; }
      .footer { font: 400 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#93a3a8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" fill="#ffffff" stroke="#dde5e7" stroke-width="1"/>
  <text x="62" y="64" class="series">腹壁整形 12 讲 · C2</text>
  <text x="62" y="112" class="title">出现这些危险信号就就医</text>
  <text x="62" y="148" class="kicker">呼吸困难、胸痛、渗血不止，立即急诊</text>
  <line x1="62" y1="172" x2="838" y2="172" stroke="#e3e9ea" stroke-width="1"/>

  <rect x="62" y="205" width="380" height="268" rx="10" fill="none" stroke="#A64200" stroke-width="1.2"/>
  <text x="252" y="238" class="midTitle" text-anchor="middle" style="fill:#A64200">立即急诊</text>
  <text x="84" y="275" class="body">突发呼吸困难、胸痛、咳血、晕厥</text>
  <text x="84" y="299" class="small" text-anchor="start" style="fill:#A64200">警惕肺栓塞，立即急诊</text>
  <text x="84" y="335" class="body">伤口渗血不止、腹部迅速肿胀剧痛</text>
  <text x="84" y="359" class="small" text-anchor="start" style="fill:#A64200">警惕活动性出血，立即急诊</text>
  <text x="84" y="395" class="body">心率快、头晕乏力、面色苍白</text>
  <text x="84" y="419" class="small" text-anchor="start" style="fill:#A64200">警惕失血，立即急诊</text>

  <rect x="478" y="205" width="380" height="268" rx="10" fill="none" stroke="#D9930D" stroke-width="1.2"/>
  <text x="668" y="238" class="midTitle" text-anchor="middle" style="fill:#D9930D">尽快就医</text>
  <text x="500" y="275" class="body">一侧小腿肿胀、疼痛、压痛</text>
  <text x="500" y="299" class="small" text-anchor="start" style="fill:#A64200">警惕深静脉血栓</text>
  <text x="500" y="335" class="body">高热、伤口红肿、脓性渗出</text>
  <text x="500" y="359" class="small" text-anchor="start" style="fill:#A64200">警惕感染</text>
  <text x="500" y="395" class="body">皮瓣发紫、发黑、起水疱</text>
  <text x="500" y="419" class="small" text-anchor="start" style="fill:#A64200">警惕皮瓣坏死，联系主刀</text>
  <text x="500" y="452" class="body">剧烈腹痛、腹胀、呕吐</text>
  <text x="500" y="476" class="small" text-anchor="start" style="fill:#A64200">警惕腹腔内问题</text>
  <line x1="62" y1="520" x2="838" y2="520" stroke="#e3e9ea" stroke-width="1"/>
  <text x="450" y="548" class="quote" text-anchor="middle">该急诊就急诊，早处理和晚处理结果完全不同</text>
  <text x="62" y="580" class="footer">医学教育示意 · 出现危险信号立即就医，不要观察等待</text>
</svg>
