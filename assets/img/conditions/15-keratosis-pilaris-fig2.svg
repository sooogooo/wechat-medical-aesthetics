<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t15f2 d15f2" role="img" viewBox="0 0 800 500"><title id="t15f2">毛周角化护理可执行周期</title><desc id="d15f2">目标是更平整而不是消灭毛囊，护理方案一次只改一个变量</desc><defs><linearGradient id="bg15f2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh15f2" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}</style></defs><rect width="800" height="500" fill="url(#bg15f2)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh15f2)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 15</text><text x="56" y="90" class="title">护理四步与可执行周期</text><text x="56" y="116" class="kicker">一次只改一个变量，给护理设可执行的周期</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">改善路径四步</text><rect width="335" height="58" x="56" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="84" cy="201" r="16" fill="#7A8B6F"/><text x="84" y="206" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="112" y="197" class="body" font-weight="700">少用力 温和清洁</text><text x="112" y="217" class="small">停止搓澡 磨砂 强皂基</text><rect width="335" height="58" x="409" y="172" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><circle cx="437" cy="201" r="16" fill="#7A8B6F"/><text x="437" y="206" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="465" y="197" class="body" font-weight="700">规律保湿</text><text x="465" y="217" class="small">含尿素或乳酸成分 每日涂抹</text><rect width="335" height="58" x="56" y="242" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><circle cx="84" cy="271" r="16" fill="#C9A876"/><text x="84" y="276" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="112" y="267" class="body" font-weight="700">角质调节</text><text x="112" y="287" class="small">低浓度果酸水杨酸 从低频起</text><rect width="335" height="58" x="409" y="242" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4" rx="10"/><circle cx="437" cy="271" r="16" fill="#C9A876"/><text x="437" y="276" fill="#fff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="465" y="267" class="body" font-weight="700">光电辅助</text><text x="465" y="287" class="small">明显泛红可考虑 非必需</text><text x="56" y="338" class="nodeTitle">季节波动是常态</text><rect width="688" height="62" x="56" y="352" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.4" rx="10"/><text x="76" y="376" class="body" font-weight="700">夏天发红 冬天粗糙 可以是同一疾病的波动</text><text x="76" y="398" class="small">冬季加强保湿 夏季注意防晒 不要因波动频繁换方案</text><rect width="688" height="36" x="56" y="424" fill="#eef4ee" rx="10"/><text x="400" y="447" class="quote" text-anchor="middle">目标是更平整，不是消灭毛囊</text><text x="56" y="472" class="footer">医学教育示意 · 选成分要看皮肤当下状态，敏感时先减变量</text></svg>