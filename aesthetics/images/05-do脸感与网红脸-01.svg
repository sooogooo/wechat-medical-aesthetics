<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="do 脸感的典型特征">
  <rect width="640" height="320" fill="#faf8f4" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600" fill="#2b2a28">do 脸感 / 网红脸的典型特征</text>

  <!-- 简化网红脸（V 字、尖下巴） -->
  <path d="M 160 120 Q 160 230 200 270 L 230 270 Q 270 230 270 120 Z" fill="#f3efe8" stroke="#a8a39d"/>
  <!-- 大眼 + 双眼皮痕 -->
  <path d="M 180 145 Q 190 140 200 145" stroke="#2b2a28" stroke-width="2" fill="none"/>
  <ellipse cx="190" cy="155" rx="9" ry="7" fill="#2b2a28"/>
  <path d="M 230 145 Q 240 140 250 145" stroke="#2b2a28" stroke-width="2" fill="none"/>
  <ellipse cx="240" cy="155" rx="9" ry="7" fill="#2b2a28"/>
  <!-- 高鼻梁 -->
  <line x1="215" y1="165" x2="215" y2="210" stroke="#a8a39d" stroke-width="3"/>
  <!-- 饱满苹果肌 -->
  <ellipse cx="190" cy="195" rx="14" ry="11" fill="#e3c9bd" opacity="0.5"/>
  <ellipse cx="240" cy="195" rx="14" ry="11" fill="#e3c9bd" opacity="0.5"/>
  <!-- 丰唇 -->
  <ellipse cx="215" cy="230" rx="14" ry="5" fill="#b5654a" opacity="0.4"/>
  <!-- 尖下巴 -->
  <path d="M 200 270 L 215 285 L 230 270" stroke="#a8a39d" fill="#f3efe8"/>

  <!-- 标注 -->
  <line x1="190" y1="155" x2="380" y2="100" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="95" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">欧式大双眼皮</text>
  <text x="390" y="112" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">宽、深、明显</text>

  <line x1="215" y1="185" x2="380" y2="140" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="137" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">高尖鼻梁</text>
  <text x="390" y="154" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">山根高、鼻尖尖</text>

  <line x1="240" y1="195" x2="380" y2="190" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="187" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">过度饱满</text>
  <text x="390" y="204" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">苹果肌、额头</text>

  <line x1="215" y1="230" x2="380" y2="240" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="237" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">过度丰唇</text>
  <text x="390" y="254" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">嘟嘟唇感</text>

  <line x1="215" y1="280" x2="380" y2="285" stroke="#a8a39d" stroke-width="1"/>
  <text x="390" y="282" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#b5654a">尖翘下巴</text>
  <text x="390" y="299" font-family="PingFang SC,sans-serif" font-size="10" fill="#6b6864">V 字脸型</text>
</svg>