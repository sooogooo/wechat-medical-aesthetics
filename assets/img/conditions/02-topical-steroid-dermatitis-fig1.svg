<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t02f1 d02f1">
  <title id="t02f1">激素相关皮炎四种可能来源</title>
  <desc id="d02f1">激素脸重度敏感肌不是精确诊断，先厘清用药史和原发皮炎</desc>
  <defs>
    <linearGradient id="bg02f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient>
    <filter id="sh02f1" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/></filter>
    <style>
      .series{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1.3px;fill:#7A8B6F;}
      .title{font:700 25px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .kicker{font:500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#52656c;}
      .nodeTitle{font:700 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .body{font:500 12.5px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#3e5057;}
      .small{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#5c6c72;}
      .quote{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2B2A28;}
      .footer{font:500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#68787e;}
      .tag{font:700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#ffffff;}
    </style>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg02f1)"/>
  <rect x="30" y="26" width="740" height="448" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh02f1)"/>
  <text x="56" y="58" class="series">皮肤病症科普 · 02</text>
  <text x="56" y="90" class="title">脸红脱皮灼热 可能是哪一种</text>
  <text x="56" y="116" class="kicker">激素脸重度敏感肌不是精确诊断 先厘清来源</text>
  <line x1="56" y1="132" x2="744" y2="132" stroke="#dce5e5"/>
  <text x="56" y="158" class="nodeTitle">同一组症状，可能对应不同原因</text>

  <!-- 四来源卡 -->
  <rect x="56" y="174" width="335" height="88" rx="10" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4"/>
  <rect x="56" y="174" width="335" height="26" rx="10" fill="#7A8B6F"/><rect x="56" y="190" width="335" height="10" fill="#7A8B6F"/>
  <text x="72" y="192" class="tag">长期外用激素反跳</text>
  <text x="72" y="222" class="body">停药即红痒 灼热 反复</text>
  <text x="72" y="244" class="small">需追溯完整用药史 含不明复配霜</text>

  <rect x="409" y="174" width="335" height="88" rx="10" fill="#f0f5ef" stroke="#7A8B6F" stroke-width="1.4"/>
  <rect x="409" y="174" width="335" height="26" rx="10" fill="#C9A876"/><rect x="409" y="190" width="335" height="10" fill="#C9A876"/>
  <text x="425" y="192" class="tag">原发皮炎未控</text>
  <text x="425" y="222" class="body">玫瑰痤疮 脂溢性 接触性</text>
  <text x="425" y="244" class="small">本来的病没好 不是激素的锅</text>

  <rect x="56" y="278" width="335" height="88" rx="10" fill="#fff8ee" stroke="#C9A876" stroke-width="1.4"/>
  <rect x="56" y="278" width="335" height="26" rx="10" fill="#5F6E54"/><rect x="56" y="294" width="335" height="10" fill="#5F6E54"/>
  <text x="72" y="296" class="tag">屏障受损与过度护肤</text>
  <text x="72" y="326" class="body">频繁刷酸 磨砂 叠加刺激</text>
  <text x="72" y="348" class="small">减少变量比堆产品更有效</text>

  <rect x="409" y="278" width="335" height="88" rx="10" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.4"/>
  <rect x="409" y="278" width="335" height="26" rx="10" fill="#B5654A"/><rect x="409" y="294" width="335" height="10" fill="#B5654A"/>
  <text x="425" y="296" class="tag">过敏或感染并存</text>
  <text x="425" y="326" class="body">接触过敏 继发感染</text>
  <text x="425" y="348" class="small">需医生鉴别 必要时检查</text>

  <rect x="56" y="386" width="688" height="36" rx="10" fill="#eef4ee"/>
  <text x="400" y="409" class="quote" text-anchor="middle">停激素不等于一刀切，更不等于换成偏方</text>
  <text x="56" y="442" class="footer">医学教育示意 · 主动告知全部用药史含网购霜剂与代购</text>
  <text x="56" y="458" class="footer">具体诊断与减药方案需皮肤科面诊制定</text>
</svg>
