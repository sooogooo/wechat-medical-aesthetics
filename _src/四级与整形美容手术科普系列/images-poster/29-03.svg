<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title2903 desc2903">
  <title id="title2903">术后监护与围术期五个硬问题</title>
  <desc id="desc2903">术后早期需规范监护生命体征、气道、出血、疼痛、血栓；面诊时应直接问的五个硬问题</desc>
  <defs>
    <linearGradient id="bg2903" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh2903" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.4px; fill:#0072B2; }
      .title { font: 700 31px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .kicker { font: 500 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .tag { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; letter-spacing:1px; }
      .body { font: 500 15px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#17323d; }
      .footer { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="900" height="620" rx="28" fill="url(#bg2903)"/>
  <rect x="34" y="30" width="832" height="560" rx="24" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh2903)"/>

  <text x="62" y="68" class="series">四级与整形美容手术 30 讲 · 29</text>
  <text x="62" y="117" class="title">术后监护与五个硬问题</text>
  <text x="62" y="153" class="kicker">手术结束不等于安全结束——监护和应急能力同样关键</text>
  <line x1="62" y1="181" x2="838" y2="181" stroke="#dce5e5"/>

  <!-- 左：术后监护五项 -->
  <text x="62" y="216" class="nodeTitle">术后早期监护（全麻后数小时）</text>

  <rect x="62" y="232" width="390" height="280" rx="16" fill="#f8fbfb" stroke="#0072B2" stroke-width="2"/>
  <circle cx="84" cy="266" r="5" fill="#0072B2"/>
  <text x="98" y="271" class="body">生命体征监护</text>
  <circle cx="84" cy="298" r="5" fill="#D55E00"/>
  <text x="98" y="303" class="body">气道和呼吸观察（颌面颈部尤其）</text>
  <circle cx="84" cy="330" r="5" fill="#D55E00"/>
  <text x="98" y="335" class="body">出血和血肿观察</text>
  <circle cx="84" cy="362" r="5" fill="#0072B2"/>
  <text x="98" y="367" class="body">疼痛管理</text>
  <circle cx="84" cy="394" r="5" fill="#0072B2"/>
  <text x="98" y="399" class="body">早期活动预防血栓（按医嘱）</text>
  <rect x="82" y="425" width="350" height="70" rx="8" fill="#eef6f8"/>
  <text x="257" y="450" class="small" text-anchor="middle">规范监护需住院或留观数小时到数天</text>
  <text x="257" y="470" class="small" text-anchor="middle">「全麻大手术做完当天走」</text>
  <text x="257" y="486" class="small" text-anchor="middle">是危险信号</text>

  <!-- 右：五个硬问题 -->
  <text x="478" y="216" class="nodeTitle">面诊时直接问的五个硬问题</text>

  <rect x="478" y="232" width="360" height="280" rx="16" fill="#fff8ee" stroke="#E69F00" stroke-width="2"/>
  <circle cx="500" cy="266" r="5" fill="#E69F00"/>
  <text x="514" y="271" class="body">麻醉由谁实施？常驻还是外请？</text>
  <circle cx="500" cy="302" r="5" fill="#E69F00"/>
  <text x="514" y="307" class="body">手术室有什么监护抢救设备？</text>
  <circle cx="500" cy="338" r="5" fill="#E69F00"/>
  <text x="514" y="343" class="body">术前要做哪些检查评估？</text>
  <circle cx="500" cy="374" r="5" fill="#E69F00"/>
  <text x="514" y="379" class="body">术后在哪监护、监护多久？</text>
  <circle cx="500" cy="410" r="5" fill="#D55E00"/>
  <text x="514" y="415" class="body">紧急情况处理和转诊流程？</text>
  <rect x="498" y="438" width="320" height="56" rx="8" fill="#fdf3e3"/>
  <text x="658" y="461" class="small" text-anchor="middle">能正面回答并展示配置的</text>
  <text x="658" y="481" class="small" text-anchor="middle">才值得托付全麻手术</text>

  <!-- 金句 -->
  <rect x="62" y="525" width="776" height="40" rx="12" fill="#fbeae3"/>
  <text x="450" y="551" class="quote" text-anchor="middle">麻醉由「咨询师」「护士」实施，或「外请临时过来」——都是危险信号</text>

  <text x="62" y="582" class="footer">医学教育示意 · 麻醉须由具备资质的麻醉科医师在具备监护和抢救条件的机构实施</text>
</svg>
