<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t45f2 d45f2">
  <title id="t45f2">皮肤淀粉样变的管理要点</title>
  <desc id="d45f2">止痒减少摩擦保湿防晒与长期随访的管理清单</desc>
  <defs>
    <linearGradient id="bg45f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fff6eb"/>
    </linearGradient>
    <filter id="sh45f2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183642" flood-opacity="0.10"/>
    </filter>
    <style>
      .series { font: 700 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing:1.3px; fill:#7A8B6F; }
      .title { font: 700 26px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .kicker { font: 500 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#52656c; }
      .nodeTitle { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#ffffff; }
      .body { font: 500 13px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#3e5057; }
      .small { font: 500 12px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#5c6c72; }
      .quote { font: 700 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#2B2A28; }
      .footer { font: 500 11px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#68787e; }
    </style>
  </defs>
  <rect width="800" height="500" rx="22" fill="url(#bg45f2)"/>
  <rect x="28" y="24" width="744" height="452" rx="20" fill="#ffffff" opacity="0.96" stroke="#dce8e8" filter="url(#sh45f2)"/>

  <text x="52" y="56" class="series">皮肤病症科普 · 45</text>
  <text x="52" y="92" class="title">管理重点是长期控制</text>
  <text x="52" y="116" class="kicker">没有一劳永逸，止痒、减摩、随访是核心</text>
  <line x1="52" y1="134" x2="748" y2="134" stroke="#dce5e5"/>

  <!-- 四象限管理 -->
  <rect x="52" y="150" width="340" height="34" rx="8" fill="#5F6E54"/>
  <text x="222" y="172" class="nodeTitle" text-anchor="middle">第一要务 止痒</text>
  <rect x="52" y="188" width="340" height="116" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <circle cx="68" cy="214" r="3" fill="#5F6E54"/>
  <text x="80" y="218" class="body">外用止痒药（医师处方）</text>
  <circle cx="68" cy="242" r="3" fill="#5F6E54"/>
  <text x="80" y="246" class="body">必要时口服抗组胺</text>
  <circle cx="68" cy="270" r="3" fill="#5F6E54"/>
  <text x="80" y="274" class="body">局部封包促渗、湿敷</text>
  <circle cx="68" cy="296" r="3" fill="#5F6E54"/>
  <text x="80" y="300" class="small">剧痒难忍者可考虑光电</text>

  <rect x="408" y="150" width="340" height="34" rx="8" fill="#C9A876"/>
  <text x="578" y="172" class="nodeTitle" text-anchor="middle">减少摩擦</text>
  <rect x="408" y="188" width="340" height="116" rx="10" fill="#fbf5ea" stroke="#C9A876"/>
  <circle cx="424" cy="214" r="3" fill="#C9A876"/>
  <text x="436" y="218" class="body">剪短指甲，避免抓破</text>
  <circle cx="424" cy="242" r="3" fill="#C9A876"/>
  <text x="436" y="246" class="body">穿宽松柔软衣物</text>
  <circle cx="424" cy="270" r="3" fill="#C9A876"/>
  <text x="436" y="274" class="body">避免搓澡、丝瓜络摩擦</text>
  <circle cx="424" cy="296" r="3" fill="#C9A876"/>
  <text x="436" y="300" class="small">夜间可戴棉手套入睡</text>

  <rect x="52" y="314" width="340" height="34" rx="8" fill="#7A8B6F"/>
  <text x="222" y="336" class="nodeTitle" text-anchor="middle">修复屏障</text>
  <rect x="52" y="352" width="340" height="74" rx="10" fill="#f4f7f1" stroke="#7A8B6F"/>
  <circle cx="68" cy="378" r="3" fill="#5F6E54"/>
  <text x="80" y="382" class="body">温和清洁、足量保湿</text>
  <circle cx="68" cy="404" r="3" fill="#5F6E54"/>
  <text x="80" y="408" class="small">洗澡水温不过高、时间不过长</text>

  <rect x="408" y="314" width="340" height="34" rx="8" fill="#B5654A"/>
  <text x="578" y="336" class="nodeTitle" text-anchor="middle">长期随访</text>
  <rect x="408" y="352" width="340" height="74" rx="10" fill="#fbf0eb" stroke="#B5654A"/>
  <circle cx="424" cy="378" r="3" fill="#B5654A"/>
  <text x="436" y="382" class="body">定期复诊评估变化</text>
  <circle cx="424" cy="404" r="3" fill="#B5654A"/>
  <text x="436" y="408" class="small">出现新发、增大、破溃须及时面诊</text>

  <rect x="52" y="432" width="696" height="30" rx="10" fill="#eef6f8"/>
  <text x="400" y="452" class="quote" text-anchor="middle">抓得越狠，长得越厚</text>
  <text x="52" y="466" class="footer">健康科普示意 · 用药与系统评估须由皮肤科医师进行</text>
</svg>
