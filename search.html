<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全站搜索 · 医美科普</title>
  <meta name="description" content="医美科普全站搜索：皮肤病症、四级手术、美容注射、亚美学、美学三型与一路绿灯咨询师成长课程，共 175+ 页内容一站式检索。" />
  <link rel="icon" type="image/png" href="assets/logo/amc-logo.png" />
  <link rel="canonical" href="search.html" />
  <link rel="stylesheet" href="assets/css/design-tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/share.css" />
  <style>
    .sc-hero { padding: var(--sp-7) 0 var(--sp-4); text-align: center; }
    .sc-hero h1 { font-size: var(--fs-h1); margin-bottom: var(--sp-3); }
    .sc-hero p { font-size: var(--fs-small); color: var(--ink-soft); }
    .sc-box { max-width: 720px; margin: 0 auto; position: relative; }
    .sc-input {
      width: 100%; font-size: 1.05rem; padding: 14px 110px 14px 20px;
      border: 1px solid var(--line-strong); border-radius: 999px; background: var(--bg-card);
      color: var(--ink); outline: none; transition: border-color .25s;
    }
    .sc-input:focus { border-color: var(--accent); }
    .sc-count { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: var(--fs-xs); color: var(--ink-faint); pointer-events: none; }
    .sc-tips { text-align: center; margin: var(--sp-3) 0 var(--sp-5); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .sc-tips button {
      font-size: var(--fs-xs); color: var(--ink-soft); background: transparent;
      border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; cursor: pointer;
    }
    .sc-tips button:hover { color: var(--accent-deep); border-color: var(--accent); }
    .sc-group { max-width: 720px; margin: 0 auto var(--sp-5); }
    .sc-group__head { display: flex; align-items: center; gap: 8px; margin-bottom: var(--sp-2); }
    .sc-group__dot { width: 9px; height: 9px; border-radius: 50%; }
    .sc-group__name { font-size: 0.95rem; font-weight: var(--w-bold); color: var(--ink); }
    .sc-group__n { font-size: var(--fs-xs); color: var(--ink-faint); }
    .sc-item { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; text-decoration: none; transition: border-color .2s; }
    .sc-item:hover { border-color: var(--accent); }
    .sc-item b { display: block; font-size: var(--fs-small); color: var(--ink); line-height: 1.5; margin-bottom: 3px; }
    .sc-item span { font-size: var(--fs-xs); color: var(--ink-soft); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sc-item mark { background: var(--accent-soft); color: var(--accent-deep); padding: 0 2px; border-radius: 3px; }
    .sc-empty { text-align: center; color: var(--ink-faint); font-size: var(--fs-small); padding: var(--sp-7) 0; }
    .sc-loading { text-align: center; color: var(--ink-faint); font-size: var(--fs-small); padding: var(--sp-5) 0; }
  </style>
</head>
<body id="top">
  <header class="site-header" id="siteHeader">
    <div class="site-header__inner">
      <a href="index.html" class="brand" aria-label="返回医美科普首页">
        <img class="brand__logo" src="assets/logo/amc-logo.png" alt="重庆西区医院整形外科医疗美容中心" />
        <span class="brand__name"><b>医美科普</b> <span>全站搜索</span></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html">首页</a>
        <a href="consultant/">一路绿灯</a>
        <a href="skin/">皮肤病症</a>
        <a href="surgery/">四级手术</a>
        <a href="injection/">美容注射</a>
        <a href="aesthetics/">亚美学</a>
        <a href="types/">美学三型</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false"><span></span></button>
    </div>
  </header>

  <main class="container" style="padding-bottom:var(--sp-9)">
    <section class="sc-hero">
      <h1>全站搜索</h1>
      <p>六大内容区 · 175+ 页 · 输入关键词回车，如"玻尿酸""痘坑""红绿灯"</p>
      <div class="sc-box">
        <input class="sc-input" id="q" type="search" placeholder="搜索病症 / 项目 / 课程…" autocomplete="off" aria-label="搜索全站" />
        <span class="sc-count" id="count"></span>
      </div>
      <div class="sc-tips" id="tips">
        <button type="button">痤疮</button><button type="button">黄褐斑</button><button type="button">玻尿酸</button>
        <button type="button">肉毒</button><button type="button">四级手术</button><button type="button">面诊</button>
        <button type="button">红绿灯</button><button type="button">合规</button>
      </div>
    </section>
    <div id="results"><p class="sc-loading">正在加载索引…</p></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="brand__name"><b>医美科普</b> <span>· 全站搜索</span></p>
      <div class="site-footer__bottom" style="border-top:1px solid var(--line);margin-top:var(--sp-3);padding-top:var(--sp-4);font-size:var(--fs-xs);color:var(--ink-faint);text-align:center;">
        © 2026 · <a href="disclaimer.html">实验内容声明</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/share.js" defer></script>
  <script>
  (function () {
    "use strict";
    var SOURCES = [
      { key: "consultant", json: "assets/data/consultant.json", dir: "consultant/", name: "一路绿灯 · 咨询师成长站", color: "#7a8b6f", pick: function (d) { return (d.lessons || []).map(function (l) { return { slug: l.slug, title: "第 " + String(l.no).padStart(2, "0") + " 课 · " + l.title, summary: l.tagline, keywords: [l.duration, l.prereq, "阶段" + l.stage] }; }); } },
      { key: "skin", json: "assets/data/conditions.json", dir: "skin/", name: "皮肤常见病症科普", color: "#7a8b6f", pick: function (d) { return d.map(function (a) { return { slug: a.slug, title: a.title, summary: a.summary, keywords: a.keywords || [] }; }); } },
      { key: "surgery", json: "assets/data/surgery.json", dir: "surgery/", name: "四级与整形美容手术", color: "#b5654a", pick: function (d) { return d.map(function (a) { return { slug: a.slug, title: a.title, summary: a.summary, keywords: a.keywords || [] }; }); } },
      { key: "injection", json: "assets/data/injection.json", dir: "injection/", name: "美容注射的艺术", color: "#c9a876", pick: function (d) { return d.map(function (a) { return { slug: a.slug, title: a.title, summary: a.summary, keywords: a.keywords || [] }; }); } },
      { key: "aesthetics", json: "assets/data/aesthetics.json", dir: "aesthetics/", name: "医美亚美学", color: "#7d8ba3", pick: function (d) { return d.map(function (a) { return { slug: a.slug, title: a.title, summary: a.summary, keywords: a.keywords || [] }; }); } },
      { key: "types", json: "assets/data/types.json", dir: "types/", name: "医美美学三型", color: "#8a8578", pick: function (d) { return d.map(function (a) { return { slug: a.slug, title: a.title, summary: a.summary, keywords: a.keywords || [] }; }); } }
    ];
    var INDEX = [];
    Promise.all(SOURCES.map(function (src) {
      return fetch(src.json).then(function (r) { return r.json(); }).then(function (d) {
        return { src: src, items: src.pick(d) };
      });
    })).then(function (groups) {
      INDEX = groups;
      document.getElementById("results").innerHTML = groups.map(renderGroup).join("") ||
        '<p class="sc-empty">索引为空</p>';
      document.getElementById("count").textContent = totalOf(groups) + " 页";
    }).catch(function () {
      document.getElementById("results").innerHTML = '<p class="sc-empty">索引加载失败，请刷新重试（本地 file:// 协议不支持 fetch，请通过 http 访问）。</p>';
    });

    function totalOf(groups) { var n = 0; groups.forEach(function (g) { n += g.items.length; }); return n; }
    function bigrams(s) {
      s = String(s || "").toLowerCase().replace(/\s+/g, "");
      var out = [];
      if (s.length <= 1) return s.length ? [s] : [];
      for (var i = 0; i < s.length - 1; i++) out.push(s.substr(i, 2));
      return out;
    }
    function hitScore(text, tokens) {
      if (!tokens.length) return 1;
      var s = String(text || "").toLowerCase(), sc = 0;
      tokens.forEach(function (t) { if (s.indexOf(t) >= 0) sc++; });
      return sc;
    }
    function escH(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
    function renderGroup(g, limit) {
      var items = g.items.slice(0, limit || 8);
      return '<section class="sc-group"><div class="sc-group__head">' +
        '<span class="sc-group__dot" style="background:' + g.src.color + '"></span>' +
        '<span class="sc-group__name">' + escH(g.src.name) + '</span>' +
        '<span class="sc-group__n">' + g.items.length + ' 条' + (g.items.length > items.length ? "，显示前 " + items.length : "") + '</span></div>' +
        items.map(function (a) {
          return '<a class="sc-item" href="' + g.src.dir + a.slug + '.html"><b>' + escH(a.title) + '</b><span>' + escH(a.summary) + '</span></a>';
        }).join("") + "</section>";
    }
    function search(q) {
      var tokens = bigrams(q);
      var out = INDEX.map(function (g) {
        var hits = g.items.map(function (a) {
          var sc = hitScore(a.title, tokens) * 3 + hitScore((a.keywords || []).join(" "), tokens) * 2 + hitScore(a.summary, tokens);
          return { a: a, sc: sc };
        }).filter(function (x) { return x.sc > 0; }).sort(function (x, y) { return y.sc - x.sc; }).slice(0, 6)
          .map(function (x) { return x.a; });
        return { src: g.src, items: hits };
      }).filter(function (g) { return g.items.length; });
      return out;
    }
    var qEl = document.getElementById("q"), rEl = document.getElementById("results"), cEl = document.getElementById("count");
    function run() {
      var q = qEl.value.trim();
      if (!q) {
        rEl.innerHTML = INDEX.map(function (g) { return renderGroup(g, 5); }).join("");
        cEl.textContent = totalOf(INDEX) + " 页";
        return;
      }
      var res = search(q);
      cEl.textContent = res.length ? totalOf(res) + " 条结果" : "0 条";
      rEl.innerHTML = res.length ? res.map(function (g) { return renderGroup(g, 0); }).join("") :
        '<p class="sc-empty">没有找到" + "‘" + escH(q) + "’，换个关键词试试</p>';
    }
    qEl.addEventListener("input", function () { clearTimeout(run._t); run._t = setTimeout(run, 160); });
    document.getElementById("tips").addEventListener("click", function (e) {
      if (e.target.tagName === "BUTTON") { qEl.value = e.target.textContent; run(); qEl.focus(); }
    });
    addEventListener("keydown", function (e) {
      if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
    });
  })();
  </script>
</body>
</html>
