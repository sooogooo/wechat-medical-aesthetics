<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" aria-labelledby="t18f1 d18f1" role="img" viewBox="0 0 800 500"><title id="t18f1">结节性痒疹痒抓顽固循环</title><desc id="t18f1">四肢多个坚硬剧痒结节，需组合控制炎症神经瘙痒抓挠和伴随疾病</desc><defs><linearGradient id="bg18f1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f7f8"/><stop offset="1" stop-color="#fff6eb"/></linearGradient><filter id="sh18f1" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#183642" flood-opacity=".1" stdDeviation="7"/></filter><style>.series{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;letter-spacing:1.3px;fill:#7a8b6f}.title{font:700 25px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.kicker{font:500 14px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#52656c}.nodeTitle{font:700 15px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.body{font:500 12.5px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#3e5057}.small{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#5c6c72}.quote{font:700 16px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#2b2a28}.footer{font:500 11px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#68787e}.tag{font:700 13px &apos;Microsoft YaHei&apos;,&apos;Noto Sans CJK SC&apos;,sans-serif;fill:#fff}</style></defs><rect width="800" height="500" fill="url(#bg18f1)" rx="24"/><rect width="740" height="448" x="30" y="26" fill="#fff" stroke="#dce8e8" filter="url(#sh18f1)" opacity=".96" rx="20"/><text x="56" y="58" class="series">皮肤病症科普 · 18</text><text x="56" y="90" class="title">结节性痒疹 痒与抓的顽固循环</text><text x="56" y="116" class="kicker">四肢反复长坚硬剧痒结节，治疗往往需要组合拳</text><line x1="56" x2="744" y1="132" y2="132" stroke="#dce5e5"/><text x="56" y="158" class="nodeTitle">需同时处理的四个目标</text><rect width="335" height="92" x="56" y="174" fill="#fdf1ee" stroke="#B5654A" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="174" fill="#B5654A" rx="12"/><rect width="335" height="10" x="56" y="192" fill="#B5654A"/><text x="72" y="193" class="tag">控制皮肤炎症</text><text x="72" y="224" class="body">外用或皮损内注射</text><text x="72" y="248" class="small">减轻结节炎症反应</text><rect width="335" height="92" x="409" y="174" fill="#fff8ee" stroke="#C9A876" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="174" fill="#C9A876" rx="12"/><rect width="335" height="10" x="409" y="192" fill="#C9A876"/><text x="425" y="193" class="tag">调节神经瘙痒</text><text x="425" y="224" class="body">口服神经调节药物</text><text x="425" y="248" class="small">降低瘙痒信号敏感性</text><rect width="335" height="92" x="56" y="278" fill="#f3efe6" stroke="#8a6a3a" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="56" y="278" fill="#8a6a3a" rx="12"/><rect width="335" height="10" x="56" y="296" fill="#8a6a3a"/><text x="72" y="297" class="tag">阻断抓挠行为</text><text x="72" y="328" class="body">物理隔断和行为替代</text><text x="72" y="352" class="small">减少二次伤害</text><rect width="335" height="92" x="409" y="278" fill="#f8fbfb" stroke="#5F6E54" stroke-width="1.6" rx="12"/><rect width="335" height="28" x="409" y="278" fill="#5F6E54" rx="12"/><rect width="335" height="10" x="409" y="296" fill="#5F6E54"/><text x="425" y="297" class="tag">评估伴随疾病</text><text x="425" y="328" class="body">肝肾甲状腺过敏等</text><text x="425" y="352" class="small">潜在病因需排查</text><rect width="688" height="44" x="56" y="388" fill="#f8fbfb" stroke="#7A8B6F" stroke-width="1.4" rx="10"/><text x="400" y="408" class="body" font-weight="700" text-anchor="middle">为什么要认真做鉴别和检查</text><text x="400" y="424" class="small" text-anchor="middle">虫咬 结节性痒疹 疥疮 淋巴瘤等可表现相似 需医生鉴别</text><rect width="688" height="22" x="56" y="442" fill="#eef4ee" rx="8"/><text x="400" y="457" class="quote" font-size="14" text-anchor="middle">既要治皮肤，也要把睡眠救回来</text><text x="56" y="474" class="footer">医学教育示意 · 就诊时别只说痒得厉害，记录部位频率睡眠影响</text></svg>